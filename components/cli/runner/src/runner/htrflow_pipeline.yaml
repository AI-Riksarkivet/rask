# HTRflow pipeline used by HTRFlowDeployment (Ray Serve wrapper).
#
# Notes:
#   - No `Export` step. The wrapping deployment calls
#     `get_serializer("alto").serialize(doc)` directly so we get the ALTO
#     string back in memory instead of writing to a directory.
#   - Segmentation runs twice: first the region YOLO, then the line YOLO
#     constrained to those regions. This matches HTRflow's recommended
#     handwritten-text pipeline.
#   - TrOCR model is the v3 Swedish historical handwritten subword variant
#     (trocr-base-...-3). Its processor emits 192x1024 line crops while the ViT
#     grid is 384x384, so generate() needs `interpolate_pos_encoding: True` or it
#     raises ValueError -> htrflow's unguarded worker thread dies -> the page
#     hangs 600s. (Root cause of "base-3 hangs", verified 2026-06-18.)
#   - No `device:` lines: htrflow auto-detects CUDA. Each replica is pinned
#     to one GPU via `ray_actor_options={"num_gpus": 1}` in the deployment.

steps:
  - step: Segmentation
    settings:
      model: yolo
      model_settings:
        model: Riksarkivet/yolov9-regions-1

  - step: Segmentation
    settings:
      model: yolo
      model_settings:
        model: Riksarkivet/yolov9-lines-within-regions-1

  - step: TextRecognition
    settings:
      model: trocr
      model_settings:
        # swe-2 (public) while swe-3 is gated (private repo -> 401 without an HF token).
        # swe-3 is the better subword model; switch back via secrets.hfToken when a
        # token with access is available. NB: swe-2 is character-level, not subword,
        # so the base-3-specific generation tuning below does NOT apply here.
        model: Riksarkivet/trocr-base-handwritten-hist-swe-2
      generation_settings:
        batch_size: 8
        # swe-2's processor emits native 384x384 crops matching the ViT position grid,
        # so no position-encoding interpolation is needed (unlike base-3's 192x1024).
        # Safety cap on decode length; swe-2 terminates on eos=2.
        max_new_tokens: 128
        use_cache: True
        eos_token_id: 2

  - step: OrderLines
