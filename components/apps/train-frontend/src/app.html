<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>RASK</title>
		<script>
			if (location.pathname === '/index.html') history.replaceState(null, '', '/');
		</script>
		<script>
			// No-flash theme — runs BEFORE first paint. Each cross-zone microfrontend nav is
			// a full document load; without this the fresh doc paints light (the :root tokens)
			// then mode-watcher flips it to dark → a flash on every nav. Mirror mode-watcher's
			// setInitialMode (key 'mode-watcher-mode', defaultMode 'dark') so first paint is
			// already correct. Belt-and-suspenders with mode-watcher's own injected script.
			(() => {
				try {
					const mode = localStorage.getItem('mode-watcher-mode') ?? 'dark';
					const light =
						mode === 'light' ||
						(mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
					document.documentElement.classList.toggle('dark', !light);
					document.documentElement.style.colorScheme = light ? 'light' : 'dark';
				} catch (_) {
					/* localStorage/matchMedia unavailable — fall through to mode-watcher */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
