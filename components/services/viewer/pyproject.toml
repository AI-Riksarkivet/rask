[project]
name = "viewer"
version = "0.1.0"
description = "FastAPI backend for the viewer — proxies images/ALTO from object storage."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "storage",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pylance>=0.20",
]

[project.scripts]
viewer = "viewer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewer"]

[tool.uv.sources]
storage = { workspace = true }
