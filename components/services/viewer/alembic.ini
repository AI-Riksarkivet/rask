# Alembic for the viewer service.
#
# env.py reads the URL from DATABASE_URL / RASK_BATCHES_DB at runtime — the
# sqlalchemy.url here is a placeholder so the CLI doesn't complain about a
# missing key when no env is set.
#
# Run from this directory:
#   uv run --package viewer alembic upgrade head
#   uv run --package viewer alembic revision --autogenerate -m "..."

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///.cache/batches.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
