[project]
name = "core-api"
version = "0.1.0"
description = "core-api backend — batches/chunks/catalog over the core brick."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "service-kit",
    "core",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]

[tool.uv.sources]
service-kit = { workspace = true }
core = { workspace = true }
