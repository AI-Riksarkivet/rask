[project]
name = "backends"
version = "0.1.0"
description = "Local microservice compositions over the viewer — gateway + per-domain backends."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "viewer",
    "storage",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backends"]

[tool.uv.sources]
viewer = { workspace = true }
storage = { workspace = true }
