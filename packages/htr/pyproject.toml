[project]
name = "htr"
version = "0.1.0"
description = "HTR actors (layout, lines, TrOCR, ALTO) for use with Ray Data."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "storage",
    "pillow>=12.3.0",
    "numpy>=2.0",
    "torch==2.12.0",
    "transformers>=5.6.1",
    "ultralytics>=8.4.41",
    "huggingface-hub>=0.28",
    "jinja2>=3.1",
    "accelerate>=1.13.0",
    "opencv-python>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htr"]

[tool.uv.sources]
storage = { workspace = true }
