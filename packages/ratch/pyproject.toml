[project]
name = "ratch"
version = "0.1.0"
description = "Media pipeline library — Lance ingestion, Ray-distributed feature stages, and retrieval over the chunks table."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # The lineage seam (ratch/lineage.py) re-exports the kernel primitives from
    # `service_kit.lancekit.openlineage` — the lancekit extra carries that subtree's deps.
    "service-kit[lancekit]",
    # Lance/Arrow core — `import lance`, `pyarrow`/`pyarrow.fs`, `lancedb{,.index,.rerankers}`.
    "pylance>=10.0.0",
    "pyarrow",
    "lancedb>=0.34.0",
    # The distributed plane. lance_ray is a TOP-LEVEL import in core/driver.py; ray itself is
    # imported lazily but from BOTH extras: `ray.data` (core/driver.py) and
    # `ray.job_submission.JobSubmissionClient` (core/jobs.py). Per ray-kit's finding, plain `ray`
    # raises "requires the ray[default] installation" when that client is constructed.
    "lance-ray",
    # `serve` is a PLATFORM requirement of the head image, not a workload's. Whenever a RayService
    # declares serveApplications, the KubeRay operator polls the HEAD's dashboard for their status —
    # and without ray[serve] that endpoint answers 501, which stalls a zero-downtime upgrade forever.
    # Measured 2026-08-25 on the live estate: the operator had been erroring every ~17 minutes since
    # 2026-08-23 with
    #     GetServeDetails fail: 501 Not Implemented Serve dependencies are not installed.
    #     Please run `pip install "ray[serve]"`
    # so the pending cluster could never be confirmed healthy, the switch never happened, and TWO
    # ready RayClusters sat side by side burning a node's worth of resources
    # (status: BothActivePendingClustersExist).
    #
    # The workload's own image already carries it (`runners/htr` declares ray[data,default,serve]),
    # which is exactly why this was easy to miss: the SERVING half was fine and the OBSERVING half —
    # the head's dashboard, which belongs to the platform — was not.
    "ray[data,default,serve]>=2.58",
    # The `ratch` CLI (cli/_app.py + the seven command modules).
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "numpy",
    "httpx>=0.27",
    "tqdm",
    # clients/image.py decodes/encodes frames with `from PIL import Image`.
    "pillow>=12.3.0",
]

# The Atlas projection (features/projection.py, modalities/av/cluster.py) imports EVōC behind a
# try/ImportError whose message names this exact extra:
#   "The Atlas projection needs the `atlas` extra (EVōC). Install with `uv sync --extra atlas`".
# scikit-learn rides along — `sklearn.utils.check_random_state` is only reached on that same path.
[project.optional-dependencies]
atlas = [
    "evoc",
    "scikit-learn",
]

[project.scripts]
ratch = "ratch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratch"]

[tool.uv.sources]
service-kit = { workspace = true }
