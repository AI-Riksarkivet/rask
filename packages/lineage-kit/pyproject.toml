[project]
name = "lineage-kit"
version = "0.1.0"
description = "The one compute-lineage layer (R21): pydantic OpenLineage emission shapes + job→stage→actor run seams for Ray Data pipelines, Ray actors, and Ray Serve deployments."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    # The official client is the transport + the spec authority the tests round-trip against.
    # Deliberately LIGHT (attrs/httpx/requests/pyyaml/dateutil) — this package must be importable
    # by every plane, including the sealed runners, so no ray/lance/fastapi may ride along.
    "openlineage-python>=1.52.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_kit"]
