[project]
name = "lance-common"
version = "0.1.0"
description = "Shared platform library for the lance services — OIDC/FGA authz, problem-detail handlers, middleware, config, outbox and the lancekit reader/writer layer."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "aiohttp",
    "pyjwt[crypto]>=2.8",
    "openfga-sdk>=0.9",
    "tenacity>=9.1.4",
    "pyarrow",
    "pylance[otel]>=9.0.0",
    "lancedb>=0.34.0",
    "lance-namespace>=0.9.0",
    "lance-namespace-urllib3-client>=0.9.0",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-logging>=0.64b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
