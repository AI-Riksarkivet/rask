[project]
name = "control"
version = "0.1.0"
description = "Operational logic shared by viewer, orchestrator, and ops scripts — sync, chunk submission. No entry points."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "storage",
    "pydantic>=2.7",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control"]

[tool.uv.sources]
storage = { workspace = true }
