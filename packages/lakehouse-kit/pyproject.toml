[project]
name = "lakehouse-kit"
version = "0.1.0"
description = "The lakehouse's kernel: the storage internals, the lance-plane app factory, the control lane and the events catalog, lineage and maintenance run on. No client imports it."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "service-kit[governed]",
    # The S3 client, STS and URI seam (`lakehouse_kit.storage`).
    "boto3>=1.35",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "dapr>=1.18.1",
    "opentelemetry-sdk>=1.44.0",
]

# The data plane carries the heavy deps as one extra. Without it a consumer imports only the event vocabularies and the
# bus seams (`control_events`, `openlineage`, `subjects`, `signature_doors`, `dapr_publish`), so it pulls no Arrow or
# Lance; with it every module here imports.
[project.optional-dependencies]
data = [
    "service-kit[governed,arrow]",
    "pyarrow",
    # Every Lance reader and writer moves together: pylance 8 could not read a 9-written blob-v2
    # dataset. 11 does read a 12-written (file format 2.2) one, measured 2026-09-25;
    # 12 and 13 read and write each other's 2.2 stable-row-id tables, measured 2026-10-12.
    "pylance[otel]>=13.0.0",
    # pylance 13.0.0 itself requires lance-namespace >=0.11.1,<0.12 (its PyPI requires_dist), and 0.12
    # rejects the bare-string `MergeInsertIntoTableRequest.on` that 0.11 sends
    # (`lance_docs/ns_catalog/spec.yaml:3063`). [[LH-022]] 0.13 moves with the first pylance that allows it (ADR 0157).
    "lance-namespace>=0.11.0,<0.12",
    "lance-namespace-urllib3-client>=0.11.0,<0.12",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_kit"]

[tool.uv.sources]
service-kit = { workspace = true }
