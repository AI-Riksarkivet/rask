[project]
name = "lakehouse"
version = "0.1.0"
description = "The lakehouse's library: everything the catalog, lineage and maintenance run on. The storage internals, the auth plane, the control lane and the events, the OpenLineage emission and its signing, and the app factory the three services boot from."
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    # The bus client (`lakehouse.events.bus`); `nkeys` signs the server's nonce with the user's seed.
    "nats-py[nkeys]>=2.16",
    # The auth plane (`lakehouse.governed`): the OpenFGA client and its async transport, token verification, the
    # bounded retries and the HTTP client the doors' callers send with.
    "openfga-sdk>=0.10.4",
    "pyjwt[crypto]>=2.15.1",
    "aiohttp>=3.14.4",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    # The S3 client, STS and URI seam (`lakehouse.storage`), which also calls `urllib3` itself for an endpoint whose
    # certificate it does not verify.
    "boto3>=1.35",
    # Floored at the versions the lock carries, so a re-resolution cannot land an older HTTP stack or trust store.
    "urllib3>=2.8.0",
    "certifi>=2026.10.23",
    "pyarrow",
    # Every Lance reader and writer moves together: pylance 8 could not read a 9-written blob-v2
    # dataset. 11 does read a 12-written (file format 2.2) one, measured 2026-09-25;
    # 12 and 13 read and write each other's 2.2 stable-row-id tables, measured 2026-10-12.
    "pylance[otel]>=14.0.3",
    # pylance 14.0.3 itself requires lance-namespace >=0.13.0,<0.14 (its PyPI requires_dist), the spec
    # `lance_docs/ns_catalog/spec.yaml` describes: `MergeInsertIntoTableRequest.on` a list, and the query's
    # `minimum_nprobes`/`maximum_nprobes` (ADR 0157).
    "lance-namespace>=0.13.0,<0.14",
    "lance-namespace-urllib3-client>=0.13.0,<0.14",
    # Ed25519 for `lakehouse.events.signing` ([[LH-064]]).
    "cryptography>=49",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    # The instrumentation every lakehouse service gets. The chart launches each one under `opentelemetry-instrument`
    # when telemetry is on, which loads every instrumentor INSTALLED, so this list is that instrumentation: declared
    # here, in the library all three services install, so none of them can ship without it.
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    # The session the OTLP/HTTP exporters send with (`lakehouse.governed.otlp_identity`), which presents the pod's own token.
    "requests>=2.32",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "opentelemetry-instrumentation-urllib3>=0.65b0",
    "starlette>=1.3",
    # The limiter FastAPI runs its doors' blocking calls under, whose use `lakehouse.service_app.thread_pool` exports.
    "anyio>=4.14.2",
]

[project.entry-points.opentelemetry_otlp_credential_provider]
# Named by the chart's `OTEL_PYTHON_EXPORTER_OTLP_HTTP_CREDENTIAL_PROVIDER`: every OTLP export carries the pod's own token.
rask_service_account = "lakehouse.governed.otlp_identity:session"

[dependency-groups]
dev = [
    "boto3-stubs[s3,sts]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]
