[project]
name = "storage"
version = "0.1.0"
description = "Filesystem and S3 (MinIO/rustfs/AWS) source/sink helpers used by runner and core."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]
