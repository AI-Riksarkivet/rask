[project]
name = "storage"
version = "0.1.0"
description = "Filesystem and S3 (MinIO/rustfs/AWS) source/sink helpers used by runner and core."
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]
