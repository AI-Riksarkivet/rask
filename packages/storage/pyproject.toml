[project]
name = "storage"
version = "0.1.0"
description = "Filesystem and S3/HCP source/sink helpers used by runner and viewer."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]
