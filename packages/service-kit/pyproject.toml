[project]
name = "service-kit"
version = "0.1.0"
description = "Shared FastAPI app factory for rask backend services (lifespan, config, logging, middleware)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "storage",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "dapr>=1.18.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-grpc>=0.65b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "opentelemetry-instrumentation-urllib3>=0.65b0",
]

# The governed/lakehouse/lancekit subpackages carry their heavy deps as extras: a consumer that doesn't install the
# extra never imports the subpackage, so the base library stays dependency-light.
[project.optional-dependencies]
governed = [
    "openfga-sdk>=0.10.4",
    "pyjwt[crypto]>=2.8",
    "aiohttp",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    "lance-namespace>=0.11.0,<0.12",
]
lakehouse = ["pyarrow", "lance-namespace>=0.11.0,<0.12"]
lancekit = [
    "pyarrow",
    # Every Lance reader and writer moves together: pylance 8 could not read a 9-written blob-v2
    # dataset (packages/ray-cluster-env). 11 does read a 12-written (file format 2.2) one, measured 2026-09-25;
    # 12 and 13 read and write each other's 2.2 stable-row-id tables, measured 2026-10-12.
    "pylance[otel]>=13.0.0",
    # pylance 13.0.0 itself requires lance-namespace >=0.11.1,<0.12 (its PyPI requires_dist), and 0.12
    # rejects the bare-string `MergeInsertIntoTableRequest.on` that 0.11 sends
    # (`lance_docs/ns_catalog/spec.yaml:3063`). [[LH-022]] 0.13 moves with the first pylance that allows it (ADR 0157).
    "lance-namespace>=0.11.0,<0.12",
    "lance-namespace-urllib3-client>=0.11.0,<0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_kit"]

[tool.uv.sources]
storage = { workspace = true }
