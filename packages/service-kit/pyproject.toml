[project]
name = "service-kit"
version = "0.1.0"
description = "The rask platform a lakehouse client may pin: the FastAPI app factory, config, exceptions, middleware, health and probes, telemetry, the auth plane and the naming grammar."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "dapr>=1.18.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-grpc>=0.65b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "opentelemetry-instrumentation-urllib3>=0.65b0",
]

# The auth plane and the two guards carry their heavy deps as extras: a consumer that doesn't install an extra never
# imports what needs it, so the base library stays dependency-light.
[project.optional-dependencies]
# `service_kit.governed` and `service_kit.ns_errors`, the problem mapping of the Lance Namespace errors the auth plane
# raises.
governed = [
    "openfga-sdk>=0.10.4",
    "pyjwt[crypto]>=2.8",
    "aiohttp",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    "lance-namespace>=0.11.0,<0.12",
]
# The input and credential guards: `service_kit.arrow_ipc`, the one validating decoder of an Arrow body, and
# `service_kit.storage_options`, the S3 filesystem a store credential builds. That credential is the auth plane's
# `S3KeyPair`, so the guards carry `[governed]` as well.
arrow = ["service-kit[governed]", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_kit"]
