[project]
name = "service-kit"
version = "0.1.0"
description = "Shared FastAPI app factory for rask backend services (lifespan, config, logging, middleware)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "storage",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "dapr>=1.18.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

# The governed/lakehouse/lancekit subpackages ported from packages/common (gate 3, R19) carry their
# heavy deps as extras: a consumer that doesn't install the extra never imports the subpackage, so the
# base library stays dependency-light and rask's existing consumers resolve unchanged.
[project.optional-dependencies]
governed = [
    "openfga-sdk>=0.9",
    "pyjwt[crypto]>=2.8",
    "aiohttp",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    "lance-namespace>=0.11.0",
]
lakehouse = ["pyarrow", "lance-namespace>=0.11.0"]
lancekit = [
    "pyarrow",
    "pylance[otel]>=10.0.0",
    "lancedb>=0.34.0",
    "lance-namespace>=0.11.0",
    "lance-namespace-urllib3-client>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_kit"]

[tool.uv.sources]
storage = { workspace = true }
