[project]
name = "service-kit"
version = "0.1.0"
description = "The rask platform a lakehouse client may pin: exceptions, the request-id middleware, probes, logging, the auth plane, the naming grammar and the contract the lakehouse's events publish."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "dapr>=1.18.1",
    # `service_kit.problem` names a problem's occurrence by the active span's trace id: the API only. The SDK, the
    # exporter and the instrumentors are the process's, installed by whoever runs it (the lakehouse: `lakehouse-kit`).
    "opentelemetry-api>=1.44.0",
]

# The auth plane and the two guards carry their heavy deps as extras: a consumer that doesn't install an extra never
# imports what needs it, so the base library stays dependency-light.
[project.optional-dependencies]
# `service_kit.governed` and `service_kit.ns_errors`, the problem mapping of the Lance Namespace errors the auth plane
# raises.
governed = [
    "openfga-sdk>=0.10.4",
    "pyjwt[crypto]>=2.15.1",
    # The OpenFGA SDK's async transport, floored as `urllib3` below is.
    "aiohttp>=3.14.4",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    "lance-namespace>=0.11.0,<0.12",
    # Transitive (`httpx`, `openfga-sdk` and lance-namespace's `urllib3` client), floored at the versions this
    # repository's lock carries, so a client that resolves this package into a lock of its own lands no older HTTP stack
    # or trust store.
    "urllib3>=2.8.0",
    "certifi>=2026.10.23",
]
# The input and credential guards: `service_kit.arrow_ipc`, the one validating decoder of an Arrow body, and
# `service_kit.storage_options`, the S3 filesystem a store credential builds. That credential is the auth plane's
# `S3KeyPair`, so the guards carry `[governed]` as well.
arrow = ["service-kit[governed]", "pyarrow"]

# The platform's test seam ([[XC-190]]): pytest loads `service_kit.pytest_plugin` in any environment that installs this
# package, so a client's suite gets the fixtures that keep it hermetic against the platform's process-global state with
# the version it pins, and copies none of this repository's conftest.
[project.entry-points.pytest11]
service_kit = "service_kit.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_kit"]
