[project]
name = "service-kit"
version = "0.1.0"
description = "Shared FastAPI app factory for rask backend services (lifespan, config, logging, middleware)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "storage",
    # BASE, not an extra, because `service_kit/__init__.py` imports it UNCONDITIONALLY:
    # `from service_kit.lakehouse.ns_errors import install_problem_handlers`, and `ns_errors` does a
    # module-level `from lance_namespace import ...` (not under TYPE_CHECKING). It was declared only
    # behind the `[governed]` and `[lakehouse]` extras, so `import service_kit` was broken for any
    # consumer that took this library bare.
    #
    # SIX deployables declare bare `service-kit` (flows, ingest, compute, gateway, controlplane,
    # notifications) and five of them resolve `lance-namespace` TRANSITIVELY, by luck, through some
    # other dependency. The gateway does not — so its image would not build at all:
    #
    #   import gate FAILED — 1/1 modules could not be IMPORTED:
    #     gateway: ModuleNotFoundError: No module named 'lance_namespace'
    #
    # The other five were one dependency bump from the same break. The extras keep everything else
    # they carry; only this one moves, because only this one is required to `import service_kit`.
    #
    # This library IS meant to stay dependency-light, and that intent is not served by a declaration
    # that lies — a truly optional lakehouse layer needs the `__init__` import made lazy, which is a
    # design change rather than a packaging one. Declaring what the code already requires is the fix
    # for the build being broken; making it genuinely optional is a separate decision.
    "lance-namespace>=0.11.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "dapr>=1.18.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-grpc>=0.65b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "opentelemetry-instrumentation-urllib3>=0.65b0",
]

# The governed/lakehouse/lancekit subpackages ported from packages/common (gate 3, R19) carry their
# heavy deps as extras: a consumer that doesn't install the extra never imports the subpackage, so the
# base library stays dependency-light and rask's existing consumers resolve unchanged.
[project.optional-dependencies]
# Rate limiting is its OWN extra, not part of `governed`: metering a route and authorizing it are
# different concerns, and a service that wants a limiter should not have to pull the OIDC/FGA stack
# to get one. `search` takes this without `governed` for exactly that reason.
ratelimit = [
    "slowapi>=0.1.10",
]
governed = [
    "openfga-sdk>=0.9",
    "pyjwt[crypto]>=2.8",
    "aiohttp",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    "lance-namespace>=0.11.0",
]
lakehouse = ["pyarrow", "lance-namespace>=0.11.0"]
# The image derivers (B14). An OPTIONAL extra because this library is dependency-light on purpose —
# a consumer that wants the settings helpers should not install an image codec. Both the medallion
# service and the baked Ray stage job take it, which is what lets them share ONE implementation
# instead of a drift-pinned copy each.
media = ["pillow>=10"]
lancekit = [
    "pyarrow",
    "pylance[otel]>=10.0.0",
    "lancedb>=0.34.0",
    "lance-namespace>=0.11.0",
    "lance-namespace-urllib3-client>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_kit"]

[tool.uv.sources]
storage = { workspace = true }
