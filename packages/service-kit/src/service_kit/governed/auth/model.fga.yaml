# OpenFGA model tests for the Lance catalog authorization model (Lakekeeper-style multi-tenant ReBAC).
#
# The model is READ FROM `model.fga` — it is not copied here. It used to be, and that third copy was a
# standing lie: CI diffs `model.fga` against `model.json` but never against this file, so the inlined
# block drifted (a stale comment, and then a whole missing `condition`) while every test still passed —
# against the stale copy. `model_file:` removes the copy rather than adding a fourth gate to police it.
#
# Regenerate the JSON the catalog loads, then run these tests:
#   .localbin/fga model transform --file packages/service-kit/src/service_kit/governed/auth/model.fga > packages/service-kit/src/service_kit/governed/auth/model.json
#   .localbin/fga model test --tests packages/service-kit/src/service_kit/governed/auth/model.fga.yaml
#
model_file: ./model.fga

tuples:
  # teams + members
  - { user: user:alice, relation: member, object: team:eng }
  - { user: user:bob, relation: member, object: team:eng }
  - { user: user:frank, relation: member, object: team:partners }
  # team:eng owns TWO projects; team:partners owns one
  - { user: team:eng, relation: team, object: project:acme }
  - { user: team:eng, relation: team, object: project:research }
  - { user: team:partners, relation: team, object: project:beta }
  # one warehouse (bucket) per project
  - { user: project:acme, relation: project, object: warehouse:acme_bucket }
  - { user: project:research, relation: project, object: warehouse:research_bucket }
  - { user: project:beta, relation: project, object: warehouse:beta_bucket }
  # medallion stages under the acme bucket
  - { user: warehouse:acme_bucket, relation: parent, object: namespace:acme_bronze }
  - { user: warehouse:acme_bucket, relation: parent, object: namespace:acme_silver }
  - { user: warehouse:acme_bucket, relation: parent, object: namespace:acme_gold }
  - { user: namespace:acme_silver, relation: parent, object: table:acme_silver_features }
  - { user: namespace:acme_gold, relation: parent, object: table:acme_gold_catalog }
  # dave: a plain WRITER on the warehouse (writes any stage, but is NOT a validator)
  - { user: user:dave, relation: writer, object: warehouse:acme_bucket }
  # carol: a VALIDATOR on the gold stage via role:validators, + reader on the warehouse (to read silver)
  - { user: user:carol, relation: assignee, object: role:validators }
  - { user: "role:validators#assignee", relation: validator, object: namespace:acme_gold }
  - { user: user:carol, relation: reader, object: warehouse:acme_bucket }
  # a materialized view + a transaction under the silver stage — only the `parent` edge is stored, so
  # they inherit the stage's owner/writer/reader rungs (no per-object grants needed).
  - { user: namespace:acme_silver, relation: parent, object: materialized_view:acme_silver$daily_agg }
  - { user: namespace:acme_silver, relation: parent, object: transaction:acme_silver$commit1 }
  # The INVERSE edges. `grant_on_create` writes each of these in the SAME batch as the `parent` tuple
  # above, so the two directions cannot drift; they are spelled out here because a test fixture has no
  # create path. They exist only to answer "is anything under me visible?" — OpenFGA cannot walk a
  # tuple backwards. No `transaction` child: a receipt is not a browsable object.
  - { user: namespace:acme_bronze, relation: child, object: warehouse:acme_bucket }
  - { user: namespace:acme_silver, relation: child, object: warehouse:acme_bucket }
  - { user: namespace:acme_gold, relation: child, object: warehouse:acme_bucket }
  - { user: table:acme_silver_features, relation: child, object: namespace:acme_silver }
  - { user: table:acme_gold_catalog, relation: child, object: namespace:acme_gold }
  - { user: "materialized_view:acme_silver$daily_agg", relation: child, object: namespace:acme_silver }
  # ivan: the UPWARD-VISIBILITY subject — granted reader on ONE table and nothing else. The real case
  # is "you may read this dataset"; before the child edge he could read it and not see the path to it.
  - { user: user:ivan, relation: reader, object: table:acme_gold_catalog }
  # ---- the GRANT axis ------------------------------------------------------------------------
  # judy: a SECURITY ADMIN — manages access across the bucket and holds no data rung at all. The
  # persona that was unexpressible while granting was welded to `owner`.
  - { user: user:judy, relation: manage_grants, object: warehouse:acme_bucket }
  # kevin: a DELEGATE on the silver stage — a writer who may hand on what he holds, and no more.
  - { user: user:kevin, relation: writer, object: namespace:acme_silver }
  - { user: user:kevin, relation: pass_grants, object: namespace:acme_silver }
  # leo: holds the grant OPTION and no rung — the option is worthless alone, by construction.
  - { user: user:leo, relation: pass_grants, object: namespace:acme_silver }
  # ---- MANAGED ACCESS (C4) ---------------------------------------------------------------------
  # A separate warehouse on purpose: the flag changes who may grant, so setting it on acme_bucket
  # would silently rewrite every grant-axis expectation above. beta is team:partners' tenant.
  - { user: "user:*", relation: managed_access, object: warehouse:beta_bucket }
  - { user: warehouse:beta_bucket, relation: parent, object: namespace:beta_locked }
  - { user: namespace:beta_locked, relation: parent, object: table:beta_locked_records }
  # mona OWNS the stage inside the managed scope — normally that would carry the right to grant.
  - { user: user:mona, relation: owner, object: namespace:beta_locked }
  # nora is the records manager: grant authority at the warehouse, which the flag centralizes on her.
  - { user: user:nora, relation: manage_grants, object: warehouse:beta_bucket }
  # oskar owns the MANAGED warehouse DIRECTLY (not via project admin). He is the subject C4 was always
  # about and the one the warehouse rung used to miss: the flag is supposed to take his granting away.
  - { user: user:oskar, relation: owner, object: warehouse:beta_bucket }
  # THE GRANT OPTION inside the managed scope. oskar owns the warehouse AND holds pass_grants — the
  # combination that kept granting after the owner-tier subtraction landed. pavel is the pure delegate
  # case (reader + the grant option, no ownership), so the two branches are covered separately and a fix
  # that only handles owners cannot pass both.
  - { user: user:oskar, relation: pass_grants, object: warehouse:beta_bucket }
  - { user: user:pavel, relation: reader, object: warehouse:beta_bucket }
  - { user: user:pavel, relation: pass_grants, object: warehouse:beta_bucket }
  # …the same delegate one and two rungs down, where the managed flag arrives through `from parent`.
  - { user: user:mona, relation: pass_grants, object: namespace:beta_locked }
  - { user: user:quilla, relation: reader, object: table:beta_locked_records }
  - { user: user:quilla, relation: pass_grants, object: table:beta_locked_records }
  # …and an UNMANAGED control, so a blanket subtraction cannot pass.
  - { user: user:alice, relation: pass_grants, object: namespace:acme_silver }
  # A SELF-MANAGED namespace: acme_bronze carries its OWN managed_access, under an UNMANAGED warehouse.
  # This isolates the one thing every other managed fixture conflates — beta_locked inherits its flag
  # from the warehouse above it, so at that rung `managed_access_inheritance` and
  # `managed_access_inheritance from parent` evaluate identically and the DIRECTION of the rule cannot
  # be tested. Here they differ.
  #
  # acme_bronze rather than a new namespace on purpose: it is already in the seeded demo estate and has
  # nothing parented under it, and at this rung a scope's own flag constrains only what is BENEATH it —
  # so flagging it changes no existing assertion. A new namespace would have to be added to
  # `scripts/seed_estate.py` (test_seed_estate asserts the fixtures name nothing the real doors cannot
  # create), and adding one with a table there reds nine seed-sequence assertions that count calls.
  - { user: "user:*", relation: managed_access, object: namespace:acme_bronze }
  - { user: user:sam, relation: owner, object: namespace:acme_bronze }
  - { user: user:sam, relation: pass_grants, object: namespace:acme_bronze }

  # grace: an editor-only grant on a standalone (parentless) transaction — may edit properties, NOT commit
  - { user: user:grace, relation: editor, object: transaction:standalone_txn }
  # root_admin: owner of the ROOT warehouse (fga_root_object). ONLY this estate/platform tier reads the
  # estate-wide control-plane event feed (can_observe_events, GET /v1/events) — a per-project admin cannot.
  - { user: user:root_admin, relation: owner, object: warehouse:lance_catalog }

  # ---- annotation projects (B3/S2) -------------------------------------------------------------
  # gina is a PLAIN project member (not via team:eng, so not an admin) — the subject that proves
  # "tenant member is a viewer but NOT an annotator". frank belongs to a different tenant entirely.
  - { user: user:gina, relation: member, object: project:acme }
  - { user: project:acme, relation: tenant, object: annotation_project:labels_2026 }
  - { user: user:dave, relation: annotator, object: annotation_project:labels_2026 }
  - { user: user:carol, relation: reviewer, object: annotation_project:labels_2026 }
  - { user: user:henry, relation: manager, object: annotation_project:labels_2026 }

  # MUTATION-DETECTING FIXTURES (openfga skill: references/test-check-assertions.md distinguishes a
  # NEGATIVE case — a subject who holds access and must not hold THIS one — from a BOUNDARY case, a
  # subject with no tuples at all). Every negative for the actions below used the boundary kind, so
  # it denied under ANY model and five separate rung slips passed the whole suite 38/38. Each subject
  # here holds the rung IMMEDIATELY BELOW the action's required rung, so a slip flips them.
  - { user: user:olive, relation: reader, object: warehouse:lance_catalog }
  - { user: user:peter, relation: writer, object: table:acme_gold_catalog }
  - { user: user:quincy, relation: viewer, object: annotation_project:labels_2026 }
  # rita: a DIRECT project member. Every other member in this file arrives via `member from team`, and
  # `admin` includes that edge — so alice and bob are admins, and no subject existed at the plain-member
  # rung at all. Without one, `can_administer: admin` could be widened to `member` unnoticed.
  - { user: user:rita, relation: member, object: project:acme }
  # ---- the DEPTH-CEILING probe (catalog.core.identifiers.MAX_NAMESPACE_DEPTH) ----
  # A namespace chain exactly as deep as the catalog's create doors allow (MAX_NAMESPACE_DEPTH is an
  # EXCLUSIVE bound, so the deepest legal tree is one rung shallower than the number). It exists so the ceiling is
  # pinned against the REAL evaluator rather than asserted in a comment: `can_get_metadata` is recursive
  # both ways (`reader from parent` down, `can_get_metadata from child` up), and OpenFGA ABANDONS a
  # resolution that needs too many rewrite rules. Measured 2026-08-16 against this model with
  # `fga model test`: a chain of 12 answers; at 13 the check stops returning true/false and returns
  # `Code(2002) Authorization Model resolution required too many rewrite rules`. That is an ERROR, so the
  # fleet fails closed and browsing 503s for the WHOLE warehouse — laterally, from one deep branch.
  # Raising MAX_NAMESPACE_DEPTH means extending this chain (a contract test enforces they match), and if
  # it is raised past what the evaluator can take, these checks go red here instead of in production.
  - { user: 'namespace:depth_1', relation: child, object: 'warehouse:depth_probe' }
  - { user: 'project:depth_co', relation: project, object: 'warehouse:depth_probe' }
  - { user: 'namespace:depth_2', relation: child, object: 'namespace:depth_1' }
  - { user: 'namespace:depth_1', relation: parent, object: 'namespace:depth_2' }
  - { user: 'namespace:depth_3', relation: child, object: 'namespace:depth_2' }
  - { user: 'namespace:depth_2', relation: parent, object: 'namespace:depth_3' }
  - { user: 'namespace:depth_4', relation: child, object: 'namespace:depth_3' }
  - { user: 'namespace:depth_3', relation: parent, object: 'namespace:depth_4' }
  - { user: 'namespace:depth_5', relation: child, object: 'namespace:depth_4' }
  - { user: 'namespace:depth_4', relation: parent, object: 'namespace:depth_5' }
  - { user: 'namespace:depth_6', relation: child, object: 'namespace:depth_5' }
  - { user: 'namespace:depth_5', relation: parent, object: 'namespace:depth_6' }
  - { user: 'namespace:depth_7', relation: child, object: 'namespace:depth_6' }
  - { user: 'namespace:depth_6', relation: parent, object: 'namespace:depth_7' }
  - { user: 'warehouse:depth_probe', relation: parent, object: 'namespace:depth_1' }
  - { user: 'user:deepest', relation: reader, object: 'namespace:depth_7' }
  # A MOVER'S OWN OUTPUT — the tuple `register_table` writes for itself. Registering calls
  # `seed_ownership_or_compensate(resource="table")`, so the identity that registered a table is
  # granted `owner` on it. That is what decides whether a mover can publish what it just wrote, and
  # nothing in any seed script grants it.
  - { user: 'user:service-bronze-to-silver', relation: owner, object: 'table:acme_silver$features' }
  - { user: 'namespace:acme_silver', relation: parent, object: 'table:acme_silver$features' }
  # The same mover's STANDING grant: writer on the stage it writes into, and nothing above it.
  - { user: 'user:service-bronze-to-silver', relation: writer, object: 'namespace:acme_silver' }
  # A table the mover did NOT register — same namespace, no ownership tuple.
  - { user: 'namespace:acme_silver', relation: parent, object: 'table:acme_silver$foreign' }
  # The promoting mover: validator on gold, never owner.
  - { user: 'user:service-silver-to-gold', relation: validator, object: 'namespace:acme_gold' }

tests:
  - name: a mover can PUBLISH what it registered, and only what it registered
    # P5 of "movers publish the tag". `publish` is gated at `can_update_tag`, which is OWNER-tier —
    # strictly above the writer/validator rungs the movers are seeded with. It resolves anyway,
    # because registering a table grants the registrant `owner` ON THAT TABLE. So no model change and
    # no new grant are needed, and the scope is exactly right: a mover may move the tag on its own
    # output and on nothing else.
    check:
      - user: user:service-bronze-to-silver
        object: table:acme_silver$features
        assertions:
          can_update_tag: true       # its own output — publishable
          can_create_tag: true
          can_read_data: true
      - user: user:service-bronze-to-silver
        object: table:acme_silver$foreign
        assertions:
          can_update_tag: false      # a table it did not register, in the SAME namespace
          can_write_data: true       # writer still cascades from the namespace
      # The separation the model exists to enforce is untouched: owning the table it wrote does not
      # let a plain writer promote INTO a gated stage, which is gated on the DESTINATION namespace.
      - user: user:service-bronze-to-silver
        object: namespace:acme_gold
        assertions:
          can_promote: false
      - user: user:service-silver-to-gold
        object: namespace:acme_gold
        assertions:
          can_promote: true

  - name: only a ROOT-warehouse (estate) admin can observe the estate-wide control-plane event feed
    check:
      - user: user:root_admin
        object: warehouse:lance_catalog
        assertions: { can_observe_events: true }
      # alice is a full project admin (owns acme_bucket via her team) but is NOT the root owner → denied the
      # estate feed. This is the #12 fix: authz scope == data scope (per-project admin ≠ estate observer).
      - user: user:alice
        object: warehouse:lance_catalog
        assertions: { can_observe_events: false }
      - user: user:dave
        object: warehouse:lance_catalog
        assertions: { can_observe_events: false }
  - name: only a ROOT-warehouse (estate) admin can browse the raw object stores
    check:
      # #90. The store registry's buckets include the external RAW tier and the observability bucket
      # — outside the medallion entirely — so this is deliberately the same estate tier as the event
      # feed, not a per-tenant one. alice owning acme_bucket must NOT reach the raw scans.
      - user: user:root_admin
        object: warehouse:lance_catalog
        assertions: { can_browse_storage: true }
      - user: user:alice
        object: warehouse:lance_catalog
        assertions: { can_browse_storage: false }
      - user: user:dave
        object: warehouse:lance_catalog
        assertions: { can_browse_storage: false }
      # Recorded because it is the surprising half: the relation resolves on ANY warehouse its owner
      # owns — alice owns acme_bucket, so it is true THERE. What makes the privilege estate-scoped is
      # not the model, it is that the app only ever checks it against `fga_root_object`. Exactly the
      # arrangement `can_observe_events` already has. If a future caller checks it against a tenant
      # warehouse, the model will happily say yes and the scope silently widens — so the app-side
      # invariant is pinned separately, in test_viewer_object_authz.py.
      - user: user:alice
        object: warehouse:acme_bucket
        assertions: { can_browse_storage: true }
  - name: an owner-only action must be REFUSED to the rung directly below it (mutation-detecting)
    check:
      # Each subject here HOLDS a live relation on the object, which is what the negatives above lack:
      # alice and dave hold nothing on warehouse:lance_catalog, so they deny under any model. The
      # `reader: true` / `writer: true` / `viewer: true` line is load-bearing — it proves the tuple is
      # still there, so removing it can never quietly turn these negatives vacuous again.
      - user: user:olive
        object: warehouse:lance_catalog
        assertions:
          reader: true              # the tuple is live
          can_get_metadata: true    # what a reader IS entitled to
          can_observe_events: false # owner-only: slips to true if the rung drops to reader
          can_browse_storage: false # owner-only: same
      - user: user:peter
        object: table:acme_gold_catalog
        assertions:
          writer: true              # the tuple is live
          can_write_data: true      # what a writer IS entitled to
          can_deregister: false     # owner-only: slips to true if the rung drops to writer
          # The rest of the table's OWNER tier. `can_deregister` alone was a SAMPLE, and a sample
          # cannot pin a derivation: measured 2026-08-22, widening `can_drop: owner` to `reader` —
          # the most destructive op on a table, handed to the lowest rung — left 44/44 tests and
          # 266/266 checks passing. Every owner-tier action on this type is now named.
          can_drop: false           # DESTRUCTIVE, and was the widenable one
          can_restore: false        # rewinds history; strictly above writer by the model's own comment
          can_create_branch: false  # forking history is privileged
          can_create_tag: false
          can_update_tag: false
          # The GRANT axis (five relations, none of which had an assertion of any kind). A writer
          # without `pass_grants` can hand out nothing — that is the whole point of splitting
          # `manage_grants` from the data rungs, and nothing was checking it.
          can_grant_owner: false
          can_grant_writer: false
          can_grant_reader: false
          can_grant_validator: false
      # ---- the rungs a mutation sweep found unpinned (2026-08-22) ----
      # Method: widen each can_* to its type's LOWEST rung and re-run. 47 derivations were already
      # caught by assertions above; these survived silently, so each is named here with a subject that
      # HOLDS the low rung (the liveness line proves the tuple, so the negative can never go vacuous).
      - user: user:olive
        object: warehouse:lance_catalog
        assertions:
          reader: true                        # the tuple is live
          can_create_namespace: false         # writer-tier: creation is never a reader's
          can_create_table: false
          can_create_materialized_view: false
          can_grant_pass_grants: false        # manage_grants-tier
      - user: user:carol
        object: namespace:acme_bronze
        assertions:
          reader: true                        # inherited from her warehouse reader grant
          can_get_metadata: true              # what a reader IS entitled to
          can_delete: false                   # DESTRUCTIVE and owner-tier; was widenable to reader
          can_create_namespace: false
          can_create_table: false
          can_create_materialized_view: false
          can_grant_pass_grants: false
      - user: user:carol
        object: table:acme_silver_features
        assertions:
          reader: true                        # inherited through namespace:acme_silver
          can_read_data: true                 # what a reader IS entitled to
          can_write_data: false               # writer-tier; the read/write boundary itself was unpinned
          can_grant_pass_grants: false
      - user: user:rita
        object: project:acme
        assertions:
          member: true                        # the tuple is live
          can_administer: false               # admin-tier: a plain member never administers
          can_create_warehouse: false
      - user: user:quincy
        object: annotation_project:labels_2026
        assertions:
          viewer: true              # the tuple is live
          can_send_items: false     # annotator-only: slips to true if the rung drops to viewer
          can_annotate: false       # the sibling action on the same rung, same reasoning
          can_claim: false          # annotator-tier, found unpinned by the 2026-08-22 sweep
          can_manage: false         # manager-tier, same
  - name: team-owned project admins get full warehouse access (and a team owns MANY projects)
    check:
      - user: user:alice
        object: warehouse:acme_bucket
        assertions: { can_get_metadata: true, can_create_table: true }
      - user: user:alice
        object: warehouse:research_bucket # same team, second project — still admin/owner
        assertions: { can_get_metadata: true, can_create_table: true }
      - user: user:alice
        object: table:acme_gold_catalog # owner cascades all the way down
        assertions: { can_read_data: true, can_drop: true }

  - name: projects are ISOLATED — a grant on one project's bucket never reaches another
    check:
      - user: user:alice # eng owns acme + research, NOT beta
        object: warehouse:beta_bucket
        assertions: { can_get_metadata: false, can_create_table: false }
      - user: user:frank # partners owns beta, NOT acme
        object: warehouse:acme_bucket
        assertions: { can_get_metadata: false }
      - user: user:frank
        object: warehouse:beta_bucket
        assertions: { can_get_metadata: true, can_create_table: true }

  - name: a plain WRITER can write a stage but CANNOT promote to gold
    check:
      - user: user:dave
        object: table:acme_silver_features
        assertions: { can_read_data: true, can_write_data: true }
      - user: user:dave # the headline: writer is NOT a validator → no promotion into gold
        object: namespace:acme_gold
        assertions: { can_get_metadata: true, can_promote: false }
      - user: user:dave
        object: table:acme_gold_catalog
        assertions: { can_write_data: true, can_promote: false }

  - name: a VALIDATOR can promote silver to gold; an owner is implicitly a validator
    check:
      - user: user:carol # validator on gold via role:validators
        object: namespace:acme_gold
        assertions: { can_promote: true }
      - user: user:carol
        object: table:acme_gold_catalog # validator cascades to tables in the gold stage
        assertions: { can_promote: true }
      - user: user:carol # she can read silver (reader on the bucket) to do the promotion
        object: table:acme_silver_features
        assertions: { can_read_data: true }
      - user: user:alice # owner ⇒ validator, so admins promote too
        object: namespace:acme_gold
        assertions: { can_promote: true }

  - name: an outsider with no grants is denied
    check:
      - user: user:eve
        object: warehouse:acme_bucket
        assertions: { can_get_metadata: false }
      - user: user:eve
        object: table:acme_gold_catalog
        assertions: { can_read_data: false, can_promote: false }

  # UPWARD VISIBILITY. A single-table grantee must be able to SEE the containers on the path to their
  # own table, or the grant is unreachable: every list above it comes back empty and the breadcrumb
  # 403s. `can_get_metadata` reads through `child`; nothing else does, which is the boundary — ivan
  # can see that acme_gold exists, and can read nothing else in it.
  - name: upward visibility — a table-only grantee can SEE the path to their table, and nothing more
    check:
      - user: user:ivan # the grant itself
        object: table:acme_gold_catalog
        assertions: { can_read_data: true, can_get_metadata: true }
      - user: user:ivan # the containers ABOVE it are now visible…
        object: namespace:acme_gold
        assertions: { can_get_metadata: true }
      - user: user:ivan
        object: warehouse:acme_bucket
        assertions: { can_get_metadata: true }
      - user: user:ivan # …but visibility is NOT read: no data, no writes, no siblings
        object: namespace:acme_gold
        assertions: { can_create_table: false, can_delete: false, can_update_properties: false }
      - user: user:ivan
        object: table:acme_silver_features # a SIBLING stage's table stays invisible
        assertions: { can_read_data: false, can_get_metadata: false }
      - user: user:ivan
        object: namespace:acme_bronze # an unrelated stage stays invisible
        assertions: { can_get_metadata: false }
      - user: user:eve # and an outsider gains nothing from the new edge
        object: namespace:acme_gold
        assertions: { can_get_metadata: false }

  - name: notification delivery is NOT metadata visibility — the S4 split, on the very grantee C1 opened it for
    # `can_get_metadata` reads `reader or can_get_metadata from child`, so ivan's ONE table grant lights
    # the whole path above it. Right for a breadcrumb; as a delivery gate it would push a namespace- or
    # warehouse-scoped governance event to everyone holding a grant on anything underneath — an audience
    # nobody chose, arriving as a notification. `can_be_notified` is bare `reader`, so the two answers
    # diverge on containers and coincide on leaves. This test is the proof of both halves.
    check:
      - user: user:ivan # the leaf he was actually granted: notified, and visible, and the same set
        object: table:acme_gold_catalog
        assertions: { can_be_notified: true, can_get_metadata: true }
      - user: user:ivan # THE SPLIT: he can SEE the path to his table…
        object: namespace:acme_gold
        assertions: { can_get_metadata: true, can_be_notified: false }
      - user: user:ivan # …and is not a party to what happens to the container itself
        object: warehouse:acme_bucket
        assertions: { can_get_metadata: true, can_be_notified: false }
      # The positive side, so the relation cannot pass by denying everyone. carol holds `reader` on the
      # warehouse itself, which cascades down the rungs — a real stake in the container.
      - user: user:carol
        object: warehouse:acme_bucket
        assertions: { can_be_notified: true }
      - user: user:carol
        object: namespace:acme_gold
        assertions: { can_be_notified: true }
      # A namespace WRITER is a reader by concentric derivation, so the stage's own writer is notifiable.
      - user: user:kevin
        object: namespace:acme_silver
        assertions: { can_be_notified: true }
      # A leaf's two rungs coincide by construction — that identity is what made S1's delivery path
      # correct before this relation existed, and it must keep holding.
      - user: user:carol
        object: "materialized_view:acme_silver$daily_agg"
        assertions: { can_be_notified: true, can_get_metadata: true }
      # Boundary: an outsider gains nothing anywhere, and an unrelated stage stays silent.
      - user: user:eve
        object: namespace:acme_gold
        assertions: { can_be_notified: false, can_get_metadata: false }
      - user: user:ivan
        object: namespace:acme_bronze
        assertions: { can_be_notified: false }
      - user: user:eve
        object: table:acme_gold_catalog
        assertions: { can_be_notified: false }

  - name: who may be NOTIFIED about the gold stage? (list_users) — container readers only, never a table-only grantee
    # The audience question stated as an ENUMERATION, because that is the shape a fan-out actually asks
    # — and `list_users` is the only form that can prove an absence. IVAN'S ABSENCE IS THE FINDING: the
    # same query against `can_get_metadata` returns him, because C1's `child` edge lights every
    # container above his one table. Everyone listed holds a real stake in the container:
    #   alice/bob — team:eng admins of project:acme, so warehouse owners
    #   carol     — reader granted on warehouse:acme_bucket directly
    #   dave      — writer on the warehouse (writer implies reader, concentrically)
    #   gina      — member of project:acme, which `warehouse#reader` includes via `member from project`
    #   rita      — the same edge as gina. Added 2026-08-22 as the plain-member subject that pins
    #               `project.can_administer: admin` against a widening to `member`; her arrival here
    #               is not incidental, it re-proves that `member from project` reaches this far.
    list_users:
      - object: namespace:acme_gold
        user_filter: [{ type: user }]
        assertions:
          can_be_notified:
            users: [user:alice, user:bob, user:carol, user:dave, user:gina, user:rita]

  - name: create-on-parent — create perms are gated on the PARENT object (design-create-on-parent)
    check:
      # warehouse creation is gated on the project: a project admin (alice, via team:eng) may; an outsider may not.
      - user: user:alice
        object: project:acme
        assertions: { can_administer: true, can_create_warehouse: true }
      - user: user:frank # partners-team member, no grant on project:acme
        object: project:acme
        assertions: { can_administer: false, can_create_warehouse: false }
      # namespace creation is gated on the warehouse AND a parent namespace: a writer (dave) may; an outsider (eve) may not.
      # The warehouse is ALSO the parent the app checks for a TOP-LEVEL create when fga_lock_root_create is
      # on (RASK_FGA_ROOT_OBJECT = warehouse:lance_catalog), so EVERY can_create_* the app can send at a
      # parent — table, namespace AND materialized_view — must resolve on `warehouse`, not just `namespace`.
      - user: user:dave # plain writer on the bucket
        object: warehouse:acme_bucket
        assertions: { can_create_namespace: true, can_create_table: true, can_create_materialized_view: true }
      - user: user:eve
        object: warehouse:acme_bucket
        assertions: { can_create_materialized_view: false }
      - user: user:dave # writer cascades down the namespace parent chain (namespace→namespace AND namespace→table)
        object: namespace:acme_silver
        assertions: { can_create_namespace: true, can_create_table: true }
      - user: user:eve
        object: warehouse:acme_bucket
        assertions: { can_create_namespace: false }
      - user: user:eve
        object: namespace:acme_silver
        assertions: { can_create_namespace: false, can_create_table: false }

  - name: who can promote into gold? (list_users) — owners + validators, never plain writers
    # `service-silver-to-gold` belongs here: `seed_medallion_fga.sh` grants exactly this, and the
    # enumeration is the check that a plain writer never appears. A mover owning the table it wrote
    # (see the P5 test above) does not put it in this list — promotion is gated on the DESTINATION
    # namespace, which no amount of table ownership reaches.
    list_users:
      - object: namespace:acme_gold
        user_filter: [{ type: user }]
        assertions:
          can_promote:
            users: [user:alice, user:bob, user:carol, user:service-silver-to-gold]

  - name: which buckets can the writer dave see? (list_objects) — only acme, by isolation
    list_objects:
      - user: user:dave
        type: warehouse
        assertions:
          can_get_metadata: [warehouse:acme_bucket]
      # The isolation claim in this row's own name was only ever half-asserted: naming the ONE bucket
      # dave sees does not prove another tenant's is excluded unless something enumerates from the
      # other side. quilla is the beta tenant, and eve has no grants anywhere.
      # quilla is a READER on `table:beta_locked_records` and enumerates NO warehouse — measured, not
      # assumed: the first version of this row expected `[warehouse:beta_bucket]` and the model said
      # `[]`. Visibility cascades DOWN the hierarchy (a warehouse grant reaches its tables) and never
      # UP, so a table-level grant does not make the parent bucket enumerable. Worth pinning in both
      # directions: it is the difference between "quilla cannot see acme" (isolation) and "quilla
      # cannot see the bucket her own table lives in" (the cascade's direction), and only one of those
      # would survive someone adding a convenience edge upward.
      - user: user:quilla
        type: warehouse
        assertions:
          can_get_metadata: []
      - user: user:eve
        type: warehouse
        assertions:
          can_get_metadata: []

  - name: which TABLES can each principal enumerate? (list_objects) — the cross-tenant disclosure control
    # `list_objects` builds the allow-list behind every table listing the catalog serves, so it IS the
    # control that stops one tenant seeing another's tables. It had no row over `type: table` at all —
    # the two rows that existed enumerate warehouses and materialized views. A `check` cannot stand in:
    # check answers "may this principal read THIS table", and disclosure is about what comes back when
    # nobody named a table.
    list_objects:
      - user: user:ivan # a reader on ONE gold table and nothing else
        type: table
        assertions:
          can_get_metadata: [table:acme_gold_catalog]
      - user: user:quilla # the BETA tenant — must never enumerate an acme table
        type: table
        assertions:
          can_get_metadata: [table:beta_locked_records]
      - user: user:dave # a warehouse/namespace WRITER — the recursive upward edge a listing walks
        type: table
        assertions:
          can_get_metadata: [table:acme_silver_features, table:acme_gold_catalog, "table:acme_silver$features", "table:acme_silver$foreign"]
      - user: user:eve # an outsider enumerates nothing; the empty list is the assertion
        type: table
        assertions:
          can_get_metadata: []

  - name: a namespace writer can CREATE and REFRESH a materialized view; a reader can only read it
    check:
      - user: user:dave # plain warehouse/namespace writer — create is gated on the parent namespace
        object: namespace:acme_silver
        assertions: { can_create_materialized_view: true }
      - user: user:dave # writer ⇒ refresher via the parent cascade → may trigger the async refresh
        object: materialized_view:acme_silver$daily_agg
        assertions: { can_refresh: true, can_read: true, can_get_metadata: true }
      - user: user:carol # bucket reader → can READ the view but NOT refresh it (refresher is writer-tier)
        object: materialized_view:acme_silver$daily_agg
        assertions: { can_read: true, can_refresh: false }
      - user: user:eve # outsider — nothing
        object: materialized_view:acme_silver$daily_agg
        assertions: { can_read: false, can_refresh: false }

  - name: ref-plane / restore ops are OWNER-tier — a plain writer is DENIED, an owner is allowed
    check:
      - user: user:dave # writer, NOT owner — branch/tag/restore are strictly above the writer rung
        object: table:acme_silver_features
        assertions:
          {
            can_write_data: true,
            can_restore: false,
            can_create_branch: false,
            can_create_tag: false,
            can_update_tag: false,
          }
      - user: user:alice # owner (team:eng → project admin → warehouse owner cascade) — all allowed
        object: table:acme_silver_features
        assertions:
          {
            can_restore: true,
            can_create_branch: true,
            can_create_tag: true,
            can_update_tag: true,
          }

  - name: transaction — privileged set_status is above property edits; the once-always-denied path resolves
    check:
      - user: user:dave # namespace writer → committer via the parent cascade (the always-deny FIX)
        object: transaction:acme_silver$commit1
        assertions: { can_describe: true, can_set_property: true, can_set_status: true, can_cancel: true }
      - user: user:carol # bucket reader → may describe, but NOT edit properties or commit/abort
        object: transaction:acme_silver$commit1
        assertions: { can_describe: true, can_set_property: false, can_set_status: false }
      - user: user:grace # editor-only on a standalone txn → may set properties, NEVER set_status/cancel
        object: transaction:standalone_txn
        assertions: { can_set_property: true, can_set_status: false, can_cancel: false }
      - user: user:eve # outsider — denied even describe
        object: transaction:acme_silver$commit1
        assertions: { can_describe: false, can_set_status: false }

  # The block above asserts the OBJECT-scoped branch (`transaction:` — used only for an OPAQUE root txn id).
  # A NAMESPACED txn id (`<ns>$<txn>`, the common case) is authorized PARENT-SCOPED by the app against
  # `namespace:<ns>` — a path the transaction assertions above never exercised, which is how a check against
  # the non-existent `namespace#can_write_data` shipped (400 → fail-closed 503 for EVERY caller). Pin the
  # relations the app ACTUALLY sends at the namespace: can_get_metadata (describe) / can_update_properties
  # (alter = commit/abort, writer rung — the same rung `transaction#can_set_status: committer` resolves to
  # for a parented txn, so both branches gate identically).
  - name: transaction (namespaced id) — the PARENT-SCOPED relations the catalog checks on namespace:<ns>
    check:
      - user: user:dave # namespace writer → may describe AND drive (commit/abort) the txn
        object: namespace:acme_silver
        assertions: { can_get_metadata: true, can_update_properties: true }
      - user: user:carol # bucket reader → may describe the txn, but NOT commit/abort it
        object: namespace:acme_silver
        assertions: { can_get_metadata: true, can_update_properties: false }
      - user: user:eve # outsider — neither
        object: namespace:acme_silver
        assertions: { can_get_metadata: false, can_update_properties: false }

  - name: which materialized views can the writer dave refresh? (list_objects) — the silver stage's view
    list_objects:
      - user: user:dave
        type: materialized_view
        assertions:
          can_refresh: [materialized_view:acme_silver$daily_agg]

  - name: an annotation project's rungs are concentric, and tenant membership only reaches viewer
    check:
      # A tenant member sees the project but cannot label in it — labeling is an explicit grant.
      - user: user:gina
        object: annotation_project:labels_2026
        assertions: { can_view: true, can_annotate: false, can_review: false, can_publish: false }
      # An explicit annotator may annotate/claim/send, but reviewing is a rung above.
      - user: user:dave
        object: annotation_project:labels_2026
        assertions: { can_view: true, can_claim: true, can_annotate: true, can_review: false, can_publish: false }
      # reviewer > annotator ON PURPOSE: a reviewer must be able to fix_and_accept, which IS annotating.
      - user: user:carol
        object: annotation_project:labels_2026
        assertions: { can_annotate: true, can_review: true, can_publish: false }
      # can_publish is the manager rung — no separate publisher rung exists.
      - user: user:henry
        object: annotation_project:labels_2026
        assertions: { can_review: true, can_manage: true, can_publish: true }
      # A tenant ADMIN owns the annotation project by cascade (admin from tenant).
      - user: user:alice
        object: annotation_project:labels_2026
        assertions: { can_publish: true, can_manage: true }
      # Another tenant's admin gets nothing — project isolation holds for annotation projects too.
      - user: user:frank
        object: annotation_project:labels_2026
        assertions: { can_view: false, can_annotate: false, can_publish: false }

  - name: creating an annotation project is authorized on the PARENT tenant, not the child
    check:
      # Ordinary tenant membership is the door — labeling is normal tenant work.
      - user: user:gina
        object: project:acme
        assertions: { can_create_annotation_project: true }
      - user: user:alice
        object: project:acme
        assertions: { can_create_annotation_project: true }
      # A member of a DIFFERENT tenant cannot create one here.
      - user: user:frank
        object: project:acme
        assertions: { can_create_annotation_project: false }
  # ---- time-boxed grants (the `non_expired_grant` condition) ------------------------------------
  #
  # The point of the condition is that access ENDS without anyone revoking it, so both sides of the
  # window are asserted. A test that only checks "allowed while valid" would pass just as happily
  # against an unconditional grant, and would therefore prove nothing about expiry at all.
  #
  # `grant_time` + `grant_duration` ride the tuple; `current_time` comes from the check's context —
  # the store holds the window, the caller holds the clock.
  - name: a time-boxed writer grant is live inside its window and dead outside it
    tuples:
      - user: user:contractor
        relation: writer
        object: namespace:bronze
        condition:
          name: non_expired_grant
          context:
            grant_time: "2026-07-29T09:00:00Z"
            grant_duration: 4h
    check:
      # 10:30 — inside the 4h window that opened at 09:00.
      - user: user:contractor
        object: namespace:bronze
        context: { current_time: "2026-07-29T10:30:00Z" }
        assertions:
          writer: true
          can_create_table: true
      # 14:00 — the window closed at 13:00. Nobody revoked anything; the grant simply stopped.
      - user: user:contractor
        object: namespace:bronze
        context: { current_time: "2026-07-29T14:00:00Z" }
        assertions:
          writer: false
          can_create_table: false

  - name: an expired rung does not leak DOWN the cascade to child tables
    # The rungs inherit via `writer from parent`, so an expired grant on the namespace must take the
    # table with it. If the cascade re-derived the child independently, expiry would be cosmetic.
    tuples:
      - user: user:contractor
        relation: writer
        object: namespace:bronze
        condition:
          name: non_expired_grant
          context:
            grant_time: "2026-07-29T09:00:00Z"
            grant_duration: 4h
      - user: namespace:bronze
        relation: parent
        object: table:bronze$pages
    check:
      - user: user:contractor
        object: table:bronze$pages
        context: { current_time: "2026-07-29T10:30:00Z" }
        assertions: { can_write_data: true }
      - user: user:contractor
        object: table:bronze$pages
        context: { current_time: "2026-07-29T14:00:00Z" }
        assertions: { can_write_data: false }

  - name: a time-boxed grant works DIRECTLY on a table, not only inherited from its namespace
    # The TABLE rung declares the conditional form itself, which the cascade test above cannot prove —
    # there the only conditional tuple sits on the namespace and the table merely inherits it. This
    # table is given NO parent on purpose, so the direct conditional tuple is the only thing that can
    # produce access, and expiry is therefore the table rung's own behaviour rather than the parent's.
    tuples:
      - user: user:contractor
        relation: writer
        object: table:bronze$scratch
        condition:
          name: non_expired_grant
          context:
            grant_time: "2026-07-29T09:00:00Z"
            grant_duration: 4h
    check:
      - user: user:contractor
        object: table:bronze$scratch
        context: { current_time: "2026-07-29T10:30:00Z" }
        assertions: { writer: true, can_write_data: true }
      - user: user:contractor
        object: table:bronze$scratch
        context: { current_time: "2026-07-29T14:00:00Z" }
        assertions: { writer: false, can_write_data: false }

  - name: a permanent grant is unaffected by the condition being available
    # The rungs accept BOTH forms, so every pre-existing unconditional grant must keep working with no
    # context supplied at all. This is the migration-safety assertion.
    tuples:
      - user: user:permanent
        relation: writer
        object: namespace:bronze
    check:
      - user: user:permanent
        object: namespace:bronze
        assertions: { writer: true, can_create_table: true }

  - name: ownership is NOT time-boxable — the condition is refused on owner
    # `owner` deliberately omits the conditional form: a temporary owner could grant PERMANENT access to
    # someone else before their own window closed, which outlives the expiry. Asserting the absence
    # keeps that decision from being quietly reversed by a later edit.
    tuples:
      - user: user:permanent
        relation: owner
        object: namespace:bronze
    check:
      - user: user:permanent
        object: namespace:bronze
        assertions: { owner: true, can_delete: true }

  # THE GRANT AXIS. Granting used to be a side-effect of `owner`, so the only way to let someone
  # administer access was to give them the data. These pin the separation in both directions: a
  # grant-manager who cannot read, and a data holder who cannot grant.
  - name: a SECURITY ADMIN manages access without holding any data rung
    check:
      - user: user:judy
        object: warehouse:acme_bucket
        assertions:
          # She may hand out every rung, and review who holds them…
          can_grant_owner: true
          can_grant_writer: true
          can_grant_reader: true
          can_grant_validator: true
          can_read_assignments: true
          # …and may not read, write or promote a single byte. This is the whole point.
          can_get_metadata: false
          can_create_table: false
      - user: user:judy # and it cascades, so access admin is delegated once at the top
        object: namespace:acme_silver
        assertions: { can_grant_reader: true, can_get_metadata: false }
      - user: user:judy # …including to the tables beneath it
        object: table:acme_silver_features
        assertions: { can_grant_reader: true, can_read_data: false }

  - name: the GRANT OPTION passes on only what the delegate already holds — never more
    check:
      - user: user:kevin
        object: namespace:acme_silver
        assertions:
          # He is a writer, so he may pass writer — and reader, which writer already implies.
          can_grant_writer: true
          can_grant_reader: true
          # He is NOT an owner or a validator, so he cannot mint either. No escalation via delegation.
          can_grant_owner: false
          can_grant_validator: false
          # Nor can he create further delegates, or promote himself to grant-manager.
          can_grant_pass_grants: false
          can_grant_manage_grants: false
      - user: user:kevin # the option is per-object and does NOT cascade to the tables below
        object: table:acme_silver_features
        assertions: { can_grant_writer: false }

  - name: REVOKING is not the mirror of granting — a delegate may hand on, never take back
    # The bar that was wrong. `access/revoke` used to be gated on `can_grant_<rung>`, so kevin —
    # `writer` + `pass_grants`, "a delegate and no more" — could DELETE any reader/writer/validator
    # tuple on the object, including ones the owner issued. Revoking is `manage_grants` alone now.
    check:
      - user: user:kevin
        object: namespace:acme_silver
        assertions:
          # He may still hand on what he holds…
          can_grant_writer: true
          can_grant_reader: true
          # …and may take nothing away. This is the whole fix.
          can_revoke_grant: false
      - user: user:leo # the option alone was never a rung, and is not a revoke authority either
        object: namespace:acme_silver
        assertions: { can_revoke_grant: false }
      - user: user:judy # the security admin revokes, because that IS grant management
        object: warehouse:acme_bucket
        assertions: { can_revoke_grant: true }
      - user: user:judy # and it cascades with the rest of the axis
        object: table:acme_silver_features
        assertions: { can_revoke_grant: true }
      - user: user:alice # an owner keeps it — `manage_grants` derives from `owner`
        object: namespace:acme_silver
        assertions: { can_revoke_grant: true }
      - user: user:eve # an outsider gains nothing
        object: namespace:acme_silver
        assertions: { can_revoke_grant: false }

  - name: inside a MANAGED scope even the owner cannot revoke — the flag has to bind both directions
    # C4 withdraws the owner's `manage_grants`, so mona keeps every data power and loses granting.
    # Revoke deriving from the same relation is what stops the flag being half a policy: an owner who
    # could still REVOKE could clear the grants the grant-manager made and re-make them at will.
    check:
      - user: user:mona
        object: namespace:beta_locked
        assertions:
          can_revoke_grant: false
          can_grant_reader: false
      - user: user:nora # the records manager, who is who the flag centralizes it on
        object: namespace:beta_locked
        assertions: { can_revoke_grant: true }

  - name: the grant option alone grants nothing — it qualifies a rung, it is not a rung
    check:
      - user: user:leo
        object: namespace:acme_silver
        assertions:
          can_grant_reader: false
          can_grant_writer: false
          # `can_read_data` is TABLE-only — a namespace has no data plane. Asserting it here is the
          # phantom-relation mistake the model-contract test exists to catch, and the CLI caught it.
          can_get_metadata: false

  - name: an OWNER still grants everything — the split adds a capability and revokes none
    check:
      - user: user:alice # project admin ⇒ warehouse owner ⇒ manage_grants
        object: namespace:acme_silver
        assertions:
          can_grant_owner: true
          can_grant_reader: true
          can_read_assignments: true
      - user: user:eve # …and an outsider gains nothing from the new axis
        object: namespace:acme_silver
        assertions:
          can_grant_reader: false
          can_read_assignments: false

  # P6 — TENANT MEMBERSHIP. The gap that blocked real users: `admin`/`member` on a project were
  # writable only by the create-time seed and the estate-gated tuple editor, so a project admin could
  # not invite anyone into their own tenant.
  - name: a project ADMIN may grant both tenant rungs — the tenant self-governs
    check:
      - user: user:alice # admin via team:eng
        object: project:acme
        assertions:
          can_grant_admin: true
          can_grant_member: true
          can_read_assignments: true
          can_administer: true
  - name: a plain tenant MEMBER may not — membership is an admin act, not a member one
    check:
      - user: user:gina # a plain member of project:acme
        object: project:acme
        assertions:
          can_grant_admin: false
          can_grant_member: false
          can_read_assignments: false
      # …and someone else's tenant stays entirely closed. Membership grants must never cross projects.
      - user: user:frank # team:partners, project:beta
        object: project:acme
        assertions:
          can_grant_admin: false
          can_grant_member: false
  - name: a warehouse OWNER is not automatically a tenant admin — the cascade runs DOWN, not up
    check:
      # dave is a writer on the bucket; granting tenant membership is a level above the data plane.
      - user: user:dave
        object: project:acme
        assertions:
          can_grant_admin: false
          can_grant_member: false

  # MANAGED ACCESS (C4). The archive lever: "nobody hands out access to this collection except the
  # records manager". Without it the only way to stop an owner widening access is to stop making them
  # an owner — which also stops them working.
  - name: managed access WITHDRAWS an owner's right to grant, and nothing else
    check:
      - user: user:mona # owns the stage inside the managed scope
        object: namespace:beta_locked
        assertions:
          # She is still the owner in every way that matters to her work…
          can_get_metadata: true
          can_create_table: true
          can_delete: true
          # …and may no longer hand access out. That is the entire effect.
          can_grant_reader: false
          can_grant_owner: false
          can_read_assignments: false
      - user: user:mona # the withdrawal reaches the tables under her stage too
        object: table:beta_locked_records
        assertions:
          can_read_data: true
          can_grant_reader: false

  - name: the records manager keeps granting throughout the managed scope
    check:
      - user: user:nora # manage_grants at the warehouse
        object: namespace:beta_locked
        assertions:
          can_grant_reader: true
          can_grant_owner: true
          can_read_assignments: true
      - user: user:nora
        object: table:beta_locked_records
        assertions: { can_grant_reader: true }
      # …and centralizing grants does NOT hand her the data. The two axes stay separate.
      - user: user:nora
        object: table:beta_locked_records
        assertions: { can_read_data: false }

  - name: an UNMANAGED scope is unaffected — the flag is opt-in, not a global mode change
    check:
      - user: user:alice # owner of acme's stages, no managed_access anywhere on that bucket
        object: namespace:acme_silver
        assertions:
          can_grant_reader: true
          can_grant_owner: true

  - name: a policy you can switch off is not a policy — the flag is cleared from ABOVE, never from inside
    check:
      - user: user:mona # owner inside the managed scope
        object: namespace:beta_locked
        assertions:
          # She cannot clear the flag that constrains her: `can_set_managed_access` derives from
          # `manage_grants`, which the flag itself withdrew. Otherwise the control would be advisory.
          can_set_managed_access: false
      - user: user:nora # the records manager, at the warehouse
        object: namespace:beta_locked
        assertions: { can_set_managed_access: true }
      - user: user:alice # …and in an UNMANAGED scope an owner still controls their own
        object: namespace:acme_silver
        assertions: { can_set_managed_access: true }

  - name: the namespace DEPTH CEILING is inside what OpenFGA can actually resolve (measured, not assumed)
    check:
      # The NEGATIVE is the expensive direction — a deny must walk the entire chain before it can say no,
      # which is exactly the resolution that blows the rewrite budget. If this ever returns N/A instead of
      # false, the ceiling has been raised past the evaluator and every warehouse with a deep branch is
      # about to 503 on browse for everyone, its owners included.
      - user: user:depth_stranger
        object: warehouse:depth_probe
        assertions:
          can_get_metadata: false
      # …and the POSITIVE proves the chain is genuinely wired end to end, so the negative above is not
      # passing vacuously off a chain that was never connected. One reader at the deepest legal rung is
      # visible from the warehouse 7 levels up, and can read down from the top of the chain.
      - user: user:deepest
        object: warehouse:depth_probe
        assertions:
          can_get_metadata: true
      - user: user:deepest
        object: namespace:depth_7
        assertions:
          can_get_metadata: true

  - name: managed access binds the WAREHOUSE OWNER too — the rung the subtraction used to miss
    check:
      # oskar owns the managed warehouse outright. Before the subtraction reached this rung he kept
      # `manage_grants` here, which is the WIDEST grant in the model: `reader from parent` cascades from
      # a warehouse to every namespace and every table beneath it. So the flag locked down everything
      # below and left untouched the one grant that reaches all of it.
      - user: user:oskar
        object: warehouse:beta_bucket
        assertions:
          can_grant_reader: false
          can_grant_writer: false
          can_grant_owner: false
          can_grant_manage_grants: false
          # …and he cannot clear the flag that binds him, for the same reason mona cannot one rung down.
          can_set_managed_access: false
      # He keeps every power that is not granting — the withdrawal is surgical, not a demotion.
      - user: user:oskar
        object: warehouse:beta_bucket
        assertions:
          reader: true
          writer: true
          can_get_metadata: true
      # The records manager is exactly who the flag centralizes granting ON, so she still grants here.
      - user: user:nora
        object: warehouse:beta_bucket
        assertions:
          can_grant_reader: true
          can_grant_owner: true
      # THE ESCAPE HATCH, and the reason `can_administer from project` is required rather than tidy.
      # `can_set_managed_access` is `manage_grants`, so without a path from ABOVE the flag would
      # withdraw the only relation that can clear it and freeze this bucket's access administration
      # forever. frank is project:beta's admin (through team:partners), and he already reached
      # `manage_grants` here via `owner: [...] or admin from project` — so this preserves authority
      # rather than adding any.
      - user: user:frank
        object: warehouse:beta_bucket
        assertions:
          can_grant_reader: true
          can_set_managed_access: true
      # An UNMANAGED warehouse is untouched: root_admin owns lance_catalog and still grants there.
      # Without this the subtraction could be wrong in the other direction and every check above would
      # still pass.
      - user: user:root_admin
        object: warehouse:lance_catalog
        assertions:
          can_grant_reader: true
          can_grant_owner: true
          can_set_managed_access: true

  - name: managed access withdraws the GRANT OPTION too — closing the pass_grants bypass
    check:
      # THE BUG, at the warehouse. `can_grant_reader` is `manage_grants or (reader and pass_grants)`.
      # Subtracting from `manage_grants` alone shut the first branch and left the second wide open, so an
      # owner holding the grant option kept handing out reader/writer/validator inside a scope whose whole
      # purpose is that only the records manager does that. Measured TRUE before this fix.
      - user: user:oskar
        object: warehouse:beta_bucket
        assertions:
          can_grant_reader: false
          can_grant_writer: false
          can_grant_validator: false
          can_grant_owner: false
      # The PURE delegate — reader + grant option, never an owner — so the fix cannot be one that only
      # looks at ownership.
      - user: user:pavel
        object: warehouse:beta_bucket
        assertions:
          pass_grants: false
          can_grant_reader: false
          can_grant_writer: false
      # …and pavel keeps the rung he was actually given. What is withdrawn is the right to HAND OUT
      # access, never access itself.
      - user: user:pavel
        object: warehouse:beta_bucket
        assertions:
          reader: true
          can_get_metadata: true
      # One rung down, where the flag arrives via `from parent`.
      - user: user:mona
        object: namespace:beta_locked
        assertions:
          pass_grants: false
          can_grant_reader: false
          can_grant_writer: false
      # Two rungs down, on the table.
      - user: user:quilla
        object: table:beta_locked_records
        assertions:
          pass_grants: false
          can_grant_reader: false
      - user: user:quilla
        object: table:beta_locked_records
        assertions:
          reader: true
      # THE RECORDS MANAGER still grants — she is who the flag centralizes it on, and her authority is a
      # direct `manage_grants` assignment the subtraction never touches.
      - user: user:nora
        object: warehouse:beta_bucket
        assertions:
          can_grant_reader: true
          can_grant_owner: true
      # THE UNMANAGED CONTROL. alice owns acme_silver, under no managed scope, and holds the grant option
      # there. Without this the subtraction could be blanket — killing the grant option estate-wide — and
      # every assertion above would still pass.
      - user: user:alice
        object: namespace:acme_silver
        assertions:
          pass_grants: true
          can_grant_reader: true
          can_grant_writer: true

  - name: the grant option is withdrawn from ABOVE, never from inside — the direction of the rule
    check:
      # sam OWNS a namespace that carries its own managed_access flag. He keeps both halves of the grant
      # axis, because a scope's own flag constrains what is BENEATH it, not the person who set it —
      # the same "cleared from ABOVE, never from inside" rule `manage_grants` already follows at this
      # rung via `but not managed_access_inheritance from parent`.
      #
      # This is the assertion that makes the direction testable. Every other managed fixture in this
      # file inherits its flag from the warehouse above, where the bare and `from parent` forms evaluate
      # identically — so without this case, writing the wrong one of the two changes nothing and the
      # suite stays green. It did: a mutation swapping them survived until this test existed.
      - user: user:sam
        object: namespace:acme_bronze
        assertions:
          pass_grants: true
          manage_grants: true
          can_grant_reader: true
      # The downward half — that the flag DOES reach a rung below — is already asserted on mona and
      # quilla under beta_bucket, so it is not repeated here. This fixture exists for the direction
      # alone, and stays a single namespace with no table: adding one puts a table into the demo estate
      # that nine seed-sequence assertions count.
