[project]
name = "ray-kit"
version = "0.1.0"
description = "Ray Job SDK + Dashboard HTTP wrapper (schemas, dashboard service, build_client)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    # RayAuthSettings (auth.py) — the RASK_RAY_AUTH_TOKEN / RAY_AUTH_TOKEN env surface.
    "pydantic-settings>=2.5",
    # [default] is required by the Job Submission SDK (JobSubmissionClient);
    # plain `ray` raises "requires the ray[default] installation" at construction.
    "ray[default]>=2.57",
    "requests>=2.31",
    "httpx>=0.27",
    # `propagate` only — submit.trace_env lifts the active span into a job's runtime_env so the
    # distributed trace survives the Ray boundary. The API package, not the SDK: ray-kit emits no
    # telemetry of its own, it only forwards context a caller already established.
    "opentelemetry-api>=1.27",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_kit"]
