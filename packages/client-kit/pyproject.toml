[project]
name = "client-kit"
version = "0.1.0"
description = "Shared code of the lakehouse's own clients (the media app factory, the dataset registry, the rate limiter); the lakehouse imports none of it."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # `client_kit.media.lifespan` attaches the governed auth posture (`service_kit.governed`); `[arrow]` is the platform's
    # input and credential guards (`service_kit.arrow_ipc`, `service_kit.storage_options`).
    "service-kit[governed,arrow]",
    # The stock Lance Namespace SDK a client reaches the catalog's doors through (`lance_namespace.connect("rest")`,
    # pylance's `RestNamespace`); pylance 13.0.0 requires >=0.11.1,<0.12.
    "lance-namespace>=0.11.1,<0.12",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyarrow",
    "pylance[otel]>=13.0.0",
    # `client_kit.lancekit.registry` opens every dataset it serves with a lancedb connection.
    "lancedb>=0.40.0",
]

[project.optional-dependencies]
# Rate limiting is its own extra: metering a route is one client's concern, and a client that wants no limiter pulls no
# slowapi.
ratelimit = [
    "slowapi>=0.1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_kit"]

[tool.uv.sources]
service-kit = { workspace = true }

# The clients' shared kit's own import-layer rule, run by `make lint-imports` beside the lakehouse's `.importlinter`, so it travels with the clients
# when it leaves this repository. A client depends on the lakehouse only through the platform package (`service_kit`) and the
# published doors, never on the kernel only the lakehouse runs (XC-186); the shared kits are root packages here, so a chain
# through one of them into the kernel breaks this contract too.
[tool.importlinter]
root_packages = ["client_kit", "service_kit"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "XC-186: client_kit imports nothing from lakehouse_kit, the lakehouse's kernel, by any chain"
type = "forbidden"
source_modules = ["client_kit"]
forbidden_modules = ["lakehouse_kit"]
