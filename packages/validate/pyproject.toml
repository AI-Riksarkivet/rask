[project]
name = "validate"
version = "0.1.0"
description = "Pre-upload image file validation — TIFF/JPEG/PNG corruption detection + pluggable rules."
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validate"]
