[project]
name = "validate"
version = "0.1.0"
description = "Pre-upload image file validation — TIFF/JPEG/PNG corruption detection + pluggable rules."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validate"]
