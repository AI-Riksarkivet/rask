[project]
site_name = "rask"
site_url = "https://ai-riksarkivet.github.io/rask/"
site_description = "Polyglot monorepo for Riksarkivet HTR + search infrastructure (Rust + Python + Svelte, managed with uv and Bun)."
site_author = "AI-Riksarkivet"
copyright = "Copyright &copy; 2026 AI-Riksarkivet"
repo_url = "https://github.com/AI-Riksarkivet/rask"
repo_name = "AI-Riksarkivet/rask"

nav = [
  { "rask" = [
    "index.md",
  ]},
  { "Getting Started" = [
    { "Quick Start" = "getting-started/index.md" },
    { "Concepts" = "getting-started/concepts.md" },
    { "Configuration" = "getting-started/configuration.md" },
  ]},
  { "Architecture" = [
    { "Overview" = "architecture/index.md" },
    { "Monorepo Layout" = "architecture/layout.md" },
    { "Data Flow" = "architecture/data-flow.md" },
    { "Data Model" = "architecture/data-model.md" },
    { "Deployment" = "architecture/deployment.md" },
    { "Microservices (proposed)" = "architecture/microservices.md" },
    { "Frontend Microfrontends" = "architecture/frontend-microfrontends.md" },
    { "Deep Dives" = [
      { "System Overview" = "architecture/system-overview.md" },
      { "Viewer Backend" = "architecture/viewer-backend.md" },
      { "Viewer Design" = "architecture/viewer-design.md" },
      { "Frontend Monorepo" = "architecture/frontend-monorepo.md" },
    ]},
  ]},
  { "Packages" = [
    { "Overview" = "packages/index.md" },
    { "HTR" = "packages/htr.md" },
    { "Storage" = "packages/storage.md" },
  ]},
  { "Components" = [
    { "Overview" = "components/index.md" },
    { "Apps" = "components/apps.md" },
    { "Services" = "components/services.md" },
    { "UI Components" = "components/ui.md" },
  ]},
  { "Projects" = [
    { "Overview" = "projects/index.md" },
    { "HCP" = "projects/hcp.md" },
    { "Runner" = "projects/runner.md" },
    { "Viewer" = "projects/viewer.md" },
  ]},
  { "Reference" = [
    { "HTR" = "reference/htr.md" },
    { "Storage" = "reference/storage.md" },
    { "Runner" = "reference/runner.md" },
    { "Viewer" = "reference/viewer.md" },
  ]},
  { "Runbooks" = [
    { "LLM Cluster" = "runbooks/llm-cluster.md" },
  ]},
  { "Contributing" = "contributions/CONTRIBUTING.md" },
]

extra_css = ["stylesheets/extra.css"]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
custom_dir = "docs/overrides"
logo = "assets/ra.svg"
favicon = "assets/ra.svg"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "content.footnote.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# ----------------------------------------------------------------------------
# Color palette (light/dark toggle)
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "light-blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "light-blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
# NOTE: Defining any extensions overrides Zensical defaults, so we must
# explicitly list all extensions we need (admonition, tables, toc, etc.).
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# ----------------------------------------------------------------------------
# Plugins — mkdocstrings (auto-generated API reference from source)
# ----------------------------------------------------------------------------
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = [
  "packages/htr/src",
  "packages/storage/src",
  "components/apps/runner/src",
  "components/services/core/src",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_bases = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
show_if_no_docstring = false
inherited_members = false
