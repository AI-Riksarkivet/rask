name: CI

on:
  push:
  pull_request:
  # Nightly, for the supply-chain legs ONLY (see `supply-chain-images` below). Advisory databases move
  # without anyone touching this repo, so a scan that runs only on push answers "was it safe when we
  # last edited it", not "is it safe now" — and the image legs are far too slow to hang off a PR.
  schedule:
    - cron: '0 3 * * *'

# Three pushes inside five minutes each start a full ~29-runner-minute workflow, so two of them were
# already superseded before they finished (measured: runs at 13:43:33, 13:44:35 and 13:48:47 on
# 2026-07-26 all overlapped). Superseded branch and PR runs are wasted work — cancel them.
#
# main is deliberately NOT cancelled. Per-commit green/red on main is the audit trail the whole
# "evidence, not assertion" rule leans on; a cancelled run leaves a commit with no verdict. Runner
# minutes are free on a public repo, the signal is not.
#
# ONE GROUP PER COMMIT ON MAIN, because `cancel-in-progress: false` does not buy that on its own. A
# concurrency group holds at most ONE pending run: when a second run is queued behind a running one,
# the newcomer does not wait its turn, it CANCELS the pending one. Measured 2026-09-24 — five pushes
# to main inside 40 minutes produced `57a53f83` cancelled 4m44s after creation with ZERO jobs ever
# created, and four more like it earlier the same day. The setting was honoured exactly as written and
# the commits still had no verdict, which is the one thing this block exists to prevent. Keying main's
# group by SHA gives every commit a group of its own, so nothing of main's can cancel anything of
# main's; every other ref keeps one group and cancels its own superseded runs.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── THE MICROSERVICE PLANE (ms-*) ─────────────────────────────────────────────────────────────
  # Python: packages/ + services/ + the chart that ships them. The frontend plane is `web-*` and
  # cross-plane integration is `e2e-*`, so a red check names its plane before anyone opens it.
  #
  # These six gates were ONE job with six sequential steps, and that shape hid failures rather than
  # reporting them: a failing step skips every step after it in the same job. On 2026-07-28 the ty
  # gate failed (a bare `uv sync` in .dagger/main.go installed no workspace members) and the run read
  #
  #   success Lint · failure Typecheck · skipped OpenAPI · skipped Tests · skipped Charts · skipped OpenFGA
  #
  # — four gates that never ran, plus the four e2e jobs that hung off `needs: test`. One missing flag
  # blinded EIGHT gates for six days and the only signal was "the test job is red". Split, each gate
  # carries its own verdict and one failure costs exactly one gate.

  # pytest stands alone because it is the only gate the e2e legs actually depend on (`needs: ms-test`
  # below). Inside the matrix, e2e would wait on ruff and formatting to decide whether to run.
  #
  # Runs the whole offline suite (`-m "not e2e and not slow"`), which INCLUDES the claim-lint
  # invariants (tests/unit/test_invariants.py) and the tests/e2e-py collection gate
  # (tests/unit/test_e2e_collection_gate.py) — those gates are folded in here, not lost.
  ms-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh
      # STARTING THE ENGINE IS A NETWORK CALL, and it was failing often enough to make this CI's verdict
      # about the weather. Measured 2026-09-24: four Dagger jobs across two runs died on
      # `start engine: failed to pull image ... read: connection reset by peer` from registry.dagger.io,
      # while that same manifest answered 200 from elsewhere — so the image is fine and the runner's
      # route to it is not. Warming the engine in its own step keeps the retry on the PULL and off the
      # work: a genuine failure still fails on the last attempt, with its own error, and a test that
      # fails is never retried into passing — `ms-charts` proved that half, skipping `dagger call
      # charts` rather than running it against a half-started engine.
      #
      # FIVE ATTEMPTS OVER ~150s, because three over ~30s was measured too short the same day: the
      # same registry answered `504 Gateway Timeout` for longer than that window and took the job
      # with it. The backoff is linear rather than exponential so the ceiling stays legible.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version
      - name: Tests — offline pytest suite, -m "not e2e and not slow" (Dagger)
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call test

      # NO postgres/alembic gate anywhere in this workflow, by design. One used to stand in the old
      # combined job calling `dagger call test-pg` ("alembic upgrade head from zero against a real
      # postgres:16, then the core suite with DATABASE_URL") — but P7a deleted that whole plane (no app
      # DB, no Alembic, no fleet DATABASE_URL; see CLAUDE.md) and the dagger module has no TestPg
      # function to call. It could only ever fail, and it did. The surviving relational store (OpenFGA's
      # Postgres) is proved by the e2e-stack job below.

  # The remaining hermetic gates, one runner each. `fail-fast: false` is the whole point of the matrix
  # here: the default (true) cancels the siblings the moment one leg fails, which would rebuild
  # exactly the blindness this split exists to remove.
  #
  # Every leg is `dagger call <name>` against the module's own functions (.dagger/checks.go, openapi.go,
  # charts.go), so the gate a developer runs locally (`make check`, `make charts`) and the gate CI runs
  # are the same code, not two descriptions of it.
  #   lint      ruff check + ruff format --check
  #   typecheck ty, with error-on-warning
  #   openapi   committed specs vs the live apps — drift fails here
  #   charts    helm lint + full render, the networkPolicy / security-hardening / Dapr-resiliency
  #             `--set` render-and-grep invariants, the prod-overlay HA/security render, and the
  #             promtool alert-rules validate-and-fire proof. `dagger call charts` == `make charts`.
  #   alert-rules-drill
  #             the OTHER half of the alert proof, and it is not a duplicate of the one above.
  #             promtool is PROMETHEUS; vmalert queries GreptimeDB, and the two do not accept the same
  #             PromQL — two rules once shipped that promtool called SUCCESS and GreptimeDB answered
  #             400 and 500, so they could never fire and nothing said so. This boots the SAME
  #             GreptimeDB the observability fixture runs as a Dagger service and replays every expression against
  #             it. An empty store is enough: the drill asserts the endpoint ACCEPTS the query, not
  #             that any series exists.
  #   nats-auth the chart's NATS permission table (`nats.auth.users`) on the chart's own nats-server in
  #             operator mode with test-only keys, and the real daprd the Dapr fixture injects, running the chart's
  #             Components against it: each bus client reaches exactly its own subjects. Hermetic,
  #             public images only. `dagger call nats-auth` == `make nats-auth`.
  ms-gates:
    name: ms-${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # install-from-empty: rask installed onto an empty k3s inside Dagger, fixtures then the product chart, until
        # every workload is Ready ([[XC-133]]); the command a developer runs locally.
        # gitops-from-empty: the same empty k3s, rask installed by a pinned Argo CD from an in-cluster Helm repository
        # serving this tree's chart, then one changed input converging on the next automated sync ([[XC-164]]).
        gate: [lint, typecheck, openapi, charts, alert-rules-drill, go-fmt, nats-auth, install-from-empty, gitops-from-empty]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh
      # STARTING THE ENGINE IS A NETWORK CALL, and it was failing often enough to make this CI's verdict
      # about the weather. Measured 2026-09-24: four Dagger jobs across two runs died on
      # `start engine: failed to pull image ... read: connection reset by peer` from registry.dagger.io,
      # while that same manifest answered 200 from elsewhere — so the image is fine and the runner's
      # route to it is not. Warming the engine in its own step keeps the retry on the PULL and off the
      # work: a genuine failure still fails on the last attempt, with its own error, and a test that
      # fails is never retried into passing — `ms-charts` proved that half, skipping `dagger call
      # charts` rather than running it against a half-started engine.
      #
      # FIVE ATTEMPTS OVER ~150s, because three over ~30s was measured too short the same day: the
      # same registry answered `504 Gateway Timeout` for longer than that window and took the job
      # with it. The backoff is linear rather than exponential so the ceiling stays legible.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version
      - name: dagger call ${{ matrix.gate }}
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call ${{ matrix.gate }}

  # ── SUPPLY CHAIN ──────────────────────────────────────────────────────────────────────────────
  # The gates above judge code WE wrote. These judge what we pull in — the ~1100 third-party packages
  # across the lockfiles, and the base layers the images sit on. Both legs are `dagger call` against
  # .dagger/scan.go, so `make audit` locally and this job are the same code (the ms-gates contract).
  #
  # NEITHER NEEDS A SECRET. osv-scanner and trivy read public advisory data over HTTPS; there is no API
  # key, no token, and nothing to add to repository secrets to make this work.
  #
  # ── continue-on-error IS DELIBERATE, AND IT IS TEMPORARY ──
  # The first run found 38 vulnerabilities (0 Critical, 24 High) and 4 dockerfile misconfigurations.
  # osv-scanner has NO severity threshold — no --fail-on-severity, only `--config` — so ANY finding at
  # ANY severity exits 1. Wired blocking, this job would have been red the hour it landed, on a backlog
  # nobody had triaged, and the only available fix would have been to delete it.
  #
  # Report-only is therefore the honest first state, NOT the intended one. The exit condition is
  # concrete and does not depend on anyone remembering this comment:
  #   1. baseline whatever genuinely cannot move in `osv-scanner.toml`, each entry with a reason and a
  #      review date, and the two DS-0031 false positives in `.trivyignore`
  #      (HF_HUB_DISABLE_IMPLICIT_TOKEN=1 is a DISABLE flag — trivy matches on the name "TOKEN");
  #   2. delete the `continue-on-error` line on THIS job. The gate then blocks on the 39th finding, which
  #      is the only version of this job worth having.
  supply-chain:
    name: supply-chain-${{ matrix.leg }} (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        leg: [audit, scan-config]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh
      # STARTING THE ENGINE IS A NETWORK CALL, and it was failing often enough to make this CI's verdict
      # about the weather. Measured 2026-09-24: four Dagger jobs across two runs died on
      # `start engine: failed to pull image ... read: connection reset by peer` from registry.dagger.io,
      # while that same manifest answered 200 from elsewhere — so the image is fine and the runner's
      # route to it is not. Warming the engine in its own step keeps the retry on the PULL and off the
      # work: a genuine failure still fails on the last attempt, with its own error, and a test that
      # fails is never retried into passing — `ms-charts` proved that half, skipping `dagger call
      # charts` rather than running it against a half-started engine.
      #
      # FIVE ATTEMPTS OVER ~150s, because three over ~30s was measured too short the same day: the
      # same registry answered `504 Gateway Timeout` for longer than that window and took the job
      # with it. The backoff is linear rather than exponential so the ceiling stays legible.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version
      - name: dagger call ${{ matrix.leg }}
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call ${{ matrix.leg }}

  # The one supply-chain leg that BLOCKS, and it blocks because it can afford to.
  #
  # trufflehog verifies: it calls the provider to ask whether a credential actually works. Measured on
  # this repo's history — 36 pattern matches across trufflehog and gitleaks, ZERO verified. So gating on
  # `--results=verified` is green today with nothing baselined and nothing suppressed, and the day it
  # goes red someone has pushed a key that genuinely authenticates. That is worth blocking a merge for;
  # a pattern match is not, which is why the other two legs are report-only.
  #
  # fetch-depth: 0 IS THE WHOLE JOB. This scans GIT HISTORY, and actions/checkout defaults to a depth-1
  # shallow clone — with the default this gate would scan exactly one commit, pass instantly, and report
  # green while seeing none of the history it exists to read. A silently-blind security gate is worse
  # than no gate, because the green check is evidence to everyone who looks at it.
  supply-chain-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh
      # STARTING THE ENGINE IS A NETWORK CALL, and it was failing often enough to make this CI's verdict
      # about the weather. Measured 2026-09-24: four Dagger jobs across two runs died on
      # `start engine: failed to pull image ... read: connection reset by peer` from registry.dagger.io,
      # while that same manifest answered 200 from elsewhere — so the image is fine and the runner's
      # route to it is not. Warming the engine in its own step keeps the retry on the PULL and off the
      # work: a genuine failure still fails on the last attempt, with its own error, and a test that
      # fails is never retried into passing — `ms-charts` proved that half, skipping `dagger call
      # charts` rather than running it against a half-started engine.
      #
      # FIVE ATTEMPTS OVER ~150s, because three over ~30s was measured too short the same day: the
      # same registry answered `504 Gateway Timeout` for longer than that window and took the job
      # with it. The backoff is linear rather than exponential so the ceiling stays legible.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version
      - name: dagger call scan-secrets — trufflehog over the full git history
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call scan-secrets

  # Nightly only — scanning an image means BUILDING it, and the build dwarfs the scan (a web image
  # measured ~90 s). On the PR path that cost buys nothing the `audit` leg did not already report,
  # because the language dependencies inside the image are the same ones the lockfiles pinned. What it
  # DOES add is the layer no lockfile describes: Debian CVEs in the trixie/bun base images.
  #
  # The two deployables: the lakehouse (rest-catalog) and the console (frontend). The development fixtures'
  # images, cnpg-age-ext and marquez, are NOT scanned by this job. Widening it is a matter of adding matrix rows and
  # paying the build minutes.
  #
  # BLOCKING ([[XC-184]]): a fixable HIGH or CRITICAL finding in either image fails the nightly run, so a base image that
  # falls behind is reported the night its fix ships. Both images scanned clean of them on 2026-11-07 (run 42332264184:
  # Debian 13.7 and every Python package of rest-catalog, Debian 13.7 of frontend); an unfixed CVE does not gate
  # (`--ignore-unfixed`, .dagger/scan.go).
  supply-chain-images:
    name: supply-chain-image-${{ matrix.image }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [rest-catalog, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh
      # STARTING THE ENGINE IS A NETWORK CALL, and it was failing often enough to make this CI's verdict
      # about the weather. Measured 2026-09-24: four Dagger jobs across two runs died on
      # `start engine: failed to pull image ... read: connection reset by peer` from registry.dagger.io,
      # while that same manifest answered 200 from elsewhere — so the image is fine and the runner's
      # route to it is not. Warming the engine in its own step keeps the retry on the PULL and off the
      # work: a genuine failure still fails on the last attempt, with its own error, and a test that
      # fails is never retried into passing — `ms-charts` proved that half, skipping `dagger call
      # charts` rather than running it against a half-started engine.
      #
      # FIVE ATTEMPTS OVER ~150s, because three over ~30s was measured too short the same day: the
      # same registry answered `504 Gateway Timeout` for longer than that window and took the job
      # with it. The backoff is linear rather than exponential so the ceiling stays legible.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: dagger call scan-image --name=${{ matrix.image }}
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call scan-image --name=${{ matrix.image }}

  # NOT daggerized — it needs the `fga` CLI + jq rather than the uv/helm/promtool toolchain the Dagger
  # functions carry, so it stays a native step. The OpenFGA authorization model is source-of-truth for
  # who-can, so gate its tests (7 types, concentric rungs, the validator promote gate, create-on-parent)
  # and a model edit cannot silently regress access.
  ms-authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenFGA model test
        run: |
          FGA_V=0.6.4
          curl -fsSL "https://github.com/openfga/cli/releases/download/v${FGA_V}/fga_${FGA_V}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin fga
          # R19 moved this tree: `services/common/auth/` no longer exists, and these four paths
          # pointed at it until 2026-07-28 — so this entire step was failing on a missing file and
          # the authz-model gate had not actually run since the merge. Paths are now the real ones.
          AUTH=packages/lakehouse/src/lakehouse/governed/auth
          # VALIDITY FIRST — and it reads `.is_valid`, not the exit code. Measured with this exact
          # CLI version: `fga model validate` prints `{"is_valid":false,"error":"…"}` and EXITS 0,
          # so a bare call here would run, print the error and pass — a step naming a check it does
          # not perform.
          #
          # The suite below DOES fail on an invalid model (exit 1), so this is not the only thing
          # standing between one and the estate. What it adds: the defect is named as a MODEL defect
          # before the suite runs, instead of as `rpc error: code = Code(2056)` from the test runner;
          # and it covers the path the drift check cannot, since `model transform` exits 0 and emits
          # well-formed JSON for an invalid model — regenerate `model.json` as this file's own header
          # instructs and the two copies agree perfectly while both are invalid.
          fga model validate --file $AUTH/model.fga > /tmp/model.validate.json
          jq -e '.is_valid == true' /tmp/model.validate.json > /dev/null \
            || { echo "model.fga is INVALID:"; cat /tmp/model.validate.json; exit 1; }
          fga model test --tests $AUTH/model.fga.yaml
          # The model exists in three copies (model.fga authored, model.fga.yaml tested above,
          # model.json the app LOADS). CI previously exercised only the yaml copy — a drift between
          # the tested model and the shipped one passed silently. Transform the authored .fga and
          # diff it against the committed .json so drift fails HERE. (jq normalizes key order.)
          fga model transform --file $AUTH/model.fga > /tmp/model.transformed.json
          jq -S . /tmp/model.transformed.json > /tmp/model.a.json
          jq -S . $AUTH/model.json > /tmp/model.b.json
          diff -u /tmp/model.b.json /tmp/model.a.json || { echo "model.json drifted from model.fga"; exit 1; }

  # ── THE FRONTEND PLANE (web-*) ────────────────────────────────────────────────────────────────
  # Everything under frontend/: the console and the packages it builds on.

  # The bun gates — svelte-check (types over the runes store + generated OpenAPI types), unit tests, lint and
  # fmt:check — over the console and its packages. ONE linter and ONE formatter cover every extension: oxlint (with
  # @rsvelte/oxlint-plugin for .svelte) and rsvelte-fmt (which delegates everything that is not .svelte to oxfmt) — see
  # frontend/TOOLING.md. Hermetic in the pinned oven/bun image via the Dagger module (.dagger/frontend.go).
  web-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh
      # STARTING THE ENGINE IS A NETWORK CALL, and it was failing often enough to make this CI's verdict
      # about the weather. Measured 2026-09-24: four Dagger jobs across two runs died on
      # `start engine: failed to pull image ... read: connection reset by peer` from registry.dagger.io,
      # while that same manifest answered 200 from elsewhere — so the image is fine and the runner's
      # route to it is not. Warming the engine in its own step keeps the retry on the PULL and off the
      # work: a genuine failure still fails on the last attempt, with its own error, and a test that
      # fails is never retried into passing — `ms-charts` proved that half, skipping `dagger call
      # charts` rather than running it against a half-started engine.
      #
      # FIVE ATTEMPTS OVER ~150s, because three over ~30s was measured too short the same day: the
      # same registry answered `504 Gateway Timeout` for longer than that window and took the job
      # with it. The backoff is linear rather than exponential so the ceiling stays legible.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version
      - name: Frontend bun gate — svelte-check + unit + lint + fmt (Dagger)
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call frontend

  # Its own job, not a tail of web-gate. The two share no toolchain — this one is browser-bound
  # (chromium + system deps) and needs the workspace installed on the runner, while the gate above runs
  # hermetically in a bun container — and as sequential steps a svelte-check failure skipped the e2e
  # entirely, which is the same failure-hiding shape the ms-* split exists to remove.
  #
  # Hermetic: the console's Playwright suite serves the BUILT app with its upstreams (the catalog, lineage
  # and a mock OIDC issuer) mocked, so the real sign-in, routing and data paths run with no backend.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          # The workspace's own pin (`packageManager`), so `--frozen-lockfile` meets the bun that wrote the lockfile.
          bun-version-file: frontend/package.json

      - name: Install (frozen lockfile)
        working-directory: frontend
        run: bun install --frozen-lockfile

      # INSTALLED BY THE PLAYWRIGHT THE CONSOLE ACTUALLY RUNS, which is why this is not `frontend/`: `@playwright/test`
      # is declared by the app and by nothing at the workspace root, so `bunx` in `frontend/` would fetch the latest
      # from npm and install browsers for a version the suite does not run.
      - name: Install Playwright chromium
        working-directory: frontend/console
        run: bunx playwright install --with-deps chromium

      - name: Playwright e2e — the console (hermetic, upstreams mocked)
        working-directory: frontend
        run: bun run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/console/test-results/
          retention-days: 7

  # THE GUARDED LIVE PROOF (ADR 0001, P0.1: the gap that made every "live-verified" claim in this repo an
  # anecdote). The offline `test` job runs `-m "not e2e"`, so a live suite is guarded only where a lane runs it.
  # This job boots a REAL governed kind stack (Dex OIDC + OpenFGA + Dapr + NATS + RustFS + OpenBao, with the
  # #3-A/#3-B/#4 flags and maintenance on) and runs every tests/e2e-py module it can serve, then Phase 1's
  # acceptance and its soak, failing on any skip (ADR 0167).
  #
  # `make e2e-ci` == this job, byte-for-byte — both shell out to scripts/e2e_stack.sh, so "green in CI"
  # and "green on my machine" cannot diverge.
  # Fork-gated like the other live jobs (no infra guarantees / untrusted docker builds on forked PRs).
  e2e-stack:
    runs-on: ubuntu-latest
    needs: ms-test
    # 70: the bring-up and the suites measured about 10 minutes (run 39032366683), and criterion 5's seven drills each
    # wait out an outage, a restore and a settle window, the secret store's alone up to the signer's 300 s re-read.
    timeout-minutes: 70
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh
      # STARTING THE ENGINE IS A NETWORK CALL, and it was failing often enough to make this CI's verdict
      # about the weather. Measured 2026-09-24: four Dagger jobs across two runs died on
      # `start engine: failed to pull image ... read: connection reset by peer` from registry.dagger.io,
      # while that same manifest answered 200 from elsewhere — so the image is fine and the runner's
      # route to it is not. Warming the engine in its own step keeps the retry on the PULL and off the
      # work: a genuine failure still fails on the last attempt, with its own error, and a test that
      # fails is never retried into passing — `ms-charts` proved that half, skipping `dagger call
      # charts` rather than running it against a half-started engine.
      #
      # FIVE ATTEMPTS OVER ~150s, because three over ~30s was measured too short the same day: the
      # same registry answered `504 Gateway Timeout` for longer than that window and took the job
      # with it. The backoff is linear rather than exponential so the ceiling stays legible.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Linux-only lockfile)
        run: uv sync --frozen --all-packages --all-groups

      - name: Install Helm
        uses: azure/setup-helm@v4

      # The script drives kind/kubectl/helm/fga out of .localbin (same as every make target), so the
      # toolchain bootstrap is the repo's own — not a CI-only fork that can drift from local behavior.
      - name: Bootstrap the pinned toolchain into .localbin
        run: make bootstrap

      # NO DISK RECLAIM. Deleting the runner's preinstalled toolchains took 1.5 min of this lane's budget, and the room it
      # bought is not needed: measured 2026-10-16, the runner's root is 145G with 100G free after that delete, while the
      # kind node and the two side-loaded images fit in a few GB. The headroom is printed so a smaller runner is visible.
      - name: Runner disk headroom
        run: df -h / | tail -1

      # The images `scripts/e2e_stack.sh` keeps across runs: those whose dockerfile copies nothing from the checkout, each
      # filed under the hash of its dockerfile and of the script that writes the archive, so a change to either rebuilds it.
      - name: Restore the kept image builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/rask-e2e-images
          key: e2e-images-${{ hashFiles('.docker/*.dockerfile', 'scripts/dagger-image.sh') }}
          restore-keys: e2e-images-

      - name: Live e2e — governed kind stack, every module it can serve, Phase 1's acceptance and soak
        run: make e2e-ci

  # THE LAKEHOUSE LANES RUN IN CI: a lane that runs nowhere reports nothing when it rots. Measured
  # 2026-09-24, outside CI, `rustfs-lifecycle` and `governance-chain` had broken 17 and 18 days before, on
  # three unrelated estate-wide changes: a fail-closed auth assert (`start ... (aliased as catalog): exit
  # code: 3`), a shared identity default repointed at the chart estate, and an event shape one of two
  # ingest doors never learned. In CI those fixes stay fixed; the unit gates that ship with them catch the
  # next one before a build, and this catches what a unit gate cannot see.
  #
  # FOUR PROOFS, one per seam: `smoke-rustfs` that `lakehouse.storage` works against a real S3
  # backend rather than moto, `rustfs-lifecycle` that the catalog is S3-AGNOSTIC (its lifecycle with
  # the bytes on a RustFS service bound to one exec), `rustfs-provisioning` that the provisioning hook
  # fails on a policy the store refuses and leaves the stored one, and `governance-chain` that authorization
  # and catalog->lineage provenance hold together with real Dex tokens and no hand-written tuple. All
  # four are pure `dagger call`, so `make <lane>` and this job are the same code — the ms-gates
  # contract every other leg here holds.
  e2e-lakehouse-lanes:
    runs-on: ubuntu-latest
    needs: ms-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        lane: [governance-chain, rustfs-lifecycle, rustfs-provisioning, smoke-rustfs]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.8 BIN_DIR=/usr/local/bin sh

      # STARTING THE ENGINE IS A NETWORK CALL — see e2e-stack for the measurement. The retry stays
      # on the PULL and off the work, so a lane that genuinely fails is never retried into passing.
      - name: Warm the Dagger engine (a transient registry pull is retried, the work is not)
        env:
          DAGGER_NO_NAG: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if dagger core version; then exit 0; fi
            echo "!! engine start failed (attempt $attempt/5) — retrying" >&2
            sleep $((attempt * 15))
          done
          dagger core version

      - name: dagger call ${{ matrix.lane }}
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call ${{ matrix.lane }}
