name: Documentation

# PUBLISH ONLY — never on a push, never on a pull request.
#
# This ran on every push to main, and every run FAILED: `bun install` at the repo root died with
# "Bun could not find a package.json file to install from", because the JS/TS plane moved under
# `frontend/` and this workflow kept the pre-split paths. Four consecutive red runs of ~30 s each were
# sitting on main when this was fixed (2026-08-07) — pure noise on every commit, and noise that had
# been red long enough to stop being read.
#
# Docs deployment is a RELEASE act, not a per-commit one: it force-pushes a built site to `gh-pages`,
# so tying it to every push means the public site tracks whatever landed last rather than what was
# published. `workflow_dispatch` for an on-demand rebuild, `release: published` for the real thing.
on:
  workflow_dispatch:
  release:
    types: [published]
permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Build Zensical docs (with mkdocstrings for auto-generated API reference)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: 3.x
      - run: pip install zensical mkdocstrings-python
      - run: zensical build --clean

      # Build Storybook (component-lib) and embed in docs site
      - name: Install Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          bun-version: latest
      # `frontend/` is the JS/TS workspace ROOT — its own package.json + bun.lock. There is no
      # package.json at the repo root, which is exactly what killed every previous run. Using
      # `working-directory` rather than `bun --cwd=frontend` on purpose: the `--cwd <path>` form with a
      # space silently no-ops in bun, and one wrong form here is another 30-second red run nobody reads.
      - name: Install dependencies
        working-directory: frontend
        run: bun install
      - name: Build Storybook
        working-directory: frontend/packages/ui
        run: bun run build-storybook
      - name: Copy Storybook into docs site
        run: cp -r frontend/packages/ui/storybook-static site/storybook

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: _preview
