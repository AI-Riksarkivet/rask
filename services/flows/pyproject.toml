[project]
name = "flows"
version = "0.1.0"
description = "the flows service — the studio flow-builder's server half: a declared node catalog, pure graph validation, and run execution (inline in v0, Dapr Workflow when a sidecar is present)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # [governed] because `flows.security` imports `service_kit.governed.deps` → `.fga` — openfga-sdk,
    # pyjwt and friends live behind that extra. The bare "service-kit" is enough for the local venv
    # (another workspace member pulls openfga-sdk in) and NOT enough for the image, whose venv is
    # `uv sync --package flows` alone — the exact crash-loop the ingest door already paid for.
    "service-kit[governed]",
    "httpx>=0.27",
    "uvicorn>=0.30",
    # The durable lane. A run is a topological fan-out over nodes that call models — exactly the
    # shape Dapr Workflow makes replayable — and it executes in the daprd sidecar the chart already
    # injects, on the actor state store that already exists (the same argument that carried the
    # adoption for `ingest`). Scaffolded here, load-bearing in-cluster.
    "dapr-ext-workflow>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flows"]

[tool.uv.sources]
service-kit = { workspace = true }
