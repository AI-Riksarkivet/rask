[project]
name = "annotator"
version = "0.1.0"
description = "Media-plane annotator API — annotation save/commit/versioning and tags over Lance tables."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "lance-common",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pylance[otel]>=9.0.0",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotator"]

[tool.uv.sources]
lance-common = { workspace = true }
