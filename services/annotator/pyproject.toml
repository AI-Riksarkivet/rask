[project]
name = "annotator"
version = "0.1.0"
description = "The annotator: a labeling tool that works on the lakehouse through its public doors, with its own release, state and roles."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "service-kit[lancekit,governed]",
    # The media app factory and lifespan the annotator is built on, and the dataset registry it reads.
    "client-kit",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pylance[otel]>=13.0.0",
    "pyarrow",
    # The actor host. `dapr.actor` ships inside `dapr` (already a service-kit dep), but the FastAPI
    # integration that mounts the /dapr/* actor routes is its own distribution — declared by lineage,
    # medallion and catalog, and MISSING here until 2026-07-28. It imported anyway under
    # `uv sync --all-packages`, which is what a dev venv does; `uv sync --frozen --package annotator`,
    # which is what .docker builds, would not have installed it.
    "dapr-ext-fastapi>=1.18.1",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotator"]

[tool.uv.sources]
client-kit = { workspace = true }
service-kit = { workspace = true }

# The annotator's own import-layer rule, run by `make lint-imports` beside the lakehouse's `.importlinter`, so it
# travels with the annotator and the lakehouse's contracts name no annotator module.
[tool.importlinter]
root_packages = ["annotator", "service_kit", "client_kit"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "importing annotator.projects pulls in no lancekit / registry"
type = "forbidden"
source_modules = ["annotator.projects.machines", "annotator.projects.models", "annotator.projects.ontology"]
forbidden_modules = ["service_kit.lancekit", "client_kit.lancekit"]
