[project]
name = "viewer"
version = "0.1.0"
description = "Media-plane viewer API — documents, blob columns and Range-streamed media over Lance tables."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "service-kit[lancekit]",
    "storage",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pylance[otel]>=10.0.0",
    "lance-graph>=0.5.4",
    "pyarrow",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewer"]

[tool.uv.sources]
service-kit = { workspace = true }
storage = { workspace = true }
