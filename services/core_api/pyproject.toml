[project]
name = "core-api"
version = "0.1.0"
description = "core-api backend — health + EAD catalog search over the transitional core husk (the batches/chunks estate died at P7a)."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "service-kit",
    "core[migrations,postgres]",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_api"]

[tool.uv.sources]
service-kit = { workspace = true }
core = { workspace = true }
