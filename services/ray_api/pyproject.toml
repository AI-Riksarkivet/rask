[project]
name = "ray-api"
version = "0.1.0"
description = "the ray service — Ray dashboard introspection + Ray Serve proxy over ray-kit (uv member stays ray-api: a `ray` package would shadow PyPI ray)."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "service-kit",
    "ray-kit",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_api"]

[tool.uv.sources]
service-kit = { workspace = true }
ray-kit = { workspace = true }
