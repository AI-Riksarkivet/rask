[project]
name = "notifications"
version = "0.1.0"
description = "the notifications service — the estate's targeted inbox: one InboxActor per subject holding claim-check pointers with durable per-subject read state, so the bell counts YOUR work rather than everyone's."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # [governed] because the inbox door verifies the bearer and re-derives visibility through
    # `service_kit.governed.deps` → `.fga`, and the actor id comes from `service_kit.governed.user_state`
    # — openfga-sdk, pyjwt, httpx and lance-namespace all live behind that extra. The bare
    # "service-kit" resolves in the LOCAL venv (another workspace member pulls openfga-sdk in) and NOT
    # in the image, whose venv is `uv sync --frozen --package notifications` alone: that is the exact
    # crash-loop the ingest door and then the flows door each paid for once.
    "service-kit[governed]",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    # The actor host. `dapr.actor` ships inside `dapr` (already a service-kit dependency), but the
    # FastAPI integration that mounts the sidecar's /dapr/* callback routes — and the DaprApp that
    # declares the subscriptions — is its own distribution, which is what `annotator` shipped without.
    "dapr-ext-fastapi>=1.18.1",
]
# Deliberately NOT `dapr-ext-workflow`: nothing in this plane mints an id mid-saga, so there is no
# command sequence to replay and the engine is not earned (open_notifications D6). Delivery is made
# safe by natural keys instead — the id a run already has, checked before the write.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifications"]

[tool.uv.sources]
service-kit = { workspace = true }
