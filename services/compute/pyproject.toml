[project]
name = "compute"
version = "0.1.0"
description = "the compute service — Ray dashboard introspection + Ray Serve proxy over ray-kit (R22: `compute` aligns service ↔ zone ↔ plane; import `compute` shadows nothing)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # [governed], not the bare "service-kit". `compute.security` imports `service_kit.governed.deps` ->
    # `.fga`, and openfga-sdk / pyjwt live behind that extra. The bare name is enough for the LOCAL
    # venv — another workspace member pulls openfga-sdk in — and NOT enough for the image, whose venv
    # is `uv sync --package compute` alone. The failure is a clean one and still cost a build: the
    # dockerfile's import gate refuses the image rather than shipping a pod that crash-loops on its
    # first request. Same lesson `flows` and the ingest door already paid for.
    "service-kit[governed]",
    "ray-kit",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute"]

[tool.uv.sources]
service-kit = { workspace = true }
ray-kit = { workspace = true }
