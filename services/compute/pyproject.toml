[project]
name = "compute"
version = "0.1.0"
description = "the compute service — Ray dashboard introspection + Ray Serve proxy over ray-kit (R22: `compute` aligns service ↔ zone ↔ plane; import `compute` shadows nothing)."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "service-kit",
    "ray-kit",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute"]

[tool.uv.sources]
service-kit = { workspace = true }
ray-kit = { workspace = true }
