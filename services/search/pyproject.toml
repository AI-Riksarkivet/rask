[project]
name = "search"
version = "0.1.0"
description = "Media-plane search API — FTS, vector and hybrid lookups over Lance tables."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # [governed] because `search.api.security` and `search.core.config` import `service_kit.governed`, which needs
    # openfga-sdk and tenacity. The image's venv is `uv sync --package viewer --package search` alone, so a transitive dep
    # from another workspace member is present locally and ABSENT in the image — the dockerfile's import gate catches
    # it, but only after a build. Same trap compute and controlplane paid for on 2026-08-26.
    "service-kit[governed]",
    # [ratelimit] because `search.core.rate_limit` imports `client_kit.rate_limit` -> slowapi, for the same reason.
    "client-kit[ratelimit]",
    # The chart launches this service under `opentelemetry-instrument` (chart/templates/explorer.yaml), whose distro
    # installs the SDK's providers at start; without it the launcher installs none (measured 2026-10-24).
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pylance[otel]>=13.0.0",
    "lancedb>=0.40.0",
    "pillow>=12.3.0",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search"]

[tool.uv.sources]
client-kit = { workspace = true }
service-kit = { workspace = true }

# Search's own import-layer rule, run by `make lint-imports` beside the lakehouse's `.importlinter`, so it travels with search
# when it leaves this repository. A client depends on the lakehouse only through the platform package (`service_kit`) and the
# published doors, never on the kernel only the lakehouse runs (XC-186); the shared kits are root packages here, so a chain
# through one of them into the kernel breaks this contract too.
[tool.importlinter]
root_packages = ["search", "service_kit", "client_kit"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "XC-186: search imports nothing from lakehouse_kit, the lakehouse's kernel, by any chain"
type = "forbidden"
source_modules = ["search", "client_kit"]
forbidden_modules = ["lakehouse_kit"]
