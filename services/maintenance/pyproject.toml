[project]
name = "maintenance"
version = "0.1.0"
description = "Lance table maintenance — compaction, index optimization, old-version cleanup and cross-store drift reconciliation, as one ordered pass per dataset."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "service-kit[governed,lakehouse]",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "pylance[otel]>=9.0.0",
    "pyarrow",
    "dapr>=1.18.1",
    "opentelemetry-api>=1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance"]

[tool.uv.sources]
service-kit = { workspace = true }
