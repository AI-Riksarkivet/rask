[project]
name = "maintenance"
version = "0.1.0"
description = "Lance table maintenance — compaction, index optimization, old-version cleanup and cross-store drift reconciliation, as one ordered pass per dataset."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # Signs the lineage events the sweep publishes ([[LH-064]]); the verifier in `services/lineage`
    # uses the same module, so both sides share one definition of what was signed.
    "lineage-kit",
    "service-kit[governed,lakehouse]",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "pylance[otel]>=12.0.0",
    # Imported directly (the plan door's spec error codes), so declared rather than inherited.
    "lance-namespace>=0.11.0,<0.12",
    "pyarrow",
    "dapr>=1.18.1",
    "opentelemetry-api>=1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance"]

[tool.uv.sources]
lineage-kit = { workspace = true }
service-kit = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

# Size and call-shape limits for this service's source. Its sweep and compaction are the code whose
# failure modes delete data, and these keep each operation a sequence of named phases rather than one
# body: at most 40 statements and 4 nested blocks per function. A helper takes at most three positional
# parameters, because two parameters a caller cannot tell apart at the call site must be keyword-only
# (a retention count passed where a fragment size belongs type-checks).
# PLR1702 is a preview rule, and so is PLR0917 under the ruff the pre-commit hook pins (0.15.13), so
# preview is on for this directory; explicit-preview-rules enables only the preview rules named in full.
[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = ["PLR0915", "PLR1702", "PLR0917"]

[tool.ruff.lint.pylint]
max-statements = 40
max-nested-blocks = 4
max-positional-args = 3

# The limits are for the source. A test function's positional parameters are its fixtures, and a route
# handler's are its dependency declaration: FastAPI resolves them by annotation, and nothing calls a
# route by position.
[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["PLR0915", "PLR1702", "PLR0917"]
"src/maintenance/api/routes.py" = ["PLR0917"]
