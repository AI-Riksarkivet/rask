[project]
name = "medallion"
version = "0.1.0"
description = "Medallion service — bronze/silver/gold producer and movers: Dapr pub/sub events, Lance writes, and the Ray Jobs REST submit seam."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "service-kit[governed,lakehouse]",
    "storage",
    "lineage-kit",
    # The generic Ray submitter (R2). It moved OUT of this service so `compute` — the execution
    # plane — can start jobs without importing the medallion; the wrappers here still use it.
    "ray-kit",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openfga-sdk>=0.9",
    "pillow>=12.3.0",
    "pyarrow",
    "pylance[otel]>=9.0.0",
    "lance-namespace>=0.9.0",
    "dapr>=1.18.1",
    "dapr-ext-fastapi>=1.18.1",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-grpc>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion"]

[tool.uv.sources]
service-kit = { workspace = true }
storage = { workspace = true }
lineage-kit = { workspace = true }
# Every workspace member used as a dependency needs its source pinned here too — uv refuses to
# resolve the WHOLE workspace otherwise ("included as a workspace member, but is missing an entry
# in tool.uv.sources"), so one missing line takes down `uv run` for every package, not just this one.
ray-kit = { workspace = true }
