[project]
name = "compaction"
version = "0.1.0"
description = "Lance maintenance sweep — a Dapr cron binding ticks compact_files + cleanup_old_versions across the lakehouse bucket."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "lance-common",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "pylance[otel]>=9.0.0",
    "pyarrow",
    "dapr>=1.18.1",
    "opentelemetry-api>=1.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compaction"]

[tool.uv.sources]
lance-common = { workspace = true }
