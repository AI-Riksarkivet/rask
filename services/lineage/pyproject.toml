[project]
name = "lineage"
version = "0.1.0"
description = "Lineage service — the authenticated OpenLineage intake, the commit feed and the table-level edge list as Lance tables the catalog governs, and a forwarder to a bring-your-own graph backend."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # The lakehouse's library: the spec's REST client the feed is read and written through (the catalog's own `query` and
    # `merge_insert` doors, `lineage.services.provenance`), and the producer-signature seam ([[LH-064]]):
    # `services/signature.py` verifies an event's Ed25519 signature with `lakehouse.lineage.signing`, so the verifier
    # shares the producer's definition of what was signed (canon-1, the facet's members).
    "lakehouse",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "lance-namespace>=0.11.0,<0.12",
    "dapr>=1.18.1",
    "dapr-ext-fastapi>=1.18.1",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage"]

[tool.uv.sources]
lakehouse = { workspace = true }
