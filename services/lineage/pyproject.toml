[project]
name = "lineage"
version = "0.1.0"
description = "Lineage service — the authenticated OpenLineage intake, the commit feed and the table-level edge list as Lance tables the catalog governs, and a forwarder to a bring-your-own graph backend."
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    # The lakehouse's library: the spec's REST client the feed is read and written through (the catalog's own `query` and
    # `merge_insert` doors, `lineage.services.provenance`), and the producer-signature seam ([[LH-064]]):
    # `services/signature.py` verifies an event's Ed25519 signature with `lakehouse.events.signing`, so the verifier
    # shares the producer's definition of what was signed (canon-1, the facet's members).
    "lakehouse",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "lance-namespace>=0.13.0,<0.14",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage"]

[tool.uv.sources]
lakehouse = { workspace = true }

# The service's layers, run by `make lint-imports` (ADR 0224). The app (`main`) assembles the doors; the doors (`api`: the
# routes, the ingest lane, the relay, the authorizer) call the services; the services (the feed, the consumer, the
# forwarder, the signature check) read and build the OpenLineage models and the response schemas; and those stand on
# `core`, the settings, the metrics, the external-source rule and the refusal types every layer raises or counts. Each
# layer imports only those below it, function-local imports included, and the models and the schemas import neither
# each other. `exhaustive` makes a new top-level module name its layer here before the contract passes.
[tool.importlinter]
root_package = "lineage"

[[tool.importlinter.contracts]]
id = "lineage-imports-down-its-layers"
name = "ADR 0224: lineage imports down its layers, main over api over services over the models and schemas over core"
type = "layers"
containers = ["lineage"]
layers = ["main", "api", "services", "models | schemas", "core"]
exhaustive = true
