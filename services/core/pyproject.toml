[project]
name = "core"
version = "0.1.0"
description = "Core transitional husk — EAD catalog search + health (retires with the R6/R20 media wave; the batches/orchestrator estate died at P7a)."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "service-kit",
    "storage",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "lancedb>=0.20",
]

[project.scripts]
core = "core.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.uv.sources]
service-kit = { workspace = true }
storage = { workspace = true }
