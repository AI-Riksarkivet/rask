[project]
name = "ingest"
version = "0.1.0"
description = "the ingest service — pre-bronze acquisition as a platform plane: a source-agnostic control API, JetStream-queued unit workers, and the lander that commits ONE Lance version through the catalog."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # [governed] because `ingest.auth` imports `service_kit.governed.fga` — openfga-sdk, pyjwt and
    # lance-namespace live behind that extra so the base library stays dependency-light. The bare
    # "service-kit" here was enough for the local venv (another workspace member pulls openfga-sdk in)
    # and NOT enough for the image, whose venv is `uv sync --package ingest` alone: the door landed in
    # a pod that crash-looped on `ModuleNotFoundError: No module named 'openfga_sdk'`.
    "service-kit[governed]",
    "lineage-kit",
    "storage",
    "validate",
    "httpx>=0.27",
    "uvicorn>=0.30",
    # The run orchestrator (docs/adr/0036-ingest-orchestration-dapr-workflow-is-adopted-the-estate-is.md "Ingest orchestration — Dapr Workflow IS adopted").
    # Executes in the daprd sidecar the chart already injects, on the actor state store that already
    # exists — no new infrastructure, which is most of why it was adopted.
    "dapr-ext-workflow>=1.18",
    # The work queue is a DIRECT nats-py pull consumer, not a Dapr subscription — a documented
    # exception (open_ingest.md "Client choices"). WorkQueuePolicy retention, batch fetch, nak(delay)
    # and in_progress heartbeats are work-queue semantics the Dapr pubsub component cannot express,
    # and they are exactly what makes the stream the outstanding-work ledger.
    "nats-py>=2.15",
    # The lander writes Lance directly (fragments + one commit). Pinned to the version §7.11 verified.
    "pylance>=12.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.uv.sources]
service-kit = { workspace = true }
lineage-kit = { workspace = true }
storage = { workspace = true }
validate = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

# The ROOT banned-api map, restated, then this service's own bans. A nested banned-api table replaces
# the root one rather than merging with it (measured, ruff 0.16.0: a child declaring one ban stopped
# enforcing the root's), so every root ban is repeated here and a ban added to the root map is added
# here too. The root per-file ignores still apply under this directory (measured).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses.dataclass".msg = "Structured values are pydantic BaseModel (CLAUDE.md, writing-python)."
"boto3".msg = "Build S3/STS clients through storage.s3_client / storage.sts_client: a raw boto3 client carries no timeouts."
"lance.write_dataset".msg = "Lance is written only at the registered write doors (catalog dataplane, ingest lander, medallion compute/ingest)."
"lance.fragment.write_fragments".msg = "Lance is written only at the registered write doors (catalog dataplane, ingest lander, medallion compute/ingest)."
"catalog.services.warehouses.put_warehouse".msg = "An unconditional registry put lifts a quarantine; write through the conditional (CAS) path."
"catalog.services.projects.put_project".msg = "An unconditional registry put lifts a quarantine; write through the conditional (CAS) path."
"service_kit.dapr_publish.publish_event".msg = "A publish site is registered deliberately (a line-level noqa): a direct publish skips the outbox or the bounded timeout."
"signal.signal".msg = "SIGTERM is taken only by service_kit.draining; a second handler replaces the drain."
"pyarrow.ipc.open_stream".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.open_file".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.RecordBatchStreamReader".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.RecordBatchFileReader".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.MessageReader".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_message".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_record_batch".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.ipc.read_schema".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.RecordBatchStreamReader".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.RecordBatchFileReader".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"pyarrow.feather".msg = "Decode an Arrow IPC body only through service_kit.lancekit.arrow_ipc: it bounds and validates what a caller sends."
"service_kit.lancekit.arrow_ipc.decode_arrow_response".msg = "Only the catalog /query reader may skip the size bound."
"dapr.actor.ActorProxy".msg = "Build an actor proxy through the service's proxies module: it translates the wire method names."
"service_kit.governed.user_state.encode_subject".msg = "An inbox actor id is derived only in notifications.proxies."
"service_kit.governed.fga.write_tuples".msg = "Tuple grants happen only at the registered granting sites."
"service_kit.governed.fga.grant_on_create".msg = "Tuple grants happen only at the registered granting sites."
"service_kit.governed.fga.seed_ownership".msg = "Tuple grants happen only at the registered granting sites."
"service_kit.governed.fga.provision".msg = "Only the registered bootstrap may provision an OpenFGA store/model."
"service_kit.governed.fga.delete_tuples".msg = "Tuple revokes happen only at the registered revoking sites."
"service_kit.governed.fga.revoke_object_tuples".msg = "Tuple revokes happen only at the registered revoking sites."
"service_kit.governed.fga.hierarchy_edge_tuples".msg = "Hierarchy edges are seeded only by fga.py and medallion train."
"torch".msg = "No model framework in a shared seam: models live in sealed runners/."
"pyannote".msg = "No model framework in a shared seam: models live in sealed runners/."
"nats".msg = "The broker appears only in ingest.queue (the queue seam)."
"ray_kit.await_success".msg = "Poll a Ray job through the shared submit-or-reattach kernel."
"os.getenv".msg = "Declare the value on IngestSettings (config.py)."
