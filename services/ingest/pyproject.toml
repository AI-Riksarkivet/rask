"httpx.Client".msg = "Use ingest.http.shared_client(): one pooled client with explicit timeouts."

# http.py IS the shared pool, so the whole module is the sanctioned httpx.Client site.
[tool.ruff.lint.extend-per-file-ignores]
"src/ingest/http.py" = ["TID251"]  # httpx.Client: the shared pool
