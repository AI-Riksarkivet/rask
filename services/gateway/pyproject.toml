[project]
name = "gateway"
version = "0.1.0"
description = "API gateway — path-routes /api/* to the per-domain backends."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "service-kit",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    # `gateway.config` — the front door's own settings model. `python-dotenv` was here for the
    # `load_dotenv()` that `_routes()` used to call; pydantic-settings reads `.env` itself, so the
    # direct dependency went with the call (FLEET-ENV-SCATTER).
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.uv.sources]
service-kit = { workspace = true }
