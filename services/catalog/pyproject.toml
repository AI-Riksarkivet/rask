[project]
name = "catalog"
version = "0.1.0"
description = "Lance Namespace REST catalog — namespaces/tables/branches/tags over native Lance, plus STS credential vending."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # The lakehouse's library: the storage internals, the auth plane, the control lane and the events this service runs
    # on, and the lineage signing seam ([[LH-064]]) the verifier in `services/lineage` shares, so both sides hold one
    # definition of what was signed.
    "lakehouse",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyarrow",
    "pylance[otel]>=14.0.3",
    "lance-namespace>=0.13.0,<0.14",
    # >=0.10.4 with `lakehouse`: the shared FGA write path rides `on_duplicate_writes=IGNORE`.
    "openfga-sdk>=0.10.4",
    # Declared for the `botocore.exceptions` imports (`ClientError` handling in the credentials door
    # and the warehouse registry). Every CLIENT — S3 and STS alike — is built by `lakehouse.storage`.
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.uv.sources]
lakehouse = { workspace = true }

# The catalog's import contracts, run by `make lint-imports` (ADR 0224). The service's layers: the app (`main`)
# assembles the doors and the lifespan; the doors (`api`: the routes, the authorization, the request's dependencies,
# the control lane, the governed create's sequence and the boot-time converges) call the services; the services (the
# table operations, the registries and records under the control root, erasure, maintenance, the reconcilers) read and
# answer with the request and response models (`schemas`, with the types a service shares with them); and those stand
# on `core`, the settings, the identifiers, the backend namespace, the write judge, the vending and base judges, and how
# Lance's failures read. Each layer imports only those below it, function-local imports included. `exhaustive` makes a
# new top-level module name its layer here before the contract passes. Lance's failures read as the spec's refusals
# (`core.lance_refusals`) are the floor a caller's expression is bounded on (`core.query_bounds`): the bound reads a
# caller's SQL through the refusal that answers it, and no refusal asks a bound. The table operations
# (`services.tables`) import one way: the doors' operations (writes, schema changes, a rename, a table's retirement, a registration) over the commit path,
# a table's creation, its destruction, its reads and its refs, which share nothing, over what a committed version says.
# The authorization modules (`api.authz`) import one way: the router's guard over the doors it judges (the write judge,
# grant authority, a handler's own gates, a listing's visible page, an object's and a warehouse's grants), over the
# decision asked and audited and the hierarchy's guards, over what a name resolves to and what a request carries, over
# the rung each door asks.
[tool.importlinter]
root_package = "catalog"

[[tool.importlinter.contracts]]
id = "catalog-imports-down-its-layers"
name = "ADR 0224: the catalog imports down its layers, main over api over services over schemas over core"
type = "layers"
containers = ["catalog"]
layers = ["main", "api", "services", "schemas", "core"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "catalog-lance-refusals-are-the-floor"
name = "ADR 0224: a caller's expression is bounded on top of how Lance's failures read"
type = "layers"
layers = ["catalog.core.query_bounds", "catalog.core.lance_refusals"]

[[tool.importlinter.contracts]]
id = "catalog-table-operations-import-one-way"
name = "ADR 0224: the catalog's table operations import one way, the doors' operations over the commit path and creation over what a version says"
type = "layers"
containers = ["catalog.services.tables"]
layers = [
    "writes | schema | rename | retirement | registering",
    "commits | creation | destroy | reads | refs",
    "hidden_branches",
    "versions",
]
exhaustive = true

[[tool.importlinter.contracts]]
id = "catalog-authorization-imports-one-way"
name = "ADR 0224: the catalog's authorization modules import one way, the router's guard over the judged doors over the decisions over the objects and the request over the rungs"
type = "layers"
containers = ["catalog.api.authz"]
layers = [
    "route_guard",
    "write_doors | grant_authority | door_gates | visible_pages | object_grants | warehouse_grants",
    "decisions | hierarchy",
    "objects | request_reads",
    "rungs | context",
]
exhaustive = true
