[project]
name = "catalog"
version = "0.1.0"
description = "Lance Namespace REST catalog — namespaces/tables/branches/tags over native Lance, plus STS credential vending."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # The lakehouse's library: the storage internals, the auth plane, the control lane and the events this service runs
    # on, and the lineage signing seam ([[LH-064]]) the verifier in `services/lineage` shares, so both sides hold one
    # definition of what was signed.
    "lakehouse",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyarrow",
    "pylance[otel]>=13.0.0",
    "lance-namespace>=0.11.0,<0.12",
    # >=0.10.4 with `lakehouse`: the shared FGA write path rides `on_duplicate_writes=IGNORE`.
    "openfga-sdk>=0.10.4",
    # Declared for the `botocore.exceptions` imports (`ClientError` handling in the credentials door
    # and the warehouse registry). Every CLIENT — S3 and STS alike — is built by `lakehouse.storage`.
    "boto3>=1.35",
    "dapr>=1.18.1",
    "dapr-ext-fastapi>=1.18.1",
    "opentelemetry-instrumentation-grpc>=0.65b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.uv.sources]
lakehouse = { workspace = true }
