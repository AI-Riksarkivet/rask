[project]
name = "catalog"
version = "0.1.0"
description = "Lance Namespace REST catalog — namespaces/tables/branches/tags over native Lance, plus STS credential vending."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "lance-common",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyarrow",
    "pylance[otel]>=9.0.0",
    "lance-namespace>=0.9.0",
    "openfga-sdk>=0.9",
    "boto3>=1.34",
    "dapr>=1.18.1",
    "dapr-ext-fastapi>=1.18.1",
    "opentelemetry-instrumentation-grpc>=0.65b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.uv.sources]
lance-common = { workspace = true }
