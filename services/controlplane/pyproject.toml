[project]
name = "controlplane"
version = "0.1.0"
description = "controlplane — read-only Project CR listing for the platform home picker."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    # [governed], not the bare "service-kit". `controlplane.security` imports `service_kit.governed.deps` ->
    # `.fga`, and openfga-sdk / pyjwt live behind that extra. The bare name is enough for the LOCAL
    # venv — another workspace member pulls openfga-sdk in — and NOT enough for the image, whose venv
    # is `uv sync --package controlplane` alone. The failure is a clean one and still cost a build: the
    # dockerfile's import gate refuses the image rather than shipping a pod that crash-loops on its
    # first request. Same lesson `flows` and the ingest door already paid for.
    "service-kit[governed]",
    "kubernetes>=31",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane"]

[tool.uv.sources]
service-kit = { workspace = true }
