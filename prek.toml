[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  # chart/templates are Helm templates ({{ … }}), not parseable as plain YAML.
  # chart/crds-bootstrap is a VENDORED upstream CRD bundle — legitimately multi-document
  # (`---`-separated), which this hook rejects by default, and not ours to reformat.
  { id = "check-yaml", exclude = "^chart/(templates|crds-bootstrap)/" },
  { id = "check-toml" },
  # Lockfiles are legitimately large and MUST be committed — the root uv.lock is already
  # 501 KB and only slips past because this hook checks newly-added files by default.
  { id = "check-added-large-files", exclude = "(^|/)(uv\\.lock|bun\\.lock)$" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.13"
hooks = [
  { id = "ruff-format" },
  { id = "ruff", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.3.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["feat", "fix", "docs", "refactor", "test", "chore", "perf", "ci", "build", "revert"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty-check"
name = "ty type check"
# `env -u VIRTUAL_ENV` is load-bearing in a WORKTREE, and its absence made this gate check the wrong
# source tree. `uvx` honours an inherited VIRTUAL_ENV, and a shell activated in the main checkout
# keeps pointing there after `cd` into a worktree — so ty resolved every workspace package from the
# MAIN checkout's editable installs while reading the worktree's own files. Measured 2026-08-05: a
# commit in `rask-ingest` failed with `Module service_kit.governed.dapr_auth has no member
# is_public_caller`, citing `/home/blackwell/Desktop/rask/packages/...` — a symbol that exists in the
# worktree and not in main. Both failure directions are real: phantom errors for anything added in
# the worktree, and silence for anything it broke. uv itself warns about the mismatch and ignores the
# variable; uvx does not, so the gate has to drop it explicitly.
entry = "env -u VIRTUAL_ENV uvx ty check"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "no-co-authored-by-claude"
name = "reject Co-Authored-By Claude"
entry = "sh -c '! grep -qi \"co-authored-by.*claude\" \"$1\"' --"
language = "system"
stages = ["commit-msg"]
