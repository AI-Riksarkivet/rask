# The advisories `dagger call audit` (osv-scanner) knows and does not fail on, each with why it cannot move yet and the
# date it is judged again. Every other finding, at any severity, fails the gate ([[XC-202]]): a new advisory is fixed in
# the change that meets it, or recorded here with its reason and its date.

# The Dagger module's OpenTelemetry log exporters and SDK. `dagger develop` writes the `replace` directives in .dagger/go.mod
# that hold them at v0.16.0 for github.com/dagger/otel-go (engine v0.21.8), so they move with an engine upgrade, never by
# hand. The module runs only inside the Dagger engine; no shipped image carries it.
[[IgnoredVulns]]
id = "GO-2026-6508"
ignoreUntil = 2027-02-12
reason = "otlploggrpc 0.16.0 is pinned by the Dagger Go SDK's replace directives; it moves with the engine upgrade. CI tooling only."

[[IgnoredVulns]]
id = "GO-2026-4985"
ignoreUntil = 2027-02-12
reason = "otlploghttp 0.16.0 is pinned by the Dagger Go SDK's replace directives; it moves with the engine upgrade. CI tooling only."

[[IgnoredVulns]]
id = "GO-2026-6615"
ignoreUntil = 2027-02-12
reason = "otel sdk/log 0.16.0 is pinned by the Dagger Go SDK's replace directives; it moves with the engine upgrade. CI tooling only."

# The same pin holds the rest of the module's OpenTelemetry back: with otel, trace and sdk at 1.47.0 (this advisory's
# fix), otel/log at the replace's v0.16.0 imports otel/internal/global in a cycle and the module does not build (measured
# 2026-11-15, go 1.27.1). It moves with the engine upgrade (v0.21.8 now, v0.21.11 released).
[[IgnoredVulns]]
id = "GHSA-q7gw-24fr-5p69"
ignoreUntil = 2027-02-12
reason = "otel sdk, sdk/log and trace 1.45.0 are held by the Dagger Go SDK's replace of otel/log at v0.16.0, which import-cycles with otel 1.47.0; they move with the engine upgrade. CI tooling only."

