# The advisories `dagger call audit` (osv-scanner) knows and does not fail on, each with why it cannot move yet and the
# date it is judged again. Every other finding, at any severity, fails the gate ([[XC-202]]): a new advisory is fixed in
# the change that meets it, or recorded here with its reason and its date.

# The Dagger module's OpenTelemetry log exporters and SDK. `dagger develop` writes the `replace` directives in .dagger/go.mod
# that hold them at v0.16.0 for github.com/dagger/otel-go (engine v0.21.8), so they move with an engine upgrade, never by
# hand. The module runs only inside the Dagger engine; no shipped image carries it.
[[IgnoredVulns]]
id = "GO-2026-6508"
ignoreUntil = 2027-02-12
reason = "otlploggrpc 0.16.0 is pinned by the Dagger Go SDK's replace directives; it moves with the engine upgrade. CI tooling only."

