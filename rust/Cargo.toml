[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# The Arrow major lance 13 builds on, so a crate that later reads a table through `lance` shares its arrays.
arrow-array = "58"
arrow-ipc = "58"
arrow-schema = "58"
axum ={ version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
ed25519-dalek = "2"
http-body-util = "0.1"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
percent-encoding = "2"
# rustls over the platform's trust store; a private issuer's CA replaces that store for its own fetches.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: an event is stored as the JSON it arrived as, members in the order sent. `unbounded_depth`: an
# envelope's nesting is bounded by the lane's own count (`delivery::envelope_of`), not by the parser's.
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
