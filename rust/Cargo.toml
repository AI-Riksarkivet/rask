[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# The Arrow major lance 13 builds on, so a crate that later reads a table through `lance` shares its arrays.
arrow-array = "58"
arrow-ipc = "58"
arrow-schema = "58"
arrow-select = "58"
# The bus client over rustls with the aws-lc provider reqwest also uses. No JetStream helpers: every JetStream call the
# lakehouse makes is a request on a subject its bus user is granted, written out where it is made.
async-nats = { version = "0.52", default-features = false, features = ["aws-lc-rs", "nuid"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22"
# Calendar time for a SigV4 stamp and a listing's `LastModified`; already in the lock through the Arrow crates.
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
http-body-util = "0.1"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
percent-encoding = "2"
# OpenTelemetry's SDK and its OTLP/HTTP protobuf exporter, without its HTTP clients or gRPC: the one client that sends an
# export is lakehouse-core's own, so the projected token is read for each export (ADR 0237).
async-trait = "0.1"
bytes = "1"
http = "1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "metrics", "logs"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
prost = { version = "0.14", default-features = false, features = ["std"] }
# The XML an S3 store and its STS answer in, read into typed structs.
quick-xml = { version = "0.38", features = ["serialize"] }
# rustls over the platform's trust store; a private issuer's CA replaces that store for its own fetches.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: an event is stored as the JSON it arrived as, members in the order sent. `unbounded_depth`: an
# envelope's nesting is bounded by the lane's own count (`delivery::envelope_of`), not by the parser's.
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }

# Debug builds keep line tables for this workspace's own code and no debug info for dependencies: a test binary links
# every dependency, and with full debug info the build directory ran past 13 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
