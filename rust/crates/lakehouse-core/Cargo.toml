[package]
name = "lakehouse-core"
version = "0.1.0"
description = "What every lakehouse service runs on. Depends on no Lance crate."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
jsonwebtoken = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
percent-encoding = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["use_pem"] }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
rcgen ={ version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["io-util", "test-util"] }
tower = { workspace = true }

[lints]
workspace = true
