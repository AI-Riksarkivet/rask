# Dex dev OIDC provider for the SQLite auth stack (static, in-memory).
# TWO users so the e2e can prove app-side seeding grants the creator access AND
# a second principal with no grant gets 403:
#   alice@example.com / password   (the namespace/table creator -> seeded owner)
#   bob@example.com   / password   (holds no grant -> denied)
# Both share the same bcrypt hash of "password"; bcrypt verifies against the
# plaintext only (no username binding), so reusing the hash is correct.
# Token audience = the audience client "rask-lakehouse" (RASK_OIDC_AUDIENCE), which the sign-in client "rask-web" asks for.
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  passwordConnector: local
  skipApprovalScreen: true
staticClients:
  - id: rask-web
    name: Web zones
    public: true
    redirectURIs:
      - http://localhost:2333/auth/callback
  # The lakehouse's audience (RASK_OIDC_AUDIENCE): Dex issues a token for it only to the client it trusts, asked with
  # `audience:server:client_id:rask-lakehouse`. Confidential, with a secret no client is given, so nobody signs in as it.
  - id: rask-lakehouse
    name: Lakehouse
    secret: rask-lakehouse-held-by-no-client
    trustedPeers: [rask-web]
enablePasswordDB: true
staticPasswords:
  - email: alice@example.com
    hash: "$2b$10$BP/xHXQM78bAKb09HQLIjuryXCFo72R5DQJITLd5Nql0KCU2zib/."
    username: alice
    userID: alice
  - email: bob@example.com
    hash: "$2b$10$BP/xHXQM78bAKb09HQLIjuryXCFo72R5DQJITLd5Nql0KCU2zib/."
    username: bob
    userID: bob
