# Governance end-to-end overlay: the full dataops/governance loop in one stack.
#
# Layers on TOP of the base + auth + lineage overlays so you get, together:
#   catalog (OIDC + OpenFGA authz)  +  lineage service (OpenLineage -> Apache AGE)
# and turns ON the catalog -> lineage emission so a table create records its *verified*
# creator in the lineage graph. This is what makes "who created/changed what, governed by
# who-may + versioned-by-Lance" verifiable end to end (see scripts/governance_e2e.sh).
#
#   docker compose \
#     -f .docker/docker-compose.yml \
#     -f .docker/docker-compose.auth.yml \
#     -f .docker/docker-compose.lineage.yml \
#     -f .docker/docker-compose.governance.yml up -d
#
# Note: the lineage service runs with its own auth OFF here (the demo focuses on catalog
# authz + provenance authorship). In production, enable LINEAGE_OIDC_ENABLED +
# LINEAGE_FGA_ENABLED and pin LINEAGE_FGA_STORE_ID/MODEL_ID to the catalog's store — the catalog
# forwards the caller's bearer on emit (services/catalog/core/lineage_emit.py), so create events are accepted.
services:
  server:
    environment:
      # Best-effort, fire-and-forget emission to the lineage service on table create.
      LANCE_LINEAGE_EMIT_ENABLED: "true"
      LANCE_LINEAGE_URL: http://lineage-api:8000/api/v1/lineage

  lineage-api:
    image: lance-rest-catalog:dev   # same image as the catalog (now ships the lineage service too)
    build:
      context: ..
      dockerfile: .docker/rest-catalog.dockerfile
    container_name: lance-lineage-api
    init: true
    read_only: true
    tmpfs:
      - /tmp
    command: ["uvicorn", "lineage.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      lineage-postgres:
        condition: service_healthy
    environment:
      LINEAGE_DATABASE_URL: postgresql://lineage:lineage@lineage-postgres:5432/lineage
      LINEAGE_GRAPH: lineage
    # The image bakes a HEALTHCHECK on the catalog's port 2333; override it for the lineage port.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez').read()"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      # Host port is overridable (DEMO_LINEAGE_PORT) to avoid clashing with a local service on 8000.
      - "${DEMO_LINEAGE_PORT:-8000}:8000"
