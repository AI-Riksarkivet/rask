# Run from repo root:  docker compose -f .docker/docker-compose.yml up -d --build
# Build context is the repo root (..), so .dockerignore and pyproject/uv.lock apply.
services:
  server:
    build:
      context: ..
      dockerfile: .docker/rest-catalog.dockerfile
    image: lance-rest-catalog:dev
    container_name: lance-rest-catalog
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      LANCE_REST_IMPL: dir
      LANCE_REST_ROOT: s3://lance-catalog
      LANCE_NS_DELIMITER: "$$"            # $$ -> literal $ in compose
      # NO OBJECT STORE SHIPS IN THIS FILE: the upstream MinIO images refuse anonymous pulls, and the
      # estate's own store image is built by Dagger (`.docker/minio.dockerfile`) for the chart. Point
      # these at an S3 endpoint you run, with the `lance-catalog` bucket already created.
      LANCE_S3_ENDPOINT: ${LANCE_S3_ENDPOINT:-}
      LANCE_S3_ACCESS_KEY_ID: ${LANCE_S3_ACCESS_KEY_ID:-}
      LANCE_S3_SECRET_ACCESS_KEY: ${LANCE_S3_SECRET_ACCESS_KEY:-}
      LANCE_S3_REGION: us-east-1
      LANCE_S3_VIRTUAL_HOSTED: "false"
      # --- Auth is OFF by default. Uncomment to enforce OIDC (Dex) + OpenFGA authz.
      #   The openfga/postgres/dex services below provide the infra.
      # RASK_OIDC_ENABLED: "true"
      # RASK_OIDC_ISSUER: http://dex:5556/dex
      # RASK_OIDC_AUDIENCE: lance-catalog
      # RASK_FGA_ENABLED: "true"
      # RASK_FGA_API_URL: http://openfga:8080
    ports:
      - "2333:2333"

  # --- OpenFGA authorization (Postgres-backed) ---
  fga-postgres:
    image: postgres:16
    container_name: lance-fga-postgres
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    volumes:
      - fga-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga"]
      interval: 5s
      timeout: 3s
      retries: 20

  openfga-migrate:
    image: openfga/openfga:v1.18.3
    container_name: lance-openfga-migrate
    command: migrate
    depends_on:
      fga-postgres:
        condition: service_healthy
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@fga-postgres:5432/openfga?sslmode=disable

  openfga:
    image: openfga/openfga:v1.18.3
    container_name: lance-openfga
    command: run
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@fga-postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
    ports:
      - "8080:8080"   # HTTP API
      - "3000:3000"   # Playground (dev only)

  # --- Dex OIDC provider (static config; dev IdP) ---
  dex:
    image: ghcr.io/dexidp/dex:v2.42.0
    container_name: lance-dex
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ./dex.config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"

volumes:
  fga-postgres-data:
