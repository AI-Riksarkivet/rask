# Dex dev OIDC provider (static, in-memory). Logins: alice@example.com / bob@example.com,
# both password "password" (a second identity lets the e2e prove a 403 for an ungranted user).
# Token audience = the static client id "lance-catalog" (set LANCE_OIDC_AUDIENCE to match).
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  passwordConnector: local
  skipApprovalScreen: true
staticClients:
  - id: lance-catalog
    name: Lance Catalog
    public: true
    redirectURIs:
      - http://localhost:2333/auth/callback
enablePasswordDB: true
staticPasswords:
  - email: alice@example.com
    hash: "$2b$10$BP/xHXQM78bAKb09HQLIjuryXCFo72R5DQJITLd5Nql0KCU2zib/."
    username: alice
    userID: alice
  - email: bob@example.com
    hash: "$2b$10$BP/xHXQM78bAKb09HQLIjuryXCFo72R5DQJITLd5Nql0KCU2zib/."
    username: bob
    userID: bob
