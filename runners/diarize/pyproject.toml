# The `diarize` runner — pyannote speaker diarization (who-spoke-when).
# pyannote arrives transitively via easytranscriber today; declared first-class here
# so the runner env is self-describing for the per-stage runtime_env.
[project]
name = "ratch-runner-diarize"
version = "0.0.0"
description = "Speaker-diarization runner (pyannote) — Ray Data actor via runners/diarize/actor.py."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyannote.audio",
    "torch==2.11.0+cu128",
    "torchaudio==2.11.0+cu128",
]

[tool.uv]
package = false

# The cu128 wheels live only on the pytorch index (local-version pins are not on
# PyPI). ratch's runner_env() turns these urls into pip --extra-index-url options
# for the per-stage runtime_env, so the env declaration stays entirely in-file.
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
