# rask .hadolint.yaml
# Install: cp .claude/skills/dockerfile/templates/hadolint.yaml .hadolint.yaml
# Hadolint config — paired with the dockerfile skill at .claude/skills/dockerfile/.

ignored: []

# DL3026 matches the parsed REGISTRY SEGMENT only (==/glob), never the image path.
# rask's FROM images are all on docker.io (python, nvidia/cuda, oven/bun, nginxinc);
# uv is pulled via COPY --from=ghcr.io/... which DL3026 does NOT inspect. So listing
# image paths like `nvidia/cuda` here is a silent no-op — only the host needs trusting.
trustedRegistries:
  - docker.io
  - ghcr.io

failure-threshold: warning

# No label-schema: rask sets OCI labels from ARG values (e.g. "${VERSION}"), which
# hadolint validates as literal strings at lint time — semver/rfc3339 validators would
# falsely fail (DL3056/DL3053) on the un-interpolated "${...}".

# Override-comment workflow: when a rule MUST be ignored, use:
#   # hadolint ignore=DLxxxx
#   # Reason: <why this case is justified>
#   RUN ...
# Reviewers gate merges on the reason being plausible.
