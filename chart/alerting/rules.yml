# Alert rules for the Lance-lakehouse estate — evaluated by vmalert against GreptimeDB's PromQL endpoint
# (:4000/v1/prometheus), routed by Alertmanager. Deployed by chart/templates/alerting.yaml when
# observability.alerting.enabled. Seeded from the Perses panels already labelled "alertable" — every metric
# below is one this estate actually emits. Proven to FIRE on synthetic series by rules_test.yml
# (`make alert-rules-check` → promtool). The live datasource round-trip is a drill (see docs/DECISIONS.md "P3b").
# The point: these turn SILENT failures (data quietly stops flowing) into a page. See docs/runbooks/RUNBOOK-oncall.md.
groups:
  - name: lance-lineage
    rules:
      - alert: LineageOutboxNotDraining
        expr: max(outbox_depth) > 0
        for: 10m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage outbox not draining (depth > 0 for 10m)"
          description: >-
            Durable lineage events are staged but not published — provenance is not reaching the AGE graph.
            The relay, lineage, or the NATS bus is unhealthy. Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # `_seconds`, and the suffix is the whole rule. The instrument declares `unit="s"`, and the
      # OTLP->Prometheus exporter APPENDS the unit — so the series is `outbox_oldest_age_seconds` and a
      # rule naming the bare form matches nothing and can never fire. Verified against the live store's
      # information_schema: `outbox_oldest_age_seconds` exists, `outbox_oldest_age` does not. The gate
      # could not have caught it either, because it read only the service's own metrics.py while this
      # instrument lives in service_kit's shared outbox module — both halves fixed together.
      - alert: LineageOutboxBacklogAging
        expr: max(outbox_oldest_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage outbox oldest staged event > 5 min old"
          description: >-
            The outbox relay is lagging; the oldest undrained event exceeds 300s.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      - alert: LineageIngestDeadLettering
        expr: sum(rate(lineage_events_processed_total{lance_lineage_outcome="dead_lettered"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage ingest dead-lettering — provenance is being LOST"
          description: >-
            A lineage event exhausted its Dapr resiliency schedule and was parked (a terminal loss signal).
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

  - name: lance-catalog
    rules:
      - alert: CatalogWritesShedSustained
        expr: sum(rate(catalog_writes_shed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Catalog shedding writes for 15m — persistently over write-concurrency capacity"
          description: >-
            The catalog has been returning 429 on bulk Arrow-IPC writes (the concurrent-write cap, P5
            load-shedding) for 15m — it is persistently over capacity, not just riding out a burst. Scale
            catalog replicas or raise LANCE_MAX_CONCURRENT_WRITES (watch the pod memory: each write buffers
            up to 256MiB). Runbook: docs/runbooks/RUNBOOK-oncall.md

  - name: lance-medallion
    rules:
      - alert: MedallionCascadeDeadLettering
        expr: sum(rate(medallion_dlq_parked_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: medallion
        annotations:
          summary: "Medallion cascade dead-lettering — a stage delivery gave up"
          description: >-
            A cascade delivery exhausted its retries and was parked; a dataset has silently stopped updating.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      # THE RUN-LEVEL VERDICT, and the reason it cannot come from Dapr's own family.
      # `dapr_runtime_workflow_execution_count_total` carries a `status` label, and for this codebase it
      # is FALSE: all three workflow services convert failure into a RETURNED value rather than raising,
      # so the orchestrator completes normally and the sidecar records status="success". Measured across
      # the live estate — every app_id holds `success` and nothing else, including runs whose ACTIVITIES
      # the sidecar separately labels `failed`. An alert on that label reads green while every run dies.
      - alert: MedallionStageOutcomesFailing
        expr: sum(rate(medallion_stage_outcome_total{lance_medallion_verdict!="succeeded"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: medallion
        annotations:
          summary: "Medallion stage runs are ending badly — failed, abandoned or unnotified"
          description: >-
            A stage watch reached a terminal verdict other than `succeeded`. `abandoned` means the job was
            still RUNNING at the watch ceiling — not a failure, but the estate stopped looking; `unnotified`
            means the outcome reached the graph and no person. Split by `lance_medallion_verdict` to tell
            them apart. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      - alert: MedallionStageDenied
        expr: sum(rate(medallion_stage_denied_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: medallion
        annotations:
          summary: "Medallion stage FGA-denied — the cascade may stall at this stage"
          description: >-
            A mover lacked the grant to write its target stage; re-seed with scripts/seed_medallion_fga.sh.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

  - name: lance-infra
    rules:
      # The infra-tier signal — a Dapr consumer-wedge. Dapr records the OUTCOME of every inbound pub/sub
      # delivery as dapr_component_pubsub_ingress_count{process_status=...}: a healthy consumer books
      # `success`; a handler that returns RETRY (its work keeps failing) books `retry` on every redelivery.
      # So a sustained rate of process_status="retry" is the wedge — the subscription is not draining.
      # (NOT dapr_resiliency_count, which is flat regardless of outcome, nor dapr_resiliency_activations_total,
      # which Dapr 1.18 doesn't emit — both verified live on the cluster.) A healthy transient error retries
      # then succeeds, so the 15m `for` rides out blips. NOTE the `_total` suffix: the OTel Collector's
      # prometheus receiver normalizes counters, so the Dapr `..._count` exposition lands in GreptimeDB as
      # `..._count_total` (verified live — the un-suffixed name returns nothing). The Collector scrapes the
      # sidecars into GreptimeDB, so this fires on a real wedge.
      - alert: DaprConsumerWedge
        expr: sum by (app_id) (rate(dapr_component_pubsub_ingress_count_total{process_status="retry"}[5m])) > 0
        for: 15m
        labels:
          severity: critical
          service: dapr
        annotations:
          summary: "Dapr consumer wedged — a subscriber is retrying inbound messages for 15m"
          description: >-
            A subscriber's handler has failed continuously: Dapr has booked process_status=retry on inbound
            deliveries for 15m without clearing, so this consumer is not draining its subscription and the
            cascade / lineage ingest has silently stopped. A healthy transient error clears in seconds. Check
            the wedged app's logs and its downstream (AGE / OpenFGA / RustFS). Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

  - name: lance-notifications
    rules:
      # The notification plane's three ops signals. All three are about the plane going QUIET, which is
      # the failure mode a notification system cannot detect for itself: nobody reports a notification
      # they never received, so silence has to be alerted on rather than waited for.

      # 1. The DLQ filling. `dlq.notifications` is this app's OWN parking subject (a per-app DLQ, so a
      #    park counted here belongs to this plane and not to a neighbour sharing a subTopic). A park
      #    means the sidecar's whole retry schedule was exhausted, so this is not "one delivery was
      #    slow" — it is a notification that will now never arrive unless someone replays it.
      - alert: NotificationsDeadLettering
        expr: sum(rate(notifications_dlq_parked_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: notifications
        annotations:
          summary: "Notifications are dead-lettering — deliveries are being parked, not retried"
          description: >-
            The notifications service has parked messages on dlq.notifications for 10m: the sidecar's full
            retry schedule was exhausted, so these notifications will not arrive without a replay. Check the
            inbox actor plane (lance-statestore reachable? actors registered?) and OpenFGA.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      # 2. The INBOX ACTOR TURN QUEUE. Single-activation is the plane's lock, which means every call for
      #    one subject serializes — so anything slow INSIDE a turn (a channel send, an FGA round-trip)
      #    backs up that subject's whole queue. `dapr_runtime_actor_pending_actor_calls` is the only
      #    series that shows it, and it is the reason S5's channel push is a decision worth watching
      #    rather than assuming: a push inside the turn holds the turn.
      - alert: InboxActorTurnQueueBacklog
        expr: max(dapr_runtime_actor_pending_actor_calls{actor_type="InboxActor"}) > 10
        for: 2m
        labels:
          severity: warning
          service: notifications
        annotations:
          summary: "InboxActor turn queue is backing up — one subject's notifications are serializing"
          description: >-
            More than 10 calls are queued against a single InboxActor for 2m. Turn-based concurrency means
            they run one at a time, so something inside a turn is slow — most likely a channel send (SMTP or
            the Slack webhook) or an unhealthy state store. Notifications for that subject are delayed, not
            lost. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      # 3. The RECONCILER GONE QUIET — the one that catches a plane which looks healthy and is not.
      #    The feed lane covers every producer that emits lineage over HTTP only (ingest, Ray TRAIN,
      #    external OpenLineage), and its two silent failure modes both leave a Ready pod: the service
      #    identity is not in lineage's allowlist (every tick 403s, and a 403 is deliberately not
      #    retried), or it is admitted and granted nothing (every tick runs clean and reconciles zero).
      #    Either way the cron ticks and the counter never moves. Absence is the signal, so this alerts
      #    on the RATE being zero rather than on any error.
      #    THE LABEL NAME IS DERIVED, NOT CHOSEN. The instrument attribute is `lance.notifications.lane`
      #    (metrics.py), and the OTel→Prometheus translation turns dots into underscores — so the series
      #    carries `lance_notifications_lane`, not `lane`. A selector on `lane` matches nothing, which
      #    means the rule would evaluate `sum(rate(<empty>)) == 0` and either never fire or fire always,
      #    depending on how the backend treats an empty vector. Synthetic proofs cannot catch this class
      #    on their own: the test supplies whatever series the author writes, so the series in
      #    rules_test.yml has to be labelled from the instrument rather than from the rule.
      - alert: NotificationsReconcilerStalled
      #    ABSENT IS NOT ZERO. `== 0` evaluates over an EMPTY vector once the series ages out, and it
      #    ages out exactly when the emitting pod dies — so the alert goes silent at the moment it is
      #    most needed, and its silence is indistinguishable from health. The estate already solved this
      #    once for the scheduler (`absent(dapr_scheduler_sidecars_connected)`) and never generalised it.
      #
      #    ...and then generalised it in a form the production engine REFUSES. `<expr> or absent(<expr>)`
      #    is valid PromQL, promtool passes it, and GreptimeDB answers HTTP 400 for this one and HTTP 500
      #    for the maintenance twin below — so from the day the absent() half was added to the day it was
      #    split (2026-08-23) NEITHER rule could fire at all. The correct shape is the scheduler's own:
      #    a bare absent() in its OWN rule. Pinned by test_no_alert_rule_combines_absent_with_a_set_operator.
        expr: sum(rate(notifications_ingress_events_total{lance_notifications_lane="feed"}[30m])) == 0
        for: 30m
        labels:
          severity: warning
          service: notifications
        annotations:
          summary: "The notifications /events reconciler has processed nothing for 30m"
          description: >-
            The feed lane has ingested no events for 30m. On an idle estate that is correct; on a busy one it
            means the reconciler is running and seeing nothing — check that RASK_LINEAGE_SERVICE_IDENTITY is
            in lineage's LINEAGE_SERVICE_SUBJECTS allowlist AND that the subject holds grants on the datasets
            it should see. A reconciler that is admitted but ungranted runs perfectly and reconciles zero.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      # The absence half of the rule above. Separate rule, not an `or` branch — see the note there.
      # This is the one that survives the reconciler pod dying: `== 0` cannot fire over a vector that
      # no longer exists, so without this the estate's most-needed alert is its quietest.
      - alert: NotificationsReconcilerMetricsMissing
        expr: absent(notifications_ingress_events_total{lance_notifications_lane="feed"})
        for: 30m
        labels:
          severity: warning
          service: notifications
        annotations:
          summary: "The notifications feed lane has stopped reporting entirely"
          description: >-
            No `notifications_ingress_events_total` series for the feed lane exists at all. That is not an
            idle estate — an idle reconciler still emits a zero-valued counter. Either the pod is gone, its
            OTLP export is broken, or the lane label changed. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

  # T5 — the maintenance sweep's FAILURE surface. Until 2026-08-16 this service had seven metric
  # instruments and not one counted a failure, so a dataset failing on every tick forever was
  # indistinguishable from a healthy estate on every surface that can raise an alarm: the error reached
  # OTel as a span status and one aggregate `maintenance_sweep` log line, and vmalert evaluates PromQL,
  # so neither could ever page. A real sweep failed on 11 datasets that day and nothing said so.
  - name: lance-maintenance
    rules:
      - alert: MaintenanceDatasetsFailing
        expr: sum(increase(compaction_datasets_failed_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Table maintenance is failing on one or more datasets"
          description: >-
            The sweep could not complete one or more datasets. Sustained failure means those datasets
            accumulate fragments and superseded versions indefinitely while every tick still reports a
            successful run. Break down by error.type; the per-dataset URI is on the trace span and in
            the maintenance_sweep log line, deliberately not on the metric (unbounded cardinality).

      # The sweep is the only thing that reclaims storage. It stopping is silent by construction: no
      # error is raised, the cron simply never fires or the pass dies before completing.
      - alert: MaintenanceSweepNotCompleting
      # ABSENT IS NOT ZERO — same reasoning as the notifications reconciler above. A sweep pod that has
      # died stops emitting `compaction_runs_total` entirely, and a bare `== 0` over an empty vector
      # cannot fire, so the one thing that reclaims storage stops silently AND its alert goes quiet with it.
      # The absence half is now its own rule below: GreptimeDB answers HTTP 500 to the composite form.
        expr: sum(increase(compaction_runs_total[30m])) == 0
        for: 30m
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "No table-maintenance sweep has COMPLETED in 30 minutes"
          description: >-
            At a 120s cadence roughly fifteen passes should have completed. Either the Dapr cron binding
            is not delivering or every pass is dying mid-flight — compare with
            compaction_runs_started_total, whose excess over compaction_runs_total is the lost-pass count.

      # The absence half. A sweep pod that has DIED emits no compaction_runs_total at all, and the
      # `== 0` above cannot fire over a vector that does not exist.
      - alert: MaintenanceSweepMetricsMissing
        expr: absent(compaction_runs_total)
        for: 30m
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "The maintenance sweep has stopped reporting entirely"
          description: >-
            No `compaction_runs_total` series exists. The sweep pod is gone or its OTLP export is broken.
            Storage reclamation has stopped and nothing else in this file can tell you.

      # `SUPPORTED` is a whitelist, so a pylance upgrade that introduces a legitimate new manifest flag
      # makes the sweep refuse datasets it used to maintain — and refusals are NOT errors, so nothing
      # else in this file would fire. Measured 2026-08-16: 17 refused datasets were exactly the ones
      # that needed compaction, and the estate looked healthy throughout.
      - alert: MaintenanceRefusalsRising
        expr: sum(increase(compaction_datasets_refused_total[1h])) > sum(increase(compaction_datasets_swept_total[1h])) / 2
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "More than half of swept datasets are being REFUSED"
          description: >-
            The supported-manifest-flag whitelist is rejecting most of the estate, so maintenance is
            running without maintaining. Usually a pylance upgrade introducing a flag the guard does not
            know. Check the refusal reasons in the maintenance_sweep log line.

  - name: dapr-control-plane
    rules:
      # THE REMINDER FAILURE DOMAIN, which nothing watched.
      #
      # Since Dapr 1.15 actor REMINDERS live in the scheduler's own etcd, not in the actor state store
      # — confirmed on this estate: `dapr-scheduler-server` is a 3-replica StatefulSet with a 16 Gi
      # etcd PVC. So reminders can be lost INDEPENDENTLY of the state they bound, and `ActorStateTTL`
      # is off here, so there is no TTL backstop underneath them.
      #
      # The symptom of a lost reminder is SILENCE — a lease that never expires, a publish that never
      # re-drives, an inbox that never compacts. Nothing fails; work simply stops happening. That is
      # why this alerts on the SERVING side rather than waiting for a downstream symptom.
      #
      # `dapr_scheduler_sidecars_connected` is the ONLY Dapr-specific metric the scheduler exposes —
      # verified against a live pod, where the other 38 families are Go runtime and process metrics —
      # and it is the right one: it counts the sidecars the scheduler can actually serve, so zero means
      # no reminder can fire for ANY actor in the estate.
      #
      # THIS RULE WAS UNFIREABLE UNTIL THE SCRAPE LANDED WITH IT. The collector's `dapr-sidecars` job
      # keeps only pods annotated `dapr.io/enabled=true`; a control-plane pod carries
      # `dapr.io/control-plane=<component>` instead, so the scheduler was never scraped at all. A rule
      # on an unscraped series is a green gate over nothing — the `dapr-control-plane` scrape job in
      # otel-collector.yaml is half of this fix, not an optimisation beside it.
      - alert: DaprSchedulerServingNoSidecars
        expr: max(dapr_scheduler_sidecars_connected) == 0
        for: 5m
        labels:
          severity: critical
          service: dapr
        annotations:
          summary: "The Dapr scheduler is serving ZERO sidecars — no actor reminder can fire"
          description: >-
            Reminders live in the scheduler's etcd (Dapr >= 1.15), so with no sidecars connected every
            reminder-bounded behaviour silently stops: the annotator's lease reminder never expires, the
            publish watchdog never re-drives, the InboxActor never compacts. Nothing errors — work just
            stops. Check `kubectl get pods -l app=dapr-scheduler-server` and the etcd PVCs; a rollback or
            PVC loss here is not recoverable from the state store, which holds no copy of the reminders.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled
      # WORKFLOW ACTIVITY FAILURES — writable with no first-party instrumentation at all, and unwritten
      # until now. This is the one workflow family whose `status` label is TRUE: an activity that
      # exhausts its retries raises into the orchestrator, so the sidecar sees a real failure. Measured
      # live: ingest/ensure_dataset/failed = 4, by name, while the RUN-level counter for the same runs
      # held only `success`.
      #
      # `increase() > 0` shaped on purpose. A `== 0` shape evaluates over an empty vector once the series
      # ages out and goes silent exactly when the emitting pod dies — the class being retrofitted
      # elsewhere in this file. These families are also LAZILY REGISTERED: a sidecar that has run no
      # workflow omits them entirely, so absence here means "nothing ran", not "nothing failed".
      - alert: WorkflowActivitiesFailing
        expr: sum(increase(dapr_runtime_workflow_activity_execution_count_total{status="failed"}[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: dapr
        annotations:
          summary: "Dapr workflow activities are failing — a lane is burning its retries"
          description: >-
            One or more activities exhausted their retry policy. Group by `activity_name` and `app_id` to
            find which lane. Note the activity SPAN cannot corroborate this: the SDK wraps the call in a
            span but swallows the exception inside it, so every activity span is STATUS_CODE_UNSET even
            when this counter says failed. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      # THE WEDGED `continue_as_new` DETECTOR. The workflow engine drives each orchestration turn through
      # its own internal actor type, so reminder fires climbing while executions stay flat IS a watch loop
      # that will never terminate — a Ray job that never ends, a poll that never sees a terminal status.
      #
      # `unless` rather than `and ... == 0`, deliberately. If the execution family is ABSENT — lazily
      # registered, so absent whenever no workflow has completed since the pod started — an `== 0`
      # comparison yields no series and the `and` produces nothing, silently failing to fire in exactly
      # the case the rule exists for. `unless` is set difference: an empty right side leaves the left
      # intact, so absence reads as "no executions", which is what it means here.
      #
      # NOT Dapr's own published query. Its actor dashboard derives reminder triggers from
      # `dapr_http_client_roundtrip_latency_bucket{path=~"actors/.../method/remind/..."}` — and this estate
      # sets `spec.metrics.http.increasedCardinality: false`, which templates that path label away by
      # design. Importing Dapr's actor dashboard here renders empty reminder panels for the same reason.
      - alert: WorkflowEngineWedged
        expr: sum(increase(dapr_runtime_actor_reminders_fired_total{actor_type=~"dapr.internal.*workflow"}[30m])) > 0 unless sum(increase(dapr_runtime_workflow_execution_count_total[30m])) > 0
        for: 1h
        labels:
          severity: warning
          service: dapr
        annotations:
          summary: "Workflow orchestration turns are firing but nothing completes — a wedged continue_as_new"
          description: >-
            The engine's internal reminders keep firing while no workflow execution completes, which is a
            watch loop taking turns forever. `stage_run` and `train_run` both continue_as_new on every
            poll, so a job that never reaches a terminal status turns indefinitely and looks healthy from
            every angle except this one. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      # The scrape itself, asserted. If the control-plane job stops producing series the rule above
      # cannot fire, and its silence would be indistinguishable from health — the failure mode this
      # whole entry is about, one level up.
      - alert: DaprSchedulerMetricsMissing
        expr: absent(dapr_scheduler_sidecars_connected)
        for: 15m
        labels:
          severity: warning
          service: dapr
        annotations:
          summary: "No Dapr scheduler metrics for 15m — the reminder alert cannot fire"
          description: >-
            `dapr_scheduler_sidecars_connected` has no series. Either the scheduler is gone or the
            collector's `dapr-control-plane` scrape job is not matching it (it keeps pods annotated
            `dapr.io/control-plane` on the container port named `metrics`). Until this clears,
            DaprSchedulerServingNoSidecars is blind.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

  # ===============================================================================================
  # RAY. Fifteen rules existed and not one concerned Ray — the plane the entire bronze->silver->gold
  # cascade runs on.
  #
  # THE ORDER MATTERS. The first three fire on rask's OWN series (`ray_control_*`, from
  # `ray_kit.metrics`), so they work the moment the fleet exports and need no Ray-side scrape at all.
  # The last two need the `ray-pods` job specified in open_ray_handover.md section 1, which lands on
  # the EXTERNAL cluster — and RayMetricsMissing is what keeps them honest until it does, because a
  # rule over an absent series is SILENT, not green. That is the DaprSchedulerMetricsMissing lesson,
  # applied rather than restated.
  #
  # Every Ray counter is ABSENT, not zero, until first recorded: OpenCensus emits no series for a view
  # with no rows, so `increase()` over a never-fired counter yields an empty vector and the rule simply
  # does not evaluate. That is why the failure rules are written as `> 0` over increase() (which is
  # correctly silent when nothing has happened) rather than as `== 0` comparisons, which would be
  # silent when the EMITTER dies — the inverse, and the worse, failure.
  # ===============================================================================================
  - name: ray
    rules:
      - alert: RayControlUnreachable
        expr: sum(increase(ray_control_probes_total{lance_ray_outcome="unreachable"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
          service: ray
        annotations:
          summary: "compute cannot reach Ray — every /api/ray/* route is answering 200 with ok=false"
          description: >-
            `ray_control_probes_total{lance_ray_outcome="unreachable"}` is climbing. Because those
            routes return HTTP 200 regardless, the fleet RED dashboard shows a healthy compute
            service and 0% errors while the cluster is gone. Check the Ray head and
            `ray.dashboardUrl`. If the outcome is `unauthorized` instead, this is a Secret, not an
            outage — see RayControlUnauthorized.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      - alert: RayControlUnauthorized
        expr: sum(increase(ray_control_probes_total{lance_ray_outcome="unauthorized"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
          service: ray
        annotations:
          summary: "Ray is refusing compute's credentials — this is a Secret, not an outage"
          description: >-
            `ray_control_probes_total{lance_ray_outcome="unauthorized"}` is climbing: Ray answered
            401/403. Check `RASK_RAY_AUTH_TOKEN` / the `<release>-ray-auth-token` Secret and whether
            the token was rotated. Do NOT go debugging the node pool — the cluster is up and saying
            no.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      - alert: RayJobHistoryGrowing
        expr: max(ray_control_jobs_known) > 10000
        for: 15m
        labels:
          severity: warning
          service: ray
        annotations:
          summary: "Ray still remembers 20000 jobs — the prune cron is not keeping up"
          description: >-
            `GET /api/jobs/` accepts no parameters, so it returns EVERY job Ray has ever seen. At
            81,155 jobs that response measured 164.7 MB and OOM-killed the compute pod. Check the
            `compute-prune-jobs-cron` Dapr binding is ticking and that `prune_jobs` is not failing
            every delete (`PruneResult.failed`).
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      - alert: RayMetricsMissing
        expr: absent(ray_node_cpu_utilization)
        for: 15m
        labels:
          severity: warning
          service: ray
        annotations:
          summary: "No ray_* metrics for 15m — every Ray cluster alert is blind"
          description: >-
            `ray_node_cpu_utilization` has no series, so nothing is scraping Ray's per-node
            endpoint. Ray metrics are PULL-only and this does not self-heal. Apply the `ray-pods`
            scrape job in open_ray_handover.md section 1 on the cluster KubeRay runs on. Until it
            clears, RayWorkerOOMKills and RayServeNoHealthyReplicas cannot fire.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      - alert: RayWorkerOOMKills
        expr: sum(increase(ray_memory_manager_worker_eviction_total[15m])) > 0
        for: 15m
        labels:
          severity: critical
          service: ray
        annotations:
          summary: "Ray is OOM-killing workers — cascade stages are dying with no traceback anywhere"
          description: >-
            `ray_memory_manager_worker_eviction_total` is climbing: the host ran out of RAM and the
            kernel killed the worker (driver exit 137). Ray writes the driver log to a file inside
            the pod that nothing ships, so there is no traceback to find — the FAIL lineage event's
            errorMessage facet now carries the exit code instead. Reduce the stage's batch size or
            raise the head/worker memory limit.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

  # T-OBS — the telemetry backend itself. Every other group in this file describes something the
  # store can tell you about; this group is the one that tells you the store is gone. It has to be
  # here because it cannot be anywhere else: there are no `kube_*` or `container_*` series anywhere
  # in the estate (kube-state-metrics is not deployed and is not a toggle), so a pod that OOMKills
  # is invisible unless something scrapes it directly.
  #
  # Written 2026-08-23, the day rask-greptimedb-standalone-0 was OOMKilled for the 13th time
  # (exit 137, 8Gi limit). It had run 6d21h clean before that morning, so this is a load/state
  # regression, not a chronic mis-size — which is exactly the shape an alert catches and a one-off
  # limit bump does not. Nothing reported any of the 13.
  #
  # These depend on the `greptimedb` scrape job in chart/templates/otel-collector.yaml. That
  # dependency is pinned in BOTH directions by test_every_job_selector_names_a_real_scrape_job:
  # the rules cannot ship without the job, and the job cannot be deleted while the rules exist.
  - name: lance-observability
    rules:

      # `up` and `process_start_time_seconds` are answered by the SCRAPER, not by GreptimeDB's own
      # instrumentation, so these two still work when GreptimeDB is the thing that is broken. The
      # greptime_* self-metrics do not have that property and are deliberately not used here.
      - alert: GreptimeDBRestarting
        expr: changes(process_start_time_seconds{job="greptimedb"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: observability
        annotations:
          summary: "GreptimeDB restarted in the last 15 minutes"
          description: >-
            The estate's only metrics/logs/traces store restarted. Check for OOMKill first —
            `kubectl get pod rask-greptimedb-standalone-0 -o jsonpath='{.status.containerStatuses[0].lastState}'`
            — exit 137 means the 8Gi limit was hit. Every dashboard and every other rule in this file
            went blind for the duration. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      # Fires while the store is still UP, which is the entire point — GreptimeDBRestarting only
      # tells you afterwards. RSS, not greptime_cgroups_memory_usage_bytes: the cgroup figure
      # includes reclaimable page cache from the disk-backed file cache and reads ~1GiB higher
      # (measured live: cgroup 3.67GiB vs RSS 3.34GiB), so it would fire early and be tuned out.
      #
      # 6442450944 = 6GiB = 75% of the current 8Gi limit. This literal MUST move with
      # greptimedb-standalone.resources.limits.memory in values.yaml — rules.yml is mounted via
      # .Files.Get and cannot be templated, so the coupling is held by a test instead:
      # test_the_greptimedb_memory_threshold_tracks_the_chart_limit.
      - alert: GreptimeDBMemoryHigh
        expr: max(process_resident_memory_bytes{job="greptimedb"}) > 6442450944
        for: 10m
        labels:
          severity: warning
          service: observability
        annotations:
          summary: "GreptimeDB resident memory is above 75% of its limit"
          description: >-
            Approaching the cgroup ceiling; an OOMKill takes the whole telemetry plane with it. The
            in-process caches are budgeted at ~4.3GiB of the 8GiB and three limits
            (experimental_compaction_memory_limit, scan_memory_limit, query.memory_pool_size) are
            Unlimited, so the remainder is unbounded by configuration.

      # Two rules, not `min(up{...}) == 0 or absent(up{...})`: GreptimeDB refuses the composite
      # form outright (HTTP 500). See the note at NotificationsReconcilerStalled.
      - alert: GreptimeDBDown
        expr: min(up{job="greptimedb"}) == 0
        for: 5m
        labels:
          severity: critical
          service: observability
        annotations:
          summary: "GreptimeDB is not answering its scrape"
          description: >-
            The store is down. Ingest is being dropped, not buffered — the fleet exports OTLP/HTTP
            straight to it. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

      # The scrape job itself vanishing looks identical to a healthy quiet store unless something
      # asserts the series EXISTS. Returns 1 today and goes quiet once the job lands.
      - alert: GreptimeDBMetricsMissing
        expr: absent(up{job="greptimedb"})
        for: 10m
        labels:
          severity: critical
          service: observability
        annotations:
          summary: "Nothing is scraping GreptimeDB at all"
          description: >-
            No `up{job="greptimedb"}` series exists, so GreptimeDBDown and GreptimeDBMemoryHigh are
            both dead. Either the scrape job was removed from chart/templates/otel-collector.yaml or
            the collector is not running. This alert is the reason their silence is not mistaken for
            health.

  # ==================================================================================================
  # Dapr workflow history — the one plane the sidecar exports NO metric about.
  #
  # Every other group here alerts on a series something already emits. This one could not: enumerated
  # live on 2026-08-26 against the `ingest` sidecar, the ENTIRE metric surface daprd exports is
  # dapr_error_code_total, dapr_grpc_io_*, dapr_http_*, dapr_runtime_component_{init_total,loaded} and
  # go_*. No workflow metric, no actor metric, no state-store metric — and `dapr_runtime_workflow_*`,
  # which DaprConsumerWedge above already documents as unreliable in this codebase, is not merely
  # unreliable here, it is absent. There is nothing to scrape, so there was nothing to alert on.
  #
  # WHY IT MATTERS ENOUGH TO BUILD A MEASUREMENT FOR. Workflow history is append-only and
  # `spec.workflow.stateRetentionPolicy` (chart/templates/observability.yaml) is the only thing that
  # removes it — the CRD is explicit that without it instances are never purged, and this estate has
  # deliberately NO application-side purge to fall back on (DaprWorkflowClient exposes purge but no
  # list-instances API, so a sweep could not name what to purge after a restart). If the policy is
  # dropped by a values edit, or its `dapr.io/config` annotation is re-gated the way it once was, or
  # the scheduler simply stops collecting, the first symptom is a full disk. Both measurements this
  # estate has of workflow-history volume — 1367 rows on 2026-08-10, 7239 on 2026-08-26 — happened
  # because a person went looking.
  #
  # AND WHY IT ALERTS ON AGE, NOT VOLUME. Row count varies legitimately with load, so a threshold on
  # it is either noisy or useless. Age tests the PROPERTY: the oldest surviving history row must be
  # younger than the longest window the policy grants. That claim is true under any load.
  #
  # The series come from the `sqlquery/daprstate` receiver in chart/templates/otel-collector.yaml,
  # which runs one query against the Dapr state store's own database. That dependency is pinned in
  # both directions by test_every_collector_sourced_ALERT_names_a_metric_the_RECEIVER_declares: these
  # rules cannot ship without the receiver, and the receiver cannot be deleted (nor its metrics
  # renamed) while the rules are here.
  - name: dapr-workflow-state
    rules:

      # 2851200 = 792h = the longest configured window (720h) + a 72h collection margin. The margin is
      # for the scheduler's own cadence, not slack: a row is only eligible once its instance reaches a
      # terminal state, so a legitimately-retained row can be a little older than the nominal window.
      # This literal MUST move with dapr.workflowRetention in chart/values.yaml — rules.yml is mounted
      # via .Files.Get and cannot be templated, so the coupling is held by a test instead:
      # test_the_workflow_history_alert_threshold_TRACKS_the_retention_policy.
      #
      # `for: 30m` rather than something shorter because this is a slow failure with a slow fix. It is
      # never urgent by the minute and a brief blip during a scheduler restart should not page.
      - alert: DaprWorkflowHistoryNotCollected
        expr: max(dapr_workflow_history_oldest_age_seconds) > 2851200
        for: 30m
        labels:
          severity: warning
          service: dapr
        annotations:
          summary: "Dapr workflow history is outliving its retention policy"
          description: >-
            A workflow-history row in the Dapr state store is older than the longest configured
            retention window (dapr.workflowRetention in chart/values.yaml) plus a collection margin,
            so the scheduler has stopped collecting. Nothing else purges this: the policy applies only
            to instances that NEWLY reach a terminal state, so every instance that terminates while
            this is broken has to be purged by hand afterwards. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#workflow-history-not-collected

      # Two rules, not one composite — GreptimeDB refuses `X > N or absent(X)` outright (HTTP 500).
      # See the note at NotificationsReconcilerStalled, and the gates that enforce it
      # (test_no_alert_rule_combines_absent_with_a_set_operator).
      #
      # This is the watcher's watcher, and it is not decoration. `max(...)` over an empty vector
      # returns nothing, so a receiver that stops running makes the rule above permanently quiet —
      # which is exactly what a healthy, well-collected store also looks like. `dapr_workflow_state_rows`
      # is read for nothing else; its whole job is to be PRESENT.
      - alert: DaprWorkflowStateMetricsMissing
        expr: absent(dapr_workflow_state_rows)
        for: 15m
        labels:
          severity: warning
          service: dapr
        annotations:
          summary: "Nothing is measuring the Dapr workflow state store"
          description: >-
            No `dapr_workflow_state_rows` series exists, so DaprWorkflowHistoryNotCollected is dead
            and its silence means nothing. Either the sqlquery/daprstate receiver was removed from
            chart/templates/otel-collector.yaml, or it is running and cannot reach the state store's
            database. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#workflow-history-not-collected

  # ==================================================================================================
  # THE HTTP PLANE — fourteen apps emitted RED metrics and not one rule read them.
  #
  # `grep 'http_server\|ingest_\|flows_\|gateway\|compute_\|controlplane' rules.yml` returned ZERO at
  # HEAD on 2026-08-26. Every app emits `http.server.*` automatically (service_kit.setup_otel wires the
  # FastAPI instrumentor), the chart provisions a Perses "Fleet — RED" dashboard from those very
  # series, and nothing turned any of it into a page. Eight of fourteen apps had no group at all —
  # including the gateway and every app a browser talks to.
  #
  # The concrete scenario, and it is not hypothetical: the catalog starts answering 500 on every
  # `POST /v1/table/{id}/describe`. The only rule in `lance-catalog` counts 429s on Arrow-IPC WRITES,
  # which stays at zero throughout. A catalog failing 100% of reads pages nobody.
  #
  # SERIES NAMES VERIFIED AGAINST THE LIVE STORE, not inferred. It is
  # `http_server_duration_milliseconds_*` — the OTLP->Prometheus exporter APPENDS the unit, so a rule
  # naming `_seconds` matches nothing and can never fire. That is the `outbox_oldest_age` defect, and
  # it is the reason every expression below was replayed against GreptimeDB before being written down.
  - name: lance-http
    rules:

      # THE LOAD-BEARING ONE. A ratio, not a count: absolute 5xx tells you nothing without traffic,
      # and a service that serves ten requests an hour would never cross a count threshold however
      # broken it is. `service_name` is the instrumentor's own label (verified live: catalog, gateway,
      # ingest, lineage, notifications, maintenance, medallion-producer and the movers all report it).
      - alert: HttpServerErrorRatioHigh
        expr: sum by (service_name) (rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m])) / sum by (service_name) (rate(http_server_duration_milliseconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "More than 5% of one service's HTTP responses are 5xx"
          description: >-
            A service is failing its own requests. This is the estate's only fleet-wide failure
            signal — before it existed, a service could 500 on every read and no rule anywhere
            noticed. Split by `service_name` to find which. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#readyz-degraded--pool-or-graph

      # LATENCY, and the threshold is deliberately far above the observed estate rather than tuned to
      # it. Measured over a 10m window on 2026-08-26: lineage 500ms, notifications 463ms, maintenance
      # 10s — maintenance runs long BY DESIGN (its sweeps are the request), which is exactly why this
      # fires at 15s rather than at a value that would page on a healthy sweep. A latency rule that
      # cries wolf is one people mute, and a muted rule is worse than none.
      #
      # `histogram_quantile` over the bucket series is supported by GreptimeDB — verified by running
      # this exact expression against the live store, because promtool accepting it proves nothing
      # about the engine that evaluates it.
      - alert: HttpServerLatencyHigh
        expr: histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_duration_milliseconds_bucket[10m]))) > 15000
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "One service's p95 HTTP latency is above 15s"
          description: >-
            Sustained p95 over 15 seconds means requests are queueing behind something — a blocking
            call on the event loop, an exhausted threadpool, or an upstream that stopped answering.
            `maintenance` legitimately runs long during a sweep; any other service here is a defect.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#readyz-degraded--pool-or-graph

      # The watcher's watcher. Both rules above evaluate over an empty vector and go quiet if the
      # instrumentor stops exporting — indistinguishable from an estate serving no errors. Bare
      # `absent()` in its own rule, never as an operand of a set operator: GreptimeDB refuses the
      # composite form outright (HTTP 500). See the note at NotificationsReconcilerStalled.
      - alert: HttpServerMetricsMissing
        expr: absent(http_server_duration_milliseconds_count)
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "No app is reporting HTTP metrics at all"
          description: >-
            `http_server_duration_milliseconds_count` does not exist, so HttpServerErrorRatioHigh and
            HttpServerLatencyHigh are both dead and their silence means nothing. Either
            `service_kit.setup_otel` stopped wiring the FastAPI instrumentor, or the OTLP path to
            GreptimeDB is broken. Runbook: docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

  # The ingest plane's own failure signal, which existed and was read by nothing. `ingest/metrics.py`
  # states the gap in its OWN docstring — "chart/alerting/rules.yml duly contains zero ingest rules: no
  # page fires for a run that failed, a fan-out that stalled, or units that never landed" — and that
  # sentence was true for as long as the file existed.
  #
  # WHY A FIRST-PARTY COUNTER RATHER THAN DAPR'S. `dapr_runtime_workflow_execution_count_total` carries
  # a `status` label and for this codebase it is FALSE: the workflow converts failure into a RETURNED
  # value, so the orchestrator completes normally and the sidecar records success. Measured across the
  # live estate — every app_id holds `success` and nothing else. This counter exists precisely because
  # that one lies.
  - name: lance-ingest
    rules:

      # Status values verified against the live store: COMPLETE, COMPLETE_WITH_ERRORS, FAILED and
      # TERMINATED. TERMINATED is EXCLUDED deliberately — it means a person pressed Terminate, which is
      # an intended outcome and not a defect. Paging on it would page on the operator's own action.
      - alert: IngestRunsFailing
        expr: sum(rate(ingest_runs_total{lance_ingest_status="FAILED"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: ingest
        annotations:
          summary: "Ingest runs are failing"
          description: >-
            A run reached FAILED — the harvest did not land its data. Distinct from TERMINATED, which
            is an operator stopping a run deliberately and is not alerted on. Check the run's own
            errors on the ingest detail page. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#cascade-stalled

  # The flows plane, same argument. `flows/metrics.py:33` calls the node counter "the service's only
  # failure signal" and no rule read it.
  #
  # NO SERIES EXISTS IN THE STORE YET, stated rather than hidden: flows has never executed a run on
  # this estate, and a counter that has never been incremented creates no table. The rule is therefore
  # evaluable (confirmed by the drill) and unexercised against real data — which is the honest status
  # of any alert for a plane that has not yet run.
  - name: lance-flows
    rules:

      - alert: FlowNodesFailing
        expr: sum(rate(flows_nodes_total{lance_flows_status="failed"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: flows
        annotations:
          summary: "Flow nodes are failing"
          description: >-
            A node in a flow graph ended failed. Dapr's own workflow family reports success for these
            runs — the orchestrator returns a failed VALUE rather than raising — so this counter is
            the only signal that distinguishes them. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#cascade-stalled
