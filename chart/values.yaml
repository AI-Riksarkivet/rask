# Pinned so in-cluster service names are rask-<component> (release name is also rask).
fullnameOverride: "rask"
nameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Optional override: if set, this Secret is used verbatim instead of the
# chart-generated one (prod with external deps). Empty = chart generates creds.
existingSecret: ""

# Random creds are generated once on first install and pinned across upgrades
# via `lookup`. Override here to force a value.
# For in-cluster postgres/minio, SET these (the local `make k3s-up` injects them
# from .env: POSTGRES_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, HF_TOKEN).
# Leaving postgresPassword/minioSecretKey empty falls back to a fresh randAlphaNum
# on every render — which the `rask-postgres` secret and the `rask-app` DATABASE_URL
# generate INDEPENDENTLY, so they won't match. Only rely on the empty default when
# postgres.enabled/minio.enabled are false (external deps via existingSecret).
secrets:
  postgresPassword: ""   # in-cluster pg: set this (else fresh-render mismatch); from .env POSTGRES_PASSWORD
  minioAccessKey: ""     # empty => "rask"
  minioSecretKey: ""     # in-cluster minio: set this; from .env AWS_SECRET_ACCESS_KEY
  hfToken: ""            # HuggingFace token for the gated TrOCR model; from .env HF_TOKEN

# Non-secret env shared by the fleet ConfigMap.
config:
  RASK_SOURCE_MODE: "s3"
  RASK_HTR_PIPELINE: "htrflow"
  RASK_PREFETCH_PIPELINE: "none"
  RASK_VIEWER_INPUT: "s3://images-batch"
  RASK_VIEWER_OUTPUT: "s3://images-batch-alto"
  RASK_CACHE_BUCKET: "images-batch"
  RASK_OUTPUT_BUCKET: "images-batch-alto"
  RASK_SEARCH_BUCKET: "images-batch-search"
  RASK_IIIF_URL: ""
  RASK_API_PREFIX: "/api"
  # How the orchestrator invokes the runner CLI in the Ray job entrypoint. The
  # in-cluster ray image ships the installed `runner` console script on PATH (no
  # uv, no source tree), so override the dev default (`uv run --project
  # projects/runner runner`) — otherwise the job fails with `uv: not found` (127).
  RASK_RUNNER_CMD: "runner"
  RASK_ORCHESTRATOR_INTERVAL_SECONDS: "60"
  RASK_ORCHESTRATOR_RECONCILE_SECONDS: "600"
  RASK_SERVE_REPLICAS: "1"
  RASK_SERVE_GPU_FRAC: "1.0"
  AWS_REGION: "us-east-1"
  HCP_INSECURE: "true"
  RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"

# Per-service fleet definitions. Rendered by templates/fleet.yaml.
services:
  core-api:
    module: "core_api:app"
    port: 8801
    replicas: 1
    waitFor: ["postgres", "minio"]
  search-api:
    module: "search_api:app"
    port: 8802
    replicas: 1
    waitFor: ["postgres"]
  volumes-api:
    module: "volumes_api:app"
    port: 8803
    replicas: 1
    waitFor: ["minio"]
  ray-api:
    module: "ray_api:app"
    port: 8804
    replicas: 1
    waitFor: []
  orchestrator:
    module: "orchestrator:app"
    port: 8810
    replicas: 1            # MUST stay 1 (in-process singleton)
    singleton: true        # => strategy Recreate + RASK_ORCHESTRATOR_AUTOSTART
    waitFor: ["postgres"]
  gateway:
    module: "gateway:app"
    port: 8888
    replicas: 1
    extraArgs: ["--proxy-headers", "--forwarded-allow-ips=127.0.0.1"]
    waitFor: []

# Image registry/tag shared by every fleet + migration container.
image:
  repository: ""          # empty => bare "<component>" name (e.g. core-api)
  tag: "dev"
  pullPolicy: IfNotPresent

# Dev-only knobs, driven by the Tilt loop (Tiltfile). Never enable in production.
dev:
  # Append `uvicorn --reload` (+ reload-dirs) to the fleet args so Tilt's
  # live_update sync of /app/{packages,components} hot-reloads the Python services
  # in-cluster. Requires the editable dev image (.docker/fleet.dev.dockerfile).
  reload: false

resources:
  fleet:
    requests: {cpu: "50m", memory: "128Mi"}
    limits: {cpu: "1", memory: "512Mi"}

orchestrator:
  autostart: "false"

frontend:
  replicas: 1
  image:
    tag: "dev"            # shared tag; repository per app is the app name below
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests: {cpu: "50m", memory: "64Mi"}
    limits: {cpu: "500m", memory: "256Mi"}
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
  # The frontend is a set of SvelteKit SSR microfrontends. The catch-all
  # (home) owns "/", "/<project>/overview|new";
  # each domain app is pinned to its base path /default/<domain> in its
  # svelte.config.js and gets an ingress rule for that path. image == app dir
  # name under components/frontends/ (built from the one parametrized frontend.dockerfile).
  apps:
    - {name: home, catchAll: true}              # home, "/"
    - {name: overview, path: /default/overview}
    - {name: storage, path: /default/storage}
    - {name: compute, path: /default/compute}
    - {name: discover, path: /default/discover}
    - {name: train, path: /default/train}
    - {name: studio, path: /default/studio}

# In-cluster S3 object store via the RustFS operator (Tenant CR + operator
# subchart). `enabled` gates BOTH the operator subchart (Chart.yaml condition
# rustfs.enabled) and the Tenant template. Turn off for external S3.
# RustFS erasure coding requires servers*volumesPerServer >= 4; standalone is
# servers=1, volumesPerServer=4 (1 pod, 4 PVCs). S3 service is <tenant>-io:9000.
rustfs:
  enabled: true
  image: "rustfs/rustfs:latest"
  servers: 1
  volumesPerServer: 4
  # Single-node k3s: all 4 local-path volumes share one physical disk, which
  # trips RustFS's distinct-disk erasure safety check. Bypass it for local/CI.
  # Set false for a real multi-node / multi-disk object store.
  bypassDiskCheck: true
  port: 9000
  consolePort: 9001
  storage: "15Gi"          # per-volume; 4 volumes => ~60Gi total (local-path is unmetered hostPath)
  storageClass: "local-path"
  buckets: ["images-batch", "images-batch-alto", "images-batch-search", "rask-observability"]

ray:
  enabled: true
  rayVersion: "2.55.1"
  image:
    repository: ray
    tag: "dev"
    pullPolicy: IfNotPresent
  serveRoutePrefix: "/htrflow"
  importPath: "runner.htrflow_service:htrflow_app"
  dashboardPort: 8265
  servePort: 8000
  clientPort: 10001
  redisPort: 6379
  gpuCount: 1
  runtimeClassName: "nvidia"
  hfCacheStorage: "10Gi"
  shmSize: "8Gi"
  resources:
    requests: {cpu: "2", memory: "8Gi"}
    limits: {cpu: "4", memory: "16Gi"}

migrations:
  enabled: true
  command: ["sh", "-c", "cd /app/components/services/core && alembic upgrade head"]
  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "1", memory: "1Gi"}

ingress:
  enabled: true
  className: ""    # k3s default Traefik
  # Empty host => catch-all: reachable on the node IP or a VS Code / ssh -L
  # forwarded localhost with no Host header or /etc/hosts entry. Set a hostname
  # (e.g. rask.local) for host-based routing in shared/prod environments.
  host: ""
  annotations: {}
  tls: []

# ---- cluster infra foundation (subchart dependencies, Chart.yaml) ----------
# One `helm install` brings these up alongside the app. Turn off for a prod
# install that uses externally-managed infra. Subchart value overrides live
# under the same key as the toggle.
# nvidia-device-plugin subchart (aliased 'nvdp' in Chart.yaml)
nvdp:
  enabled: true
  # k3s registers the nvidia container runtime but doesn't make it the default,
  # so the plugin pod must run under the nvidia RuntimeClass to see the GPU.
  runtimeClassName: nvidia
  # rask installs into the default namespace; the chart objects to that by default.
  allowDefaultNamespace: true
  # The device-plugin DaemonSet gates (nodeAffinity) on GPU-feature-discovery labels
  # — feature.node.kubernetes.io/pci-10de.present (PCI vendor 0x10de = NVIDIA),
  # nvidia.com/gpu.present, etc. — so it only runs on actual GPU nodes. Those labels
  # come from Node Feature Discovery + GPU Feature Discovery, NOT from the bare plugin.
  # Without them the DaemonSet matches 0 nodes (desired=0) and nvidia.com/gpu is never
  # advertised, so KubeRay's GPU pods stay Pending.
  #
  # Enable the bundled NFD+GFD (the node-feature-discovery dep ships inside the
  # subchart tgz, so this works offline on k3s). It labels every GPU node correctly
  # and leaves CPU-only nodes alone — keeping the default affinity portable across
  # single-node dev and multi-node clusters. Set nvdp.enabled=false instead if the
  # cluster already runs NFD or the NVIDIA GPU Operator.
  gfd:
    enabled: true

# kuberay-operator subchart (aliased 'kuberay' in Chart.yaml)
kuberay:
  enabled: true

nats:
  enabled: true
  config:
    jetstream:
      enabled: true

dapr:
  enabled: true
  # Inject Dapr sidecar into every fleet pod. Off => plain pods; the gateway
  # falls back to httpx env-URLs. (The control-plane subchart is dapr.enabled above.)
  sidecars: true
  logLevel: "info"
  # Max request body size for Dapr service invocation. Dapr defaults to 4Mi,
  # which rejects multi-image batch uploads (POST /api/batches/<id>/upload routes
  # gateway -> core-api over Dapr). Raise it to fit real batches.
  maxBodySize: "32Mi"

kueue:
  enabled: true
  # Default queue topology (ResourceFlavor + ClusterQueue + a LocalQueue in the
  # release namespace). Kueue's admission webhooks are failurePolicy=Fail, so the
  # queues can't be created until the controller's webhook endpoints exist — a
  # post-install/post-upgrade hook Job therefore retries `kubectl apply` until it
  # succeeds (templates/kueue-queues.yaml). Reference the queue from a workload
  # with the label `kueue.x-k8s.io/queue-name: <localQueueName>`.
  queues:
    enabled: true
    kubectlImage: "registry.k8s.io/kubectl:v1.31.3"
    flavorName: "rask"
    clusterQueueName: "rask"
    localQueueName: "rask"
    # Nominal quota for the single ClusterQueue. Size to the cluster; over-quota
    # just leaves workloads Pending (not catastrophic), under-quota throttles.
    nominalQuota:
      cpu: "18"
      memory: "120Gi"
      "nvidia.com/gpu": "1"

openfga:
  enabled: true
  datastore:
    engine: memory   # ephemeral; point at postgres (engine+uri) when adopted

# In-cluster Postgres via the CloudNativePG operator (Cluster CR + operator
# subchart). `enabled` gates BOTH the operator subchart (Chart.yaml condition
# cnpg.enabled) and the Cluster template. Turn off for an external/managed DB
# (provide DATABASE_URL via existingSecret).
cnpg:
  enabled: true
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:16"
  user: "rask"
  database: "rask"
  port: 5432
  storage: "8Gi"
  storageClass: "local-path"
  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "1", memory: "1Gi"}

# cloudnative-pg operator subchart (Chart.yaml dep, gated by cnpg.enabled).
# Webhook failurePolicy=Ignore so a Cluster created before the operator pod is
# Ready is admitted and reconciled later (the KubeRay/RayService behaviour) —
# this is what lets the Cluster be a plain template instead of a hook.
cloudnative-pg:
  # CNPG ships its CRDs as templated resources (not a bare crds/ dir), so Helm
  # cannot map our Cluster CR in the same release on a cold install. We instead
  # vendor the CNPG CRDs into the umbrella chart's crds/ dir (installed in Helm's
  # CRD phase, before templates), so the subchart must NOT also create them.
  crds:
    create: false
  webhook:
    validating:
      failurePolicy: Ignore
    mutating:
      failurePolicy: Ignore

# rustfs operator subchart (vendored at third_party/, gated by rustfs.enabled).
rustfs-operator: {}

# ---- observability stack (Vector + GreptimeDB + Perses) --------------------
# Gated by observability.enabled (the three subcharts' Chart.yaml condition AND
# the OTLP wiring below). App services + Ray export OTLP-direct to GreptimeDB;
# Vector ships pod logs. GreptimeDB stores to the in-cluster RustFS S3.
observability:
  enabled: true
  bucket: "rask-observability"          # RustFS bucket for GreptimeDB object storage
  # Retention for logs/traces/metrics. Applied as a database-level TTL on the
  # GreptimeDB `public` database via a post-install/post-upgrade hook Job
  # (templates/greptimedb-ttl-job.yaml), so every table (rask_logs,
  # opentelemetry_traces, the metrics physical table) inherits it. Empty string
  # = no TTL (unbounded growth). GreptimeDB accepts e.g. "14d", "30d", "90d".
  retention: "14d"

# GreptimeDB standalone subchart — unified metrics/logs/traces store on RustFS S3.
greptimedb-standalone:
  objectStorage:
    s3:
      bucket: "rask-observability"
      region: "us-east-1"
      root: "/greptimedb"
      endpoint: "http://rask-rustfs-io:9000"
    credentials:
      existingSecretName: "rask-observability-s3"

# Vector subchart — Agent DaemonSet shipping pod logs to GreptimeDB (Task 2 fills customConfig).
vector:
  role: "Agent"
  # The Agent only pulls pod logs and pushes to GreptimeDB — it exposes no
  # listening ports, so the chart's auto-generated Services would be invalid
  # (empty spec.ports). Disable both; the DaemonSet needs no inbound Service.
  service:
    enabled: false
  serviceHeadless:
    enabled: false
  # customConfig fully REPLACES Vector's default config (chart contract), so it
  # must be complete: a kubernetes_logs source piped to the greptimedb_logs sink.
  customConfig:
    data_dir: /vector-data-dir
    api:
      enabled: false
    sources:
      pod_logs:
        type: kubernetes_logs
        # Don't enrich logs with node labels, namespace labels, or pod
        # annotations: GreptimeDB's logs sink is schema-on-write, so every
        # distinct key becomes a PERMANENT column. Node labels alone added ~107
        # useless columns (NFD cpu-cpuid.*, nvidia.com/cuda.*), and pod
        # annotations add checksum/* churn — one new column per new workload.
        # Empty string disables each enrichment; pod_labels (app/component) and
        # the core pod/container/namespace fields are kept.
        node_annotation_fields:
          node_labels: ""
        namespace_annotation_fields:
          namespace_labels: ""
        pod_annotation_fields:
          pod_annotations: ""
    sinks:
      greptimedb_logs:
        type: greptimedb_logs
        inputs: ["pod_logs"]
        endpoint: "http://rask-greptimedb-standalone:4000"
        dbname: "public"
        table: "rask_logs"
        compression: "gzip"

# Perses subchart — dashboards-as-code (Task 3 fills the datasource).
perses:
  # Perses bundles its datasource/panel plugins and extracts them into
  # /etc/perses/plugins at startup, but the container runs readOnlyRootFilesystem
  # so that path isn't writable → "datasource schemas are not loaded" and the
  # GreptimeDB datasource fails to provision. Give it a writable emptyDir there
  # (keeps readOnlyRootFilesystem: true).
  volumes:
    - name: perses-plugins
      emptyDir: {}
    # Dashboards-as-code: the rask-perses-dashboards ConfigMap (templates/
    # perses-dashboards.yaml) holds the rask Project + "Fleet — RED" Dashboard.
    - name: perses-dashboards
      configMap:
        name: rask-perses-dashboards
  volumeMounts:
    - name: perses-plugins
      mountPath: /etc/perses/plugins
    - name: perses-dashboards
      mountPath: /etc/perses/dashboards
  # Provision a GreptimeDB datasource via the chart's datasources values key
  # (renders a ConfigMap mounted at /etc/perses/datasources). GreptimeDB exposes
  # a Prometheus-compatible query API at :4000/v1/prometheus.
  #
  # Use PROXY mode, not directUrl: with directUrl the *browser* queries the URL,
  # but rask-greptimedb-standalone is an in-cluster DNS name unreachable from a
  # laptop hitting Perses over `kubectl port-forward` → "failed to fetch". Proxy
  # mode routes queries through the Perses server (which can resolve it), so the
  # browser only ever talks to Perses.
  datasources:
    - kind: GlobalDatasource
      metadata:
        name: greptimedb
      spec:
        default: true
        plugin:
          kind: PrometheusDatasource
          spec:
            proxy:
              kind: HTTPProxy
              spec:
                url: "http://rask-greptimedb-standalone:4000/v1/prometheus"
  # Add /etc/perses/datasources to provisioning.folders so Perses scans the
  # datasource ConfigMap mounted there (the chart mounts datasources: at that
  # path but the default server config only lists /etc/perses/provisioning).
  config:
    provisioning:
      folders:
        - /etc/perses/provisioning
        - /etc/perses/datasources
        - /etc/perses/dashboards
      interval: 1m
