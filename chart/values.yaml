# Pinned so in-cluster service names are rask-<component> (release name is also rask).
fullnameOverride: "rask"
nameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Optional override: if set, this Secret is used verbatim instead of the
# chart-generated one (prod with external deps). Empty = chart generates creds.
existingSecret: ""

# Random creds are generated once on first install and pinned across upgrades
# via `lookup`. Override here to force a value.
# For in-cluster postgres/minio, SET these (the local `make k3s-up` injects them
# from .env: POSTGRES_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, HF_TOKEN).
# Leaving postgresPassword/minioSecretKey empty falls back to a fresh randAlphaNum
# on every render — which the `rask-postgres` secret and the `rask-app` DATABASE_URL
# generate INDEPENDENTLY, so they won't match. Only rely on the empty default when
# postgres.enabled/minio.enabled are false (external deps via existingSecret).
secrets:
  postgresPassword: ""   # in-cluster pg: set this (else fresh-render mismatch); from .env POSTGRES_PASSWORD
  minioAccessKey: ""     # empty => "rask"
  minioSecretKey: ""     # in-cluster minio: set this; from .env AWS_SECRET_ACCESS_KEY
  hfToken: ""            # HuggingFace token for the gated TrOCR model; from .env HF_TOKEN

# Non-secret env shared by the fleet ConfigMap.
config:
  RASK_SOURCE_MODE: "s3"
  RASK_HTR_PIPELINE: "htrflow"
  RASK_PREFETCH_PIPELINE: "none"
  RASK_VIEWER_INPUT: "s3://images-batch"
  RASK_VIEWER_OUTPUT: "s3://images-batch-alto"
  RASK_CACHE_BUCKET: "images-batch"
  RASK_OUTPUT_BUCKET: "images-batch-alto"
  RASK_SEARCH_BUCKET: "images-batch-search"
  RASK_IIIF_URL: ""
  RASK_API_PREFIX: "/api"
  RASK_ORCHESTRATOR_INTERVAL_SECONDS: "60"
  RASK_ORCHESTRATOR_RECONCILE_SECONDS: "600"
  RASK_SERVE_REPLICAS: "1"
  RASK_SERVE_GPU_FRAC: "1.0"
  AWS_REGION: "us-east-1"
  HCP_INSECURE: "true"
  RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"

# Per-service fleet definitions. Rendered by templates/fleet.yaml.
services:
  core-api:
    module: "core_api:app"
    port: 8801
    replicas: 1
    waitFor: ["postgres", "minio"]
  search-api:
    module: "search_api:app"
    port: 8802
    replicas: 1
    waitFor: ["postgres"]
  volumes-api:
    module: "volumes_api:app"
    port: 8803
    replicas: 1
    waitFor: ["minio"]
  ray-api:
    module: "ray_api:app"
    port: 8804
    replicas: 1
    waitFor: []
  orchestrator:
    module: "orchestrator:app"
    port: 8810
    replicas: 1            # MUST stay 1 (in-process singleton)
    singleton: true        # => strategy Recreate + RASK_ORCHESTRATOR_AUTOSTART
    waitFor: ["postgres"]
  gateway:
    module: "gateway:app"
    port: 8888
    replicas: 1
    extraArgs: ["--proxy-headers", "--forwarded-allow-ips=127.0.0.1"]
    waitFor: []

# Image registry/tag shared by every fleet + migration container.
image:
  repository: ""          # empty => bare "<component>" name (e.g. core-api)
  tag: "dev"
  pullPolicy: IfNotPresent

resources:
  fleet:
    requests: {cpu: "50m", memory: "128Mi"}
    limits: {cpu: "1", memory: "512Mi"}

orchestrator:
  autostart: "false"

frontend:
  replicas: 2
  image:
    repository: frontend
    tag: "dev"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  origin: "http://rask.local"
  resources:
    requests: {cpu: "50m", memory: "64Mi"}
    limits: {cpu: "500m", memory: "256Mi"}
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}

postgres:
  enabled: true
  image: "postgres:16"
  user: "rask"
  database: "rask"
  port: 5432
  storage: "8Gi"
  storageClass: "local-path"
  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "1", memory: "1Gi"}

minio:
  enabled: true
  image: "minio/minio:latest"
  mcImage: "minio/mc:latest"
  port: 9000
  consolePort: 9001
  storage: "50Gi"
  storageClass: "local-path"
  buckets: ["images-batch", "images-batch-alto", "images-batch-search"]
  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "1", memory: "1Gi"}

ray:
  enabled: true
  rayVersion: "2.55.1"
  image:
    repository: ray
    tag: "dev"
    pullPolicy: IfNotPresent
  serveRoutePrefix: "/htrflow"
  importPath: "runner.htrflow_service:htrflow_app"
  dashboardPort: 8265
  servePort: 8000
  clientPort: 10001
  redisPort: 6379
  gpuCount: 1
  runtimeClassName: "nvidia"
  hfCacheStorage: "10Gi"
  shmSize: "8Gi"
  resources:
    requests: {cpu: "2", memory: "8Gi"}
    limits: {cpu: "4", memory: "16Gi"}

migrations:
  enabled: true
  command: ["sh", "-c", "cd /app/components/services/core && alembic upgrade head"]
  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "1", memory: "1Gi"}

ingress:
  enabled: true
  className: ""    # k3s default Traefik
  # Empty host => catch-all: reachable on the node IP or a VS Code / ssh -L
  # forwarded localhost with no Host header or /etc/hosts entry. Set a hostname
  # (e.g. rask.local) for host-based routing in shared/prod environments.
  host: ""
  annotations: {}
  tls: []
