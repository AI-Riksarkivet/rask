# rask umbrella chart values — the MERGED estate (rask 0.2.0 + lance-ns 0.1.0, one release named `rask`).
#
# Two systems now install from this one file:
#   * the rask fleet (gateway/controlplane/flows/notifications),
#     KubeRay Serve, the MinIO StatefulSet, the SvelteKit microfrontend zones;
#   * the lance-ns lakehouse (catalog + lineage + maintenance + media), governance
#     (Dex OIDC + OpenFGA), the Dapr/NATS event fabric, OpenBao, and the OTel-first observability tier.
#
# Merge rule applied throughout (plan P4, docs/adr/0124-chart-unification-one-control-plane-each-one-object-store.md): rask's chart is the BASE and every rask key is preserved;
# subchart DEPENDENCIES are rask's (one control plane each — see Chart.yaml); subchart VALUES are
# lance-ns's where richer (credentialed NATS, openfga datastore.engine=postgres + the migrate hook).
# Every lance-ns hostname literal was re-pointed from `lance-ns-*` to `rask-*`, because both charts'
# fullname helpers resolve to the release name and the release is `rask`.
#
# Helm hard rules for this chart: numeric knobs use `(hasKey $parent "key") | ternary` — NEVER
# `| default <n>`, which swallows an explicit 0 (tests/unit/test_invariants.py enforces it).

# Pinned so in-cluster service names are rask-<component> (release name is also rask).
# -- Base name for every rendered object; pinned to `rask` so in-cluster Services resolve as `rask-<component>`.
fullnameOverride: "rask"
# -- Overrides the chart name used in `rask.name` labels when `fullnameOverride` is empty. Empty uses the chart name.
nameOverride: ""

# -- List of pull Secrets ({name: ...}) added to every first-party pod and hook Job. Empty pulls anonymously.
imagePullSecrets: []

# singleTenant gates the LEGACY single-tenant default workloads (the default
# domain services + /default frontends + default Postgres/NATS/migration).
# Default false => front-door-only install (picker + controlplane + gateway +
# operators). Set true to restore the old single-tenant stack.
# NOTE: the OBJECT STORE is
# deliberately NOT in this list: minio.enabled alone gates the operator Tenant
# (docs/adr/0124-chart-unification-one-control-plane-each-one-object-store.md) because the lakehouse plane resolves `rask-minio:9000`
# regardless of singleTenant.
# The storage registry served to the object browser. Empty => the built-in defaults (every store on
# the deployment's own S3). Declare stores here when they do NOT all live on one backend: `endpoint`
# names the host, `secret` is a Dapr secret-store key holding {access_key, secret_key}, `insecure`
# skips TLS verification for hosts with a private CA.
#
#   stores:
#     - { name: images-batch, bucket: images-batch, role: raw, endpoint: "https://<tenant>.<hcp-domain>",
#         insecure: true, secret: hcp-s3, description: "Source page images, as harvested." }
storage:
  # DECLARED rather than left to the built-in defaults, and the reason is the `secret` field: a store
  # that declares one takes its credentials from the Dapr secret store (`objects.py::_creds`, cached
  # and fail-closed); one that declares none falls back to the deployment's process env. That fallback
  # is what put the store's ROOT credential in the viewer's environment.
  # The warehouse row IS the built-in default (`service_kit.schemas.storage.DEFAULT_STORES`) — same name,
  # bucket and role — carrying the secret that makes the Dapr path the only path. The telemetry store is
  # the platform's (ADR 0153), so no observability bucket is registered.
  # -- Object-store registry rendered as RASK_STORES for the fleet and the explorer viewer; each entry is {name, bucket, role, secret, description, endpoint?, insecure?}, `secret` a Dapr secret-store key.
  stores:
    - name: lance-catalog
      bucket: lance-catalog
      role: bronze
      secret: viewer-s3
      description: The lakehouse warehouse — the governed medallion datasets.

singleTenant:
  # -- Renders the single-tenant default workloads (every fleet service, domain zones). False installs front-door services only; the object store is gated by `minio.enabled`.
  enabled: false

# Optional override: if set, this Secret is used verbatim instead of the chart's `<release>-app`
# (prod with external deps). It carries configuration (the object store's access key ID and endpoint),
# never a credential.
# -- Name of a pre-made Secret used instead of the chart's `<release>-app` (object store access key ID and endpoint, never a credential). Empty renders `<release>-app`.
existingSecret: ""

# NO CREDENTIAL IS A CHART VALUE ([[XC-004]]). Every secret the estate uses lives in the secret store and
# reaches a pod from it: the Dapr secret store for a sidecar, an ExternalSecret for a pod without one.
# The dev OpenBao's are generated in-cluster (templates/external-secrets.yaml, `<release>-dev-credentials`);
# a real deployment's are provisioned in the platform's store by its operator, and the render refuses a
# credential passed as a value (templates/prod-credentials.yaml).
secrets:
  # THE HUGGING FACE TOKEN is a third party's credential, so nothing here can generate it. The operator
  # writes it to the store at `<kvMount>/hf-token`, field `token` (dev: `make k3s-up` with HF_TOKEN set
  # writes the bootstrap Secret `<release>-supplied-credentials` the dev OpenBao seeds it from), then sets
  # this so the `<release>-hf-token` ExternalSecret renders. Off, the Ray pods start without HF_TOKEN.
  # -- True once the Hugging Face token is in the secret store at `<kvMount>/hf-token`; renders the `<release>-hf-token` ExternalSecret. False starts Ray pods without HF_TOKEN.
  hfTokenInStore: false

# INTERACTIVE API DOCS — /docs, /redoc and /openapi.json — across every app in the release.
#
# OFF, and the reason it is one knob rather than a per-service choice is the defect it closes. Four
# services already had a `docs_enabled` setting; all four defaulted it to True and NO manifest
# anywhere set it, so the flag documented a decision nobody was making and the schemas shipped openly.
# Three more (viewer, search, annotator) and the gateway had no flag at all.
#
# The gateway is the one that matters: `templates/ingress.yaml` publishes `/api` at the edge, and its
# `{prefix}/openapi.json` answers anonymously by fanning out to every backend it fronts — a merged
# route table plus an amplification lever, in one unauthenticated GET.
#
# Turn it on for a dev cluster (deploy/values-local.yaml does). Leave it off anywhere reachable.
docs:
  # -- Serves /docs, /redoc and /openapi.json on every app in the release, the gateway included. Off by default; turn on only for a dev cluster.
  enabled: false

# Non-secret env shared by the fleet ConfigMap.
config:
  # -- Path prefix the fleet apps mount their API under, via the shared fleet ConfigMap.
  RASK_API_PREFIX: "/api"
  # -- AWS region written to the fleet ConfigMap for S3 clients; any value works against RustFS/MinIO.
  AWS_REGION: "us-east-1"
  # -- Skips TLS verification for the S3 client (`storage.client` reads it as an alias of RASK_S3_INSECURE). String "true" or "false".
  HCP_INSECURE: "true"

# Per-service definitions. TWO planes share this map, by design of the merge:
#   * the rask FLEET (gateway, controlplane, flows, notifications) — rendered by templates/fleet.yaml, which ranges over this
#     map but only emits the `gateway` entry unless singleTenant.enabled;
#   * the lance-ns LAKEHOUSE apps (catalog, lineage) — rendered by templates/services.yaml, which
#     reads .Values.services.catalog / .Values.services.lineage by NAME.
# RESOLVED (P4 collision guard, docs/adr/0124-chart-unification-one-control-plane-each-one-object-store.md): fleet.yaml excludes the lakehouse entries by name (its $lakehouse
# list — catalog, lineage), unconditionally, so each service renders from exactly ONE template under
# every singleTenant combination: the fleet entries from fleet.yaml, catalog+lineage from
# services.yaml. A new lakehouse entry added to this map must also be added to that list.
# The peers whose `x-forwarded-*` headers uvicorn may believe, for EVERY fleet pod (rendered by
# rask.proxyHeaderArgs alongside --proxy-headers).
#
# 127.0.0.1 is uvicorn's own default and what the six fleet dockerfiles hardcode in their CMD — the
# value you would use if the proxy were a sidecar in the same pod. It is not: the gateway's proxy is
# the INGRESS CONTROLLER, in another pod on another IP, so the match can never succeed and every
# forwarded header is silently ignored. Set this to the ingress controller's pod CIDR (k3s default
# 10.42.0.0/16) for the client IP and scheme to be real. Left at the default here so an existing
# install changes nothing silently.
#
# '*' IS REFUSED at render time — it trusts every peer, so any client could forge its own source IP.
# The gateway strips and re-stamps the forwarded chain either way (see _CLIENT_SPOOFABLE), so a
# backend never sees a client's own claim; this key decides only whose claim the gateway believes.
# -- Peers whose x-forwarded-* headers uvicorn trusts in every fleet pod (--forwarded-allow-ips). Set to the ingress controller's pod CIDR; `*` is refused.
forwardedAllowIps: 127.0.0.1

services:
  # ==== rask fleet (uvicorn modules, one Deployment each via templates/fleet.yaml) ====
  # (compute, the Ray plane's service, is not here: it is a bring-your-own engine's companion and installs as its
  # own release, deploy/fixtures/compute.)
  # The studio flow-builder's server half: the node catalog, graph validation, and runs on two lanes
  # (inline, or the Dapr Workflow orchestrator when a sidecar is injected). It needs NOTHING to boot —
  # no store, no cluster — so it is part of the default install: the builder's client-side lane works
  # without it, but "engine offline" is what a user sees, and durable runs are unreachable.
  #
  # `frontDoor: true` because the gateway carries /api/flows and a front-door-only install still serves
  # the studio zone. Serve is reached from the ZONE (bytes ride its own +server.ts), never from here, so
  # this service needs no Serve URL of its own.
  flows:
    # -- uvicorn import path the flows (studio flow-builder server) Deployment runs.
    module: "flows:app"
    # -- Container and Service port of the flows app.
    port: 8840
    # -- Replica count of the flows Deployment; 0 scales it to zero.
    replicas: 1
    # -- Renders flows outside singleTenant, because the gateway routes /api/flows to it.
    frontDoor: true
    # The run door spends GPU compute (model nodes invoke live Serve endpoints), so on a governed
    # stack it checks the estate writer tier — FlowsSettings extends GovernedAuthSettings (LANCE_*).
    # -- Gives flows the OIDC/FGA env and FGA token mount when auth.enabled; its run door checks the writer tier.
    governedAuth: true
    # -- List of dependencies flows waits for in an init container; only `minio` is honoured (when minio.enabled).
    waitFor: []
  # The notification plane: one InboxActor per subject, holding
  # claim-check pointers with durable read state, so the bell counts YOUR work instead of the whole
  # estate's. Its own app-id because an inbox aggregates lineage runs and catalog governance and
  # belongs to neither producer.
  #
  # `frontDoor: true` because the gateway carries /api/notifications unconditionally — an install
  # without this Deployment answers ERR_DIRECT_INVOKE on the route the bell polls, in every zone.
  #
  # replicas: 1 is the fleet default, not an actor constraint: Dapr placement distributes actor ids
  # across hosts, and the bus subscription's `queueGroupName` makes replicas a competing-consumer
  # group. What must NOT be scaled is uvicorn WORKERS inside one pod — see the dockerfile.
  notifications:
    # -- uvicorn import path the notifications (inbox) Deployment runs.
    module: "notifications:app"
    # -- Container and Service port of the notifications app.
    port: 8850
    # -- Replica count of the notifications Deployment; replicas form a competing-consumer group. 0 scales it to zero.
    replicas: 1
    # -- Renders notifications outside singleTenant, because the gateway routes /api/notifications to it.
    frontDoor: true
    # The inbox door verifies the bearer and re-derives visibility per recipient — NotificationsSettings
    # extends GovernedAuthSettings, so the prefix is LANCE_ like flows'.
    # -- Gives notifications the OIDC/FGA env and FGA token mount when auth.enabled.
    governedAuth: true
    # This service HOSTS a sidecar-delivered route (`POST /lineage-events`) and refuses to start
    # without the token: `register_subscriptions` calls `assert_app_token_configured`, which raises
    # whenever RASK_DAPR_ENABLED is true and APP_API_TOKEN is unset — the estate's fail-closed rule for
    # a live delivery route. So this flag is not a preference, it is the difference between a running
    # pod and a CrashLoopBackOff on the DEFAULT install (dapr.enabled is on).
    #
    # It is the first fleet.yaml service to need the token: every other caller of
    # `assert_app_token_configured` is a lance-plane pod (catalog, lineage, maintenance) templated elsewhere, each rendering APP_API_TOKEN explicitly. In fleet.yaml
    # the token had only ever been reachable through `lanceWriter`, which this service is not.
    # -- Renders APP_API_TOKEN for notifications, which refuses to start with Dapr on and no token.
    daprIngest: true
    # The SECOND ingress (open_notifications.md §2). The bus carries run lifecycle; Ray TRAIN
    # and every external OpenLineage producer emit over HTTP only and never reach the topic,
    # so a subscribe-and-stop plane silently never notifies a whole class of run. This cron ticks the
    # sidecar-only reconcile route, which walks lineage's durable `GET /events` down from a persisted
    # cursor. It is also the catch-up path after a notifications outage.
    #
    # One key, two renders: `notifications-cron.yaml` names the Component from it and `configmap.yaml`
    # renders RASK_NOTIFICATIONS_BINDING_NAME from it. Dapr delivers an input binding to the route
    # matching the COMPONENT NAME, so a second literal on the app side is a cron that ticks into a 404.
    # CHANNELS (S5) — email and Slack, both OFF by default. A channel is an interruption someone has
    # to ask for, so the estate's posture is chosen here rather than implied by a template; the
    # per-user opt-in is a separate act on top (`PUT /api/notifications/prefs`).
    #
    # Credentials come from the secret store ONLY — the Components carry `secretKeyRef`, never a
    # value. There is deliberately no plaintext fallback to fall back to.
    channels:
      email:
        # -- Renders the `notifications-email` Dapr SMTP binding and adds `email` to RASK_NOTIFICATIONS_CHANNELS. Off by default.
        enabled: false
        # -- SMTP server host for the email channel.
        host: ""
        # -- SMTP server port for the email channel (default 587).
        port: 587
        # -- Sender address the email channel sends from.
        from: ""
        # -- Secret-store key holding the SMTP `user` and `password` fields.
        secretName: notifications-smtp
      slack:
        # -- Renders the Slack Dapr binding and adds `slack` to RASK_NOTIFICATIONS_CHANNELS. Off by default.
        enabled: false
        # -- Secret-store key holding the Slack `webhookUrl` field.
        secretName: notifications-slack
    # -- Name of the reconcile cron binding; also rendered as RASK_NOTIFICATIONS_BINDING_NAME so the tick reaches the matching route.
    reconcileBindingName: notifications-reconcile-cron
    # Must stay ABOVE RASK_NOTIFICATIONS_RECONCILE_BUDGET_SECONDS (app default 25 s), or a slow lineage
    # lets ticks stack on each other instead of the next one finding the same work still to do.
    # -- Schedule of the reconcile cron over lineage's /events feed; must stay above the app's 25 s reconcile budget.
    reconcileSchedule: "@every 30s"
    # -- Env-var map rendered verbatim into the notifications container; RASK_LINEAGE_SERVICE_IDENTITY is the subject it maps to at lineage's door.
    env:
      # The subject notifications' ServiceAccount maps to at lineage's door (`lance.saSubjects`
      # reads it; its projected `rask-lineage` token is what authenticates). Remove it and the
      # reconciler maps to the `notifications` default.
      #
      # Admission is only half of it: the reconciler reads `/events/projection`, gated on
      # `can_read_event_feed` at the estate root, and `bootstrap-admin.yaml` grants this same subject
      # `event_reader` there ([[CTL-021]]). Without the grant every feed page answers 403.
      RASK_LINEAGE_SERVICE_IDENTITY: notifications
    # -- List of dependencies notifications waits for in an init container; only `minio` is honoured (when minio.enabled).
    waitFor: []
  gateway:
    # -- uvicorn import path the gateway Deployment runs.
    module: "gateway:app"
    # -- Container and Service port of the gateway (the /api reverse proxy the Ingress routes to).
    port: 8888
    # -- Replica count of the gateway Deployment; 0 scales it to zero.
    replicas: 1
    # -- Renders the gateway outside singleTenant; it is the /api entry point.
    frontDoor: true
    # The gateway proxies /api/* to backends, so probing a proxied path would couple its readiness
    # to an upstream — it must stay Ready in a front-door-only install (no domain backends).
    # THAT REASON IS INTACT AND THE EXCEPTION IS GONE. Both probes pointed at the gateway's own
    # hand-rolled /healthz, which made it the one fleet app outside the estate's drain-aware pair and
    # the one row every probe gate had to skip by name. It now mounts `service_kit.probes` with NO
    # ready_check, so /readyz reports `starting`/`shutting_down` and asks no upstream: the recorded
    # reason never required a private probe, only an unproxied one. /healthz remains as the gateway's
    # public badge, exactly as /api/health remains the fleet's.
    # -- Liveness probe path of the gateway (default `/livez`).
    healthPath: /livez
    # -- Readiness probe path of the gateway (default `/readyz`); it asks no upstream, so the gateway stays Ready without backends.
    readyPath: /readyz
    # -- List of dependencies the gateway waits for in an init container; only `minio` is honoured (when minio.enabled).
    waitFor: []

  # ==== lance-ns lakehouse apps (templates/services.yaml; share the catalog image, different entrypoint) ====
  catalog:
    # -- uvicorn import path the catalog Deployment runs (templates/services.yaml).
    module: catalog.main:app
    # -- Container and Service port of the Lance catalog.
    port: 2333
    # -- Dapr app-id of the catalog; also names its pubsub components and durable consumers.
    daprAppId: catalog
    # -- Replica count of the catalog; above 1 requires catalog.controlEmit=true or the render fails.
    replicas: 1 # stateless — scale freely in prod (the prod overlay bumps these); HA via podDisruptionBudget
  lineage:
    # -- uvicorn import path the lineage Deployment runs (templates/services.yaml).
    module: lineage.main:app
    # -- Container and Service port of the lineage service.
    port: 8000
    # -- Dapr app-id of lineage; also names its pubsub, DLQ and durable consumers and scopes its reconcile cron.
    daprAppId: lineage
    # Freshness budget in HOURS (data-contract gap #2): >0 makes the reconcile sweep + per-dataset
    # GET flag `stale: true` for any dataset whose newest version commit is older — arrival cadence
    # becomes an ASSERTED contract clause (WARN `lineage_reconcile_stale` on the tick). 0 = off.
    #
    # 48 IS THE OWNER'S NUMBER (2026-09-11), and it is a policy rather than a measurement: a lane that
    # has landed nothing in two days has stopped, while a quiet weekend day has not. It was 0 — the axis
    # OFF estate-wide — so no dataset had ever been reported stale and the clause the reconciler
    # advertises was asserted against nothing.
    # -- Hours after which a dataset with no new version is flagged `stale` by reconcile and the dataset GET. 0 turns the check off.
    freshnessBudgetHours: 48
    # Safe to scale: the app's own pubsub component carries queueGroupName=lineage, so replicas form a
    # competing-consumer group (single delivery per event); ingest is idempotent anyway (MERGE on run_id).
    # -- Replica count of lineage; replicas form a competing-consumer group, so it scales freely.
    replicas: 1
    # Demo data-peek router (/demo/*: live Lance schema/versions/rows for the UI) — DEMO ONLY: the
    # endpoints carry no OIDC/FGA guard, so they'd disclose dataset metadata past the governance layer
    # (reachable unauthenticated through the web BFF — bug hunt 2026-07-13). SECURE-BY-DEFAULT off; a demo
    # opts in with `--set services.lineage.demoData=true`. The router is only mounted when true.
    # -- Mounts the unauthenticated /demo/* data-peek router. Demo only; off by default.
    demoData: false
    # Read-side audit trail: every allowed FGA-gated data read is recorded (the lineage_reads table),
    # feeding GET /datasets/{name}/readers + the ReadersPanel in the data/lineage zones. Rendered into
    # LINEAGE_READ_AUDIT_ENABLED only when auth.enabled (that is where a real subject exists to record) —
    # the read-side mirror of auth.audit; set false to keep the panel dark even with auth on.
    # -- Records every allowed FGA-gated data read (feeds GET /datasets/{name}/readers). Rendered only when auth.enabled.
    readAudit: true
    # Periodic storage->graph reconciliation (B4) — a Dapr cron binding POSTs to /<bindingName> on
    # `schedule` to back-fill Lance writes whose lineage event was lost, and to DRAIN the #4 outbox.
    #
    # DEFAULT ON (was off, which the helm NOTES then had to warn about on every single install — "a
    # lineage event lost between the Lance commit and the publish stays lost"; live-proof 2026-07-28,
    # defect 7. A default that every install is told to change is a wrong default, and the thing it
    # protects is the provenance graph's completeness, i.e. the whole point of the lineage plane.)
    #
    # Why default-ON is safe, not just desirable:
    #   * IDEMPOTENT — ingest MERGEs on run_id, so re-ingesting an event the graph already has is a
    #     no-op; the sweep cannot duplicate provenance.
    #   * SINGLE-FLIGHTED — the sweep holds a lock, so overlapping ticks (or multiple lineage replicas
    #     in the competing-consumer group) cannot run it concurrently.
    #   * NON-DESTRUCTIVE by default — the only deleting behaviour is :Run pruning, gated separately by
    #     runRetentionDays (0 = off, below), and staleness only WARNs (freshnessBudgetHours, 0 = off).
    #   * RENDER-GATED — the cron binding renders only with dapr.enabled, so a
    #     sidecar-less install silently gets nothing new rather than a dangling component.
    #   * BOUNDED — one sweep per `schedule` (300s here; prod wants a cron expression), reading Lance
    #     versions the graph already tracks.
    # Set false only for a deliberately inert demo; the /datasets/{name}/reconcile READ endpoint is
    # available either way.
    reconcile:
      # -- Renders the storage-to-graph reconcile cron, which back-fills lost lineage events, drains the outbox and prunes. Needs dapr.enabled.
      enabled: true
      # -- Name of the reconcile cron binding; the sidecar POSTs to /<bindingName>.
      bindingName: lineage-reconcile-cron
      # -- Schedule of the reconcile sweep (Dapr cron syntax, e.g. `@every 300s` or a cron expression).
      schedule: "@every 300s" # demo cadence (prod: e.g. "0 */15 * * * *")
    # #4 transactional outbox: producers stage each lineage event to s3://<minio.bucket>/_lineage_outbox
    # BEFORE the fire-and-forget publish; the reconcile sweep DRAINS any survivor (a crash between the Lance
    # commit and the publish), re-ingesting the FULL event (inputs/author/columnLineage) — narrowing the loss
    # window to commit->stage, which the DLQ + version-only back-fill cannot. Requires reconcile.enabled (the
    # drain runs in the sweep).
    #
    # DEFAULT ON, with reconcile above: staging and draining are ONE mechanism, and half of it is worse
    # than either half alone — reconcile without the outbox can only back-fill that a version EXISTS
    # (author, inputs and column lineage are gone), and the outbox without reconcile stages events that
    # nothing ever drains. Cost is one S3 PUT + DELETE per lineage event against the already-provisioned
    # `minio.bucket`; the whole thing is a no-op when the URI env isn't rendered.
    outbox:
      # -- Stages each lineage event to `s3://<minio.bucket>/_lineage_outbox` before publishing, drained by reconcile. Requires reconcile.enabled.
      enabled: true
    # Run-node retention (§4): the reconcile cron prunes graph :Run nodes older than this many days
    # (batched DETACH DELETE under the sweep's single-flight lock), and then the Dataset nodes that
    # prune ORPHANS. Only meaningful with reconcile.enabled (the cron is the pruner).
    #
    # 30 BY OWNER RULING 2026-09-08, and 0 (keep everything) is what it replaced. Keeping everything
    # was not free: it is a RETENTION knob whose real cost is a CONTROL. The reconcile probes every
    # dataset node the graph holds, so residue makes `storage_loss` and `unreadable` fire on every tick
    # carrying dead rows, and a REAL bucket deletion arrives invisible among them — measured on this
    # estate at 1,271 Dataset nodes against 5,692 runs, the datasets every one still edge-reachable.
    #
    # Thirty days is long enough to investigate an incident that surfaced late and short enough that
    # the graph actually converges; a quarter would have left the current residue in place for months.
    # -- Days after which reconcile prunes graph :Run nodes and the Dataset nodes that leaves orphaned. 0 keeps everything.
    runRetentionDays: 30
    # Durable /events feed retention, in DAYS of ARRIVAL time (`received_at`, stamped by the database —
    # never the producer-supplied eventTime, which lineage stores as an unparsed string). Pruned batched
    # on the same reconcile tick, under the same single-flight lock. 0 = unbounded.
    #
    # DAYS, BECAUSE THE CONSUMER OF THIS FEED REASONS IN DAYS. `services/notifications` walks it from a
    # persisted cursor as the estate's catch-up path after an outage — the bus alone provably misses
    # Ray TRAIN and every external OpenLineage producer — so what an operator needs from this
    # number is *how long an outage the feed survives*. A row- or seq-denominated bound cannot say:
    # measured 2026-09-08, a 20 000-seq window held 3 133 rows because every ON CONFLICT-rejected
    # redelivery consumes a sequence value without leaving a row, so the horizon contracted precisely
    # when redelivery rose. `notifications_feed_gaps_total` recorded 559 lossy reconciler passes on
    # 2026-08-29 and 1 537 on 2026-08-30.
    #
    # 7 is the horizon the deployed feed was measured holding, so the default states it rather than
    # changes it. Raise it if this estate's acceptable notifications outage is longer than a week.
    # -- Days of arrival time the durable /events feed keeps, pruned on the reconcile tick; bounds how long a notifications outage it survives. 0 is unbounded.
    eventsRetentionDays: 7
    # Server-side per-statement timeout (seconds) on the AGE pool — bounds a runaway Cypher traversal.
    # -- Server-side per-statement timeout in seconds on lineage's AGE pool; bounds a runaway Cypher traversal.
    ageStatementTimeoutSeconds: 30

# Image registry/tag shared by every fleet + migration container, PLUS the per-image lance-ns block so
image:
  # A REGISTRY, e.g. ghcr.io/<org>/<repo> or localhost:5000. Required — see `rask.image` in
  # _helpers.tpl for why an empty default was actively harmful: it rendered a BARE `gateway:dev`,
  # which is `docker.io/library/gateway:dev`, and only ever worked because `make k3s-import` had
  # side-loaded the tag into the node. A GitOps reconciler has no such side channel.
  # -- Registry prefix for every first-party image (e.g. ghcr.io/<org>/<repo>). Required unless localImages is true.
  repository: ""
  # -- Default tag for every first-party image when no per-component tag or digest is set.
  tag: "dev"
  # Set to pin the deployed artifact by content rather than by a mutable tag. WINS over `tag`.
  # This is what an image-automation controller (Argo Image Updater, Flux) writes back into git.
  # -- Global digest pin (sha256:...) for every first-party image; wins over `tag`. Empty uses tags.
  digest: ""
  # PER-COMPONENT pins (#135) — the reason a `helm upgrade` stopped being destructive.
  #
  # One `tag` above cannot describe this fleet. A real estate runs a catalog tag across 11 services,
  # a different tag on gateway/compute/controlplane, a third across the 7 zones, and a
  # DIGEST on one more. Rendering all of them from one value overwrites every image with a tag that is not on
  # the node — observed twice on 2026-08-06, once taking the whole fleet to ImagePullBackOff.
  #
  # Keys are the COMPONENT name the template passes to `rask.image` (`gateway`, `controlplane`,
  # `lance-rest-catalog`, `web-lakehouse`, …) — the same string that appears in the rendered
  # reference. `digests` beats `tags`, exactly as the global `digest` beats the global `tag`.
  #
  #   tags:    { lance-rest-catalog: be-256ca0da, web-lakehouse: zone-14d8882d }
  #   digests: { gateway: "sha256:834d2e23…" }
  # -- Per-component tag map keyed by component name (gateway, lance-rest-catalog, web-<zone>, ...); beats the global tag.
  tags: {}
  # -- Per-component digest map keyed by component name; beats `tags` and the global tag.
  digests: {}
  # Opt-in for side-loaded images (`make k3s-build` + `k3s-import`, `kind load`): renders a bare
  # `<component>:<tag>` that the node must ALREADY hold. Never set this for a remote cluster.
  # -- Renders bare `<component>:<tag>` references for images side-loaded into the node (k3s-import). Never for a remote cluster.
  localImages: false
  # -- imagePullPolicy for first-party containers.
  pullPolicy: IfNotPresent
  # The lakehouse image: catalog (catalog.main:app) + lineage (lineage.main:app) + maintenance + the media
  # services all run from this one image, different entrypoint.
  # `lance.catalogImage` uses required() on the tag, so an empty tag FAILS the render loudly.
  # -- Lakehouse image (catalog, lineage, maintenance, media services): `repository` is the image name under image.repository, `tag` is required (empty fails the render).
  catalog: { repository: lance-rest-catalog, tag: dev }

resources:
  # rask fleet tier (templates/fleet.yaml).
  # -- CPU/memory requests and limits for fleet services (templates/fleet.yaml) that name no tier of their own.
  fleet:
    requests: {cpu: "50m", memory: "128Mi"}
    limits: {cpu: "1", memory: "512Mi"}
  # AGE is a DATABASE and was sized as a stateless app container, which is a different thing. It asks
  # `lance.resources` for a `comp="age"` tier (templates/age-postgres.yaml:155); with no such key it
  # silently fell through to `default` below — 128Mi request, 512Mi limit — and Postgres does not
  # degrade gracefully at a memory ceiling: the kernel kills ONE BACKEND and Postgres then terminates
  # every other active backend and reinitialises, so a single OOM takes the whole graph into crash
  # recovery and drops every in-flight connection.
  #
  # THE SYMPTOM IS INVISIBLE TO KUBERNETES, which is why this stood. Measured on the live estate
  # 2026-09-14: `rask-age-0` steady at 385Mi against the 512Mi cap, FIVE `server process ... was
  # terminated by signal 9: Killed` events in 24 hours — and `restartCount: 0`, Running 48d. The pod
  # never restarts because the container's PID 1 survives; only backends die. Downstream it surfaced as
  # `psycopg.OperationalError: consuming input failed: server closed the connection unexpectedly`,
  # eight times in two hours, four of them reaching a caller as a 500 on `GET /runs` — and as one of
  # the two e2e legs that flip between consecutive runs ([[LH-109]]).
  #
  # THE WORKING SET NEVER FIT, which the post-fix measurement settles: given room, this pod settles at
  # 652Mi — ABOVE the old 512Mi limit. The 385Mi "steady" figure was a process being held under its
  # ceiling by the kernel, not a process that wanted 385Mi, so the kills were structural rather than a
  # bad-luck spike and no amount of load-shedding would have avoided them.
  #
  # The request is raised as well as the limit: a database's working set is resident, not burstable, so
  # a 50m/128Mi request misdescribes it to the scheduler.
  # -- CPU/memory requests and limits for the AGE Postgres StatefulSet (lineage and OpenFGA databases).
  age:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  # lance-ns default tier — every app container that doesn't name its own key (lance.resources helper).
  # -- CPU/memory requests and limits for every lakehouse app container that names no tier of its own (lance.resources).
  default:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # THE TWO HPA TARGETS, and they exist because of that: an HPA's `averageUtilization` is a fraction
  # of the REQUEST, so on the `default` tier above (50m request, 1000m limit — 20:1) a 70% target
  # fires at 35 millicores. Any real request load clears that instantly, the HPA slams to
  # maxReplicas, and it oscillates as the burst passes. Requests are raised, limits are NOT, so the
  # burst headroom is unchanged and only the denominator becomes meaningful (4:1).
  # Memory is deliberately left on the default tier: this is the autoscaling finding, and the
  # catalog's 256 MiB Arrow-IPC body cap against a 512Mi limit is a separate question.
  # -- CPU/memory requests and limits for the catalog; requests sized so the HPA CPU target is meaningful.
  catalog:
    requests: { cpu: 250m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # -- CPU/memory requests and limits for lineage; requests sized so the HPA CPU target is meaningful.
  lineage:
    requests: { cpu: 250m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # THE COLLECTOR, which named no tier and therefore silently ran on `default` — 50m CPU — while being
  # the sole path for every Dapr sidecar's metrics, every infra pod's logs and the whole estate's three
  # signals. Measured 2026-08-23: 45m against a 50m request, i.e. 90% of its request with ~10% headroom.
  # Converging the fleet's OTel env onto this Collector takes it from 10 producers to 16, so this tier is
  # that change's own blast radius rather than an adjacent nicety.
  #
  # RAISE REQUESTS, NOT THE MEMORY LIMIT. `memory_limiter.limit_mib: 400` is hardcoded in
  # templates/otel-collector.yaml and does not track this tier, so a 1Gi limit would buy headroom the
  # Collector refuses to use — it still sheds telemetry at 400 MiB. At 512Mi the limiter sits at ~78% of
  # the limit, which is upstream's guidance, and requests == limits gives the pod Guaranteed QoS for
  # memory, which is what you want under a fixed soft limiter.
  # -- CPU/memory requests and limits for the OTel Collector; memory limit matches its hardcoded 400 MiB memory_limiter.
  otel-collector:
    requests: { cpu: 300m, memory: 512Mi }
    limits: { cpu: "1", memory: 512Mi }
  # The assist model runner holds two warm torch models (~1.1 GB weights) and burns real CPU per
  # inference (multi-threaded GEMMs) — the request-pod default would OOM-kill it at load.
  # -- CPU/memory requests and limits for the assist model runner (two warm torch models).
  assist:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "8", memory: 6Gi }
  # The viewer is not a request pod: it holds an in-process lance-graph CypherEngine over the KG and a
  # cache of Arrow-IPC atlas point clouds, both sized by the corpus. On the default 512Mi tier a SINGLE
  # `GET /api/graph/status` (what the media zone's /graph page calls on mount) OOM-killed it — measured
  # 2026-07-26, kernel `Memory cgroup out of memory: Killed process (uvicorn)` anon-rss:510000kB, exit
  # 137, and the annotator's next thumbnail fetch surfaced the bare 502.
  #
  # Sizing, from cgroup memory.current on the live pod (11 GB corpus: 145,175 chunks, 139,407 KG
  # entities, 290,408 relations, 507,344 mentions):
  #   idle 124Mi → all 1154 thumbnails 139Mi → three atlas point clouds 265Mi → KG engine built 736Mi
  #   → full concurrent mixed drive 609Mi steady, high-water 955Mi (the KG build's transient).
  # 1536Mi = 1.6x the measured 955Mi peak; requests 768Mi covers the 609-736Mi steady working set.
  # CPU 2 is for the thumbnail grid, measured at conc 8: 172 req/s p95 80ms at 1 core vs 310 req/s
  # p95 46ms at 2 — the annotator opens a whole page of tiles at once.
  # -- CPU/memory requests and limits for the explorer viewer (in-process KG engine and atlas cache).
  viewer:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { cpu: "2", memory: 1536Mi }

# === Graceful rollouts =============================================================================
# preStop sleep: endpoint removal must propagate to kube-proxy/the Dapr sidecar BEFORE the app receives
# SIGTERM, else every rollout connection-refuses in-flight requests (and the apps' /readyz shutting_down
# branch is dead code). terminationGracePeriodSeconds bounds preStop + the app's own drain; compaction
# gets a longer budget so an in-flight sweep/Lance write is never SIGKILLed mid-transaction.
#
# THE ARITHMETIC, stated rather than implied, because three numbers here have to agree and nothing
# else forces them to:
#
#     terminationGracePeriodSeconds  >=  preStopSeconds              (endpoint removal propagates)
#                                      + sidecarBlockShutdownSeconds (daprd flushes pending acks)
#                                      + buffer (5s)
#
# The sidecar term is the one that was missing entirely. `rask.daprAnnotations` said nothing about
# shutdown, so daprd took its own 5s default — and the kubelet SIGTERMs every container in the pod
# SIMULTANEOUSLY, so the sidecar was gone before the app's drain window had properly opened. An app
# that finished its Lance write and then called publish_event published at a sidecar that had already
# stopped: the write landed, the event did not, and nothing distinguishes that from a write that
# announces nothing.
#
# `sidecarBlockShutdownSeconds` must sit BETWEEN the two: longer than preStopSeconds or the sidecar
# still goes first, shorter than the grace period or the kubelet SIGKILLs it mid-flush having made it
# decline to flush earlier.
#
# THE APP'S OWN BOUND, from the same numbers:
#
#     uvicorn --timeout-graceful-shutdown  =  the pod's grace - preStopSeconds - teardownSeconds
#
# The app gets SIGTERM only once preStop has slept. uvicorn then stops accepting, waits for the
# requests in flight, and only after that runs the lifespan's `finally`. Its wait is unbounded by
# default, so one slow request holds the process until SIGKILL and the teardown never runs. At the
# bound uvicorn cancels the ASYNC work still running and runs the teardown, which keeps
# `teardownSeconds` before the kubelet's SIGKILL: 40 - 5 - 10 = 25s for the 40s pods,
# 120 - 5 - 10 = 105s for maintenance. Work in a THREAD (Starlette's run_in_threadpool, which runs
# maintenance's execute_unit) is not interrupted by the bound: it ends by returning, or by that
# SIGKILL at the pod's grace. uvicorn is the container's PID 1 (the command replaces the image's
# tini), where the kernel drops its closing re-raise of SIGTERM, so the process waits for the thread
# (measured 2026-09-28, uvicorn 0.51.0, 3s bound: a 25s threaded request kept a PID 1 up 25.1s after
# SIGTERM, and ended with the process at 3.9s when uvicorn was not PID 1).
# `teardownSeconds` is a budget, not a measurement of any lifespan. `rask.shutdownArg` renders the
# bound into every uvicorn whose command the chart sets (the assist runner keeps its image's CMD) and
# refuses to render a bound that is not positive or a negative teardownSeconds, whose bound would end
# after the SIGKILL. Pinned by tests/unit/test_uvicorn_drains_inside_its_pods_grace_period.py.
lifecycle:
  # -- Seconds every pod sleeps in preStop before SIGTERM, so endpoint removal propagates first.
  preStopSeconds: 5
  # 20s = 5 (preStop) + 10 (sidecar drain, the ~10s microservices.md budgets for Dapr flushing pending
  # acks) + 5 (buffer). It was 30, which was the no-sidecar formula applied to pods that all run one.
  # -- Pod grace period in seconds; must be at least preStop + sidecar drain + 5 s buffer.
  terminationGracePeriodSeconds: 40
  # -- Seconds the Dapr sidecar keeps running after SIGTERM to flush acks; must lie between preStopSeconds and the grace period.
  sidecarBlockShutdownSeconds: 20
  # -- Grace period in seconds for maintenance pods, long enough that an in-flight sweep or Lance write is not SIGKILLed.
  maintenanceTerminationGracePeriodSeconds: 120
  # -- Seconds reserved for the app's lifespan teardown; uvicorn's graceful-shutdown bound is grace - preStop - this.
  teardownSeconds: 10

# === Pod hardening (applied to every FIRST-PARTY app container via the lance.securityContext helper) --
# This line used to say "every app container", and for six Deployments it was false: fleet.yaml and
# controlplane.yaml called the helper nowhere, so gateway/compute/controlplane/flows/notifications
# rendered with no securityContext at all — including the pod the Ingress routes /api to. They call it
# now, and tests/unit/test_every_first_party_workload_is_hardened.py derives its subject list from the
# render, so a new first-party workload is covered by default rather than by memory.
# INFRA pods are a separate, deliberately staged decision — see security.infraContexts below.
# runAsNonRoot + drop-ALL-caps + RuntimeDefault seccomp are unconditional (the restricted PodSecurity
# baseline). readOnlyRootFilesystem is the one tunable: on by default (each app has a writable /tmp
# emptyDir for pyarrow/Lance spill + OTel), flip off only if a workload genuinely needs a writable rootfs.
security:
  # -- Read-only root filesystem for every first-party app container; each gets a writable /tmp emptyDir.
  readOnlyRootFilesystem: true
  # THE BOUND ON THE SCRATCH VOLUME, and it is a blast-radius bound rather than a quota.
  #
  # `readOnlyRootFilesystem: true` forces every app to write through an emptyDir at /tmp, and an
  # emptyDir with no sizeLimit may grow until the NODE's disk is full — at which point the kubelet
  # evicts every pod on that node under DiskPressure, not just the one that filled it. Three things
  # land here: starlette's SpooledTemporaryFile for each multipart file part (the media apps accept
  # uploads), pyarrow/Lance spill, and the OTel queue.
  #
  # Generous on purpose. Lance spill is workload-shaped and this must not evict a pod doing legitimate
  # work — the job is to stop one pod taking the node down with it. Raise it for a deployment whose
  # compaction genuinely spills more; the media body cap (32 MiB/request, MEDIA_MAX_BODY_BYTES) is the
  # bound that stops uploads reaching this one.
  # -- sizeLimit of each app's /tmp emptyDir (upload spool, Lance spill, OTel queue); stops one pod filling the node's disk.
  tmpSizeLimit: 2Gi
  # POD IDENTITY is not a value. Every first-party workload runs as its own ServiceAccount
  # (templates/security-sa.yaml), tokenless on the SA object. A first-party pod holds a Kubernetes API
  # token only when its SA carries a grant it uses: OpenBao under ESO, and the RBAC-bound controlplane,
  # Collector, Dapr dashboard and snapshot pods. `default` is the identity every unnamed pod in the
  # namespace shares, and a Dapr control plane grants it `secrets: get` unless its `dapr_rbac.secretReader`
  # is off (deploy/fixtures/dapr/values.yaml). Pinned by
  # tests/unit/test_a_first_party_pod_cannot_read_a_secret_through_the_kube_api.py.
  # securityContexts for the INFRA pods (app tier is already hardened via lance.securityContext)
  # + PSA-restricted compliance for the root busybox wait-age init containers (the audit's
  # sequencing footgun: label the namespace `pod-security.kubernetes.io/enforce=restricted` ONLY
  # after these boot green — the label itself is a kubectl step, the namespace isn't chart-owned).
  # Per-image uid/fsGroup (data/secret holders need the RIGHT ids for their PVCs, not helper reuse):
  infraContexts:
    # -- Applies pinned runAsUser/fsGroup securityContexts to the infra pods (AGE, OpenBao). Off by default.
    enabled: false
    # -- uid/fsGroup for the AGE Postgres pod (postgres image uid/gid 999).
    age: { runAsUser: 999, fsGroup: 999 } # postgres official image uid/gid
    # -- uid/fsGroup for the OpenBao pod (image uid 100).
    openbao: { runAsUser: 100, fsGroup: 1000 } # hashicorp vault-family image uid

# === Network isolation (opt-in; requires a policy-enforcing CNI e.g. Calico/Cilium) ===============
# k3s's default kindnet/flannel does NOT enforce NetworkPolicy, so this is a no-op there — it is prod
# hardening. When enabled: namespace default-deny Ingress+Egress, kube-dns egress allow (same change —
# the audit's footgun), intra-namespace allows, api-server egress, and EXCLUSIVE client lists for the
# guarded stores (openbao ← secret-consuming app pods ONLY; age-postgres ← its real clients;
# minio ← the data plane). Default OFF; flip in values-prod on a policy-enforcing CNI.
# ⚠ Under default-deny, EVERY Job/CronJob pod template needs explicit component labels or the policy
# blocks it silently (kindnet hides the failure) — see the templates' job specs.
networkPolicy:
  # NOTE (goal cond 8): the NATS pods are EXCLUDED from the general intra-namespace ingress allow; their
  # only ingress is two explicit, port-scoped rules — 4222 (clients) from any in-namespace pod (the daprd
  # sidecars live in nearly every app pod, so a label enumeration would be dishonest) and 8222 (monitor,
  # varz/jsz for the admin ops view) from the web-admin zone pods ONLY. 6222/7422 stay closed — see
  # network-policy.yaml (3e)/(3f).
  # -- Renders default-deny NetworkPolicies with explicit allows and exclusive client lists for the guarded stores. Needs a policy-enforcing CNI.
  enabled: false
  # Extra `from` peers for the openbao policy — e.g. the external-secrets operator's namespace:
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: external-secrets}}}]
  # -- List of extra NetworkPolicy `from` peers allowed to reach OpenBao (e.g. the external-secrets namespace).
  openbaoExtraFrom: []
  # Extra `from` peers for the minio policy — a client outside the release's component labels:
  # -- List of extra NetworkPolicy `from` peers allowed to reach the object store.
  minioExtraFrom: []
  # Extra egress rules (verbatim NetworkPolicy egress entries) for externalized backends —
  # off-cluster S3, a NATS outside this namespace (nats.url), an external OTLP endpoint.
  # -- List of extra egress rules, verbatim NetworkPolicy entries, for external backends (off-cluster S3, managed NATS, external OTLP).
  extraEgress: []

# Platform control-plane: read-only listing of operator Project CRs for the
# home picker. Its own ServiceAccount + ClusterRole (read projects only).
controlplane:
  # -- Deploy the controlplane service (the `/api/projects` surface) and its resiliency policy.
  enabled: true
  # -- HTTP port the controlplane listens on.
  port: 8820
  # -- Scheme of each project's entry link in the home gallery (RASK_PROJECT_URL_SCHEME): `http` or `https`.
  urlScheme: http

# === Micro-frontend zones: the SvelteKit SSR zones deployed from the ONE parametrized
# frontend.dockerfile (image <name>:tag). The catch-all `home` owns "/"; each domain zone is pinned to
# its base path /<name> in svelte.config.js (host carries the project; path carries the domain) and gets
# an Ingress rule (templates/ingress.yaml). image == app dir name under frontend/microfrontends/.
frontend:
  # -- Deploy the SvelteKit zone servers, one Deployment and Service per entry in `frontend.apps`.
  enabled: true
  # -- Replicas per zone Deployment; above 1 the chart also renders a PodDisruptionBudget per zone.
  replicas: 1
  # The Bun server's request-body ceiling for EVERY zone. `svelte-adapter-bun` defaults it to 512K,
  # which silently 413s any real upload (a page scan is megabytes) from the server itself — before the
  # route, so the answer is not our problem+json and the UI can only say "HTTP 413". Kept ABOVE the
  # BFF's own 25 MB inference guard so that guard is what a user actually reads.
  # -- Request-body ceiling of each zone's Bun server (BODY_SIZE_LIMIT), kept above the BFF's 25 MB inference guard.
  bodySizeLimit: 32M
  # Ray Serve's HTTP ingress origin, for the zones that run inference (studio's flow builder, the
  # annotator's producer calls). Empty => the dashboard every Ray consumer names (`rask.rayServeOrigin`;
  # an external dashboard host serves the apps too), so the builder cannot list an app it is unable to call.
  # Set this when the engine serves Serve somewhere the dashboard does not.
  # -- Ray Serve HTTP origin for zones that run inference; empty uses `ray.dashboardUrl`.
  serveUrl: ''
  image:
    # The DEFAULT tag; shared across zones. A zone may override it with `tag:` on its apps entry below —
    # that is what makes the zone split mean anything: independent deploy is the only thing a zone
    # boundary buys, and one shared tag across every zone cancels it.
    #
    # An IMMUTABLE commit tag, never `dev`. `dev` was the default here and it cost a day: it is a
    # MOVING pointer that no one owns, so the deployed UI was whatever last happened to claim the name
    # — measured 2026-08-04 as an image predating both the media→explorer rename and the compositor
    # removal, still serving a navbar reading "Search" with a dead top-level Workbench entry.
    #
    # The failure mode it creates is the reason this line matters more than it looks. Two lanes deploy
    # this cluster; one rolls a verified tag out with `kubectl set image`, the other renders this chart.
    # While the default was `dev`, EVERY chart render silently reverted the other lane's work (observed
    # three times in one session, ~10 minutes apart) — and neither side saw an error, because pulling
    # `dev` always succeeds. Pinning a commit makes the chart carry the intent, so a render REPRODUCES
    # the fleet instead of overwriting it, and a disagreement shows up as a diff in git rather than as a
    # UI that quietly rots back to last week.
    #
    # Bump this when new zone images are published (`dagger call zone-image --zone=<z> publish …`).
    # -- Default image tag for every zone (an immutable commit tag); a zone overrides it with `tag` on its `apps` entry.
    tag: "7ea481c"
    # -- Image pull policy for the zone containers; empty falls back to `image.pullPolicy`.
    pullPolicy: IfNotPresent
  service:
    # -- Port each zone's Bun server listens on and its Service exposes.
    port: 3000
  # -- Default CPU and memory requests/limits per zone container, used when `resources.web-<zone>` is not set.
  resources:
    requests: {cpu: "50m", memory: "64Mi"}
    limits: {cpu: "500m", memory: "256Mi"}
  podSecurityContext:
    # -- Pod-level securityContext for zone pods: refuse to start a container running as root.
    runAsNonRoot: true
  securityContext:
    # -- Container securityContext for zones: forbid privilege escalation.
    allowPrivilegeEscalation: false
    # -- Container securityContext capabilities for zones; drops ALL Linux capabilities.
    capabilities: {drop: ["ALL"]}
  # How long a zone's Bun server tolerates an idle connection, in seconds — the FIRST cut on a live query,
  # not the edge. svelte-adapter-bun defaults it to 10, which turned `query.live` into a ~12s reconnect
  # loop (nginx logged "upstream prematurely closed connection", upstream_response_time 12.001).
  # 0 = disabled, and the measurement is why. 255 is Bun's maximum; the estate HAS a keepalive
  # (`KEEPALIVE_MS` = 20s in feeds.remote.ts, which re-yields an unmoved cursor so bytes keep flowing)
  # and a stream still died at **256.8s**, measured over a 290s hold with the edge at 3600s. So Bun's
  # `idleTimeout` is not refreshed by outbound SSE writes: for a streaming response it behaves as a
  # maximum connection LIFETIME, and no keepalive can beat it.
  #
  # The objection to disabling it — a wedged client holding a socket for ever — is answered by that same
  # keepalive: every 20s the server WRITES to the socket, so a vanished peer fails the write and ends the
  # generator. The liveness check moved into the application, where it can tell a silent estate from a
  # silent client; the transport could not.
  # ⚠ Templates must read this with `(hasKey $fe "idleTimeoutSeconds") | ternary …` — `| default 255`
  # swallows this explicit 0 (the bug tests/unit/test_invariants.py now forbids chart-wide).
  # -- Bun server idle timeout per connection in seconds (0 to 255); 0 disables it so live query streams are not cut.
  idleTimeoutSeconds: 0
  # The bare FGA subject the zones' BFF names when reading lineage as a SERVICE (no user session) — must be
  # READER on the warehouse + the subject `-sa-web` maps to at lineage's door.
  # -- FGA subject the zones' BFF uses for service reads; the `<release>-sa-web` ServiceAccount maps to it. Must be reader on the warehouse.
  serviceIdentity: service-web
  # The zones. home = the catch-all "/"; every other zone is pinned to /<name>.
  # The union of both estates — one entry per zone directory (the zone-contract deploy-path gate
  # pins this list to frontend/microfrontends/*).
  # -- The zones to deploy: `name` (image `web-<name>`), `path` (/<name>) or `catchAll` for home at /, and an optional per-zone image `tag`.
  apps:
    - {name: home, catchAll: true}              # the platform home, "/"
    # rask domain zones surviving R8+R9: compute (the Ray plane rask owns) and studio.
    # storage folded into lakehouse, overview into compute (R16); discover retires at P7.
    - {name: compute, path: /compute}
    - {name: studio, path: /studio}
    # The MODEL-LIFECYCLE zone. It began as R17's `train` (submit/runs/monitoring/
    # analysis) and became `models` once lakehouse's models area physically migrated
    # into it: registry + experiments + pipeline now sit beside training and the
    # inference playground, so one zone answers everything about a model and the
    # lakehouse keeps only its LINEAGE.
    - {name: models, path: /models}
    # lance-ns zones. `lakehouse` is the MERGED estate zone: catalog + lineage + models + admin were
    # four separate zones on four Deployments, all reading the same catalog/lineage planes and all
    # shipped from one shared image tag — four SSR servers and a full document reload between them,
    # with none of the independent-deploy payoff. One zone, four areas under /lakehouse/<area>.
    - {name: lakehouse, path: /lakehouse}
    # The lance-media zones: full BFF zones like the rest — SSR on, the shared session handle, and
    # same-origin /<zone>/api/* proxy routes to the media Services (VIEWER_API/SEARCH_API/
    # ANNOTATOR_API env, rendered when explorer.enabled). Deploy together with explorer.enabled=true.
    - {name: explorer, path: /explorer}
    - {name: annotator, path: /annotator}
  # Per-user OIDC login (opt-in), shared across ALL zones — one origin, one sealed cookie, so a login on
  # any zone is a login on every zone. REQUIRED when enabled: publicIssuer, publicOrigin (forms the home
  # zone's /auth/callback redirect URI). The sealing key and the client secret come from the store.
  oidc:
    # ON BY DEFAULT, in lockstep with auth.enabled — the chart REFUSES the half-governed pair
    # (templates/auth-consistency.yaml), so these two must move together or the render fails.
    # -- Per-user OIDC login shared across all zones; must move together with `auth.enabled` (templates/auth-consistency.yaml).
    enabled: true
    # -- Browser-reachable IdP issuer URL, e.g. https://auth.example.com/dex; required when `oidc.enabled`.
    publicIssuer: "" # browser-reachable IdP issuer, e.g. https://auth.example.com/dex
    # -- Browser-reachable app origin, e.g. https://app.example.com; forms the /auth/callback redirect URI. Required when `oidc.enabled`.
    publicOrigin: "" # browser-reachable origin, e.g. https://app.example.com (forms the redirect URI)
    # The session-cookie sealing key is not a value: it is the store's `frontend-session-secret`, written
    # by ESO into `<release>-frontend-session` beside the client secret.

# === lance-ns nginx gateway: RETIRED (docs/adr/0117-nginx-is-retired-and-the-fastapi-gateway-is-the-in-cluster.md) ===
# The rask fleet gateway at services.gateway (uvicorn `gateway:app` on :8888) is the ONE front door; it
# carries the lance routes (/api/catalog, /api/lineage, /api/explorer/*) and the lineage
# sidecar-only 403 guard as Python middleware. templates/gateway.yaml (nginx ConfigMap +
# Deployment + Service) is deleted; the former top-level `gateway:` values block went with it.

# === Governance (Dex OIDC + OpenFGA). Off → open dev mode; on → the full governed demo. ============
auth:
  # THE CLUSTER'S SERVICE-ACCOUNT ISSUER: a service authenticates to a door as the ServiceAccount its pod
  # runs as, never as a name it claims ([[LH-220]], D1; Lakekeeper's multi-provider path,
  # docs/docs/authentication.md:457-483). Each caller projects one token per door audience
  # (`rask-catalog`, `rask-lineage`) at /var/run/secrets/rask/identity/<audience>/token,
  # 600 s (the Kubernetes minimum; the kubelet rotates it at ~515 s, measured 2026-10-02) and re-read on
  # every request. A door verifies it offline against this issuer's JWKS and maps the full
  # `system:serviceaccount:<ns>:<sa>` to the subject its grants name (`RASK_SA_SUBJECTS`, rendered by
  # `lance.saSubjects` from the same identity values the FGA seeds use); an unmapped account is refused.
  # The issuer serves discovery and keys only to a bearer from a private CA (k3s runs
  # `--anonymous-auth=false`), so each door also projects an API-audience token (3600 s) and
  # `kube-root-ca.crt` at /var/run/secrets/rask/sa-fetch. Never the automount token: it is a one-year
  # extended credential (P5.3 d3) and XC-076 keeps it off. The value is k3s's default issuer, read live
  # from /.well-known/openid-configuration on 2026-10-02.
  # The anchor is read again as OpenFGA's issuer alias (`openfga.extraEnvVars`), and
  # templates/openfga-authn.yaml refuses a render where the two differ.
  # -- The Kubernetes ServiceAccount token issuer every door verifies service tokens against (RASK_SA_ISSUER); must equal OpenFGA's issuer alias or the render fails.
  serviceAccountIssuer: &serviceAccountIssuer https://kubernetes.default.svc.cluster.local
  # THE ISSUER MIRROR ([[XC-077]]): templates/openfga-authn.yaml republishes this issuer's discovery document
  # and key set, unauthenticated, at http://<release>-issuer-mirror:8080 for a verifier that fetches them with
  # no credential. OpenFGA is that verifier: v1.18.3 fetches `<issuer>/.well-known/openid-configuration` and
  # its `jwks_uri` with a bare HTTP client and will not start when either fails (internal/authn/oidc/oidc.go),
  # and k3s answers both 401 without a bearer (measured 2026-10-05). The mirror fetches them with its own
  # API-audience token and the cluster CA, as the rask doors do (`lance.saFetch`), serves only that public
  # material, and caches nothing. Turn it off only on a platform whose issuer serves discovery to anyone (a
  # managed cluster's public OIDC issuer), and point `openfga.authn.oidc.issuer` at that issuer instead.
  issuerMirror:
    # -- Render the issuer mirror (templates/openfga-authn.yaml) that republishes the SA issuer's discovery and JWKS unauthenticated for OpenFGA; off only for a publicly served issuer.
    enabled: true
  # ON BY DEFAULT (2026-08-06). It was `false`, and values-prod.yaml flipped it — which meant every
  # install that forgot to pass a values file came up UNGOVERNED, silently and green. That is exactly
  # how it kept happening: a `helm upgrade` without `-f values-prod.yaml` reverts a governed estate to
  # an open one, the session Secret stops rendering, and pods that still reference it fail to start
  # (observed on rask-web-models, 2026-08-06). A security default must fail CLOSED, not open.
  #
  # This makes a bare `helm install` REFUSE rather than install: frontend.oidc.enabled is on too, and
  # the chart already fails the render without a publicIssuer. That refusal is the point — an
  # ungoverned estate should require someone to ask for it (`--set auth.enabled=false`), never to
  # forget something.
  # -- Govern the estate: authn on every door plus OpenFGA authz. On by default (fails closed); a bare install then needs frontend OIDC configured or it refuses to render.
  enabled: true
  # Permit auth.enabled=true WITHOUT a frontend sign-in flow. Off by default, and the chart REFUSES
  # that combination (templates/auth-consistency.yaml): it installs green and then shows every user
  # a governed UI with no way in, while the catalog 401s each read. Set this only for an estate that
  # is deliberately API-only — it must be a decision, never an omission.
  # -- Permit `auth.enabled` without a frontend sign-in flow, for a deliberately API-only estate; otherwise templates/auth-consistency.yaml refuses that combination.
  allowHeadless: false
  # Lock root (top-level) namespace/table creation to warehouse-create-grant holders.
  #
  # DELIBERATELY UNSET, and that is what makes the control work. A key here is a key `hasKey` finds,
  # so a default of `false` made the chart's own value win over the derivation and every estate that
  # did not set it ran open — which is exactly what was measured on the live catalog 2026-09-07. With
  # the key absent, `services.yaml` derives it from `rask.isRealDeployment`: locked wherever the
  # deployment is real, open on the local loop that needs self-serve. Set it explicitly to override
  # in either direction; `values-prod.yaml` does, so prod states its intent rather than inheriting it.
  # #41 compliance audit trail: structured who/what/outcome events for authn (success+failure), authz
  # (allow+deny), and credential vending on the dedicated `lance.audit` logger → OTLP → GreptimeDB. Rendered
  # into LANCE_AUDIT_ENABLED only when auth is on (that is where a real subject exists); set false to silence
  # the stream even with auth on.
  # -- Emit the structured authn/authz/credential-vending audit stream (LANCE_AUDIT_ENABLED and siblings); takes effect only with auth on. false silences it.
  audit: true
  # -- The platform's OpenFGA HTTP API (e.g. `https://fga.internal:8080`), which every FGA client, the openfga-model hook and the bootstrap-admin Job dial when `openfga.enabled` is false; the render refuses it empty then. It must admit rask's projected `rask-openfga` tokens: OIDC against the cluster's ServiceAccount issuer, the subjects `lance.openfgaSubjects` lists.
  fgaApiUrl: ""
  # OpenFGA admits only the ServiceAccounts `lance.openfgaSubjects` lists, and it lists this release's own clients. A
  # first-party service installed as its own release (the compute fixture, deploy/fixtures/compute) presents a projected
  # `rask-openfga` token from an account this chart does not render, so its name is listed here, `<namespace>:<name>`.
  # OpenFGA reads the list at start, so a change needs an OpenFGA restart.
  # -- ServiceAccounts outside this release that OpenFGA admits, each `<namespace>:<name>` (e.g. `default:rask-sa-compute` for the compute fixture). Read only with auth on.
  externalFgaClients: []
  # Pin the OpenFGA store id. When set, EVERY FGA consumer (the services, the openfga-model hook and the
  # bootstrap-admin Job) uses that store; empty (default) = the newest store named `lance-catalog`. A
  # MODEL pin makes every service check against that one model whatever its image carries; no deployment
  # sets it, and removing the knob is parked as LH-309.
  # -- Pin the OpenFGA store id used by every service, the openfga-model hook and the bootstrap-admin Job. Empty = the newest store named `lance-catalog`.
  fgaStoreId: ""
  # -- Pin the OpenFGA authorization model id every service checks against, whatever its image carries. Empty = the store's latest model.
  fgaModelId: ""
  # First estate admin, seeded BY THE CHART (goal cond 4): a Dex subject (the id_token's `sub`) granted
  # TWO tuples by the bootstrap-admin post-install/upgrade hook Job, because they are two authorities —
  # `owner` on the default warehouse (warehouse:lance_catalog), which cascades into every namespace and
  # table it parents, and `admin` on the estate root (estate:rask), which every estate-wide surface
  # (GET /v1/events, the object browser, the admin console) gates on. Empty (default) = the human grants
  # stay out-of-band (seed scripts / the UI) while the SERVICE grants below still render.
  # Requires auth.enabled.
  # -- Dex subject (id_token `sub`) the bootstrap-admin hook grants `owner` on the default warehouse and `admin` on estate:rask. Empty = human grants are made out of band.
  bootstrapAdmin: ""

# === Data-plane credential vending (Track B). How a client gets storage_options for DIRECT object I/O. ====
# POST /management/v1/table/<id>/credentials?tier=read|write returns scoped creds (or mode=server_mediated). Modes:
#   mode_b        (default) — nothing vended; clients use the server-mediated Arrow-IPC data endpoints.
#   web_identity  — the caller's Dex id_token is exchanged via AssumeRoleWithWebIdentity for creds bound
#                   to ROLE_POLICY, narrowed per-table by an inline session policy. Requires
#                   minio.oidc.enabled + auth.enabled (the caller presents a token). It is the only mode
#                   under which the catalog holds NO storage credential at all — but it cannot serve a
#                   caller that never holds a bearer.
#   sts           — plain AssumeRole + session policy. Works on a compliant STS: AWS / MinIO / Ceph / moto.
#                   WHO MAY CALL IT IS THE PART THAT BITES, and it is why this estate's store is MinIO
#                   (LH-133): measured 2026-09-11, same request shape and one run, a policy-attached
#                   scoped user is ACCEPTED by MinIO and answered HTTP 403 by RustFS, which gates
#                   AssumeRole to root and cannot grant the right (its policy engine refuses an
#                   `sts:AssumeRole` statement outright). A store that only lets ROOT vend forces the
#                   catalog to hold the root key, which is the opposite of what this mode is for.
#   static        — pre-provisioned per-bucket keys.
vending:
  # STS by default, because scoped short-lived credentials ARE the zero-trust posture and `mode_b`
  # vends nothing at all — under it no worker can ever hold a per-table credential, so every direct
  # reader falls back to a shared root key or to routing bytes through the server.
  #
  # It defaulted to `mode_b` for a reason that turned out to be a DEFECT rather than a choice: the STS
  # vendor built its boto client without credentials, so every AssumeRole raised `NoCredentialsError`
  # and the door answered 503 (fixed 01222590), and the credential it then returned omitted `allow_http`
  # so no Lance client could be built from it (fixed 3cb13c88). `sts` was unusable, not unwanted.
  #
  # PROVEN, which is what makes this default honest rather than aspirational: a credential vended for
  # one table read that table (4 rows) and was refused on another with 403 AccessDenied (2026-09-03).
  # Re-driven against MinIO on 2026-09-11 from a SCOPED (non-root) caller — in-scope GET allowed,
  # cross-tenant GET and read-tier PUT both AccessDenied. The store enforces the session policy from an
  # identity that is not root, which is the whole property the zero-trust posture rests on.
  # -- How the catalog vends storage credentials for direct object I/O: `mode_b` (none, server-mediated), `web_identity`, `sts` (default, scoped AssumeRole) or `static`.
  mode: sts # mode_b | web_identity | sts | static
  # -- Lifetime in seconds of a vended STS / web-identity credential (LANCE_VENDING_TTL_SECONDS).
  ttlSeconds: 900
  # -- Role ARN passed on AssumeRole in `sts`/`web_identity` mode (LANCE_S3_ASSUME_ROLE_ARN); stores with inherited policies ignore it but boto3 requires it.
  assumeRoleArn: "arn:aws:iam::000000000000:role/lance-vend" # inherited-policy stores ignore it; boto3 requires the param
  # ENCRYPTION AT REST for every DIRECT write, carried in the vended storage options (§ J5). A vended
  # client writes to object storage with the catalog out of the path, so this is the only channel that
  # reaches it.
  #
  # EMPTY BY DEFAULT = whatever the bucket does, which is every deployment's behaviour today. The names
  # and their contract come from `lance_docs/guide.md:2417-2419`: algorithm must be AES256, aws:kms or
  # aws:kms:dsse, and a kmsKeyId REQUIRES one of the two kms values. The catalog refuses an invalid
  # pairing at boot rather than passing it on — object_store ignores an option it does not recognise,
  # so a wrong value would write plaintext while the config claimed encryption.
  #
  # A store that ignores SSE headers simply writes unencrypted; this is for an AWS/S3 deployment.
  # -- Server-side encryption for direct writes, carried in vended storage options: `algorithm` (AES256, aws:kms, aws:kms:dsse) and `kmsKeyId` (kms only). Empty = bucket default.
  encryption: {}
  # Allow blob-v2 columns to reference EXTERNAL objects outside the dataset root (Blob.from_uri) on create.
  # Off by default: (1) external bytes live outside the lakehouse (Lance's GC can't protect them, a source
  # delete dangles the pointer); (2) SSRF — a client-controlled pointer URI is fetched server-side by the
  # cascade's read_blobs, so an arbitrary URI (cloud metadata / internal host) becomes a read primitive.
  # Enable only for a trusted producer. Managed/inline blobs (bytes copied in) always work regardless.
  # -- Allow blob-v2 columns to reference arbitrary external objects (Blob.from_uri) on create. Off by default: an SSRF and dangling-pointer risk; prefer `externalBlobBases`.
  allowExternalBlobs: false
  # The SAFER alternative to the blanket flag: a comma-separated allowlist of approved external base URIs
  # (e.g. "s3://media-bucket/approved,s3://other/base"). External Blob.from_uri pointers are accepted ONLY
  # under a registered base, with the blanket bypass left off — a curated media source without the SSRF door.
  # Empty = the chart defaults it to the release's own model-artifact base (s3://<minio.bucket>/models/,
  # the #92 allowlist for #115 registry pointers — plain-path artifacts in the lake's own bucket, no SSRF
  # surface). Overriding REPLACES that default — include the models base yourself or the train registry's
  # external pointers get rejected.
  # One value, rendered as LANCE_EXTERNAL_BLOB_BASES into every reader of it: the catalog's create and read
  # doors, maintenance (planner and worker) and lineage. A base inside it needs no base-record
  # entry ([[LH-279]]), so a reader without it would treat each table's blob base as unrecorded.
  # -- Comma-separated allowlist of base URIs external blob pointers may live under (LANCE_EXTERNAL_BLOB_BASES). Empty = `s3://<minio.bucket>/models/`; a value replaces that default.
  externalBlobBases: ""

# === Catalog request limits =======================================================================
catalog:
  # THE CATALOG'S OWN NAME ON THE ESTATE, the identity it signs the lineage it emits as ([[LH-064]]): its
  # Ed25519 key pair is minted against this name (`signing:`), and it is the one delegator, because the
  # catalog authenticated the person it signs for.
  #
  # It is the identity this service PRESENTS, never one it accepts: `lance.saSubjects` does not map
  # `-sa-catalog` at the catalog's door, because the catalog does not call itself.
  #
  # Empty makes the catalog no signer: it emits unsigned, which lineage admits only while
  # `signing.enforce` is false.
  # -- The identity the catalog presents and signs its emitted lineage as (the one delegator). Empty = the catalog emits unsigned lineage.
  serviceIdentity: service-catalog
  # Max request-body bytes accepted on any catalog route. The Arrow-IPC write endpoints buffer the whole
  # body in memory, so an unbounded POST (e.g. a multi-GB media blob pushed through the catalog instead of
  # the direct storage/vending path) OOMs the worker. The body-limit middleware rejects oversized bodies
  # with 413 before buffering. 256 MiB — generous for tabular batches + small inline blobs, bounded well
  # under a worker's memory. Big media must use the direct-write/vending path (claim-check), not this API.
  # -- Maximum request-body bytes on any catalog route (LANCE_MAX_BODY_BYTES); larger bodies get 413 before buffering. Default 256 MiB.
  maxBodyBytes: 268435456 # 256 * 1024 * 1024
  # Cap on concurrent in-flight Arrow-IPC writes (create/insert/merge_insert) — each buffers up to
  # maxBodyBytes, so peak buffer memory = maxConcurrentWrites × maxBodyBytes. Over the cap → 429 +
  # Retry-After, shed before a body byte is buffered. 16 matches the code default; prod lowers it to fit
  # the catalog memory tier — values-prod.yaml states the sizing formula. 0 disables shedding.
  # -- Cap on concurrent in-flight Arrow-IPC writes; over it the catalog answers 429 + Retry-After. Peak buffer memory is this times `maxBodyBytes`. 0 disables shedding.
  maxConcurrentWrites: 16
  # #75/#96 RECOVERABLE DROPS — days a dropped table/namespace stays undroppable before the purge may
  # reclaim it. The CODE default is 0 (off: a grace period changes what `drop_table` means for every
  # caller, so the library never assumes it) — but the CHART defaults it ON, because the chart also
  # ships `maintenance.trashPurge` and an undrop UI, and until 2026-08-05 it rendered this env var
  # NOWHERE: ~500 lines of shipped, tested recovery code (undrop, /tasks, the recoverable cascade,
  # the purge's whole input) were inert in every chart deployment while two chart comments discussed
  # the knob as if it worked. 0 restores the old destroy-immediately behaviour.
  # -- Days a dropped table or namespace stays undroppable before the trash purge may reclaim it (LANCE_TRASH_GRACE_DAYS). 0 destroys immediately.
  trashGraceDays: 7
  # #3-A per-warehouse physical multi-tenancy (admin control plane). On → POST /v1/warehouses provisions a
  # physically separate bucket per warehouse (Lakekeeper parity) and binds top-level namespaces to it, so a
  # table under a bound namespace lands in that warehouse's bucket. Additive + backward-compatible: an
  # unbound namespace always routes to the shared minio.bucket, so single-tenant flows are untouched.
  warehouses:
    # -- Per-warehouse physical multi-tenancy: POST /v1/warehouses provisions a bucket per warehouse and binds top-level namespaces to it. Unbound namespaces use `minio.bucket`.
    enabled: true
  # #3-B Lance multi-base DATA distribution: the ALLOWLIST of bucket URIs a single table's fragments may be
  # spread across (?data_base=s3://... per create, round-robin write, fan-out read — the Uber pattern). A
  # per-request base MUST be on this list (a caller can never target an arbitrary bucket). Empty = feature
  # off (single-location creates, byte-identical to before). Populate with pre-provisioned data buckets.
  multibase:
    # -- Allowlist of bucket URIs one table's fragments may be spread across (`?data_base=` on create). Empty = multi-base off, single-location creates.
    dataBases: []
    # [[LH-067]] WHICH SECRET each data base's credential comes from: `{base-uri: secret-ref}`. A NAME,
    # never material — the reference identifies a key in the Dapr secret store, which is what lets this
    # live in configuration at all under the estate's secrets rule. Empty (default) = every base keeps
    # the estate's options and every write is byte-identical.
    #
    # A REF WITHOUT AN ALLOWLIST ENTRY IS REFUSED AT RENDER, and that cross-check exists because the
    # two values are independent and the live estate had exactly that split: a base with a credential
    # reference and no allowlist entry, so `?data_base=` was refused before the per-base credential
    # path was reached, and the bucket provisioned for that proof sat unused (measured 2026-09-22).
    # The runtime symptom is indistinguishable from a caller naming a bucket they invented, which is
    # why it has to fail here instead.
    # -- Map of data-base URI to a Dapr secret-store reference naming that base's credential. Every key must also be in `dataBases` or the render fails. Empty = estate options.
    baseCredentialRefs: {}
    # LOCAL FIXTURE for the references above, off by default and refused at render on a real deployment
    # (`rask.isRealDeployment`), with MinIO off, or without the bundled dev-mode OpenBao. In production
    # the store, its users and the secret each reference names are platform-run: an operator creates
    # them and the chart only names them. On, for every reference:
    #   * `minio-scoped-users` creates the bucket if missing, a policy `rask-base-<ref>` that reaches
    #     only that reference's bases (the bucket's metadata, a LIST conditioned on the base prefix on a
    #     path boundary, object read/write under `<prefix>/`), and a user named `<ref>` holding it;
    #   * the dev OpenBao's seed writes `secret/<ref>` with `aws_access_key_id=<ref>` and the secret under
    #     the field the catalog reads (`lance.catalogSecretField`), the bundle shape
    #     `catalog/services/warehouse_credentials.py::resolve` requires.
    # THE SECRET IS DERIVED IN THE CLUSTER, never rendered: sha256("<ref>-s3-<the store root secret>")[:40],
    # the function `lance.scopedSecretFn` writes, computed by both pods from the root secret they already
    # hold (the Job reads it as a mounted file). So the two halves agree without one handing the other a
    # key, a re-run is idempotent, and the seed's own re-seed loop restores the entry after an in-place
    # OpenBao restart or a replaced pod. It is a fixture identity, not a tenant's: it proves the per-base
    # credential path end to end.
    # -- Local fixture: create each referenced base's bucket, scoped MinIO user and dev-OpenBao secret. Refused on a real deployment, without MinIO or without the dev OpenBao.
    devSeed: false
  # Control-plane change-events: every governance/metadata mutation (grants/warehouses/policies/tables)
  # publishes a CatalogControlEvent onto a DEDICATED broadcast Dapr topic (catalog.control.v1, no
  # queueGroupName) that EVERY catalog replica buffers, so the admin console live-refreshes via
  # GET /v1/events. ON renders the catalog-control-pubsub Dapr component + the CATALOG_CONTROL NATS
  # stream + the broadcast subscription, and turns emission on. On by default (parity with lineage emit)
  # — best-effort + fail-open, so a bus outage degrades to "no live refresh + the audit trail still
  # records it", never a failed mutation.
  # BOUNDARY: the ring buffer + its cursor are PER-REPLICA (each broadcast subscriber buffers independently).
  # Correct at services.catalog.replicas=1 (the default). Scaling the catalog past one replica needs session
  # affinity (so a client's polls stick to one replica) or a shared buffer — else a load-balanced poll gets
  # inconsistent cursors and degrades to noisy `reset`s (safe, since events are hints, but wasteful).
  # -- Publish catalog control events (catalog.control.v1) on a broadcast Dapr topic; renders the control pubsub component, CATALOG_CONTROL stream and subscription. Best-effort.
  controlEmit: true
  # #4 transactional outbox on the CONTROL lane, and the RELAY that drains it — one switch for both,
  # because half of this is worse than neither. Staging without a relay leaves a durable copy nothing
  # reads; a relay without staging drains an empty prefix.
  #
  # Why the control lane needs durability at all, when the events are documented as refresh hints: most
  # of them are, and `table_published` is not: a subscriber that acts on a publication learns of it only
  # from this lane, so a lost event is a publication nobody downstream ever hears of. A 5s publish timeout
  # during a NATS blip lost such an event outright with every pod green.
  #
  # THE PREFIX MUST DIFFER FROM `_lineage_outbox`. Lineage's reconcile cron parses every object in its
  # own prefix as an OpenLineage RunEvent and DELETES what it cannot parse, so pointing this lane at
  # that prefix destroys the staged control events instead of relaying them. The catalog refuses to boot
  # on equal prefixes rather than trusting this comment.
  #
  # Cost is one S3 PUT + DELETE per catalog MUTATION (not per row) against the already-provisioned
  # minio.bucket. Requires catalog.controlEmit (nothing stages when emission is off).
  controlOutbox:
    # -- Stage control events in a durable S3 outbox and run the relay cron that drains it; carries `table_published` to its subscribers. Requires `controlEmit`.
    enabled: true
    # ONE STRING: the Dapr Component's name (catalog-control-relay-cron.yaml), the app's
    # LANCE_CONTROL_RELAY_BINDING_NAME, and the route the catalog serves at its pod root. Dapr delivers
    # an input binding to the route matching the COMPONENT NAME, so a second literal anywhere is a cron
    # that ticks into a 404 while both halves look right in isolation.
    # -- Name of the control relay's Dapr cron Component; also the catalog's LANCE_CONTROL_RELAY_BINDING_NAME and the route it serves. Must stay one string.
    bindingName: catalog-control-relay-cron
    # Bounds how long a control event stays undelivered after a bus outage. Tighter than lineage's 300s sweep
    # because that one re-reads Lance manifests estate-wide while this one is a LIST over a prefix that
    # is empty in the healthy case.
    # -- Dapr cron schedule of the control outbox relay; bounds how long a control event stays undelivered after a bus outage.
    schedule: "@every 60s"
  # ADR 0138 (LH-178): an erasure whose residual a tag or branch pins tells the requester and the table's
  # owners, then releases the pins when this grace period ends (tags deleted, branches deleted and
  # recreated at main's head). Owner-set; nothing cancels or extends one release.
  erasure:
    # -- Days after an erasure blocked by a tag or branch pin, during which owners are told, before the pins are released (LANCE_ERASURE_RELEASE_GRACE_DAYS). Required.
    releaseGraceDays: 7
    # ONE STRING, as for controlOutbox: the Component (catalog-erasure-release-cron.yaml), the app's
    # LANCE_ERASURE_RELEASE_BINDING_NAME and the route at the catalog's pod root.
    # -- Name of the erasure-release Dapr cron Component; also the catalog's LANCE_ERASURE_RELEASE_BINDING_NAME and the route it serves.
    bindingName: catalog-erasure-release-cron
    # How late a due release may run; late costs only time, so this is loose.
    # -- Dapr cron schedule on which due erasure pin releases run; lateness only costs time.
    schedule: "@every 300s"

# Dapr pub/sub: the publish-side component name + the lineage topic. Each SUBSCRIBER app additionally
# gets its own derived component `<name>-<app-id>` carrying its queue group + deliver policy
# (dapr-component.yaml); the subscription routes live in app code (/lineage-events and siblings).
pubsub:
  # -- Name of the shared lineage publish Dapr pubsub component; each subscriber app gets a derived `<name>-<app-id>` component with its own queue group.
  name: lineage-pubsub
  # -- Topic OpenLineage run events are published and subscribed on (LANCE_DAPR_TOPIC and siblings).
  topic: lineage.events.v1
  # The DEDICATED broadcast component for the catalog's own control-plane change-events (topic
  # catalog.control.v1). Separate from `name` (the shared lineage publish component) because it carries NO
  # queueGroupName — every catalog replica receives every event. Must equal the app's LANCE_CONTROL_PUBSUB
  # default (services/catalog/core/config.py). Rendered only when catalog.controlEmit is on.
  # -- Name of the broadcast (no queue group) Dapr pubsub component for catalog.control.v1; must match the catalog's LANCE_CONTROL_PUBSUB default. Used when `controlEmit` is on.
  controlName: catalog-control-pubsub

# === The medallion tiers (bronze → silver → gold) =================================================
# The tiers are governed tables inside the catalog (ADR 0155): a pipeline writes each tier through the catalog's
# namespace doors, and the chart runs no stage, no producer and no engine of its own.
medallion:
  # Storage ZONES. Maps a tier NAMESPACE to its S3 bucket; anything unset falls back to the shared `minio.bucket`,
  # so the default is the single-bucket layout. Any bucket listed here is auto-provisioned by minio-mkbucket, swept
  # by maintenance, and appended to the catalog's LANCE_RESERVED_BUCKETS, so naming a bucket makes it platform
  # storage no tenant may later claim as a warehouse.
  #
  # Empty is the normal case: the tier namespaces are NESTED under a project's warehouse and inherit its location.
  # -- Map of tier namespace to S3 bucket (e.g. `{gold: lance-sink}`); unset namespaces use `minio.bucket`. Listed buckets are auto-created, swept by maintenance and reserved from warehouses.
  buckets: {}

# === Compaction/GC microservice (Dapr cron binding) ===============================================
# A bindings.cron component POSTs /<bindingName> on `schedule`; the service compacts small Lance
# fragments + GCs old versions across the lakehouse bucket. Schedule/retention are component config.
maintenance:
  # -- Deploy the maintenance service (planner, sweep and reconcile crons) and, with its other switches, the dedicated workers.
  enabled: true
  # -- Dapr app-id of the maintenance planner and workers; also prefixes their durable consumer names.
  daprAppId: maintenance
  # -- HTTP port of the maintenance planner and worker containers.
  port: 8000
  # -- Name of the Dapr cron binding that fires the sweep tick (`MAINTENANCE_BINDING_NAME`).
  bindingName: maintenance-cron
  # THE SWEEP'S CADENCE, AND ITS ROLE DEPENDS ON `workTopic` ABOVE.
  #
  # With the event lane OFF (this default), the cron IS the trigger: it plans and executes the whole
  # estate every tick, so a short interval is what makes maintenance responsive. 120s is the demo
  # cadence; prod historically ran "0 */30 * * * *".
  #
  # With the event lane ON, the cron becomes a BACKSTOP and should be relaxed to hourly, but no slower than
  # 75 minutes: MaintenanceTableParked's 4h window must hold (workers + 1) periods plus ackWait, or it never
  # fires. It still has to exist — the bus is provably incomplete (Ray TRAIN and external OpenLineage
  # producers emit over HTTP only and never reach the topic; the catalog's lineage lane has no outbox,
  # so a lost trigger is silent) and clock-due work like old-version GC has no write to react to. What
  # it stops being is the thing that finds work first. Measured before the lane landed: every tick paid
  # a whole-estate walk plus one manifest open per dataset (87 of them) and reported
  # `fragments_removed: 0, versions_removed: 0` on every pass since 2026-08-16.
  # -- Sweep cron cadence. With `workTopic` set it is a backstop: relax to hourly but no slower than 75 minutes.
  schedule: "@every 120s"
  # THE ESTATE THIS LANE IS SIZED FOR, and the per-unit cost that turns it into a required drain rate.
  # Declared so the sweep's cadence and the queue's capacity can be compared — they are set in
  # different files and nothing compared them until a lane stalled.
  #
  # END-TO-END SECONDS PER UNIT, and it is deliberately NOT the handler's duration. Measured
  # 2026-09-22 from `ack_floor` deltas on a settled lane — 11 samples over 300s, 1,551 units acked,
  # **5.17 units/sec at 72 in flight = 13.9s per unit end to end**, declared as 14.
  #
  # THE HANDLER IS 0.21s (19 trace spans, median 0.12s, p90 0.60s). Both figures are right and they
  # answer different questions: the span measures the work, this measures what the LANE costs per
  # unit — dispatch, ack round-trip and queueing included. Only the second decides whether a sweep's
  # output can be absorbed, and using the first here made this gate demand 5 units in flight where
  # ~70 are needed, which would have certified a lane that could not keep up.
  #
  # READ IT FROM `ack_floor`, ON A SETTLED LANE. Earlier attempts read a drain RATE within `ackWait`
  # of a deploy, where a worker restart strands every in-flight unit ([[LH-190]]) and delivery halts
  # entirely; those windows produced "5.2s" and then "22s" for this same quantity.
  #
  # MARGIN IS THIN AND THAT IS THE POINT OF DECLARING IT: `datasets / schedule * secondsPerUnit` is
  # 600/120 x 14 = 70 against the 72 the lanes admit. The estate measured 5.17/sec against 4.73
  # injected, so it keeps up by ~9% — and this gate turns red as soon as it stops.
  #
  # WHAT A 9% MARGIN MEANS FOR RECOVERY: the surplus is ~0.44 units/sec, so a backlog left by an
  # outage drains at roughly 1,600 units an hour. The 7,200 accumulated by [[LH-190]]'s stalls needs
  # about four and a half hours to clear — safely inside the stream's 7-day retention, but it is why
  # a restart is felt long after delivery resumes.
  # -- Estate size the work lane is sized for; with `schedule` and `secondsPerUnit` it declares the required drain rate.
  expectedDatasets: 600
  # -- Measured end-to-end seconds per work unit (dispatch, ack and queueing included), used with `expectedDatasets` to size the lane.
  secondsPerUnit: 14
  # The drift reconciler's OWN cron. It only READS three stores (OpenFGA, the control-root registries,
  # the bucket listing) and reports where they disagree — cheap next to the sweep, which rewrites data
  # files, which is why it gets its own schedule instead of inheriting that one.
  # -- Name of the Dapr cron binding that fires the drift reconciler (`MAINTENANCE_RECONCILE_BINDING_NAME`).
  reconcileBindingName: maintenance-reconcile-cron
  # -- Cadence of the drift reconciler, which only reads OpenFGA, the control-root registries and the bucket listing.
  reconcileSchedule: "@every 300s"
  # THE WORK QUEUE. Empty => the cron tick maintains the estate inside its own request (the serial
  # lane). Set => it PLANS and publishes one message per dataset, and the `/maintenance-work`
  # subscription executes them — so an overrunning tick is queued rather than dropped by the
  # single-flight guard, a poison dataset fails its own message instead of stopping everything
  # discovered after it, and work outlives a pod restart because JetStream holds it.
  #
  # ON, because the serial lane is what OOMKilled the planner ([[LH-183]]). Measured on the live estate
  # 2026-09-22: with this empty the tick emitted 2,227 `compaction_*` log lines in 30 minutes inside a
  # 512Mi pod, and died `OOMKilled exit 137` at 86m52s, then 442m35s and 460m50s under two successive
  # allocator bounds — neither of which could stop a 512Mi pod doing 4Gi work.
  #
  # The `replicas: 1` pin and the in-process sweep lock still stand, and they bound the QUEUE'S SCALING
  # PAYOFF rather than this fix: one planner enqueueing is all the split needs, because what moves off
  # the pod is the EXECUTION, not the planning.
  # -- Topic the sweep publishes one unit per dataset to. Empty runs the whole sweep inside the cron request (the serial lane).
  workTopic: "maintenance.work.v1"
  # DEDICATED MAINTENANCE WORKERS (docs/adr/0049-maintenance-leaves-the-planner-pod-2026-09-04.md "Maintenance leaves the planner pod").
  #
  # One deployment does the planning AND the compaction today, at `replicas: 1` and 512Mi — so the
  # work is bounded to fit the pod (`compactThreads`, `scanBatchSize`) rather than the pod sized to fit
  # the work. Lakekeeper states the same split as its production practice: "we recommend running expire
  # snapshots workers in dedicated pods to avoid impacting REST API performance", with the API pod's
  # worker count set to zero.
  #
  # rask needs no new mechanism: the tick already plans and publishes one unit per dataset, the work
  # Component already carries `queueGroupName`, so replicas are competing consumers. The `replicas: 1`
  # pin belongs to the PLANNER alone (its sweep lock, because `bindings.cron` fires on every replica
  # with no lease); the executor has never needed it, because the broker single-flights a unit.
  #
  # ON, and it is the SECOND of a pair that only works together. `workTopic` alone makes the planner
  # enqueue and then consume its own messages in the same 512Mi pod — the identical defect with an
  # extra hop. This switch is what sets `MAINTENANCE_EXECUTE_WORK=false` on the planner, so it
  # publishes and does not consume.
  dedicatedWorkers:
    # -- Run compaction and index units on a separate worker Deployment and stop the planner consuming its own work queue. Needs `workTopic`.
    enabled: true
    # -- Number of worker pods; they are competing consumers of the work and index queues. More than 1 also renders a PDB.
    replicas: 2
    # How many units ONE worker may execute at once, ACROSS BOTH LANES. It exists so the ceiling is a
    # DECISION: without it the real limit is anyio's default thread limiter — 40 — which nobody chose
    # and an upstream change could move underneath the delivery bounds derived from it.
    #
    # BOTH LANES SHARE IT, which is why the two `maxAckPending` values SPLIT this number rather than
    # each taking it: `api/work.py` and `api/index_work.py` both reach `run_in_threadpool`, and that
    # limiter is process-global. Bounding each lane to the full capacity would admit twice as many
    # units as can run, which is the defect these bounds exist to remove.
    #
    # DELIVER NO MORE THAN CAN RUN. `ackWait` runs from DELIVERY, not from the start of execution, so a
    # unit sitting behind others burns its 720s window while idle and is redelivered — and a redelivered
    # compaction runs twice on one dataset, which is the race the in-process single-flight lock exists
    # to prevent. Measured 2026-09-22: `Max Ack Pending: 1,000` (NATS's default) against 40 x 2 that can
    # actually run.
    #
    # A THROUGHPUT bound, applied to anyio's thread limiter — how many UNITS this pod may have in
    # flight, not how much memory they may hold. The sweep plans ~568 units a tick and all but a
    # handful are no-ops of two HTTP calls, so the lane needs ~4.7 units/sec to keep up.
    #
    # MEASURED 2026-09-22, the hard way: cutting this to the memory-safe figure (4) took the lane to
    # ~0.67 units/sec, `Unprocessed Messages` climbed past 2,000 and nothing drained. One knob cannot
    # serve both questions — the MEMORY bound is `maxConcurrentCompactions` below, which is held
    # around the rewrite itself, the only step that holds bytes.
    # -- Throughput bound: units one worker executes at once across both lanes; the lanes' maxAckPending split this number.
    maxConcurrentUnits: 40
    # The MEMORY bound: how many REWRITES may be resident at once. A no-op unit never acquires one.
    #
    # MEASURED 2026-09-22: a table of 240 MiB in 60 fragments was built through the catalog and left
    # for the sweep; /proc/1/status inside the worker, every 2s across the compaction, went
    #   294Mi -> 365 -> 414 -> 370 -> 323 -> 427 -> 729 -> 380 -> 316 -> 431 -> 317Mi
    # One rewrite bounded at `maxSourceBytes` (256 MiB) peaked at +434 MiB resident, ~1.7x that bound.
    # `(4Gi - ~320Mi baseline) / 434 MiB` is ~8, and bronze rows are ~1.8 MB against the 1 MiB used
    # here, so 4 keeps a factor of two in hand. The arithmetic is gated against the declared pod limit
    # by tests/unit/test_the_worker_can_hold_every_unit_it_admits.py.
    #
    # The sample interval was 2s, so 434 MiB is a LOWER bound; the gate's 0.75 usable fraction carries
    # that uncertainty rather than pretending to precision.
    # -- Memory bound: how many compaction rewrites one worker holds resident at once. No-op units never take one.
    maxConcurrentCompactions: 4
    # RETIRE THE WORKER AFTER N COMMITTED REWRITES ([[LH-183]]). The two bounds above cap what is
    # resident AT ONCE; this one caps what is never given back.
    #
    # MEASURED 2026-09-22, three rounds on two worker processes: retention tracks COMMITS at ~10-14 MiB
    # each (+9.6Mi for 1 commit in 15 fragments, +14.4Mi for 1 in 60, +54.2Mi for 4 in 60 — 13.6 per
    # commit), while the transient peaks of 644/724/677Mi all came back. The floor rises and the
    # ceiling does not. THE ARITHMETIC, and it is the sibling gate's: `(4Gi x 0.75 usable) - 320Mi
    # baseline) / 14 MiB` is a CEILING of ~196 passes, not the ~300 the raw headroom suggests — the
    # 0.75 fraction carries the same shape uncertainty it carries for the concurrency bound. 150 sits
    # at ~76% of that ceiling, which is the margin the figure deserves: it rests on three points, one
    # table shape and one row size. `test_the_worker_can_hold_every_unit_it_admits.py` refuses 200.
    #
    # A RESTART IS CHEAP, which is what makes this the remedy rather than the crude fallback it was
    # first filed as. Measured on the live lane the same day: delivery resumes ~5 seconds after the
    # replacement is ready and the held units redeliver at once, because NATS sees the subscriber's
    # connection drop instead of waiting out `ackWait`. The PDB (`minAvailable: 1`) and a rollout that
    # floors to 0 unavailable mean a recycle never takes both replicas.
    #
    # 0 disables it, and an estate that has not measured its own retention should say 0 rather than
    # inherit this number: it is a property of the tables, not of the code.
    # -- Retire a worker after this many committed rewrites to shed retained memory; 0 disables.
    recycleAfterPasses: 150

    # THE SECOND BUDGET, and the one this estate's workers actually reach. `recycleAfterPasses` counts
    # committed rewrites and this lane commits none, so that count stays 0 and its retirement can
    # never fire: measured live 2026-09-25, both workers at 866 and 861 MiB against a 4Gi limit, ZERO
    # restarts in 34.5 hours, and `maintenance_worker_retiring` never logged. This one gates on the
    # RESIDENT set against the container's own limit — read from the running worker's own cgroup,
    # `/sys/fs/cgroup/memory.max` = 4294967296 — which both lanes share and the OOM killer reads.
    #
    # WELL UNDER 1 BECAUSE OF THE PEAK: a rewrite's transient peak is 400-700 MiB above the floor and
    # returns every time, so retiring at the floor alone is still killed by the next one. At 0.70 a
    # 4Gi worker leaves at ~2.87 GiB, which affords the largest measured peak twice over. 0 disables.
    # -- Retire a worker when resident memory reaches this fraction of its cgroup limit (0.70 = ~2.87 GiB of 4Gi); 0 disables.
    recycleAtMemoryFraction: 0.70

    # The slice of `maxConcurrentUnits` RESERVED for index builds; compaction gets the remainder.
    # A reservation, not a measurement — an index build holds its token far longer than a compaction
    # (`indexAckWait` 3600s against the work queue's 720s), so letting index units take the whole pool
    # would starve the lane that runs every 120s, and letting compaction take it would leave a build
    # delivered with nothing to run it while its hour-long window burns.
    # -- Slice of `maxConcurrentUnits` reserved for index builds per worker; compaction gets the remainder.
    indexConcurrentUnits: 4
    # -- CPU/memory requests and limits of each worker pod, sized for the compaction work rather than the planner's 512Mi.
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      # Sized for the WORK, unlike the planner's 512Mi. Compaction reads whole fragments: on bronze,
      # whose rows are ~1.8MB page images, `scanBatchSize: 64` is ~115MB in flight before Lance's own
      # overhead. Raise this and `scanBatchSize` together — the batch is what the limit bounds.
      limits: { cpu: 2, memory: 4Gi }
  # Sign each compaction's WRITE with a credential vended per table by the catalog, instead of the
  # deployment's ambient root key. A compaction IS a write — it lands data files and commits a manifest
  # — so with this off the service that rewrites every bucket in the estate does so with one long-lived
  # key, which is the posture the vending door exists to end.
  #
  # ON BY DEFAULT, and the default is the decision. It shipped `false` under the reasoning that it
  # "needs the catalog reachable AND the subject holding `can_write_data`", so turning it on was the
  # operator's statement that both were true. Measured on the live estate 2026-09-09, that produced the
  # opposite of the intent: `catalog_url` was empty in the running pod, every compaction signed with the
  # root key, and the only evidence was the ABSENCE of a `vend_credentials` audit stream. `values.yaml`
  # already carries the general form of this ruling for `docs_enabled` — "a security default that every
  # deployment must remember to turn off is one nobody turns off" — and a hardening every deployment
  # must remember to turn ON is the same defect facing the other way.
  #
  # Both preconditions hold. The sweep vends `tier=maintain`, which `endpoints/credentials.py` opens to
  # `can_maintain`, the rung the bootstrap grants the sweep (a `maintainer`, never a `writer`); and the
  # URL is rendered by this chart, so "catalog reachable" is a property of the deployment rather than
  # of the operator's memory.
  #
  # COVERAGE IS PER WAREHOUSE, not estate-wide: the bootstrap hook grants the maintainer rung on the
  # default warehouse, so a tenant warehouse (and any warehouse minted after install) still compacts on
  # the root key until its own grant exists. That fallback is correct, is logged per dataset, and — since
  # 2026-09-09 — the whole-service form of it announces itself once per process instead of silently
  # (`maintenance/services/credentials.py::_announce_vending_is_off`), which is what made the estate-wide
  # case invisible. So this is a bounded improvement that reports its own bounds, not a switch that
  # either works or fails. See `docs/adr/0045-the-lakehouse-cloud-native-cutover-2026-09-03-04.md`, "The lakehouse cloud-native cutover".
  # -- Sign each compaction write with a per-table credential vended by the catalog instead of the deployment's S3 key; falls back per dataset.
  vendWriteCredentials: true
  # WHERE THE REWRITE'S BYTES ARE MOVED. Off = one in-pod `compact_files()`, which plans, executes and
  # commits in a single call — so this pod's memory ceiling is a function of the largest table anyone
  # owns rather than of its request rate, and no amount of sizing fixes that for the next table.
  #
  # On, the catalog plans and commits (metadata only, no data byte, under its own key) and this pod
  # performs only the rewrite, signed by the credential `vendWriteCredentials` vends for that one
  # table. Needs that flag: the plan and commit doors are the catalog's, so without a reachable
  # catalog this would plan against nothing.
  #
  # It DEGRADES rather than fails: a plan door that cannot answer falls back to the in-pod rewrite,
  # because nothing has been planned at that point and a hardening that could stop a maintenance run
  # would be a new way to stop reclaiming disk. Which path ran is recorded per dataset
  # (`DatasetResult.compaction_mode`), so a permanent degradation is a count rather than a guess.
  # -- Let the catalog plan and commit compaction while this pod only rewrites, signed by a vended credential; falls back to in-pod compaction. Off by default.
  distributedCompaction: false
  # The subject this service claims at the catalog's identity door. It is what the bootstrap-admin hook
  # grants `writer` on each warehouse, and what the catalog audits on every vend.
  # -- Subject maintenance claims at the catalog's identity door; bootstrap grants it on each warehouse and the catalog audits it on every vend.
  catalogServiceIdentity: service-maintenance
  # -- Dead-letter topic for compaction work units that exhaust their retries.
  workDlqTopic: dlq.maintenance.work
  # -- Dapr pub/sub component name of the compaction work lane.
  workPubsub: maintenance-work-pubsub
  # THE INDEX-BUILD LANE, on its own topic beside the work queue, and ON because the spec asks for it:
  # `lance_docs/ns_catalog/spec.yaml:1705` states "Index creation is handled asynchronously" and
  # `CreateTableIndexResponse` carries an optional `transaction_id` and nothing else, so the door's
  # whole contract is the unit id and progress is read through ListTableIndices /
  # DescribeTableIndexStats. Set, the catalog's create_index / create_scalar_index doors publish one
  # unit and answer with its id; the build happens on the maintenance WORKER, which is sized 4Gi
  # against the catalog pod's request sizing. An IVF_PQ trains over the table's whole vector column
  # and an FTS build tokenises every row — cost that is a property of the DATA, which is exactly what
  # [[LH-183]] measured going wrong one lane over.
  #
  # EMPTYING IT puts the build back inside the catalog's request handler, because nothing would then
  # execute a unit nobody consumes. That fallback is the honest answer for a deployment with no
  # broker, not a tuning knob: an unbounded index build in a pod sized for a request is the defect,
  # not the default.
  #
  # SEPARATE from workTopic because of the ACK, not for tidiness: a compaction unit is minutes and a
  # vector index over a large table is not, and one ackWait cannot serve both — sized for the index a
  # stuck compaction stays invisible that long, sized for compaction every large build redelivers
  # mid-flight. Separate topics also let the two scale as independent consumer groups.
  # -- Topic the catalog's create-index doors publish build units to for the workers. Empty builds the index inside the catalog request.
  indexTopic: "maintenance.index.v1"
  # -- Dead-letter topic for index build units that exhaust their retries.
  indexDlqTopic: dlq.maintenance.index
  # -- Dapr pub/sub component name of the index build lane.
  indexPubsub: maintenance-index-pubsub
  # The ack window for ONE index build, and the number this lane exists to be able to set. The work
  # queue's 720s is sized for a dataset's compact + index-optimize + GC; a vector index over a large
  # table can exceed it, and an ack that expires mid-build redelivers the unit to a second worker
  # which then builds the same index concurrently. Raise it for a large estate — an over-long window
  # only delays the redelivery of a genuinely lost unit, while an under-long one duplicates work.
  # -- Ack window for one index build unit (a duration, default 3600s); too short redelivers a build mid-flight to a second worker.
  indexAckWait: 3600s
  # The catalog's control root (project/warehouse/trash registries and the `_bases/` base records).
  # Empty => the primary bucket, which is what the catalog itself defaults to; set both together if the
  # catalog's root is moved. Lineage reads the base records from here too (LINEAGE_CONTROL_ROOT).
  # -- S3 root of the catalog's control registries (projects, warehouses, trash, `_bases/`). Empty uses the primary bucket; set together with the catalog's.
  controlRoot: ""
  # …and "both" needs a second key to exist. `MAINTENANCE_POLICY_ROOT` was rendered NOWHERE until
  # 2026-08-16, so an operator following the line above moved the trash/warehouse/project reads and
  # left the #50 policy reads pointing at the old bucket. That failure is silent in the worst way: a
  # policy registry at the wrong root lists cleanly as EMPTY, so every retention override and
  # legal-hold opt-out simply stops applying while the sweep reports a healthy run.
  # Empty => falls back to controlRoot, then to the primary bucket (config.py::resolved_policy_root).
  # -- S3 root of maintenance policy records. Empty falls back to `controlRoot`, then the primary bucket.
  policyRoot: ""
  # -- Days of version history kept by old-version GC.
  olderThanDays: 7 # version GC keeps this much history
  # How much the compaction READ may pull at once. The two multiply — the ceiling is
  # scanBatchSize x row size x compactThreads — so they are set together or not at all.
  #
  # Lance's own defaults are 8192 rows and one thread per HOST core. Rows are not a unit of memory:
  # against ~1.8 MB bronze page-image rows that is ~15 GB per thread, while this pod names no
  # `resources` key and so runs on `resources.default` — a 512Mi LIMIT. With the sweep enabled at
  # `@every 120s` over the medallion buckets and no policy shipped, the first blob-tier tick
  # OOM-killed it, and a maintenance pod in CrashLoopBackOff maintains nothing at all.
  #
  # 64 x ~1.8 MB x 2 is ~230 MB, which fits. Raise them together if you also raise the pod's tier;
  # for a tier whose rows are small, prefer a per-tier maintenance policy (`scan_batch_size`) over
  # raising this global, so the blob tiers stay bounded.
  # -- Rows per compaction read batch (Lance defaults to 8192); with large blob rows this bounds memory, set together with `compactThreads`.
  scanBatchSize: 64
  # -- Compaction read threads. Memory ceiling is scanBatchSize x row size x compactThreads; set the two together.
  compactThreads: 2
  # THE BOUND THE TWO ABOVE REACH FOR, in BYTES rather than rows, and the one the pod's memory is
  # actually sized against. Declared here — it was a code default only — because the worker's memory
  # limit, `dedicatedWorkers.maxConcurrentUnits` and this number must fit together and all three are
  # separately editable.
  #
  # MEASURED 2026-09-22: a compaction unit bounded at this 256 MiB peaked at 729Mi against a 294Mi
  # baseline, so ~1.7x the byte bound is resident per unit. That ratio is what
  # `test_the_worker_can_hold_every_unit_it_admits.py` multiplies out against the pod limit, so raising
  # this without lowering the concurrency (or raising the limit) fails the render rather than the pod.
  # -- Byte bound on what one compaction rewrite reads (default 256 MiB); fits together with the worker memory limit and concurrency.
  maxSourceBytes: 268435456
  # Emit a maintenance lineage event per materially-compacted dataset (shows GC in producers() next to
  # writes) AND a FAIL event per maintain:-errored dataset (deterministic per-dataset run id — the flood
  # guard). Off by default (opt-in, like the medallion toggles); on → compaction joins the pubsub scope +
  # publishes. NOTE: the compaction FAILURE surface (§4 visibility) exists only when this is ON — left
  # off, a persistently failing dataset is visible only in OTel spans + the cron response body. When ON,
  # also consider services.lineage.runRetentionDays > 0: a recovered dataset's FAIL Run node otherwise
  # persists in /runs indefinitely (the deterministic id means exactly one node per dataset).
  # ON since 2026-08-16. The reason it was off — "opt-in, like the medallion toggles" — was a posture,
  # not a cost: the events are graph-only by construction, so turning it on adds provenance and cannot
  # add notification noise. `maintenance/core/lineage_emit.py` stamps a `lance` facet and outputs, and
  # NO `author` facet and no `lance.project`; per `.claude/skills/rask-notifications`, AUTHOR targeting
  # reads `author.sub` and nothing else, and WATCH needs `lance.project` — so a sweep addresses nobody.
  # That is correct rather than a gap: a cron tick has no human to name.
  #
  # What it buys is the FAILURE surface named below. Left off, a persistently failing dataset was
  # visible only in OTel spans and the cron response body — and this estate spent 2026-08-16 proving
  # how well that hides (the sweep's own summary reached no sink at all for the life of the renamed
  # service). Enabling it also joins the pubsub scope, which dapr-component.yaml already conditions on
  # this same value, so there is no second switch to forget.
  #
  # COVERAGE IS CATALOG-LAID-OUT TABLES ONLY, and that is a real boundary rather than a rounding error.
  # `lineage_emit.table_id_from_uri` derives the canonical Dataset name — which must equal the OpenFGA
  # object id — by splitting the directory on its first `_`, so `<uuid8>_<ns>$<table>` emits and anything
  # without an underscore returns None and emits nothing. The medallion cascade's own datasets sit at
  # `<bucket>/medallion/<tier>`, whose URI does not carry the table name at all (the tables are
  # `bronze$events`, `silver$features`, …), so bronze/silver/gold produce NO maintenance provenance.
  # That skip is correct, not lazy: an output name that does not match the FGA object counts every
  # recipient as hidden, so guessing one would be worse than staying quiet. VERIFIED live by driving a
  # real sweep over both shapes — the catalog-layout dataset landed
  # `(:Run {operation: "compaction"})-[:WROTE]->(:Dataset {name: "silver$emitproof"})` in AGE; the
  # `medallion/`-layout one produced nothing. Naming medallion datasets needs the emitter to be told the
  # table, not a cleverer split.
  #
  # The `runRetentionDays` note below still applies and is deliberately NOT changed here: with the
  # sweep at 0 errors there are no FAIL Run nodes to accumulate, so pruning run history is a separate
  # decision to make on its own evidence rather than as a side effect of turning provenance on.
  # -- Emit a lineage event per materially compacted dataset and a FAIL event per errored one; covers catalog-laid-out tables only.
  lineageEmit: true
  # #79 RECLAMATION. When on, the reconcile tick DELETES the bytes of every trash record past its grace
  # deadline and revokes that object's grants — gated on that same tick's drift report running clean
  # (no findings, no unavailable category, no incomplete scan).
  #
  # OFF by default, and it should stay off until the drift report has run clean on THIS estate for a
  # while: turning it on makes a `drop_table` past LANCE_TRASH_GRACE_DAYS permanently unrecoverable
  # (`undrop` does not check expiry today — a record that survives is a recovery that still works). It
  # is also the only irreversible thing this service does; compaction and version GC are bounded by
  # policy, this destroys a whole dataset.
  # -- Delete the bytes of trash records past their grace deadline and revoke their grants, only when that tick's drift report is clean. Irreversible; off by default.
  trashPurge: false
  # SEE WHAT RECLAMATION WOULD COST, before spending the permission above. The pass runs for real —
  # same due-record selection, same liveness and shallow-clone pre-passes, same refusal check — and
  # performs none of the mutations, reporting `trash_purge.would_purge` instead. With `trashPurge`
  # off the pass otherwise returns before the trash prefix is even read, so without this the only way
  # to learn what a purge would do is to let it do it.
  #
  # It subtracts every MUTATION: with both on, the tick previews and reclaims nothing. A deployment
  # that means to reclaim and quietly previews forever would look exactly like a healthy one, so every
  # reclamation counter carries a `dry_run` dimension and `maintenance.trash.purge_planned` exists to
  # make that state queryable.
  #
  # IT ADDS READ COST. With `trashPurge` off the pass returns before reading anything; with this on it
  # does the full trash listing, a Lance `__manifest` open per maintained root, and the shallow-clone
  # pre-pass over EVERY dataset in EVERY maintained bucket — against a 512Mi pod that has been
  # OOMKilled before. Turn it on to answer a question, not as a standing setting.
  #
  # `would_purge` is an UPPER BOUND: the FGA revoke, a non-dataset location and a failing delete each
  # refuse records a preview cannot test without performing the act they guard.
  # -- Run the purge pass for real but perform no mutation, reporting `would_purge`; adds full read cost.
  trashPurgeDryRun: false
  # Per-tick ceiling on purged records. The remainder is reported (`trash_purge.capped`) and drained on
  # the next tick, so a backlog never becomes one unbounded delete storm against object storage.
  # -- Maximum trash records purged per tick; the remainder is reported as capped and drained next tick.
  trashPurgeMaxPerTick: 25
  # [[LH-094]] — raise a stranded dataset's Lance LISTING FLOOR so its residue becomes reclaimable.
  #
  # `cleanup_old_versions` clamps its unreferenced-file listing to the earliest retained manifest's
  # commit timestamp BEFORE the 7-day rule, so a file whose mtime is above that instant is invisible to
  # Lance permanently — not late. Any restore, re-upload or lifecycle rehydrate puts every object mtime
  # above every manifest and creates it estate-wide. This writes ONE metadata-only commit per stranded
  # dataset, which moves the floor past the residue; Lance then does the deleting on the next sweep.
  #
  # OFF BY DEFAULT because the commit is a real version on a GOVERNED table, written for a GC side
  # effect (owner ruling 2026-09-19, docs/adr/0066-four-rulings-on-the-lakehouse-s-unblocked-rows-owner-2026.md). The rejected alternative had this service
  # delete the named bytes itself, on live tables, against a floor rule it derived rather than one
  # upstream enforces.
  # -- Write one metadata-only commit per stranded dataset to raise its Lance listing floor so residue becomes reclaimable. Off by default.
  floorRaise: false
  # The preview, and note the default is the OPPOSITE of trashPurgeDryRun above. The purge earns its
  # permission from a report that must first run clean; this pass is what MAKES that report clean, so
  # nothing gates it but these two flags — and the safe default for an ungated writer is to plan only.
  # Turning `floorRaise` on therefore reports `floor_raise.raised` and commits nothing until this is
  # set false.
  # -- Plan and report floor raises without committing. Defaults true; set false to commit once `floorRaise` is on.
  floorRaiseDryRun: true
  # Per-tick ceiling on datasets committed to. A store rebuild strands every dataset at once, so an
  # uncapped pass would turn one cron fire into a commit against every governed table in the estate.
  # The remainder is reported (`floor_raise.capped`) and taken on the next tick.
  # -- Maximum datasets the floor raise commits to per tick; the remainder is reported as capped.
  floorRaiseMaxPerTick: 10
  # [[LH-061]] — rebuild authorization tuples the control-plane registries still justify.
  #
  # ADDITIVE ONLY: the pass writes and never deletes, so it cannot widen access beyond what the control
  # plane already recorded. It exists because the reconciler could DETECT a project holding no tuples
  # at all and do nothing about it — and that project-admin tuple is what makes a tenant
  # self-sustaining, so a tenant without it is one nobody can administer, grant on, or delete.
  #
  # THE BOUND, so this is not mistaken for a backup: project records carry `created_by` and warehouse
  # records do not (measured live 2026-09-19, 93/93 and 0/97). So a tenant's admin seed and its
  # warehouses' tenancy pointers come back; every grant made after creation — other admins, roles, team
  # edges, per-table owners, the cascade identities — is in no registry and comes back from none of
  # them. A rebuilt estate is one an admin can start repairing, not one that is repaired.
  # -- Recreate OpenFGA tuples the control-plane registries still justify (project admin seed, warehouse tenancy); additive only. Off by default.
  tupleRebuild: false
  # Plan and report, write nothing. Defaults TRUE: turning the pass on to SEE what it would grant must
  # not grant it.
  # -- Plan and report the tuple rebuild without writing. Defaults true.
  tupleRebuildDryRun: true
  # Per-tick ceiling on tuples written. A wholesale tuple loss makes every tenant eligible at once, so
  # an uncapped pass would turn one cron fire into an estate-wide authorization write. The remainder is
  # reported (`tuple_rebuild.capped`).
  # -- Maximum tuples the rebuild writes per tick; the remainder is reported as capped.
  tupleRebuildMaxPerTick: 50
  # [[LH-061]] — revoke authorization tuples whose OBJECT no longer exists.
  #
  # The destructive counterpart to `tupleRebuild` above, and the bound is what makes it safe: it
  # deletes TUPLES and nothing else — never a byte, a registry record or a catalog table. It acts only
  # on `ghost_projects`/`ghost_warehouses`/`ghost_tables`, which are one fact under three names (a
  # tuple on an object no registry record names), so a revoke removes nobody's access to anything:
  # there is no door to open and no bytes behind it. `ungoverned_tables` is the INVERSE shape — a real
  # table carrying no tuples — and is refused BY NAME, because a pass that "repaired drift" by acting
  # on it would destroy live data to close an authorization gap.
  #
  # IT REFUSES A CATEGORY WHOSE LISTING WAS READ ONLY IN PART. The inference is a subtraction, so it
  # holds only against a complete record set; an unreadable warehouse root is reported as an
  # IncompleteScan rather than an error, and without that refusal one transient manifest failure would
  # strip authorization from every table in that warehouse.
  #
  # Measured on this estate 2026-09-20: 1,041 ghost tables, residue of the warehouse-delete cascade
  # [[LH-148]] fixed at source — a producer already closed, leaving a backlog nothing else can clear.
  # -- Revoke OpenFGA tuples whose object no registry names (ghost projects/warehouses/tables); deletes tuples only. Off by default.
  driftRepair: false
  # Plan and report, delete nothing. Defaults TRUE — stricter than `trashPurgeDryRun` above, and
  # deliberately: the purge's targets are already-expired records on a maintained root, while this
  # writes to the AUTHORIZATION store, where a wrong revoke is felt by a person holding a grant rather
  # than by a reclaimer.
  # -- Plan and report drift repair without deleting any tuple. Defaults true.
  driftRepairDryRun: true
  # Per-tick ceiling on objects revoked. The remainder is reported (`drift_repair.capped`) and taken on
  # the next tick, so a large backlog drains over ticks instead of becoming one unreviewable batch of
  # authorization deletes. Edge cuts are NOT counted against it: one cut removes a single tuple from a
  # live object, and counting them here would let a backlog of ghosts starve the smaller, safer repair.
  # -- Maximum objects drift repair revokes per reconcile tick; the remainder is reported as capped and taken next tick.
  driftRepairMaxPerTick: 50
  # [[LH-061]]'s STORAGE tier — clear a trash record whose bytes are PROVEN gone.
  #
  # `driftRepair` refuses `orphaned_trash` because the record is the only remaining pointer to those
  # bytes. This pass satisfies that objection rather than overturning it: it PROBES the location first
  # and sweeps only when the listing comes back empty, so it deletes a bookkeeping row and never a
  # byte. A location that still holds objects, or that cannot be read at all, is refused by id with the
  # count that refused it.
  #
  # That probe is also why this pass needs no incompleteness guard of its own: its decision rests on a
  # direct observation of the store rather than on an absence from a listing.
  # -- Clear trash records whose bytes a probe proves are gone; deletes bookkeeping rows, never bytes. Off by default.
  tombstoneSweep: false
  # Plan and report. Defaults TRUE for its sibling's reason — turning the pass on to SEE what it would
  # clear must not clear it.
  # -- Plan and report the tombstone sweep without clearing anything. Defaults true.
  tombstoneSweepDryRun: true
  # Per-tick ceiling on records swept, applied BEFORE the probing so a large backlog cannot turn one
  # tick into an unbounded listing storm against object storage. The remainder is reported
  # (`tombstone_sweep.capped`).
  # -- Maximum trash records the tombstone sweep probes and clears per tick; the remainder is reported as capped.
  tombstoneSweepMaxPerTick: 50
  # The reconciler's per-dataset FILE scan — the unreferenced-file category (#128a).
  #
  # THIS IS THE LEVER TRASHPURGE ABOVE DEPENDS ON, and until 2026-08-15 it did not exist at any values
  # level: `MAINTENANCE_ORPHAN_SCAN_ENABLED` defaults False in config.py and the chart rendered no env
  # var for it, so the scan could not be turned on in a deployed estate by any means. The reconciler
  # therefore recorded `orphan_files` as SKIPPED on every tick, forever — and `report_is_clean` used to
  # treat a skip as harmless, so the purge reclaimed bytes against a file layer nobody had inspected.
  # The gate now BLOCKS on that skip, which is only reachable-not-fatal because this key exists.
  #
  # Off by default deliberately, and the cost is why: the scan opens EVERY dataset and unions the file
  # references of EVERY live version across the data buckets — a different order of work from the rest
  # of the report, which merely compares three stores. Turn it on to let the purge certify; leaving it
  # off is a valid choice that now costs you the purge rather than silently granting it.
  # ON since 2026-08-16. It is a REPORTING scan — it deletes nothing, and `trashPurge` above stays off —
  # so the only thing being spent is read budget, and the estate just got cheap enough to spend it: the
  # primary bucket went from 45 datasets to 13 when 32 leaked `ray-e2ebatch*` e2e artefacts were removed
  # (they were 16 per-pid prefixes accumulated by a suite that called them "throwaway" and never threw
  # them away). Opening every dataset across 13 is a different proposition from opening 45.
  #
  # It is ONE of the two blockers under `report_is_clean` that configuration can clear rather than work:
  # `orphan_files` was the SKIPPED coverage gap, and `discoveryMaxDepth` below is the other. Real
  # findings and categories reporting UNAVAILABLE are estate state, not switches. (The unavailable four
  # cleared the same day for a different reason: the reconciler was refusing to LOOK UP its OpenFGA
  # store when the ids were unpinned, which is the chart's default posture.)
  # -- Run the reconciler's per-dataset unreferenced-file scan; read-only, and required for `trashPurge` to certify a clean report.
  orphanScan: true
  # How deep the bucket walk descends looking for a dataset's `_versions/` marker. A subtree the walk
  # stops inside is filed as an `IncompleteScan` and blocks the purge — and the walk cannot tell "no
  # dataset here" from "did not look deep enough", so a prefix that will never hold one blocks
  # reclamation as hard as a manifest nobody could read. Exhausting the tree is how you clear those.
  #
  # It reveals no hidden data: measured 2026-09-08 on the primary bucket, depth 6 finds the same 30
  # datasets as depth 3 and stops nothing. The default stays 3 because that covers one of 93 buckets,
  # and raising it costs a walk that is already the sweep's dominant cost (`_protected_roots` opens
  # every discovered dataset in every bucket before one is compacted). MEASURE before moving it — the
  # report names the prefixes it stopped at, which is where that measurement starts.
  # -- How deep the bucket walk descends looking for a dataset's `_versions/`; a subtree it stops inside is an IncompleteScan that blocks the purge.
  discoveryMaxDepth: 3

  # Stores the PLATFORM owns and the catalog deliberately cannot resolve ([[LH-164]]). The model
  # registry's models sit at `<root>/medallion/models/<model>` and the catalog's promote/describe doors
  # open it by EXPLICIT URI, because native namespace resolution would drop the `/medallion/` prefix
  # (`catalog/core/config.py:516-522`). So it is not unregistered — it is known and unresolvable.
  #
  # BESIDE `orphanScan`/`discoveryMaxDepth` AND NOT UNDER `dedicatedWorkers`, because the RECONCILE
  # runs on the planner: `/maintenance-reconcile-cron` is registered on `rask-maintenance`, and the
  # workers execute units. A setting on the wrong deployment is read by nobody and looks configured.
  #
  # NAMED RATHER THAN INFERRED. Left empty, the reconciler reports the registry's own datasets among
  # `unreadable_locations` every tick — the fail-loud direction, but it buries the locations nobody has
  # accounted for. Measured 2026-09-23: 163 of 564 discovered locations carry no recoverable table id,
  # and 16 of them are this registry.
  # -- Platform-owned store roots the catalog cannot resolve (e.g. medallion models) that the reconciler accounts for instead of reporting as unreadable.
  declaredPlatformRoots: "s3://lance-catalog/medallion/models"

  # LH-101: wall-clock ceiling for ONE sweep tick, checked BETWEEN datasets — never inside a compaction.
  # 0 = unlimited, which is today's behaviour and stays the default: the right value depends on the
  # estate's dataset count and the tick interval, and inferring one would be guessing. Set it and the
  # tick logs `sweep_budget_exhausted` with what it executed and what it did not reach, which is the
  # starvation this exists to make visible.
  # -- Wall-clock ceiling for one sweep tick, checked between datasets; 0 means unlimited.
  sweepBudgetSeconds: 0
  # Announce each reclamation on the catalog's control topic (catalog.control.v1). Requires
  # dapr.enabled — and the component's `scopes` must list this app-id, which the chart does below;
  # without it the sidecar rejects every publish SILENTLY (emission is best-effort by design).
  # -- Announce each reclamation on the catalog control topic (catalog.control.v1); needs Dapr sidecars. Off by default.
  controlEmit: false

# === lance-media plane ============================================================================
# The viewer/search/annotator services from the lance-audio checkout. All three share the catalog image
# and read the corpus from a node-local hostPath (NO data move — only the annotations table lives in the
# catalog; MEDIA_READ/WRITE_BACKEND=catalog is the merge's env flip, "direct" restores standalone dev).
explorer:
  # -- Deploy the explorer trio (viewer, search, annotator services) and their gateway URLs.
  enabled: false
  # Where the pods mount the corpus (read-only, all three services).
  # #142: set to a warehouse bucket (e.g. "s3://bind86-wh") to serve the media corpus from the
  # GOVERNED object store instead of the mounted volume. VIEWER ONLY so far — search/annotator
  # still need creds + a minio NetworkPolicy row before they can follow. "" = the disk, unchanged.
  # -- S3 root (e.g. a warehouse bucket) the viewer serves the media corpus from (MEDIA_S3_DB_ROOT). Empty = the mounted corpus volume.
  corpusS3Root: ""
  # -- Path the corpus volume is mounted at, read-only, in all three explorer services.
  corpusMountPath: /media-corpus
  # HOW the corpus volume is provided. This used to be an unconditional `hostPath` with
  # `type: Directory` pointed at /var/media-corpus — which means explorer.enabled=true on a cluster where
  # nobody had pre-created that directory wedged all three pods in ContainerCreating, with a kubelet
  # event as the only diagnostic (live-proof 2026-07-28, defect 5; the plan already said no hostPath
  # ships). Modes:
  #   * emptyDir (DEFAULT) — the trio starts on ANY cluster with zero node preparation. The corpus
  #     datasets are then loaded into the pod, or read through the catalog (MEDIA_READ_BACKEND=catalog).
  #     With no dataset present the viewer's /api/health degrades honestly (db: null) instead of 404ing
  #     — see services/viewer/api/v1/endpoints/system.py.
  #   * pvc — the PROD posture. Set `claimName` to mount an EXISTING claim (the chart touches nothing);
  #     leave it empty and the chart creates `<release>-media-corpus` from the fields below
  #     (helm.sh/resource-policy: keep — the corpus outlives the release).
  #   * hostPath — a node-staged corpus (the lance-audio runbook's posture). Now OPT-IN, and rendered
  #     with `type: DirectoryOrCreate` so a missing directory can no longer wedge the pods.
  corpus:
    # -- How the corpus volume is provided: `emptyDir` (default), `pvc` (existing `claimName` or a chart-created claim) or `hostPath` (DirectoryOrCreate).
    mode: emptyDir            # emptyDir | pvc | hostPath
    # -- Existing PVC to mount when mode is `pvc`. Empty = the chart creates `<release>-media-corpus` (kept on uninstall).
    claimName: ""             # mode=pvc: an existing PVC; empty => the chart creates one
    # -- Requested size of the chart-created corpus PVC.
    size: 50Gi                # chart-created PVC only
    # -- Access mode of the chart-created corpus PVC; ReadWriteMany because three services read it concurrently.
    accessMode: ReadWriteMany # chart-created PVC only — three services read it concurrently
    # -- StorageClass of the chart-created corpus PVC. Empty = the cluster's default StorageClass.
    storageClass: ""          # chart-created PVC only; "" => the cluster's DEFAULT StorageClass
    # -- Node directory mounted as the corpus when mode is `hostPath`.
    hostPath: /var/media-corpus # mode=hostPath only
  # -- Where the explorer services read annotations from (MEDIA_READ_BACKEND): `catalog` (governed) or `direct` (standalone dev).
  readBackend: catalog
  # -- Where the explorer services write annotations to (MEDIA_WRITE_BACKEND): `catalog` (governed) or `direct` (standalone dev).
  writeBackend: catalog
  # Default: the in-release catalog Service (rendered in media.yaml); set to override.
  # -- Catalog URL the explorer services use (MEDIA_CATALOG_URI). Empty = the in-release catalog Service.
  catalogUri: ""
  # REMOVED 2026-08-26 — `catalogToken` was the media services' catalog bearer, and nothing read it
  # except a fallback that should not have existed: `open_reader`/`open_writer` did
  # `caller_token or settings.catalog_token`, so a request arriving with NO bearer was re-issued to
  # the catalog under this identity — which the values comment itself told operators to grant the
  # writer rung on the annotations table. The catalog checks one relation on one `table:` object and
  # injects no row predicate, so that answers 200 for a caller with no grant at all.
  #
  # The cited justification ("callers with no request context, the publish saga") does not use it:
  # the saga mints its own token from Dex via MEDIA_PUBLISH_TOKEN_URL.
  # The annotator PUBLISHES control events (`task_assigned` / `task_unassigned`) so the notifications
  # plane can put assigned work in the assignee's inbox instead of making them go looking for it.
  # Off by default like every other transport in this estate — a half-configured emitter must never
  # pretend to publish. Turning it on ALSO scopes the annotator's app-id on the control pubsub
  # component (dapr-component.yaml); without that the sidecar rejects every publish, silently,
  # because the emit is best-effort by design.
  # -- Annotator publishes `task_assigned`/`task_unassigned` control events for the notifications inbox, and is scoped on the control pubsub component.
  controlEmit: false
  services:
    # -- Explorer viewer service: `port` (its HTTP port) and `daprAppId` (its Dapr app-id).
    viewer: { port: 8101, daprAppId: viewer }
    # -- Explorer search service: `port` (its HTTP port) and `daprAppId` (its Dapr app-id).
    search: { port: 8102, daprAppId: search }
    # -- Explorer annotator service: `port` and `daprAppId`; the app-id is scoped on the control pubsub when `explorer.controlEmit` is on.
    annotator: { port: 8103, daprAppId: annotator }

# === Query encoders — the vector/rerank half of media search =====================================
# The search + viewer services are CLIENTS of two OpenAI-shaped HTTP endpoints
# (services/search/services/encoders/{embedding,reranker}.py): Qwen3-VL-Embedding-2B on
# `POST {embedUrl}/v1/embeddings` and Qwen3-VL-Reranker-2B on `POST {rerankUrl}/v1/rerank`. Neither
# server is our code — lance-audio serves both from the stock `vllm/vllm-openai` image, so this is a
# URL, not a Deployment.
#
# The settings default is `http://127.0.0.1:8001` / `:8002` — a sidecar-era address that inside a pod
# is the POD's own loopback, so every vector mode 503s until these are set. Measured 2026-07-26:
# fts + scene_fts 200, and `semantic`/`visual`/`scene`/`hybrid`/`all` + `rerank=true` all 503.
# Leaving them empty is the HONEST off state, not an oversight: /api/health reports embed.ok=false /
# rerank.ok=false and the media zone disables the modes with that reason.
#
# Point these at whatever serves the two models — an out-of-cluster fleet, or a host-run vLLM reached
# through the node gateway. Under `networkPolicy.enabled` an off-cluster endpoint also needs a
# `networkPolicy.extraEgress` entry, the same as the externalized S3/NATS/OTLP endpoints.
encoders:
  # -- Base URL of the OpenAI-shaped embedding server search calls and viewer probes (MEDIA_EMBED_URL). Empty = vector search modes report unavailable.
  embedUrl: "" # e.g. http://encoders.internal:8001 — enables semantic / visual / scene / hybrid / all
  # -- Base URL of the OpenAI-shaped reranker server (MEDIA_RERANK_URL). Empty = the rerank leg reports unavailable.
  rerankUrl: "" # e.g. http://encoders.internal:8002 — enables the rerank leg on any mode

# === Model runners (runners/ — the lance-audio fold) ==============================================
# Only the CPU-viable subset ships: `assist` (GroundingDINO-tiny + SAM-ViT-base, CPU wheels, weights
# baked into the image). The CUDA-pinned runners (asr/diarize/voiceprint) and the LLM-dependent batch
# runners (topics/kg) have no honest deployment on a GPU-less estate. When enabled (and explorer.enabled),
# the annotator's MEDIA_ASSIST_URL points at the assist Service, flipping its in-repo mock to real
# predictions. NOTE: runners/htr is the rask HTR runner — a sealed project, not deployed from here.
runners:
  # -- Deploy the `assist` model runner and point the annotator's MEDIA_ASSIST_URL at it instead of its in-repo mock.
  enabled: false
  assist:
    # -- Assist runner image: `repository` and `tag`; the tag is required when runners are enabled.
    image: { repository: assist-runner, tag: dev }
    # -- HTTP port of the assist runner Service.
    port: 8110
  # A RayJob submit endpoint for the annotator's batch-labeling seam (MEDIA_JOBS_URL).
  # No such deriver exists yet — leave empty and the annotator keeps its honest submit/poll mock.
  # -- RayJob submit endpoint for the annotator's batch-labeling seam (MEDIA_JOBS_URL). Empty = the annotator keeps its submit/poll mock.
  jobsUrl: ""

# === Dapr state store — operational state (NOT analytical data) ===================================
# Backed by the already-deployed AGE Postgres, in its own database. This is what annotation task state
# (#122), the notification inbox (#125) and Dapr workflow instances persist to; Lance keeps the
# published, versioned, analytical data and nothing operational. See chart/templates/dapr-statestore.yaml
# for why Postgres rather than Redis.
stateStore:
  # -- Render the Dapr Postgres state store component (actor and workflow state) on the AGE `stateDb`.
  enabled: true
  # -- Name of the Dapr state store component.
  name: lance-statestore
  # -- Version of the Dapr Postgres state store component.
  componentVersion: v1
  # The Dapr secret store that resolves the connection string — OpenBao, not a k8s Secret. See
  # service_kit.governed.secrets for why the store must be the sole source.
  # -- Dapr secret store that resolves the state store's connection string (OpenBao, never a k8s Secret).
  secretStore: lance-secrets
  # -- Postgres table holding Dapr state rows.
  tableName: state
  # -- Table the Dapr state store keeps its own metadata in.
  metadataTableName: dapr_metadata
  # Only the services that own operational state may load it. An unscoped component is loadable by
  # every app-id in the namespace, which would let any service write another's state.
  # -- App-ids allowed to load the state store; the secret-store scope is derived from this list too. Adding one needs a restart of scoped pods.
  scopes:
    - annotator # #122 task/project state, plus the per-task and per-project actors and their reminders
    # The catalog is scoped for the publish saga's own state. NOTE: the saga does NOT run on a
    # workflow engine — it is token-keyed idempotent (docs/OPERATORS.md §4), driven by the annotator's
    # project actor off `pending_publish_id`. This scope predates that decision; it stays because the
    # catalog is the service that creates the published table, but nothing here provisions workflow
    # instances and none are expected.
    - catalog
    # ── `flows` is here for STATE, and it is the one entry that genuinely provisions workflows. ──────
    # The studio flow-builder's durable lane IS Dapr Workflow (`flows/workflow.py`), which stores its
    # orchestration state through the ACTOR runtime — so without this scope the sidecar cannot load the
    # component and `create_workflow_instance` fails with "the state store is not configured to use the
    # actor runtime", pointing at a component that declares `actorStateStore: "true"` and is simply not
    # visible to this app-id. Measured live 2026-08-06: the service booted healthy, served its catalog,
    # and 500'd on the first POST /runs — the scope is the whole difference.
    - flows
    # ── `notifications` needs STATE, and it is the entry that forces the rollout. ────────────────────
    # The whole service is actor state: one InboxActor per subject, holding the pointer rows and the
    # compaction reminder. Unscoped, the sidecar answers "Actor state store not configured - actor
    # hosting disabled" to every actor call. The pod does NOT crash-loop and does not even report
    # itself degraded: `ActorRuntime.register_actor` is process-local (it never touches the sidecar),
    # so the lifespan sets `actors_registered = True`, `require_actor_plane` lets the request through,
    # and the refusal happens per INVOCATION — today as an untranslated 500 from every inbox route on
    # a pod whose probes stay green. Symptom: a healthy pod and a bell that never fills.
    #
    # THIS ADDITION IS A COORDINATED ROLLOUT, and that is a scheduling fact rather than a code one.
    # `lance-statestore` carries `actorStateStore: "true"`, and daprd refuses to hot-reload any actor
    # state store (measured 2026-08-07): the component is re-read only at sidecar
    # BOOT, so already-running pods of every scoped app keep the OLD scope list until they restart.
    # Adding an app-id while it has no pod is the single safe case and this is it — nothing regresses
    # on the other four, they simply do not observe the change — but the notifications pod itself must
    # come up AFTER the component carrying this scope exists. open_notifications.md §11 q4 holds the
    # window open for its other passengers (the Dapr Configuration/ActorStateTTL
    # decision, the state.postgresql v1→v2 move); ride them together or not at all.
    - notifications
    # An app-id that hosts a workflow runtime and is unscoped logs
    #   "Actor state store not configured - actor hosting disabled, but invocation enabled"
    #   "Workflow engine started"
    # in that order (measured live 2026-08-15), and every workflow it starts fails.

# === Backups — a FALLBACK for the SELF-CONTAINED in-cluster path only. OFF by default. When you run the
# managed/operator path (CloudNativePG for AGE — the rask deployment), DISABLE these
# and let the operators do backups (PITR + scheduled, better than this). These exist so a self-contained
# in-cluster-prod deploy (in-cluster object-store PVC + AGE) isn't backup-less. ---------------------------------
backups:
  # pg_dump the lineage + OpenFGA DBs (gzip) → the lakehouse S3 under _backups/pg/<date>/.
  pgDump:
    # -- Schedule a CronJob that pg_dumps the lineage, OpenFGA and Dapr state databases (gzip) to `_backups/pg/<date>/` in the lakehouse bucket. Off by default.
    enabled: false
    # -- Cron schedule of the pg dump (default daily 02:00).
    schedule: "0 2 * * *" # daily 02:00
    # -- Number of newest daily pg dumps kept; older ones are pruned on each run.
    keep: 7 # retention: prune all but the newest N daily dumps each run, so the backups don't grow unbounded
  # THE CONTROL ROOT — the registry that holds every project, warehouse, binding and bucket claim. Lose
  # it and the Lance data survives while nothing can route to it. `scripts/control_root_backup.py`
  # ships backup/verify/restore/prune and `docs/runbooks/RUNBOOK-restore.md` documents the drill; this
  # is the scheduled lane, which is what was missing.
  controlRoot:
    # -- Schedule a CronJob that backs up the control root (project, warehouse, binding and bucket-claim registries). Off by default.
    enabled: false
    # -- Cron schedule of the control-root backup (default daily 01:00, ahead of the pg dump).
    schedule: "0 1 * * *" # daily 01:00, ahead of the pg dump so the two do not contend for the store
    # -- Number of newest control-root backups kept after each successful copy; 0 keeps every run.
    keep: 14 # prune to the newest N after each successful copy; 0 keeps every run, unbounded
    # ANOTHER BUCKET is the point of a backup. Empty writes `_backups/control/` inside the control root
    # itself, which survives a bad write and does NOT survive losing the bucket — the failure a backup
    # exists for. Set it in any deployment that matters.
    # -- S3 URI the control-root backup is copied to. Empty writes `_backups/control/` inside the control root itself, which does not survive losing the bucket.
    dest: ""
  # CSI VolumeSnapshot of the lakehouse PVC. Needs a CSI snapshotter + a VolumeSnapshotClass.
  volumeSnapshot:
    # -- Schedule a CronJob that creates a CSI VolumeSnapshot of the lakehouse PVC; needs a CSI snapshotter and a VolumeSnapshotClass. Off by default.
    enabled: false
    # -- Cron schedule of the volume snapshot (default daily 03:00).
    schedule: "0 3 * * *" # daily 03:00
    # -- VolumeSnapshotClass the snapshot names; empty uses the cluster default.
    snapshotClassName: "" # the cluster's VolumeSnapshotClass; "" = the cluster default
    # creates the VolumeSnapshot CR via `sh -c`, so this image needs a shell AND kubectl.
    # (was bitnami/kubectl:1.31 — Bitnami retired the public catalog; that tag now 404s.)
    # -- Image the snapshot job runs; it needs both a shell and kubectl.
    kubectlImage: alpine/k8s:1.31.3

# === HA: PodDisruptionBudget + (optional) HPA for the stateless request-serving services. Off by default
# (single-node dev); the prod overlay turns the PDB on. Stateful stores (AGE/MinIO) get HA from their
# operators (CNPG), NOT from here. ------------------------------------------------
podDisruptionBudget:
  # -- Renders a PodDisruptionBudget for each service, controlplane and zone running more than one replica.
  enabled: false
  # -- minAvailable of every rendered PodDisruptionBudget.
  minAvailable: 1
autoscaling:
  # CPU IS THE FALLBACK SIGNAL HERE, NOT THE INTENDED ONE — and that sentence is the decision this
  # block was missing. kubernetes.md is explicit that CPU is a lagging signal for a request-driven
  # API ("by the time CPU is high, latency is already bad") and lists "HPA on CPU for an I/O-bound
  # API" among the things not to do. Both targets are exactly that: catalog buffers Arrow-IPC bodies
  # and runs its S3/Lance calls in a threadpool, lineage waits on an AGE psycopg pool. They spend
  # their time BLOCKED, which CPU cannot see.
  #
  # The reference's preferred shape is a Pods-type p95 target, and it was costed rather than waved
  # at: `service_kit.setup_otel` already exports `http.server.*`, and KEDA's prometheus scaler would
  # query the telemetry store's PromQL endpoint (`observability.query.url` + `/v1/prometheus`) — the
  # endpoint the platform's alert evaluator uses, so the query path is proven, not speculative. Declined 2026-08-28 (owner): it is a twelfth
  # subchart, its CRDs, and a new silent failure mode (scaler cannot reach GreptimeDB → no scaling,
  # no error) for an object no profile enables. Revisit when something actually turns this on.
  # -- Renders CPU-based HPAs for catalog and lineage. Needs metrics-server; off by default.
  enabled: false # opt-in; needs metrics-server. Targets catalog + lineage.
  # -- HPA minimum replicas for catalog and lineage.
  minReplicas: 2
  # -- HPA maximum replicas for catalog and lineage.
  maxReplicas: 5
  # Meaningful only against the pod's CPU REQUEST, never its limit — see resources.catalog/lineage,
  # which exist because the shared `default` tier made this percentage measure 35 millicores.
  # -- HPA target CPU as a percentage of the pod's CPU request (not its limit).
  targetCPUUtilizationPercentage: 70
  # k8s stabilises scale-up by default and scale-down not at all. Five minutes is the reference's
  # worked value; below it a spiky I/O-bound service oscillates between min and max.
  # -- HPA scale-down stabilization window in seconds; stops a spiky service oscillating.
  scaleDownStabilizationSeconds: 300

# === In-cluster S3 (MinIO) ========================================================================
# ONE object store renders — P4's unification (docs/adr/0124-chart-unification-one-control-plane-each-one-object-store.md), which still holds; LH-133 changed WHICH store and
# therefore its mechanism. The server is the minio fixture's ([[XC-131]]); `enabled` gates the
# bucket-init hook (templates/minio-buckets.yaml) and the scoped-user hook
# (templates/minio-scoped-users.yaml) as ONE unit — on minio.enabled ALONE, not singleTenant, because
# the lakehouse/medallion/observability consumers render without singleTenant and must resolve the
# store. The ONE endpoint is `rask-minio:9000` (`lance.minioHost`/`lance.s3Endpoint`).
#
# P4's KEEP-PVC POSTURE holds in the fixture: a StatefulSet's `volumeClaimTemplates` claims survive pod rolls and
# `helm uninstall`, because helm never owned them.
minio:
  # -- This estate uses the development object store (deploy/fixtures/minio, Service `<release>-minio`): rask runs its bucket-init Job and scoped-users hook against it and its dev store issues the root credential. Off with `externalEndpoint` set uses a managed S3. The chart renders no MinIO server.
  enabled: true
  # THE IMAGE IS FIRST-PARTY, component `minio` under `image.*` (`rask.image`): the `mc` the scoped-users
  # hook drives (the dev store's server runs the same build, pinned in its fixture), compiled by
  # `.docker/minio.dockerfile` from upstream tags pinned to their commits (server RELEASE.2025-04-22T22-12-26Z,
  # mc RELEASE.2025-08-13T08-35-41Z). Upstream's `minio/mc` refuses anonymous pulls on Docker Hub and quay.io
  # (401 on the manifest, measured 2026-09-24 and 2026-10-05), so a node with an empty cache could not run
  # the pre-upgrade hook ([[XC-075]]). Pin it by `image.digests.minio`.
  # -- S3 API port of the development store's Service.
  port: 9000
  # THE STORE'S ROOT ACCOUNT. Every scoped identity below exists so that nothing in the fleet presents
  # THIS pair; it remains only because the store itself must boot with one. Only the access key ID is a
  # value: the secret half is the store's `minio-secret-key` (generated in-cluster for the dev OpenBao).
  # -- Access key id of the store's root account; its secret is the store's `minio-secret-key`. No service should present it.
  accessKey: minioadmin
  # THE MAINTENANCE PLANE'S OWN CREDENTIAL, scoped away from the tenant root above.
  #
  # `MAINTENANCE_S3_ACCESS_KEY_ID` renders from `accessKey` — the store's ROOT account — and maintenance
  # COMPACTS with it, which is a write. So the service that rewrites every dataset in every bucket also
  # reaches `_projects/`, `_protection/` and `_policies/`: the records that decide what maintenance
  # itself is permitted to do. A compromise there can turn off the shallow-clone guard that stops a
  # compaction destroying another dataset's source, or re-pace its own cadence.
  #
  # VENDING DOES NOT CLOSE THIS ALONE, measured rather than assumed. `warehouse.writer` (model.fga:97)
  # has no `writer from parent`, unlike `namespace.writer` (:258) and `table.writer` (:330) — so a
  # grant covers ONE warehouse, and `can_write_data` for the maintenance subject on a table under
  # `warehouse:acme-bucket` (one of ~130) returns `allowed:false` with the grant in place. Every vend
  # outside the default warehouse degrades, and what it degrades TO is this key. The fallback itself
  # has to stop being root.
  #
  # THE ACCESS KEY ALONE IS THE WHOLE SETTING: the secret is derived from it in-cluster
  # (`lance.scopedSecretFn`), so this identity can be declared in a values file — which is the
  # point, since a hand-set env is drift Helm never corrects and one values edit reverts to root.
  #
  # DERIVED, NOT EMPTY. This shipped as `""` — the tenant ROOT credential — with the reasoning that a
  # chart repointing a live service at a credential nobody created would take maintenance down on
  # upgrade. That was true while the provisioning hook ran only `post-upgrade`; it now runs
  # `pre-upgrade` too, so the user exists before the pods that present it roll, and root-by-default has
  # nothing left defending it. `rask.isRealDeployment`'s own rule applies: a guard reachable only by
  # remembering an opt-in protects the installs that did not need protecting. Set a value here to name
  # a different user; the secret is still derived (`lance.scopedSecretFn`).
  # -- Access key of maintenance's scoped store identity, the fallback when vending degrades; secret derives in-cluster.
  maintenanceAccessKey: rask-maintenance
  # THE CATALOG'S OWN IDENTITY — the last service that presented the store's ROOT account (LH-051).
  #
  # It could not be scoped before the store swap, and that was measured rather than assumed: RustFS
  # gates STS `AssumeRole` to root and its policy engine refuses an `sts:AssumeRole` statement
  # outright, so under `vending.mode: sts` the root key was a REQUIREMENT of the mode. On MinIO a
  # policy-attached user both assumes and has its session policy enforced (measured 2026-09-11:
  # in-scope GET allowed, cross-tenant GET and read-tier PUT both AccessDenied), which is what makes
  # this row closable at all.
  #
  # Its policy is WIDE on data and holds no admin rights — see the long note in
  # `minio-scoped-users.yaml`. Warehouse buckets are minted at runtime, so a bucket list here would be
  # stale by construction; what the scoping removes is the ability to mint identities and rewrite the
  # policies that govern every other plane.
  #
  # The access key is the whole setting; the secret derives in-cluster (`lance.scopedSecretFn`).
  # -- Access key of the catalog's scoped store identity; the secret derives in-cluster (`lance.scopedSecretFn`). Wide on data, no admin rights.
  catalogAccessKey: rask-catalog
  # THE LINEAGE SERVICE'S SCOPED IDENTITY, and its policy is the TIGHTEST of the three because its S3
  # surface is the smallest — measured 2026-09-07 rather than assumed. Lineage opens datasets READ-ONLY
  # to probe versions, schema and dangling blobs (`core/reconcile.py`, `demo.py`), and the only bytes it
  # changes anywhere are DELETES of its own outbox objects once the relay has re-ingested them
  # (`outbox.drop_event`). It calls `stage_event` nowhere — staging is the producers' half — so this
  # identity needs NO PutObject at all, which no other plane can say.
  # Provisioned by `minio-scoped-users.yaml` as `rask-lineage`. Named here rather than left empty:
  # measured on the running estate 2026-09-08, lineage was the one plane of the three whose identity
  # was built, provisioned and never selected, so it presented `rustfsadmin` while holding the tightest
  # policy in the estate.
  # -- Access key of the lineage service's scoped store identity (read-only plus deletes of its own outbox); secret derives in-cluster.
  lineageAccessKey: rask-lineage
  # THE OBJECT BROWSER, and the LOOSEST-privileged plane holding the TIGHTEST policy: the viewer only
  # LISTS and GETS. It has no write path at all — `objects.py` calls `list_objects_v2`, `head_object`
  # and `get_object` and nothing else — so its identity needs no PutObject and no DeleteObject, which
  # not even lineage's can say.
  # Named here rather than left empty because the alternative is what was measured on the running
  # estate 2026-09-09: `AWS_ACCESS_KEY_ID=rustfsadmin` in the viewer's own env — the store's ROOT
  # credential, on a pod that HAS a Dapr sidecar and could have asked the secret store for a scoped
  # one. The widest credential in the estate, reached by the one path the goal forbids.
  # -- Access key of the object browser's scoped identity (list and get only); secret derives in-cluster.
  viewerAccessKey: rask-viewer
  # The Lance lakehouse ROOT bucket (catalog LANCE_REST_ROOT + the warehouse registry). Referenced by
  # name in scripts/demo_reset.sh + the vending/lineage tests — do not rename casually.
  # -- The lakehouse root bucket (catalog `LANCE_REST_ROOT`, warehouse registry, lineage outbox).
  bucket: lance-catalog
  # The PLATFORM buckets no feature owns: buckets the estate makes for itself, which no warehouse record
  # claims. The root is not listed, because it has its own key: the Job adds `minio.bucket` itself
  # (`lance.platformBuckets` in _helpers.tpl). A name listed here AND under its own key outlives a rename
  # of that key, as a bucket the Job makes and nothing uses.
  # The bucket-init Job (templates/minio-buckets.yaml) CREATES that set, with minio.bucket and the
  # medallion.buckets zones, and is the only provisioner of platform buckets: the in-cluster store is a
  # plain StatefulSet that provisions none, and an external S3 has nothing else either. (Warehouse
  # buckets are the catalog's, made at runtime by `provision_bucket`.) So the Job creates rather than
  # waits: a platform bucket it waited for would never appear. The maintenance reconcile exempts the
  # same set from `orphan_buckets`. A bucket dropped from this set stays on the store (nothing deletes a
  # bucket), and `orphan_buckets` then reports it, holding the trash purge, until an operator deletes it.
  # GOVERNED tiers only. The raw buckets (images-batch*) are NOT here: raw is external (R23) and lives
  # on HCP. A local bucket sharing a name with an external one makes the browser report the empty
  # local one instead of 404ing.
  # -- Extra platform buckets the bucket-init Job creates and the reconcile exempts from orphan_buckets; governed tiers only, not the root or feature buckets.
  buckets: []
  # Externalize: when set, the apps (catalog/lineage/compaction + vending STS) connect HERE instead of the
  # in-cluster MinIO — pair with minio.enabled=false to use a managed S3.
  # -- S3 endpoint the apps use instead of the in-cluster MinIO; pair with `minio.enabled=false`. Empty uses the in-cluster store.
  externalEndpoint: "" # e.g. https://s3.us-east-1.amazonaws.com
  # (minio.persistence is GONE with the first-party Deployment — durability is the Tenant's
  # volumeClaimTemplate above: StatefulSet-owned PVCs survive pod rolls AND `helm uninstall`, the
  # keep-PVC posture the P4 ruling pins to the Tenant spec. `storageClass` sizes/classes them.)
  # OIDC identity provider for STS AssumeRoleWithWebIdentity (Track B). When on, the store trusts Dex id_tokens
  # → a client can mint short-TTL creds it scopes per-table via the catalog's vending endpoint (vending.mode=
  # web_identity). Off by default (plain dev needs no STS).
  oidc:
    # -- The development store trusts Dex id_tokens for STS AssumeRoleWithWebIdentity (`vending.mode: web_identity`): ESO writes the Dex client secret it reads into `<release>-infra-credentials`. Turn on the fixture's `oidc.enabled` with it.
    enabled: false

ray:
  # THE ENGINE SEAM (ADR 0153). rask installs no Ray: no operator, no RayCluster, no RayService. It
  # names the engine's address, the token its Ray clients present, and the engine identity its doors
  # trust; how the engine runs Ray is the engine owner's. In development the kuberay-operator and
  # ray-cluster fixtures provide one (deploy/fixtures, not for production).
  # -- rask talks to a Ray engine: the NetworkPolicy admits the pods KubeRay marks `ray.io/is-ray-node`, and the Collector scrapes them.
  enabled: true
  # THE ONE RAY PLANE ([[CP-041]]): every Ray consumer renders its address from `rask.rayDashboardUrl`
  # — the annotator's Serve discovery and the zones' Serve origin. The compute fixture (deploy/fixtures/compute) is
  # given the same address as its own value.
  # -- Address of the engine's Ray dashboard, used verbatim by every Ray consumer; the ray-cluster fixture serves http://rask-ray-head-svc:8265.
  dashboardUrl: ""
  # Ray token auth (RAY_AUTH_MODE=token). The token is the store's `ray-auth-token`, written by ESO into
  # `<release>-ray-auth-token` (the dev OpenBao generates it in-cluster), never a value. The compute fixture
  # presents it (its `rayAuth`); the engine enforces the same Secret (the ray-cluster fixture's
  # `authSecretName`, KubeRay's authOptions).
  auth:
    # -- Renders `<release>-ray-auth-token` for the Ray engine and the compute fixture; the engine must enforce the same one. Off for dev.
    enabled: false


ingress:
  # -- Renders the Ingress publishing `/` and `/api`. Only one release per cluster may hold a host-less Ingress.
  enabled: true
  # -- IngressClass name. Empty uses the cluster default (Traefik on k3s).
  className: ""    # k3s default Traefik
  # Empty host => catch-all: reachable on the node IP or a VS Code / ssh -L
  # forwarded localhost with no Host header or /etc/hosts entry. Set a hostname
  # (e.g. rask.local) for host-based routing in shared/prod environments.
  #
  # A HOST-LESS INGRESS IS A CLUSTER-WIDE CLAIM ON `/` AND `/api`, not a namespaced one. Install
  # this chart a SECOND time anywhere in the cluster with `ingress.enabled` still true and the two
  # releases become rival host-less claims on the same bare paths; the ingress controller picks
  # between them arbitrarily and the loser's estate simply stops answering. Observed 2026-08-04: a
  # lane deploy into its own namespace took `/`, `/projects` and `/settings` away from the real
  # estate, which then answered the LANE gateway's `{"detail":"Not Found"}` while every pod in both
  # namespaces was healthy. Nothing looks broken; the routing just moved.
  #
  # So: exactly ONE release per cluster may carry a host-less ingress. Any additional install —
  # a slice, a lane, a preview — must either set a distinct `ingress.host` or, if it is reached
  # in-cluster and needs no edge at all, `--set ingress.enabled=false`.
  # -- Hostname the Ingress routes. Empty is a cluster-wide catch-all on `/` and `/api`.
  host: ""
  # Keyed defaults, so an operator's own annotations still merge (and can override these).
  #
  # SvelteKit emits one `Link: <…>; rel=modulepreload` entry per module of the entry graph, so a
  # chart-heavy zone (models pulls layerchart) sends a ~4 KB response header. nginx's DEFAULT
  # proxy buffer is 4 KB and it answers "upstream sent too big header" with a 502 — the models
  # zone was unreachable through the edge while its pod served 200s (found live 2026-07-24).
  # 16 KB fits the largest zone with headroom; harmless for the others.
  #
  # proxy-read-timeout is what keeps a live query alive. ingress-nginx defaults to 60s, and it counts
  # from the last byte READ FROM the upstream, not from the last request — so a `query.live` generator
  # that yields only when its data changes (the correct discipline) is severed by the edge after 60
  # idle seconds. SvelteKit's SSE transport sends no keepalive of its own (kit 2.70.1
  # runtime/server/remote.js has exactly one enqueue, the payload), so nothing refreshes that clock
  # from the app side. The client then reconnects and re-runs the generator from scratch, which is
  # strictly worse than polling. 3600s lets a stream idle for an hour; a genuinely dead upstream is
  # still reaped, just on a timescale that matches a human session. proxy-send-timeout moves with it —
  # the two are one setting in practice, and leaving the send side at 60s reaps the same connection
  # from the other end.
  # -- Annotations merged onto the Ingress; defaults raise nginx proxy buffers to 16k, read/send timeouts to 3600 s and the body cap to 64m.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # proxy-body-size is load-bearing for the same reason proxy-read-timeout is: the DEFAULT is
    # wrong for this estate. ingress-nginx caps a request body at 1m, and every image surface here
    # is bigger than that — the inference playground's 2.2 MB page image was refused 413 at the
    # INGRESS, before the zone server (whose own guard allows 25 MB) ever saw it, so the failure
    # read as "inference is broken" rather than "the edge has a 1 MB cap". Also covers the
    # annotator's Arrow import and the medallion's multi-image batch posts.
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  # -- List of Ingress TLS entries ({secretName, hosts}). Empty serves plain HTTP.
  tls: []          # e.g. [{ secretName: rask-tls, hosts: ["rask.example.com"] }]

# ==== cluster infra foundation (subchart dependencies, Chart.yaml) ==========
# One `helm install` brings these up alongside the app. Turn off for a prod
# install that uses externally-managed infra. Subchart value overrides live
# under the same key as the toggle.
# === NATS — JetStream backs the Dapr pubsub.jetstream components ===================================
# The event fabric (lineage publish, the catalog control broadcast, the maintenance work queues, the DLQ
# streams) is the chart's default-on data plane and every one of those hops is a Dapr pubsub.jetstream
# publish. templates/nats-stream-job.yaml provisions the streams on the bus `nats.url` names (Dapr does
# not auto-create them).
nats:
  # NATS JetStream is a PREREQUISITE (ADR 0153): the platform runs the bus, and rask never installs a server. The chart
  # carries what is rask's: the address it dials, the stream definitions (the stream Job), and the bus users below.
  # Development gets a three-node bus from deploy/fixtures/nats, at `nats://rask-nats:4222` (deploy/values-local.yaml).
  # -- NATS JetStream address every pub/sub component and the stream Job connect to (e.g. nats://nats.internal:4222). Required: empty fails the render.
  url: ""
  # -- HTTP monitoring endpoint of the bus (varz/jsz) the lakehouse zone's ops view reads (e.g. http://rask-nats-headless:8222). Empty hides the panel.
  monitorUrl: ""
  # Raft replication for every provisioned stream. A streamReplicas above the bus's node count makes `nats stream add`
  # fail outright rather than degrade.
  # -- Raft replica count for every stream the stream Job provisions; must not exceed the bus's node count.
  streamReplicas: 3
  # === Bus authentication ([[XC-078]] slice 2): every client connects as its own NATS user =========================
  # OPERATOR MODE IS THE ONLY SHAPE DAPR CAN USE. Dapr 1.18.1's pubsub.jetstream authenticates with a user JWT plus the NKEY
  # seed that signs the server's nonce, a TLS client pair, or one shared token that names nobody, and with jwt or seedKey empty
  # its Init falls through to an unauthenticated connect without a word. So the server runs in operator mode: one operator,
  # a SYS account, and one APP account that holds JetStream and every user below, verified by the MEMORY resolver against the
  # account key, so issuing or re-issuing a user never touches the server.
  #
  # THE TABLE (`users`) IS THE ONE DECLARATION: one user per Dapr app-id that holds a pubsub.jetstream Component, plus `admin`
  # (the stream Job) and `monitor` (nats-box, read-only). The dev seed issues exactly these permissions, every app's deny list
  # hides every user's secret, the components name them, and the attestation below lists them. The rules, from the
  # components and the call sites, measured on nats-server 2.14.2 with protocol tracing on 2026-10-04:
  #   - a publisher may publish its topics and receive on _INBOX.>, where the publish acknowledgement arrives;
  #   - a subscriber on stream S through durable D also requests $JS.API.STREAM.NAMES (no component sets streamName),
  #     $JS.API.CONSUMER.INFO.S.D and $JS.API.CONSUMER.CREATE.S.D.> (the create and the bind's lookup), and acknowledges on
  #     $JS.ACK.S.D.>. The server sends the v1 ack subject `$JS.ACK.<stream>.<consumer>.<delivered>.<sseq>.<cseq>.<ts>.<pending>`
  #     (measured, and FeatureFlagJsAckFormatV2 is false at v2.14.2), so a v2 pattern refuses every ack and every message
  #     redelivers to the DLQ; a server upgrade that flips the flag changes these rows. A consumer the server names (the
  #     catalog's ephemeral broadcast) acknowledges on $JS.ACK.S.>;
  #   - a sidecar parks a dead letter through the component the delivery came on, so a subscriber publishes its own dlq.<app>;
  #   - only admin (the stream Job's own command set, measured) creates a stream or deletes
  #     a consumer, no app holds $JS.API.>, and monitor reads stream and consumer state but no message and publishes nothing.
  # catalog.control.v1 is published by the catalog, by maintenance under maintenance.controlEmit, and by the annotator under
  # explorer.controlEmit. A grant that only a flag's component uses sits under
  # `flagged`, keyed by that flag's value path, and is issued only while the flag is on (lance.natsTable), so with every flag
  # at its default no user holds a grant no call site uses (the broker lane fails a table broader than its call sites). A
  # user's publish and subscribe lists must not be empty: nsc issues an empty list as unrestricted. A missing allowance fails closed and silently (a refused subscribe retries forever while the pod stays
  # Ready), so a changed component, durable or topic changes this table in the same commit: tests/unit/test_a_dapr_component_
  # names_a_secret_something_can_resolve.py fails a render whose components or configured topics a user does not cover.
  #
  # EACH COMPONENT IS ONE APP'S CONNECTION. A component two apps shared gave both the same credential, so the publish-only
  # half of each is its own component: the catalog enqueues on `<maintenance.workPubsub>-<catalog>` and
  # `<maintenance.indexPubsub>-<catalog>`, maintenance and the annotator announce on `<pubsub.controlName>-<app>`, and
  # maintenance publishes its lineage on `lineage-pubsub-maintenance` even with no queue lane.
  #
  # THE DEV MINT (openbao.yaml; owner ruling R1: the NATS fixture and the bundled OpenBao are dev stand-ins, and their
  # durability across a stand-in's loss is not a goal). The dev store is the fixture bus's issuer, and grants ESO read on
  # `nats-server`, `nats-route` and `nats-user-monitor`, which the fixture's ExternalSecrets write into its config. The `mint` init container copies nsc and nk out of nats-box; the seed carries the trust root
  # (`nats-root`: the operator and account keys nsc keeps, never a user's) and the route credential (`nats-route`: user,
  # password) from the store behind the Service, else mints them, then issues every user of the table afresh under that root
  # and writes `nats-user-<user>` (jwt, seed) and `nats-server` (operator, system_account, resolver_preload: public) before the
  # readiness key. A root it cannot read or use stops the seed, because a store that is Ready without its users hands every
  # sidecar an empty credential. A surge rollout therefore keeps the root the server trusts; a replacement with no outgoing pod
  # mints a new one, which a server in operator mode refuses until its pods restart onto the new `nats-server` (a reload cannot
  # change the operator or the system account), and that restart starts an empty JetStream. A user's earlier JWT stays valid until
  # the root changes (no expiry, no revocation list), and a sidecar takes a re-issued one when it restarts.
  # The APP account's JetStream disk is unlimited and memory 0: each server's max_file_store (1Gi) is the bound, as it is for
  # the global account today. An account limit counts every replica (measured: an R3 stream reserving 400MB is refused under a
  # 1G limit), so a 1Gi limit would hold a third of what the disks do.
  #
  # PRODUCTION (R1): the platform runs NATS and its store; rask names the credentials and owns no trust root. A store this chart
  # does not seed (openbao.devMode=false or openbao.externalAddr) fails the render until `provisioned` attests that every
  # `nats-user-<user>` exists, issued by the bus's operator with this table's permissions.
  #
  # THE SERVER'S MODE is the bus's setting, not rask's: off, a server takes anyone and ignores a presented credential, so every
  # client carries its credential either way. The dev fixture's operator mode (deploy/fixtures/nats, `nats.auth.server`) reads
  # the server config and the route credential from this chart's dev store.
  #
  # RESIDUALS, named: _INBOX.> is shared within the APP account (a client could read another's replies; Dapr exposes no inbox
  # prefix); the catalog's ack on CATALOG_CONTROL is stream-wide, because its broadcast consumer's name is the server's, so a
  # compromised catalog could ack or terminate notifications' control deliveries (a lesser power than the
  # one it already holds: it signs every control event; ackPolicy none does not stop daprd 1.18.1 acking, measured);
  # 8222 monitoring is unauthenticated by design; and anything holding OpenBao's dev root token reads the store (XC-079).
  auth:
    # -- Attests the platform store holds every `nats-user-<user>`; required when the store is not the chart's dev OpenBao.
    provisioned: false
    # -- Extra user grants keyed by a values flag path, merged into `nats.auth.users` only while that flag is true (lance.natsTable).
    flagged:
      maintenance.controlEmit:
        maintenance:
          publish: [catalog.control.v1]
      explorer.controlEmit:
        annotator:
          publish: [catalog.control.v1]
          subscribe: [_INBOX.>]
    # -- The bus user table, one user per Dapr app-id plus admin and monitor, each with publish and subscribe subject lists (never empty).
    users:
      admin:
        publish: [$JS.API.INFO, $JS.API.STREAM.LIST, $JS.API.STREAM.NAMES, $JS.API.STREAM.INFO.*, $JS.API.STREAM.CREATE.*, $JS.API.CONSUMER.NAMES.*, $JS.API.CONSUMER.INFO.*.*, $JS.API.CONSUMER.CREATE.*.>, $JS.API.CONSUMER.DELETE.*.*]
        subscribe: [_INBOX.>]
      catalog:
        publish:
          - lineage.events.v1
          - catalog.control.v1
          - maintenance.work.v1
          - maintenance.index.v1
          - $JS.API.STREAM.NAMES
          - $JS.API.CONSUMER.CREATE.CATALOG_CONTROL # the ephemeral broadcast every replica holds
          - $JS.API.CONSUMER.INFO.CATALOG_CONTROL.*
          - $JS.ACK.CATALOG_CONTROL.>
        subscribe: [_INBOX.>]
      lineage:
        publish:
          - lineage.events.v1 # recovered signed bytes, republished
          - dlq.lineage.events
          - $JS.API.STREAM.NAMES
          - $JS.API.CONSUMER.INFO.LINEAGE.lineage-durable
          - $JS.API.CONSUMER.CREATE.LINEAGE.lineage-durable.>
          - $JS.ACK.LINEAGE.lineage-durable.>
          - $JS.API.CONSUMER.INFO.DLQ.lineage-dlq-durable
          - $JS.API.CONSUMER.CREATE.DLQ.lineage-dlq-durable.>
          - $JS.ACK.DLQ.lineage-dlq-durable.>
        subscribe: [_INBOX.>]
      maintenance:
        publish:
          - lineage.events.v1
          - maintenance.work.v1
          - dlq.maintenance.work
          - dlq.maintenance.index
          - $JS.API.STREAM.NAMES
          - $JS.API.CONSUMER.INFO.LINEAGE.maintenance-durable
          - $JS.API.CONSUMER.CREATE.LINEAGE.maintenance-durable.>
          - $JS.ACK.LINEAGE.maintenance-durable.>
          - $JS.API.CONSUMER.INFO.MAINTENANCE_WORK.maintenance-work-durable
          - $JS.API.CONSUMER.CREATE.MAINTENANCE_WORK.maintenance-work-durable.>
          - $JS.ACK.MAINTENANCE_WORK.maintenance-work-durable.>
          - $JS.API.CONSUMER.INFO.MAINTENANCE_INDEX.maintenance-index-durable
          - $JS.API.CONSUMER.CREATE.MAINTENANCE_INDEX.maintenance-index-durable.>
          - $JS.ACK.MAINTENANCE_INDEX.maintenance-index-durable.>
        subscribe: [_INBOX.>]
      monitor:
        publish: [$JS.API.INFO, $JS.API.STREAM.LIST, $JS.API.STREAM.NAMES, $JS.API.STREAM.INFO.*, $JS.API.CONSUMER.LIST.*, $JS.API.CONSUMER.NAMES.*, $JS.API.CONSUMER.INFO.*.*, $SYS.REQ.USER.INFO]
        subscribe: [_INBOX.>]
      notifications:
        publish:
          - dlq.notifications
          - $JS.API.STREAM.NAMES
          - $JS.API.CONSUMER.INFO.LINEAGE.notifications-durable
          - $JS.API.CONSUMER.CREATE.LINEAGE.notifications-durable.>
          - $JS.ACK.LINEAGE.notifications-durable.>
          - $JS.API.CONSUMER.INFO.CATALOG_CONTROL.notifications-control-durable
          - $JS.API.CONSUMER.CREATE.CATALOG_CONTROL.notifications-control-durable.>
          - $JS.ACK.CATALOG_CONTROL.notifications-control-durable.>
          - $JS.API.CONSUMER.INFO.DLQ.notifications-durable
          - $JS.API.CONSUMER.CREATE.DLQ.notifications-durable.>
          - $JS.ACK.DLQ.notifications-durable.>
        subscribe: [_INBOX.>]

# === Dapr — rask's Components, Configurations, Resiliency and sidecars ===========================
# The control plane (operator, sentry, placement, scheduler, sidecar injector) is a PREREQUISITE the platform runs
# once per cluster (ADR 0153), in development the deploy/fixtures/dapr release. The chart renders only rask's own
# Dapr objects and the sidecar annotations, and refuses to render with `enabled` on when the cluster does not serve
# dapr.io/v1alpha1.
dapr:
  # One switch for "rask uses Dapr". Off runs plain pods with no Components; the gateway falls back to env-URL httpx.
  # -- Use Dapr: inject a daprd sidecar into every fleet and lakehouse pod and render rask's Components, Configurations and Resiliency. Needs a Dapr control plane (dapr.io/v1alpha1); the render refuses without it.
  enabled: true
  # -- Namespace the Dapr control plane runs in; the Collector scrapes it and, under NetworkPolicy, every pod may reach it.
  controlPlaneNamespace: dapr-system
  # WORKFLOW STATE RETENTION — the only thing that collects workflow history.
  #
  # Dapr's own CRD: "If not set, workflow instances will not be automatically purged." Nothing else
  # in this estate purges them, and nothing can: `DaprWorkflowClient` has `purge_workflow(id)` but no
  # list-instances API, so no sweep can name the instances to purge. Measured live 2026-08-10, before
  # this landed: 1367 rows in `daprstate` for one app's workflows, `count(expiredate) = 0`, oldest
  # 2026-08-03 — every instance since that app's first deploy, on a store with no TTL, no sweep and no
  # alert.
  #
  # PER-TERMINAL-STATE, because the states are not worth the same:
  #   · `completed` — short. A successful run's history is a cache of a fact stored durably elsewhere:
  #     the lineage event IS the record (docs/adr/0023-workflow-history-has-no-browser-surface-the-alert-is-the.md), so once it has landed the history answers
  #     nothing lineage does not. 7 days is a comfortable margin over the reconciler's own windows.
  #   · `failed` / `terminated` — long. This is the post-mortem, and "why did that run die" is a
  #     question asked days later, usually after someone notices downstream. 30 days.
  # `anyTerminal` is deliberately unset: setting it alongside these would be a second, blunter rule
  # governing the same objects.
  #
  # Turning this off returns the estate to unbounded growth — it is a flag so a deployment that wants
  # forensic retention can opt out knowingly, not so it can be forgotten.
  workflowRetention:
    # -- Render a Dapr workflow `stateRetentionPolicy`, the only thing that purges workflow history; false means history grows unbounded.
    enabled: true
    # -- How long a completed workflow's history is kept, as a positive h or m duration of at least 1h; default 168h (7 days).
    completed: "168h"
    # -- How long a failed workflow's history is kept for post-mortems, as a positive h or m duration of at least 1h; default 720h.
    failed: "720h"
    # -- How long a terminated workflow's history is kept, as a positive h or m duration of at least 1h; default 720h (30 days).
    terminated: "720h"
  # -- daprd sidecar log level, stamped as the `dapr.io/log-level` annotation (debug, info, warn, error).
  logLevel: "info"
  # Max request body size for Dapr service invocation. Dapr defaults to 4Mi,
  # which rejects multi-image uploads proxied over the gateway's sidecar. Raise it
  # to fit real batches.
  # -- Max request body for Dapr service invocation (`dapr.io/max-body-size`); Dapr's own default is 4Mi.
  maxBodySize: "32Mi"
  # PodSecurity `restricted` compliance for the injected daprd sidecar. OFF by default (prod posture, like
  # networkPolicy.enabled). Our app containers are already `restricted`-clean (lance.securityContext:
  # runAsNonRoot + drop:[ALL] + RuntimeDefault); the sidecar is the remaining gap. Turning this on adds the
  # RuntimeDefault seccomp annotation; the control plane's injector MUST ALSO drop all capabilities
  # (`dapr_sidecar_injector.sidecarDropALLCapabilities`, a prerequisite setting this chart cannot reach).
  # NOTE full-namespace `restricted` ENFORCE is still blocked by the OTel Collector (a single Deployment
  # whose filelog receiver needs hostPath /var/log/pods — `restricted` forbids it, no value fixes it):
  # give the Collector its own namespace at `baseline`, or a ServiceAccount PSA exemption.
  # -- Add the RuntimeDefault seccomp annotation to daprd for PodSecurity `restricted`; also set the injector's `sidecarDropALLCapabilities`.
  sidecarRestricted: false
  # Bound every DaprClient gRPC call (publish_event has no per-call timeout arg, and the SDK's default
  # deadline is unset) so a wedged sidecar can't hang a publisher indefinitely — a timeout surfaces as a
  # publish failure the caller handles instead of a stuck request.
  # -- Deadline in seconds for every DaprClient gRPC call (DAPR_API_TIMEOUT_SECONDS), so a wedged sidecar fails a publish instead of hanging it.
  apiTimeoutSeconds: 30
  # The Dapr app-API token is not a value: it is the store's `dapr-app-token`, written by ESO into
  # `<release>-dapr-app-token` for the injector (templates/external-secrets.yaml). Dapr stamps it as
  # `dapr-api-token` on every delivery, so the sidecar-delivered routes reject a forged request.
  # Dapr-native retry + dead-letter layer — DEFAULT ON (Dapr-first rule). Wires THREE things TOGETHER
  # (they are only correct as a set — a deadLetterTopic without a retry policy dead-letters on the FIRST
  # failure per Dapr's documented default):
  #   1. a Resiliency CRD: the SIDECAR owns delivery retries (constant 120s x 4 = 480s over 5 attempts,
  #      deterministic), scoped to the subscriber apps. The policy MUST be `constant`: the Resiliency
  #      CRD declares no `initialInterval`, so an `exponential` one is pinned to cenkalti/backoff's
  #      500ms default and gives ~4s no matter what `duration` sits beside it (measured 2026-09-14);
  #   2. deadLetterTopic on every subscription (via the *_DLQ_TOPIC envs): retry exhaustion PARKS the
  #      message on a per-app dlq.* topic (the DLQ stream, nats-stream-job) — ERROR-logged by the
  #      app's /dlq-event route — instead of silently ceasing to redeliver;
  #   3. the broker backOff moves to a long crash-recovery window (first step > the sidecar's total
  #      retry span) so broker redelivery no longer races the sidecar's in-flight retries — it now
  #      covers ONLY sidecar/pod death mid-delivery.
  # The durable-consumer question is ANSWERED FROM SOURCE (components-contrib jetstream.go: durableName
  # is applied as-is per subscription, and NATS scopes consumer names PER STREAM — the dlq.* topics live
  # on their own DLQ stream). Set false to restore broker-only behavior (30-300s backOff, no DLQ).
  resiliency:
    # -- Render the Dapr Resiliency policy (sidecar retries, constant 120s x 4), per-app dead-letter topics, and the long broker backOff; false = broker-only.
    enabled: true
  # The Dapr dashboard — a web UI for the Dapr stuff (components, subscriptions, configurations,
  # control plane).
  dashboard:
    # -- Deploy the Dapr dashboard web UI (templates/dapr-dashboard.yaml), reached by port-forward; requires `dapr.enabled`.
    enabled: true
    # -- Container image for the Dapr dashboard Deployment.
    image: daprio/dashboard:0.15.0
  # daprd sidecar resources (first-party keys → the lance.daprSidecarResources annotations). The app
  # containers are bounded (resources.default); an unbounded daprd on every sidecar'd pod is not.
  sidecarResources:
    # -- CPU request for every injected daprd sidecar (`dapr.io/sidecar-cpu-request`).
    cpuRequest: 50m
    # -- CPU limit for every injected daprd sidecar (`dapr.io/sidecar-cpu-limit`).
    cpuLimit: 300m
    # -- Memory request for every injected daprd sidecar (`dapr.io/sidecar-memory-request`).
    memoryRequest: 64Mi
    # -- Memory limit for every injected daprd sidecar (`dapr.io/sidecar-memory-limit`).
    memoryLimit: 256Mi

# === OpenFGA (subchart) — Zanzibar authz. lance-ns's values REPLACE rask's `engine: memory`: the
# datastore is the AGE Postgres (it's just postgres), so grants survive a restart. -----------------
openfga:
  # -- Install the OpenFGA authorization server subchart, plus rask's migrate Job, authn subject ConfigMap and PodDisruptionBudget for it.
  enabled: true
  # -- Subchart passthrough: number of OpenFGA server replicas.
  replicaCount: 1

  # TELEMETRY ([[XC-047]]). Metrics come from the Collector's `openfga` scrape job and are the
  # STANDING signal. Tracing is a DEBUGGING tool here and is OFF by default, which is a measured
  # decision rather than timidity.
  #
  # MEASURED 2026-09-20, AND THE FIRST ATTEMPT AT THIS GOT IT WRONG. Sizing the ratio off the request
  # rate (9.4/s) says 0.05 is modest. It is not: OpenFGA emits a span PER GRAPH EDGE and PER DATASTORE
  # READ, not per request — `ResolveEdge` 102k, `sqlcommon.fetchBuffer` 74k, `postgres.read` 41k in one
  # ten-minute window — so a single traced Check is roughly 1,900 spans. At ratio 0.05 this component
  # produced **532,192 spans in ten minutes, 25x the whole rest of the estate combined** (lineage 21.9k,
  # catalog 20.2k, maintenance 5.6k, notifications 494, medallion 343). That is the `ray_data_*`
  # firehose again, one signal over, and it was created and reverted within the hour.
  #
  # So: enable it deliberately while diagnosing a slow Check, and pick the ratio against SPANS. A ratio
  # of 0.001 lands near 18 spans/s — comparable to the catalog's own share — and still traces one Check
  # every ~100 s, which is enough to see the shape of a resolution.
  #
  # TO THE COLLECTOR, not to the store: the Collector's `otlphttp/traces` exporter adds
  # `observability.export.traceHeaders`, a store's INGESTION requirement rather than an OTLP one, so
  # OpenFGA speaks plain OTLP and the header is added downstream — which is the point of the
  # Collector being the single seam.
  # -- Subchart passthrough: OpenFGA OTLP tracing to the OTel Collector; off by default, ratio 0.001 because each Check emits ~1,900 spans.
  telemetry:
    trace:
      enabled: false
      otlp:
        # LITERAL, because Helm does not template values.yaml — a subchart's values are data, not a
        # template. The estate already names in-cluster services this way (`http://rask-lineage:8000`).
        endpoint: "rask-otel-collector:4317"
      # A NUMBER, not a string: the subchart's schema types this `null or number` and a quoted value
      # fails the render outright — the good failure, caught before deploy.
      sampleRatio: 0.001

  # MEMORY BOUND (#139). Every workload below ran with NO `limits.memory`, which does not mean
  # "unbounded and fine" — it means the container can never be OOMKilled by its OWN cgroup, so it
  # grows until the NODE is under pressure and the kernel picks a victim by badness score. The pod
  # that dies is very often NOT the pod that caused it, and the victim just gets SIGKILL with nothing
  # in its own logs or events. That failure mode presents exactly as "a service crashed randomly for
  # no reason". Requests are set too: without them the scheduler cannot reason about the node's real
  # commitment, which is a second route to surprise evictions.
  #
  # RAISED TO 2Gi 2026-09-06. 512Mi was set against a much smaller store and OOMKilled the estate's
  # authorization backend NINETY-ONE times (`exitCode 137`, measured on the live pod). The blast radius
  # is everything: `service_kit.governed` fails CLOSED, so a governed service does not start at all
  # — `ClientConnectorError: Cannot connect to host rask-openfga:8080`, CrashLoopBackOff, 11 restarts —
  # for as long as OpenFGA is down.
  #
  # WHAT DRIVES THE MEMORY is visible in its own request log: a periodic reader issuing ONE `Check`
  # per table across every warehouse the registry knows, and this estate holds ~90. That is a normal
  # governed read pattern, not an abuse — the store
  # simply outgrew the ceiling. Requests go 128Mi -> 512Mi so the scheduler reserves something near the
  # real working set rather than a floor the process leaves on its first Check storm.
  # -- Subchart passthrough: CPU and memory requests/limits for the OpenFGA server.
  resources:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { memory: 2Gi }
  # v1.18.3 (2026-08-05), moved off the long-standing v1.8.0 pin. Server + our migrate Job use the
  # SAME tag (templates/openfga-migrate.yaml) so the migrated schema always matches the binary.
  #
  # WHY: weighted-graph resolution. OpenFGA is moving Check/ListObjects/Expand/ListUsers onto it and
  # will REMOVE the legacy fallback (openfga.dev blog 2026-07-21). Our model was audited against all
  # five incompatibility classes and is compatible — OPEN-WORK.md §J — so this upgrade is safe from
  # the MODEL side; nothing to migrate there. (Weighted-graph Check is still experimental behind a
  # flag in 1.18.x, so this buys readiness, not new behaviour.)
  #
  # THE MIGRATION HISTORY, kept because the old comment's diagnosis was WRONG and someone will
  # otherwise re-derive it: the blocker was never "v1.18.0 migration 006" — v1.18.0's migration 008
  # is MySQL-only. What this upgrade crosses is v1.10.0's `!!REQUIRES MIGRATION!!` COLLATION
  # migration (openfga#2661), which rewrites indexes for sort order; that is where the observed
  # `DROP INDEX CONCURRENTLY` came from, and Postgres refuses that statement inside a transaction
  # block.
  #
  # WHY IT IS NOT A BLOCKER HERE: the estate's stated posture is that RESEEDING THE FGA STORE IS
  # ACCEPTABLE (owner ruling 2026-08-08 — the tuples are re-seedable from `scripts/fga_seed_*` and
  # the model is version-controlled), so we do not need an in-place collation migration to succeed.
  # On a fresh/reseeded database the migrations run 001..N from scratch and the question does not
  # arise. If an in-place upgrade of a data-bearing store is ever wanted instead, THAT is when the
  # collation migration has to be proven first.
  #
  # If the migrate Job does fail: it never completes (backoffLimit 30), the server never becomes
  # Ready against an unmigrated schema, `helm upgrade --wait` times out and leaves the release in
  # `pending-upgrade` (refusing later upgrades until `helm rollback rask <rev>` — CLAUDE.md). The
  # answer then is to drop and recreate the openfga database rather than to revert the tag.
  image:
    # -- OpenFGA image tag for the subchart server and for rask's own migrate Job (templates/openfga-migrate.yaml), so schema and binary match.
    tag: v1.18.3
  # THE FEATURE this upgrade is for. `weighted_graph_check` puts Check on the weighted-graph
  # algorithm now instead of waiting for it to become the default — OpenFGA is moving every query
  # endpoint onto it and will remove the legacy fallback (openfga.dev, 2026-07-21). Turning it on is
  # safe for us specifically: the model was audited against all five incompatibility classes and is
  # clean (OPEN-WORK.md §J) — no `and`/`but not` anywhere, every multi-type TTU resolves on every
  # allowed parent type, and no check call passes a userset/wildcard subject outside the catalog's
  # access simulator. Incompatible models silently FALL BACK to the legacy algorithm rather than
  # breaking, and 1.18.x logs a diagnostic when v2 would differ from v1 — so the flag is also the
  # cheapest way to find out we are wrong.
  #
  # NOT set here, deliberately: `pipeline_list_objects` is already the DEFAULT since v1.11.6, and
  # `datastore_throttling` changes behaviour under load on a Postgres THREE consumers share — decide
  # that one against measurements, not by switching it on blind.
  #
  # WHY AN ENV VAR AND NOT `experimentals:` — 0.3.9's values.schema.json ENUMERATES the four flags it
  # knew about and `weighted_graph_check` post-dates it, so `experimentals: [weighted_graph_check]`
  # fails schema validation before a single template renders. That is not a helm-4 quirk: `helm lint
  # chart` and `helm template chart` both die on it under the CI-pinned 3.16.4 as well. `extraEnvVars`
  # carries no enum, the subchart appends it verbatim to the server container's env, and
  # OPENFGA_EXPERIMENTALS is the EXACT variable `experimentals:` renders (deployment.yaml, `join ","`)
  # — so the binary is configured identically. It also reaches the subchart's bundled migrate
  # container, which is inert here: datastore.applyMigrations is false and templates/openfga-migrate.yaml
  # owns migration instead. Move this back to `experimentals:` when the subchart reaches a version whose
  # enum lists the flag; that bump is blocked on Chart.lock (see chart/Chart.yaml under openfga).
  #
  # THE ISSUER ALIAS rides here because the subchart has no value for it. A token's `iss` is the cluster
  # issuer while OpenFGA fetches keys from the mirror (`authn.oidc.issuer` below), and OpenFGA accepts an
  # `iss` equal to the issuer or to any alias (oidc.go `Authenticate`).
  #
  # THE SUBJECT ALLOW-LIST, read from the ConfigMap templates/openfga-authn.yaml renders from
  # `lance.openfgaSubjects`: every ServiceAccount whose pod renders `lance.fgaToken`, as
  # `system:serviceaccount:<release namespace>:<sa>`. Without it any pod in ANY namespace of the cluster that
  # projects the audience is admitted (oidc.go checks `sub` only when the list is non-empty), and a
  # ServiceAccount name is namespace-scoped, so the list shuts every other namespace out and, inside this
  # one, every account that is not an FGA client. A list-valued OPENFGA_* env is COMMA-joined: measured
  # 2026-10-05 on openfga v1.18.3 run through Dagger, a comma-joined subjects env admitted both listed
  # accounts and refused the unlisted ones, while a space-joined one refused all of them.
  # A change to the client set reaches OpenFGA when its pods restart (env from a ConfigMap is read at
  # start); until then a new client is refused, never an old one admitted.
  # -- Subchart passthrough env: OPENFGA_EXPERIMENTALS=weighted_graph_check, the OIDC issuer alias, and the subject allow-list from `rask-openfga-authn`.
  extraEnvVars:
    - name: OPENFGA_EXPERIMENTALS
      value: weighted_graph_check
    - name: OPENFGA_AUTHN_OIDC_ISSUER_ALIASES
      value: *serviceAccountIssuer
    - name: OPENFGA_AUTHN_OIDC_SUBJECTS
      valueFrom: { configMapKeyRef: { name: rask-openfga-authn, key: subjects } }
  # AUTHENTICATED ([[XC-077]]). With no authn the API answered any pod with no credential, so Ray workload
  # code could write `estate#admin` for itself or replace the model with no rask audit record. Lakekeeper
  # authenticates to its OpenFGA as a client of an OIDC provider (crates/authz-openfga/src/config.rs, client
  # credentials or an API key, refusing a half-configured pair); rask's provider is the cluster
  # ServiceAccount issuer (D1), so a client presents its pod's projected token and holds no secret at all.
  # A preshared key would be a secret in a value or an env, which the secrets rule forbids.
  #
  # Each FGA client projects a 600 s token for the audience `rask-openfga` (`lance.fgaToken`, the
  # `lance.openfgaAudience` this must equal; templates/openfga-authn.yaml refuses a render where they
  # differ) and re-reads it on every request (`service_kit.governed.fga.client_configuration`). OpenFGA
  # admits a token only with that audience AND a subject on the allow-list above, so a Ray worker, a pod in
  # another namespace, or an in-namespace pod running as a non-client account is refused. The exclusive
  # NetworkPolicy ingress for OpenFGA, the row's other half, waits on XC-009 and is not rendered here.
  #
  # `issuer` is rendered by the subchart's tpl, so the release name follows the install.
  authn:
    # -- Subchart passthrough: OpenFGA API authentication method; `oidc` admits only projected ServiceAccount tokens.
    method: oidc
    oidc:
      # -- Subchart passthrough (tpl-rendered): the OIDC issuer OpenFGA fetches keys from, the release's ServiceAccount issuer mirror.
      issuer: "http://{{ .Release.Name }}-issuer-mirror:8080"
      # -- Token audience OpenFGA requires; templates/openfga-authn.yaml refuses a render unless it equals `lance.openfgaAudience` (rask-openfga).
      audience: rask-openfga
  # OFF: the playground is a browser UI that only runs with authn `none` (cmd/run/run.go
  # `runPlaygroundServer` refuses any other method), and OpenFGA has deprecated it.
  playground:
    # -- Subchart passthrough: the OpenFGA browser playground; off, since it only runs with authn `none`.
    enabled: false
  # NO BROWSER CALLS OpenFGA: the zones reach it only through the services. CORS stays closed by naming
  # one origin under the reserved `.invalid` TLD (RFC 2606), which no page can have; an empty list is not
  # closed, because rs/cors reads an empty AllowedOrigins as `*`, and the subchart default is `*`.
  # -- Subchart passthrough: CORS for the OpenFGA HTTP API, closed by allowing only the unreachable origin `https://openfga.invalid`.
  http:
    corsAllowedOrigins: ["https://openfga.invalid"]
    corsAllowedHeaders: ["Authorization"]
  # -- Subchart passthrough: Postgres datastore on the AGE server, DSN from `rask-infra-credentials`, bundled migrations off (rask's Job migrates), pool 30 open/10 idle.
  datastore:
    engine: postgres
    # DSN comes from the infra-credentials Secret (key openfga-datastore-uri) — the SAME secret the AGE
    # servers + our migrate Job consume, written by the external-secrets operator from the
    # store's `postgres-password`. No plaintext password in values/env: the subchart's
    # existingSecret+secretKeys branch turns this into a secretKeyRef. (Subchart values can't template,
    # so the release-prefixed secret name is hardcoded — it is `<release>-infra-credentials`, and the
    # release is `rask`.)
    existingSecret: rask-infra-credentials
    secretKeys:
      uriKey: openfga-datastore-uri
    # The chart's bundled migrate (both job + initContainer types) failed to pass the datastore flags in
    # 0.3.9, so we disable it and run our own proven migrate Job (templates/openfga-migrate.yaml) that
    # waits for the AGE Postgres first. The server then connects to the already-migrated db. KEPT on the
    # 0.3.12 bump on purpose — our Job also carries the NetworkPolicy component label and the wait-age
    # init that the bundled one has no equivalent for, so re-testing the bundled path is its own change,
    # not a side effect of a version bump.
    applyMigrations: false
    waitForMigrations: false
    # THE SHARE OF A SHARED SERVER, declared rather than inherited ([[XC-016]]). `rask-age` serves the
    # lineage graph AND openfga AND Dapr's state store from one Postgres running the stock
    # `max_connections=100` — the chart overrides nothing — and none of the three consumers bounded its
    # own pool, so the estate's budget was three driver defaults adding up.
    #
    # MEASURED 2026-09-23, twelve samples over 2.5 minutes spanning a maintenance sweep tick: openfga
    # held **28 connections, all idle, 0 active, every sample**; estate-wide 49 of 100 (openfga 28,
    # daprstate 10, lineage 5, admin 1). So there is no contention here, and RAISING the pool — which
    # this row originally proposed — would buy nothing. What is real is that one component holds 28% of
    # a shared budget because pgxpool's default ceiling is 30 and nobody chose it.
    #
    # 30 keeps the ceiling that has never been approached, now as a decision.
    #
    # `maxIdleConns: 10` DOES NOT REDUCE WHAT IS HELD, measured after deploying it: the pod carries
    # both variables and the pool sits at 30 idle, stable across six samples over 90s — it grew from
    # 28 to its new explicit ceiling rather than shrinking to 10. So this pair bounds the pool and does
    # not return budget; reaping idle connections needs `connMaxIdleTime`, which the 0.3.12 schema also
    # exposes and which nothing here has measured. It is left unset rather than guessed at.
    #
    # `tests/unit/test_the_shared_postgres_budget_is_declared.py` holds the arithmetic — this ceiling
    # plus what the others hold must fit inside 75% of the server — so a later "just raise it" is
    # refused by a number rather than by memory.
    maxOpenConns: 30
    maxIdleConns: 10

# === Apache AGE Postgres (first-party template) — the lineage graph store AND openfga's datastore --
# The ONLY relational store post-P7a (the rask batches/chunks CNPG Cluster is gone): CNPG's stock image
# has no AGE extension, so this is a plain StatefulSet on apache/age. See docs/CNPG-AGE.md for the
# ImageVolume path that eventually folds it into CloudNativePG.
age:
  # -- Run the in-cluster apache/age Postgres StatefulSet that serves the lineage graph, OpenFGA and the Dapr state store databases.
  enabled: true
  # PG16 THROUGHOUT, and the patch is chosen for the PLATFORM rather than for features: 1.5.0 ships
  # `linux/amd64` ONLY — read from the image's config blob, since a v2 manifest carries no top-level
  # architecture — while 1.6.0 is a manifest list carrying amd64 AND arm64 ([[XC-070]], measured
  # against the registry 2026-09-23). This StatefulSet serves BOTH the lineage graph and OpenFGA, so
  # on the older pin nothing governed comes up on an arm64 host at all.
  # -- Postgres+AGE image for the StatefulSet and the pg_dump backup job (PG16; 1.6.0 is multi-arch amd64+arm64).
  image: apache/age:release_PG16_1.6.0
  # -- Postgres user every AGE client connects as; its password is the store's `postgres-password` secret, never a value.
  user: lance
  # No password value: the AGE password is the store's `postgres-password` ([[XC-004]]).
  # -- Name of the AGE graph and database holding the OpenLineage graph.
  lineageDb: lineage
  # -- Name of the database OpenFGA uses as its datastore.
  openfgaDb: openfga
  # The Dapr state store's database (see stateStore above). Dapr owns this schema outright — it creates
  # and migrates its own tables — so it gets its own database rather than a table beside AGE's graph.
  # -- Name of the database the Dapr Postgres state store owns and migrates itself.
  stateDb: daprstate
  # -- Postgres port of the AGE store, used by every client DSN, the backup job and the network policy.
  port: 5432
  # Externalize ([[XC-132]]): with age.enabled=false every client (lineage, the in-chart OpenFGA's datastore DSN, the
  # Dapr state store, the Collector's state-store scrape, the dump) dials THIS host. user and the database names must
  # match the platform's; the password is never a value: it is the secret store's `postgres-password`, which ESO
  # delivers and the dev seed writes into its DSNs.
  # -- Postgres host lineage, OpenFGA and the Dapr state store use instead of the in-cluster AGE; the render refuses it empty with age.enabled=false.
  externalHost: "" # e.g. rask-postgres-rw (the CNPG Cluster's -rw service)
  # Effectively immutable after first install: StatefulSet volumeClaimTemplates can't be updated in
  # place, so the chart fails the upgrade if this differs from the deployed StatefulSet instead of
  # silently not resizing. To resize: patch the PVC, recreate the StatefulSet with --cascade=orphan,
  # then upgrade — see docs/runbooks/RUNBOOK-restore.md.
  # -- PVC size of the AGE StatefulSet. Immutable after install: the chart fails an upgrade that changes it (see docs/runbooks/RUNBOOK-restore.md).
  storage: 1Gi
  # === AGE-on-CNPG cutover gate (audit 2026-07-27 defect 3; docs/adr/0125-age-on-cnpg-via-imagevolume-behind-its-own-gate-merge.md) ===
  # templates/age-cluster.yaml (CNPG Cluster + ImageVolume AGE extension, docs/CNPG-AGE.md) used to
  # render UNGATED — a second 3-instance graph store with a placeholder extension image, alongside
  # this StatefulSet stack, on every render. It is now gated here and MUTUALLY EXCLUSIVE with
  # age.enabled (the template fails the render if both are on). Default OFF: the estate runs the
  # apache/age StatefulSet today, and the cutover needs a real extension image built + pushed first
  # (.docker/cnpg-age-ext.dockerfile) plus K8s 1.33+ (ImageVolume) and CNPG >= 1.27.
  cnpgCluster:
    # -- Render the AGE-on-CNPG `Cluster` (templates/age-cluster.yaml); mutually exclusive with `age.enabled`. Needs an extension image, K8s 1.33+ and the CloudNativePG operator (>= 1.27), a prerequisite: the render refuses on a cluster that does not serve postgresql.cnpg.io/v1.
    enabled: false
    # The built AGE extension image (e.g. ghcr.io/<org>/age-cnpg-ext:1.7.0-18). Deliberately NO
    # default — required() when enabled, so a REPLACE-ME placeholder can never render.
    # -- The built AGE extension image for the CNPG cluster (e.g. ghcr.io/<org>/age-cnpg-ext:1.7.0-18); required when `cnpgCluster.enabled`, no default.
    extensionImage: ""

# === Dex — the development OIDC issuer, a fixture (deploy/fixtures/dex) ===========================
dex:
  # -- This estate uses the development Dex (deploy/fixtures/dex, Service `<release>-dex`): the ingress serves it at /dex, its publisher password is seeded into the dev store, and a real deployment refuses it. The chart renders no Dex.
  enabled: true
  # -- Port of the development Dex's Service.
  port: 5556
  # -- OIDC issuer URL Dex serves and services trust (`RASK_OIDC_ISSUER`); a non-https issuer sets `RASK_OIDC_ALLOW_INSECURE=true`.
  issuer: http://rask-dex:5556/dex # in-cluster issuer (matches the OIDC config)
  # -- The development Dex's static client id; also the audience services check (`RASK_OIDC_AUDIENCE`) and the client MinIO's OIDC provider uses.
  clientId: lance-catalog
  # -- The development Dex's static client secret (demo value); seeded into OpenBao as `publisher-oidc-client-secret`.
  clientSecret: lance-catalog-secret
  # The publish saga's SERVICE ACCOUNT (dex has no client-credentials grant, so machine identity is
  # a dedicated password-grant user). The annotator mints a FRESH token per publish with it — the
  # password never rides pod env: it is seeded into OpenBao and fetched through the Dapr secret
  # store, fail-closed. The fixture holds its bcrypt hash.
  publisher:
    # -- Login email of the publish saga's service account; the annotator mints a fresh token with it per publish.
    username: publisher@rask.internal
    # -- Plain password of the publish saga's service account, seeded into OpenBao; must match the hash the development Dex holds (demo default `password`).
    password: password

# === OpenBao — the secret store the Dapr secret stores and ESO read ================================
openbao:
  # -- An in-cluster OpenBao at `<release>-openbao`: with `devMode` the development store (deploy/fixtures/openbao), whose seed runs the scripts this chart renders (`<release>-openbao-seed`); without it the sealed server this chart renders.
  enabled: true
  # -- OpenBao container image; also used by the MinIO scoped-users hook.
  image: openbao/openbao:2.2.0
  # -- Port of the OpenBao Service.
  port: 8200
  # devMode=true → in-memory, auto-unsealed, fixed root token (demo ONLY — anyone in-cluster can read
  # everything with `root`). Set devMode=false for the prod path: a sealed, file-backed server on a PVC
  # that an operator must `bao operator init` + unseal, with real auth — no fixed root token, no auto-seed.
  # -- The development store: in-memory, auto-unsealed with a fixed root token (demo only), run by the openbao fixture. False renders a sealed file-backed server an operator must init and unseal.
  devMode: true
  # -- Root token of the development store (the openbao fixture's `devToken`), which the Dapr secret store presents when `devMode` is true.
  devToken: root # dev-mode root token (devMode=true only)
  # -- PVC size of the file backend when `devMode` is false.
  storage: 1Gi # PVC size for the prod (devMode=false) file backend
  # Externalize: when set, the Dapr secret store points at THIS Vault/OpenBao address instead of the
  # in-cluster server — pair with openbao.enabled=false to use an external Vault. The apps still consume
  # via Dapr (no plaintext fallback) because secretsViaDapr keys off this too.
  # -- Address of an external Vault/OpenBao the secret stores point at instead of the in-cluster server; pair with `openbao.enabled=false`.
  externalAddr: "" # e.g. https://vault.internal:8200

# === Event signing keys ([[LH-064]]) ======================================================================
# Every identity in `lance.signingIdentities` (the catalog and maintenance) signs the lineage it emits with its own Ed25519 key, so lineage holds public keys only and cannot
# forge what it verifies. The store holds two secrets per identity, never two fields of one, because Dapr scopes a
# secret by NAME and a per-app deny list can only name a whole secret:
#   signing-public-<identity>   field `keys`  comma-separated public NKEYs, current first, at most one previous
#   signing-key-<identity>      field `seed`  the NKEY user seed, readable only by the sidecars of the identity's own app-id
# The field names stay disjoint from the fields a runtime-named reader requires (access_key, secret_key, token,
# aws_access_key_id), so a warehouse record that names signing-key-<identity> returns nothing.
#
# THE DEV OPENBAO MINTS AND CARRIES THEM (templates/openbao.yaml). A `mint` init container runs
# `nk -gen user -pubout` once per identity and leaves each candidate pair on a memory emptyDir that the openbao
# container does not mount; it prints names only and always exits 0, so a failed mint costs that one signer its key
# (the signer stays not Ready) and never the baseline seed or the `openbao-seeded` readiness key. The `seed`
# container then chooses ONE pair per identity, in this order:
#   1. the kept copy under $HOME/seed (the tmp emptyDir, where the kept signing pairs live: it outlives a restart of
#      either container and is deleted with the pod). Both files present and well-formed, else ignored.
#   2. the store behind the Service (the outgoing pod during a rollout). A private key with no public list refuses
#      the seed; a public list with no private key is a ROTATION.
#   3. the mint candidate.
# The chosen pair is persisted to the kept copy before the first write and every re-seed writes exactly it, public
# list first ("publish before use": a signer is Ready only while its kid is listed).
#
# ROTATION. `bao kv metadata delete secret/signing-key-<identity>` and roll `deploy/rask-openbao`: the seed finds the list
# but no key, takes the mint candidate and PREPENDS its public key, keeping one previous. Never a soft `bao kv delete`:
# the seed refuses the "No data found" it leaves behind and the replacement pod never becomes Ready (docs/OPERATORS.md § 6).
# Rotate at most once per 7 days: the bus keeps 168 h and a retired key must stay listed until nothing signed with it is
# left to verify.
# STORE LOSS. A replacement pod with no outgoing pod to carry from mints every identity afresh and the old public
# keys go with the old store, so an event signed before the loss is refused once enforcement is on (acked and
# counted); every signer re-resolves within 5 minutes and heals in place.
#
# THE DENY LISTS REACH A SIDECAR THROUGH THE NAME OF ITS CONFIGURATION. daprd reads its Configuration once, at boot
# (HotReload is off), and Helm applies a Deployment before the dapr.io Configuration it names, so an edit made under an
# unchanged name is loaded stale by any pod that boots in the gap, for the life of the pod, with every probe green.
# Each per-app Configuration is therefore named `lance-config-<app>-<first 10 hex of the sha256 of its spec>`
# (`lance.daprAppConfigName`; the object and the pod's `dapr.io/config` both take it from there) and no checksum
# annotation exists: the rename is what rolls exactly the pods whose list changed. A pod that boots before Helm has
# applied the renamed object names one that does not exist yet, so daprd exits and the kubelet restarts it until it
# does. Measured in the Dapr v1.18.1 source: pkg/runtime/config.go:252-254 returns the load error, and the default
# configuration at :256-260 is reached only when no --config was given; cmd/daprd/app/app.go:119-121 is a
# log.Fatalf; the operator answers a missing object with an error (pkg/operator/api/configurations.go:43-45, a gRPC
# Unknown that go-grpc-middleware v1.4.0 does not retry, retry/options.go:19, so the exit is immediate); the injector
# passes the annotation through as `--config <name>` and reads no Configuration but `daprsystem`
# (pkg/injector/patcher/sidecar_container.go:102-104, pkg/injector/service/pod_patch.go:133-148). Reference a
# Configuration through the pod's `dapr.io/config`, never by a name built from the app-id.
#
# RESIDUAL (owner, 2026-10-02): this is the Dapr-scope claim. A pod that holds OpenBao's root token or reaches :8200
# reads the store without a sidecar until XC-079.
signing:
  # LINEAGE'S SWITCH. True renders LINEAGE_SIGNERS and LINEAGE_DELEGATORS (lance.signingIdentities, lance.delegatorIdentities),
  # and only when the secret store and auth.enabled are on as well: lineage then refuses an unsigned or non-verifying event
  # before it records it. False renders neither, so lineage verifies nothing, ignores a present `rask_signature` and keeps
  # its catalog-DROP shortcut off. The bus doors have their own switch, `doors` below.
  # -- Lineage refuses unsigned or non-verifying events when the secret store and auth are also on. False renders no signer sets and lineage verifies nothing.
  enforce: true
  # THE BUS DOORS' MODE ([[XC-078]]): "off", "observe" or "enforce", always quoted, because YAML reads a bare off as false and
  # the render refuses anything but the three strings (as it refuses an unset value under `--reuse-values`).
  #
  # A door is a subscription that ACTS on what the bus delivers, so a forged event there does more than lie in the graph:
  # notifications' /lineage-events and /control-events (a named person's bell), and /maintenance-arrival (a
  # write plans compaction). maintenance registers that route on EVERY pod whose `maintenance.workTopic` is set, the planner
  # and each dedicated worker alike (register_arrival_route reads only the topic), so both Deployments carry the settings.
  #
  # Wherever the store and auth are on (where lineage can verify), each door's Deployment carries RASK_SIGNATURE_DOORS and
  # the two sets lineage verifies with, from the same helpers (one narrower set, below): RASK_EVENT_SIGNERS
  # (lance.signingIdentities) and RASK_EVENT_DELEGATORS (lance.delegatorIdentities), so a door and lineage cannot disagree
  # about who signs. The app
  # whose doors take control events (notifications) also carries RASK_CONTROL_SIGNER_ROLES, a JSON object
  # from each service that emits control events to the identities it signs as (lance.signers' `role`): catalog -> the
  # catalog, maintenance -> maintenance (its purge, under maintenance.controlEmit). The keys are
  # exactly service_kit.control_events.ControlSigner, which the services type, so a key they do not know fails their boot;
  # every key is present, and a role whose service is not deployed is an empty list. A door's per-action policy
  # (control_signer_role) resolves an action's allowed signers from it; task_* actions and grants on an annotation project
  # are exempt there, since the annotator signs nothing. Without the store or auth nothing is rendered and the doors
  # verify nothing, as lineage does.
  #
  # Notifications and both maintenance Deployments keep lineage's full sets: every signer's events reach them.
  #
  # off verifies nothing. observe acts exactly as off and counts what it would refuse
  # (<service>_signature_would_refuse_total). enforce acknowledges a refused event (never a DROP, which parks and re-parks on
  # replay), counts it (<service>_signature_refused_total) and acts on nothing; keys it cannot read are a RETRY. Independent
  # of `enforce`, which is lineage's. observe and enforce fail the render with no signer at all (the services refuse to boot
  # on an empty signer set rather than verify against it), and when a deployed control-event service has no identity: its
  # role would hold nobody, and the doors would refuse every event it signs.
  # enforce is the default: the observe soak at helm rev 267 (2026-10-04) counted no would-refuse on genuine traffic at any
  # door. observe is the mode to soak a change to who signs before enforcing it.
  # -- Mode of the bus doors' signature check: "off", "observe" (count would-refuse) or "enforce" (ack and refuse). Always quoted.
  doors: "enforce"
  # NON-DEV STORES (openbao.devMode=false, or openbao.externalAddr) MINT NOTHING, so every signer would stay not
  # Ready. The render fails until the operator attests here that signing-public-<identity> and then
  # signing-key-<identity> exist for every identity the failure names. Tooling for that, and rotation on such a
  # store, is the production runbook, which waits for a production estate (owner, no-prod parking 2026-09-21).
  # -- Attest that signing keys exist for every identity in a non-dev store; the render fails until it is true there.
  provisioned: false
  # The `mint` init container's image, the one place it is pinned. `nk` is measured working as uid 65532 with a
  # read-only root.
  # -- Image of the dev OpenBao's `mint` init container that generates each identity's NKEY pair.
  mintImage: natsio/nats-box:0.19.7

# === external-secrets.io — the PREREQUISITE every pod without a sidecar takes its credentials through.
# The External Secrets Operator is platform-run and rask never installs it (owner, 2026-10-05): install it
# on its own before the chart (docs/architecture/deployment.md § Prerequisites). A render for a cluster
# that does not serve external-secrets.io/v1 fails naming it; a cluster-less render declares the APIs
# with `--api-versions external-secrets.io/v1/ExternalSecret` (and
# `generators.external-secrets.io/v1alpha1/Password` for the dev OpenBao's generated credentials).
# templates/external-secrets.yaml creates a SecretStore (→ the store) and one ExternalSecret per Secret a
# pod without a sidecar mounts. With the chart's dev OpenBao its seed also provisions the auth half: the
# kubernetes auth backend, a policy granting READ on exactly the paths those ExternalSecrets name, and the
# role below bound to the operator's ServiceAccount (measured 2026-09-08: without it every ExternalSecret
# sat in SecretSyncedError). A platform store is provisioned by its operator.
externalSecrets:
  # -- How often each ExternalSecret re-syncs from the store (a duration, e.g. `1h`).
  refreshInterval: "1h"
  # -- Vault/OpenBao KV mount path the SecretStore reads from.
  kvMount: secret # the Vault KV mount path
  # -- KV engine version of `kvMount` (`v1` or `v2`).
  kvVersion: "v2"
  # -- KV key holding the infra bundle (postgres-password, minio-secret-key), e.g. `lance` for secret/data/lance.
  secretPath: lance # the KV key holding postgres-password + minio-secret-key (e.g. secret/data/lance)
  # -- Mount path of the Vault/OpenBao Kubernetes auth backend the SecretStore authenticates through.
  kubernetesAuthPath: kubernetes # the Vault Kubernetes auth backend mount
  # -- Vault role the operator's ServiceAccount assumes; also names its read policy.
  role: lance-infra # the Vault role the operator's ServiceAccount assumes (also names its policy)
  # WHOSE ServiceAccount the role is bound to. Defaults match a stock external-secrets install; the
  # binding is what stops any other pod in the cluster assuming the role and reading the bundle.
  # -- Name of the External Secrets Operator ServiceAccount the Vault role is bound to, so no other pod can assume it.
  serviceAccount: external-secrets
  # -- Namespace of the External Secrets Operator ServiceAccount the Vault role is bound to.
  namespace: external-secrets


# ==== allocator ============================================================
# The glibc allocator bound applied to every lakehouse container. See `lance.allocatorEnv` in
# `_helpers.tpl` for the measurement: glibc sizes its arena cap from the HOST's cores (64 here) while the
# cgroup grants one CPU, and the four lakehouse pods held 34-59 secondary arenas of 64MB each. Measured
# in-image (Debian glibc 2.41): unset reserves 65 arenas, `2` reserves 1.
allocator:
  # -- MALLOC_ARENA_MAX set on every lakehouse container (lance.allocatorEnv) to cap glibc malloc arenas. Default 2.
  arenaMax: 2
  # WHICH ALLOCATOR ARROW USES, and the reason `arenaMax` above needs it ([[LH-183]]). `MALLOC_ARENA_MAX`
  # is a glibc tunable, and pyarrow 25.0.0 allocates through **mimalloc** by default
  # (`default_memory_pool().backend_name`), which that bound cannot reach. Measured: bounding the arenas
  # drove the count 60 -> 0 and the worker still died OOMKilled at 442m, only later than the pre-fix 87m.
  # `system` routes Arrow through plain malloc, so the bound already above governs it — this makes the
  # existing lever reach the allocator doing the work rather than adding a second one.
  # The variable name is read by the shipped `libarrow.so.2500` (verified with `strings`).
  # -- ARROW_DEFAULT_MEMORY_POOL on every lakehouse container; `system` routes Arrow through malloc so `arenaMax` bounds it.
  arrowMemoryPool: system

# ==== observability ==========================================================
# rask's telemetry seam is ONE OpenTelemetry Collector (templates/otel-collector.yaml): it RECEIVES the fleet's
# OTLP, TAILS infra-pod logs (filelog), SCRAPES the Dapr sidecars, the Dapr control plane, Ray and OpenFGA, and
# EXPORTS everything over OTLP/HTTP to the endpoint named here. What stores, graphs and alerts on that telemetry is
# the platform's (ADR 0153): rask installs no store, no dashboards and no alert evaluator. Its alert rules are an
# artefact of their own (deploy/alerting/rules.yml), and development gets the chain from
# deploy/fixtures/observability (GreptimeDB, Perses, vmalert, Alertmanager), which deploy/values-local.yaml names.
#
# THE AUDIT STORE'S CONTRACT, A PREREQUISITE LIKE ESO ([[XC-003]], owner 2026-10-10). Whatever store receives the
# Collector's export (traces, metrics, and the `lance_audit` trail) must REFUSE an unauthenticated write and an
# unauthenticated delete on every listener it serves, and admit the credential the Collector presents. The store is
# downstream of the Collector and so not rask's to configure; what rask owns is the Collector's half: it sends HTTP
# basic auth on every exporter, read from files ESO writes from the store's `otel-collector-export` secret (fields
# username, password; the dev OpenBao mints it, a platform store must hold it). GAP, stated: the fixture's GreptimeDB
# has no user provider, so it ignores the credential.
observability:
  # -- Deploy rask's OTel Collector and turn on OTLP export from the fleet, Dapr and OpenFGA to it; needs `export.endpoint`.
  enabled: false
  # -- Value of the `deployment.environment.name` OTel resource attribute; empty falls back to the release namespace.
  environment: rask # deployment.environment.name resource attr — override per deploy (dev / staging / prod)
  otelCollector:
    # -- Container image for the OTel Collector (contrib distribution).
    image: otel/opentelemetry-collector-contrib:0.157.0
  # Where the Collector sends what it collects. Every exporter presents the credential above. The headers are
  # the backend's ingestion contract, not OTLP's: GreptimeDB picks its database from `x-greptime-db-name`,
  # ingests traces only through the pipeline `x-greptime-pipeline-name` names, and writes a log stream to the
  # table `x-greptime-log-table-name` names (the governance trail is routed apart from telemetry so it can be
  # kept longer).
  export:
    # -- OTLP/HTTP base URL the Collector exports traces, metrics and logs to (`/v1/traces` etc. are appended); the platform's backend. Required while `enabled`: empty fails the render.
    endpoint: ""
    # -- Headers sent on every export.
    headers:
      x-greptime-db-name: public
    # -- Headers added to the trace export.
    traceHeaders:
      x-greptime-pipeline-name: greptime_trace_v1
    # -- Headers added to the export of `lance.audit` records, which leave on their own exporter.
    auditHeaders:
      x-greptime-log-table-name: lance_audit
  # The zones' audit viewer (home), the admin observability pages (lakehouse) and the experiment curves (models)
  # read the store directly, as GREPTIME_API: SQL at `<url>/v1/sql`, PromQL at `<url>/v1/prometheus`.
  query:
    # -- Base URL of the store's SQL and PromQL API the zones read (GREPTIME_API); empty leaves those panels without data.
    url: ""
    # -- Table the audit viewer reads `lance.audit` records from; the same table `export.auditHeaders` routes them to.
    auditTable: lance_audit
  # -- Dapr tracing sampling rate in the Dapr Configuration, as a string from 0 to 1; "1" traces every request.
  samplingRate: "1" # Dapr trace sampling — full, so the catalog→lineage context always propagates
