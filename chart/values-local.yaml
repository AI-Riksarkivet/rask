# The LOCAL k3s deployment's non-default choices — pass with `-f` on EVERY upgrade.
#
#     helm upgrade --install rask ./chart -f chart/values-local.yaml [...]
#     make k3s-up          # does this for you
#
# WHY THIS FILE EXISTS. These settings used to live only as `--set` flags inside `make k3s-up`, and
# on 2026-08-06 that cost the estate its corpus twice in one day. The second time is the instructive
# one: another session ran a plain `helm upgrade` (rev 30 failed on a duplicate env, rev 31's
# rollback failed, rev 32 completed) — and because that upgrade did not carry `--set
# explorer.corpus.mode=pvc`, the media plane silently reverted to the chart's `emptyDir` default.
# The PVC was still there, still Bound, still holding the seeded corpus; the pods simply stopped
# mounting it. The symptom was `NotFoundError: dataset 'transcripts_v2' not found under
# /media-corpus` and a 500 on every browse surface.
#
# A flag inside one make target is not a deployment's intent, it is one path's argument. Anyone who
# upgrades any other way gets the chart defaults, which are chosen for an ARBITRARY cluster and are
# wrong for this one. A values file is the intent, and `-f` carries it whoever runs helm.
#
# The chart defaults are NOT wrong and are deliberately left alone: `explorer.enabled=false` and
# `corpus.mode=emptyDir` are what a fresh cluster with no node preparation should get.

explorer:
  # #142: the media corpus is SERVED FROM THE GOVERNED BUCKET (registered as media$chunks /
  # media$documents). Without this pin a helm upgrade renders the chart default "" and flips all
  # three readers back to the empty disk — the exact landmine class #135 documents.
  corpusS3Root: "s3://bind86-wh"
  # The media plane is on here, and it has to be: `frontend.apps` always includes the `explorer` and
  # `annotator` zones, and both proxy /<zone>/api/* to VIEWER_API — env the chart only injects when
  # `explorer.enabled`. Without it those two zones deploy with no upstream at all and answer 502.
  enabled: true
  corpus:
    # `emptyDir` is per-pod scratch: the media plane could never hold a corpus across a restart, and
    # a seed written into one is invisible to the very pod that mounts it. The claim carries
    # `helm.sh/resource-policy: keep`, so the corpus outlives the release.
    mode: pvc
    # NOT the chart's ReadWriteMany default. k3s's local-path provisioner REFUSES RWX outright —
    #   failed to provision volume with StorageClass "local-path":
    #   NodePath only supports ReadWriteOnce and ReadWriteOncePod (1.22+) access modes
    # — so an RWX claim sits Pending forever and all three media pods sit Pending behind it. RWO
    # restricts a volume to one NODE, not one pod, so all three still mount it on a single-node
    # cluster. values.yaml's claim that a single-node cluster "will still bind an RWX claim ...
    # but that is luck, not a contract" is wrong in both halves: it is not luck, and it does not bind.
    accessMode: ReadWriteOnce

# THE RAY THE CASCADE REACHES, and it is now the name the chart already derives. That derivation —
# `http://<release>-ray-head-svc:8265` — used to come only from the RayService, which renders under
# `singleTenant.enabled` and is off here, so the name resolved to nothing and every stage died
# `RayJobError: [Errno -3] Temporary failure in name resolution` with nothing naming DNS as the cause.
# The fix then was to point this at a hand-applied head instead.
#
# The RayCluster below creates exactly that Service, so this is no longer a fork from the chart. It
# stays written out rather than removed because it must live in a FILE: a `--set` does not survive
# into `helm get values`, so an upgrade reusing the live values drops it — measured 2026-08-25, when
# two upgrades put the stage runners back on a name that resolved to nothing and the cascade died
# again. The value being correct is not the same as the value being durable.
medallion:
  rayAddress: http://rask-ray-head-svc:8265
  # THE QUALITY GATE, IN A FILE FOR THE REASON THE PARAGRAPH ABOVE GIVES. It was live as a
  # `kubectl set env` on the producer and absent from `helm get values`, so the next upgrade would
  # have silently turned it off — measured 2026-09-20 by diffing every live deployment's env against
  # `helm template`. `values.yaml` defaults it FALSE, and the default render also drops
  # MEDALLION_PROMOTION_REVIEW_BAND, which is nested inside the same conditional.
  quality: true
  # THE CASCADE'S PER-HOP ReBAC, here for the same reason `quality` is: it was live as a
  # `kubectl set env` on the three stage runners and absent from `helm get values`.
  #
  # `transform.py` says "an unauthorized stage runner returns DROP (redelivery won't grant the role),
  # so the cascade enforces the ReBAC" — and that preflight is gated on this flag, which `values.yaml`
  # defaults FALSE for the open-mode demo. Measured on this estate 2026-09-20: the producer had it on
  # and all three stage runners did not, so a revoked writer rung was never DROPped. The denial
  # surfaced deeper as a catalog 403, the handler acked RETRY, and the run COMPLETED once the grant
  # came back — the deny was a delay, not a refusal.
  #
  # ON HERE BECAUSE THIS ESTATE MEETS THE PREREQUISITE the flag's own comment names: the stage-runner
  # identity grants are seeded, and auth is on. `values-prod.yaml:24` already sets it; this brings the
  # local release to the same posture instead of leaving the demo one under a governed estate.
  fgaEnabled: true

# Distributed compaction was live the same way and would have gone the same way: declared at
# `values.yaml:1598`, defaulting false, inside a `vendWriteCredentials` conditional. The catalog plans
# and commits under its own key and only the byte rewrite happens in maintenance, signed by the
# table-scoped credential the vend issues.
maintenance:
  distributedCompaction: true
  # RECLAMATION ON, for THIS estate only — the chart default stays false and should, because
  # `trashPurge` is the permission to make an expired drop permanently unrecoverable and no shared
  # default should carry it. Authorised by the owner 2026-09-20 and exercised the same day: the first
  # real run reclaimed 7 records / 75,166 bytes, exactly what three preceding dry-run ticks predicted.
  #
  # IT IS HERE RATHER THAN SET BY HAND because the deploy that landed this file proved the point: a
  # `kubectl set env` enable is absent from `helm get values`, so revision 193 reverted it mid-task and
  # the purge had to be re-armed before it could fire. A permission that disarms on every deploy is not
  # a policy, it is a chore.
  #
  # The blast radius is bounded by three things that are NOT this flag: the grace window decides what
  # is expired at all, `trashPurgeMaxPerTick` caps a tick at 25 with the remainder REPORTED as capped,
  # and the purge only runs on a tick whose drift report is clean.
  trashPurge: true

  # [[LH-061]]'s repair half, ARMED on local but DRY-RUN: the estate carries 1,033 `ghost_tables`
  # (residue of the warehouse cascade [[LH-148]] fixed at source), and a first run must be readable
  # before it is destructive. `driftRepairDryRun: false` is the second, separate act that arms it.
  driftRepair: true
  driftRepairDryRun: true

  # [[LH-061]]'s storage tier, armed on local but DRY-RUN: 989 orphaned trash records name roots no
  # purge tick can reach, and all 989 were measured to point at a bucket holding nothing. The pass
  # proves that per record before removing one. `tombstoneSweepDryRun: false` is the separate act.
  tombstoneSweep: true
  tombstoneSweepDryRun: true

# THE OPERATOR-MANAGED HEAD ([[CP-042]]), which is what makes the derivation above unnecessary: a
# RayCluster named `<release>-ray` gives KubeRay's own `<release>-ray-head-svc`, the exact name the
# chart already derives and which resolved to nothing here.
#
# The image is spelled with its registry because the Ray templates do not go through `rask.image`
# (that is [[CP-050]]), so `localImages` does not reach them and a bare `ray-cluster:dev` would resolve
# to Docker Hub.
ray:
  # ONE RAY PLANE, NOT TWO ([[CP-041]]). `dashboardUrl` feeds `RAY_DASHBOARD_URL`, which is what
  # `compute` prunes job history against, serves its jobs board from and proxies `/api/serve` to —
  # while `medallion.rayAddress` decides where the cascade SUBMITS. They are independent keys with no
  # cross-check, and until now they named different clusters: the cascade's jobs accumulated on one
  # head while the only reclaimer swept another. Both now name the operator-managed head.
  dashboardUrl: http://rask-ray-head-svc:8265
  cluster:
    enabled: true
  image:
    repository: localhost:5000/ray-cluster
    tag: main-2cfe68f4

# Interactive API docs (/docs, /redoc, /openapi.json) across the release.
#
# ON here and OFF in the chart default, which is the split the audit asked for: a local k3s cluster is
# where these are actually useful, and it is not reachable from anywhere. Everything published at an
# Ingress keeps the closed default — most of all the gateway, whose aggregated `{prefix}/openapi.json`
# answers anonymously and fans out to every backend it fronts.
docs:
  enabled: true

# THE SCOPED STORAGE IDENTITIES this estate actually runs on.
#
# They were live long before they were written down: the Deployments held `rask-maintenance` and
# `rask-medallion` while `helm get values` carried no `minio` section at all. That is drift Helm
# cannot correct — it only patches fields that CHANGED between releases, so a hand-set env survives
# every upgrade and reverts to the tenant ROOT the moment one values edit touches the field, with
# nothing going red. The same class as the corpus PVC this file's header describes, and worse: the
# symptom is a credential quietly widening rather than a 500.
#
# Only the NAME is needed. Each secret is derived from it plus `minio.secretKey`
# (`lance.scopedStorageSecret`), so declaring the identities costs no secret in git, and the one
# string reaches the pod env, the OpenBao seed and the `mc` user creation together — a scoped access
# key beside any other secret is `SignatureDoesNotMatch` on every call.
#
# `minio-scoped-users` provisions each policy and user as a post-upgrade hook, and naming an
# identity here is enough even when the user already exists: `mc admin user add` ROTATES an existing
# user's secret. Probed 2026-09-07 against this estate's own mc image on a throwaway user — after a
# second `add` with a different secret, the NEW secret reaches `Access Denied` (a valid credential
# with no policy attached) while the OLD one fails `SignatureDoesNotMatch`. Read the error text, not
# the exit code: both an unprovisioned credential and a wrong one fail an `mc ls`, and only the
# message tells them apart.
#
# The hook runs POST-upgrade, so on the one upgrade that first names an identity the pods read the
# derived secret from OpenBao before the store has been told about it. Expect a brief window of failed
# S3 calls there; the stage runners are idempotent and retry.
minio:
  maintenanceAccessKey: rask-maintenance
  medallionAccessKey: rask-medallion

# EXTERNAL SECRETS OPERATOR — the sanctioned path for a pod with NO Dapr sidecar (the Ray lane, the
# seven web zones, the runners), which cannot call `/v1.0/secrets/*` and therefore cannot use the
# store the rest of the fleet uses. Owner ruling 2026-09-08: "Never secret through envs. Either from
# ESO, secret store dapr and STS for zero trust."
#
# It lives HERE rather than as a `--set` for the reason this whole file exists: a flag omitted from
# one later upgrade reverts the setting silently, and a credential path that reverts silently is
# worse than one that was never enabled.
#
# Turning it on also makes the OpenBao seed Job provision ESO's AUTH half — the kubernetes auth
# backend, a policy granting READ on exactly `<kvMount>/data/<secretPath>`, and the role bound to the
# operator's ServiceAccount. Measured 2026-09-08: with only the KV half seeded the operator ran 3/3
# with ZERO SecretStores and every ExternalSecret would have sat in SecretSyncedError, so the toggle
# alone was never sufficient.
externalSecrets:
  enabled: true

# THE CONTROL ROOT'S SCHEDULED BACKUP ([[LH-110]]), on here so the lane is exercised rather than only
# rendered. `dest` is left empty deliberately for a dev estate: that writes `_backups/control/` inside
# the control root itself, which survives a bad write and does NOT survive losing the bucket — the
# failure a backup exists for. Any deployment that matters sets a separate bucket, which is what the
# chart's own values say.
backups:
  controlRoot:
    enabled: true
    keep: 3

# [[LH-067]] THE SECOND STORE'S BASE, ON THE ALLOWLIST — without it the feature is off and the
# per-base credential path is unreachable. `LANCE_MULTIBASE_BASE_CREDENTIAL_REFS` already names this
# base's OpenBao entry, but a `?data_base=` request is validated against THIS list first, so a base
# with a credential reference and no allowlist entry is refused before the credential is ever used.
# Measured 2026-09-22: refs set, allowlist empty ("Empty = feature off" per the chart's own comment),
# which is why the `lh067-second-store` fixture and its `lh067user` had never been exercised.
#
# LOCAL ONLY. `chart/values.yaml` keeps `dataBases: []` so the feature stays off by default; an estate
# opts a bucket in deliberately, and the allowlist is what makes "a caller can never point a base at an
# arbitrary bucket" true.
catalog:
  multibase:
    dataBases:
      - s3://lh067-second-store/data
    # The other half, and it belongs in the chart rather than on the live Deployment. Measured
    # 2026-09-22: this pair existed ONLY as drift — the env var rendered from nothing, so it survived
    # upgrades by helm's three-way merge and was absent from any fresh install. A value that lives in
    # one cluster is invisible to review and gone the next time the release is rebuilt.
    baseCredentialRefs:
      s3://lh067-second-store/data: lh067-second-store

# ALERTING ON, because a proven rule nothing evaluates is a resilience claim with no mechanism.
# Measured 2026-09-24: `chart/alerting/rules.yml` carries 52 rules across 13 groups, every one proven
# to fire by `make alert-rules-check` and accepted by the real engine by `make alert-rules-drill` —
# and `observability.alerting.enabled` defaults false, so neither vmalert nor Alertmanager is deployed
# and NOTHING on this estate reads any of them. The Collector ships, GreptimeDB stores and Perses
# draws; none of those can turn a series into a page.
#
# NO CREDENTIAL IS NEEDED TO TURN IT ON, which is why this is a dev-values line and not a request:
# `observability.alerting.webhookUrl` is empty and the chart's own comment says what that means —
# Alertmanager still receives, groups and holds the alert, and pages nowhere. A firing rule becomes
# visible (`:9093`) instead of theoretical, and adding a real receiver later is a secret question this
# estate does not have to answer first.
#
# LOCAL ONLY. `chart/values.yaml` keeps it false so an estate opts in deliberately.
observability:
  alerting:
    enabled: true
