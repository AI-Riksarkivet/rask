
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rask.fullname" . }}-app
  labels:
    {{- include "rask.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ONE object store, ONE identity (docs/adr/0124-chart-unification-one-control-plane-each-one-object-store.md): the fleet presents the same
  # `minio.accessKey` the Tenant boots with, and anything else 403s against the only store. The SECRET
  # half is not here and not anywhere in pod env — it reaches a workload from the Dapr secret store
  # (sidecar pods) or ESO (`rask-infra-credentials`, for the pods without one).
  AWS_ACCESS_KEY_ID: {{ .Values.minio.accessKey | quote }}
  # The ONE S3 endpoint — the operator Tenant's `<tenant>-io:9000`, or minio.externalEndpoint when set.
  HCP_ENDPOINT: {{ include "lance.s3Endpoint" . | quote }}
{{- end }}
