{{- /* App secret is generated only when the operator did not supply existingSecret. */}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rask.fullname" . }}-app
  labels:
    {{- include "rask.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ONE object store, ONE credential pair (lance-ns-merge P4 store unification): the fleet presents
  # the same minio.accessKey/secretKey the Tenant boots with (credsSecret below), the lakehouse apps
  # export, and infra-credentials holds — anything else 403s against the only store.
  AWS_ACCESS_KEY_ID: {{ .Values.minio.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.minio.secretKey | quote }}
  # The ONE S3 endpoint — the operator Tenant's `<tenant>-io:9000`, or minio.externalEndpoint when set.
  HCP_ENDPOINT: {{ include "lance.s3Endpoint" . | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
{{- end }}
