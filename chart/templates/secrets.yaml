
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rask.fullname" . }}-app
  labels:
    {{- include "rask.labels" . | nindent 4 }}
type: Opaque
stringData:
  # No access key: every workload presents its own scoped identity, and only the scoped-users hook names the store's
  # root (ADR 0168). The ONE S3 endpoint — the development store's `<release>-rustfs:9000`, or objectStore.externalEndpoint when set.
  HCP_ENDPOINT: {{ include "lance.s3Endpoint" . | quote }}
{{- end }}
