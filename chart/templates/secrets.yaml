{{- /* App secret is generated only when the operator did not supply existingSecret. */}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rask.fullname" . }}-app
  labels:
    {{- include "rask.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "rask.databaseUrl" . | quote }}
  # ONE object store, ONE credential pair (lance-ns-merge P4 RustFS unification): the fleet presents
  # the same rustfs.accessKey/secretKey the Tenant boots with (credsSecret below), the lakehouse apps
  # export, and infra-credentials holds — anything else 403s against the only store.
  AWS_ACCESS_KEY_ID: {{ .Values.rustfs.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.rustfs.secretKey | quote }}
  # The ONE S3 endpoint — the operator Tenant's `<tenant>-io:9000`, or rustfs.externalEndpoint when set.
  HCP_ENDPOINT: {{ include "lance.s3Endpoint" . | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
{{- end }}
{{- if .Values.cnpg.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rask.fullname" . }}-postgres
  labels:
    {{- include "rask.componentLabels" (list . "postgres") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cnpg.user | quote }}
  password: {{ include "rask.pgPassword" . | quote }}
{{- end }}
{{- if .Values.rustfs.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rask.fullname" . }}-rustfs
  labels:
    {{- include "rask.componentLabels" (list . "rustfs") | nindent 4 }}
type: Opaque
# The Tenant's credsSecret — the root credential the rustfs-operator boots the ONE store with.
# Sourced from rustfs.accessKey/secretKey so it matches every consumer (fleet AWS_* above, the
# lakehouse apps' *_S3_* env, infra-credentials' rustfs-secret-key, the mkbucket/backup-pg hooks).
stringData:
  accesskey: {{ .Values.rustfs.accessKey | quote }}
  secretkey: {{ .Values.rustfs.secretKey | quote }}
{{- end }}
