{{- if .Values.ingress.enabled }}
{{- $root := . -}}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rask.fullname" . }}
  labels:
    {{- include "rask.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "rask.fullname" $ }}-gateway
                port:
                  number: {{ .Values.services.gateway.port }}
          {{- if .Values.frontend.enabled }}
          {{- range .Values.frontend.apps }}
          {{- if not .catchAll }}
          - path: {{ required (printf "frontend.apps entry %q needs a `path` (its svelte.config.js paths.base) unless it is the catchAll zone" .name) .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "rask.fullname" $root }}-web-{{ .name }}
                port:
                  number: {{ $root.Values.frontend.service.port }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.auth.enabled }}
          - path: /dex
            pathType: Prefix
            backend:
              service:
                name: {{ include "lance.dexHost" $root }}
                port:
                  number: 5556
          {{- end }}
          {{- if .Values.frontend.enabled }}

          {{- range .Values.frontend.apps }}
          {{- if .catchAll }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rask.fullname" $root }}-web-{{ .name }}
                port:
                  number: {{ $root.Values.frontend.service.port }}
          {{- end }}
          {{- end }}
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rask.fullname" $root }}-gateway
                port:
                  number: {{ .Values.services.gateway.port }}
          {{- end }}
{{- end }}
