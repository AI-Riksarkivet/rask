{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rask.fullname" . }}
  labels:
    {{- include "rask.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
      {{- /* Empty host => no host rule => catch-all (any Host / bare IP / VS Code-forwarded localhost). */}}
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "rask.fullname" . }}-gateway
                port:
                  number: 8888
          {{- /* Each MFE domain app on its base path; Traefik matches longest-prefix
                 first, so these win over the catch-all "/" below. */}}
          {{- range .Values.frontend.apps }}
          {{- if not .catchAll }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "rask.fullname" $ }}-{{ .name }}
                port:
                  number: {{ $.Values.frontend.service.port }}
          {{- end }}
          {{- end }}
          {{- /* Catch-all home app last: "/", "/<project>/overview|new". */}}
          {{- range .Values.frontend.apps }}
          {{- if .catchAll }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rask.fullname" $ }}-{{ .name }}
                port:
                  number: {{ $.Values.frontend.service.port }}
          {{- end }}
          {{- end }}
{{- end }}
