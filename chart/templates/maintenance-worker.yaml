{{- /* DEDICATED MAINTENANCE WORKERS (docs/DECISIONS.md "Maintenance leaves the planner pod").

     The planner's own Deployment, with the cron binding names BLANKED and its own sizing. It
     consumes `maintenance.work.v1` as a competing consumer (the Component carries
     `queueGroupName: maintenance`), so replicas share the queue with no code change and the
     broker single-flights each unit — no lock, which is why this half may scale while the
     planner may not.

     Rendered from the SAME block as the planner so the two cannot drift in their storage,
     credential or lineage wiring; only the role switches and the resources differ. */}}
{{- if and .Values.maintenance.enabled .Values.maintenance.dedicatedWorkers.enabled .Values.maintenance.workTopic }}
{{- $root := . }}
{{- $port := .Values.maintenance.port }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-maintenance-worker
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.maintenance.dedicatedWorkers.replicas }}
  selector:
    {{- /* ITS OWN COMPONENT, not the planner's ([[LH-183]]). Sharing `component: maintenance` put these
       pods behind the PLANNER'S SERVICE (maintenance.yaml `selector: { app.kubernetes.io/component:
       maintenance }`), which would route health, metrics and invocation onto pods that do not serve
       that role — and it made the two indistinguishable to every selector the chart has, including
       the PodDisruptionBudget this deployment needs at `replicas: 2` and the planner must NOT have at
       one (`tests/unit/test_prod_ha_posture.py` gates both directions). */}}
    matchLabels: { app.kubernetes.io/component: maintenance-worker, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: maintenance-worker
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
      {{- if .Values.dapr.sidecars }}
      annotations:
        {{- include "rask.daprAnnotations" (list $root .Values.maintenance.daprAppId $port) | nindent 8 }}
      {{- end }}
    spec:
      # Longer grace than the other apps: an in-flight sweep/Lance write must finish, not be SIGKILLed.
      terminationGracePeriodSeconds: {{ .Values.lifecycle.maintenanceTerminationGracePeriodSeconds }}
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-maintenance
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: maintenance
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          {{- if include "lance.otelEnabled" $root }}
          command: ["opentelemetry-instrument", "uvicorn"]
          {{- else }}
          command: ["uvicorn"]
          {{- end }}
          args:
            - "maintenance.service:app"
            - "--host=0.0.0.0"
            - "--port={{ $port }}"
          ports: [{ name: http, containerPort: {{ $port }} }]
          env:
            {{- include "lance.allocatorEnv" (list $root) | nindent 12 }}
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root .Values.maintenance.daprAppId) | nindent 12 }}
            {{- end }}
            - { name: MAINTENANCE_DOCS, value: {{ $root.Values.docs.enabled | quote }} }
            {{- include "lance.lineageEmitEnv" (list $root) | nindent 12 }}
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            # Fail-closed at boot if behind a Dapr sidecar but the app-token is unset (open forgery path) —
            # symmetric with the lineage service (the audit's consistency fix).
            - { name: MAINTENANCE_DAPR_ENABLED, value: {{ .Values.dapr.sidecars | quote }} }
            {{- if .Values.dapr.sidecars }}
            # Gated on the sidecar because that is what it VERIFIES — the token exists to check the
            # `dapr-api-token` header Dapr stamps on delivery, so without a sidecar there is no header
            # to check and the reference dangles: the Secret is not rendered and the pod never starts.
            # verify the Dapr-stamped header on the cron route (forged-sweep guard)
{{- include "lance.appTokenEnv" (list $root $root.Values.maintenance.daprAppId) | nindent 12 }}
            {{- end }}
            {{- if $root.Values.maintenance.vendWriteCredentials }}
            # THE REWRITE IS SIGNED PER TABLE, not by the root key. A compaction is a WRITE, so this
            # service was performing writes across every bucket in the estate with one long-lived
            # credential — the posture the vending door exists to end. With this set, each rewrite is
            # signed by a credential scoped to that one table prefix and expiring in 900s.
            #
            # GATED, and off by default, because it needs BOTH halves to be true: the catalog must be
            # reachable AND the maintenance subject must hold `can_write_data` on the tables it
            # maintains (seeded by the bootstrap-admin hook — grep `maintenanceSubject`). Where either
            # is missing the service degrades to the ambient credential and says so per dataset, which
            # is correct but silent about WHY, so the flag makes the intent explicit rather than
            # leaving a permanently-degraded deployment looking configured.
            #
            # What deliberately STAYS on the root key: discovery and the whole-estate protection
            # pre-pass, which must open every manifest in every bucket and cannot be expressed by any
            # per-table credential. Those are reads.
            - { name: MAINTENANCE_CATALOG_URL, value: {{ printf "http://%s-catalog:%v" (include "lance.fullname" $root) $root.Values.services.catalog.port | quote }} }
            {{- /* #41. The SAME `auth.audit` key every other lakehouse service reads, so the
                 operator's one lever reaches the component that REWRITES BYTES too — it had no
                 setting at all until 2026-09-09, so there was nothing here to render (§ Q17-27).
                 hasKey+ternary for the reason recorded at the catalog's copy: `| default` makes an
                 explicit false un-settable, and a bare reference renders "" on a `--reuse-values`
                 upgrade, which is a bool_parsing crash at boot. */}}
            - { name: MAINTENANCE_AUDIT_ENABLED, value: {{ hasKey $root.Values.auth "audit" | ternary $root.Values.auth.audit true | quote }} }
            - { name: MAINTENANCE_CATALOG_SERVICE_IDENTITY, value: {{ $root.Values.maintenance.catalogServiceIdentity | quote }} }
            {{- if $root.Values.maintenance.distributedCompaction }}
            # THE REWRITE'S BYTES LEAVE THIS POD. `compact_files()` plans, executes and commits in one
            # call, so this pod's memory ceiling is a function of the largest table anyone owns rather
            # than of its request rate. With this on, the catalog plans and commits (metadata only,
            # under its own key) and only the byte rewrite happens here, signed by the table-scoped
            # credential the block above vends. Gated on the vending flag because the plan and commit
            # doors are the catalog's — the flag alone would plan against nothing.
            - { name: MAINTENANCE_DISTRIBUTED_COMPACTION, value: "true" }
            {{- end }}
            {{- end }}
            {{- if .Values.maintenance.workTopic }}
            - { name: MAINTENANCE_WORK_PUBSUB, value: {{ .Values.maintenance.workPubsub | quote }} }
            - { name: MAINTENANCE_WORK_TOPIC, value: {{ .Values.maintenance.workTopic | quote }} }
            {{- /* The execution ceiling this pod actually applies to its threadpool, and the number the
                 work component's `maxAckPending` is derived from. Passed rather than assumed so the two
                 cannot drift: a delivery bound computed from a ceiling the process does not enforce is a
                 bound nobody applies. */}}
            - { name: MAINTENANCE_MAX_CONCURRENT_UNITS, value: {{ .Values.maintenance.dedicatedWorkers.maxConcurrentUnits | quote }} }
            {{- /* The per-unit BYTE bound the pod's memory is sized against, beside the concurrency it
                 multiplies with. A measured ~1.7x of this is resident per unit. */}}
            - { name: MAINTENANCE_MAX_SOURCE_BYTES, value: {{ int64 .Values.maintenance.maxSourceBytes | quote }} }
            {{- /* The MEMORY bound, held around the rewrite. Separate from the units ceiling above,
                 which is throughput: one knob for both throttled the whole lane. */}}
            - { name: MAINTENANCE_MAX_CONCURRENT_COMPACTIONS, value: {{ .Values.maintenance.dedicatedWorkers.maxConcurrentCompactions | quote }} }
            {{- /* REQUIRED, NOT QUOTED-THROUGH. `helm upgrade --reuse-values` keeps the previous
                 release's values and IGNORES this chart's defaults, so a key added after that release
                 arrives nil and `| quote` renders it as `""` — which pydantic refuses at boot. Measured
                 2026-09-25: the worker CrashLoopBackOff'd on exactly that for the fraction below. A
                 missing value must fail the RENDER, where the operator sees it, never a pod. The correct
                 upgrade flag is `--reset-then-reuse-values`, which applies chart defaults first. */}}
            - { name: MAINTENANCE_RECYCLE_AFTER_PASSES, value: {{ required "maintenance.dedicatedWorkers.recycleAfterPasses is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.maintenance.dedicatedWorkers.recycleAfterPasses | quote }} }
            - { name: MAINTENANCE_RECYCLE_AT_MEMORY_FRACTION, value: {{ required "maintenance.dedicatedWorkers.recycleAtMemoryFraction is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.maintenance.dedicatedWorkers.recycleAtMemoryFraction | quote }} }
            - { name: MAINTENANCE_WORK_DLQ_TOPIC, value: {{ .Values.maintenance.workDlqTopic | quote }} }
            {{- if .Values.maintenance.indexTopic }}
            # The index-build lane. Its own topic beside the work queue: one ackWait cannot serve both a
            # minutes-long compaction and a vector index over a large table.
            - { name: MAINTENANCE_INDEX_TOPIC, value: {{ .Values.maintenance.indexTopic | quote }} }
            - { name: MAINTENANCE_INDEX_PUBSUB, value: {{ .Values.maintenance.indexPubsub | quote }} }
            - { name: MAINTENANCE_INDEX_DLQ_TOPIC, value: {{ .Values.maintenance.indexDlqTopic | quote }} }
            {{- end }}
            {{- if .Values.maintenance.dedicatedWorkers.enabled }}
            # THE PLANNER PUBLISHES AND DOES NOT CONSUME. It still needs the topic — it enqueues onto
            # it — which is exactly why `workTopic` cannot express this and a second switch exists.
            # THE EXECUTOR CONSUMES. No cron names below, so `build_router` mounts nothing and this pod
            # runs no sweep of its own beside the planner's.
            - { name: MAINTENANCE_BINDING_NAME, value: "" }
            - { name: MAINTENANCE_RECONCILE_BINDING_NAME, value: "" }
            {{- end }}
            {{- end }}
            {{- if .Values.maintenance.lineageEmit }}
            - { name: MAINTENANCE_LINEAGE_EMIT_ENABLED, value: "true" }
            {{- if .Values.maintenance.workTopic }}
            # The PER-SUBSCRIBER component, not the shared broadcast one. `queueGroupName` lives on the
            # COMPONENT, so subscribing through `pubsub.name` gives every replica every event instead of
            # a competing-consumer group — measured 2026-09-03, the arrival route bound to
            # `pubsub=lineage-pubsub` and would have planned the same dataset once per replica. Used for
            # publishing too, exactly as the stage runners do (`lance.subPubsub`): the queue group affects
            # subscription only.
            - { name: MAINTENANCE_LINEAGE_PUBSUB, value: {{ include "lance.subPubsub" (list $ .Values.maintenance.daprAppId) | quote }} }
            {{- else }}
            - { name: MAINTENANCE_LINEAGE_PUBSUB, value: {{ .Values.pubsub.name | quote }} }
            {{- end }}
            - { name: MAINTENANCE_LINEAGE_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- if .Values.services.lineage.outbox.enabled }}
            # Stage the emit so a bus blip does not lose it. A maintenance run is emitted ONLY when the
            # sweep does MATERIAL work (`sweep.py::_did_material_work` gates on fragments or versions
            # removed), so a dropped publish loses the record of the one tick that actually rewrote
            # bytes — the graph then shows a dataset whose files changed with nothing saying what
            # changed them.
            #
            # The SAME prefix the catalog, the stage runners and the drain name, because `lineage`'s reconcile
            # cron is the only thing that reads it. A private prefix here would stage objects nothing
            # ever collects, which reads as durability and is not.
            - { name: MAINTENANCE_LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.minio.bucket }}/_lineage_outbox" }
            {{- end }}
            {{- end }}
            {{- /* #79 reclamation. OFF unless explicitly asked for: with it on, a drop past
                   LANCE_TRASH_GRACE_DAYS becomes permanently unrecoverable, and the purge is gated on
                   the reconcile tick's drift report running clean — so an estate that never reports
                   clean never reclaims, which is the designed direction, not a bug to route around. */}}
            - { name: MAINTENANCE_TRASH_PURGE_ENABLED, value: {{ hasKey .Values.maintenance "trashPurge" | ternary .Values.maintenance.trashPurge false | quote }} }
            {{- /* THE PREVIEW, and it is the step BEFORE spending the delete permission rather than an
                 alternative to it. With reclamation off the pass returns before the trash prefix is even
                 read, so the only way to learn what a purge would do was to let it do it — the wrong
                 order for the one irreversible operation this service performs. It runs the REAL pass
                 (same due-record selection, same liveness and shallow-clone pre-passes, same refusal
                 check) and skips only the three mutations plus the refusal annotation. It can only
                 SUBTRACT: with both flags on the tick previews and reclaims nothing. */}}
            - { name: MAINTENANCE_TRASH_PURGE_DRY_RUN, value: {{ hasKey .Values.maintenance "trashPurgeDryRun" | ternary .Values.maintenance.trashPurgeDryRun false | quote }} }
            - { name: MAINTENANCE_TRASH_PURGE_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "trashPurgeMaxPerTick") | ternary .Values.maintenance.trashPurgeMaxPerTick 25 | quote }} }
            {{- /* [[LH-094]]. The floor raise writes ONE metadata-only commit to a dataset whose orphans
                   sit above its Lance listing floor, so the next ordinary sweep can enumerate them. It
                   deletes nothing — the delete stays `cleanup_old_versions`'s, under Lance's own rule.
                   Rendered unconditionally for the same reason the orphan scan below is: a setting with
                   no path from values is one no deployed estate can turn on, which is how the orphan
                   scan sat permanently SKIPPED. TWO FLAGS, because "does this estate want the
                   behaviour" and "does this tick act" are different questions, and the dry run defaults
                   TRUE here where the purge's defaults false — the purge is gated behind a clean report
                   and this pass is what MAKES the report clean, so it has no such gate in front of it. */}}
            - { name: MAINTENANCE_FLOOR_RAISE_ENABLED, value: {{ hasKey .Values.maintenance "floorRaise" | ternary .Values.maintenance.floorRaise false | quote }} }
            - { name: MAINTENANCE_FLOOR_RAISE_DRY_RUN, value: {{ hasKey .Values.maintenance "floorRaiseDryRun" | ternary .Values.maintenance.floorRaiseDryRun true | quote }} }
            - { name: MAINTENANCE_FLOOR_RAISE_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "floorRaiseMaxPerTick") | ternary .Values.maintenance.floorRaiseMaxPerTick 10 | quote }} }
            {{- /* [[LH-061]]. The ADDITIVE tuple rebuild: re-assert authorization tuples the
                   control-plane registries still justify, for objects the drift report found
                   ungoverned. It WRITES AND NEVER DELETES, so it cannot widen access beyond what the
                   control plane already recorded — which is what makes it safe against a live store.
                   Off by default because it writes to the AUTHORIZATION store, and its dry run
                   defaults TRUE so turning it on to SEE what it would grant does not grant it.
                   The bound is real: project records carry `created_by` and warehouse records do not,
                   so a tenant's admin seed and its warehouses' tenancy pointers come back, and every
                   grant made after creation does not. */}}
            - { name: MAINTENANCE_TUPLE_REBUILD_ENABLED, value: {{ hasKey .Values.maintenance "tupleRebuild" | ternary .Values.maintenance.tupleRebuild false | quote }} }
            - { name: MAINTENANCE_TUPLE_REBUILD_DRY_RUN, value: {{ hasKey .Values.maintenance "tupleRebuildDryRun" | ternary .Values.maintenance.tupleRebuildDryRun true | quote }} }
            - { name: MAINTENANCE_TUPLE_REBUILD_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "tupleRebuildMaxPerTick") | ternary .Values.maintenance.tupleRebuildMaxPerTick 50 | quote }} }
            {{- /* [[LH-061]]'s two DESTRUCTIVE halves, rendered here for the reason stated at the top of
                   this file: the worker is generated from the same block as the planner so the two
                   cannot disagree about what the service is configured to do. The worker's cron
                   bindings are blanked, so it never fires the reconcile route that reads these — which
                   is exactly why they must still be present and identical. A pod whose environment
                   describes a different service from its sibling is one an operator cannot reason
                   about from `kubectl describe`, and the gap would only be discovered by whichever
                   change first gives the worker a reconcile path. */}}
            - { name: MAINTENANCE_DRIFT_REPAIR_ENABLED, value: {{ hasKey .Values.maintenance "driftRepair" | ternary .Values.maintenance.driftRepair false | quote }} }
            - { name: MAINTENANCE_DRIFT_REPAIR_DRY_RUN, value: {{ hasKey .Values.maintenance "driftRepairDryRun" | ternary .Values.maintenance.driftRepairDryRun true | quote }} }
            - { name: MAINTENANCE_DRIFT_REPAIR_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "driftRepairMaxPerTick") | ternary .Values.maintenance.driftRepairMaxPerTick 50 | quote }} }
            - { name: MAINTENANCE_TOMBSTONE_SWEEP_ENABLED, value: {{ hasKey .Values.maintenance "tombstoneSweep" | ternary .Values.maintenance.tombstoneSweep false | quote }} }
            - { name: MAINTENANCE_TOMBSTONE_SWEEP_DRY_RUN, value: {{ hasKey .Values.maintenance "tombstoneSweepDryRun" | ternary .Values.maintenance.tombstoneSweepDryRun true | quote }} }
            - { name: MAINTENANCE_TOMBSTONE_SWEEP_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "tombstoneSweepMaxPerTick") | ternary .Values.maintenance.tombstoneSweepMaxPerTick 50 | quote }} }
            {{- /* #128a: the orphan scan's lever. Rendered unconditionally rather than behind an `if`,
                   because the whole defect was that the setting existed in config.py and had NO path
                   from values — an env var that appears only when enabled is one nobody can discover
                   from `kubectl describe`, and this one gates whether the purge can certify at all. */}}
            - { name: MAINTENANCE_ORPHAN_SCAN_ENABLED, value: {{ hasKey .Values.maintenance "orphanScan" | ternary .Values.maintenance.orphanScan false | quote }} }
            {{- if .Values.maintenance.controlEmit }}
            {{- /* The purge announces each reclamation on the catalog's control topic. The broadcast
                   component must scope this app-id (dapr-component.yaml) or the sidecar refuses the
                   publish — and because emission is best-effort, it refuses SILENTLY. */}}
            - { name: MAINTENANCE_CONTROL_EMIT_ENABLED, value: "true" }
            - { name: MAINTENANCE_CONTROL_PUBSUB, value: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" | quote }} }
            {{- end }}
            - { name: MAINTENANCE_OLDER_THAN_DAYS, value: {{ .Values.maintenance.olderThanDays | quote }} }
            - { name: MAINTENANCE_SCAN_BATCH_SIZE, value: {{ .Values.maintenance.scanBatchSize | quote }} }
            - { name: MAINTENANCE_COMPACT_THREADS, value: {{ .Values.maintenance.compactThreads | quote }} }
            - { name: MAINTENANCE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            {{- /*
              THE SCOPED PAIR WINS, BOTH HALVES OR NEITHER. `minio.accessKey` is the TENANT ROOT, and
              maintenance compacts with it — a write — so it also reaches `_projects/`, `_protection/`
              and `_policies/`, the records that govern maintenance itself. A provisioned scoped user
              (minio-scoped-users) replaces it; empty leaves today's behaviour exactly, because
              repointing a live service at a credential nobody created would take the sweep down on
              upgrade. Requiring BOTH halves is the Ray pair's measured lesson: setting one gives
              `SignatureDoesNotMatch` on every operation.
            */ -}}
            {{- /* The ACCESS KEY alone scopes the plane; the secret is derived unless supplied
                 (`lance.scopedStorageSecret`), so declaring the identity needs no secret in a values file. */ -}}
            {{- $scoped := .Values.minio.maintenanceAccessKey }}
            - { name: MAINTENANCE_S3_ACCESS_KEY_ID, value: {{ ternary .Values.minio.maintenanceAccessKey .Values.minio.accessKey (not (not $scoped)) | quote }} }
            {{- if not (include "lance.secretsViaDapr" .) }}
            - { name: MAINTENANCE_S3_SECRET_ACCESS_KEY, value: {{ ternary (include "lance.scopedStorageSecret" (list . .Values.minio.maintenanceAccessKey .Values.minio.maintenanceSecretKey)) .Values.minio.secretKey (not (not $scoped)) | quote }} }
            {{- else }}
            # A secret store is configured → the S3 secret comes ONLY from it at boot; not in pod env (the
            # audit's fix — maintenance is a real S3 consumer that compacts/GCs the lakehouse). Fails closed.
            - { name: MAINTENANCE_SECRETS_FROM_DAPR, value: "true" }
            {{- if $scoped }}
            # THE OTHER HALF OF THE PAIR. `dapr_secret_s3_field` defaults to `minio-secret-key` — the
            # TENANT ROOT's secret — so a scoped access key left on that default is signed with a
            # mismatched pair and every operation fails `SignatureDoesNotMatch`. That is the Ray pair's
            # measured lesson, and the field was already configurable; only the chart had to use it.
            - { name: MAINTENANCE_DAPR_SECRET_S3_FIELD, value: "maintenance-s3-secret-key" }
            {{- end }}
            {{- end }}
            - { name: MAINTENANCE_S3_BUCKET, value: {{ .Values.minio.bucket | quote }} }
            {{- /* The #50 policy registry root defaults to this bucket, matching the catalog's
                   LANCE_REST_ROOT (also .Values.minio.bucket, services.yaml). If LANCE_CONTROL_ROOT ever
                   moves the catalog's registry, set MAINTENANCE_POLICY_ROOT to the same value — a wrong root
                   lists cleanly as "no policies" (the sweep logs compaction_policies_loaded per tick). */}}
            {{- /* EVERY bucket that can hold Lance data must be swept, or its tables accumulate superseded
                   versions + small fragments FOREVER (audit 2026-07-14: the sweep saw exactly ONE bucket,
                   so the medallion zone buckets and every #3-B multi-base data bucket leaked storage
                   silently). Union of: the medallion storage zones (gold can live in its own bucket) and
                   the approved multi-base data bases. Per-warehouse (#3-A) buckets are provisioned at
                   RUNTIME, so they are appended by the operator as tenants are onboarded. */}}
            {{- $extra := list }}
            {{- range $ns, $bkt := .Values.medallion.buckets }}
            {{- if ne $bkt $.Values.minio.bucket }}{{ $extra = append $extra $bkt }}{{ end }}
            {{- end }}
            {{- range .Values.catalog.multibase.dataBases }}
            {{- $extra = append $extra (. | replace "s3://" "" | trimSuffix "/") }}
            {{- end }}
            - { name: MAINTENANCE_S3_EXTRA_BUCKETS, value: {{ $extra | uniq | join "," | quote }} }
            {{- /* PLATFORM buckets — infrastructure the estate creates for ITSELF, which no warehouse
                   record will ever claim. Without them `orphan_buckets` reports each one as drift on
                   every tick forever, and a report whose contract is "clean certifies the estate" can
                   then never be clean. Measured 2026-08-16: `rask-observability`, created by this
                   chart's own minio-mkbucket Job for GreptimeDB's object store, sat in that list.
                   Sourced from `minio.buckets` — the set the operator provisions and that same Job
                   VERIFIES — so the two cannot drift apart. */}}
            - { name: MAINTENANCE_S3_PLATFORM_BUCKETS, value: {{ include "lance.maintenancePlatformBuckets" . | quote }} }
            - { name: MAINTENANCE_S3_REGION, value: "us-east-1" }
            {{- /* The drift reconciler's inputs. It only ever READS: OpenFGA says who, the control-root
                   registries say what exists, object storage holds the bytes. Every one of these mirrors a
                   CATALOG setting and must match it — a divergent fga_root_object reports the estate root as
                   a ghost forever, and a divergent warehouses_enabled reports every namespace as unbound. */}}
            - { name: MAINTENANCE_WAREHOUSES_ENABLED, value: {{ .Values.catalog.warehouses.enabled | default false | quote }} }
            - { name: MAINTENANCE_CONTROL_ROOT, value: {{ .Values.maintenance.controlRoot | default "" | quote }} }
            {{- /* The #50 POLICY registry root. Rendered nowhere until 2026-08-16, so an operator who
                   followed values.yaml's "set both together" had no second key to set and moved only
                   half the reads. A policy registry at the wrong root lists cleanly as EMPTY, so every
                   retention override and legal-hold opt-out silently stops applying. */}}
            - { name: MAINTENANCE_POLICY_ROOT, value: {{ .Values.maintenance.policyRoot | default "" | quote }} }
            {{- if .Values.auth.enabled }}
            - { name: RASK_FGA_ENABLED, value: "true" }
            - { name: RASK_FGA_API_URL, value: "http://{{ include "lance.openfgaHost" . }}:8080" }
            {{- /* Store/model ids are PINNED, never provisioned here — the SAME auth.fgaStoreId the catalog
                   reads and the bootstrap-admin Job grants into, so the store this reports on can never
                   diverge from the store the catalog checks against. A maintenance job that provisioned its
                   own store would read an EMPTY one and report every real tenant as a ghost; unset, the four
                   authz categories report unavailable-with-a-reason, which is the honest answer. */}}
            {{- with .Values.auth.fgaStoreId }}
            - { name: RASK_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.auth.fgaModelId }}
            - { name: RASK_FGA_MODEL_ID, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          {{- /* SIZED FOR THE WORK, not for the planner ([[LH-183]]). `lance.resources` keyed on
             "maintenance" hands back the PLANNER's tier — 512Mi — which is the exact sizing that
             OOMKilled the pod this split exists to unload, so reading it here would move the OOM onto
             a new pod name rather than remove it. `dedicatedWorkers.resources` is the tier the values
             file already declares for this container ("Sized for the WORK, unlike the planner's
             512Mi"), and until now nothing read it. Pinned by
             `tests/unit/test_the_planner_does_not_execute_the_work.py`. */}}
          resources: {{- toYaml $root.Values.maintenance.dedicatedWorkers.resources | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
      {{- include "lance.spreadConstraints" "maintenance-worker" | nindent 6 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
{{- end }}
