apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lance.fullname" . }}-object-store-identities
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  {{- range $component := include "lance.objectStoreIdentities" . | fromJsonArray }}
  {{ include "lance.saName" (list $ $component) }}.json: |
    {{- include "lance.objectStorePolicy" (list $ $component) | nindent 4 }}
  {{- end }}
