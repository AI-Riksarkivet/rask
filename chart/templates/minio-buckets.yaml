{{- if .Values.minio.enabled }}
{{- /* Bucket-init: the ONLY provisioner of the platform buckets, in-cluster or minio.externalEndpoint,
       so each is CREATED and none is waited for (see `minio.buckets` in values.yaml). NOT a hook — see
       "BOOTSTRAP JOBS" in _helpers.tpl: the lakehouse apps need these buckets at startup, and a
       post-install hook fails only after `--wait` blamed something else. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rask.fullname" . }}-minio-mkbucket-{{ include "rask.bootstrapRev" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  # Reap the finished pod. Each revision's job carries a -r<revision> name, so Helm's
  # before-hook-creation delete policy never matches the previous one — without a TTL every
  # `helm upgrade` left another Completed husk behind (14 were sitting in `kubectl get pods`).
  ttlSecondsAfterFinished: 3600
  backoffLimit: 20
  template:
    metadata:
      # The explicit component label is the P4 landmine (see bootstrap-admin.yaml): pods without one
      # are invisible to any component-scoped NetworkPolicy `from` list. Here it is LOAD-BEARING, not just
      # hygiene — minio:9000's ingress admits an enumerated client list ONLY (network-policy.yaml 3d,
      # which names minio-mkbucket), so an unlabeled pod's store-ready wait loops forever under a
      # policy-enforcing CNI and every prod install/upgrade wedges before a bucket exists.
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio-mkbucket
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      {{- /* A FIRST-PARTY IMAGE NEEDS THE ESTATE'S PULL SECRETS, which `minio/mc` never did: it came
             from a public registry, so this Job was the one pod spec that could skip them. Running the
             rask image makes it an ordinary first-party workload and
             `test_a_first_party_pod_can_pull_from_a_private_registry` holds it to the same rule. */}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
      containers:
        - name: mkbucket
          {{- /* THE ESTATE'S OWN S3 SEAM, not a third-party CLI. `minio/mc` refuses ANONYMOUS pulls
                 on every registry this estate can reach — measured 2026-09-24 with the bearer
                 decoded, Docker Hub answers `access: []` and quay.io `actions: []`, both 401 on the
                 manifest — so on a node that pulls fresh this Job never starts and every bucket the
                 lakehouse needs is simply absent ([[XC-075]]). `scripts/ensure_bucket.py` runs out
                 of the rask image, exactly as the backup CronJob runs `control_root_backup.py`, and
                 drives `packages/storage`'s `s3_client`: the same S3 client the fleet uses, in an
                 image no registry can withdraw. Both halves below are plain S3 calls — `mb` is
                 `create_bucket`, `ls` is `head_bucket`.

                 `lance.catalogImage`, not a second name for the same artefact: the catalog family
                 already runs one image under many entrypoints, and naming it again here would be
                 the duplicate-specification defect `test_every_surface_names_the_same_image_for_
                 the_same_component` exists to catch. It also means a side-loaded stack builds
                 nothing extra for this Job. */}}
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.rootlessSecurityContext" 10001 | nindent 10 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          # THE SECRET IS NAMED, NEVER CARRIED — the same `secretKeyRef` the Tenant boots with
          # (credsSecret, templates/secrets.yaml), so the credential never appears in the rendered
          # Job. `packages/storage` reads the canonical `RASK_S3_ENDPOINT_URL` plus the standard AWS
          # pair; `configured_endpoint` owns that resolution order, so nothing here restates it.
          env:
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: minio-secret-key }
            - { name: AWS_ACCESS_KEY_ID, value: {{ .Values.minio.accessKey | quote }} }
            - { name: RASK_S3_ENDPOINT_URL, value: {{ include "lance.s3Endpoint" . | quote }} }
            {{- /* THE LITERAL, as `services.yaml`, both maintenance templates and
                   `_ray-cluster-config.tpl` already spell it. A `minio.region` value would be a fifth
                   spelling of one constant nothing in this estate varies. */}}
            - { name: AWS_REGION, value: "us-east-1" }
          command:
            - python
            - /srv/ensure_bucket.py
            {{- $buckets := concat (list .Values.minio.bucket) (splitList "," (include "lance.platformBuckets" .)) }}
            {{- range $ns, $bkt := .Values.medallion.buckets }}
            {{- if $bkt }}
            {{- $buckets = append $buckets $bkt }}
            {{- end }}
            {{- end }}
            {{- range compact $buckets | uniq }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
