{{- if .Values.minio.enabled }}
# Bucket-init — the provisioning Job for the ONE object store
# (templates/minio.yaml, S3 Service `<tenant>-io:9000` = `lance.minioHost`). RESOLVED per
# P4's store unification holds; LH-133 changed WHICH store. The buckets are created by this Job
# rather than declared on a CR, because a StatefulSet has no `spec.buckets` field — which also removes
# the operator-reconcile failure mode the timeout below was written for. The first-party Deployment and
# its Service that used to live in this file are DELETED. The Tenant provisions the
# static platform bucket set natively (spec.buckets = minio.buckets); this Job covers what a static
# CR list cannot express — the values-driven medallion zone buckets (a map whose unset entries fall
# back to minio.bucket) and the observability toggle — and it also runs against
# minio.externalEndpoint (managed S3, where no Tenant exists). Idempotent by construction: the
# script heads each bucket before creating it.
#
# It is ALSO the estate's only detector for a Tenant that silently refused to provision — see the
# VERIFY step in the container script below (live-proof 2026-07-28, defect 3).
#
# NOT a hook — see "BOOTSTRAP JOBS" in _helpers.tpl. Two reasons: the whole data plane's buckets are a
# startup dependency of the lakehouse apps, and a post-install hook's failure arrives AFTER `--wait`
# has already blamed something else, which is exactly how a blocked Tenant stayed invisible.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rask.fullname" . }}-minio-mkbucket-{{ include "rask.bootstrapRev" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  # Reap the finished pod. Each revision's job carries a -r<revision> name, so Helm's
  # before-hook-creation delete policy never matches the previous one — without a TTL every
  # `helm upgrade` left another Completed husk behind (14 were sitting in `kubectl get pods`).
  ttlSecondsAfterFinished: 3600
  backoffLimit: 20
  template:
    metadata:
      # The explicit component label is the P4 landmine (see bootstrap-admin.yaml): pods without one
      # are invisible to any component-scoped NetworkPolicy `from` list. Here it is LOAD-BEARING, not just
      # hygiene — minio:9000's ingress admits an enumerated client list ONLY (network-policy.yaml 3d,
      # which names minio-mkbucket), so an unlabeled pod's store-ready wait loops forever under a
      # policy-enforcing CNI and every prod install/upgrade wedges before a bucket exists.
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio-mkbucket
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      {{- /* A FIRST-PARTY IMAGE NEEDS THE ESTATE'S PULL SECRETS, which `minio/mc` never did: it came
             from a public registry, so this Job was the one pod spec that could skip them. Running the
             rask image makes it an ordinary first-party workload and
             `test_a_first_party_pod_can_pull_from_a_private_registry` holds it to the same rule. */}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
      containers:
        - name: mkbucket
          {{- /* THE ESTATE'S OWN S3 SEAM, not a third-party CLI. `minio/mc` refuses ANONYMOUS pulls
                 on every registry this estate can reach — measured 2026-09-24 with the bearer
                 decoded, Docker Hub answers `access: []` and quay.io `actions: []`, both 401 on the
                 manifest — so on a node that pulls fresh this Job never starts and every bucket the
                 lakehouse needs is simply absent ([[XC-075]]). `scripts/ensure_bucket.py` runs out
                 of the rask image, exactly as the backup CronJob runs `control_root_backup.py`, and
                 drives `packages/storage`'s `s3_client`: the same S3 client the fleet uses, in an
                 image no registry can withdraw. Both halves below are plain S3 calls — `mb` is
                 `create_bucket`, `ls` is `head_bucket`.

                 `lance.catalogImage`, not a second name for the same artefact: the catalog family
                 already runs one image under many entrypoints, and naming it again here would be
                 the duplicate-specification defect `test_every_surface_names_the_same_image_for_
                 the_same_component` exists to catch. It also means a side-loaded stack builds
                 nothing extra for this Job. */}}
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.rootlessSecurityContext" 10001 | nindent 10 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          # THE SECRET IS NAMED, NEVER CARRIED — the same `secretKeyRef` the Tenant boots with
          # (credsSecret, templates/secrets.yaml), so the credential never appears in the rendered
          # Job. `packages/storage` reads the canonical `RASK_S3_ENDPOINT_URL` plus the standard AWS
          # pair; `configured_endpoint` owns that resolution order, so nothing here restates it.
          env:
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: minio-secret-key }
            - { name: AWS_ACCESS_KEY_ID, value: {{ .Values.minio.accessKey | quote }} }
            - { name: RASK_S3_ENDPOINT_URL, value: {{ include "lance.s3Endpoint" . | quote }} }
            {{- /* THE LITERAL, for the reason `_ray-cluster-config.tpl` states: a `minio.region`
                   value would be another spelling of one constant nothing in this estate varies. */}}
            - { name: AWS_REGION, value: "us-east-1" }
          command:
            - python
            - /srv/ensure_bucket.py
            {{- /* CREATE: the values-driven buckets a static CR list cannot express. */}}
            - {{ .Values.minio.bucket | quote }}
            {{- if .Values.observability.enabled }}
            - {{ .Values.observability.bucket | quote }}
            {{- end }}
            {{- range $ns, $bkt := .Values.medallion.buckets }}
            {{- if and $bkt (ne $bkt $.Values.minio.bucket) }}
            - {{ $bkt | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.minio.externalEndpoint }}
            {{- /* CREATE (external S3): with no Tenant, nothing else provisions the static set. */}}
            {{- range .Values.minio.buckets }}
            - {{ . | quote }}
            {{- end }}
            {{- else }}
            {{- /* VERIFY, never create: these are the operator's (minio.buckets -> the Tenant's
                   spec.buckets). live-proof 2026-07-28 defect 3 — an operator refused to reconcile
                   its Tenant and NOTHING said so, because this Job only ever created its OWN
                   buckets and went green. Creating them here would paper over a Tenant that is
                   still broken for everything else it owns. The script's own `_verify` carries the
                   rest of that reasoning and the diagnosis it prints. */}}
            - --verify
            {{- range .Values.minio.buckets }}
            - {{ . | quote }}
            {{- end }}
            - --verify-timeout
            - {{ .Values.minio.bucketVerifyTimeoutSeconds | quote }}
            {{- /* THE DIAGNOSIS TRAVELS WITH THE FAILURE. The script knows S3; only this chart knows
                   which StatefulSet to describe and which value is the usual cause, so the guidance
                   is passed in rather than taught to an S3 helper. It is the same text the shell
                   version echoed, and `test_the_bucket_init_verifies_the_buckets_the_operator_owns`
                   holds the Job to carrying it. */}}
            - --missing-hint
            - |
              !! These come from values minio.buckets, which render into the Tenant's spec.buckets.
              !! This Job deliberately does NOT create them: a failure here means the operator did not
              !! reconcile the Tenant, and creating them would hide that for everything else it owns.
              !! Diagnose with:
              !!   kubectl describe statefulset {{ include "lance.minioHost" . }}
              !!   kubectl logs -l app.kubernetes.io/component=minio
              !! The usual cause is a wedged StatefulSet update ('Reconcile is blocked by user-fixable
              !! configuration') — e.g. a storageClass the cluster does not have (minio.storageClass
              !! defaults to "" = the cluster default) or an immutable field changed under the operator.
              !! Raise minio.bucketVerifyTimeoutSeconds if this store is merely slow.
            {{- end }}
{{- end }}
