{{- /*
   Infra-tier credentials Secret — for components that OWN their credential (the AGE Postgres + MinIO
   servers) or are third-party (the OpenFGA migrate Job), which can't consume the Dapr secret store the way
   the first-party app services (catalog, lineage, maintenance) do. Holding these in a k8s Secret referenced
   via secretKeyRef keeps the sensitive values out of plaintext pod env-VALUES / Job args / `kubectl
   describe` / `helm get manifest` — the audit's 'same secret still recoverable from other pods' finding.

   This is the standard k8s secret-management baseline: in production these Secret values are populated by
   the operator from OpenBao (external-secrets operator / the OpenBao agent injector), mirroring the
   operator-supplied OpenBao prod vaultToken (dapr-component.yaml). The plaintext .Values defaults below are
   the DEV seed only; a prod overlay supplies them out-of-band or via a SealedSecret/ExternalSecret.

   Created with these (dev) values UNLESS externalSecrets.enabled — then the external-secrets operator owns
   the same-named Secret, syncing it FROM OpenBao/Vault (templates/external-secrets.yaml), so no plaintext
   secret value ships in the chart at all. Otherwise the consuming server/Job templates (each gated by their
   own *.enabled) still consume it via secretKeyRef, never as a plaintext pod-spec value.
*/}}
{{- if not .Values.externalSecrets.enabled }}
{{- /* The refusal that stops the dev values below reaching a real deployment is in
     `prod-credentials.yaml`, not here: it must fire whether or not this Secret renders, and it
     answers one question — "is this a real deployment?" — for every well-known value at once. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lance.fullname" . }}-infra-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
     The AGE Postgres password — owned by the AGE server, also needed by the OpenFGA datastore.
  */}}
  postgres-password: {{ .Values.age.password | quote }}
  {{- /*
     The object store's ROOT credential, both halves — owned by the MinIO server itself. The access key
     joins the secret here because the store is a StatefulSet reading `secretKeyRef` (templates/
     minio.yaml) rather than an operator Tenant that carried its own credsSecret; one object holding the
     pair is what stops the two halves drifting to different sources, which is the failure that made a
     scoped identity sign as root (see the compute-plane note below).
  */}}
  minio-access-key: {{ .Values.minio.accessKey | quote }}
  minio-secret-key: {{ .Values.minio.secretKey | quote }}
  {{- /*
     THE COMPUTE PLANE'S SCOPED PAIR, on THIS object rather than one of its own — the Ray pods have no
     daprd and cannot call `/v1.0/secrets/*`, so they take secrets by `secretKeyRef`, and this is the
     object `external-secrets.yaml` already syncs from OpenBao. A second Secret beside it would be a
     second source, and on the prod path it would be the one ESO does not fill.
     THE SECRET IS DERIVED, never `| default minio.secretKey`. That fallback published the store's ROOT
     credential under a scoped identity's name, because `rayComputeSecretKey` ships empty and the
     default always won. Measured live 2026-09-11 by hash: `ray-compute-secret-key` and
     `minio-secret-key` were byte-identical in this very object. `minio-scoped-users.yaml` CREATES
     `rask-ray-compute` with the DERIVED secret, so the published pair could never match — a consumer
     either signed as root, defeating the scoping entirely, or failed SignatureDoesNotMatch.

     Same expression as `openbao.yaml` seeds, so the ESO-on and ESO-off paths agree by construction.
  */}}
  ray-compute-access-key: {{ .Values.minio.rayComputeAccessKey | default .Values.minio.accessKey | quote }}
  ray-compute-secret-key: {{ include "lance.scopedStorageSecret" (list . .Values.minio.rayComputeAccessKey .Values.minio.rayComputeSecretKey) | quote }}
  {{- /*
     The full OpenFGA datastore DSN — so the migrate Job carries no plaintext password in its args.
  */}}
  openfga-datastore-uri: "postgres://{{ .Values.age.user }}:{{ .Values.age.password }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.openfgaDb }}?sslmode=disable"
{{- if .Values.minio.oidc.enabled }}
  {{- /*
     The Dex client secret the object store presents for STS AssumeRoleWithWebIdentity. It belongs to THIS tier,
     not the Dapr one, for the reason in the header: the consumer is the MinIO server — a third-party
     operator-managed Tenant, with no daprd sidecar and no way to reach the Dapr secret store. It rode
     `value:` on the Tenant CR until 2026-08-09, outside every guard the estate applies to its siblings,
     which put it in `kubectl get tenant -o yaml` and `helm get manifest` for anyone with read on the CR.
  */}}
  dex-client-secret: {{ .Values.dex.clientSecret | quote }}
{{- end }}
{{- end }}
