# Infra-tier credentials Secret — for components that OWN their credential (the AGE Postgres + RustFS
# servers) or are third-party (the OpenFGA migrate Job), which can't consume the Dapr secret store the way
# the first-party app services (catalog, lineage, maintenance) do. Holding these in a k8s Secret referenced
# via secretKeyRef keeps the sensitive values out of plaintext pod env-VALUES / Job args / `kubectl
# describe` / `helm get manifest` — the audit's 'same secret still recoverable from other pods' finding.
#
# This is the standard k8s secret-management baseline: in production these Secret values are populated by
# the operator from OpenBao (external-secrets operator / the OpenBao agent injector), mirroring the
# operator-supplied OpenBao prod vaultToken (dapr-component.yaml). The plaintext .Values defaults below are
# the DEV seed only; a prod overlay supplies them out-of-band or via a SealedSecret/ExternalSecret.
#
# Created with these (dev) values UNLESS externalSecrets.enabled — then the external-secrets operator owns
# the same-named Secret, syncing it FROM OpenBao/Vault (templates/external-secrets.yaml), so no plaintext
# secret value ships in the chart at all. Otherwise the consuming server/Job templates (each gated by their
# own *.enabled) still consume it via secretKeyRef, never as a plaintext pod-spec value.
{{- if not .Values.externalSecrets.enabled }}
{{- /* The refusal that stops the dev values below reaching a real deployment is in
     `prod-credentials.yaml`, not here: it must fire whether or not this Secret renders, and it
     answers one question — "is this a real deployment?" — for every well-known value at once. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lance.fullname" . }}-infra-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The AGE Postgres password — owned by the AGE server, also needed by the OpenFGA datastore.
  postgres-password: {{ .Values.age.password | quote }}
  # The RustFS S3 root secret — owned by the RustFS server (the bucket's root credential).
  rustfs-secret-key: {{ .Values.rustfs.secretKey | quote }}
  # THE COMPUTE PLANE'S SCOPED PAIR, on THIS object rather than one of its own — the Ray pods have no
  # daprd and cannot call `/v1.0/secrets/*`, so they take secrets by `secretKeyRef`, and this is the
  # object `external-secrets.yaml` already syncs from OpenBao. A second Secret beside it would be a
  # second source, and on the prod path it would be the one ESO does not fill.
  # THE SECRET IS DERIVED, never `| default rustfs.secretKey`. That fallback published the RustFS ROOT
  # credential under a scoped identity's name, because `rayComputeSecretKey` ships empty and the
  # default always won. Measured live 2026-09-11 by hash: `ray-compute-secret-key` and
  # `rustfs-secret-key` were byte-identical in this very object. `rustfs-scoped-users.yaml` CREATES
  # `rask-ray-compute` with the DERIVED secret, so the published pair could never match — a consumer
  # either signed as root, defeating the scoping entirely, or failed SignatureDoesNotMatch.
  #
  # Same expression as `openbao.yaml` seeds, so the ESO-on and ESO-off paths agree by construction.
  ray-compute-access-key: {{ .Values.rustfs.rayComputeAccessKey | default .Values.rustfs.accessKey | quote }}
  ray-compute-secret-key: {{ include "lance.scopedStorageSecret" (list . .Values.rustfs.rayComputeAccessKey .Values.rustfs.rayComputeSecretKey) | quote }}
{{- if .Values.auth.dedicatedServiceCredentials }}
  # THE TRAINER'S DEDICATED CREDENTIAL, for the same reason `ray-compute-*` sits here: the Ray head
  # runs no daprd, so it cannot read `service-token-<identity>` out of the Dapr secret store the way
  # every first-party service does (`medallion.core.config.dedicated_token_for`). It takes it by
  # `secretKeyRef` off this object, which `external-secrets.yaml` already syncs from OpenBao.
  #
  # Rendered only with the flag on, because only then is the trainer PRIVILEGED at lineage's door
  # (`services.yaml` gates `LINEAGE_PRIVILEGED_SUBJECTS` on the same value). With the flag off the
  # trainer is an ordinary subject and the shared APP_API_TOKEN is the correct credential for one —
  # a key rendered anyway would be a second, unused copy of a secret.
  #
  # Through the SAME helper `openbao.yaml` seeds with: the door compares the two with
  # `secrets.compare_digest`, and a near-miss is `401 the presented credential may not claim
  # 'service-trainer'` — which is what the estate served on every training run until this landed,
  # while the job went on publishing its model and exiting SUCCEEDED.
  service-token-{{ .Values.medallion.train.trainerIdentity }}: {{ include "lance.dedicatedServiceToken" (list . .Values.medallion.train.trainerIdentity) | quote }}
  # THE WEB BFF'S OWN CREDENTIAL, here for the same reason the trainer's is: seven zone pods have no
  # daprd and cannot call `/v1.0/secrets/*`. Unlike the trainer this needs no service change — the BFF
  # already reads `LINEAGE_SERVICE_TOKEN` from env, so which secret fills it IS the client half.
  service-token-{{ .Values.frontend.serviceIdentity }}: {{ include "lance.dedicatedServiceToken" (list . .Values.frontend.serviceIdentity) | quote }}
  # THE STAGE LANES' OWN CREDENTIALS, for the third pod class that has no daprd: the Ray head, which
  # runs the train lane AND every stage lane from the SAME pod. A stage job authenticates as its
  # submitting stage runner's `fga_service_identity` (`service-bronze-to-silver`, `service-silver-to-gold`,
  # `service-media-to-silver`) — not as the producer, which never runs there — while the pod carried
  # only `service-token-service-trainer`.
  #
  # LATENT TODAY, NOT FIRING: `stage_lineage_url` is empty by default and this estate has not wired it
  # (verified on all three running stage runners 2026-09-08 — `MEDALLION_STAGE_LINEAGE_URL` unset), so
  # `emit()` returns early and the stage lanes post nothing at all. The train lane is the one identity
  # emitting today and its token is the one mounted, which is why nothing is failing. What the door
  # does with a mismatch was measured directly, replaying one POST twice from inside the Ray head:
  #
  #     service-trainer  -> 201
  #     a second subject -> 401 the presented credential may not claim '<subject>'
  #
  # and the job writes its data and exits SUCCEEDED either way — the trainer incident's exact shape,
  # one lane over. So the credentials land before the lane is wired, not after it silently loses its
  # provenance.
  {{- range .Values.medallion.stageRunners }}
  service-token-{{ .serviceIdentity }}: {{ include "lance.dedicatedServiceToken" (list $ .serviceIdentity) | quote }}
  {{- end }}
{{- end }}
  # The full OpenFGA datastore DSN — so the migrate Job carries no plaintext password in its args.
  openfga-datastore-uri: "postgres://{{ .Values.age.user }}:{{ .Values.age.password }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.openfgaDb }}?sslmode=disable"
{{- if .Values.rustfs.oidc.enabled }}
  # The Dex client secret RustFS presents for STS AssumeRoleWithWebIdentity. It belongs to THIS tier,
  # not the Dapr one, for the reason in the header: the consumer is the RustFS server — a third-party
  # operator-managed Tenant, with no daprd sidecar and no way to reach the Dapr secret store. It rode
  # `value:` on the Tenant CR until 2026-08-09, outside every guard the estate applies to its siblings,
  # which put it in `kubectl get tenant -o yaml` and `helm get manifest` for anyone with read on the CR.
  dex-client-secret: {{ .Values.dex.clientSecret | quote }}
{{- end }}
{{- end }}
