{{- if .Values.networkPolicy.enabled }}
# ============================================================================================
# Network-isolation layer (Batch 9, 2026-07-11 — the security audit's "biggest gap": L3 was
# effectively open; openbao was reachable by ANY pod). Implements the audit's fix order exactly:
#   (1) default-deny Ingress+Egress for every pod in the namespace;
#   (2) the kube-dns egress allow ships IN THIS SAME FILE (default-deny egress without it bricks
#       name resolution — the audit's named footgun);
#   (3) targeted ingress allows for the guarded stores (openbao ← secret-consuming app pods only;
#       age-postgres:5432 ← its real clients; rustfs:9000 ← the data plane; nats ← 4222 intra-namespace
#       + 8222 admin-only, other ports closed) — every OTHER pod gets plain intra-namespace ingress,
#       EXCLUDING the guarded stores so the targeted lists stay exclusive (NetworkPolicies are
#       additive: the general allow must NOT cover the stores);
#   (4) values-prod flips `networkPolicy.enabled` — the LIVE verification runbook is todo_fable
#       §7a (all pods Ready, e2e suites green, and a negative probe: curl openbao:8200 from the
#       web pod must time out).
# Egress posture (tier 1): intra-namespace open + DNS + api-server (Dapr control plane needs it);
# the INGRESS rules do the guarding — a connection needs BOTH the source's egress and the
# destination's ingress to allow. Externalized backends (S3/NATS/OTLP off-cluster) need
# `networkPolicy.extraEgress` entries. NOTE: requires a policy-enforcing CNI (Calico/Cilium);
# kind's default CNI ignores NetworkPolicy entirely. kubectl port-forward traffic enters via the
# kubelet (not the CNI data path) and keeps working under default-deny on mainstream CNIs.
# ============================================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-default-deny
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# (2) DNS — in the SAME change as default-deny egress, per the audit. Both protocols: plain lookups
# are UDP; large responses retry over TCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-dns
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Egress within the namespace (all pods): app→store, sidecar→NATS/placement/sentry, jobs→stores.
# The guarded stores' INGRESS policies below are what actually gates who reaches them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-egress-intra-namespace
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
---
# API-server egress (namespace-wide): the Dapr control plane (operator/injector/sentry/placement)
# watches CRDs and leases; external-secrets (when enabled) reconciles via webhooks. Ports only —
# the api-server's IP is cluster-specific.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-apiserver-egress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
{{- with .Values.networkPolicy.extraEgress }}
---
# Deployment-specific egress (externalized S3/NATS/OTLP endpoints) — values-supplied, verbatim.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" $ }}-allow-extra-egress
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress: {{- toYaml . | nindent 4 }}
{{- end }}
---
# (3a) General intra-namespace INGRESS — every pod EXCEPT the guarded stores (additive-allow
# semantics: including them here would void their exclusive client lists below).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-ingress-intra-namespace
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [openbao, age, rustfs, nats] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# (3b) openbao:8200 — THE crown jewel (the audit's headline: "reachable by any pod"). Only the
# secret-consuming app pods' daprd sidecars may connect: catalog, lineage, compaction, the
# medallion producer (lance-ray), every mover, and (DAPRIFY 2026-07-27) the state-store-scoped
# apps — their daprd resolves the state store's connectionString through the lance-secrets
# component at boot (dapr-component.yaml derives the secret-store scope from stateStore.scopes the
# same way), so blocking them here wedges the sidecar on component init. The newly-sidecared fleet/
# controlplane pods load NO openbao-backed component and stay excluded: web/gateway/dex/rustfs/age
# can NEVER reach it. External-secrets (off-namespace, when enabled) needs an entry in
# networkPolicy.openbaoExtraFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-openbao
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: openbao }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                {{- /* stateStore.scopes is APPENDED + uniq'd (app-id == component label for these
                     pods — media.yaml keys them identically), so this list and the secret-store
                     component's scope (dapr-component.yaml) cannot drift. */}}
                {{- $openbaoClients := list "catalog" "lineage" "compaction" "lance-ray" }}
                {{- range .Values.medallion.movers }}
                {{- $openbaoClients = append $openbaoClients .name }}
                {{- end }}
                {{- if and .Values.dapr.sidecars .Values.stateStore.enabled }}
                {{- $openbaoClients = concat $openbaoClients .Values.stateStore.scopes }}
                {{- end }}
                values:
                  {{- range ($openbaoClients | uniq) }}
                  - {{ . }}
                  {{- end }}
        {{- with .Values.networkPolicy.openbaoExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8200 }
---
# (3c) age-postgres:5432 — the lineage graph + the OpenFGA datastore + the Dapr state store
# (dapr-statestore.yaml rides this same instance). Clients: lineage, openfga (subchart pods carry
# app.kubernetes.io/name=openfga), the openfga-migrate job, the pg backup job, the catalog (per the
# audit's client list), and (DAPRIFY 2026-07-27) the state-store-scoped apps — daprd's
# state.postgresql component connects DIRECTLY to this postgres, so those pods' sidecars are real
# 5432 clients (blocked = the state store never loads and actor hosting silently disables).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-age-postgres
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: age }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                {{- /* stateStore.scopes appended + uniq'd, same derivation as the openbao rule above. */}}
                {{- $ageClients := list "lineage" "catalog" "openfga-migrate" "backup-pg" }}
                {{- if and .Values.dapr.sidecars .Values.stateStore.enabled }}
                {{- $ageClients = concat $ageClients .Values.stateStore.scopes }}
                {{- end }}
                values:
                  {{- range ($ageClients | uniq) }}
                  - {{ . }}
                  {{- end }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: openfga }
      ports:
        - { protocol: TCP, port: {{ .Values.age.port }} }
---
# (3d) rustfs:9000 — the lakehouse bytes. Clients: the data-plane services + GreptimeDB (its
# object storage) + the snapshot backup job. The ray-lance demo pods live outside the release's
# labels — add them via networkPolicy.rustfsExtraFrom (default provided in values).
# ⚠ VERIFY ON A POLICY-ENFORCING CNI (P4 netpol recount): the store is now the rustfs-operator
# Tenant (lance-ns-merge P4 "operator Tenant wins"), whose pods carry OPERATOR-set labels, not this
# chart's. If the operator does not stamp `app.kubernetes.io/component: rustfs` on the Tenant pods,
# this podSelector matches nothing and default-deny blocks all S3 ingress — recheck the live pod
# labels and widen the selector before enabling networkPolicy in prod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-rustfs
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: rustfs }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - catalog
                  - lineage
                  - compaction
                  - lance-ray
                  - rustfs-backup
                  - backup-pg # the pg-backup CronJob uploads its dumps to the lakehouse (_backups/pg/)
                  - rustfs-mkbucket # the bucket-provisioning hook Job — blocked, no install ever gets buckets
                  # rask's own S3 clients (audit 2026-07-27 defect 5: absent, so prod default-deny cut
                  # the fleet off object storage). Labels are fleet.yaml's `app.kubernetes.io/component:
                  # <name>`. core-api + orchestrator run the `core` package's sync/discover S3 reconcile
                  # (both waitFor minio/postgres over the same batches table); search-api serves S3
                  # thumbnails; volumes-api is the S3/IIIF image+ALTO proxy.
                  - core-api
                  - orchestrator
                  - search-api
                  - volumes-api
                  {{- range .Values.medallion.movers }}
                  - {{ .name }}
                  {{- end }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: greptimedb-standalone }
        {{- if .Values.ray.enabled }}
        # The HTR runner executes inside the KubeRay-managed RayService pods (PageLoader reads the
        # image cache, AltoWriter writes ALTO — s3://images-batch*). The chart's head template stamps
        # no labels of its own; KubeRay stamps its `ray.io/is-ray-node: "yes"` marker on every Ray
        # pod, so select that (component-label style can't reach operator-created pods).
        - podSelector:
            matchLabels: { ray.io/is-ray-node: "yes" }
        {{- end }}
        {{- with .Values.networkPolicy.rustfsExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.rustfs.port }} }
---
# The front door: gateway + web + the P5 micro-frontend zones accept ingress from ANYWHERE
# (NodePort/Ingress/port-forward) — they are the intended entry points and carry their own L7 guards (OIDC
# on the apps behind). The zones are the north-south edge now (the Ingress path-routes /<zone> → web-<zone>),
# so they MUST be admitted here or a policy-enforcing CNI (prod) drops all Ingress→zone traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-front-door
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - gateway
          {{- if .Values.frontend.enabled }}
          {{- range .Values.frontend.apps }}
          - web-{{ .name }}
          {{- end }}
          {{- end }}
  policyTypes: [Ingress]
  ingress:
    - {}
---
# (3e) nats:8222 — the NATS monitoring endpoint (varz/connz/jsz), surfaced in the ops view that now
# lives at /lakehouse/admin. NATS is on the (3a) exclusion list, so the two nats rules here are its
# ONLY ingress: this one admits the 8222 monitor port from the LAKEHOUSE zone pods alone; (3f) below
# admits client traffic on 4222. Selector mirrors the subchart-pod idiom used for greptimedb above;
# component=nats (not just name) so nats-box is not a target.
#
# This said web-admin until 2026-07-25. The 7→4 zone merge deleted that component, so the rule
# selected NOTHING and the ops view could not reach varz/jsz in prod — a default-deny netpol fails
# CLOSED and silently, which is why nobody noticed: the only symptom is an empty panel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-nats-monitor
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: web-lakehouse }
      ports:
        - { protocol: TCP, port: 8222 }
---
# (3f) nats:4222 — the client port. Admitted from ANY intra-namespace pod, port-scoped, and honestly so:
# the legitimate clients are the daprd SIDECARS, which live inside every dapr.io/enabled app pod
# (gateway, catalog, lineage, compaction, lance-ray, each medallion mover) plus the nats-box hook Jobs
# (stream provision + DLQ tooling) — i.e. nearly every first-party pod in the namespace, and the set
# follows the dapr.io/enabled ANNOTATION, which no label selector can see. Enumerating component labels
# would restate that near-total list and silently strand the next sidecar carrier (a wedged bus, not a
# security win), so the deliberate shape is pod-open/port-closed. The isolation gained vs the old (3a)
# blanket allow is the PORTS: 6222 (cluster routes) + 7422 (leafnodes) are now unreachable, and 8222 is
# admin-only via (3e).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-nats-clients
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 4222 }
---
# The original lance-ray ingress restriction (pre-Batch-9, kept): /produce is a direct operator
# trigger — in-release pods only, defense-in-depth on top of require_dapr_token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-lance-ray
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: lance-ray
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: {{ .Values.medallion.port }} }
{{- end }}
