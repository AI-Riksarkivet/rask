{{- if .Values.networkPolicy.enabled }}
{{- $platform := include "lance.platformEgress" . | fromJsonArray }}
{{- $unstated := list }}
{{- range $platform }}{{- if not .rules }}{{- $unstated = append $unstated (printf "%s: %s, dialed by %s" .value .reaches (join ", " .components)) }}{{- end }}{{- end }}
{{- if $unstated }}
{{- fail (printf "networkPolicy.enabled denies every egress the chart does not state, and these platform endpoints have none, so the pods that dial them reach nothing. State each as NetworkPolicy egress rules ({to, ports}) naming its addresses:\n  - %s" (join "\n  - " $unstated)) }}
{{- end }}
# ============================================================================================
# Network-isolation layer (Batch 9, 2026-07-11 — the security audit's "biggest gap": L3 was
# effectively open; openbao was reachable by ANY pod). Implements the audit's fix order exactly:
#   (1) default-deny Ingress+Egress for every pod in the namespace;
#   (2) the kube-dns egress allow ships IN THIS SAME FILE (default-deny egress without it bricks
#       name resolution — the audit's named footgun);
#   (3) targeted allows for the guarded stores (the secret store ← the pods whose sidecar reads it,
#       as ingress on the dev store and egress to the platform's; age-postgres:5432 ← its real clients; the object store:9000 ← the data plane; nats ← 4222 intra-namespace
#       only, other ports closed) — every OTHER pod gets plain intra-namespace ingress,
#       EXCLUDING the guarded stores so the targeted lists stay exclusive (NetworkPolicies are
#       additive: the general allow must NOT cover the stores);
#   (4) values-prod flips `networkPolicy.enabled` — the LIVE verification runbook is todo_fable
#       §7a (all pods Ready, e2e suites green, and a negative probe: a request to the secret store
#       from a pod outside its client list must time out).
# Egress posture (tier 1): intra-namespace open + DNS + the Dapr control plane; the INGRESS rules do
# the guarding — a connection needs BOTH the source's egress and the destination's ingress to allow.
# Every egress rule names its peers: each endpoint the platform serves outside the namespace (`lance.platformEgress`:
# the API server, OpenFGA, the secret store, the telemetry backend, and on a real deployment the S3, the bus and the
# IdP) takes rules the platform states, for exactly the pods that dial it, and a render that leaves one unstated is
# refused above, in one message naming every one. NOTE: requires a policy-enforcing CNI (Calico/Cilium);
# kind's default CNI ignores NetworkPolicy entirely. kubectl port-forward traffic enters via the
# kubelet (not the CNI data path) and keeps working under default-deny on mainstream CNIs.
# ============================================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-default-deny
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# (2) DNS — in the SAME change as default-deny egress, per the audit. Both protocols: plain lookups
# are UDP; large responses retry over TCP. Every egress allow leaves out the console's pod: its static
# server dials nothing, so it keeps the default-deny's empty egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-dns
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [console] }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Egress within the namespace (every pod but the console's): app→store, sidecar→NATS/placement/sentry, jobs→stores.
# The guarded stores' INGRESS policies below are what actually gates who reaches them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-egress-intra-namespace
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [console] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
{{- range $platform }}
---
# {{ .reaches }}: only the pods that dial it, to the peers the platform states ({{ .value }}).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" $ }}-allow-{{ .name }}-egress
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: {{- toYaml .components | nindent 10 }}
  policyTypes: [Egress]
  egress: {{- include "lance.egressRules" (list .value .rules .reaches) | nindent 4 }}
{{- end }}
{{- if .Values.dapr.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-dapr-control-plane-egress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [console] }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.dapr.controlPlaneNamespace }} }
{{- end }}
{{- with .Values.networkPolicy.extraEgress }}
---
# Deployment-specific egress to an endpoint no platform row names (e.g. the platform's Postgres when OpenFGA runs in the
# chart) — values-supplied, verbatim.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" $ }}-allow-extra-egress
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [console] }
  policyTypes: [Egress]
  egress: {{- include "lance.egressRules" (list "networkPolicy.extraEgress" . "the external backend the rule is for") | nindent 4 }}
{{- end }}
---
# (3a) General intra-namespace INGRESS — every pod EXCEPT the guarded stores (additive-allow
# semantics: including them here would void their exclusive client lists below).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-ingress-intra-namespace
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [openbao, age, rustfs, nats, authorization-controller] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
{{- if .Values.openbao.enabled }}
---
# (3b) openbao:8200, the development store (the openbao fixture's pod): only the pods whose sidecar reads it, by their
# component labels (`lance.secretReaderComponents`: the apps the lance-secrets component is scoped to, and maintenance's
# worker pods, which run under maintenance's app id with a label of their own), and the store's own pods, whose seed
# reads the outgoing pod through the Service. External-secrets
# (off-namespace) needs an entry in networkPolicy.openbaoExtraFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-openbao
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: openbao }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- range (append (splitList "," (include "lance.secretReaderComponents" .) | compact) "openbao" | uniq) }}
                  - {{ . }}
                  {{- end }}
        {{- with .Values.networkPolicy.openbaoExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8200 }
{{- end }}
{{- if .Values.openfga.enabled }}
---
# (3b') openfga:8080/8081 — the authorization store, which authorizes none of its callers ([[LH-442]]): any token it
# admits may write any tuple. Only the tuple writers reach its API (the catalog, `lance.fgaWriters`, and the hook that
# publishes the model); every other service asks the catalog's doors. The Collector reaches the metrics port alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-openfga
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: openfga, app.kubernetes.io/component: authorization-controller }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- range (concat (include "lance.fgaWriters" . | splitList " ") (list "openfga-model")) }}
                  - {{ . }}
                  {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
    {{- if .Values.observability.enabled }}
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: otel-collector }
      ports:
        - { protocol: TCP, port: 2112 }
    {{- end }}
{{- end }}
{{- if .Values.age.enabled }}
---
# (3c) age-postgres:5432 — the OpenFGA datastore. Clients: openfga (subchart pods carry
# app.kubernetes.io/name=openfga), the openfga-migrate job and the pg backup job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-age-postgres
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: age }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In

                {{- $ageClients := list "openfga-migrate" "backup-pg" }}

                values:
                  {{- range ($ageClients | uniq) }}
                  - {{ . }}
                  {{- end }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: openfga }
      ports:
        - { protocol: TCP, port: {{ .Values.age.port }} }
{{- end }}
---
# (3d) the object store:9000 — the lakehouse bytes. Clients: every pod holding a store session (`lance.objectStoreClients`,
# the same pods the platform's S3 is reached from), and the two that configure the development store with its root: the
# provisioning hook and the store fixture's bucket-events Job. A client outside the release's labels is added via
# networkPolicy.objectStoreExtraFrom.
# The development store (the rustfs fixture) stamps this component label on its pods; a managed S3 runs outside the
# namespace and needs no rule. RustFS serves S3, its admin API and internode RPC on this one port, so the rule
# cannot split them: the admin plane is guarded by IAM (no `admin:*` on any rask identity, root held only by the
# provisioning hook and the fixture's own Job), not by the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-object-store-ingress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: rustfs }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: {{- toYaml (concat (include "lance.objectStoreClients" . | fromJsonArray) (list "object-store-provisioning" "bucket-events")) | nindent 18 }}
                  # A client reading a governed table on the credential the catalog vends it (a client's release, an
                  # engine's workers, a user's pipeline) is admitted by
                  # `networkPolicy.objectStoreExtraFrom`, by a selector its deployment states.
        {{- with .Values.networkPolicy.objectStoreExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.objectStore.port }} }
---
# The services the cluster route publishes (`rask.apiRoutes`) accept the Gateway's traffic on their app
# port and nothing else, from anywhere: the Gateway's data plane lives in the platform's
# namespace, and every one of these services authenticates each request itself. The port is the bound:
# daprd's ports on the same pod stay intra-namespace only. The console's static server is admitted
# the same way, on its one port.
{{- range $row := include "rask.apiRoutes" . | fromJsonArray }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" $ }}-edge-{{ $row.component }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: {{ $row.component }} }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ $row.port }} }
---
{{- end }}
{{- if .Values.console.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-edge-console
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: console }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ .Values.console.port }} }
---
{{- end }}
{{- $busPeers := append (include "lance.busClients" . | fromJsonArray) "nats-box" }}
{{- if .Values.objectStore.enabled }}{{- $busPeers = append $busPeers "rustfs" }}{{- end }}
# (3f) the development bus (the nats fixture's servers, when the bus runs in this namespace): its ONLY ingress, since NATS
# is on the (3a) exclusion list. 4222 admits the bus's clients (`lance.busClients`, the same pods the platform's bus is
# reached from: every pod whose daprd loads a pub/sub Component, and the stream Job), the fixture's own nats-box, and with
# the development object store its server, which publishes each change on `store.events`; 6222 admits the servers to each
# other, whose cluster routes the three-node JetStream cluster runs on. 7422 (leafnodes) and the 8222 monitor stay closed:
# no pod the release renders reads them. component=nats (not just name) so nats-box is not a target.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-nats-clients
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: {{- toYaml $busPeers | nindent 18 }}
      ports:
        - { protocol: TCP, port: 4222 }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
              app.kubernetes.io/component: nats
      ports:
        - { protocol: TCP, port: 6222 }
{{- end }}
