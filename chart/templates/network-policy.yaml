{{- if .Values.networkPolicy.enabled }}
# ============================================================================================
# Network-isolation layer (Batch 9, 2026-07-11 — the security audit's "biggest gap": L3 was
# effectively open; openbao was reachable by ANY pod). Implements the audit's fix order exactly:
#   (1) default-deny Ingress+Egress for every pod in the namespace;
#   (2) the kube-dns egress allow ships IN THIS SAME FILE (default-deny egress without it bricks
#       name resolution — the audit's named footgun);
#   (3) targeted allows for the guarded stores (the secret store ← the pods whose sidecar reads it,
#       as ingress on the dev store and egress to the platform's; age-postgres:5432 ← its real clients; the object store:9000 ← the data plane; nats ← 4222 intra-namespace
#       only, other ports closed) — every OTHER pod gets plain intra-namespace ingress,
#       EXCLUDING the guarded stores so the targeted lists stay exclusive (NetworkPolicies are
#       additive: the general allow must NOT cover the stores);
#   (4) values-prod flips `networkPolicy.enabled` — the LIVE verification runbook is todo_fable
#       §7a (all pods Ready, e2e suites green, and a negative probe: a request to the secret store
#       from a pod outside its client list must time out).
# Egress posture (tier 1): intra-namespace open + DNS + the Dapr control plane; the INGRESS rules do
# the guarding — a connection needs BOTH the source's egress and the destination's ingress to allow.
# Every egress rule names its peers: the API server, the Gateway, the telemetry backend and the
# secret store are the platform's to state, and externalized backends (S3/NATS off-cluster) need
# `networkPolicy.extraEgress` entries. NOTE: requires a policy-enforcing CNI (Calico/Cilium);
# kind's default CNI ignores NetworkPolicy entirely. kubectl port-forward traffic enters via the
# kubelet (not the CNI data path) and keeps working under default-deny on mainstream CNIs.
# ============================================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-default-deny
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# (2) DNS — in the SAME change as default-deny egress, per the audit. Both protocols: plain lookups
# are UDP; large responses retry over TCP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-dns
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Egress within the namespace (all pods): app→store, sidecar→NATS/placement/sentry, jobs→stores.
# The guarded stores' INGRESS policies below are what actually gates who reaches them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-egress-intra-namespace
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
---
# API-server egress: only the pods that call the Kubernetes API, to the peers the platform states.
{{- $apiClients := list }}
{{- if .Values.auth.enabled }}{{ $apiClients = concat $apiClients (list "catalog" "lineage") }}{{ end }}
{{- if and .Values.auth.issuerMirror.enabled (or .Values.openfga.enabled .Values.objectStore.enabled) }}{{ $apiClients = append $apiClients "issuer-mirror" }}{{ end }}
{{- if .Values.openbao.enabled }}{{ $apiClients = append $apiClients "openbao" }}{{ end }}
{{- if .Values.observability.enabled }}{{ $apiClients = append $apiClients "otel-collector" }}{{ end }}
{{- if .Values.backups.volumeSnapshot.enabled }}{{ $apiClients = append $apiClients "object-store-backup" }}{{ end }}
{{- if and .Values.dapr.enabled .Values.dapr.dashboard.enabled }}{{ $apiClients = append $apiClients "dapr-dashboard" }}{{ end }}
{{- if $apiClients }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-apiserver-egress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range $apiClients }}
          - {{ . }}
          {{- end }}
  policyTypes: [Egress]
  egress: {{- include "lance.egressRules" (list "networkPolicy.apiServerEgress" .Values.networkPolicy.apiServerEgress "the Kubernetes API server's endpoints, at the port a policy sees after the kubernetes Service's translation") | nindent 4 }}
{{- end }}
{{- if not .Values.openfga.enabled }}
---
# The platform's OpenFGA (auth.fgaApiUrl): only the pods that dial it, to the peers the platform states.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-openfga-egress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range (concat (include "lance.fgaWriters" . | splitList " ") (list "bootstrap-admin" "openfga-model")) }}
          - {{ . }}
          {{- end }}
  policyTypes: [Egress]
  egress: {{- include "lance.egressRules" (list "auth.fgaEgress" .Values.auth.fgaEgress "the platform's OpenFGA at auth.fgaApiUrl") | nindent 4 }}
{{- end }}
{{- if not .Values.openbao.enabled }}
---
# The platform's secret store (openbao.externalAddr): only the pods whose sidecar reads it, to the peers the platform states.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-secret-store-egress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range (splitList "," (include "lance.secretScopes" .) | compact) }}
          - {{ . }}
          {{- end }}
  policyTypes: [Egress]
  egress: {{- include "lance.egressRules" (list "openbao.egress" .Values.openbao.egress "the platform's secret store at openbao.externalAddr") | nindent 4 }}
{{- end }}
{{- if .Values.dapr.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-dapr-control-plane-egress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.dapr.controlPlaneNamespace }} }
{{- end }}
{{- $o := .Values.observability }}
{{- if $o.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-telemetry-export-egress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: otel-collector }
  policyTypes: [Egress]
  egress: {{- include "lance.egressRules" (list "observability.export.egress" $o.export.egress "the telemetry backend at observability.export.endpoint") | nindent 4 }}
{{- end }}
{{- with .Values.networkPolicy.extraEgress }}
---
# Deployment-specific egress (externalized S3/NATS/OTLP endpoints) — values-supplied, verbatim.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" $ }}-allow-extra-egress
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress: {{- include "lance.egressRules" (list "networkPolicy.extraEgress" . "the external backend the rule is for") | nindent 4 }}
{{- end }}
---
# (3a) General intra-namespace INGRESS — every pod EXCEPT the guarded stores (additive-allow
# semantics: including them here would void their exclusive client lists below).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-allow-ingress-intra-namespace
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: NotIn, values: [openbao, age, rustfs, nats, authorization-controller] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
{{- if .Values.openbao.enabled }}
---
# (3b) openbao:8200, the development store (the openbao fixture's pod): only the pods whose sidecar reads it, the apps
# the lance-secrets component is scoped to (`lance.secretScopes`, which takes in the state-store-scoped apps: their
# daprd resolves the state store's connectionString through it at boot, so blocking them wedges the sidecar on component
# init), and the store's own pods, whose seed reads the outgoing pod through the Service. External-secrets
# (off-namespace) needs an entry in networkPolicy.openbaoExtraFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-openbao
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: openbao }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- range (append (splitList "," (include "lance.secretScopes" .) | compact) "openbao" | uniq) }}
                  - {{ . }}
                  {{- end }}
        {{- with .Values.networkPolicy.openbaoExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8200 }
{{- end }}
{{- if .Values.openfga.enabled }}
---
# (3b') openfga:8080/8081 — the authorization store, which authorizes none of its callers ([[LH-442]]): any token it
# admits may write any tuple. Only the tuple writers reach its API (the catalog, maintenance and the jobs that publish
# the model and seed the estate's grants, `lance.fgaWriters`); every other service asks the catalog's
# decision door. The Collector reaches the metrics port alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-openfga
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: openfga, app.kubernetes.io/component: authorization-controller }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- range (concat (include "lance.fgaWriters" . | splitList " ") (list "bootstrap-admin" "openfga-model")) }}
                  - {{ . }}
                  {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
    {{- if .Values.observability.enabled }}
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: otel-collector }
      ports:
        - { protocol: TCP, port: 2112 }
    {{- end }}
{{- end }}
{{- if .Values.age.enabled }}
---
# (3c) age-postgres:5432 — the OpenFGA datastore + the Dapr state store
# (dapr-statestore.yaml rides this same instance). Clients: openfga (subchart pods carry
# app.kubernetes.io/name=openfga), the openfga-migrate job, the pg backup job, and the state-store-scoped
# apps — daprd's state.postgresql component connects DIRECTLY to this postgres, so those pods' sidecars
# are real 5432 clients (blocked = the state store never loads and actor hosting silently disables).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-age-postgres
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: age }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In

                {{- $ageClients := list "openfga-migrate" "backup-pg" }}
                {{- if and .Values.dapr.enabled .Values.stateStore.enabled }}
                {{- $ageClients = concat $ageClients .Values.stateStore.scopes }}
                {{- end }}

                values:
                  {{- range ($ageClients | uniq) }}
                  - {{ . }}
                  {{- end }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: openfga }
      ports:
        - { protocol: TCP, port: {{ .Values.age.port }} }
{{- end }}
---
# (3d) the object store:9000 — the lakehouse bytes. Clients: the data-plane services, the provisioning hooks and the
# backup jobs. A client outside the release's labels is added via networkPolicy.objectStoreExtraFrom.
# The development store (the rustfs fixture) stamps this component label on its pods; a managed S3 runs outside the
# namespace and needs no rule. RustFS serves S3, its admin API and internode RPC on this one port, so the rule
# cannot split them: the admin plane is guarded by IAM (no `admin:*` on any rask identity, root held only by the
# scoped-users hook), not by the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-object-store-ingress
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: rustfs }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - catalog
                  - lineage
                  - maintenance
                  - object-store-backup
                  - backup-pg # the pg-backup CronJob uploads its dumps to the lakehouse (_backups/pg/)
                  - backup-control-root # the control-root backup copies the registries to _backups/control/
                  - object-store-scoped-users # the identity-provisioning hook — blocked, every scoped user is absent
                  # A client reading a governed table on the credential the catalog vends it (the annotator's or the
                  # media plane's release, a user's pipeline) is admitted by `networkPolicy.objectStoreExtraFrom`.
        {{- if .Values.ray.enabled }}
        # The HTR runner executes inside the KubeRay-managed RayService pods (PageLoader reads the
        # image cache, AltoWriter writes ALTO — s3://images-batch*). The chart's head template stamps
        # no labels of its own; KubeRay stamps its `ray.io/is-ray-node: "yes"` marker on every Ray
        # pod, so select that (component-label style can't reach operator-created pods).
        - podSelector:
            matchLabels: { ray.io/is-ray-node: "yes" }
        {{- end }}
        {{- with .Values.networkPolicy.objectStoreExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.objectStore.port }} }
---
# The services the cluster route publishes (`rask.apiRoutes`) accept the Gateway's traffic on their app
# port and nothing else, from anywhere: the Gateway's data plane lives in the platform's
# namespace, and every one of these services authenticates each request itself. The port is the bound:
# daprd's ports on the same pod stay intra-namespace only.
{{- range $row := include "rask.apiRoutes" . | fromJsonArray }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" $ }}-edge-{{ $row.component }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: {{ $row.component }} }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ $row.port }} }
---
{{- end }}
# (3f) nats:4222 — the client port, and the bus's ONLY ingress: NATS is on the (3a) exclusion list. The bus is a
# prerequisite: this selects the upstream nats chart's pods when the bus runs in this namespace (the dev fixture), and a
# bus elsewhere is reached through `networkPolicy.extraEgress`. component=nats (not just name) so nats-box is not a target.
# Admitted from ANY intra-namespace pod, port-scoped, and honestly so:
# the legitimate clients are the daprd SIDECARS, which live inside every dapr.io/enabled app pod
# (catalog, lineage, maintenance, notifications) plus the nats-box hook Jobs
# (stream provision + DLQ tooling) — i.e. nearly every first-party pod in the namespace, and the set
# follows the dapr.io/enabled ANNOTATION, which no label selector can see. Enumerating component labels
# would restate that near-total list and silently strand the next sidecar carrier (a wedged bus, not a
# security win), so the deliberate shape is pod-open/port-closed. The isolation gained vs the old (3a)
# blanket allow is the PORTS: 6222 (cluster routes) + 7422 (leafnodes) are now unreachable, and so is the
# 8222 monitor: no pod the release renders reads it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lance.fullname" . }}-nats-clients
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 4222 }
{{- end }}
