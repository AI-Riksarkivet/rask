
{{- if and (not .Values.openbao.enabled) (not (.Values.signing).provisioned) }}
{{- $ids := include "lance.signingKeys" (list .) | splitList " " | compact }}
{{- if $ids }}
{{- $names := list }}
{{- range $ids }}{{- $names = concat $names (list (printf "signing-public-%s" .) (printf "signing-key-%s" .)) }}{{- end }}
{{- fail (printf "EVENT SIGNING KEYS NOT PROVISIONED: the platform's store (openbao.enabled=false) is not seeded by this chart, so nothing mints them: every signer would stay not Ready and lineage could verify nothing. Create these secrets in the store (KV v2; each identity's public list before its seed; docs/OPERATORS.md, Event signing keys), then --set signing.provisioned=true:\n  - %s" (join "\n  - " $names)) }}
{{- end }}
{{- end }}
