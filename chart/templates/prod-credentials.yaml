{{/*
CREDENTIALS — no chart value carries one, and a real deployment carries no published dev secret.

Renders no object, on the `auth-consistency.yaml` precedent: it exists only to fail a render that
would otherwise install cleanly and be indefensible afterwards.

1. A CREDENTIAL PASSED AS A VALUE IS REFUSED ON EVERY RENDER ([[XC-004]]). A value is stored in the
release (`helm get values`), in every revision kept, and readable by anyone who can read the release, so
a secret there is a secret at rest outside the store. Every credential the estate uses is a field of the
store: the dev OpenBao's are generated in-cluster (external-secrets.yaml), a real deployment's are
provisioned by the platform. The keys below are the ones this chart once read; each refusal names the
store field that replaced it. `make k3s-converge` strips them from the release it carries forward.

2. A REAL DEPLOYMENT carries no published dev secret. The condition comes from `rask.isRealDeployment`,
so this template and the root-create lock (services.yaml, F2-11) cannot answer "is this real?"
differently. The signal is `openbao.devMode=false`, or `image.repository` with `image.localImages=false`:
"the images come from a registry someone else can reach" is a FACT about the deploy rather than a flag to
remember (`localhost:`, `127.0.0.1:` and `172.17.0.1:` registries are the in-cluster dev loop).

THE TWO EXEMPTIONS ARE FENCED HERE (owner, 2026-10-06): the bundled dev Dex (its static users, client
secret and publisher password are chart configuration, XC-025) and the dev OpenBao's root token (XC-079)
are the only credentials a render still carries, and only a dev render. A real deployment refuses the dev
OpenBao (which is also what stops the chart generating credentials for one: `lance.mintsDevCredentials`
needs devMode) and refuses the bundled Dex; it points at the platform's store and IdP.
*/}}
{{- $v := .Values.AsMap -}}
{{- $replaced := dict
  "dapr.appToken" (dig "dapr" "appToken" "" $v)
  "frontend.oidc.sessionSecret" (dig "frontend" "oidc" "sessionSecret" "" $v)
  "secrets.hfToken" (dig "secrets" "hfToken" "" $v)
  "ray.auth.token" (dig "ray" "auth" "token" "" $v)
  "age.password" (dig "age" "password" "" $v)
  "minio.secretKey" (dig "minio" "secretKey" "" $v)
  "minio.rayComputeSecretKey" (dig "minio" "rayComputeSecretKey" "" $v)
  "minio.maintenanceSecretKey" (dig "minio" "maintenanceSecretKey" "" $v)
  "minio.medallionSecretKey" (dig "minio" "medallionSecretKey" "" $v)
  "minio.catalogSecretKey" (dig "minio" "catalogSecretKey" "" $v)
  "minio.lineageSecretKey" (dig "minio" "lineageSecretKey" "" $v)
  "minio.viewerSecretKey" (dig "minio" "viewerSecretKey" "" $v)
-}}
{{- $given := list -}}
{{- range $key, $value := $replaced -}}
{{- if $value -}}{{- $given = append $given $key -}}{{- end -}}
{{- end -}}
{{- if $given -}}
{{- fail (printf "A CREDENTIAL IS NOT A CHART VALUE: %s. A value is stored in the release and every revision of it. Put the secret in the store (the fields templates/openbao.yaml's header lists; the dev OpenBao generates its own) and drop the value: --reset-then-reuse-values does not drop a key the release already carries, so render without it (make k3s-converge strips them)." (join ", " $given)) -}}
{{- end -}}

{{- if include "rask.isRealDeployment" . -}}
{{- $repo := (.Values.image.repository | default "") -}}
{{- $signal := ternary (printf "image.repository=%s with image.localImages=false, so the images come from a registry off this node" $repo) "openbao.devMode=false, the prod signal" .Values.openbao.devMode -}}
{{- $offending := list -}}
{{- if .Values.openbao.devMode -}}
{{- $offending = append $offending "openbao.devMode=true — an in-memory, auto-unsealed OpenBao with the fixed root token whose credentials this chart generates, so anything that can reach it in-cluster reads every secret the estate holds" -}}
{{- end -}}
{{- if .Values.dex.enabled -}}
{{- $offending = append $offending "dex.enabled=true — the bundled dev IdP, whose static users, client secret and publisher password are published in this chart (XC-025); set frontend.oidc.publicIssuer to the platform's IdP and dex.enabled=false" -}}
{{- end -}}
{{- if $offending -}}
{{- fail (printf "WELL-KNOWN DEV CREDENTIALS REFUSED ON A REAL DEPLOYMENT (%s). Each is published in chart/values.yaml, so holding the repository is holding the credential:\n  - %s\nPoint the chart at the platform's store (openbao.externalAddr, or devMode=false), whose operator provisions every credential. If this IS a local estate, render it as one: image.localImages=true for side-loaded images (make k3s-import), or a localhost: registry." $signal (join "\n  - " $offending)) -}}
{{- end -}}
{{- end -}}
