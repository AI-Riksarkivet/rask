
{{- $v := .Values.AsMap -}}
{{- $replaced := dict
  "dapr.appToken" (dig "dapr" "appToken" "" $v)
  "age.password" (dig "age" "password" "" $v)
  "objectStore.secretKey" (dig "objectStore" "secretKey" "" $v)
  "objectStore.maintenanceSecretKey" (dig "objectStore" "maintenanceSecretKey" "" $v)
  "objectStore.catalogSecretKey" (dig "objectStore" "catalogSecretKey" "" $v)
  "objectStore.lineageSecretKey" (dig "objectStore" "lineageSecretKey" "" $v)
-}}
{{- $given := list -}}
{{- range $key, $value := $replaced -}}
{{- if $value -}}{{- $given = append $given $key -}}{{- end -}}
{{- end -}}
{{- if $given -}}
{{- fail (printf "A CREDENTIAL IS NOT A CHART VALUE: %s. A value is stored in the release and every revision of it. Put the secret in the store (the fields docs/architecture/deployment.md lists under Prerequisites; the dev OpenBao generates its own) and drop the value: --reset-then-reuse-values does not drop a key the release already carries, so render without it (make k3s-up and make k3s-converge compose the values from git alone, with --reset-values)." (join ", " $given)) -}}
{{- end -}}

{{- if include "rask.isRealDeployment" . -}}
{{- $repo := (.Values.image.repository | default "") -}}
{{- $signal := ternary (printf "image.repository=%s with image.localImages=false, so the images come from a registry off this node" $repo) "openbao.enabled=false, the platform's secret store" .Values.openbao.enabled -}}
{{- $local := ternary "image.localImages=true for side-loaded images (make k3s-import), or a localhost: registry" "openbao.enabled=true, the development store, with side-loaded images (image.localImages=true) or a localhost: registry" .Values.openbao.enabled -}}
{{- $offending := list -}}
{{- if .Values.openbao.enabled -}}
{{- $offending = append $offending "openbao.enabled=true — the development store, an in-memory OpenBao initialized and seeded by the scripts this chart renders, so the estate's trust roots (the bus root, every signing key) would be ones rask minted and kept only in that pod's memory; point the chart at the platform's store (openbao.enabled=false with openbao.externalAddr), whose operator provisions every credential" -}}
{{- end -}}
{{- if .Values.objectStore.enabled -}}
{{- $offending = append $offending "objectStore.enabled=true — the development object store (deploy/fixtures/rustfs), whose root secret the dev store generates and which, on RustFS, signs every STS token; set objectStore.enabled=false and objectStore.externalEndpoint to the platform's S3, whose operator provisions rask's identities" -}}
{{- end -}}
{{- if .Values.dex.enabled -}}
{{- $offending = append $offending "dex.enabled=true — the bundled dev IdP, whose static users and client secret are published in this repository (deploy/fixtures/dex, XC-025); set auth.oidc.issuer to the platform's IdP (https) and dex.enabled=false" -}}
{{- end -}}
{{- if not .Values.auth.enabled -}}
{{- $offending = append $offending "auth.enabled=false — every governed door answers anyone who reaches it, and the chart would write the acknowledgement the services refuse to boot without (RASK_INSECURE_ALLOW_UNAUTHENTICATED) on their behalf; set auth.enabled=true with auth.oidc.issuer naming the platform's IdP" -}}
{{- end -}}
{{- if include "lance.daprDashboardEnabled" . -}}
{{- $offending = append $offending "dapr.dashboard.enabled=true — the Dapr dashboard, a development tool that authenticates nobody and whose ClusterRole reads every pod and its log in the cluster; leave it off" -}}
{{- end -}}
{{- $hops := list -}}
{{- if not .Values.openfga.enabled -}}
{{- $hops = append $hops (dict "value" "auth.fgaApiUrl" "url" .Values.auth.fgaApiUrl "crosses" "the catalog, maintenance and the FGA hooks send it their projected rask-openfga tokens, each of which may write any tuple") -}}
{{- end -}}
{{- $hops = append $hops (dict "value" "objectStore.externalEndpoint" "url" .Values.objectStore.externalEndpoint "crosses" "the catalog sends its STS its ServiceAccount token for every session it holds and vends, and gets back each session's secret key") -}}
{{- $hops = append $hops (dict "value" "vending.endpoint" "url" .Values.vending.endpoint "crosses" "every client the catalog vends to sends its session's requests and the tables' bytes there, and the vend sets allow_http=true, turning off Lance's TLS-only default for that client") -}}
{{- if .Values.observability.enabled -}}
{{- $hops = append $hops (dict "value" "observability.export.endpoint" "url" .Values.observability.export.endpoint "crosses" "the Collector sends it the export credential with every batch of the estate's telemetry and audit trail") -}}
{{- end -}}
{{- $hops = append $hops (dict "value" "services.lineage.forward.url" "url" .Values.services.lineage.forward.url "crosses" "lineage forwards it every event the estate's provenance records, with the backend's API key when forward.authSecret names one") -}}
{{- range $hops -}}
{{- if and .url (not (hasPrefix "https://" .url)) -}}
{{- $offending = append $offending (printf "%s=%s is not https — %s, and over http whoever answers that address on the path reads what crosses it; name its https address" .value .url .crosses) -}}
{{- end -}}
{{- end -}}
{{- if $offending -}}
{{- fail (printf "REFUSED ON A REAL DEPLOYMENT (%s), each would expose the estate once installed:\n  - %s\nIf this IS a local estate, render it as one: %s." $signal (join "\n  - " $offending) $local) -}}
{{- end -}}
{{- end -}}
