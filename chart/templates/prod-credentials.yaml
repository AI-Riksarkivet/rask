{{/*
PROD CREDENTIALS — refuse a REAL deployment carrying the estate's published dev secrets.

Renders no object, on the `auth-consistency.yaml` precedent: it exists only to fail a render that
would otherwise install cleanly and be indefensible afterwards.

WHY ONE TEMPLATE AND NOT A GUARD BESIDE EACH SECRET. Two reasons, and each has bitten on its own.
A guard living inside the Secret it protects is absent exactly when that Secret's render is skipped
(`infra-credentials.yaml` on `externalSecrets.enabled`, `dapr-app-token.yaml` on
`dapr.sidecars`+`auth.enabled`). And four copies of "is this a real deployment?" are four chances to
answer it too narrowly at once: every value named below is published in `chart/values.yaml`, so
holding the repository is holding the credential, and a refusal reachable only by remembering to arm
an opt-in flag protects the installs that did not need protecting. Hence ONE definition of a real
deployment, ONE list of values that may not survive it, evaluated on every render.

THE SECOND SIGNAL IS `image.repository` WITH `image.localImages=false`, and it is chosen because an
operator cannot forget it — the deployment already depends on it. `make k3s-up` renders
`localImages=true` for side-loaded images, and `rask.image` refuses a bare `<component>:<tag>`
otherwise because that name is docker.io. So "the images come from a registry someone else can
reach" is a FACT about the deploy rather than a flag to remember, and dev credentials there are
indefensible whatever `devMode` says.

Three carve-outs, each measured rather than assumed:
  * A `localhost:` / `127.0.0.1:` / `172.17.0.1:` registry is the in-cluster dev loop (`make
    dev-registry` — k3s pulls via localhost, Dagger pushes to the bridge gateway). Those addresses
    are unroutable from anywhere but the node, so they are not "a real registry".
  * `externalSecrets.enabled` exempts the three infra values: the operator then owns that Secret and
    syncs it FROM Vault, so no chart value ships. It does NOT exempt `dapr.appToken`, whose Secret
    external-secrets.yaml does not own.
  * `ingress.enabled` was considered as the signal and REJECTED: it defaults to true and the local
    loop runs on it (the catch-all ingress `make k3s-up` prints), so keying there would break the
    one render this guard must never break — which is how a guard gets deleted rather than satisfied.
*/}}
{{- /* The CONDITION comes from `rask.isRealDeployment` so this template and the root-create lock
     (services.yaml, F2-11) cannot answer "is this real?" differently. Only the WORDING is built
     here, because a refusal has to name which signal fired to be actionable. */ -}}
{{- $repo := (.Values.image.repository | default "") -}}
{{- $signal := "" -}}
{{- if include "rask.isRealDeployment" . -}}
{{- if not .Values.openbao.devMode -}}
{{- $signal = "openbao.devMode=false, the prod signal" -}}
{{- else -}}
{{- $signal = printf "image.repository=%s with image.localImages=false, so the images come from a registry off this node" $repo -}}
{{- end -}}
{{- end -}}

{{- /* The values-prod placeholder is refused on EVERY render, signal or not: it is not a credential
     anyone could have meant, so there is no deployment where it is the right value. */ -}}
{{- if eq .Values.dapr.appToken "REPLACE-ME-with-a-real-secret" -}}
{{- fail "dapr.appToken is still the values-prod placeholder REPLACE-ME-with-a-real-secret. It authenticates EVERY sidecar-delivered route (lineage ingest, medallion triggers, the cron sweeps), so it must be a real secret: --set dapr.appToken=... from your secret manager. Do not commit it." -}}
{{- end -}}

{{- if $signal -}}
{{- $offending := list -}}
{{- if .Values.openbao.devMode -}}
{{- $offending = append $offending "openbao.devMode=true — an in-memory, auto-unsealed OpenBao with the fixed root token, so anything that can reach it in-cluster reads every secret the estate holds" -}}
{{- end -}}
{{- if eq .Values.dapr.appToken "lance-dev-dapr-app-token-override-me" -}}
{{- $offending = append $offending "dapr.appToken — authenticates EVERY sidecar-delivered route (lineage ingest, medallion triggers, the cron sweeps); a public value makes all of them forgeable" -}}
{{- end -}}
{{- if not .Values.externalSecrets.enabled -}}
{{- if eq .Values.age.password "lance" -}}
{{- $offending = append $offending "age.password — the AGE Postgres password, and the same credential inside the OpenFGA datastore DSN, so it is read AND write on the authorization store" -}}
{{- end -}}
{{- if eq .Values.minio.secretKey "minioadmin" -}}
{{- $offending = append $offending "minio.secretKey — the object store's ROOT secret: every governed table in every warehouse, past the catalog entirely" -}}
{{- end -}}
{{- if and .Values.minio.oidc.enabled (eq .Values.dex.clientSecret "lance-catalog-secret") -}}
{{- $offending = append $offending "dex.clientSecret — what the object store presents for STS AssumeRoleWithWebIdentity, so it mints storage credentials" -}}
{{- end -}}
{{- end -}}
{{- if $offending -}}
{{- fail (printf "WELL-KNOWN DEV CREDENTIALS REFUSED ON A REAL DEPLOYMENT (%s). Every value below is published in chart/values.yaml, so holding the repository is holding the credential:\n  - %s\nFix each with --set from your secret manager, or set externalSecrets.enabled=true so the operator syncs them from Vault. If this IS a local estate, render it as one: image.localImages=true for side-loaded images (make k3s-import), or a localhost: registry." $signal (join "\n  - " $offending)) -}}
{{- end -}}
{{- end -}}
