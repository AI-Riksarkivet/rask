
{{- $v := .Values.AsMap -}}
{{- $replaced := dict
  "dapr.appToken" (dig "dapr" "appToken" "" $v)
  "frontend.oidc.sessionSecret" (dig "frontend" "oidc" "sessionSecret" "" $v)
  "secrets.hfToken" (dig "secrets" "hfToken" "" $v)
  "ray.auth.token" (dig "ray" "auth" "token" "" $v)
  "age.password" (dig "age" "password" "" $v)
  "objectStore.secretKey" (dig "objectStore" "secretKey" "" $v)
  "objectStore.maintenanceSecretKey" (dig "objectStore" "maintenanceSecretKey" "" $v)
  "objectStore.catalogSecretKey" (dig "objectStore" "catalogSecretKey" "" $v)
  "objectStore.lineageSecretKey" (dig "objectStore" "lineageSecretKey" "" $v)
  "objectStore.viewerSecretKey" (dig "objectStore" "viewerSecretKey" "" $v)
-}}
{{- $given := list -}}
{{- range $key, $value := $replaced -}}
{{- if $value -}}{{- $given = append $given $key -}}{{- end -}}
{{- end -}}
{{- if $given -}}
{{- fail (printf "A CREDENTIAL IS NOT A CHART VALUE: %s. A value is stored in the release and every revision of it. Put the secret in the store (the fields docs/architecture/deployment.md lists under Prerequisites; the dev OpenBao generates its own) and drop the value: --reset-then-reuse-values does not drop a key the release already carries, so render without it (make k3s-converge strips them)." (join ", " $given)) -}}
{{- end -}}

{{- if include "rask.isRealDeployment" . -}}
{{- $repo := (.Values.image.repository | default "") -}}
{{- $signal := ternary (printf "image.repository=%s with image.localImages=false, so the images come from a registry off this node" $repo) "openbao.enabled=false, the platform's secret store" .Values.openbao.enabled -}}
{{- $offending := list -}}
{{- if .Values.openbao.enabled -}}
{{- $offending = append $offending "openbao.enabled=true — the development store, an in-memory, auto-unsealed OpenBao with the fixed root token whose credentials this chart generates, so anything that can reach it in-cluster reads every secret the estate holds" -}}
{{- end -}}
{{- if .Values.objectStore.enabled -}}
{{- $offending = append $offending "objectStore.enabled=true — the development object store (deploy/fixtures/rustfs), whose root secret the dev store generates and which, on RustFS, signs every STS token; set objectStore.enabled=false and objectStore.externalEndpoint to the platform's S3, whose operator provisions rask's identities" -}}
{{- end -}}
{{- if .Values.dex.enabled -}}
{{- $offending = append $offending "dex.enabled=true — the bundled dev IdP, whose static users and client secret are published in this chart (XC-025); set auth.oidc.issuer to the platform's IdP (https) and dex.enabled=false" -}}
{{- end -}}
{{- if $offending -}}
{{- fail (printf "WELL-KNOWN DEV CREDENTIALS REFUSED ON A REAL DEPLOYMENT (%s). Each is published in chart/values.yaml, so holding the repository is holding the credential:\n  - %s\nPoint the chart at the platform's store (openbao.enabled=false with openbao.externalAddr), whose operator provisions every credential. If this IS a local estate, render it as one: image.localImages=true for side-loaded images (make k3s-import), or a localhost: registry." $signal (join "\n  - " $offending)) -}}
{{- end -}}
{{- end -}}
