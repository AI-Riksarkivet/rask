{{- if and .Values.ray.enabled (or .Values.singleTenant.enabled .Values.ray.cluster.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rask.fullname" . }}-hf-cache
  labels:
    {{- include "rask.componentLabels" (list . "ray") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]

  {{- with .Values.ray.hfCacheStorageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ray.hfCacheStorage }}
{{- end }}
