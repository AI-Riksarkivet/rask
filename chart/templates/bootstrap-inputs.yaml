apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lance.fullname" . }}-bootstrap-inputs
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  {{- range $template := list "bootstrap-admin.yaml" "nats-stream-job.yaml" "object-store-provisioning.yaml" "openfga-migrate.yaml" "openfga-model.yaml" }}
  {{- $specs := list }}
  {{- range $doc := splitList "\n---" (include (print $.Template.BasePath "/" $template) $) }}
  {{- $job := fromYaml $doc }}
  {{- if eq (get $job "kind") "Job" }}
  {{- $specs = append $specs (toJson (get $job "spec")) }}
  {{- end }}
  {{- end }}
  {{ $template }}: {{ join "\n" $specs | sha256sum | quote }}
  {{- end }}
