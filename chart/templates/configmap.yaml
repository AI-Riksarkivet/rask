apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rask.fullname" . }}-config
  labels:
    {{- include "rask.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  RASK_DOCS: {{ .Values.docs.enabled | quote }}
  RASK_DAPR_ENABLED: {{ .Values.dapr.enabled | quote }}
  {{- if .Values.dapr.enabled }}
  RASK_NOTIFICATIONS_PUBSUB: {{ include "lance.subPubsub" (list . "notifications") | quote }}
  RASK_NOTIFICATIONS_LINEAGE_TOPIC: {{ .Values.pubsub.topic | quote }}
  RASK_NOTIFICATIONS_CONTROL_PUBSUB: {{ printf "%s-notifications" (.Values.pubsub.controlName | default "catalog-control-pubsub") | quote }}
  RASK_NOTIFICATIONS_CONTROL_TOPIC: {{ .Values.pubsub.controlTopic | default "catalog.control.v1" | quote }}
  {{- if .Values.dapr.resiliency.enabled }}
  RASK_NOTIFICATIONS_DLQ_TOPIC: "dlq.notifications"
  {{- end }}
  RASK_NOTIFICATIONS_LINEAGE_URL: {{ printf "http://%s-lineage:%v" (include "lance.fullname" .) .Values.services.lineage.port | quote }}
  RASK_NOTIFICATIONS_BINDING_NAME: {{ .Values.services.notifications.reconcileBindingName | default "notifications-reconcile-cron" | quote }}
  {{- end }}
