apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rask.fullname" . }}-config
  labels:
    {{- include "rask.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{- /* RASK_SERVE_GPU_FRAC is DERIVED below, never passed through — it must collapse to 0 on a
       GPU-less estate. Emitting the raw value here too would let this ConfigMap contradict the
       RayService's serveConfigV2, which is precisely the kind of "configured 1.0, running 0" split
       that costs a live debugging round. */}}
  {{- if ne $k "RASK_SERVE_GPU_FRAC" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  # The htrflow Serve actor's GPU fraction, derived from the ONE GPU signal (ray.gpuCount) by
  # rask.serveGpuFrac — the same include the RayService uses, so the two cannot drift.
  RASK_SERVE_GPU_FRAC: {{ include "rask.serveGpuFrac" . | quote }}
  RASK_DAPR_ENABLED: {{ .Values.dapr.sidecars | quote }}
  # Gateway upstreams (in-cluster DNS). The core/search/volumes rows died in the
  # R6/R20 media wave — their capabilities serve from the media plane below.
  RASK_COMPUTE_URL: {{ printf "http://%s-compute:8804" (include "rask.fullname" .) | quote }}
  RASK_CONTROLPLANE_URL: {{ printf "http://%s-controlplane:8820" (include "rask.fullname" .) | quote }}
  # The ingest plane. WITHOUT this the gateway's ingest row falls back to its own 127.0.0.1:8830 —
  # the gateway proxying to ITSELF, where no such route exists — so every /api/ingest/* call 404s with
  # a body indistinguishable from an unrouted path. The row was in the code and the service was up;
  # only the address was missing, and nothing in either component could tell you so.
  RASK_INGEST_URL: {{ printf "http://%s-ingest:%v" (include "rask.fullname" .) .Values.services.ingest.port | quote }}
  # The studio flow-builder's server half. Without this the gateway's /api/flows row falls back to its
  # code default (127.0.0.1:8840 — the gateway pod itself) and every call 502s, which the builder shows
  # as "engine offline": graceful, but it means no server-side or durable runs at all.
  RASK_FLOWS_URL: {{ printf "http://%s-flows:%v" (include "rask.fullname" .) .Values.services.flows.port | quote }}
  # lance-plane gateway upstreams (lance-ns-merge.md P1 gateway fold + P4): the fleet gateway carries
  # /api/catalog, /api/lineage, /api/produce, /api/train and the /api/explorer/* namespace. Service names
  # use lance.fullname — that is what services.yaml/medallion.yaml/explorer.yaml name their Services.
  RASK_CATALOG_API_URL: {{ printf "http://%s-catalog:%v" (include "lance.fullname" .) .Values.services.catalog.port | quote }}
  RASK_LINEAGE_API_URL: {{ printf "http://%s-lineage:%v" (include "lance.fullname" .) .Values.services.lineage.port | quote }}
  # The sidecar-only lineage routes the gateway must 403 at the edge (the retired nginx blocklist,
  # now Python middleware). ONE source: the lance.lineageSidecarOnlyRoutes helper.
  RASK_LINEAGE_SIDECAR_ONLY_ROUTES: {{ include "lance.lineageSidecarOnlyRoutes" . | quote }}
  {{- if .Values.medallion.enabled }}
  RASK_MEDALLION_API_URL: {{ printf "http://%s-lance-ray:%v" (include "lance.fullname" .) .Values.medallion.port | quote }}
  {{- end }}
  {{- if .Values.explorer.enabled }}
  RASK_EXPLORER_VIEWER_URL: {{ printf "http://%s-viewer:%v" (include "lance.fullname" .) .Values.explorer.services.viewer.port | quote }}
  RASK_EXPLORER_SEARCH_URL: {{ printf "http://%s-search:%v" (include "lance.fullname" .) .Values.explorer.services.search.port | quote }}
  RASK_EXPLORER_ANNOTATOR_URL: {{ printf "http://%s-annotator:%v" (include "lance.fullname" .) .Values.explorer.services.annotator.port | quote }}
  {{- end }}
  {{- /* EXTERNAL Ray wins when set. The in-cluster head Service renders only under ray.enabled AND
       singleTenant.enabled (rayservice.yaml), so deriving this from ray.enabled ALONE pointed compute
       at a Service that does not exist on a default install — the dashboard call then failed on DNS
       rather than saying "no Ray here". rask's Ray is managed outside this repo, so an external
       address is the NORMAL case and the in-cluster head is the opt-in. */}}
  {{- if .Values.ray.dashboardUrl }}
  RAY_DASHBOARD_URL: {{ .Values.ray.dashboardUrl | quote }}
  {{- else if .Values.singleTenant.enabled }}
  RAY_DASHBOARD_URL: {{ printf "http://%s-ray-head-svc:%v" (include "rask.fullname" .) .Values.ray.dashboardPort | quote }}
  {{- end }}
