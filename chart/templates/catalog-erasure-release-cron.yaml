
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.catalog.erasure.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.catalog.erasure.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.daprAppId }}
{{- end }}
