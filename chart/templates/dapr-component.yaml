{{- if and .Values.dapr.enabled (not (.Capabilities.APIVersions.Has "dapr.io/v1alpha1")) }}
{{- fail "Dapr is a prerequisite: dapr.enabled is on and this cluster does not serve dapr.io/v1alpha1. Install the Dapr control plane on its own release before rask (docs/architecture/deployment.md, Prerequisites; development: deploy/fixtures/dapr); rask never installs it. A cluster-less render names the API it targets: --api-versions dapr.io/v1alpha1" }}
{{- end }}
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.name }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr" }
    {{- with include "lance.natsCreds" (list . .Values.services.catalog.appId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.catalog.appId }}

{{- if and .Values.maintenance.enabled .Values.maintenance.lineageEmit (not .Values.maintenance.arrivalEnabled) }}
{{- include "lance.publishPubsub" (list . (include "lance.subPubsub" (list . .Values.maintenance.appId)) .Values.maintenance.appId) }}
{{- end }}
{{- if .Values.catalog.controlEmit }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: streamName, value: "CATALOG_CONTROL_BROADCAST" }
    - { name: durableName, value: "catalog-control-{podName}" }
    - { name: deliverPolicy, value: "new" }
    {{- include "lance.brokerWindows" . | nindent 4 }}
    {{- with include "lance.natsCreds" (list . .Values.services.catalog.appId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.catalog.appId }}

{{- if and .Values.maintenance.enabled .Values.maintenance.controlEmit }}
{{- include "lance.publishPubsub" (list . (printf "%s-%s" (.Values.pubsub.controlName | default "catalog-control-pubsub") .Values.maintenance.appId) .Values.maintenance.appId) }}
{{- end }}

{{- end }}

{{- $subscribers := list (dict "appId" .Values.services.lineage.appId "deliverPolicy" "all") }}

{{- if and .Values.maintenance.enabled .Values.maintenance.arrivalEnabled }}
{{- $subscribers = append $subscribers (dict "appId" .Values.maintenance.appId "deliverPolicy" "new") }}
{{- end }}

{{- range $subscribers }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list $ .appId) }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" $ }}" }
    - { name: name, value: "lance-dapr-{{ .appId }}" }
    - { name: queueGroupName, value: {{ .appId | quote }} }
    - { name: deliverPolicy, value: {{ .deliverPolicy | quote }} }
    {{- if eq .appId $.Values.services.lineage.appId }}
    - { name: concurrencyMode, value: "parallel" }
    - { name: maxAckPending, value: {{ required "services.lineage.deliveriesInFlight is required" $.Values.services.lineage.deliveriesInFlight | quote }} }
    {{- end }}
    - { name: durableName, value: "{{ .appId }}-durable" }

    {{- include "lance.brokerWindows" $ | nindent 4 }}
    {{- with include "lance.natsCreds" (list $ .appId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" $ }}
scopes:
  - {{ .appId }}
{{- end }}
{{- if .Values.dapr.resiliency.enabled }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list . .Values.services.lineage.appId) }}-dlq
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-{{ .Values.services.lineage.appId }}-dlq" }
    - { name: queueGroupName, value: "{{ .Values.services.lineage.appId }}-dlq" }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "{{ .Values.services.lineage.appId }}-dlq-durable" }
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- with include "lance.natsCreds" (list . .Values.services.lineage.appId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.lineage.appId }}
{{- end }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: lance-secrets
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - { name: vaultAddr, value: "{{ include "lance.vaultAddr" . }}" }
    - { name: vaultAuthMethod, value: kubernetes }
    - { name: vaultKubernetesRole, value: {{ include "lance.storeRole" (list . "{appID}") | quote }} }
    - { name: vaultKubernetesMountPath, value: {{ .Values.externalSecrets.kubernetesAuthPath | quote }} }
    - { name: vaultServiceAccountTokenPath, value: {{ include "lance.storeTokenFile" . }} }
    - { name: enginePath, value: {{ .Values.externalSecrets.kvMount | quote }} }
    - { name: vaultKVUsePrefix, value: "false" }
    - { name: skipVerify, value: "false" }
    {{- if include "lance.storeCaConfigMap" . }}
    - { name: caCert, value: {{ include "lance.storeCaFile" . }} }
    {{- end }}
scopes:
{{- range (splitList "," (include "lance.secretScopes" .) | compact) }}
  - {{ . }}
{{- end }}
{{- end }}
---
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.catalog.commitReconcile.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.catalog.commitReconcile.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.appId }}
{{- end }}
---
{{- if and .Values.dapr.enabled .Values.catalog.controlEmit .Values.catalog.controlOutbox.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.catalog.controlOutbox.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.catalog.controlOutbox.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.appId }}
{{- end }}
---
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.catalog.erasure.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.catalog.erasure.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.appId }}
{{- end }}
---
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ required "catalog.declarationConverge.bindingName is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.declarationConverge.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ required "catalog.declarationConverge.schedule is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.declarationConverge.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.appId }}
{{- end }}
---
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ required "catalog.manifestReclaim.bindingName is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.manifestReclaim.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ required "catalog.manifestReclaim.schedule is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.manifestReclaim.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.appId }}
{{- end }}
---
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.catalog.promotion.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.catalog.promotion.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.appId }}
{{- end }}
---
{{- if and .Values.dapr.enabled .Values.services.lineage.relay.enabled }}
{{- $bn := .Values.services.lineage.relay.bindingName }}
{{- if not (regexMatch "^[a-zA-Z0-9._-]+$" $bn) }}{{ fail (printf "services.lineage.relay.bindingName %q must match ^[A-Za-z0-9._-]+$: it names a Dapr Component and the route daprd delivers to" $bn) }}{{ end }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.services.lineage.relay.bindingName }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.services.lineage.relay.schedule | quote }} }
scopes:
  - {{ .Values.services.lineage.appId }}
{{- end }}
