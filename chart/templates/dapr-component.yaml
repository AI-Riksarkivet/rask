{{- if .Values.dapr.enabled }}
# Dapr pub/sub components — the catalog→lineage topic + the medallion triggers on NATS JetStream. The
# sidecar owns retry/backoff here (config, not app code); subscriptions are programmatic (each app
# serves GET /dapr/subscribe via dapr-ext-fastapi), so no declarative Subscription CRDs.
#
# PUBLISH-only component: the catalog (+ compaction when lineageEmit) publish through it. Consumer
# metadata (queue group / deliver policy) lives on the per-SUBSCRIBER components below, never here.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.name }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr" }
scopes:
  - {{ .Values.services.catalog.daprAppId }}
{{- if .Values.maintenance.lineageEmit }}
  - {{ .Values.maintenance.daprAppId }} {{/* compaction publishes maintenance lineage only when lineageEmit is on */}}
{{- end }}
{{- if .Values.catalog.controlEmit }}
---
# BROADCAST component for the catalog's OWN control-plane change-events (grants/warehouses/policies/tables).
# DEDICATED (not the shared lineage-pubsub) and with NO queueGroupName → jetstream sets no DeliverGroup, so
# EVERY catalog replica receives EVERY event and appends it to its per-replica ring buffer (GET /v1/events).
# The catalog is BOTH publisher (core/control_emit.py) and subscriber (api/dapr.py) on this one component.
# Ephemeral (no durableName) + deliverPolicy=new: a booting/redeployed replica must NOT replay 168h of past
# governance events into a fresh in-memory buffer — the buffer is a live-refresh hint window, not a log.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: deliverPolicy, value: "new" }
scopes:
  - {{ .Values.services.catalog.daprAppId }}
{{- if and .Values.maintenance.enabled .Values.maintenance.controlEmit }}
  # #79: the expired-trash purge PUBLISHES here (a reclamation is a governance change). A scope the
  # publisher is missing from is rejected by the sidecar, and the emit is best-effort — so the failure
  # would be silent, exactly like the secret-store scoping class. It publishes only; it runs no
  # subscription, so the broadcast/ephemeral semantics above are unaffected.
  - {{ .Values.maintenance.daprAppId }}
{{- end }}
{{- if .Values.medallion.enabled }}
---
# The CASCADE's view of the same control stream (§ D2 B8). A SEPARATE component, not another scope on
# the broadcast one above, because the two want opposite delivery semantics:
#
#   the console buffer  — broadcast, ephemeral, deliverPolicy=new. Every replica must see every event
#                         to answer GET /v1/events, and a missed one costs a stale refresh hint.
#   the cascade head    — queue group + DURABLE. Exactly one replica must act on a publication, and a
#                         trigger published while the producer is down must be DELIVERED on recovery,
#                         not skipped. That is the chaos-verified rule the comment block below states
#                         for every `new` subscriber, and a publication is the most expensive thing in
#                         the estate to silently drop.
#
# Sharing the broadcast component would give a scaled producer one cascade per replica, and lose any
# trigger published during a rollout — both silent.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}-{{ .Values.medallion.producer.daprAppId }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: queueGroupName, value: {{ .Values.medallion.producer.daprAppId | quote }} }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "{{ .Values.medallion.producer.daprAppId }}-control-durable" }
scopes:
  - {{ .Values.medallion.producer.daprAppId }}
{{- end }}
{{- end }}
{{- /* One component PER SUBSCRIBER app-id (see the lance.subPubsub helper): queueGroupName makes that
     app's replicas a competing-consumer group (single delivery per app — without it every replica gets
     EVERY message: jetstream only sets a DeliverGroup when queueGroupName is non-empty), and it CANNOT
     live on one shared component because lineage and lance-ray both consume lineage.events.v1 — one
     shared queue group would split those messages across the two apps. deliverPolicy differs on
     purpose: `all` for lineage (a restart replays the retained stream into the idempotent MERGE ingest —
     that replay IS the outage-durability story), `new` for the cascade head + movers (a replayed
     168h of triggers would re-fire cascades / re-run compute). The `new` subscribers ALSO get a
     durableName: an ephemeral queue-group consumer is deleted with its last member, so a trigger
     published (or unacked) while the mover is down was LOST — deliverPolicy=new skipped it on
     reconnect (the chaos-confirmed cascade stall, docs/RESILIENCE.md). A durable+queue-group consumer
     keeps its cursor across pod death AND redeploys — chaos-verified live 2026-07-06: publish-while-down
     delivered on recovery, and a rollout restart re-attached with zero "consumer name already in use"
     errors (that orphan failure applies to durables WITHOUT a queue group, not this combination).
     lineage stays ephemeral ON PURPOSE — a durable cursor would defeat its replay-rebuilds-the-graph
     recovery story. */}}
{{- $subscribers := list (dict "appId" .Values.services.lineage.daprAppId "deliverPolicy" "all") }}
{{- if .Values.medallion.enabled }}
{{- $subscribers = append $subscribers (dict "appId" .Values.medallion.producer.daprAppId "deliverPolicy" "new") }}
{{- range .Values.medallion.movers }}
{{- $subscribers = append $subscribers (dict "appId" .daprAppId "deliverPolicy" "new") }}
{{- end }}
{{- end }}
{{- range $subscribers }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list $ .appId) }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" $ }}" }
    - { name: name, value: "lance-dapr-{{ .appId }}" }
    - { name: queueGroupName, value: {{ .appId | quote }} }
    - { name: deliverPolicy, value: {{ .deliverPolicy | quote }} }
    {{- if eq .deliverPolicy "new" }}
    # Durable cursor for the trigger consumers (movers + cascade head): survives pod death and redeploys,
    # so a trigger published while the app is down is DELIVERED on recovery instead of skipped (see the
    # comment block above; chaos-verified). Name matches the app-id — one durable per subscriber app.
    - { name: durableName, value: "{{ .appId }}-durable" }
    {{- end }}
    # backOff supersedes ackWait for redelivery timing (NATS consumer semantics): its FIRST value is the
    # effective ack window, so it must not undercut the slowest handler (a compute-on mover does real
    # S3 reads+writes) — a 1s first step would concurrently redeliver mid-handling even at 1 replica.
    {{- if $.Values.dapr.resiliency.enabled }}
    # Resiliency ON: the SIDECAR owns delivery retries (Resiliency CRD, 450s = 7.5 min total: 30+60+
    # 120+240, jitter pinned off) and parks exhausted messages on the DLQ — so broker redelivery
    # becomes the CRASH-RECOVERY layer only. Its first step must exceed the sidecar's total retry
    # span, else the broker would redeliver while the sidecar still holds the message mid-retry
    # (concurrent duplicate handling). 720s > 450s holds with 270s of margin.
    # (This comment said "~10.5 min" until 2026-07-28 and dapr-resiliency.yaml said "~7.5 min" — two
    # different numbers for one schedule, neither of which the chart rendered. Both now state 7.5,
    # and .dagger/charts.go asserts the rendered value so they cannot drift apart again.)
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- else }}
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "30s,60s,120s,300s" }
    {{- end }}
scopes:
  - {{ .appId }}
{{- end }}
{{- if .Values.dapr.resiliency.enabled }}
---
{{- /* The lineage DLQ PARKING consumer — its own component, never the app's main one. The main
     lineage component is deliverPolicy=all + EPHEMERAL on purpose (replay rebuilds the graph), but
     the /lineage-dlq parking subscription rode it too — so every pod restart re-attached at the
     beginning of the retained stream and re-parked up to 168h of already-parked dead letters:
     ERROR logs + DEAD_LETTERED counts spiking on every rollout with no new loss, training operators
     to ignore the one metric that means provenance is missing (open_dapr.md §2.10). deliverPolicy=new
     plus a durable cursor parks each dead letter exactly once. Consumer config matches the
     resiliency-mode values the nats-stream-job's durable-drift reconcile expects (EXP_MAXD/EXP_BOFF) —
     this component only renders when resiliency is on, which is also the only time LINEAGE_DLQ_TOPIC
     exists. */}}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list . .Values.services.lineage.daprAppId) }}-dlq
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-{{ .Values.services.lineage.daprAppId }}-dlq" }
    - { name: queueGroupName, value: "{{ .Values.services.lineage.daprAppId }}-dlq" }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "{{ .Values.services.lineage.daprAppId }}-dlq-durable" }
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
scopes:
  - {{ .Values.services.lineage.daprAppId }}
{{- end }}
{{- if include "lance.secretsViaDapr" . }}
---
# Dapr secret store fronting OpenBao / an external Vault (Vault-API compatible). Apps read secrets via
# their sidecar (GET /v1.0/secrets/lance-secrets/<name>) instead of plaintext env — the secret-handling
# fix. Renders for the in-cluster OpenBao OR an external Vault (openbao.externalAddr), so externalizing
# the store does not force the apps back to plaintext.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: lance-secrets
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - { name: vaultAddr, value: "{{ include "lance.vaultAddr" . }}" }
    {{- if and .Values.openbao.enabled .Values.openbao.devMode }}
    - { name: vaultToken, value: {{ .Values.openbao.devToken | quote }} }
    {{- else }}
    # Prod path: NOT the dev root token (it can't authenticate against an operator-initialized OpenBao).
    # The operator supplies a real, scoped token via this Kubernetes secret; Dapr resolves it through its
    # default k8s secret store. Create it out-of-band: kubectl create secret generic <release>-openbao-token
    # --from-literal=token=<bao-token>.
    - name: vaultToken
      secretKeyRef:
        name: {{ .Release.Name }}-openbao-token
        key: token
    {{- end }}
    - { name: enginePath, value: "secret" }
    # Dapr defaults vaultKVPrefix to "dapr", so it reads secret/data/dapr/<key>; our seed writes
    # secret/data/<key>. Drop the prefix so the path is the natural secret/data/<key> (the kv-v2 nuance).
    - { name: vaultKVUsePrefix, value: "false" }
    # TLS verification tracks the Vault address scheme: an https Vault (the openbao.externalAddr prod
    # path) is verified; skipVerify only for the plain-http in-cluster dev OpenBao (no TLS to verify).
    # An unconditional "true" would leave the component fronting EVERY app secret unverified in prod.
    - { name: skipVerify, value: {{ ternary "false" "true" (hasPrefix "https://" (include "lance.vaultAddr" .)) | quote }} }
{{- $secretScopes := list .Values.services.catalog.daprAppId .Values.services.lineage.daprAppId }}
{{- if .Values.maintenance.enabled }}
{{- $secretScopes = append $secretScopes .Values.maintenance.daprAppId }}
{{- end }}
{{- if .Values.medallion.enabled }}
{{- /* The medallion plane consumes the store too (MEDALLION_SECRETS_FROM_DAPR fetches the S3 secret at
       boot when a store is configured) — unscoped, every compute-on + openbao-on medallion pod
       fail-closed with ERR_SECRET_STORES_NOT_CONFIGURED (found live 2026-07-24). */}}
{{- $secretScopes = append $secretScopes .Values.medallion.producer.daprAppId }}
{{- range .Values.medallion.movers }}
{{- $secretScopes = append $secretScopes .daprAppId }}
{{- end }}
{{- end }}
  {{- if .Values.explorer.enabled }}
  {{- /* The media plane resolves PER-STORE S3 credentials through this component: a registry store
         may name its own `secret`, and raw lives on an external backend whose keys are not the
         deployment's. Unscoped, the sidecar answers "component not found" and the object browser 500s
         on that store — which is what happened the moment the first external store was declared.
         Credentials are secret-store ONLY; there is deliberately no env fallback to fall back TO. */}}
  {{- range $name, $svc := .Values.explorer.services }}
  {{- $secretScopes = append $secretScopes ($svc.daprAppId | default $name) }}
  {{- end }}
  {{- end }}
{{- if .Values.stateStore.enabled }}
{{- /* Anything scoped to the STATE store must also be scoped here, because that component resolves its
       connection string through this one (`auth.secretStore`). Miss it and the sidecar logs
       "references a secret store that isn't loaded: lance-secrets", the state store silently does not
       load, and — the part that is easy to miss — "Actor state store not configured - actor hosting
       disabled". Derived from stateStore.scopes rather than restated, so the two lists cannot drift;
       found live 2026-07-26 when the annotator was scoped to the state store but not to this. */}}
{{- $secretScopes = concat $secretScopes .Values.stateStore.scopes }}
{{- end }}
scopes:
{{- range ($secretScopes | uniq) }}
  - {{ . }}
{{- end }}
{{- end }}
{{- end }}
