{{- if and .Values.dapr.enabled (not (.Capabilities.APIVersions.Has "dapr.io/v1alpha1")) }}
{{- fail "Dapr is a prerequisite: dapr.enabled is on and this cluster does not serve dapr.io/v1alpha1. Install the Dapr control plane on its own release before rask (docs/architecture/deployment.md, Prerequisites; development: deploy/fixtures/dapr); rask never installs it. A cluster-less render names the API it targets: --api-versions dapr.io/v1alpha1" }}
{{- end }}
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.name }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr" }
    {{- with include "lance.natsCreds" (list . .Values.services.catalog.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.catalog.daprAppId }}

{{- if and .Values.maintenance.enabled .Values.maintenance.lineageEmit (not .Values.maintenance.arrivalEnabled) }}
{{- include "lance.publishPubsub" (list . (include "lance.subPubsub" (list . .Values.maintenance.daprAppId)) .Values.maintenance.daprAppId) }}
{{- end }}
{{- if .Values.catalog.controlEmit }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: deliverPolicy, value: "new" }
    {{- with include "lance.natsCreds" (list . .Values.services.catalog.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.catalog.daprAppId }}

{{- if and .Values.maintenance.enabled .Values.maintenance.controlEmit }}
{{- include "lance.publishPubsub" (list . (printf "%s-%s" (.Values.pubsub.controlName | default "catalog-control-pubsub") .Values.maintenance.daprAppId) .Values.maintenance.daprAppId) }}
{{- end }}

{{- if and .Values.dapr.enabled .Values.services.notifications }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}-notifications
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: queueGroupName, value: "notifications" }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "notifications-control-durable" }

    {{- if .Values.dapr.resiliency.enabled }}
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- else }}
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "30s,60s,120s,300s" }
    {{- end }}
    {{- with include "lance.natsCreds" (list . "notifications") }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - notifications
{{- end }}
{{- end }}

{{- $subscribers := list (dict "appId" .Values.services.lineage.daprAppId "deliverPolicy" "all") }}

{{- $subscribers = append $subscribers (dict "appId" "notifications" "deliverPolicy" "new") }}

{{- if and .Values.maintenance.enabled .Values.maintenance.arrivalEnabled }}
{{- $subscribers = append $subscribers (dict "appId" .Values.maintenance.daprAppId "deliverPolicy" "new") }}
{{- end }}

{{- range $subscribers }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list $ .appId) }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" $ }}" }
    - { name: name, value: "lance-dapr-{{ .appId }}" }
    - { name: queueGroupName, value: {{ .appId | quote }} }
    - { name: deliverPolicy, value: {{ .deliverPolicy | quote }} }
    {{- if eq .appId "notifications" }}
    - { name: protectedTopics, value: "{{ $.Values.pubsub.topic }}" }
    - { name: publishingScopes, value: "{{ .appId }}=dlq.{{ .appId }}" }
    - { name: subscriptionScopes, value: "{{ .appId }}=dlq.{{ .appId }},{{ $.Values.pubsub.topic }}" }
    {{- end }}
    - { name: durableName, value: "{{ .appId }}-durable" }

    {{- if $.Values.dapr.resiliency.enabled }}
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- else }}
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "30s,60s,120s,300s" }
    {{- end }}
    {{- with include "lance.natsCreds" (list $ .appId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" $ }}
scopes:
  - {{ .appId }}
{{- end }}
{{- if .Values.dapr.resiliency.enabled }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list . .Values.services.lineage.daprAppId) }}-dlq
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-{{ .Values.services.lineage.daprAppId }}-dlq" }
    - { name: queueGroupName, value: "{{ .Values.services.lineage.daprAppId }}-dlq" }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "{{ .Values.services.lineage.daprAppId }}-dlq-durable" }
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- with include "lance.natsCreds" (list . .Values.services.lineage.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.lineage.daprAppId }}
{{- end }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: lance-secrets
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - { name: vaultAddr, value: "{{ include "lance.vaultAddr" . }}" }
    - { name: vaultAuthMethod, value: kubernetes }
    - { name: vaultKubernetesRole, value: {{ include "lance.storeRole" (list . "{appID}") | quote }} }
    - { name: vaultKubernetesMountPath, value: {{ .Values.externalSecrets.kubernetesAuthPath | quote }} }
    - { name: vaultServiceAccountTokenPath, value: /var/run/secrets/rask/openbao/token }
    - { name: enginePath, value: {{ .Values.externalSecrets.kvMount | quote }} }
    - { name: vaultKVUsePrefix, value: "false" }
    - { name: skipVerify, value: "false" }
scopes:
{{- range (splitList "," (include "lance.secretScopes" .) | compact) }}
  - {{ . }}
{{- end }}
{{- end }}
