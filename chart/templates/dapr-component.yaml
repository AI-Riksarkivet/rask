{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.name }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr" }
    {{- with include "lance.natsCreds" (list . .Values.services.catalog.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.catalog.daprAppId }}

{{- if and .Values.maintenance.enabled .Values.maintenance.lineageEmit (not .Values.maintenance.workTopic) }}
{{- include "lance.publishPubsub" (list . (include "lance.subPubsub" (list . .Values.maintenance.daprAppId)) .Values.maintenance.daprAppId) }}
{{- end }}
{{- if .Values.catalog.controlEmit }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: deliverPolicy, value: "new" }
    {{- with include "lance.natsCreds" (list . .Values.services.catalog.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.catalog.daprAppId }}

{{- if and .Values.maintenance.enabled .Values.maintenance.controlEmit }}
{{- include "lance.publishPubsub" (list . (printf "%s-%s" (.Values.pubsub.controlName | default "catalog-control-pubsub") .Values.maintenance.daprAppId) .Values.maintenance.daprAppId) }}
{{- end }}
{{- if and .Values.explorer.enabled .Values.explorer.controlEmit }}
{{- include "lance.publishPubsub" (list . (printf "%s-%s" (.Values.pubsub.controlName | default "catalog-control-pubsub") .Values.explorer.services.annotator.daprAppId) .Values.explorer.services.annotator.daprAppId) }}
{{- end }}

{{- if and .Values.medallion.enabled .Values.medallion.ray .Values.medallion.compute }}
{{- range .Values.medallion.stageRunners }}
{{- include "lance.publishPubsub" (list $ (printf "%s-%s" ($.Values.pubsub.controlName | default "catalog-control-pubsub") .daprAppId) .daprAppId) }}
{{- end }}
{{- end }}
{{- if .Values.medallion.enabled }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}-{{ .Values.medallion.producer.daprAppId }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: queueGroupName, value: {{ .Values.medallion.producer.daprAppId | quote }} }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "{{ .Values.medallion.producer.daprAppId }}-control-durable" }

    {{- if .Values.dapr.resiliency.enabled }}
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- else }}
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "30s,60s,120s,300s" }
    {{- end }}
    {{- with include "lance.natsCreds" (list . .Values.medallion.producer.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.medallion.producer.daprAppId }}
{{- end }}
{{- if and .Values.dapr.enabled .Values.services.notifications }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}-notifications
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-catalog-control" }
    - { name: queueGroupName, value: "notifications" }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "notifications-control-durable" }

    {{- if .Values.dapr.resiliency.enabled }}
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- else }}
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "30s,60s,120s,300s" }
    {{- end }}
    {{- with include "lance.natsCreds" (list . "notifications") }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - notifications
{{- end }}
{{- end }}

{{- $subscribers := list (dict "appId" .Values.services.lineage.daprAppId "deliverPolicy" "all") }}
{{- if .Values.medallion.enabled }}
{{- $subscribers = append $subscribers (dict "appId" .Values.medallion.producer.daprAppId "deliverPolicy" "new") }}
{{- range .Values.medallion.stageRunners }}
{{- $subscribers = append $subscribers (dict "appId" .daprAppId "deliverPolicy" "new") }}
{{- end }}
{{- end }}

{{- $subscribers = append $subscribers (dict "appId" "notifications" "deliverPolicy" "new") }}

{{- if and .Values.maintenance.enabled .Values.maintenance.workTopic }}
{{- $subscribers = append $subscribers (dict "appId" .Values.maintenance.daprAppId "deliverPolicy" "new") }}
{{- end }}

{{- range $subscribers }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list $ .appId) }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" $ }}" }
    - { name: name, value: "lance-dapr-{{ .appId }}" }
    - { name: queueGroupName, value: {{ .appId | quote }} }
    - { name: deliverPolicy, value: {{ .deliverPolicy | quote }} }
    {{- if eq .appId "notifications" }}
    - { name: protectedTopics, value: "{{ $.Values.pubsub.topic }}" }
    - { name: publishingScopes, value: "{{ .appId }}=dlq.{{ .appId }}" }
    - { name: subscriptionScopes, value: "{{ .appId }}=dlq.{{ .appId }},{{ $.Values.pubsub.topic }}" }
    {{- end }}
    - { name: durableName, value: "{{ .appId }}-durable" }

    {{- if $.Values.dapr.resiliency.enabled }}
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- else }}
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "30s,60s,120s,300s" }
    {{- end }}
    {{- with include "lance.natsCreds" (list $ .appId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" $ }}
scopes:
  - {{ .appId }}
{{- end }}
{{- if .Values.dapr.resiliency.enabled }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list . .Values.services.lineage.daprAppId) }}-dlq
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-{{ .Values.services.lineage.daprAppId }}-dlq" }
    - { name: queueGroupName, value: "{{ .Values.services.lineage.daprAppId }}-dlq" }
    - { name: deliverPolicy, value: "new" }
    - { name: durableName, value: "{{ .Values.services.lineage.daprAppId }}-dlq-durable" }
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- with include "lance.natsCreds" (list . .Values.services.lineage.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.services.lineage.daprAppId }}
{{- end }}
{{- if include "lance.secretsViaDapr" . }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: lance-secrets
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - { name: vaultAddr, value: "{{ include "lance.vaultAddr" . }}" }
    {{- if and .Values.openbao.enabled .Values.openbao.devMode }}
    - { name: vaultToken, value: {{ .Values.openbao.devToken | quote }} }
    {{- else }}
    - name: vaultToken
      secretKeyRef:
        name: {{ .Release.Name }}-openbao-token
        key: token
    {{- end }}
    - { name: enginePath, value: "secret" }
    - { name: vaultKVUsePrefix, value: "false" }
    - { name: skipVerify, value: {{ ternary "false" "true" (hasPrefix "https://" (include "lance.vaultAddr" .)) | quote }} }

{{- $secretScopes := splitList "," (include "lance.secretScopes" .) }}
scopes:
{{- range ($secretScopes | uniq) }}
  - {{ . }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.dapr.enabled .Values.maintenance.enabled .Values.maintenance.workTopic }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.maintenance.workPubsub }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-maintenance-work" }
    - { name: queueGroupName, value: {{ .Values.maintenance.daprAppId | quote }} }
    - { name: durableName, value: "{{ .Values.maintenance.daprAppId }}-work-durable" }

    {{- if .Values.dapr.resiliency.enabled }}
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "720s,720s" }
    {{- else }}
    - { name: ackWait, value: "720s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "720s,720s,720s,720s" }
    {{- end }}
    - { name: maxAckPending, value: "{{ include "lance.maintenanceMaxAckPending" . }}" }
    {{- with include "lance.natsCreds" (list . .Values.maintenance.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.maintenance.daprAppId }}

{{- include "lance.publishPubsub" (list . (printf "%s-%s" .Values.maintenance.workPubsub .Values.services.catalog.daprAppId) .Values.services.catalog.daprAppId) }}
{{- end }}
{{- if and .Values.maintenance.enabled .Values.maintenance.indexTopic }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.maintenance.indexPubsub }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr-maintenance-index" }
    - { name: queueGroupName, value: "{{ .Values.maintenance.daprAppId }}-index" }
    - { name: durableName, value: "{{ .Values.maintenance.daprAppId }}-index-durable" }
    - { name: ackWait, value: {{ .Values.maintenance.indexAckWait | quote }} }
    {{- if .Values.dapr.resiliency.enabled }}
    - { name: maxDeliver, value: "3" }
    - { name: backOff, value: "{{ .Values.maintenance.indexAckWait }},{{ .Values.maintenance.indexAckWait }}" }
    {{- else }}
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "{{ .Values.maintenance.indexAckWait }},{{ .Values.maintenance.indexAckWait }},{{ .Values.maintenance.indexAckWait }},{{ .Values.maintenance.indexAckWait }}" }
    {{- end }}
    - { name: maxAckPending, value: "{{ include "lance.maintenanceIndexMaxAckPending" . }}" }
    {{- with include "lance.natsCreds" (list . .Values.maintenance.daprAppId) }}{{ . | nindent 4 }}{{- end }}
{{- include "lance.natsAuth" . }}
scopes:
  - {{ .Values.maintenance.daprAppId }}

{{- include "lance.publishPubsub" (list . (printf "%s-%s" .Values.maintenance.indexPubsub .Values.services.catalog.daprAppId) .Values.services.catalog.daprAppId) }}
{{- end }}
