{{- if and .Values.observability.enabled .Values.observability.retention }}
{{- /*
Durable retention: a post-install/post-upgrade Helm hook that sets a database-level TTL on
GreptimeDB's `public` database (observability.dbName). Every table inherits the DB TTL
unless it sets its own — the OTel Collector's filelog `opentelemetry_logs`,
`opentelemetry_traces`, and the metrics physical table — so all
three signals age out at observability.retention instead of growing forever on the single
local disk. Idempotent: ALTER DATABASE just re-sets the value on every upgrade. It runs as
a HOOK (not a plain Job) so it re-applies after the chart has (re)created GreptimeDB, and
the retry loop tolerates GreptimeDB still starting up.

The pod template carries an explicit component label: under the prod default-deny
NetworkPolicy an unlabelled hook pod is invisible to every allow rule, and the failure is
silent (kindnet does not enforce, so it only appears on a policy-enforcing CNI).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rask.fullname" . }}-greptimedb-ttl
  labels:
    {{- include "rask.componentLabels" (list . "greptimedb-ttl") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: greptimedb-ttl
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "rask.fullname" . }}-sa-jobs
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: set-ttl
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              GT="http://{{ include "lance.greptimeHost" . }}:{{ .Values.observability.greptimePort }}"
              DB='{{ .Values.observability.dbName }}'
              TTL='{{ .Values.observability.retention }}'
              echo "waiting for GreptimeDB at $GT ..."
              until curl -sf "$GT/health" >/dev/null 2>&1; do sleep 3; done
              echo "setting $DB database ttl=$TTL"
              curl -sf "$GT/v1/sql?db=$DB" \
                --data-urlencode "sql=ALTER DATABASE $DB SET 'ttl'='$TTL'" \
                | grep -q affectedrows
              echo "retention applied: $TTL"
{{- if .Values.observability.auditRetention }}
              # THE AUDIT TABLE'S OWN TTL, which is the whole point of routing it out of
              # `opentelemetry_logs`: a new table inherits the database's retention, so the split
              # without this line would change which table the trail is in and nothing about when it
              # is destroyed. A table-level TTL overrides the database's — verified against GreptimeDB
              # v1.1.1, read back by SHOW CREATE TABLE.
              AUDIT_TABLE='{{ .Values.observability.auditTable }}'
              AUDIT_TTL='{{ .Values.observability.auditRetention }}'
              echo "setting $AUDIT_TABLE table ttl=$AUDIT_TTL"
              # IT WAITS FOR THE TABLE, and the reason is an ordering this hook cannot win otherwise.
              # The Collector CREATES the audit table on the first audit record, and it creates it
              # INHERITING the database TTL just set above — so on any estate where the table is not
              # there when the hook fires, a single attempt leaves the governance trail on the
              # telemetry retention. Measured 2026-09-18 on the live estate: the hook ran, found no
              # table, and `SHOW CREATE TABLE lance_audit` read `ttl = '14days'` a minute later once
              # the first record created it. Deferring to "the next upgrade" is not a retention
              # policy — an estate that is never upgraded again keeps the 14 days forever.
              #
              # Bounded rather than unbounded: a fresh estate that has genuinely emitted nothing has
              # no trail to protect yet, and blocking the hook on it would block every install. It
              # says which of the two happened instead of exiting 0 either way.
              AUDIT_APPLIED=""
              i=0
              while [ "$i" -lt 36 ]; do
                AUDIT_OUT="$(curl -s "$GT/v1/sql?db=$DB" \
                  --data-urlencode "sql=ALTER TABLE $AUDIT_TABLE SET 'ttl'='$AUDIT_TTL'")"
                if echo "$AUDIT_OUT" | grep -q affectedrows; then
                  AUDIT_APPLIED=yes
                  break
                fi
                if ! echo "$AUDIT_OUT" | grep -qiE "not found|does not exist|TableNotFound"; then
                  echo "FAILED to set audit retention: $AUDIT_OUT" >&2
                  exit 1
                fi
                i=$((i + 1))
                sleep 5
              done
              if [ -n "$AUDIT_APPLIED" ]; then
                echo "audit retention applied: $AUDIT_TTL"
              else
                echo "audit table $AUDIT_TABLE still absent after 3m — no audit record has been emitted on this estate yet, so there is no trail to retain; the next upgrade applies $AUDIT_TTL"
              fi
{{- end }}
{{- end }}
