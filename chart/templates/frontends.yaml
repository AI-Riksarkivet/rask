
{{- if .Values.frontend.enabled }}
{{- $root := . -}}
{{- $fe := .Values.frontend -}}

{{- $gwPort := $root.Values.services.gateway.port -}}

{{- $expected := list (printf "LINEAGE:%s" $root.Values.services.lineage.daprAppId) -}}
{{- if $root.Values.dapr.resiliency.enabled -}}
{{- $expected = append $expected (printf "DLQ:%s" $root.Values.services.lineage.daprAppId) -}}
{{- end -}}
{{- if $root.Values.catalog.controlEmit -}}
{{- $expected = append $expected (printf "CATALOG_CONTROL:%s" $root.Values.services.catalog.daprAppId) -}}
{{- end -}}
{{- range $fe.apps }}
{{- $comp := printf "web-%s" .name -}}

{{- $tag := .tag | default $fe.image.tag -}}

{{- $tier := (index $root.Values.resources $comp) | default $fe.resources -}}


{{- $ro := $root.Values.security.readOnlyRootFilesystem -}}
{{- $sc := merge (deepCopy ($fe.securityContext | default dict)) (dict "runAsNonRoot" true "readOnlyRootFilesystem" $ro "seccompProfile" (dict "type" "RuntimeDefault")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $comp }}
  labels:
    {{- include "rask.componentLabels" (list $root $comp) | nindent 4 }}
spec:
  replicas: {{ (hasKey $fe "replicas") | ternary $fe.replicas 1 }}
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $comp }}
  template:
    metadata:
      labels:
        {{- include "rask.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $comp }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if $root.Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" $comp | nindent 6 }}
      {{- end }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lance.fullname" $root }}-sa-web
      securityContext:
        {{- toYaml $fe.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .name }}
          image: {{ include "rask.image" (list $root (printf "web-%s" .name) $tag) | quote }}
          imagePullPolicy: {{ $fe.image.pullPolicy | default $root.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $sc | nindent 12 }}
          {{- include "lance.preStop" $root | nindent 10 }}
          env:
            - name: BODY_SIZE_LIMIT
              value: {{ $root.Values.frontend.bodySizeLimit | default "32M" | quote }}

            {{- include "rask.zoneOtelEnv" (list $root (printf "web-%s" .name)) | nindent 12 }}


            {{- with include "rask.rayServeOrigin" $root }}
            - name: STUDIO_SERVE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: RASK_GATEWAY_URL
              value: {{ printf "http://%s-gateway:%v" (include "rask.fullname" $root) $gwPort | quote }}
            - name: LANCE_GATEWAY_URL
              value: {{ printf "http://%s-gateway:%v" (include "rask.fullname" $root) $gwPort | quote }}
            - name: CATALOG_API
              value: {{ printf "http://%s-catalog:%v" (include "rask.fullname" $root) $root.Values.services.catalog.port | quote }}
            - name: LINEAGE_API
              value: {{ printf "http://%s-lineage:%v" (include "rask.fullname" $root) $root.Values.services.lineage.port | quote }}
            {{- with ($root.Values.observability.query).url }}
            - name: GREPTIME_API
              value: {{ . | quote }}
            - name: GREPTIME_AUDIT_TABLE
              value: {{ $root.Values.observability.query.auditTable | quote }}
            {{- end }}
            {{- with $root.Values.nats.monitorUrl }}
            - name: NATS_MONITOR_API
              value: {{ . | quote }}
            {{- if $root.Values.dapr.enabled }}
            - name: JETSTREAM_EXPECTED_CONSUMERS
              value: {{ join "," $expected | quote }}
            {{- end }}
            {{- end }}
            - name: PORT
              value: {{ $fe.service.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PROTOCOL_HEADER
              value: "x-forwarded-proto"
            - name: HOST_HEADER
              value: "x-forwarded-host"
            - name: IDLE_TIMEOUT
              value: {{ (hasKey $fe "idleTimeoutSeconds") | ternary $fe.idleTimeoutSeconds 255 | quote }}
            {{- if $root.Values.auth.enabled }}
            - name: LINEAGE_SERVICE_TOKEN_FILE
              value: /var/run/secrets/rask/identity/rask-lineage/token
            {{- if $fe.oidc.enabled }}

            {{- if not $fe.oidc.publicIssuer }}{{ fail "frontend.oidc.enabled requires frontend.oidc.publicIssuer (a browser-reachable IdP)" }}{{- end }}
            {{- if not $fe.oidc.publicOrigin }}{{ fail "frontend.oidc.enabled requires frontend.oidc.publicOrigin (the browser-reachable origin)" }}{{- end }}
            - name: OIDC_ISSUER
              value: {{ $fe.oidc.publicIssuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $root.Values.dex.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-frontend-session
                  key: clientSecret
            - name: OIDC_REDIRECT_URI
              value: {{ printf "%s/auth/callback" ($fe.oidc.publicOrigin | trimSuffix "/") | quote }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-frontend-session
                  key: secret
            - name: OIDC_INTERNAL_ISSUER
              value: {{ printf "http://%s:5556/dex" (include "lance.dexHost" $root) | quote }}
            {{- end }}
            {{- end }}

            {{- if and $root.Values.explorer.enabled (or (eq .name "explorer") (eq .name "annotator")) }}
            - name: VIEWER_API
              value: {{ printf "http://%s-viewer:%v" (include "rask.fullname" $root) $root.Values.explorer.services.viewer.port | quote }}
            - name: ANNOTATOR_API
              value: {{ printf "http://%s-annotator:%v" (include "rask.fullname" $root) $root.Values.explorer.services.annotator.port | quote }}
            - name: SEARCH_API
              value: {{ printf "http://%s-search:%v" (include "rask.fullname" $root) $root.Values.explorer.services.search.port | quote }}
            {{- if and (eq .name "annotator") $root.Values.runners.enabled }}
            - name: MEDIA_ASSIST_URL
              value: {{ printf "http://%s-assist:%v/v1/assist" (include "rask.fullname" $root) $root.Values.runners.assist.port | quote }}
            {{- if $root.Values.runners.jobsUrl }}
            - name: MEDIA_JOBS_URL
              value: {{ $root.Values.runners.jobsUrl | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $fe.service.port }}

          {{- include "lance.tcpProbes" "http" | nindent 10 }}
          resources:
            {{- toYaml $tier | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" $root | nindent 12 }}
            {{- include "lance.identityTokens" (list "mounts" "rask-lineage") | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" $root | nindent 8 }}
        {{- include "lance.identityTokens" (list "volumes" "rask-lineage") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $comp }}
  labels:
    {{- include "rask.componentLabels" (list $root $comp) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $fe.service.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
{{- end }}
{{- end }}
