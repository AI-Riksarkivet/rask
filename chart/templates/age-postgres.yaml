{{- if .Values.age.enabled }}
# Apache AGE Postgres — OpenFGA's datastore (db 'openfga') and the Dapr state store (db 'daprstate'). Lineage keeps
# no database (ADR 0158). initdb scripts (alphabetical) load AGE into the bootstrap database, then create the two.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lance.ageHost" . }}-init
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  10-age.sql: |
    -- The bootstrap database (POSTGRES_DB) holds nothing, and carries the extension for the reason the two below do.
    CREATE EXTENSION IF NOT EXISTS age;
  20-openfga.sql: |
    -- Quoted identifier (same reason as the index names above) so a hyphenated openfgaDb can't break initdb.
    CREATE DATABASE "{{ .Values.age.openfgaDb }}";
    -- Keep the openfga db off AGE's ag_catalog search path so openfga's own objects resolve in public.
    ALTER DATABASE "{{ .Values.age.openfgaDb }}" SET search_path = public;
    -- ...AND the schema must EXIST, which the line above does not give it. `shared_preload_libraries = age`
    -- loads AGE into EVERY backend in the cluster and its hook dereferences ag_catalog, so in a database
    -- without the extension every DROP fails with `schema "ag_catalog" does not exist` (SQLSTATE 3F000) —
    -- measured 2026-08-15: CREATE TABLE succeeded and DROP TABLE failed here and in the Dapr state db,
    -- while the same round-trip passed in the lineage db, the only one that had the extension.
    -- That is what wedged OpenFGA at schema v5 (migration 006 drops an index) and failed every upgrade.
    -- Removing age from shared_preload_libraries is not an option; AGE requires it.
    \c "{{ .Values.age.openfgaDb }}"
    CREATE EXTENSION IF NOT EXISTS age;
  30-daprstate.sql: |
    -- The Dapr state store's own database: operational state (notification inboxes, each person's UI
    -- state, actor and workflow state) that Lance must not hold — a per-item state flip would be a dataset
    -- version, so hundreds of manifests a minute and a history that is noise rather than provenance.
    --
    -- Its own database: Dapr owns this schema completely (it creates and migrates its own tables), so a Dapr
    -- migration can reach nothing else. Same isolation argument as openfga's.
    CREATE DATABASE "{{ .Values.age.stateDb }}";
    ALTER DATABASE "{{ .Values.age.stateDb }}" SET search_path = public;
    -- Same ag_catalog-must-exist rule as openfga above, and it matters MORE here: Dapr migrates this
    -- schema itself, so a future Dapr version whose migration drops anything would fail against the
    -- store holding actor state and workflow history.
    \c "{{ .Values.age.stateDb }}"
    CREATE EXTENSION IF NOT EXISTS age;
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.ageHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports:
    - { name: postgres, port: {{ .Values.age.port }}, targetPort: 5432 }
  selector:
    app.kubernetes.io/component: age
    app.kubernetes.io/instance: {{ .Release.Name }}
---

{{- $existingSts := lookup "apps/v1" "StatefulSet" .Release.Namespace (include "lance.ageHost" .) }}
{{- if $existingSts }}
{{- range $existingSts.spec.volumeClaimTemplates }}
{{- if eq .metadata.name "data" }}
{{- $current := .spec.resources.requests.storage }}
{{- if ne (toString $current) (toString $.Values.age.storage) }}
{{- fail (printf "age.storage=%s but the deployed AGE StatefulSet's volumeClaimTemplate requests %s — volumeClaimTemplates are immutable, so this upgrade cannot resize the volume. To resize: patch the PVC (kubectl patch pvc data-%s-0 -p '{\"spec\":{\"resources\":{\"requests\":{\"storage\":\"%s\"}}}}'), delete the StatefulSet with --cascade=orphan (pods and PVC stay), then re-run the upgrade. See docs/runbooks/RUNBOOK-restore.md. To keep the current size, revert age.storage to %s." (toString $.Values.age.storage) (toString $current) (include "lance.ageHost" $) (toString $.Values.age.storage) (toString $current)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lance.ageHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "lance.ageHost" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: age
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: age
    spec:
      serviceAccountName: {{ include "lance.fullname" . }}-sa-age
      {{- if .Values.security.infraContexts.enabled }}
      # Per-image uid/fsGroup from values (the audit: data/secret holders need runAsUser+fsGroup for
      # their PVCs — no blind helper reuse). Flag default OFF: flip after the kind boot check (§7a).
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.infraContexts.age.runAsUser }}
        {{- with .Values.security.infraContexts.age.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.age.image }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.age.user | quote }} }
            # From a k8s Secret (not a plaintext pod-spec value) — the audit's 'POSTGRES_PASSWORD plaintext
            # on the DB server pod' fix. Prod populates the Secret from OpenBao via the operator.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: postgres-password }
            - { name: POSTGRES_DB, value: {{ .Values.age.bootstrapDb | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.age.user | quote }}, "-d", {{ .Values.age.bootstrapDb | quote }}] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- include "lance.resources" (dict "root" . "comp" "age") | nindent 12 }}
      volumes:
        - name: init
          configMap: { name: {{ include "lance.ageHost" . }}-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.age.storage }} } }
{{- end }}
