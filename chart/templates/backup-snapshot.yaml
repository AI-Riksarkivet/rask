{{- if .Values.backups.volumeSnapshot.enabled }}
# CSI VolumeSnapshot of the lakehouse PVCs on a schedule. Needs an in-cluster CSI snapshotter +
# a VolumeSnapshotClass. The store is the rustfs fixture's StatefulSet, so this snapshots its claims —
# selected by the component label its volumeClaimTemplates stamp, one VolumeSnapshot per volume (the
# fixture runs one drive; a store spread over several drives restores only as a SET from the same run).
# With S3 external (objectStore.enabled=false) there is nothing to snapshot: the platform's store owns
# its own durability.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lance.fullname" . }}-snapshot
  labels: {{- include "lance.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lance.fullname" . }}-snapshot
  labels: {{- include "lance.labels" . | nindent 4 }}
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create"]
  # Enumerate the store's claims by label, so the CronJob names none of them.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lance.fullname" . }}-snapshot
  labels: {{- include "lance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lance.fullname" . }}-snapshot
subjects:
  - kind: ServiceAccount
    name: {{ include "lance.fullname" . }}-snapshot
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lance.fullname" . }}-object-store-snapshot
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backups.volumeSnapshot.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          # The explicit component label (the P4 landmine, see backup-pg.yaml): object-store-backup is the
          # component the object-store ingress rule already allowlists for this workload (network-policy.yaml 3d)
          # and the label the created VolumeSnapshot CRs carry — one name for the whole backup surface.
          labels:
            {{- include "lance.labels" . | nindent 12 }}
            app.kubernetes.io/component: object-store-backup
        spec:
          serviceAccountName: {{ include "lance.fullname" . }}-snapshot
          restartPolicy: OnFailure
          containers:
            - name: snapshot
              image: {{ .Values.backups.volumeSnapshot.kubectlImage }}
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { cpu: "200m", memory: "128Mi" }
              command:
                - sh
                - -c
                - |
                  set -e
                  stamp=$(date +%Y%m%d%H%M%S)
                  pvcs=$(kubectl get pvc -l app.kubernetes.io/component=rustfs -o name)
                  [ -n "$pvcs" ] || { echo "no object-store data PVCs found — nothing to snapshot"; exit 1; }
                  for pvc in $pvcs; do
                    name=${pvc#persistentvolumeclaim/}
                    cat <<EOF | kubectl create -f -
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: ${name}-${stamp}
                    labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: object-store-backup }
                  spec:
                    {{- with .Values.backups.volumeSnapshot.snapshotClassName }}
                    volumeSnapshotClassName: {{ . | quote }}
                    {{- end }}
                    source:
                      persistentVolumeClaimName: ${name}
                  EOF
                  done
{{- end }}
