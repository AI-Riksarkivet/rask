{{- if .Values.auth.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-openfga-model
  labels:
    {{- include "rask.componentLabels" (list . "openfga-model") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openfga-model
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "lance.fullname" . }}-sa-hooks
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes: {{- include "lance.fgaToken" (list "volumes") | nindent 8 }}
      containers:
        - name: write-model
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts: {{- include "lance.fgaToken" (list "mounts") | nindent 12 }}
          env:
            - { name: FGA_API_URL, value: {{ include "lance.openfgaUrl" . | quote }} }
            {{- include "lance.fgaToken" (list "env") | nindent 12 }}
            {{- with .Values.auth.fgaStoreId }}
            - { name: RASK_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
          command: ["python", "-m", "service_kit.governed.auth.write_model"]
{{- end }}
