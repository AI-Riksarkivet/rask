{{- if .Values.explorer.enabled }}
{{- $root := . }}
{{- /* `| default dict` + a `default` per key, NOT a bare `.Values.explorer.corpus.mode` — the same
     `--reuse-values` hazard this file already documents for `encoders`, and it is not theoretical:
     `explorer.corpus` is a NEW key, and a stored release whose user values carry `media: {enabled: true}`
     makes helm 3.20 leave `explorer.corpus` NIL, aborting the ENTIRE render with "nil pointer evaluating
     interface {}.mode" (reproduced against the live rask release, 2026-07-28). Every read of the block
     goes through these variables so no site can regress independently. */}}
{{- $corpus := .Values.explorer.corpus | default dict }}
{{- $corpusMode := $corpus.mode | default "emptyDir" }}
{{- /* A typo'd mode would otherwise fall through to the emptyDir branch and quietly serve an EMPTY
     corpus — the same class of silent-wrong as the hostPath wedge this replaced, only harder to see. */}}
{{- if not (has $corpusMode (list "emptyDir" "pvc" "hostPath")) }}
{{- fail (printf "rask chart: explorer.corpus.mode=%q is not one of emptyDir|pvc|hostPath" $corpusMode) }}
{{- end }}
{{- if .Values.explorer.catalogToken }}
# The media services' catalog identity (auth-on catalogs): a bearer the annotator presents on every
# catalog read/write — FGA decides what that identity may do (the merge's writer-rung rehearsal).
# A Secret, never a plain env value; renders only when set (prod leaves it to the real secret flow).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lance.fullname" . }}-media-catalog-token
  labels: {{- include "lance.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.explorer.catalogToken | quote }}
---
{{- end }}
{{- if and (eq $corpusMode "pvc") (not $corpus.claimName) }}
# The corpus PVC the chart owns (explorer.corpus.mode=pvc with no pre-existing claimName). All three
# services mount it READ-ONLY, so accessModes must admit three concurrent readers: ReadWriteMany is the
# default and the only safe answer on a multi-node cluster. On single-node dev the default RWO-only
# provisioners (k3s local-path, kind's `standard`) will still bind an RWX claim because every pod lands
# on the one node — but that is luck, not a contract, which is why `emptyDir` and not this is the dev
# default. storageClassName is deliberately omitted when empty: the CLUSTER default provisions it
# (naming a class that doesn't exist is defect 2, and `storageClassName: ""` disables provisioning).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lance.fullname" . }}-media-corpus
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    # The corpus is loaded once and read forever — never discard it on `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ $corpus.accessMode | default "ReadWriteMany" | quote }}]
  {{- with $corpus.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: { requests: { storage: {{ $corpus.size | default "50Gi" | quote }} } }
---
{{- end }}
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# lance-media plane (merged from the lance-audio checkout per docs/LANCE_NS_HANDOFF.md): the viewer,
# search, and annotator services. All three share the catalog image (services/ tree is COPY'd whole),
# mount the CORPUS read-only from the volume explorer.corpus.mode selects (emptyDir by default — a fresh
# cluster must come up with no node preparation; `pvc` for prod; `hostPath` opt-in for a node-staged
# corpus, see the volume block below), and run CATALOG-mode reads/writes: only the annotations table
# lives in the catalog (MEDIA_READ/WRITE_BACKEND=catalog, MEDIA_CATALOG_URI → the in-release catalog
# Service).
# ─────────────────────────────────────────────────────────────────────────────────────────────────
{{- range $name, $svc := .Values.explorer.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" $root }}-{{ $name }}
  labels: {{- include "lance.labels" $root | nindent 4 }}
spec:
  replicas: {{ (hasKey $svc "replicas") | ternary $svc.replicas 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: {{ $name }}, app.kubernetes.io/instance: {{ $root.Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
      {{- if $root.Values.dapr.sidecars }}
      annotations:
        {{- /* Shared annotation surface (app-id = $svc.daprAppId — viewer/search/annotator, the exact
             ids the gateway's route rows invoke); the helper owns the full set so it never drifts. */}}
        {{- include "rask.daprAnnotations" (list $root $svc.daprAppId $svc.port) | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if $root.Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" $root }}-sa-{{ $name }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ include "lance.catalogImage" $root }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- include "lance.securityContext" $root | nindent 10 }}
          {{- include "lance.preStop" $root | nindent 10 }}
          {{- if include "lance.otelEnabled" $root }}
          command: ["opentelemetry-instrument", "uvicorn"]
          {{- else }}
          command: ["uvicorn"]
          {{- end }}
          # command/args are SPLIT so the dev-only reload flags can be appended — the same shape
          # services.yaml uses. Until 2026-07-29 this template inlined the module and flags into a
          # would never re-read it: hot reload that looks configured and does nothing, on the three
          # services (viewer, search, annotator) most worth iterating on. services.yaml's own comment
          # records that this fix "was only ever wired into fleet.yaml" — it reached services.yaml
          # and stopped there.
          args:
            - "{{ $name }}.main:app"
            - "--host=0.0.0.0"
            - "--port={{ $svc.port }}"
          ports: [{ name: http, containerPort: {{ $svc.port }} }]
          env:
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root $svc.daprAppId) | nindent 12 }}
            {{- end }}
            {{- include "lance.lineageEmitEnv" (list $root) | nindent 12 }}
            # In-pod bind: the settings default is 127.0.0.1 (dev); a pod must listen on all interfaces.
            - { name: MEDIA_HOST, value: "0.0.0.0" }
            # The corpus, mounted read-only from the node (see the volume below). db_root anchors the
            # multi-dataset registry; db_path is the default dataset; descriptors ride alongside.
            - { name: MEDIA_DB_ROOT, value: {{ $root.Values.explorer.corpusMountPath | quote }} }
            - { name: MEDIA_DB, value: "{{ $root.Values.explorer.corpusMountPath }}/transcripts_v2.lance" }
            - { name: MEDIA_DESCRIPTOR_DIR, value: "{{ $root.Values.explorer.corpusMountPath }}/descriptors" }
            # Catalog mode (the merge's env flip): annotations live in the catalog, nowhere else.
            # The storage registry, when a deployment declares one. Each store may name its own endpoint,
            # TLS posture and secret: raw lives on an EXTERNAL store while the governed tiers live on the
            # warehouse, and one process env holds only one credential pair.
            {{- with $root.Values.storage }}{{- if .stores }}
            - { name: RASK_STORES, value: {{ toJson .stores | quote }} }
            {{- end }}{{- end }}
            - { name: MEDIA_READ_BACKEND, value: {{ $root.Values.explorer.readBackend | quote }} }
            - { name: MEDIA_WRITE_BACKEND, value: {{ $root.Values.explorer.writeBackend | quote }} }
            - { name: MEDIA_CATALOG_URI, value: {{ $root.Values.explorer.catalogUri | default (printf "http://%s-catalog:%v" (include "lance.fullname" $root) $root.Values.services.catalog.port) | quote }} }
            {{- if $root.Values.explorer.catalogToken }}
            - name: MEDIA_CATALOG_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" $root }}-media-catalog-token, key: token }
            {{- end }}
            {{- if $root.Values.auth.enabled }}
            # Authn/authz for EVERY explorer service, not just the annotator (#90).
            #
            # This block was `if and (eq $name "annotator") auth.enabled`, and that scoping was the
            # deployment half of a real hole: the viewer serves page IMAGE BYTES and an S3 object
            # browser, its code has the same `CurrentSubject`/checker plumbing the annotator has, and
            # with these env vars unset the checker is deliberately permissive for dev parity. So on
            # an auth-enabled estate the catalog shipped real doors while the service that streams
            # the actual page images ran wide open — and it looked correct, because the gate existed
            # in code.
            #
            # Setting them estate-wide is safe by construction: they change behaviour ONLY where a
            # route declares an auth dependency. A service with no such route is unaffected, so this
            # cannot quietly 401 a surface nobody gated.
            #
            # The annotation TASK plane is FGA-gated too (can_claim/can_review/can_publish on
            # annotation_project:<id>, §6). Mirrors the catalog's block in services.yaml.
            {{- include "lance.governedOidcEnv" (list $root "LANCE") | nindent 12 }}
            {{- include "lance.governedFgaEnv" (list $root "LANCE") | nindent 12 }}
            {{- if eq $name "annotator" }}
            # ANNOTATOR ONLY, and it stays that way: the publish saga's identity coordinates. This is
            # a service credential for writing back annotations, which no other explorer service does.
            # Deliberately NO password here — it is seeded into OpenBao and fetched via the Dapr
            # secret store, fail-closed (the estate's secrets rule); a pinned media.catalogToken
            # (above) still wins when set.
            - { name: MEDIA_PUBLISH_TOKEN_URL, value: "http://{{ include "lance.dexHost" $root }}:{{ $root.Values.dex.port }}/dex/token" }
            - { name: MEDIA_PUBLISH_CLIENT_ID, value: {{ $root.Values.dex.clientId | quote }} }
            {{- if not (include "lance.secretsViaDapr" $root) }}
            # No OpenBao → the plaintext fallback, same as every guarded credential. With the store on,
            # the client secret is seeded as publisher-oidc-client-secret and read from the SAME bundle
            # as the publisher password (open_dapr.md §2.9 — this row shipped unguarded while the
            # comment above claimed the fail-closed rule applied).
            - { name: MEDIA_PUBLISH_CLIENT_SECRET, value: {{ $root.Values.dex.clientSecret | quote }} }
            {{- end }}
            - { name: MEDIA_PUBLISH_USERNAME, value: {{ $root.Values.dex.publisher.username | quote }} }
            {{- end }}
            {{- with include "lance.governedFgaPins" (list $root "LANCE") }}{{- . | nindent 12 }}{{- end }}
            {{- end }}
            {{- if eq $name "viewer" }}
            # The S3 object browser (ported from the retired volumes-api, R6/R20): the viewer's
            # objects endpoints read s3://images-batch* via storage.s3_client, which resolves
            # endpoint + creds from env. Same ONE credential pair as the fleet (P4 RustFS
            # unification). The viewer also joins the rustfs netpol ingress allowlist.
            - { name: RASK_S3_ENDPOINT_URL, value: {{ include "lance.s3Endpoint" $root | quote }} }
            {{- $appSecret := $root.Values.existingSecret | default (printf "%s-app" (include "rask.fullname" $root)) }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ $appSecret }}, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ $appSecret }}, key: AWS_SECRET_ACCESS_KEY }
            {{- end }}
            {{- if $root.Values.explorer.corpusS3Root }}
            # #142: ALL THREE readers serve the corpus from the governed bucket. NO secret env — the
            # SECRET half comes from the Dapr secret store (`rustfs-secret-key` in the `lance`
            # bundle, fetched fail-closed by `storage_options`); only the ENDPOINT, ROOT and the
            # ACCESS-KEY ID (an identifier, not a secret — the MEDIA_PUBLISH_* split) are config.
            - { name: MEDIA_S3_ENDPOINT, value: {{ include "lance.s3Endpoint" $root | quote }} }
            - { name: MEDIA_S3_DB_ROOT, value: {{ $root.Values.explorer.corpusS3Root | quote }} }
            {{- $mediaSecret := $root.Values.existingSecret | default (printf "%s-app" (include "rask.fullname" $root)) }}
            - name: MEDIA_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ $mediaSecret }}, key: AWS_ACCESS_KEY_ID }
            {{- end }}
            {{- if or (eq $name "search") (eq $name "viewer") }}
            # Query encoders (values.encoders). search CALLS them (vector/hybrid/rerank legs); viewer
            # only PROBES them for /api/health, which is what drives the media zone's mode gating — so
            # both must see the same URLs or the UI disables a mode search can actually serve. Rendered
            # only when set: unset leaves the settings default (127.0.0.1, unreachable in a pod) and the
            # health probe reports ok=false, which is the honest "no encoder deployed" state.
            {{- /* `default dict`, not a bare field access: `encoders` is a NEW top-level key, so under
            `helm upgrade --reuse-values` the stored values carry no `encoders` at all and
            `.Values.encoders.embedUrl` aborts the entire render with "nil pointer evaluating
            interface {}.embedUrl". Gated by scripts/verify_encoder_wiring.sh step 2b. */}}
            {{- $enc := $root.Values.encoders | default dict }}
            {{- with $enc.embedUrl }}
            - { name: MEDIA_EMBED_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with $enc.rerankUrl }}
            - { name: MEDIA_RERANK_URL, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if and (eq $name "annotator") $root.Values.runners.enabled }}
            # The assist runner (runners.yaml): flips the annotator's in-repo assist mock to REAL
            # GroundingDINO+SAM predictions — same request/response wire shape, zero code change.
            - { name: MEDIA_ASSIST_URL, value: "http://{{ include "lance.fullname" $root }}-assist:{{ $root.Values.runners.assist.port }}/v1/assist" }
            {{- if $root.Values.runners.jobsUrl }}
            # Batch-labeling submit seam — only rendered when an actual RayJob endpoint exists;
            # unset keeps the annotator's honest submit/poll mock (no fake deriver).
            - { name: MEDIA_JOBS_URL, value: {{ $root.Values.runners.jobsUrl | quote }} }
            {{- end }}
            {{- end }}
          {{- include "lance.appProbes" $root | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" $root "comp" $name) | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" $root | nindent 12 }}
            - { name: corpus, mountPath: {{ $root.Values.explorer.corpusMountPath | quote }}, readOnly: true }
      volumes:
        {{- include "lance.tmpVolume" $root | nindent 8 }}
        {{- /* The corpus volume, by explorer.corpus.mode. NO hostPath ships by DEFAULT (live-proof
             2026-07-28, defect 5): `hostPath` with `type: Directory` requires /var/media-corpus to
             already exist on the node, and when it doesn't all three pods wedge ContainerCreating with
             a kubelet event as the only clue — on a fresh cluster that is the FIRST thing explorer.enabled
             does. `emptyDir` starts every pod cleanly anywhere (the corpus datasets are then loaded into
             the pod, or read from the catalog); `pvc` is the prod posture; `hostPath` stays available for
             the node-staged corpus but is now opt-in AND DirectoryOrCreate, so it cannot wedge.

             The source itself lives in `lance.corpusVolume` (_helpers.tpl) and is INCLUDED, not
             transcribed: the readers here and the seed writer must resolve to the same volume, and
             when they did not, the seed wrote a corpus to a hostPath while these three read an
             emptyDir — green probes on both sides, an empty product, for three days. */}}
        {{- include "lance.corpusVolume" $root | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" $root }}-{{ $name }}
  labels: {{- include "lance.labels" $root | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ $svc.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: {{ $name }}, app.kubernetes.io/instance: {{ $root.Release.Name }} }
---
{{- end }}
{{- end }}
