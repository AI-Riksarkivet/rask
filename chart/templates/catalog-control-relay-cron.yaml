
{{- if and .Values.dapr.enabled .Values.dapr.sidecars .Values.catalog.controlEmit .Values.catalog.controlOutbox.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.catalog.controlOutbox.bindingName }}
  labels: {{- include "rask.componentLabels" (list . "catalog") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.catalog.controlOutbox.schedule | quote }} }
scopes:
  - {{ .Values.services.catalog.daprAppId }}
{{- end }}
