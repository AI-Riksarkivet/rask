{{- if .Values.route.enabled }}
{{- $root := . -}}
{{- if not .Values.route.parentRefs }}{{ fail "route.parentRefs must name the Gateway the routes attach to: the platform's in production, Traefik's `traefik-gateway` in kube-system on k3s" }}{{ end }}
{{- if and (include "rask.isRealDeployment" .) (not .Values.route.hostnames) }}{{ fail "route.hostnames must name the hosts the platform's Gateway routes to this release on a real deployment: a route with no hostname claims every host its listener accepts" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rask.fullname" . }}-api
  labels:
    {{- include "rask.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $row := include "rask.apiRoutes" . | fromJsonArray }}
    {{- if $row.rewrite }}
    {{- range $path := $row.paths }}
    - matches:
        - path: { type: PathPrefix, value: {{ printf "%s%s" $row.prefix $path | quote }} }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: {{ $path | quote }} }
      backendRefs:
        - name: {{ $row.service }}
          port: {{ $row.port }}
    {{- end }}
    {{- else }}
    - matches:
        {{- range $path := $row.paths }}
        - path: { type: PathPrefix, value: {{ printf "%s%s" $row.prefix $path | quote }} }
        {{- end }}
      backendRefs:
        - name: {{ $row.service }}
          port: {{ $row.port }}
    {{- end }}
    {{- end }}
{{- if and .Values.auth.enabled .Values.dex.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rask.fullname" . }}-dex
  labels:
    {{- include "rask.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /dex }
      backendRefs:
        - name: {{ include "lance.dexHost" $root }}
          port: {{ .Values.dex.port }}
{{- end }}
{{- end }}
