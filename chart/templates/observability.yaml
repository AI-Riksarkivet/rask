{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: lance-tracing
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
{{- include "lance.daprConfigSpecBody" . }}


{{- $cfgRoot := . }}
{{- range (splitList "," (include "lance.secretScopes" .) | uniq | compact | sortAlpha) }}
{{- $app := . }}
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: {{ include "lance.daprAppConfigName" (list $cfgRoot $app) }}
  labels: {{- include "lance.labels" $cfgRoot | nindent 4 }}
spec:
{{- include "lance.daprAppSpec" (list $cfgRoot $app) }}
{{- end }}
{{- end }}
---
