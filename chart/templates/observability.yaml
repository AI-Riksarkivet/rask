{{- if .Values.observability.enabled }}
{{- $got := dict "greptimedb-standalone.objectStorage.s3.bucket" (index .Values "greptimedb-standalone" "objectStorage" "s3" "bucket") }}
{{- range (.Values.storage).stores }}{{ if eq (get . "role") "observability" }}{{ $_ := set $got (printf "storage.stores[%s].bucket" .name) .bucket }}{{ end }}{{ end }}
{{- range $k, $v := $got }}{{ if ne (toString $v) $.Values.observability.bucket }}{{ fail (printf "%s (%v) must equal observability.bucket (%s)" $k $v $.Values.observability.bucket) }}{{ end }}{{ end }}
{{- end }}
---
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: lance-tracing
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
{{- include "lance.daprConfigSpecBody" . }}


{{- $cfgRoot := . }}
{{- range (splitList "," (include "lance.secretScopes" .) | uniq | compact | sortAlpha) }}
{{- $app := . }}
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: {{ include "lance.daprAppConfigName" (list $cfgRoot $app) }}
  labels: {{- include "lance.labels" $cfgRoot | nindent 4 }}
spec:
{{- include "lance.daprAppSpec" (list $cfgRoot $app) }}
{{- end }}
{{- end }}
---
