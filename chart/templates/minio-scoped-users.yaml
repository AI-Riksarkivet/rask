{{- $ray := .Values.minio.rayComputeAccessKey }}
{{- $maint := .Values.minio.maintenanceAccessKey }}
{{- $lineage := .Values.minio.lineageAccessKey }}
{{- $viewer := .Values.minio.viewerAccessKey }}
{{- $catalog := .Values.minio.catalogAccessKey }}
{{- $fixture := include "lance.baseFixture" . | fromJson }}
{{- if and .Values.minio.enabled (or $ray $maint $lineage $viewer $fixture) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rask.fullname" . }}-minio-scoped-users-{{ include "rask.bootstrapRev" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 3600
  {{- include "lance.bootstrapJobDeadline" . | nindent 2 }}
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-scoped-users
    spec:
      restartPolicy: OnFailure
      securityContext: { fsGroup: 65532 }
      serviceAccountName: {{ include "lance.fullname" . }}-sa-hooks
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        - { name: keys, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - name: minio-root
          secret: { secretName: {{ include "lance.fullname" . }}-infra-credentials, items: [{ key: minio-secret-key, path: minio-secret-key }], defaultMode: 0400 }
      initContainers:
        - name: derive
          image: {{ .Values.openbao.image }}
          {{- include "lance.rootlessSecurityContext" 65532 | nindent 10 }}
          volumeMounts:
            - { name: keys, mountPath: /keys }
            - { name: minio-root, mountPath: /minio-root, readOnly: true }
          env:
            - { name: KEYS, value: /keys }
            - { name: ROOT_FILE, value: /minio-root/minio-secret-key }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "32Mi" }
          command:
            - sh
            - -c
            - |
              set -e
              root=$(cat "$ROOT_FILE")
              {{- include "lance.scopedSecretFn" . | nindent 14 }}
              {{- range $id := list $ray $maint $lineage $catalog $viewer | compact | uniq }}
              scoped_secret {{ $id }} "$KEYS/{{ $id }}"
              {{- end }}
              {{- range $ref, $_ := $fixture }}
              scoped_secret {{ $ref }} "$KEYS/{{ $ref }}"
              {{- end }}
      containers:
        - name: mc
          image: {{ include "rask.image" (list . "minio") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.rootlessSecurityContext" 65532 | nindent 10 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            - { name: keys, mountPath: /keys, readOnly: true }
            - { name: minio-root, mountPath: /minio-root, readOnly: true }
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "384Mi" }
          env:
            - { name: HOME, value: /tmp }
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set rfs {{ include "lance.s3Endpoint" . }} {{ .Values.minio.accessKey }} "$(cat /minio-root/minio-secret-key)"; do echo wait-minio; sleep 3; done


              {{- $control := .Values.minio.bucket }}

              {{- if $maint }}
              # --- MAINTENANCE: rewrite data, never the records that govern the rewrite. -------------
              cat >/tmp/maintenance.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "ListAccountForReconcileDriftReport",
                    "Effect": "Allow",
                    "Action": ["s3:ListAllMyBuckets"],
                    "Resource": ["arn:aws:s3:::*"]
                  },
                  {
                    "Sid": "RewriteDataInAnyBucketTheSweepDiscovers",
                    "Effect": "Allow",
                    "Action": [
                      "s3:ListBucket",
                      "s3:GetBucketLocation",
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject",
                      "s3:AbortMultipartUpload",
                      "s3:ListMultipartUploadParts"
                    ],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  },
                  {
                    "Sid": "ForgetABaseRecordNeverWriteOne",
                    "Effect": "Deny",
                    "Action": ["s3:PutObject"],
                    "Resource": ["arn:aws:s3:::*/_bases/*"]
                  },
                  {
                    "Sid": "NeverTheRecordsThatGovernMaintenance",
                    "Effect": "Deny",
                    "Action": ["s3:PutObject", "s3:DeleteObject"],
                    "Resource": [
                      "arn:aws:s3:::*/_projects/*",
                      "arn:aws:s3:::*/_protection/*",
                      "arn:aws:s3:::*/_warehouses/*",
                      "arn:aws:s3:::*/_tasks/*",
                      "arn:aws:s3:::*/_transforms/*",
                      "arn:aws:s3:::*/_gates/*",
                      "arn:aws:s3:::*/__manifest/*"
                    ]
                  }
                ]
              }
              POLICY
              # The deny is on WRITES only: the sweep must READ `_warehouses/` to resolve the buckets it
              # sweeps and `_protection/` to compute the pre-pass verdict, and blinding it there would
              # widen what it destroys rather than narrow it.
              #
              # `_policies/` is NOT denied, and that exception is load-bearing rather than an oversight:
              # `_stamp_cadence` writes the per-dataset cadence stamp under `_policies/state/` on every
              # maintained dataset, and `_policy_skip_reason` reads a missing stamp as "maintain" — so
              # denying it would silently stop the cadence pacing anything and compact every policied
              # dataset on every tick, with nothing going red. The POLICY RECORDS themselves live at
              # `_policies/<kind>/` and are written only by the catalog, which holds a different
              # credential; this user can reach them, and narrowing that needs the stamp to move first.
              mc admin policy create rfs rask-maintenance /tmp/maintenance.json
              mc admin user add rfs {{ .Values.minio.maintenanceAccessKey }} "$(cat /keys/{{ .Values.minio.maintenanceAccessKey }})" || true
              mc admin policy attach rfs rask-maintenance --user {{ .Values.minio.maintenanceAccessKey }} || true
              echo "provisioned scoped user {{ .Values.minio.maintenanceAccessKey }} (rask-maintenance)"
              {{- end }}

              {{- if $ray }}
              # --- RAY COMPUTE: the jobs the engine runs. ----------------------------------------------
              cat >/tmp/ray-compute.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "CascadeDataInAnyWarehouse",
                    "Effect": "Allow",
                    "Action": [
                      "s3:ListBucket",
                      "s3:GetBucketLocation",
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject",
                      "s3:AbortMultipartUpload",
                      "s3:ListMultipartUploadParts"
                    ],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  },
                  {
                    "Sid": "TheControlBucketOnlyUnderTheCascadePrefix",
                    "Effect": "Deny",
                    "Action": ["s3:ListBucket"],
                    "Resource": ["arn:aws:s3:::{{ $control }}"],
                    "Condition": { "StringNotLike": { "s3:prefix": "medallion*" } }
                  },
                  {
                    "Sid": "NeverTheControlPlane",
                    "Effect": "Deny",
                    "Action": ["s3:*"],
                    "Resource": [
                      "arn:aws:s3:::*/_projects/*",
                      "arn:aws:s3:::*/_protection/*",
                      "arn:aws:s3:::*/_bases/*",
                      "arn:aws:s3:::*/_policies/*",
                      "arn:aws:s3:::*/_warehouses/*",
                      "arn:aws:s3:::*/_tasks/*",
                      "arn:aws:s3:::*/_transforms/*",
                      "arn:aws:s3:::*/_gates/*",
                      "arn:aws:s3:::*/_trash/*",
                      "arn:aws:s3:::*/_plans/*"
                    ]
                  },
                  {
                    "Sid": "NeverTheNamespaceIndex",
                    "Effect": "Deny",
                    "Action": ["s3:PutObject", "s3:DeleteObject"],
                    "Resource": ["arn:aws:s3:::*/__manifest/*"]
                  }
                ]
              }
              POLICY
              # The Ray lane's deny is TOTAL where maintenance's is write-only: a job reads and writes table
              # data and has no reason to read a governance record.
              #
              # THE DENY LISTS EVERY CONTROL PREFIX. `_gates/` decides which output is admitted. `_trash/` is the only thing making a dropped
              # table restorable (#75/#96), so deleting a record strands live bytes behind an `undrop` that
              # can no longer find them — silent, and unrecoverable.
              #
              # `__manifest/` is split out because the two credentials need it differently: it is the
              # authoritative namespace->table mapping (a namespace is a ROW in it, not a directory), so
              # neither may WRITE it, while the purge must READ it to re-check a trashed id's liveness
              # before destroying bytes (`maintenance/services/purge.py`). Write-deny, not total.
              #
              # `medallion*` and not `medallion/*` —
              # Lance lists with `prefix=medallion/` and `StringLike` does not match a trailing-slash
              # pattern against it, a lesson that cost a cascade the first time this policy was written.
              mc admin policy create rfs rask-ray-compute /tmp/ray-compute.json
              mc admin user add rfs {{ .Values.minio.rayComputeAccessKey }} "$(cat /keys/{{ .Values.minio.rayComputeAccessKey }})" || true
              mc admin policy attach rfs rask-ray-compute --user {{ .Values.minio.rayComputeAccessKey }} || true
              echo "provisioned scoped user {{ .Values.minio.rayComputeAccessKey }} (rask-ray-compute)"
              {{- end }}

              {{- if $lineage }}
              cat >/tmp/lineage.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "ReadAnythingItReconciles",
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetObject"],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  },
                  {
                    "Sid": "DrainItsOwnOutboxAndNothingElse",
                    "Effect": "Allow",
                    "Action": ["s3:DeleteObject"],
                    "Resource": ["arn:aws:s3:::*/_lineage_outbox/*"]
                  }
                ]
              }
              POLICY
              mc admin policy create rfs rask-lineage /tmp/lineage.json
              mc admin user add rfs {{ .Values.minio.lineageAccessKey }} "$(cat /keys/{{ .Values.minio.lineageAccessKey }})" || true
              mc admin policy attach rfs rask-lineage --user {{ .Values.minio.lineageAccessKey }} || true
              echo "provisioned scoped user {{ .Values.minio.lineageAccessKey }} (rask-lineage)"
              {{- end }}

              {{- if $catalog }}
              cat >/tmp/catalog.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "TheWholeDataPlaneItGoverns",
                    "Effect": "Allow",
                    "Action": [
                      "s3:ListBucket", "s3:GetBucketLocation", "s3:ListAllMyBuckets",
                      "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload",
                      "s3:CreateBucket", "s3:DeleteBucket"
                    ],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  }
                ]
              }
              POLICY
              mc admin policy create rfs rask-catalog /tmp/catalog.json
              mc admin user add rfs {{ .Values.minio.catalogAccessKey }} "$(cat /keys/{{ .Values.minio.catalogAccessKey }})" || true
              mc admin policy attach rfs rask-catalog --user {{ .Values.minio.catalogAccessKey }} || true
              echo "provisioned scoped user {{ .Values.minio.catalogAccessKey }} (rask-catalog)"
              {{- end }}

              {{- if $viewer }}
              cat >/tmp/viewer.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "BrowseAnythingItCanShow",
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetObject"],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  }
                ]
              }
              POLICY
              mc admin policy create rfs rask-viewer /tmp/viewer.json
              mc admin user add rfs {{ $viewer }} "$(cat /keys/{{ $viewer }})" || true
              mc admin policy attach rfs rask-viewer --user {{ $viewer }} || true
              echo "provisioned scoped user {{ $viewer }} (rask-viewer)"
              {{- end }}


              {{- range $ref, $locs := $fixture }}
              cat >/tmp/base-{{ $ref }}.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {{- range $i, $l := $locs }}
                  {{- $objects := ternary (printf "%s/%s/*" $l.bucket $l.prefix) (printf "%s/*" $l.bucket) (ne $l.prefix "") }}
                  {{ if $i }},{{ end }}{ "Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucketMultipartUploads"], "Resource": ["arn:aws:s3:::{{ $l.bucket }}"] },
                  { "Effect": "Allow", "Action": ["s3:ListBucket"], "Resource": ["arn:aws:s3:::{{ $l.bucket }}"]{{ if $l.prefix }}, "Condition": { "StringLike": { "s3:prefix": ["{{ $l.prefix }}", "{{ $l.prefix }}/*"] } }{{ end }} },
                  { "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"], "Resource": ["arn:aws:s3:::{{ $objects }}"] }
                  {{- end }}
                ]
              }
              POLICY
              {{- range $locs }}
              mc mb --ignore-existing rfs/{{ .bucket }}
              {{- end }}
              mc admin policy create rfs rask-base-{{ $ref }} /tmp/base-{{ $ref }}.json
              mc admin user add rfs {{ $ref }} "$(cat /keys/{{ $ref }})"
              if ! out=$(mc admin policy attach rfs rask-base-{{ $ref }} --user {{ $ref }} 2>&1); then
                case "$out" in *already*) ;; *) echo "$out" >&2; exit 1 ;; esac
              fi
              echo "provisioned data-base user {{ $ref }} (rask-base-{{ $ref }})"
              {{- end }}
{{- end }}
