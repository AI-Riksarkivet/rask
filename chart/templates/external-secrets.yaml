
{{- if not (.Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret") }}
{{- fail "the External Secrets Operator is a prerequisite: this cluster does not serve external-secrets.io/v1. Install it on its own release before rask (docs/architecture/deployment.md, Prerequisites); rask never installs it. A cluster-less render names the API it targets: --api-versions external-secrets.io/v1/ExternalSecret" }}
{{- end }}
{{- if and .Values.openbao.enabled .Values.openbao.externalAddr }}
{{- fail "openbao.enabled says this estate uses the development store (deploy/fixtures/openbao) and openbao.externalAddr names the platform's: set one. No credential is a chart value, so every one comes from the store the chart names." }}
{{- end }}
{{- $es := .Values.externalSecrets }}
{{- if include "lance.mintsDevCredentials" . }}
{{- if not (.Capabilities.APIVersions.Has "generators.external-secrets.io/v1alpha1/Password") }}
{{- fail "the chart's dev OpenBao takes its credentials from the External Secrets Operator's Password generator, and this cluster does not serve generators.external-secrets.io/v1alpha1. A cluster-less render names it: --api-versions generators.external-secrets.io/v1alpha1/Password" }}
{{- end }}

{{- $objectStore := and (lookup "apps/v1" "StatefulSet" .Release.Namespace (include "lance.objectStoreHost" .)) (lookup "v1" "Secret" .Release.Namespace (printf "%s-object-store-root" (include "lance.fullname" .))) }}
{{- $unlocks := dict "object-store-secret-key" (list $objectStore "object store") "postgres-password" (list (lookup "apps/v1" "StatefulSet" .Release.Namespace (include "lance.ageHost" .)) "AGE database") }}
{{- range $key, $name := include "lance.devCredentials" . | fromJson }}
{{- $held := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $store := get $unlocks $key | default (list "" "") }}
{{- if and (index $store 0) (not $held) }}
{{- fail (printf "this estate's %s already exists and %s does not: generating %s now would lock every consumer out of the data it holds. Create it from the current credential first (docs/OPERATORS.md 8, carry-forward), then upgrade." (index $store 1) $name $key) }}
{{- end }}
{{- if or (not $held) (dig "metadata" "ownerReferences" list $held) }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [{{ $key }}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
---
{{- end }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "lance.fullname" . }}-vault
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ include "lance.vaultAddrFQDN" . | quote }}
      path: {{ $es.kvMount | quote }}
      version: {{ $es.kvVersion | quote }}
      auth:
        # Kubernetes auth by default — the operator's ServiceAccount assumes the Vault role. Adjust to your
        # Vault auth backend (token / appRole / cloud) as needed.
        kubernetes:
          mountPath: {{ $es.kubernetesAuthPath | quote }}
          role: {{ $es.role | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-infra-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret the infra tier (the AGE server, openfga migrate) consumes via secretKeyRef.
    name: {{ include "lance.fullname" . }}-infra-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ `{{ .pgPassword }}` }}"
{{- if .Values.openfga.enabled }}
        # Assembled from the fetched password — the DSN is not a single stored secret.
        openfga-datastore-uri: "postgres://{{ .Values.age.user }}:{{ `{{ .pgPassword }}` }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.openfgaDb }}?sslmode=disable"
{{- end }}
  data:
    - secretKey: pgPassword
      remoteRef:
        key: postgres
        property: password
{{- if .Values.objectStore.enabled }}
---
# THE DEVELOPMENT STORE'S ROOT PAIR, an object of its own: on RustFS the root secret signs every STS session token, so
# only the store and the provisioning hook mount this Secret, and the dev store holds it at a path no Dapr app may read
# (`object-store-root`, denied in `lance.daprAppSpec`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-object-store-root
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    name: {{ include "lance.fullname" . }}-object-store-root
    creationPolicy: Owner
  data:
    # BOTH HALVES, from ONE object. The store mounts both as files from a non-optional secret volume, so a pair split
    # across two sources is a pod that cannot start rather than one that signs wrongly.
    - { secretKey: object-store-access-key, remoteRef: { key: object-store-root, property: object-store-access-key } }
    - { secretKey: object-store-secret-key, remoteRef: { key: object-store-root, property: object-store-secret-key } }
{{- end }}
{{- if .Values.observability.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-otel-collector-export
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ include "lance.fullname" . }}-otel-collector-export
    creationPolicy: Owner
  data:
    - { secretKey: username, remoteRef: { key: otel-collector-export, property: username } }
    - { secretKey: password, remoteRef: { key: otel-collector-export, property: password } }
{{- end }}
---
{{- if hasKey (include "lance.natsFiles" . | fromJson) "nats-admin-creds" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-nats-admin-creds
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ include "lance.fullname" . }}-nats-admin-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        nats.creds: |
          -----BEGIN NATS USER JWT-----
          {{ `{{ .jwt }}` }}
          ------END NATS USER JWT------

          -----BEGIN USER NKEY SEED-----
          {{ `{{ .seed }}` }}
          ------END USER NKEY SEED------
  data:
    - { secretKey: jwt, remoteRef: { key: nats-user-admin, property: jwt } }
    - { secretKey: seed, remoteRef: { key: nats-user-admin, property: seed } }
{{- end }}
{{- if hasKey (include "lance.natsFiles" . | fromJson) "object-store-bus-creds" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-object-store-bus-creds
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ include "lance.fullname" . }}-object-store-bus-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        nats.creds: |
          -----BEGIN NATS USER JWT-----
          {{ `{{ .jwt }}` }}
          ------END NATS USER JWT------

          -----BEGIN USER NKEY SEED-----
          {{ `{{ .seed }}` }}
          ------END USER NKEY SEED------
  data:
    - { secretKey: jwt, remoteRef: { key: nats-user-object-store, property: jwt } }
    - { secretKey: seed, remoteRef: { key: nats-user-object-store, property: seed } }
{{- end }}
{{- if or .Values.dapr.enabled .Values.auth.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-dapr-app-token
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ .Release.Name }}-dapr-app-token
    creationPolicy: Owner
  data:
    - { secretKey: token, remoteRef: { key: dapr-app-token, property: token } }
{{- end }}
