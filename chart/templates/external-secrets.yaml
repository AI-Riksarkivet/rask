{{- if .Values.externalSecrets.enabled }}
# external-secrets.io — the operator SYNCS the infra-credentials Secret FROM OpenBao/Vault, so the chart
# ships NO plaintext secret value (infra-credentials.yaml's static Secret is skipped when this is on).
# Requires the external-secrets operator installed in-cluster (https://external-secrets.io). The two raw
# secrets (postgres-password, rustfs-secret-key) live in Vault; the openfga DSN is ASSEMBLED from the
# fetched password via the target template (it isn't a single stored secret).
{{- $es := .Values.externalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "lance.fullname" . }}-vault
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ include "lance.vaultAddr" . | quote }}
      path: {{ $es.kvMount | quote }}
      version: {{ $es.kvVersion | quote }}
      auth:
        # Kubernetes auth by default — the operator's ServiceAccount assumes the Vault role. Adjust to your
        # Vault auth backend (token / appRole / cloud) as needed.
        kubernetes:
          mountPath: {{ $es.kubernetesAuthPath | quote }}
          role: {{ $es.role | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-infra-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret the infra tier (AGE/RustFS servers, openfga migrate) consumes via secretKeyRef.
    name: {{ include "lance.fullname" . }}-infra-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ `{{ .pgPassword }}` }}"
        rustfs-secret-key: "{{ `{{ .rustfsKey }}` }}"
        # Assembled from the fetched password — the DSN is not a single stored secret.
        openfga-datastore-uri: "postgres://{{ .Values.age.user }}:{{ `{{ .pgPassword }}` }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.openfgaDb }}?sslmode=disable"
  data:
    - secretKey: pgPassword
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: postgres-password
    - secretKey: rustfsKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: rustfs-secret-key
{{- if .Values.observability.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-observability-s3
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret greptimedb-standalone consumes via credentials.existingSecretName — the static
    # version in observability.yaml is skipped when externalSecrets is on. The access-key ID is not
    # sensitive (it ships in app env regardless); only the RustFS root secret comes from Vault.
    name: {{ .Release.Name }}-observability-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GREPTIMEDB_STANDALONE__STORAGE__ACCESS_KEY_ID: {{ .Values.rustfs.accessKey | quote }}
        GREPTIMEDB_STANDALONE__STORAGE__SECRET_ACCESS_KEY: "{{ `{{ .rustfsKey }}` }}"
  data:
    - secretKey: rustfsKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: rustfs-secret-key
{{- end }}
{{- end }}
