{{- /*
THE EXTERNAL SECRETS OPERATOR IS A PREREQUISITE ([[XC-004]]; owner, 2026-10-05: platform-run, rask never
installs it). Every Secret a pod without a sidecar mounts is written here from the store, and no credential
is a chart value, so with no operator nothing would deliver one: the render refuses rather than installing
a release whose pods wait on Secrets nobody creates. `.Capabilities` is the cluster's own answer on an
install or upgrade; a cluster-less render states the target with `--api-versions`.
*/}}
{{- if not (.Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret") }}
{{- fail "the External Secrets Operator is a prerequisite: this cluster does not serve external-secrets.io/v1. Install it on its own release before rask (docs/architecture/deployment.md, Prerequisites); rask never installs it. A cluster-less render names the API it targets: --api-versions external-secrets.io/v1/ExternalSecret" }}
{{- end }}
{{- if not (include "lance.secretsViaDapr" .) }}
{{- fail "a secret store is a prerequisite: set openbao.enabled (the chart's dev OpenBao) or openbao.externalAddr (the platform's). No credential is a chart value, so with no store nothing can deliver one." }}
{{- end }}
{{- $es := .Values.externalSecrets }}
{{- if include "lance.mintsDevCredentials" . }}
{{- if not (.Capabilities.APIVersions.Has "generators.external-secrets.io/v1alpha1/Password") }}
{{- fail "the chart's dev OpenBao takes its credentials from the External Secrets Operator's Password generator, and this cluster does not serve generators.external-secrets.io/v1alpha1. A cluster-less render names it: --api-versions generators.external-secrets.io/v1alpha1/Password" }}
{{- end }}
{{- /* AN ESTATE THAT ALREADY HOLDS DATA KEEPS ITS CREDENTIALS. The AGE database and the object store keep the
       password and root they were initialised with, so generating fresh ones beside them hands every consumer a
       credential its server refuses. On an upgrade of an estate whose stores exist, the credential Secret must
       already exist: created from the current credentials before the first upgrade, and rotated in place
       afterwards (docs/OPERATORS.md 8). `lookup` answers only against a cluster, so a cluster-less render and a
       fresh install, where no store exists yet, generate. */}}
{{- $stores := or (lookup "apps/v1" "StatefulSet" .Release.Namespace (include "lance.ageHost" .)) (lookup "apps/v1" "StatefulSet" .Release.Namespace (include "lance.minioHost" .)) }}
{{- $held := lookup "v1" "Secret" .Release.Namespace (printf "%s-dev-credentials" (include "lance.fullname" .)) }}
{{- if and $stores (not $held) }}
{{- fail (printf "this estate's AGE database or object store already exists and %s-dev-credentials does not: generating new credentials now would lock every consumer out of the data it holds. Create it from the current credentials first (docs/OPERATORS.md 8, carry-forward), then upgrade." (include "lance.fullname" .)) }}
{{- end }}
{{- /*
THE DEV OPENBAO'S CREDENTIALS, GENERATED IN THE CLUSTER. The render carries none: ESO's Password generator
fills `<release>-dev-credentials` once (`CreatedOnce`) and never again, and the dev OpenBao's seed mounts it
and writes each key into the in-memory store. It is a Secret rather than store-only because the store
forgets: the AGE database and the object store keep what they were initialised with across an OpenBao
replacement, so the next seed must write the same values. `keep` holds it through an uninstall for the same
reason the data volumes are held. Rendered only for the chart's own dev store (`lance.mintsDevCredentials`);
a real deployment is refused before it gets here (prod-credentials.yaml), and a platform store holds
credentials its operator provisioned. Rotation: docs/OPERATORS.md.
A Secret that exists with no owner was carried forward by the operator from the credentials the stores already
hold, so nothing here generates beside it; one ESO created (owned by this ExternalSecret) keeps it rendered,
since removing the owner would garbage-collect the Secret.
*/}}
{{- if or (not $held) (dig "metadata" "ownerReferences" list $held) }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "lance.fullname" . }}-dev-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [minio-secret-key, postgres-password, dapr-app-token, ray-auth-token, frontend-session-secret]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-dev-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ include "lance.fullname" . }}-dev-credentials
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "lance.fullname" . }}-dev-credentials
---
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "lance.fullname" . }}-vault
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ include "lance.vaultAddrFQDN" . | quote }}
      path: {{ $es.kvMount | quote }}
      version: {{ $es.kvVersion | quote }}
      auth:
        # Kubernetes auth by default — the operator's ServiceAccount assumes the Vault role. Adjust to your
        # Vault auth backend (token / appRole / cloud) as needed.
        kubernetes:
          mountPath: {{ $es.kubernetesAuthPath | quote }}
          role: {{ $es.role | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-infra-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret the infra tier (AGE/MinIO servers, openfga migrate) consumes via secretKeyRef.
    name: {{ include "lance.fullname" . }}-infra-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ `{{ .pgPassword }}` }}"
        minio-secret-key: "{{ `{{ .minioKey }}` }}"
        # BOTH HALVES, from ONE object. The store is a StatefulSet reading `secretKeyRef`, so a
        # pair split across two sources is a pod that cannot start rather than one that signs
        # wrongly — which is the louder failure, and still a failure.
        minio-access-key: "{{ `{{ .minioAccessKey }}` }}"
        # The compute plane's scoped pair, from the SAME Vault secret. Present here because a key
        # the static Secret has and ESO does not is a credential that works in dev and is EMPTY in
        # production — the exact failure the one-object rule exists to prevent.
        ray-compute-access-key: "{{ `{{ .rayComputeAccessKey }}` }}"
        ray-compute-secret-key: "{{ `{{ .rayComputeSecretKey }}` }}"
{{- if .Values.minio.oidc.enabled }}
        # The object store's OIDC client secret. Omitting it would render a store whose secretKeyRef
        # points at an absent key, which surfaces only with minio.oidc on.
        dex-client-secret: "{{ `{{ .dexClientSecret }}` }}"
{{- end }}
        # Assembled from the fetched password — the DSN is not a single stored secret.
        openfga-datastore-uri: "postgres://{{ .Values.age.user }}:{{ `{{ .pgPassword }}` }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.openfgaDb }}?sslmode=disable"
  data:
    - secretKey: pgPassword
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: postgres-password
    - secretKey: minioKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: minio-secret-key
    - secretKey: minioAccessKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: minio-access-key
    - secretKey: rayComputeAccessKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: ray-compute-access-key
    - secretKey: rayComputeSecretKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: ray-compute-secret-key
{{- if .Values.minio.oidc.enabled }}
    # Deliberately the EXISTING `publisher-oidc-client-secret` property, not a new `dex-client-secret`
    # one: openbao.yaml's header already glosses that key as "the Dex client secret", and there is only
    # one Dex client (`dex.clientId`) — the publisher saga and the MinIO StatefulSet are two CONSUMERS of
    # one credential. Seeding it twice under two names would mean a rotation that updates one and
    # leaves the other serving a secret Dex no longer honours, which fails at STS-assume time on a
    # path nothing tests. One credential, one home; the k8s-side key is named for the consumer.
    - secretKey: dexClientSecret
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: publisher-oidc-client-secret
{{- end }}
{{- if .Values.observability.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-observability-s3
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret greptimedb-standalone consumes via credentials.existingSecretName. The
    # access-key ID is not sensitive (it ships in app env regardless); only the store's root secret
    # comes from the store.
    name: {{ .Release.Name }}-observability-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GREPTIMEDB_STANDALONE__STORAGE__ACCESS_KEY_ID: {{ .Values.minio.accessKey | quote }}
        GREPTIMEDB_STANDALONE__STORAGE__SECRET_ACCESS_KEY: "{{ `{{ .minioKey }}` }}"
  data:
    - secretKey: minioKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: minio-secret-key
{{- end }}
{{- $otel := .Values.observability.otelCollector | default dict }}
{{- if and .Values.observability.enabled $otel.enabled (not $otel.externalEndpoint) }}
---
{{- /* The in-chart Collector's credential for the audit store, mounted as files (otel-collector.yaml). */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-otel-collector-greptime
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ include "lance.fullname" . }}-otel-collector-greptime
    creationPolicy: Owner
  data:
    - { secretKey: username, remoteRef: { key: otel-collector-greptime, property: username } }
    - { secretKey: password, remoteRef: { key: otel-collector-greptime, property: password } }
{{- end }}
{{- /* Gated on ray.auth.enabled ALONE, matching `rask.rayAuthEnv`, which emits the consuming
     secretKeyRef on that value by itself. Not on `ray.enabled`/`singleTenant.enabled`: configmap.yaml
     states that "rask's Ray is managed outside this repo, so an external address is the NORMAL case",
     and the fleet must present a bearer token to an external cluster too (measured 2026-08-16: a
     narrower gate left rask-compute in CreateContainerConfigError and the release in pending-upgrade). */}}
{{- if .Values.ray.auth.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rask.fullname" . }}-ray-auth-token
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret name+key the Ray head and the rayClient fleet services consume via
    # secretKeyRef (rask.rayAuthEnv); the token is never a chart value.
    name: {{ include "rask.fullname" . }}-ray-auth-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth_token: "{{ `{{ .rayAuthToken }}` }}"
  data:
    - secretKey: rayAuthToken
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: ray-auth-token
{{- end }}
---
{{- if .Values.backups.controlRoot.enabled }}
{{- /*
The control-root backup's S3 credential, written by ESO for a pod that MOUNTS it as a file.

A CronJob pod carries no Dapr sidecar, so the secret-store path is unavailable to it and ESO is the
one the estate admits. It is consumed as a FILE rather than a `secretKeyRef` env row deliberately:
`--credentials-file` is the only way `control_root_backup.py` accepts a credential without falling
back to the environment chain, which is the delivery path the estate forbids.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-control-root-backup-s3
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    name: {{ include "lance.fullname" . }}-control-root-backup-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # ONE key holding the JSON triple, because that is what the tool reads. Split across three
        # keys it would be three files and the tool would need to reassemble them — more moving parts
        # for no gain, and a partial write would look like a valid credential.
        credentials.json: |
          {"access_key": "{{ `{{ .minioAccessKey }}` }}", "secret_key": "{{ `{{ .minioKey }}` }}"}
  data:
    # The SAME KV key and property names the infra-credentials ExternalSecret above already fetches,
    # so this adds a consumer rather than a second place the MinIO credential is spelled.
    - secretKey: minioAccessKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: minio-access-key
    - secretKey: minioKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: minio-secret-key
{{- end }}
{{- /* The NATS credentials of the pods with no sidecar, as files (values.yaml `nats.auth`): the stream Job's admin and nats-box's monitor
       creds, and the server's operator-mode and route includes. */}}
{{- $natsFiles := include "lance.natsFiles" . | fromJson }}
{{- range $target, $user := dict "nats-admin-creds" "admin" "nats-box-creds" "monitor" }}
{{- if hasKey $natsFiles $target }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" $ }}-{{ $target }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" $ }}-vault, kind: SecretStore }
  target:
    name: {{ include "lance.fullname" $ }}-{{ $target }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        nats.creds: |
          -----BEGIN NATS USER JWT-----
          {{ `{{ .jwt }}` }}
          ------END NATS USER JWT------

          -----BEGIN USER NKEY SEED-----
          {{ `{{ .seed }}` }}
          ------END USER NKEY SEED------
  data:
    - { secretKey: jwt, remoteRef: { key: nats-user-{{ $user }}, property: jwt } }
    - { secretKey: seed, remoteRef: { key: nats-user-{{ $user }}, property: seed } }
{{- end }}
{{- end }}
{{- if hasKey $natsFiles "nats-auth" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-nats-auth
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ include "lance.fullname" . }}-nats-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        server.conf: |
          operator: "{{ `{{ .operator }}` }}"
          system_account: "{{ `{{ .systemAccount }}` }}"
          resolver: MEMORY
          resolver_preload: {{ `{{ .resolverPreload }}` }}
        route.conf: |
          routes: [
          {{- range $i := until (int .Values.nats.config.cluster.replicas) }}
            "nats://{{ `{{ .routeUser }}:{{ .routePassword }}` }}@{{ include "lance.natsHost" $ }}-{{ $i }}.{{ include "lance.natsHost" $ }}-headless:{{ $.Values.nats.config.cluster.port | default 6222 }}"
          {{- end }}
          ]
          authorization { user: "{{ `{{ .routeUser }}` }}", password: "{{ `{{ .routePassword }}` }}" }
  data:
    - { secretKey: operator, remoteRef: { key: nats-server, property: operator } }
    - { secretKey: systemAccount, remoteRef: { key: nats-server, property: system_account } }
    - { secretKey: resolverPreload, remoteRef: { key: nats-server, property: resolver_preload } }
    - { secretKey: routeUser, remoteRef: { key: nats-route, property: user } }
    - { secretKey: routePassword, remoteRef: { key: nats-route, property: password } }
{{- end }}
{{- if or .Values.dapr.sidecars .Values.auth.enabled }}
---
{{- /*
THE DAPR APP-API TOKEN, for the injector. A pod annotated `dapr.io/app-token-secret: <this>` has daprd
stamp it as `dapr-api-token` on every delivery, and the app compares it with the store's `dapr-app-token`
(`RASK_APP_TOKEN_FROM_STORE`) or with `APP_API_TOKEN` (`lance.appTokenEnv`). Both read the one store field,
so the two sides agree by construction. Gated on either consumer: `dapr.sidecars` (the annotation) or
`auth.enabled` (the env row), so neither reference can dangle. A rotation reaches a sidecar only when its
pod restarts, since the injector reads the Secret at pod creation (docs/OPERATORS.md).
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-dapr-app-token
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ .Release.Name }}-dapr-app-token
    creationPolicy: Owner
  data:
    - { secretKey: token, remoteRef: { key: {{ $es.secretPath | quote }}, property: dapr-app-token } }
{{- end }}
{{- if and .Values.frontend.enabled .Values.auth.enabled .Values.frontend.oidc.enabled }}
---
{{- /* The zones' session-cookie sealing key (AES-256-GCM) and the confidential client secret, shared by
       every zone (they all read the origin-wide cookie; home also exchanges the code). Rotating the
       sealing key signs everyone out, and reaches a zone only when it restarts. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-frontend-session
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ .Release.Name }}-frontend-session
    creationPolicy: Owner
  data:
    - { secretKey: secret, remoteRef: { key: {{ $es.secretPath | quote }}, property: frontend-session-secret } }
    - { secretKey: clientSecret, remoteRef: { key: {{ $es.secretPath | quote }}, property: publisher-oidc-client-secret } }
{{- end }}
{{- if .Values.secrets.hfTokenInStore }}
---
{{- /* A third party's credential, provisioned in the store by the operator (values.yaml `secrets`). */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rask.fullname" . }}-hf-token
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef: { name: {{ include "lance.fullname" . }}-vault, kind: SecretStore }
  target:
    name: {{ include "rask.fullname" . }}-hf-token
    creationPolicy: Owner
  data:
    - { secretKey: token, remoteRef: { key: hf-token, property: token } }
{{- end }}
