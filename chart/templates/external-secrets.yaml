{{- if .Values.externalSecrets.enabled }}
# external-secrets.io — the operator SYNCS the infra-credentials Secret FROM OpenBao/Vault, so the chart
# ships NO plaintext secret value (infra-credentials.yaml's static Secret is skipped when this is on).
# Requires the external-secrets operator installed in-cluster (https://external-secrets.io). The two raw
# secrets (postgres-password, rustfs-secret-key) live in Vault; the openfga DSN is ASSEMBLED from the
# fetched password via the target template (it isn't a single stored secret).
{{- $es := .Values.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "lance.fullname" . }}-vault
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ include "lance.vaultAddrFQDN" . | quote }}
      path: {{ $es.kvMount | quote }}
      version: {{ $es.kvVersion | quote }}
      auth:
        # Kubernetes auth by default — the operator's ServiceAccount assumes the Vault role. Adjust to your
        # Vault auth backend (token / appRole / cloud) as needed.
        kubernetes:
          mountPath: {{ $es.kubernetesAuthPath | quote }}
          role: {{ $es.role | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lance.fullname" . }}-infra-credentials
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret the infra tier (AGE/RustFS servers, openfga migrate) consumes via secretKeyRef.
    name: {{ include "lance.fullname" . }}-infra-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ `{{ .pgPassword }}` }}"
        rustfs-secret-key: "{{ `{{ .rustfsKey }}` }}"
        # The compute plane's scoped pair, from the SAME Vault secret. Present here because a key
        # the static Secret has and ESO does not is a credential that works in dev and is EMPTY in
        # production — the exact failure the one-object rule exists to prevent.
        ray-compute-access-key: "{{ `{{ .rayComputeAccessKey }}` }}"
        ray-compute-secret-key: "{{ `{{ .rayComputeSecretKey }}` }}"
{{- if .Values.auth.dedicatedServiceCredentials }}
        # The trainer's dedicated credential, for the same one-object reason as the pair above: the
        # Ray head mounts it by `secretKeyRef` because it runs no daprd, and a key the static Secret
        # has while ESO does not is a credential that works in dev and is EMPTY in production. Empty
        # is not "falls back to the shared token" — it is a privileged subject presenting nothing,
        # which the door refuses, so every governed training run would lose its provenance on exactly
        # the clusters that care most.
        service-token-{{ .Values.medallion.train.trainerIdentity }}: "{{ `{{ .trainerServiceToken }}` }}"
        service-token-{{ .Values.frontend.serviceIdentity }}: "{{ `{{ .webServiceToken }}` }}"
        {{- /* EVERY STAGE LANE'S OWN CREDENTIAL, for the same one-object reason and the same pod. The
             Ray head runs the train lane AND every stage lane, and a stage job authenticates as its
             submitting stage runner's `fga_service_identity` — not as the trainer whose token the pod
             carries, and not as the producer, which never runs there. DERIVED from `stageRunners`
             rather than listed: a hand-kept copy of that set is a list that drifts, and a missing
             entry here is not a render error but an EMPTY credential, which the door refuses. */}}
        {{- range .Values.medallion.stageRunners }}
        service-token-{{ .serviceIdentity }}: "{{ printf "{{ .%s }}" (printf "stageToken_%s" (.serviceIdentity | replace "-" "_")) }}"
        {{- end }}
{{- end }}
{{- if .Values.rustfs.oidc.enabled }}
        # The Tenant CR's OIDC client secret — same Secret, same key name, so the Vault-synced path
        # carries what the dev path seeds. Omitting it would render a Tenant whose secretKeyRef points
        # at an absent key, and that failure would surface ONLY on externalSecrets-enabled clusters with
        # rustfs.oidc on — the narrowest possible blast radius to discover in production.
        dex-client-secret: "{{ `{{ .dexClientSecret }}` }}"
{{- end }}
        # Assembled from the fetched password — the DSN is not a single stored secret.
        openfga-datastore-uri: "postgres://{{ .Values.age.user }}:{{ `{{ .pgPassword }}` }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.openfgaDb }}?sslmode=disable"
  data:
    - secretKey: pgPassword
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: postgres-password
    - secretKey: rustfsKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: rustfs-secret-key
    - secretKey: rayComputeAccessKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: ray-compute-access-key
    - secretKey: rayComputeSecretKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: ray-compute-secret-key
{{- if .Values.auth.dedicatedServiceCredentials }}
    # The SAME property `openbao.yaml` seeds — an operator provisions one value per privileged
    # identity, and this reads that one rather than minting a second name for it.
    - secretKey: trainerServiceToken
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: service-token-{{ .Values.medallion.train.trainerIdentity }}
    - secretKey: webServiceToken
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: service-token-{{ .Values.frontend.serviceIdentity }}
    {{- range .Values.medallion.stageRunners }}
    - secretKey: stageToken_{{ .serviceIdentity | replace "-" "_" }}
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: service-token-{{ .serviceIdentity }}
    {{- end }}
{{- end }}
{{- if .Values.rustfs.oidc.enabled }}
    # Deliberately the EXISTING `publisher-oidc-client-secret` property, not a new `dex-client-secret`
    # one: openbao.yaml's header already glosses that key as "the Dex client secret", and there is only
    # one Dex client (`dex.clientId`) — the publisher saga and the RustFS Tenant are two CONSUMERS of
    # one credential. Seeding it twice under two names would mean a rotation that updates one and
    # leaves the other serving a secret Dex no longer honours, which fails at STS-assume time on a
    # path nothing tests. One credential, one home; the k8s-side key is named for the consumer.
    - secretKey: dexClientSecret
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: publisher-oidc-client-secret
{{- end }}
{{- if .Values.observability.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-observability-s3
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret greptimedb-standalone consumes via credentials.existingSecretName — the static
    # version in observability.yaml is skipped when externalSecrets is on. The access-key ID is not
    # sensitive (it ships in app env regardless); only the RustFS root secret comes from Vault.
    name: {{ .Release.Name }}-observability-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GREPTIMEDB_STANDALONE__STORAGE__ACCESS_KEY_ID: {{ .Values.rustfs.accessKey | quote }}
        GREPTIMEDB_STANDALONE__STORAGE__SECRET_ACCESS_KEY: "{{ `{{ .rustfsKey }}` }}"
  data:
    - secretKey: rustfsKey
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: rustfs-secret-key
{{- end }}
{{- /* Gated on ray.auth.enabled ALONE, matching ray-auth-token.yaml's static Secret and — the reason
     both must match — `rask.rayAuthEnv`, which emits the consuming secretKeyRef on that value by
     itself. This carried `and .Values.ray.enabled .Values.singleTenant.enabled` until 2026-08-16,
     which made the ESO path fail in exactly the shape this estate calls NORMAL: configmap.yaml
     states that "rask's Ray is managed outside this repo, so an external address is the NORMAL case
     and the in-cluster head is the opt-in", so on a default install both of those are false while
     the fleet still must present a bearer token to the external cluster. The static Secret hit this
     for real (rask-compute CreateContainerConfigError, release stuck in pending-upgrade); this copy
     would have failed identically the first time anyone enabled externalSecrets. */}}
{{- if .Values.ray.auth.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rask.fullname" . }}-ray-auth-token
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "lance.fullname" . }}-vault
    kind: SecretStore
  target:
    # The SAME Secret name+key the Ray head and the rayClient fleet services consume via
    # secretKeyRef (rask.rayAuthEnv) — the static version in ray-auth-token.yaml is skipped
    # when externalSecrets is on, so the token never ships in plaintext chart values.
    name: {{ include "rask.fullname" . }}-ray-auth-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth_token: "{{ `{{ .rayAuthToken }}` }}"
  data:
    - secretKey: rayAuthToken
      remoteRef:
        key: {{ $es.secretPath | quote }}
        property: ray-auth-token
{{- end }}
{{- end }}
