{{- if .Values.backups.controlRoot.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lance.fullname" . }}-control-root-backup
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backups.controlRoot.schedule | quote }}
  # Forbid, not Replace: a run that overlaps its successor would prune against a half-written copy,
  # and the prune is what makes retention safe.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "lance.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup-control-root
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "lance.saName" (list . "backup-control-root") }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          volumes:
            {{- include "lance.identityTokens" (list "volumes" (include "lance.objectStoreAudience" .)) | nindent 12 }}
          containers:
            - name: backup
              image: "{{ include "lance.catalogImage" . }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "50m", memory: "128Mi" }
                limits: { cpu: "500m", memory: "512Mi" }
              volumeMounts:
                {{- include "lance.identityTokens" (list "mounts" (include "lance.objectStoreAudience" .)) | nindent 16 }}
              env:
                - { name: RASK_S3_ENDPOINT_URL, value: {{ include "lance.s3Endpoint" . | quote }} }
                - { name: RASK_S3_REGION, value: "us-east-1" }
                {{- include "lance.objectStoreSessionEnv" (list . "RASK" "backup-control-root") | nindent 16 }}
              args:
                - python
                - /srv/control_root_backup.py
                - backup
                - --root
                # The SAME expression `services.yaml:75` renders as LANCE_REST_ROOT, so the backup and
                # the catalog cannot disagree about which root is the control root.
                - "s3://{{ .Values.objectStore.bucket }}"
                - --keep
                - {{ .Values.backups.controlRoot.keep | quote }}
                {{- with .Values.backups.controlRoot.dest }}
                - --dest
                - {{ . | quote }}
                {{- end }}
{{- end }}
