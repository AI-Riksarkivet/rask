
{{- $components := list "catalog" "lineage" "web" "maintenance" "jobs" "viewer" "search" "annotator" "assist" "issuer-mirror" "hooks" }}
{{- if .Values.age.enabled }}
{{- $components = append $components "age" }}
{{- end }}
{{- if and .Values.openbao.enabled (not .Values.openbao.devMode) }}
{{- $components = append $components "openbao" }}
{{- end }}
{{- range $name, $_ := .Values.services }}
{{- if not (has $name $components) }}
{{- $components = append $components $name }}
{{- end }}
{{- end }}
{{- range $c := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lance.fullname" $ }}-sa-{{ $c }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lance.fullname" . }}-sa-issuer-discovery
  labels: {{- include "lance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  {{- $verifiers := list "catalog" "lineage" "issuer-mirror" }}
  {{- range $verifiers }}
  - kind: ServiceAccount
    name: {{ include "lance.fullname" $ }}-sa-{{ . }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
