
{{- $components := list "catalog" "lineage" "web" "maintenance" "medallion-producer" "minio" "age" "openbao" "dex" "jobs" "viewer" "search" "annotator" "assist" "vmalert" "alertmanager" "issuer-mirror" "hooks" }}
{{- range $name, $_ := .Values.services }}
{{- if not (has $name $components) }}
{{- $components = append $components $name }}
{{- end }}
{{- end }}
{{- range .Values.medallion.stageRunners }}
{{- $components = append $components .name }}
{{- end }}
{{- range $c := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lance.fullname" $ }}-sa-{{ $c }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lance.fullname" . }}-sa-issuer-discovery
  labels: {{- include "lance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  {{- $verifiers := list "catalog" "lineage" "medallion-producer" "issuer-mirror" }}
  {{- range .Values.medallion.stageRunners }}{{- $verifiers = append $verifiers .name }}{{- end }}
  {{- range $verifiers }}
  - kind: ServiceAccount
    name: {{ include "lance.fullname" $ }}-sa-{{ . }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
