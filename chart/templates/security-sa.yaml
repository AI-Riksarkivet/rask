{{- if .Values.security.serviceAccounts.enabled }}
# Dedicated UNBOUND ServiceAccounts per first-party workload (security audit: ~13 pods sat on the
# `default` SA with automountServiceAccountToken defaulting true — each mounted an unused k8s-API
# JWT). automountServiceAccountToken is set false ON THE SA OBJECT, not the pod spec, deliberately:
# the Dapr injector's PROJECTED token volume is untouched (the audit's guidance — verify live with
# `dapr mtls -k` before flipping the flag, §7a). No RoleBindings exist for these SAs: they are
# identities with zero API grants. NOTE: the snapshot CronJob and the Dapr dashboard pods deliberately
# do NOT take one of these — they keep their purpose-built RBAC-bound SAs unconditionally (those pods
# legitimately need the k8s API; a zero-grant swap would silently break them — audit 2026-07-24).
{{- $components := list "catalog" "lineage" "web" "gateway" "compaction" "lance-ray" "rustfs" "age" "openbao" "dex" "dapr-dashboard" "jobs" "viewer" "search" "annotator" "assist" }}
{{- range $c := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lance.fullname" $ }}-sa-{{ $c }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- range .Values.medallion.movers }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lance.fullname" $ }}-sa-{{ .name }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
