{{- if .Values.controlplane.enabled }}
{{- $name := "controlplane" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  replicas: {{ (hasKey .Values.controlplane "replicas") | ternary .Values.controlplane.replicas 1 }}
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controlplane
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "rask.daprAnnotations" (list . "controlplane" .Values.controlplane.port) | nindent 8 }}
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controlplane
        {{- include "rask.daprPodLabels" . | nindent 8 }}
        lance.dev/logs: otlp # setup_otel builds a real LoggerProvider (5dae4538), so the file-tailed line is a dup — the uvicorn/crash tier is NOT dropped, see the filter's body guard
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{/**/}}
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "rask.fullname" . }}-controlplane
      {{- include "lance.spreadConstraints" "controlplane" | nindent 6 }}
      containers:
        - name: controlplane
          image: {{ include "rask.image" (list . "controlplane") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - "controlplane:app"
            - "--host=0.0.0.0"
            - "--port={{ .Values.controlplane.port }}"
            {{- include "rask.shutdownArg" . | nindent 12 }}
            {{- include "rask.proxyHeaderArgs" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.controlplane.port }}
          # configMapRef-only: the stateless controlplane needs no S3/DB secret;
          # all required Settings come from the shared config map.
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" . }}-config
          env:
            - name: RASK_PROJECT_URL_SCHEME
              value: {{ .Values.controlplane.urlScheme | quote }}
            {{- include "rask.otelEnv" (list . "controlplane") | nindent 12 }}
            {{- if .Values.auth.enabled }}

            {{- include "lance.governedOidcEnv" . | nindent 12 }}
            {{- include "lance.governedFgaEnv" . | nindent 12 }}
            {{- with include "lance.governedFgaPins" . }}{{- . | nindent 12 }}{{- end }}
            {{- end }}
          {{/**/}}
          {{/**/}}
{{- include "rask.fleetProbes" dict | nindent 10 }}
          resources:
            {{- toYaml .Values.resources.fleet | nindent 12 }}
          {{/**/}}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "mounts") | nindent 12 }}{{ end }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "volumes") | nindent 8 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.controlplane.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform.rask.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rask.fullname" . }}-controlplane
subjects:
  - kind: ServiceAccount
    name: {{ include "rask.fullname" . }}-controlplane
    namespace: {{ .Release.Namespace }}
{{- end }}
