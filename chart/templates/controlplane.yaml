{{- if .Values.controlplane.enabled }}
{{- $name := "controlplane" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controlplane
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controlplane
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rask.fullname" . }}-controlplane
      containers:
        - name: controlplane
          image: "{{ .Values.image.repository }}{{ if .Values.image.repository }}/{{ end }}controlplane:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - "controlplane:app"
            - "--host=0.0.0.0"
            - "--port={{ .Values.controlplane.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.controlplane.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" . }}-config
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.fleet | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.controlplane.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform.rask.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rask.fullname" . }}-controlplane
subjects:
  - kind: ServiceAccount
    name: {{ include "rask.fullname" . }}-controlplane
    namespace: {{ .Release.Namespace }}
{{- end }}
