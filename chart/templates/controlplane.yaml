{{- if .Values.controlplane.enabled }}
{{- $name := "controlplane" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controlplane
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "rask.daprAnnotations" (list . "controlplane" .Values.controlplane.port) | nindent 8 }}
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controlplane
        {{- include "rask.daprPodLabels" . | nindent 8 }}
        lance.dev/logs: otlp # setup_otel builds a real LoggerProvider (5dae4538), so the file-tailed line is a dup — the uvicorn/crash tier is NOT dropped, see the filter's body guard
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rask.fullname" . }}-controlplane
      containers:
        - name: controlplane
          image: {{ include "rask.image" (list . "controlplane") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - "controlplane:app"
            - "--host=0.0.0.0"
            - "--port={{ .Values.controlplane.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.controlplane.port }}
          # configMapRef-only: the stateless controlplane needs no S3/DB secret;
          # all required Settings come from the shared config map.
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" . }}-config
          env:
            - name: RASK_PROJECT_URL_SCHEME
              value: {{ .Values.controlplane.urlScheme | quote }}
            {{- include "rask.otelEnv" (list . "controlplane") | nindent 12 }}
            {{- if .Values.auth.enabled }}
            {{- /* THE USER DOOR. `GET /api/projects/` enumerates every tenant in the estate — slug,
                   team, workload type, k8s namespace and each project's LIVE INGRESS HOST — and the
                   gateway carries it to the public edge. It answered anonymously until 2026-08-26
                   because this service declared no settings class with the estate's auth knobs, so
                   there was no `LANCE_OIDC_ENABLED` to bind and no values change could gate it.
                   It now declares ControlplaneSettings(GovernedAuthSettings, BaseSettings) and gates
                   its router on the estate reader tier; this env is what feeds that door. Emitting
                   the block without the code, or the code without the block, both look wired and do
                   nothing — the `explorer.yaml` failure. Prefix is LANCE_, matching the mixin. */}}
            {{- include "lance.governedOidcEnv" (list . "LANCE") | nindent 12 }}
            {{- include "lance.governedFgaEnv" (list . "LANCE") | nindent 12 }}
            {{- with include "lance.governedFgaPins" (list . "LANCE") }}{{- . | nindent 12 }}{{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.fleet | nindent 12 }}
          {{/* Same hardening + scratch pair as the fleet, and for the same reason: this file called
               neither, so the container rendered with no securityContext while values.yaml claimed
               every app container got one. See fleet.yaml for the full note. */}}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.controlplane.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform.rask.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rask.fullname" . }}-controlplane
subjects:
  - kind: ServiceAccount
    name: {{ include "rask.fullname" . }}-controlplane
    namespace: {{ .Release.Namespace }}
{{- end }}
