{{- if .Values.controlplane.enabled }}
{{- $name := "controlplane" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controlplane
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.dapr.sidecars }}
        dapr.io/enabled: "true"
        dapr.io/app-id: controlplane
        dapr.io/app-port: {{ .Values.controlplane.port | quote }}
        dapr.io/log-level: {{ .Values.dapr.logLevel | quote }}
        {{- with .Values.dapr.maxBodySize }}
        dapr.io/max-body-size: {{ . | quote }}
        {{- end }}
        {{- end }}
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controlplane
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rask.fullname" . }}-controlplane
      containers:
        - name: controlplane
          image: "{{ .Values.image.repository }}{{ if .Values.image.repository }}/{{ end }}controlplane:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - "controlplane:app"
            - "--host=0.0.0.0"
            - "--port={{ .Values.controlplane.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.controlplane.port }}
          # configMapRef-only: the stateless controlplane needs no S3/DB secret;
          # all required Settings come from the shared config map.
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" . }}-config
          env:
            {{- if .Values.observability.enabled }}
            - name: RASK_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://rask-greptimedb-standalone:4000/v1/otlp"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            # Generic headers apply to metrics (and anything without a signal-specific
            # override): db-name only — GreptimeDB ingests OTLP metrics with no pipeline.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "x-greptime-db-name=public"
            # Traces additionally need GreptimeDB's trace pipeline; signal-specific
            # headers override the generic ones for traces only.
            - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
              value: "x-greptime-db-name=public,x-greptime-pipeline-name=greptime_trace_v1"
            - name: OTEL_SERVICE_NAME
              value: "controlplane"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.namespace=rask,deployment.environment=%s" .Release.Namespace | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.fleet | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.componentLabels" (list . $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.controlplane.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform.rask.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rask.fullname" . }}-controlplane
  labels:
    {{- include "rask.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rask.fullname" . }}-controlplane
subjects:
  - kind: ServiceAccount
    name: {{ include "rask.fullname" . }}-controlplane
    namespace: {{ .Release.Namespace }}
{{- end }}
