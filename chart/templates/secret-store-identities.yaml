{{- $es := .Values.externalSecrets }}
{{- $ttl := required "openbao.identity.tokenTtl bounds the life of a sidecar's store token; blank, it lives as long as the store's default" .Values.openbao.identity.tokenTtl }}
{{- $maxTtl := required "openbao.identity.tokenMaxTtl bounds how long a sidecar's store token is renewed; blank, it lives as long as the store's maximum" .Values.openbao.identity.tokenMaxTtl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lance.fullname" . }}-secret-store-identities
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
{{- range $app, $reads := include "lance.storeReads" . | fromJson }}
{{- $role := include "lance.storeRole" (list $ $app) }}
  policy-{{ $role }}.json: {{ include "lance.storePolicy" (list $ (concat $reads.api $reads.components)) | quote }}
  role-{{ $role }}.json: {{ dict "bound_service_account_names" (list $reads.sa) "bound_service_account_namespaces" (list $.Release.Namespace) "audience" (include "lance.storeAudience" $) "token_policies" (list $role) "token_ttl" $ttl "token_max_ttl" $maxTtl "token_no_default_policy" true | toJson | quote }}
{{- end }}
  policy-{{ $es.role }}.json: {{ include "lance.storePolicy" (list . (include "lance.esoReads" . | fromJsonArray)) | quote }}
  role-{{ $es.role }}.json: {{ dict "bound_service_account_names" (list ($es.serviceAccount | default "external-secrets")) "bound_service_account_namespaces" (list ($es.namespace | default "external-secrets")) "token_policies" (list $es.role) "token_ttl" "1h" | toJson | quote }}
