{{- if and (not (include "lance.natsMints" .)) (not .Values.nats.auth.provisioned) }}
{{- $names := list }}
{{- range (include "lance.natsUsers" . | splitList " " | compact) }}{{- $names = append $names (printf "nats-user-%s" .) }}{{- end }}
{{- fail (printf "NATS CREDENTIALS NOT PROVISIONED: the platform's store (openbao.enabled=false), which this chart does not seed, gets no NATS user from the chart, so every pub/sub client would connect with an empty credential. Create these secrets in the store (KV v2; nats-user-<user> holds the fields jwt and seed, issued by the bus's operator with the permissions nats.auth.users lists), then --set nats.auth.provisioned=true:\n  - %s" (join "\n  - " $names)) }}
{{- end }}
