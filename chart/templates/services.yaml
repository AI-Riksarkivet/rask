{{- $root := . }}
{{- $age := include "lance.ageConnectHost" . }}
{{- if and .Values.catalog.controlEmit (not .Values.dapr.sidecars) }}
{{- fail "catalog.controlEmit=true requires dapr.sidecars=true: the /control-events broadcast ingest publishes + receives via the Dapr sidecar and is authenticated by the sidecar-injected APP_API_TOKEN — without it the catalog fails closed at boot. Enable dapr.sidecars, or set catalog.controlEmit=false." }}
{{- end }}
{{- if and (gt (int ((hasKey .Values.services.catalog "replicas") | ternary .Values.services.catalog.replicas 1)) 1) (not .Values.catalog.controlEmit) }}
{{- fail "services.catalog.replicas > 1 requires catalog.controlEmit=true: the warehouse-binding cache is invalidated across replicas by the broadcast control-event subscription (#46) — without it a second replica keeps routing dropped namespaces at deleted warehouses' buckets. Enable catalog.controlEmit, or run one replica." }}
{{- end }}
# Catalog (producer) — creates Lance tables on S3 and PUBLISHES OpenLineage events to the Dapr
# pubsub.jetstream component. The daprd sidecar (injected by the annotations) carries the publish to NATS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-catalog
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: {{ (hasKey .Values.services.catalog "replicas") | ternary .Values.services.catalog.replicas 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: catalog, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: catalog
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
      {{- if .Values.dapr.sidecars }}
      annotations:
        {{- include "rask.daprAnnotations" (list $root .Values.services.catalog.daprAppId .Values.services.catalog.port) | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if .Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" "catalog" | nindent 6 }}
      {{- end }}
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-catalog
      {{- end }}
      containers:
        - name: catalog
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          {{- if include "lance.otelEnabled" $root }}
          command: ["opentelemetry-instrument", "uvicorn"]
          {{- else }}
          command: ["uvicorn"]
          {{- end }}
          # command/args are split so the dev-only reload flags can be appended. These are the
          # fleet.yaml — so a synced file landed in the pod and the worker never re-read it.
          args:
            - {{ .Values.services.catalog.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ .Values.services.catalog.port }}"
          ports: [{ name: http, containerPort: {{ .Values.services.catalog.port }} }]
          env:
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root "catalog") | nindent 12 }}
            {{- end }}
            {{- include "lance.lineageEmitEnv" (list $root) | nindent 12 }}
            - { name: LANCE_REST_DOCS, value: {{ $root.Values.docs.enabled | quote }} }
            - { name: LANCE_REST_IMPL, value: "dir" }
            - { name: LANCE_REST_ROOT, value: "s3://{{ .Values.rustfs.bucket }}" }
            - { name: LANCE_NS_DELIMITER, value: "$" }
            - { name: LANCE_ALLOW_EXTERNAL_BLOBS, value: {{ .Values.vending.allowExternalBlobs | quote }} }
            - { name: LANCE_EXTERNAL_BLOB_BASES, value: {{ .Values.vending.externalBlobBases | default (printf "s3://%s/models/" .Values.rustfs.bucket) | quote }} }
            - { name: LANCE_MAX_BODY_BYTES, value: {{ .Values.catalog.maxBodyBytes | int64 | quote }} }
            # Load-shed cap on concurrent in-flight Arrow-IPC writes (each buffers up to maxBodyBytes).
            # hasKey+ternary, not `| default`, for the same two reasons as LANCE_AUDIT_ENABLED below: a
            # key missing under `helm upgrade --reuse-values` must render the default (not "" → pydantic
            # int_parsing crash), and the meaningful 0 (shedding off) must stay settable — Sprig's
            # default() treats 0 as empty.
            - { name: LANCE_MAX_CONCURRENT_WRITES, value: {{ hasKey .Values.catalog "maxConcurrentWrites" | ternary .Values.catalog.maxConcurrentWrites 16 | int | quote }} }
            # #75/#96 the recoverable-drop grace period. hasKey+ternary for the same two reasons as
            # above: `--reuse-values` with the key missing must render the default, and the meaningful
            # 0 (recovery OFF, destroy immediately) must stay settable past Sprig's default().
            - { name: LANCE_TRASH_GRACE_DAYS, value: {{ hasKey .Values.catalog "trashGraceDays" | ternary .Values.catalog.trashGraceDays 7 | int | quote }} }
            # #3-A per-warehouse physical multi-tenancy (admin control plane). On → POST /v1/warehouses
            # provisions a bucket per warehouse + binds namespaces; an unbound namespace still routes to
            # LANCE_REST_ROOT (backward-compatible). The warehouse registry lives under LANCE_REST_ROOT
            # (control_root defaults to it), so no extra bucket is needed.
            - { name: LANCE_WAREHOUSES_ENABLED, value: {{ .Values.catalog.warehouses.enabled | default false | quote }} }
            # Buckets no warehouse may claim (audit 2026-07-23): the medallion ZONE buckets (gold can
            # live outside the shared bucket) — the catalog root/registry bucket is always reserved in-app.
            {{- $reserved := list }}
            {{- range $ns, $bkt := .Values.medallion.buckets }}{{- $reserved = append $reserved $bkt }}{{- end }}
            - { name: LANCE_RESERVED_BUCKETS, value: {{ $reserved | uniq | join "," | quote }} }
            # #3-B Lance multi-base DATA distribution: the ALLOWLIST of bucket URIs a create may spread its
            # fragments across (?data_base=... per request, validated against this list). Empty = feature off.
            - { name: LANCE_MULTIBASE_DATA_BASES, value: {{ .Values.catalog.multibase.dataBases | default (list) | join "," | quote }} }
            - { name: LANCE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            - { name: LANCE_S3_ACCESS_KEY_ID, value: {{ .Values.rustfs.accessKey | quote }} }
            {{- if not (include "lance.secretsViaDapr" .) }}
            - { name: LANCE_S3_SECRET_ACCESS_KEY, value: {{ .Values.rustfs.secretKey | quote }} }
            {{- else }}
            # OpenBao on → the S3 secret comes ONLY from the Dapr secret store at boot; it is deliberately
            # NOT in pod env (the audit's 'plaintext still ships' fix). The catalog fails closed if the
            # store can't provide it. Needs the lance-secrets component (scoped to catalog).
            - { name: LANCE_SECRETS_FROM_DAPR, value: "true" }
            {{- end }}
            - { name: LANCE_S3_REGION, value: "us-east-1" }
            - { name: LANCE_S3_ALLOW_HTTP, value: "true" }
            - { name: LANCE_S3_VIRTUAL_HOSTED, value: "false" }
            # Data-plane credential vending (Track B). mode_b (default) = server-mediated, no creds leave the
            # catalog; sts = AssumeRole + per-table session policy against the RustFS STS endpoint (short-TTL
            # scoped creds the client uses for direct object I/O).
            - { name: LANCE_VENDING_MODE, value: {{ .Values.vending.mode | quote }} }
            {{- if or (eq .Values.vending.mode "sts") (eq .Values.vending.mode "web_identity") }}
            - { name: LANCE_S3_STS_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            - { name: LANCE_S3_ASSUME_ROLE_ARN, value: {{ .Values.vending.assumeRoleArn | quote }} }
            - { name: LANCE_VENDING_TTL_SECONDS, value: {{ .Values.vending.ttlSeconds | quote }} }
            {{- end }}
            - { name: LANCE_LINEAGE_EMIT_ENABLED, value: "true" }
            - { name: LANCE_LINEAGE_TRANSPORT, value: "dapr" }
            - { name: LANCE_DAPR_PUBSUB, value: {{ .Values.pubsub.name | quote }} }
            - { name: LANCE_DAPR_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            # Control-plane change-events (opt-in, best-effort — the governance/metadata stream). ON →
            # mutations publish a CatalogControlEvent onto a DEDICATED broadcast pubsub (no queueGroupName)
            # under topic catalog.control.v1; every replica buffers every event for GET /v1/events. hasKey+
            # ternary (NOT `| default`, which treats false as empty) so a key missing under
            # `helm upgrade --reuse-values` renders the default, not "" (pydantic bool_parsing crash).
            - { name: LANCE_CONTROL_EMIT_ENABLED, value: {{ hasKey .Values.catalog "controlEmit" | ternary .Values.catalog.controlEmit false | quote }} }
            - { name: LANCE_CONTROL_PUBSUB, value: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" | quote }} }
            {{- if .Values.dapr.sidecars }}
            # Explicit APP_API_TOKEN so require_dapr_token can verify the `dapr-api-token` header the sidecar
            # stamps on /control-events delivery → a forged direct in-cluster POST is 403'd. Without it the
            # guard silently no-ops and any pod could inject fabricated change-events into every replica's
            # buffer. Same secret + pattern as the lineage/medallion/compaction ingest apps; the catalog
            # lifespan also asserts it is set when control eventing is on (fail-closed, not silently open).
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-dapr-app-token, key: token }
            {{- end }}
            # Bound the DaprClient gRPC deadline (the SDK env) — the lineage publish is awaited INLINE in
            # every write handler, so a wedged sidecar/NATS would otherwise hang every catalog write.
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            {{- if .Values.auth.enabled }}
            {{- include "lance.governedOidcEnv" . | nindent 12 }}
            {{- include "lance.governedFgaEnv" . | nindent 12 }}
            {{- /* THE CATALOG'S SERVICE DOOR, which had no chart wiring at all — the same shape
                   LINEAGE_SERVICE_SUBJECTS has below, and absent here for no stated reason. The
                   catalog reads `LANCE_SERVICE_SUBJECTS` (catalog/core/config.py) and every caller
                   that authenticates as a SERVICE is refused until its subject is listed.

                   Without it a governed estate is broken in a way that reads as a data fault: the
                   catalog verifies OIDC JWTs, a service has no JWT, so every register 401s and the
                   medallion's `RegisterError -> _RETRY` redelivers forever. Measured on the live
                   cluster: the allowlist held `service-ingest` and nothing had put it there.

                   DERIVED from the same `medallion.movers[]` declarations the FGA seeds use, so a
                   new mover cannot be added with an identity the door never learned. */}}
            {{- $catalogSubjects := list .Values.medallion.train.trainerIdentity .Values.medallion.producer.serviceIdentity }}
            {{- range .Values.medallion.movers }}
              {{- $catalogSubjects = append $catalogSubjects .serviceIdentity }}
            {{- end }}
            {{- range $svcName, $svc := .Values.services }}
              {{- with (get ($svc.env | default dict) "RASK_CATALOG_SERVICE_IDENTITY") }}
                {{- $catalogSubjects = append $catalogSubjects . }}
              {{- end }}
            {{- end }}
            - { name: LANCE_SERVICE_SUBJECTS, value: {{ compact $catalogSubjects | uniq | sortAlpha | join "," | quote }} }
            {{- /* The cascade's WRITERS, granted `owner` on every warehouse this catalog creates.
                   Admission and authorization are different questions and this is deliberately NOT
                   $catalogSubjects: that list exists so a service may SPEAK to the catalog and includes
                   read-only identities like the web BFF, which must never hold owner on a tenant's data.
                   Only the identities that actually move data between tiers appear here — the producer
                   (which resumes a human-approved promotion, so it publishes too) and the movers.

                   Without this a tenant is created, its tiers are created, rows land in bronze, lineage
                   records the run — and the promotion is refused with `403 can_update_tag` in a mover log
                   nobody is watching. Measured five times on the live estate, once AFTER a person had
                   already approved it. */}}
            {{- $cascadeWriters := list .Values.medallion.producer.serviceIdentity }}
            {{- range .Values.medallion.movers }}
              {{- $cascadeWriters = append $cascadeWriters .serviceIdentity }}
            {{- end }}
            {{- range (.Values.medallion.mediaMovers | default list) }}
              {{- $cascadeWriters = append $cascadeWriters .serviceIdentity }}
            {{- end }}
            {{- $prefixed := list }}
            {{- range (compact $cascadeWriters | uniq | sortAlpha) }}
              {{- $prefixed = append $prefixed (printf "user:%s" .) }}
            {{- end }}
            - { name: LANCE_FGA_CASCADE_WRITERS, value: {{ toJson $prefixed | quote }} }
            {{- /* DEDICATED CREDENTIALS for the identities that hold a rung above read.
                   `dapr_auth.py` binds a PRIVILEGED subject to its own `service-token-<identity>`;
                   everyone else authenticates with the estate's SHARED APP_API_TOKEN. That control was
                   written and tested, and rendered NOWHERE — `grep -rn PRIVILEGED chart/` matched one
                   comment — so any holder of the shared token could claim any name on
                   LANCE_SERVICE_SUBJECTS, and those names hold `owner` on every warehouse
                   (LANCE_FGA_CASCADE_WRITERS, directly above): can_drop, can_deregister, can_restore
                   and manage_grants across every tenant. Reading one web pod's environment was the
                   whole attack.

                   The same set as the cascade writers plus the trainer — deliberately NOT
                   $catalogSubjects, which includes read-only identities like the web BFF that need no
                   dedicated credential. openbao.yaml seeds one token per name from this same
                   derivation; in prod an operator seeds them, and an unseeded one is a fail-closed
                   refusal rather than a silent downgrade to the shared token. */}}
            {{- $privileged := append (compact $cascadeWriters | uniq) .Values.medallion.train.trainerIdentity }}
            {{- /* NOT RENDERED YET — deliberately. Measured 2026-08-26: switching this on refuses every
                   mover, because the server-side expectation is only HALF the control. The catalog then
                   demands `service-token-<identity>` for a privileged subject, but the movers still
                   PRESENT the shared APP_API_TOKEN, so every catalog call 401s and the cascade stops
                   (`POST /v1/table/acme-silver$features/describe -> 401`, repeating). Turning it on
                   needs the CLIENT half too: each privileged service must read its own dedicated token
                   out of the secret store and send THAT instead of APP_API_TOKEN.
                   The tokens are already seeded (openbao.yaml) and the derivation below is correct; what
                   is missing is the outbound wiring, which is a service change, not a chart one. */}}
            {{- if .Values.auth.dedicatedServiceCredentials }}
            - { name: LANCE_PRIVILEGED_SUBJECTS, value: {{ compact $privileged | uniq | sortAlpha | join "," | quote }} }
            {{- end }}
            {{- with include "lance.governedFgaPins" . }}{{- . | nindent 12 }}{{- end }}
            # #41 compliance audit trail (who/what/outcome for authn/authz/vending) — configurable.
            # hasKey+ternary, NOT `| default`: Sprig's default() treats boolean false as empty (making
            # `false` un-settable), while a bare reference renders "" when the key is missing entirely —
            # which `helm upgrade --reuse-values` from a pre-#41 release does (live crash 2026-07-15,
            # pydantic bool_parsing on LANCE_AUDIT_ENABLED=""). hasKey defaults a MISSING key to true and
            # still honors an explicit false.
            - { name: LANCE_AUDIT_ENABLED, value: {{ hasKey .Values.auth "audit" | ternary .Values.auth.audit true | quote }} }
            # Lock top-level (root) namespace/table creation to holders of a warehouse-level create grant.
            # Off in dev (self-serve); ON in prod (values-prod) — else any Dex-authenticated user can squat
            # unlimited root namespaces in the shared warehouse bucket (assessment finding). hasKey+ternary
            # like LANCE_AUDIT_ENABLED above: a missing key under --reuse-values must render the default,
            # not "" (pydantic bool_parsing crash).
            - { name: LANCE_FGA_LOCK_ROOT_CREATE, value: {{ hasKey .Values.auth "lockRootCreate" | ternary .Values.auth.lockRootCreate false | quote }} }
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "catalog") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-catalog
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ .Values.services.catalog.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: catalog, app.kubernetes.io/instance: {{ .Release.Name }} }
---
{{- if and .Values.dapr.enabled .Values.dapr.sidecars .Values.services.lineage.reconcile.enabled }}
# Dapr cron INPUT binding — the sidecar POSTs to /<bindingName> on `schedule` to run the periodic
# storage->graph reconciliation (B4), back-filling Lance writes whose lineage event was lost. Config lives
# here, not in app code (no scheduler thread). Scoped to the lineage app; the route mounts only when
# LINEAGE_RECONCILE_BINDING_NAME matches this name. Gated on dapr.enabled too: without the Dapr control
# plane the Component CRD doesn't exist and the release would fail to apply.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.services.lineage.reconcile.bindingName }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.services.lineage.reconcile.schedule | quote }} }
scopes:
  - {{ .Values.services.lineage.daprAppId }}
---
{{- end }}
# Lineage (consumer) — SUBSCRIBES (via its daprd sidecar) to the lineage topic and ingests into AGE.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-lineage
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: {{ (hasKey .Values.services.lineage "replicas") | ternary .Values.services.lineage.replicas 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: lineage, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: lineage
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
      {{- if .Values.dapr.sidecars }}
      annotations:
        {{- include "rask.daprAnnotations" (list $root .Values.services.lineage.daprAppId .Values.services.lineage.port) | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if .Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" "lineage" | nindent 6 }}
      {{- end }}
      initContainers:
        - name: wait-age
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ $age }} {{ .Values.age.port }}; do echo wait-age; sleep 3; done"]
          {{- if .Values.security.infraContexts.enabled }}
          # PSA-restricted compliance for the root busybox init (the audit's sequencing footgun:
          # labeling the namespace restricted would REJECT this pod until the init is hardened).
          securityContext: { runAsNonRoot: true, runAsUser: 65532, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          {{- end }}
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-lineage
      {{- end }}
      containers:
        - name: lineage
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          {{- if include "lance.otelEnabled" $root }}
          command: ["opentelemetry-instrument", "uvicorn"]
          {{- else }}
          command: ["uvicorn"]
          {{- end }}
          # command/args are split so the dev-only reload flags can be appended. These are the
          # fleet.yaml — so a synced file landed in the pod and the worker never re-read it.
          args:
            - {{ .Values.services.lineage.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ .Values.services.lineage.port }}"
          ports: [{ name: http, containerPort: {{ .Values.services.lineage.port }} }]
          env:
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root "lineage") | nindent 12 }}
            {{- end }}
            # Explicit APP_API_TOKEN (recommended k8s approach) so require_dapr_token can verify the
            # `dapr-api-token` header the sidecar stamps on delivery → forged direct POSTs are 403'd.
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-dapr-app-token, key: token }
            {{- if not (include "lance.secretsViaDapr" .) }}
            - { name: LINEAGE_DATABASE_URL, value: "postgresql://{{ .Values.age.user }}:{{ .Values.age.password }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.lineageDb }}" }
            {{- else }}
            # OpenBao on → the AGE password is NOT in the connection string in pod env; lineage fetches it
            # from the secret store at boot and splices it into the URL (the audit's 'plaintext still ships'
            # fix). The URL here carries the user/host/db only, no password.
            - { name: LINEAGE_DATABASE_URL, value: "postgresql://{{ .Values.age.user }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.lineageDb }}" }
            - { name: LINEAGE_SECRETS_FROM_DAPR, value: "true" }
            {{- end }}
            - { name: LINEAGE_GRAPH, value: {{ .Values.age.lineageDb | quote }} }
            - { name: LINEAGE_DOCS, value: {{ .Values.docs.enabled | quote }} }
            # §4 reliability knobs: Run-node retention (pruned by the reconcile cron; 0 = keep all) and
            # the AGE pool's per-statement timeout (bounds runaway traversals).
            - { name: LINEAGE_RUN_RETENTION_DAYS, value: {{ .Values.services.lineage.runRetentionDays | quote }} }
            - { name: LINEAGE_AGE_STATEMENT_TIMEOUT_SECONDS, value: {{ .Values.services.lineage.ageStatementTimeoutSeconds | quote }} }
            - { name: LINEAGE_DAPR_ENABLED, value: {{ .Values.dapr.sidecars | quote }} }
            # The lineage app's OWN subscriber component (queueGroupName=lineage, deliverPolicy=all) —
            # must match the Component name in dapr-component.yaml (both render lance.subPubsub).
            - { name: LINEAGE_DAPR_PUBSUB, value: {{ include "lance.subPubsub" (list $root .Values.services.lineage.daprAppId) | quote }} }
            - { name: LINEAGE_DAPR_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- if .Values.dapr.resiliency.enabled }}
            # Dapr-native DLQ (ships with the Resiliency CRD): ingest deliveries that exhaust the
            # sidecar retry schedule park here (visibility only — replay-from-stream stays the recovery).
            - { name: LINEAGE_DLQ_TOPIC, value: "dlq.lineage.events" }
            # The parking subscription's OWN durable component (dapr-component.yaml, `-dlq` suffix) —
            # never the main ephemeral deliverPolicy=all component, which re-parked the whole retained
            # DLQ backlog on every pod restart.
            - { name: LINEAGE_DLQ_PUBSUB, value: "{{ include "lance.subPubsub" (list $root .Values.services.lineage.daprAppId) }}-dlq" }
            {{- end }}
            {{- if .Values.services.lineage.freshnessBudgetHours }}
            # Freshness budget (data-contract gap #2): reconcile flags `stale` datasets whose newest
            # version commit is older than this many hours. Unset/0 = the axis is off.
            - { name: LINEAGE_FRESHNESS_BUDGET_HOURS, value: {{ .Values.services.lineage.freshnessBudgetHours | quote }} }
            {{- end }}
            {{- if .Values.medallion.enabled }}
            {{- $declared := dict }}
            {{- range .Values.medallion.movers }}
            {{- if .requiredColumns }}
            {{- $_ := set $declared .toDataset (splitList "," .requiredColumns) }}
            {{- end }}
            {{- end }}
            {{- if $declared }}
            # Declared-columns patrol (Batch 23): DERIVED from the movers' requiredColumns — one
            # declaration source (values), two enforcement points (the gate at promotion, this sweep
            # after) — so the gate and the patrol can never disagree on what consumers declared.
            - { name: LINEAGE_DECLARED_COLUMNS, value: {{ $declared | toJson | quote }} }
            {{- end }}
            {{- end }}
            # Bound the DaprClient gRPC deadline (the SDK env) — covers the boot-time secret-store fetch.
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            # Demo peek router — values-gated (unauthenticated metadata disclosure; prod ships it off).
            # hasKey+ternary (the LANCE_AUDIT_ENABLED convention): a key missing under --reuse-values (a
            # stored release predating demoData) must render the default, not "" (bool_parsing boot crash).
            - { name: LINEAGE_DEMO_DATA_ENABLED, value: {{ hasKey .Values.services.lineage "demoData" | ternary .Values.services.lineage.demoData false | quote }} }
            {{- if .Values.services.lineage.reconcile.enabled }}
            # Mounts the cron reconcile route at this binding name (matches the bindings.cron component above).
            - { name: LINEAGE_RECONCILE_BINDING_NAME, value: {{ .Values.services.lineage.reconcile.bindingName | quote }} }
            {{- end }}
            - { name: LINEAGE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            - { name: LINEAGE_S3_ACCESS_KEY_ID, value: {{ .Values.rustfs.accessKey | quote }} }
            {{- if not (include "lance.secretsViaDapr" .) }}
            - { name: LINEAGE_S3_SECRET_ACCESS_KEY, value: {{ .Values.rustfs.secretKey | quote }} }
            {{- end }}
            - { name: LINEAGE_S3_BUCKET, value: {{ .Values.rustfs.bucket | quote }} }
            {{- if .Values.services.lineage.outbox.enabled }}
            - { name: LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.rustfs.bucket }}/_lineage_outbox" }
            {{- end }}
            {{- if .Values.auth.enabled }}
            - { name: RASK_OIDC_ENABLED, value: "true" }
            - { name: RASK_OIDC_ISSUER, value: {{ .Values.dex.issuer | quote }} }
            # Split-horizon: the issuer is the PUBLIC URL tokens carry; discovery/JWKS are fetched in-cluster.
            - { name: RASK_OIDC_DISCOVERY_URL, value: "http://{{ include "lance.dexHost" . }}:{{ .Values.dex.port }}/dex" }
            - { name: RASK_OIDC_AUDIENCE, value: {{ .Values.dex.clientId | quote }} }
            # Scheme-derived (see the catalog twin above): https issuer => HTTPS guard stays enforced.
            - { name: RASK_OIDC_ALLOW_INSECURE, value: {{ ternary "false" "true" (hasPrefix "https://" .Values.dex.issuer) | quote }} }
            - { name: RASK_FGA_ENABLED, value: "true" }
            - { name: RASK_FGA_API_URL, value: "http://{{ include "lance.openfgaHost" . }}:8080" }
            {{- with .Values.auth.fgaStoreId }}
            # Operator-pinned FGA store id — the same auth.fgaStoreId every consumer + the bootstrap-admin
            # Job use (see the catalog twin above). Unset = provision-by-name at boot.
            - { name: RASK_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.auth.fgaModelId }}
            - { name: RASK_FGA_MODEL_ID, value: {{ . | quote }} }
            {{- end }}
            # Read-side audit (services.lineage.readAudit): record every ALLOWED FGA-gated data read into
            # lineage_reads — feeds GET /datasets/{name}/readers + the ReadersPanel. Rendered only under
            # auth.enabled (a real subject exists), default ON like the catalog's write-side
            # LANCE_AUDIT_ENABLED — and hasKey+ternary for the same --reuse-values reason.
            - { name: LINEAGE_READ_AUDIT_ENABLED, value: {{ hasKey .Values.services.lineage "readAudit" | ternary .Values.services.lineage.readAudit true | quote }} }
            # The SERVICE door on the HTTP ingest (lineage/api/security.py ServicePrincipal): bare FGA
            # subjects that may ingest with the shared app token instead of an OIDC bearer. The Ray TRAIN
            # job is a sidecar-less in-cluster producer (RAY-TRAIN.md D2) — before this, every training
            # RunEvent 401'd under auth and ALL training provenance was lost (live 2026-07-13). Only the
            # trainer is listed: the allowlist is what stops an app-token holder speaking as a human, and
            # its outputs are still FGA-checked as `service-trainer`, so D5's rung still bounds it.
            # The service subjects allowed to speak app-to-app to lineage: the trainer + the P5
            # micro-frontend zones (frontend.serviceIdentity) — the zones read lineage as a SERVICE on the
            # no-login governed path, so their identity MUST be allowlisted or every zone's read fails closed
            # (403). (The retired web pod's identity was here too; frontend.serviceIdentity carries it now.)
            # …and the INGEST plane, which was MISSING and cost it every provenance record on an
            # auth-enabled estate. Its emitter sent no identity, lineage answered 401, and the emitter
            # swallows that by design (a landed commit must not become a failed run) — so the data
            # landed and the graph never heard about it, silently. Exactly the failure recorded above
            # for the trainer in 2026-07, repeated on a second lane two months later.
            # Read from the ingest service's OWN `RASK_LINEAGE_SERVICE_IDENTITY` so the two halves
            # cannot drift: the door's allowlist and the caller's claim come from ONE value.
            {{- /* DERIVED, not enumerated. This was a hand-written list of three names, and a list that
                 must be kept in sync with the set of services that emit lineage WILL drift — nothing
                 connected the two. It drifted twice: the trainer in 2026-07 (recorded above), and
                 `service-ingest` on 2026-08-06, where every ingest emit 403'd for a day while the
                 data landed. The emitter swallows a refused emit by design (a landed commit must not
                 become a failed run), so the symptom is a silent gap in the graph, not an error.

                 A service DECLARES its identity by setting `env.RASK_LINEAGE_SERVICE_IDENTITY`. That
                 declaration is now the ONLY input: the door's allowlist and the caller's claim are
                 read from one value, so a new emitter is admitted by declaring itself and cannot be
                 forgotten into a string. Same principle as `project_namespace` — a convention two
                 sides must agree on cannot live in one of them.

                 `trainerIdentity` and `frontend.serviceIdentity` are appended explicitly because they
                 live outside `.Values.services` and have no env block to declare from; folding them
                 in would mean inventing one. `uniq` because a value may legitimately appear twice;
                 `compact` because an unset identity must contribute nothing rather than an empty
                 subject, which would allowlist the empty string. */}}
            {{- $subjects := list .Values.medallion.train.trainerIdentity .Values.frontend.serviceIdentity }}
            {{- range $svcName, $svc := .Values.services }}
              {{- with (get ($svc.env | default dict) "RASK_LINEAGE_SERVICE_IDENTITY") }}
                {{- $subjects = append $subjects . }}
              {{- end }}
            {{- end }}
            {{- /* notifications carries its identity's CODE DEFAULT here as well, which is the one
                   exception to declaration-only and is about upgrades rather than about this service.
                   `env` is a values KEY, so `helm upgrade --reuse-values` — which the repo itself
                   performs (scripts/verify_produce_door.sh) — renders the OLD chart's values and drops
                   a key that did not exist then. Every S1-era release is in exactly that state. The
                   cron Component still renders (it defaults), so the tick would fire while the door
                   refused it: `IngressSettings.service_identity` defaults to `notifications`, so the
                   caller claims a subject the allowlist never learned, and `_is_transient` refuses to
                   retry a 403 — a lane 403ing every 30 s forever, with a Ready pod and a working bus
                   lane beside it. Defaulting the ALLOWLIST to the same literal the APP defaults to is
                   what makes the two halves agree with no values at all. */}}
            {{- if .Values.services.notifications }}
              {{- $subjects = append $subjects ((get (.Values.services.notifications.env | default dict) "RASK_LINEAGE_SERVICE_IDENTITY") | default "notifications") }}
            {{- end }}
            - { name: LINEAGE_SERVICE_SUBJECTS, value: {{ compact $subjects | uniq | sortAlpha | join "," | quote }} }
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "lineage") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-lineage
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ .Values.services.lineage.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: lineage, app.kubernetes.io/instance: {{ .Release.Name }} }
