{{- $root := . }}
{{- if and .Values.catalog.controlEmit (not .Values.dapr.enabled) }}
{{- fail "catalog.controlEmit=true requires dapr.enabled=true: the /control-events broadcast ingest publishes + receives via the Dapr sidecar and is authenticated by the sidecar-injected APP_API_TOKEN — without it the catalog fails closed at boot. Enable dapr.enabled, or set catalog.controlEmit=false." }}
{{- end }}
{{- if and (gt (int ((hasKey .Values.services.catalog "replicas") | ternary .Values.services.catalog.replicas 1)) 1) (not .Values.catalog.controlEmit) }}
{{- fail "services.catalog.replicas > 1 requires catalog.controlEmit=true: the warehouse-binding cache is invalidated across replicas by the broadcast control-event subscription (#46) — without it a second replica keeps routing dropped namespaces at deleted warehouses' buckets. Enable catalog.controlEmit, or run one replica." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-catalog
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: {{ (hasKey .Values.services.catalog "replicas") | ternary .Values.services.catalog.replicas 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: catalog, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      annotations:
        {{- if .Values.dapr.enabled }}
        {{- include "rask.daprAnnotations" (list $root .Values.services.catalog.daprAppId .Values.services.catalog.port) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: catalog
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
    spec:
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if .Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" "catalog" | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-catalog
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: catalog
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          args:
            {{- if include "lance.otelEnabled" $root }}
            - "opentelemetry-instrument"
            {{- end }}
            - "uvicorn"
            - {{ .Values.services.catalog.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ .Values.services.catalog.port }}"
            {{- include "rask.shutdownArg" . | nindent 12 }}
            {{- include "rask.proxyHeaderArgs" . | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.services.catalog.port }} }]
          env:
            {{- include "lance.allocatorEnv" (list $root) | nindent 12 }}
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root "catalog") | nindent 12 }}
            {{- end }}
            {{- include "lance.lineageEmitEnv" (list $root) | nindent 12 }}
            - { name: LANCE_REST_DOCS, value: {{ $root.Values.docs.enabled | quote }} }
            - { name: LANCE_REST_IMPL, value: "dir" }
            - { name: LANCE_REST_ROOT, value: "s3://{{ .Values.objectStore.bucket }}" }
            - { name: LANCE_NS_DELIMITER, value: "$" }
            - { name: LANCE_ALLOW_EXTERNAL_BLOBS, value: {{ .Values.vending.allowExternalBlobs | quote }} }
            - { name: LANCE_EXTERNAL_BLOB_BASES, value: {{ include "lance.externalBlobBases" . | quote }} }
            - { name: LANCE_MAX_BODY_BYTES, value: {{ .Values.catalog.maxBodyBytes | int64 | quote }} }
            - { name: LANCE_MAX_CONCURRENT_WRITES, value: {{ hasKey .Values.catalog "maxConcurrentWrites" | ternary .Values.catalog.maxConcurrentWrites 16 | int | quote }} }
            - { name: LANCE_TRASH_GRACE_DAYS, value: {{ hasKey .Values.catalog "trashGraceDays" | ternary .Values.catalog.trashGraceDays 7 | int | quote }} }
            - { name: LANCE_WAREHOUSES_ENABLED, value: {{ .Values.catalog.warehouses.enabled | default false | quote }} }

            {{- $reserved := list }}
            {{- range $ns, $bkt := .Values.medallion.buckets }}{{- $reserved = append $reserved $bkt }}{{- end }}
            - { name: LANCE_RESERVED_BUCKETS, value: {{ $reserved | uniq | join "," | quote }} }
            - { name: LANCE_MULTIBASE_DATA_BASES, value: {{ .Values.catalog.multibase.dataBases | default (list) | join "," | quote }} }

            {{- $allow := .Values.catalog.multibase.dataBases | default (list) }}
            {{- $pairs := list }}
            {{- range $base, $ref := .Values.catalog.multibase.baseCredentialRefs | default dict }}
              {{- if not (has $base $allow) }}
                {{- fail (printf "catalog.multibase.baseCredentialRefs names %q, which is not on the catalog.multibase.dataBases allowlist — a base with a credential reference and no allowlist entry can never be reached" $base) }}
              {{- end }}
              {{- $pairs = append $pairs (printf "%s=%s" $base $ref) }}
            {{- end }}
            - { name: LANCE_MULTIBASE_BASE_CREDENTIAL_REFS, value: {{ $pairs | join "," | quote }} }
            - { name: LANCE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            - { name: LANCE_S3_WEB_IDENTITY_TOKEN_FILE, value: "/var/run/secrets/rask/identity/{{ include "lance.objectStoreAudience" . }}/token" }
            - { name: LANCE_S3_STS_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            - { name: LANCE_S3_ASSUME_ROLE_ARN, value: {{ .Values.vending.assumeRoleArn | quote }} }
            - { name: LANCE_S3_SESSION_SECONDS, value: {{ .Values.objectStore.identity.sessionSeconds | quote }} }
            - { name: LANCE_DAPR_SECRET_S3_FIELD, value: {{ include "lance.baseSecretField" . | quote }} }
            - { name: LANCE_SECRETS_FROM_DAPR, value: "true" }
            {{- with include "lance.signingEnv" (list $root .Values.services.catalog.daprAppId) }}{{ . | nindent 12 }}{{- end }}
            - { name: LANCE_S3_REGION, value: "us-east-1" }
            - { name: LANCE_S3_VIRTUAL_HOSTED, value: "false" }
            - { name: LANCE_VENDING_MODE, value: {{ .Values.vending.mode | quote }} }
            {{- if eq .Values.vending.mode "web_identity" }}
            - { name: LANCE_VENDING_TTL_SECONDS, value: {{ .Values.vending.ttlSeconds | quote }} }
            {{- with .Values.vending.endpoint }}
            - { name: LANCE_S3_VENDED_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- end }}

            {{- with .Values.vending.encryption }}
            {{- with .algorithm }}
            - { name: LANCE_S3_SERVER_SIDE_ENCRYPTION, value: {{ . | quote }} }
            {{- end }}
            {{- with .kmsKeyId }}
            - { name: LANCE_S3_SSE_KMS_KEY_ID, value: {{ . | quote }} }
            {{- end }}
            {{- if hasKey . "bucketKeyEnabled" }}
            - { name: LANCE_S3_SSE_BUCKET_KEY_ENABLED, value: {{ .bucketKeyEnabled | quote }} }
            {{- end }}
            {{- end }}
            - { name: LANCE_LINEAGE_EMIT_ENABLED, value: "true" }
            - { name: LANCE_LINEAGE_TRANSPORT, value: "dapr" }
            - { name: LANCE_DAPR_PUBSUB, value: {{ .Values.pubsub.name | quote }} }
            - { name: LANCE_DAPR_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- if .Values.services.lineage.outbox.enabled }}
            - { name: LANCE_LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.objectStore.bucket }}/_lineage_outbox" }
            {{- end }}
            - { name: LANCE_PROVENANCE_NAMESPACE, value: {{ .Values.services.lineage.provenanceNamespace | quote }} }
            - { name: LANCE_CONTROL_EMIT_ENABLED, value: {{ hasKey .Values.catalog "controlEmit" | ternary .Values.catalog.controlEmit false | quote }} }
            - { name: LANCE_CONTROL_PUBSUB, value: {{ .Values.pubsub.controlName | default "catalog-control-pubsub" | quote }} }
            {{- if and .Values.catalog.controlEmit .Values.catalog.controlOutbox.enabled }}
            - { name: LANCE_CONTROL_OUTBOX_URI, value: "s3://{{ .Values.objectStore.bucket }}/_control_outbox" }
            - { name: LANCE_CONTROL_RELAY_BINDING_NAME, value: {{ .Values.catalog.controlOutbox.bindingName | quote }} }
            {{- end }}
            {{- if .Values.catalog.controlEmit }}
            {{- with include "lance.doorEnv" (list $root true (list "catalog" "maintenance")) }}{{ . | nindent 12 }}{{- end }}
            {{- end }}
            - { name: LANCE_ERASURE_DEADLINE_DAYS, value: {{ required "catalog.erasure.deadlineDays is required" .Values.catalog.erasure.deadlineDays | quote }} }
            - { name: LANCE_ERASURE_RELEASE_GRACE_DAYS, value: {{ required "catalog.erasure.releaseGraceDays is required" .Values.catalog.erasure.releaseGraceDays | quote }} }
            - { name: LANCE_ERASURE_CLEANUP_WINDOW_DAYS, value: {{ required "maintenance.olderThanDays is required" .Values.maintenance.olderThanDays | quote }} }
            - { name: LANCE_CLONE_LIST_MAX_AGE_SECONDS, value: {{ required "maintenance.cloneListMaxAgeSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.maintenance.cloneListMaxAgeSeconds | quote }} }
            {{- if .Values.dapr.enabled }}
            - { name: LANCE_ERASURE_RELEASE_BINDING_NAME, value: {{ .Values.catalog.erasure.bindingName | quote }} }
            - { name: LANCE_PROMOTION_EXPIRY_BINDING_NAME, value: {{ .Values.catalog.promotion.bindingName | quote }} }
            {{- include "lance.busEnv" $root | nindent 12 }}
            {{- end }}
            {{- if .Values.dapr.enabled }}

            {{- if .Values.dapr.enabled }}

{{- include "lance.appTokenEnv" (list $root $root.Values.services.catalog.daprAppId) | nindent 12 }}
            {{- end }}
            {{- end }}
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            {{- if not .Values.auth.enabled }}
            {{- include "lance.governedAuthAck" . | nindent 12 }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- include "lance.governedOidcEnv" . | nindent 12 }}
            {{- include "lance.governedFgaEnv" (list . "catalog") | nindent 12 }}
            {{- include "lance.saVerifier" (list $root "env" "catalog") | nindent 12 }}

            {{- $maintainers := list }}
            {{- if and $root.Values.maintenance.enabled $root.Values.maintenance.vendWriteCredentials }}
              {{- $maintainers = append $maintainers (include "lance.saSubject" (list $root "maintenance")) }}
            {{- end }}
            - { name: LANCE_FGA_MAINTAINERS, value: {{ toJson (compact $maintainers) | quote }} }
            - { name: LANCE_PROVENANCE_WRITERS, value: {{ toJson (list (include "lance.saSubject" (list $root "lineage"))) | quote }} }
            - { name: LANCE_AUDIT_ENABLED, value: {{ hasKey .Values.auth "audit" | ternary .Values.auth.audit true | quote }} }
            - { name: LANCE_FGA_LOCK_ROOT_CREATE, value: {{ hasKey .Values.auth "lockRootCreate" | ternary .Values.auth.lockRootCreate (include "rask.isRealDeployment" . | eq "true") | quote }} }
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "catalog") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            {{- include "lance.saVerifier" (list $root "mounts" "catalog") | nindent 12 }}
            {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "mounts") | nindent 12 }}{{ end }}
            {{- include "lance.identityTokens" (list "mounts" (include "lance.objectStoreAudience" .)) | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- include "lance.storeIdentity" (list $root .Values.services.catalog.daprAppId "volumes") | nindent 8 }}
        {{- include "lance.saVerifier" (list $root "volumes" "catalog") | nindent 8 }}
        {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "volumes") | nindent 8 }}{{ end }}
        {{- include "lance.identityTokens" (list "volumes" (include "lance.objectStoreAudience" .)) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-catalog
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports: [{ name: http, port: {{ .Values.services.catalog.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: catalog, app.kubernetes.io/instance: {{ .Release.Name }} }
---
{{- if and .Values.dapr.enabled .Values.services.lineage.relay.enabled }}
{{- $bn := .Values.services.lineage.relay.bindingName }}
{{- if not (regexMatch "^[a-zA-Z0-9._-]+$" $bn) }}{{ fail (printf "services.lineage.relay.bindingName %q must match ^[A-Za-z0-9._-]+$: it names a Dapr Component and the route daprd delivers to" $bn) }}{{ end }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.services.lineage.relay.bindingName }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.services.lineage.relay.schedule | quote }} }
scopes:
  - {{ .Values.services.lineage.daprAppId }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-lineage
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: {{ (hasKey .Values.services.lineage "replicas") | ternary .Values.services.lineage.replicas 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: lineage, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      annotations:
        {{- if .Values.dapr.enabled }}
        {{- include "rask.daprAnnotations" (list $root .Values.services.lineage.daprAppId .Values.services.lineage.port) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: lineage
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
    spec:
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if .Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" "lineage" | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-lineage
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lineage
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          args:
            {{- if include "lance.otelEnabled" $root }}
            - "opentelemetry-instrument"
            {{- end }}
            - "uvicorn"
            - {{ .Values.services.lineage.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ .Values.services.lineage.port }}"
            {{- include "rask.shutdownArg" . | nindent 12 }}
            {{- include "rask.proxyHeaderArgs" . | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.services.lineage.port }} }]
          env:
            {{- include "lance.allocatorEnv" (list $root) | nindent 12 }}
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root "lineage") | nindent 12 }}
            {{- end }}
            {{- if .Values.dapr.enabled }}

{{- include "lance.appTokenEnv" (list $root $root.Values.services.lineage.daprAppId) | nindent 12 }}
            {{- include "lance.busEnv" $root | nindent 12 }}
            {{- end }}
            - { name: LINEAGE_CATALOG_URL, value: {{ printf "http://%s-catalog:%v" (include "lance.fullname" $root) $root.Values.services.catalog.port | quote }} }
            - { name: RASK_CATALOG_IDENTITY_TOKEN_FILE, value: /var/run/secrets/rask/identity/rask-catalog/token }
            - { name: LINEAGE_PROVENANCE_NAMESPACE, value: {{ .Values.services.lineage.provenanceNamespace | quote }} }
            - { name: LINEAGE_SECRETS_FROM_DAPR, value: "true" }
            - { name: LINEAGE_DOCS, value: {{ .Values.docs.enabled | quote }} }
            - { name: LINEAGE_EVENTS_RETENTION_DAYS, value: {{ .Values.services.lineage.eventsRetentionDays | quote }} }
            {{- with .Values.services.lineage.forward }}
            - { name: LINEAGE_FORWARD_URL, value: {{ .url | quote }} }
            - { name: LINEAGE_FORWARD_ENDPOINT, value: {{ .endpoint | quote }} }
            - { name: LINEAGE_FORWARD_API_KEY_SECRET, value: {{ .authSecret.name | quote }} }
            - { name: LINEAGE_FORWARD_API_KEY_FIELD, value: {{ .authSecret.key | quote }} }
            {{- end }}
            - { name: LINEAGE_DAPR_ENABLED, value: {{ .Values.dapr.enabled | quote }} }
            - { name: LINEAGE_DAPR_PUBSUB, value: {{ include "lance.subPubsub" (list $root .Values.services.lineage.daprAppId) | quote }} }
            - { name: LINEAGE_DAPR_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- if .Values.dapr.resiliency.enabled }}
            - { name: LINEAGE_DLQ_TOPIC, value: "dlq.lineage.events" }
            - { name: LINEAGE_DLQ_PUBSUB, value: "{{ include "lance.subPubsub" (list $root .Values.services.lineage.daprAppId) }}-dlq" }
            {{- end }}
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            {{- if .Values.services.lineage.relay.enabled }}
            - { name: LINEAGE_RELAY_BINDING_NAME, value: {{ .Values.services.lineage.relay.bindingName | quote }} }
            {{- end }}
            - { name: LINEAGE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }

            {{- $_ := required "objectStore.lineageAccessKey names lineage's scoped store identity; no service presents the store's root, which signs every STS token (ADR 0168)" .Values.objectStore.lineageAccessKey }}
            - { name: LINEAGE_DAPR_SECRET_KEY, value: "lineage-s3" }
            - { name: LINEAGE_DAPR_SECRET_S3_ID_FIELD, value: "access_key" }
            - { name: LINEAGE_DAPR_SECRET_S3_FIELD, value: "secret_key" }
            {{- if .Values.services.lineage.outbox.enabled }}
            - { name: LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.objectStore.bucket }}/_lineage_outbox" }
            {{- end }}
            {{- if not .Values.auth.enabled }}
            {{- include "lance.governedAuthAck" . | nindent 12 }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- include "lance.governedOidcEnv" . | nindent 12 }}
            {{- include "lance.governedFgaEnv" (list . "lineage") | nindent 12 }}
            - { name: LANCE_AUDIT_ENABLED, value: {{ hasKey .Values.auth "audit" | ternary .Values.auth.audit true | quote }} }
            {{- include "lance.saVerifier" (list $root "env" "lineage") | nindent 12 }}

            {{- if (.Values.signing).enforce }}
            {{- $signers := include "lance.signingIdentities" . | splitList " " | compact }}
            {{- if not $signers }}{{ fail "signing.enforce=true but no identity signs: lineage would verify nothing" }}{{- end }}
            - { name: LINEAGE_SIGNERS, value: {{ $signers | toJson | quote }} }
            - { name: LINEAGE_DELEGATORS, value: {{ include "lance.delegatorIdentities" . | splitList " " | compact | toJson | quote }} }
            {{- end }}
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "lineage") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            {{- include "lance.identityTokens" (list "mounts" "rask-catalog") | nindent 12 }}
            {{- include "lance.saVerifier" (list $root "mounts" "lineage") | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- include "lance.storeIdentity" (list $root .Values.services.lineage.daprAppId "volumes") | nindent 8 }}
        {{- include "lance.identityTokens" (list "volumes" "rask-catalog") | nindent 8 }}
        {{- include "lance.saVerifier" (list $root "volumes" "lineage") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-lineage
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ .Values.services.lineage.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: lineage, app.kubernetes.io/instance: {{ .Release.Name }} }
