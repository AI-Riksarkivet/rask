{{- $root := . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-catalog
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ (include "lance.replicaBounds" (list . .Values.services.catalog) | fromJson).min | int }}
  {{- end }}
  {{- include "lance.rollout" . | nindent 2 }}
  selector:
    matchLabels: { app.kubernetes.io/component: catalog, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: catalog
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP), so a platform collector can drop the file-tailed copy
    spec:
      terminationGracePeriodSeconds: {{ include "lance.deadlineGrace" (list . .Values.catalog.requestDeadlineSeconds) }}
      {{- if .Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" "catalog" | nindent 6 }}
      {{- end }}
      {{- include "lance.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-catalog
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: catalog
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          args:
            {{- if include "lance.otelEnabled" $root }}
            - "opentelemetry-instrument"
            {{- end }}
            - "uvicorn"
            - {{ .Values.services.catalog.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ .Values.services.catalog.port }}"
            {{- include "rask.shutdownArg" (list . (include "lance.deadlineGrace" (list . .Values.catalog.requestDeadlineSeconds) | int)) | nindent 12 }}
            {{- include "rask.proxyHeaderArgs" . | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.services.catalog.port }} }]
          env:
            {{- include "lance.allocatorEnv" (list $root) | nindent 12 }}
            {{- include "lance.fileAuditEnv" (list $root) | nindent 12 }}
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root "catalog") | nindent 12 }}
            {{- end }}
            - { name: LANCE_REST_DOCS, value: {{ $root.Values.docs.enabled | quote }} }
            - { name: LANCE_MAINTENANCE_READ_ONLY, value: {{ required "readOnlyWindow is unset — upgrade with --reset-then-reuse-values, not --reuse-values" $root.Values.readOnlyWindow | quote }} }
            - { name: LANCE_REST_IMPL, value: "dir" }
            - { name: LANCE_REST_ROOT, value: "s3://{{ .Values.objectStore.bucket }}" }
            - { name: LANCE_PUBLIC_PATH_PREFIX, value: {{ include "rask.catalogPublicPrefix" . | quote }} }
            - { name: LANCE_ALLOW_EXTERNAL_BLOBS, value: {{ .Values.vending.allowExternalBlobs | quote }} }
            - { name: LANCE_EXTERNAL_BLOB_BASES, value: {{ include "lance.externalBlobBases" . | quote }} }
            - { name: LANCE_MAX_BODY_BYTES, value: {{ .Values.catalog.maxBodyBytes | int64 | quote }} }
            - { name: LANCE_REQUEST_DEADLINE_SECONDS, value: {{ .Values.catalog.requestDeadlineSeconds | quote }} }
            - { name: LANCE_MAX_CONCURRENT_WRITES, value: {{ hasKey .Values.catalog "maxConcurrentWrites" | ternary .Values.catalog.maxConcurrentWrites 16 | int | quote }} }
            - { name: LANCE_TRASH_GRACE_DAYS, value: {{ hasKey .Values.catalog "trashGraceDays" | ternary .Values.catalog.trashGraceDays 7 | quote }} }

            - { name: LANCE_RESERVED_BUCKETS, value: {{ include "lance.platformBuckets" . | quote }} }
            - { name: LANCE_MULTIBASE_DATA_BASES, value: {{ .Values.catalog.multibase.dataBases | default (list) | join "," | quote }} }

            - { name: LANCE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            {{- include "lance.objectStoreSessionEnv" (list $root "LANCE" "catalog") | nindent 12 }}
            {{- include "lance.secretStoreEnv" (list $root .Values.services.catalog.appId) | nindent 12 }}
            {{- with include "lance.signingEnv" (list $root .Values.services.catalog.appId) }}{{ . | nindent 12 }}{{- end }}
            - { name: LANCE_S3_REGION, value: "us-east-1" }
            - { name: LANCE_S3_VIRTUAL_HOSTED, value: "false" }
            - { name: LANCE_VENDING_MODE, value: {{ .Values.vending.mode | quote }} }
            {{- if eq .Values.vending.mode "web_identity" }}
            - { name: LANCE_VENDING_TTL_SECONDS, value: {{ .Values.vending.ttlSeconds | quote }} }
            {{- with .Values.vending.endpoint }}
            - { name: LANCE_S3_VENDED_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- end }}

            {{- with .Values.vending.encryption }}
            {{- with .algorithm }}
            - { name: LANCE_S3_SERVER_SIDE_ENCRYPTION, value: {{ . | quote }} }
            {{- end }}
            {{- with .kmsKeyId }}
            - { name: LANCE_S3_SSE_KMS_KEY_ID, value: {{ . | quote }} }
            {{- end }}
            {{- if hasKey . "bucketKeyEnabled" }}
            - { name: LANCE_S3_SSE_BUCKET_KEY_ENABLED, value: {{ .bucketKeyEnabled | quote }} }
            {{- end }}
            {{- end }}
            - { name: LANCE_LINEAGE_EMIT_ENABLED, value: "true" }
            - { name: LANCE_LINEAGE_TRANSPORT, value: "bus" }
            - { name: LANCE_LINEAGE_DATASET_NAMESPACE, value: {{ include "rask.lineageDatasetNamespace" $ | quote }} }
            - { name: LANCE_LINEAGE_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- if .Values.services.lineage.outbox.enabled }}
            - { name: LANCE_LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.objectStore.bucket }}/_lineage_outbox" }
            {{- end }}
            - { name: LANCE_PROVENANCE_NAMESPACE, value: {{ include "lance.provenanceNamespace" $root | quote }} }
            {{- with .Values.services.lineage.provenanceRetainVersions }}
            - { name: LANCE_PROVENANCE_RETAIN_VERSIONS, value: {{ . | quote }} }
            {{- end }}
            - { name: LANCE_CONTROL_EMIT_ENABLED, value: {{ hasKey .Values.catalog "controlEmit" | ternary .Values.catalog.controlEmit false | quote }} }
            {{- if and .Values.catalog.controlEmit .Values.catalog.controlOutbox.enabled }}
            - { name: LANCE_CONTROL_OUTBOX_URI, value: "s3://{{ .Values.objectStore.bucket }}/_control_outbox" }
            - { name: LANCE_CONTROL_RELAY_PERIOD_SECONDS, value: {{ required "catalog.controlOutbox.periodSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.controlOutbox.periodSeconds | quote }} }
            {{- end }}
            {{- if .Values.catalog.controlEmit }}
            {{- with include "lance.doorEnv" (list $root true (list "catalog" "maintenance")) }}{{ . | nindent 12 }}{{- end }}
            {{- end }}
            - { name: LANCE_ERASURE_DEADLINE_DAYS, value: {{ required "catalog.erasure.deadlineDays is required" .Values.catalog.erasure.deadlineDays | quote }} }
            - { name: LANCE_ERASURE_RELEASE_GRACE_DAYS, value: {{ required "catalog.erasure.releaseGraceDays is required" .Values.catalog.erasure.releaseGraceDays | quote }} }
            - { name: LANCE_ERASURE_CLEANUP_WINDOW_DAYS, value: {{ required "maintenance.olderThanDays is required" .Values.maintenance.olderThanDays | quote }} }
            - { name: LANCE_MANIFEST_RETAIN_SECONDS, value: {{ required "catalog.manifestReclaim.retainSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.manifestReclaim.retainSeconds | quote }} }
            - { name: LANCE_ERASURE_RELEASE_PERIOD_SECONDS, value: {{ required "catalog.erasure.releasePeriodSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.erasure.releasePeriodSeconds | quote }} }
            - { name: LANCE_COMMIT_RECONCILE_PERIOD_SECONDS, value: {{ required "catalog.commitReconcile.periodSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.commitReconcile.periodSeconds | quote }} }
            - { name: LANCE_DECLARATION_FILE, value: "/etc/rask/declaration/declaration.json" }
            - { name: LANCE_DECLARATION_CONVERGE_PERIOD_SECONDS, value: {{ required "catalog.declarationConverge.periodSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.declarationConverge.periodSeconds | quote }} }
            - { name: LANCE_MANIFEST_RECLAIM_PERIOD_SECONDS, value: {{ required "catalog.manifestReclaim.periodSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.catalog.manifestReclaim.periodSeconds | quote }} }
            - { name: LANCE_COMMIT_RECONCILE_GRACE_SECONDS, value: {{ required "catalog.commitReconcile.graceSeconds is required" .Values.catalog.commitReconcile.graceSeconds | quote }} }
            {{- $horizon := required "catalog.commitReconcile.horizonSeconds is required" .Values.catalog.commitReconcile.horizonSeconds | int }}
            {{- if ge $horizon (mul (.Values.services.lineage.eventsRetentionDays | int) 86400) }}
            {{- fail "catalog.commitReconcile.horizonSeconds must be shorter than services.lineage.eventsRetentionDays: a version older than the feed's retention may have had its row pruned, and the reconciler would announce it again" }}
            {{- end }}
            - { name: LANCE_COMMIT_RECONCILE_HORIZON_SECONDS, value: {{ $horizon | quote }} }
            {{- include "lance.busEnv" (list $root $root.Values.services.catalog.appId) | nindent 12 }}
            {{- if not .Values.auth.enabled }}
            {{- include "lance.governedAuthAck" . | nindent 12 }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- include "lance.governedOidcEnv" . | nindent 12 }}
            {{- include "lance.governedFgaEnv" (list . "catalog") | nindent 12 }}
            {{- include "lance.saVerifier" (list $root "env" "catalog") | nindent 12 }}

            - { name: LANCE_FGA_MAINTAINERS, value: {{ include "lance.fgaMaintainers" $root | quote }} }
            - { name: LANCE_PROVENANCE_WRITERS, value: {{ toJson (list (include "lance.saSubject" (list $root "lineage"))) | quote }} }
            - { name: LANCE_OWN_ACCOUNTS, value: {{ include "lance.ownAccounts" $root | quote }} }
            - { name: LANCE_AUDIT_ENABLED, value: {{ hasKey .Values.auth "audit" | ternary .Values.auth.audit true | quote }} }
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "catalog") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            - { name: declaration, mountPath: /etc/rask/declaration, readOnly: true }
            {{- include "lance.storeIdentity" (list $root .Values.services.catalog.appId "mounts") | nindent 12 }}
            {{- include "lance.saVerifier" (list $root "mounts" "catalog") | nindent 12 }}
            {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "mounts") | nindent 12 }}{{ end }}
            {{- include "lance.identityTokens" (list "mounts" (include "lance.objectStoreAudience" .)) | nindent 12 }}
            {{- include "lance.busIdentity" (list $root "mounts") | nindent 12 }}
            {{- include "lance.otlpIdentity" (list $root "mounts") | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- include "lance.storeIdentity" (list $root .Values.services.catalog.appId "volumes") | nindent 8 }}
        - name: declaration
          configMap:
            name: {{ include "lance.fullname" . }}-catalog-declaration
        {{- include "lance.saVerifier" (list $root "volumes" "catalog") | nindent 8 }}
        {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "volumes") | nindent 8 }}{{ end }}
        {{- include "lance.identityTokens" (list "volumes" (include "lance.objectStoreAudience" .)) | nindent 8 }}
        {{- include "lance.busIdentity" (list $root "volumes") | nindent 8 }}
        {{- include "lance.otlpIdentity" (list $root "volumes") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-catalog
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ .Values.services.catalog.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: catalog, app.kubernetes.io/instance: {{ .Release.Name }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-lineage
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ (include "lance.replicaBounds" (list . .Values.services.lineage) | fromJson).min | int }}
  {{- end }}
  {{- include "lance.rollout" . | nindent 2 }}
  selector:
    matchLabels: { app.kubernetes.io/component: lineage, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: lineage
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP), so a platform collector can drop the file-tailed copy
    spec:
      terminationGracePeriodSeconds: {{ include "lance.deadlineGrace" (list . .Values.services.lineage.requestDeadlineSeconds) }}
      {{- if .Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" "lineage" | nindent 6 }}
      {{- end }}
      {{- include "lance.podSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-lineage
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lineage
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          args:
            {{- if include "lance.otelEnabled" $root }}
            - "opentelemetry-instrument"
            {{- end }}
            - "uvicorn"
            - {{ .Values.services.lineage.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ .Values.services.lineage.port }}"
            {{- include "rask.shutdownArg" (list . (include "lance.deadlineGrace" (list . .Values.services.lineage.requestDeadlineSeconds) | int)) | nindent 12 }}
            {{- include "rask.proxyHeaderArgs" . | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.services.lineage.port }} }]
          env:
            {{- include "lance.allocatorEnv" (list $root) | nindent 12 }}
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root "lineage") | nindent 12 }}
            {{- end }}
            {{- include "lance.busEnv" (list $root $root.Values.services.lineage.appId) | nindent 12 }}
            - { name: LINEAGE_CATALOG_URL, value: {{ printf "http://%s-catalog:%v" (include "lance.fullname" $root) $root.Values.services.catalog.port | quote }} }
            - { name: RASK_CATALOG_IDENTITY_TOKEN_FILE, value: /var/run/secrets/rask/identity/rask-catalog/token }
            - { name: LINEAGE_PROVENANCE_NAMESPACE, value: {{ include "lance.provenanceNamespace" $root | quote }} }
            - { name: LINEAGE_CATALOG_DATASET_NAMESPACE, value: {{ include "rask.lineageDatasetNamespace" $ | quote }} }
            {{- include "lance.secretStoreEnv" (list $root .Values.services.lineage.appId) | nindent 12 }}
            - { name: LINEAGE_DOCS, value: {{ .Values.docs.enabled | quote }} }
            - { name: LINEAGE_MAX_BODY_BYTES, value: {{ .Values.services.lineage.maxBodyBytes | int64 | quote }} }
            - { name: LINEAGE_REQUEST_DEADLINE_SECONDS, value: {{ .Values.services.lineage.requestDeadlineSeconds | quote }} }
            - { name: LINEAGE_READ_ONLY, value: {{ required "readOnlyWindow is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.readOnlyWindow | quote }} }
            - { name: LINEAGE_EVENTS_RETENTION_DAYS, value: {{ .Values.services.lineage.eventsRetentionDays | quote }} }
            {{- with .Values.services.lineage.forward }}
            - { name: LINEAGE_FORWARD_URL, value: {{ .url | quote }} }
            - { name: LINEAGE_FORWARD_ENDPOINT, value: {{ .endpoint | quote }} }
            - { name: LINEAGE_FORWARD_API_KEY_SECRET, value: {{ .authSecret.name | quote }} }
            - { name: LINEAGE_FORWARD_API_KEY_FIELD, value: {{ .authSecret.key | quote }} }
            {{- end }}
            - { name: LINEAGE_EVENTS_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- $delivery := required "services.lineage.delivery is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.services.lineage.delivery }}
            - { name: LINEAGE_DELIVERIES_IN_FLIGHT, value: {{ required "services.lineage.deliveriesInFlight is required" .Values.services.lineage.deliveriesInFlight | quote }} }
            - { name: LINEAGE_DELIVERY_ATTEMPTS, value: {{ required "services.lineage.delivery.attempts is required" $delivery.attempts | quote }} }
            - { name: LINEAGE_DELIVERY_RETRY_SECONDS, value: {{ required "services.lineage.delivery.retrySeconds is required" $delivery.retrySeconds | quote }} }
            - { name: LINEAGE_DELIVERY_ACK_WAIT_SECONDS, value: {{ required "services.lineage.delivery.ackWaitSeconds is required" $delivery.ackWaitSeconds | quote }} }
            {{- if .Values.services.lineage.relay.enabled }}
            - { name: LINEAGE_RELAY_PERIOD_SECONDS, value: {{ required "services.lineage.relay.periodSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.services.lineage.relay.periodSeconds | quote }} }
            - { name: LINEAGE_TIMER_ROOT, value: "s3://{{ .Values.objectStore.bucket }}" }
            {{- end }}
            - { name: LINEAGE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            {{- include "lance.objectStoreSessionEnv" (list $root "LINEAGE" "lineage") | nindent 12 }}
            {{- if .Values.services.lineage.outbox.enabled }}
            - { name: LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.objectStore.bucket }}/_lineage_outbox" }
            {{- end }}
            {{- if not .Values.auth.enabled }}
            {{- include "lance.governedAuthAck" . | nindent 12 }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- include "lance.governedOidcEnv" . | nindent 12 }}
            {{- include "lance.governedFgaEnv" (list . "lineage") | nindent 12 }}
            - { name: LANCE_AUDIT_ENABLED, value: {{ hasKey .Values.auth "audit" | ternary .Values.auth.audit true | quote }} }
            {{- include "lance.saVerifier" (list $root "env" "lineage") | nindent 12 }}

            {{- if (.Values.signing).enforce }}
            {{- $signers := include "lance.signingIdentities" . | splitList " " | compact }}
            {{- if not $signers }}{{ fail "signing.enforce=true but no identity signs: lineage would verify nothing" }}{{- end }}
            - { name: LINEAGE_SIGNERS, value: {{ $signers | toJson | quote }} }
            - { name: LINEAGE_DELEGATORS, value: {{ include "lance.delegatorIdentities" . | splitList " " | compact | toJson | quote }} }
            {{- end }}
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "lineage") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            {{- include "lance.identityTokens" (list "mounts" "rask-catalog" (include "lance.objectStoreAudience" .)) | nindent 12 }}
            {{- include "lance.storeIdentity" (list $root .Values.services.lineage.appId "mounts") | nindent 12 }}
            {{- include "lance.saVerifier" (list $root "mounts" "lineage") | nindent 12 }}
            {{- include "lance.busIdentity" (list $root "mounts") | nindent 12 }}
            {{- include "lance.otlpIdentity" (list $root "mounts") | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- include "lance.storeIdentity" (list $root .Values.services.lineage.appId "volumes") | nindent 8 }}
        {{- include "lance.identityTokens" (list "volumes" "rask-catalog" (include "lance.objectStoreAudience" .)) | nindent 8 }}
        {{- include "lance.saVerifier" (list $root "volumes" "lineage") | nindent 8 }}
        {{- include "lance.busIdentity" (list $root "volumes") | nindent 8 }}
        {{- include "lance.otlpIdentity" (list $root "volumes") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-lineage
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ .Values.services.lineage.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: lineage, app.kubernetes.io/instance: {{ .Release.Name }} }
