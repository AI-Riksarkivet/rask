{{- /*
OTel-first telemetry hub. A single OpenTelemetry Collector (contrib) that:
  - RECEIVES app OTLP (the apps point OTEL_EXPORTER_OTLP_ENDPOINT here — see lance.otlpEndpoint),
  - TAILS infra-pod stdout via the filelog receiver (the SINGLE log shipper — the Vector subchart is
    retired, owner ruling 2026-07-27), dropping from the app pods (lance.dev/logs=otlp) ONLY the lines
    their own SDK also exported — the uvicorn/crash/daprd tier on those pods has no OTLP twin and is kept,
  - SCRAPES the Dapr sidecars' :9090 via the prometheus receiver + k8s SD (the DaprConsumerWedge source),
and exports all three signals OTLP → GreptimeDB (:4000/v1/otlp), adding GreptimeDB's db-name header on every
signal and the trace-pipeline header on traces only (a separate exporter, since metrics/logs must NOT carry it).

Deploys only when observability.enabled AND otelCollector.enabled AND no externalEndpoint is set: in prod you
run the OTel operator + an external Collector and set observability.otelCollector.externalEndpoint, so this
whole file renders nothing and the apps just aim their OTLP at that existing Collector. Single Deployment (not
a DaemonSet): filelog reads the node it lands on — correct on single-node kind/dev; prod uses the external
operator-managed Collector (agent DaemonSet + gateway) instead. NetworkPolicy is a prod switch and prod is
external, so the in-cluster dev Collector isn't gated by it.
*/ -}}
{{- $o := .Values.observability }}
{{- $c := $o.otelCollector | default dict }}
{{- if and $o.enabled $c.enabled (not $c.externalEndpoint) }}
{{- $fullname := include "lance.fullname" . }}
{{- $sa := printf "%s-otel-collector" $fullname }}
{{- $greptime := printf "http://%s:%v/v1/otlp" (include "lance.greptimeHost" .) $o.greptimePort }}
{{- /* The Dapr state store's own database is only worth querying when there IS one: the state store
       component must be enabled (nothing writes workflow history otherwise) and Postgres must exist,
       either in-cluster or as age.externalHost. Gated rather than always-on because a receiver that
       cannot connect retries forever and fills the log with a failure that is not one. */ -}}
{{- $daprState := and .Values.dapr.enabled .Values.stateStore.enabled (or .Values.age.enabled .Values.age.externalHost) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
---
# k8sattributes needs pod/namespace/replicaset/node reads for enrichment; the prometheus receiver's k8s SD
# needs pod discovery. Cluster-scoped (SD + attributes are cluster-wide), read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, nodes/proxy, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $sa }} }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Persist filelog read offsets so a collector RESTART resumes where it left off instead of jumping to the
      # tail (filelog's default start_at: end = logs written during the gap are lost) — the durability the
      # retired Vector agent's data_dir used to give. The emptyDir survives container crash/OOM restarts (the common case, same pod); a full
      # pod reschedule starts fresh, but in prod the OTel operator owns the Collector (this file renders nothing)
      # and manages its own offset persistence. fsGroup 65534 makes the dir writable by the non-root runtime.
      file_storage:
        directory: /var/lib/otelcol/file_storage
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      # Infra-pod logs — the sole log-shipping path (Vector retired). The container operator parses the CRI/containerd log format and
      # stamps k8s.pod.uid/name/namespace/container from the file path; k8sattributes then resolves the pod
      # labels, and a filter drops the app pods that already ship OTLP logs (no double-ingest).
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/{{ .Release.Namespace }}_{{ $fullname }}-otel-collector-*/*/*.log]
        include_file_path: true
        start_at: end
        storage: file_storage
        retry_on_failure: { enabled: true }
        operators:
          - type: container
          # daprd is the ONLY container here with BOTH a fixed schema (dapr.io/log-as-json, set in
          # _helpers.tpl) and no OTLP twin — Dapr registers a NullExporter for its own signals. Parse it so
          # `WHERE severity_text = 'ERROR'` finds a sidecar failure and `scope`/`app_id` become queryable.
          #
          # SCOPED TO THAT CONTAINER ON PURPOSE. Every other stream on this node has its own shape (NATS,
          # OpenFGA, CloudNativePG, the Dapr control plane, Dex, uvicorn); an unscoped parser — or the
          # recombine this deliberately does NOT add — corrupts them. `send_quiet`, not the `send` default:
          # a JSON line without `level` would otherwise raise once per record.
          #
          # `^\\{` needs BOTH backslashes. `^\{` is not a lax pattern, it is a hard startup failure:
          # `failed to compile expression: invalid char escape` and the Collector exits 1 for the estate.
          - type: json_parser
            if: 'resource["k8s.container.name"] == "daprd" and body matches "^\\{"'
            on_error: send_quiet
            parse_from: body
            parse_to: attributes
            severity:
              parse_from: attributes.level
      # Dapr sidecar metrics (:9090) — the DaprConsumerWedge source. Discover dapr.io/enabled pods, scrape
      # the dapr-metrics port only (the container port NAME), so app ports don't produce duplicate targets.
      prometheus:
        config:
          scrape_configs:
            - job_name: dapr-sidecars
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_enabled]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: dapr-metrics
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
            # Dapr CONTROL PLANE metrics (:9090) — a SECOND job, because the sidecar job above cannot
            # reach them: it keeps only pods annotated `dapr.io/enabled=true`, and a control-plane pod
            # carries `dapr.io/control-plane=<component>` instead. So every control-plane metric was
            # unscraped, and an alert written on one would have been a rule that can never fire.
            #
            # The scheduler is the one that matters. Since Dapr 1.15 REMINDERS
            # live in the scheduler's own etcd, not in the actor state store — verified on this cluster:
            # `dapr-scheduler-server` is a 3-replica StatefulSet with a 16 Gi etcd PVC. So it is a
            # failure domain that can be lost INDEPENDENTLY of the data its reminders bound, and the
            # symptom of a lost reminder is SILENCE: a lease that never expires, a publish that never
            # re-drives, an inbox that never compacts. `ActorStateTTL` is off on this estate, so there
            # is no TTL backstop underneath it either.
            #
            # `dapr_scheduler_sidecars_connected` is the only Dapr-specific metric the scheduler
            # exposes (verified against a live pod — the other 38 families are Go runtime/process), and
            # it is the right one: it counts sidecars that can actually be served, so zero means no
            # reminder can fire for anyone.
            - job_name: dapr-control-plane
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_control_plane]
                  action: keep
                  regex: ".+"
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
                - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_control_plane]
                  target_label: dapr_control_plane
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
            # RAY (:8080) — a THIRD job, and it exists because neither job above can ever match a Ray
            # pod. Both `keep` on a `dapr.io/*` pod annotation at their first relabel step; Ray pods
            # carry none (`grep -n dapr chart/templates/rayservice.yaml` -> no matches), so every Ray
            # pod was dropped before any other rule ran. The consequence was total rather than partial:
            # no ray_tasks/ray_actors by state, no GCS liveness, no OOM-kill counter
            # (ray_memory_manager_worker_eviction_total), no object-store spill, no ray_serve_* replica
            # health or latency, no ray_data_* backpressure — on the cluster the whole bronze->silver->
            # gold cascade runs on. A head that is alive-but-wedged read identically to an idle one.
            #
            # There is no PodMonitor alternative: the chart has no prometheus-operator dependency
            # (Chart.lock), so such an object would be reconciled by nothing.
            #
            # THE SELECTOR IS NOT NEW. network-policy.yaml already selects Ray pods by
            # `ray.io/is-ray-node: "yes"` and records the reason there: "The chart's head template
            # stamps no labels of its own; KubeRay stamps its `ray.io/is-ray-node` marker on every Ray
            # pod, so select that (component-label style can't reach operator-created pods)." Keying
            # this on anything else would be a second, divergent answer to a settled question.
            #
            # NOT scraped here, deliberately: the autoscaler (:44217) and dashboard (:44227) ports.
            # `workerGroupSpecs: []` and there is no in-tree autoscaling, so the autoscaler_* family
            # (which is namespaced `autoscaler`, NOT `ray_`) has no producer on this cluster. Add the
            # ports and a second job WITH the worker group, not before it.
            - job_name: ray-pods
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_ray_io_is_ray_node]
                  action: keep
                  regex: "yes"
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
                # Ray's own shipped Grafana panels template `ray_io_cluster` and group Serve/Data by
                # application+deployment. Carrying the cluster and node-type labels here is what lets a
                # panel written against Ray's published PromQL work unmodified.
                - source_labels: [__meta_kubernetes_pod_label_ray_io_cluster]
                  target_label: ray_io_cluster
                - source_labels: [__meta_kubernetes_pod_label_ray_io_node_type]
                  target_label: ray_node_type
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
              # DROP THE ray_data_* FIREHOSE. This job is what broke the telemetry store: it went live
              # 2026-08-23 04:36:45Z and added 4,099 series in one step, against the whole prior
              # estate's 3,250 (dapr-sidecars 3,186 + dapr-control-plane 64). First OOMKill followed at
              # 08:07:16Z; twelve more that day. Of the 288 ray_* metric families that arrived, 113 are
              # `ray_data_*` — Ray Data's PER-DATASET, PER-OPERATOR instrumentation, whose series set
              # grows with every dataset and operator a job creates. Unbounded by construction, not
              # merely large.
              #
              # Two of the 113 ARE read, by the ray dashboard's backpressure panel
              # (perses-dashboards.yaml: ray_data_num_tasks_submitted and
              # ray_data_task_submission_backpressure_time), so this keeps exactly those and drops the
              # rest. A blanket `drop: ray_data_.*` would have blanked that panel silently — the
              # failure mode this whole change exists to avoid.
              #
              # Expressed as mark-then-drop because RE2 has no negative lookahead, so "all except these
              # two" cannot be one regex. The marker is `__`-prefixed, so Prometheus removes it after
              # relabeling and it never reaches the store.
              #
              # Dropped HERE and not at Ray on purpose: the Ray cluster is operated outside this repo
              # (open_ray_handover.md), so a fix depending on its config is one this chart cannot land.
              # Reversible in one edit if a workload ever needs the per-operator detail — but bound the
              # store first (chart/values.yaml `greptimedb-standalone.configToml`), because this drop is
              # a cardinality economy, NOT the reason the store stopped dying.
              #
              # WHAT IT DOES NOT DO: reclaim anything. 113 `ray_data_*` tables are already resident in
              # GreptimeDB and this rule only stops NEW rows; the existing ones expire on their own
              # (`ttl = '14days'`, verified on both the logical and the physical table), and the empty
              # table definitions outlive that. So do not read a table listing as evidence the drop is
              # not working — read the row timestamps.
              #
              # ALSO UNEXERCISED, and honest about it: `ray_data_*` series only appear while a Ray Data
              # job is running, and none has run since this landed. The keep-list was checked against
              # the dashboards by inspection (an exact match for the only two `ray_data_` names any
              # panel queries), not against live traffic.
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'ray_data_(num_tasks_submitted|task_submission_backpressure_time)'
                  target_label: __ray_data_keep
                  replacement: 'yes'
                - source_labels: [__ray_data_keep, __name__]
                  separator: ';'
                  regex: ';ray_data_.*'
                  action: drop

            # The telemetry store's OWN health. Until 2026-08-23 nothing scraped it, and the
            # consequence was not subtle: GreptimeDB was OOMKilled 13 times in one day (exit 137,
            # 8Gi limit) and every surface that could have reported it is downstream of the store
            # that was dying. No `kube_*` or `container_*` series exist anywhere in the estate —
            # kube-state-metrics is not deployed and is not even a toggle — so there was no second
            # path either. A store that cannot be observed cannot be alerted on, which is why this
            # job has to land BEFORE the GreptimeDB* rules in chart/alerting/rules.yml can exist
            # (pinned both ways by test_every_job_selector_names_a_real_scrape_job).
            #
            # Selector verified live: pod label app.kubernetes.io/name=greptimedb-standalone, and
            # the HTTP port is named `http` (4000), not `metrics` — it serves /v1/otlp, /v1/sql,
            # /v1/prometheus AND /metrics on the one port, so keying on the port NAME the way the
            # ray-pods job does would select nothing here.
            #
            # Yes, this writes greptime_* series into the store it measures. That is the standard
            # self-monitoring trade and it is the right one at this scale: the alternative is a
            # second store for one target. It does mean R7/R9 (`process_start_time_seconds` /
            # `up`) are the load-bearing ones — they are answered by the SCRAPER, so they still
            # fire when the store itself is the thing that is down.
            - job_name: greptimedb
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: greptimedb-standalone
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
{{- if $daprState }}
      # DAPR WORKFLOW HISTORY — measured by QUERY, because there is nothing to scrape.
      #
      # Every other metric in this file arrives from a target that already exports it. This one cannot:
      # enumerated live on 2026-08-26 against the `ingest` sidecar, daprd's ENTIRE metric surface is
      # dapr_error_code_total, dapr_grpc_io_*, dapr_http_*, dapr_runtime_component_{init_total,loaded}
      # and go_*. No workflow metric, no actor metric, no state-store metric — and
      # `dapr_runtime_workflow_*` (already documented as unreliable for this codebase in
      # chart/alerting/rules.yml) is absent outright. A fourth scrape job would have had no target.
      #
      # So the state store is read directly. `spec.workflow.stateRetentionPolicy` in observability.yaml
      # is the ONLY thing that removes workflow history — there is deliberately no application-side
      # purge (DaprWorkflowClient has no list-instances API, so a sweep could not name what to purge
      # after a restart) — and if it stops collecting, the first symptom is a full disk. These two
      # gauges are what chart/alerting/rules.yml's `dapr-workflow-state` group alerts on, pinned in
      # both directions by test_every_collector_sourced_ALERT_names_a_metric_the_RECEIVER_declares.
      #
      # A COLLECTOR RECEIVER RATHER THAN A postgres_exporter SIDECAR: no second image to vendor, scan
      # and size, no second credential path, and the query lives in the file that already owns "get
      # this series into GreptimeDB". Cost measured on the live store: 4.7ms over a 7.5MB table.
      #
      # THE AGE METRIC READS HISTORY ROWS ONLY, and that filter is load-bearing rather than tidy. A
      # workflow's `metadata` row keeps its original insertdate across `continue_as_new`, so a
      # long-running recurring workflow — which this estate has, in the movers' watch loops — would
      # look arbitrarily old forever and the alert would fire on a perfectly healthy store. History
      # rows are rewritten per turn, so their age is the property the retention policy actually
      # governs. Key shape verified live: `<app>||dapr.internal.default.<app>.workflow||<id>||history-000006`.
      #
      # The password is an ENV REFERENCE, not a literal: the Collector expands ${env:...} at load, and
      # the value arrives by secretKeyRef on the Deployment below, so no credential is in this ConfigMap.
      sqlquery/daprstate:
        driver: postgres
        datasource: "host={{ include "lance.ageConnectHost" . }} port={{ .Values.age.port }} user={{ .Values.age.user }} password=${env:DAPRSTATE_PASSWORD} dbname={{ .Values.age.stateDb }} sslmode=disable"
        collection_interval: 5m
        queries:
          - sql: "select count(*)::bigint as workflow_rows, coalesce(extract(epoch from now() - min(insertdate) filter (where key like '%||history-%')), 0)::bigint as oldest_history_age_seconds from {{ .Values.stateStore.tableName }} where key like '%workflow%'"
            metrics:
              # Volume. Read by DaprWorkflowStateMetricsMissing and by nothing else — its job is to be
              # PRESENT, so that the age rule going quiet can be told apart from the age rule going blind.
              - metric_name: dapr_workflow_state_rows
                value_column: workflow_rows
                value_type: int
                data_type: gauge
              # The property. NO `unit:` field, and the name carries `_seconds` itself — declaring a unit
              # would make the OTLP->Prometheus convention APPEND the suffix, which is exactly how
              # `outbox_oldest_age` shipped as a rule that could never fire (see rules.yml:22-27).
              - metric_name: dapr_workflow_history_oldest_age_seconds
                value_column: oldest_history_age_seconds
                value_type: int
                data_type: gauge
{{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.container.name, k8s.deployment.name]
          labels:
            - { tag_name: lance.dev/logs, key: lance.dev/logs, from: pod }
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: connection }]
      # The app pods already export OTLP logs (trace-correlated) — drop the file-tailed duplicate. Mirrors
      # what the retired Vector agent's `lance.dev/logs!=otlp` selector did. error_mode ignore: a pod without the label is kept.
      #
      # BOTH CLAUSES ARE LOAD-BEARING, and the second was missing until 2026-08-15. The pod label alone
      # cannot tell the two copies apart, because it is a property of the POD and both copies come from
      # the same pod: `k8sattributes` associates filelog records by `k8s.pod.uid` and OTLP records by
      # `{from: connection}`, stamping `lance.dev/logs=otlp` on both. So the label-only condition dropped
      # the OTLP ORIGINAL along with its duplicate — the entire application log tier, silently, while
      # every pipeline reported healthy. Measured live: `opentelemetry_logs` held 60.4M rows and not one
      # with a `medallion`/`lineage`/`catalog` scope; only unlabelled infra pods survived.
      #
      # `log.file.path` is the discriminator: the filelog receiver sets it (`include_file_path: true`
      # above) and OTLP records never carry it. Keyed on the SOURCE, the filter drops what it was
      # written to drop and nothing else.
      filter/drop_app_file_logs:
        error_mode: ignore
        logs:
          log_record:
            - >-
              resource.attributes["lance.dev/logs"] == "otlp"
              and attributes["log.file.path"] != nil
              and resource.attributes["k8s.container.name"] != "daprd"
              and IsMatch(body, "^[0-9]{4}-[0-9]{2}-[0-9]{2} ")
      batch: {}
      # The workflow engine's liveness ping to its own sidecar, dropped before it reaches the store.
      # RE-MEASURED 2026-08-23 rather than inherited (two audits put its share 40 points apart):
      # 3,828 spans in three hours, ninth-largest span name in the estate, carrying nothing anyone
      # reads. Scoped to the EXACT name, not a prefix, so a real TaskHubSidecarService call still
      # traces. `error_mode: ignore` so a span with no name cannot wedge the pipeline.
      #
      # Proportion matters here: this is the SMALL half of the trace noise. The kubelet probe spans
      # fixed in the same change were 31,916 over the same window, and those are excluded at the SDK
      # (rask.otelEnv's OTEL_PYTHON_FASTAPI_EXCLUDED_URLS) because the app owns them — dropping them
      # here instead would pay to serialize and ship spans only to discard them at the far end.
      filter/drop_keepalive:
        error_mode: ignore
        traces:
          span:
            - 'name == "/TaskHubSidecarService/Hello"'
    exporters:
      # Traces carry GreptimeDB's trace-pipeline header (→ opentelemetry_traces); metrics/logs must NOT, so
      # they get a separate exporter with only the db-name header. Both hit the same /v1/otlp base; the
      # otlphttp exporter appends /v1/{traces,metrics,logs} per signal (same as the app SDK did).
      {{- /* DURABILITY. Both exporters queue and retry; `batch` alone is not durability — it holds a
         batch in memory and forgets it if the process dies. That was not theoretical: the store these
         write to OOMKilled 13 times on 2026-08-23 and every one was a hole a queue would have ridden out.

         `storage: file_storage` makes the queue survive a Collector restart, and the id MUST appear in
         `service.extensions` below — it does. A queue naming an unregistered extension renders fine,
         passes `otelcol validate` with exit 0, and then kills the Collector at startup with
         `no storage client extension found`, taking the whole telemetry plane down to fix a
         durability gap. That trap is why this was deferred once; the gate now checks the reference
         resolves, not merely that a queue exists.

         BOUNDED, because the backing emptyDir is shared with filelog's read offsets: an unbounded
         queue would trade dropped telemetry for a filled node. `queue_size` is explicit here and the
         volume carries a `sizeLimit`. `max_elapsed_time` is finite for the same reason — past five
         minutes the queue, not the retry loop, is what carries the data. */}}
      otlphttp/greptime_traces:
        endpoint: {{ $greptime | quote }}
        headers:
          x-greptime-db-name: {{ $o.dbName | quote }}
          x-greptime-pipeline-name: {{ $o.tracePipeline | quote }}
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 500
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      otlphttp/greptime:
        endpoint: {{ $greptime | quote }}
        headers:
          x-greptime-db-name: {{ $o.dbName | quote }}
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 500
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    service:
      extensions: [health_check, file_storage]
      pipelines:
        {{- /* THE WORKFLOW KEEPALIVE IS FILTERED, by `filter/drop_keepalive` in the traces pipeline
               below. `/TaskHubSidecarService/Hello` is the engine's health ping to its own sidecar and
               carries nothing anyone reads. Two earlier audits put its share of the grpc scope 40
               points apart, so it was re-measured before acting rather than taken on trust: 3,828 spans
               in three hours, the ninth-largest span name in the estate.
               Worth knowing for proportion — it was never the big one. The kubelet probe spans fixed in
               the same change were 31,916 over the same window, and those are excluded at the SDK
               (`rask.otelEnv`'s OTEL_PYTHON_FASTAPI_EXCLUDED_URLS) because the app owns them. */}}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, filter/drop_keepalive, batch]
          exporters: [otlphttp/greptime_traces]
        metrics:
          receivers: [otlp, prometheus{{ if $daprState }}, sqlquery/daprstate{{ end }}]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/greptime]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, filter/drop_app_file_logs, batch]
          exporters: [otlphttp/greptime]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
      annotations:
        checksum/config: {{ .Values | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ $sa }}
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: otel-collector
          image: {{ $c.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
{{- if $daprState }}
          # The Dapr state store's Postgres password, for the sqlquery/daprstate receiver. By
          # secretKeyRef so it stays out of the ConfigMap, `helm get manifest` and `kubectl describe`;
          # the config references it as ${env:DAPRSTATE_PASSWORD}, expanded by the Collector at load.
          env:
            - name: DAPRSTATE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: postgres-password }
{{- end }}
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe: { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: {{- include "lance.resources" (dict "root" . "comp" "otel-collector") | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol, readOnly: true }
            # filelog reads the node's container logs (RO). /var/log/pods symlinks into /var/lib/docker or
            # containerd, so mount both roots (the second is where the real files live on most nodes).
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
            # filelog offset checkpoints (file_storage extension) — writable via fsGroup 65534.
            - { name: offsets, mountPath: /var/lib/otelcol/file_storage }
      volumes:
        - name: config
          configMap: { name: {{ $sa }} }
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
        - { name: varlibdockercontainers, hostPath: { path: /var/lib/docker/containers } }
        # sizeLimit because this dir now backs the exporters' persistent sending_queue as well as
        # filelog's read offsets — without it a store outage trades dropped telemetry for a full node.
        - { name: offsets, emptyDir: { sizeLimit: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
{{- end }}
