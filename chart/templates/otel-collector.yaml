
{{- $o := .Values.observability }}
{{- $c := $o.otelCollector | default dict }}
{{- if $o.enabled }}
{{- $fullname := include "lance.fullname" . }}
{{- $sa := printf "%s-otel-collector" $fullname }}
{{- $x := $o.export | default dict }}
{{- $endpoint := required "observability.export.endpoint: the OTLP/HTTP endpoint the Collector exports to (the platform's telemetry backend)" $x.endpoint }}
{{- $headers := $x.headers | default dict }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, nodes/proxy, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $sa }} }
subjects:
  - { kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }} }
---
{{ include "lance.otelCollectorConfigMap" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
      annotations:
        checksum/config: {{ include "lance.otelCollectorConfigMap" . | sha256sum }}
    spec:
      serviceAccountName: {{ $sa }}
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: otel-collector
          image: {{ $c.image }}

          {{- include "lance.rootlessSecurityContext" 65534 | nindent 10 }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe: { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 30, periodSeconds: 30, failureThreshold: 3 }
          resources: {{- include "lance.resources" (dict "root" . "comp" "otel-collector") | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol, readOnly: true }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
            - { name: offsets, mountPath: /var/lib/otelcol/file_storage }
            - { name: export-credential, mountPath: /var/run/secrets/rask/export, readOnly: true }
      volumes:
        - name: config
          configMap: { name: {{ $sa }} }
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
        - { name: varlibdockercontainers, hostPath: { path: /var/lib/docker/containers } }
        - { name: offsets, emptyDir: { sizeLimit: 2Gi } }
        - { name: export-credential, secret: { secretName: {{ $sa }}-export, defaultMode: 0440 } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
{{- end }}
{{- define "lance.otelCollectorConfigMap" -}}
{{- $fullname := include "lance.fullname" . }}
{{- $sa := printf "%s-otel-collector" $fullname }}
{{- $x := .Values.observability.export | default dict }}
{{- $endpoint := $x.endpoint }}
{{- $headers := $x.headers | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $sa }}
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Persist filelog read offsets so a collector RESTART resumes where it left off instead of jumping to the
      # tail (filelog's default start_at: end = logs written during the gap are lost) — the durability the
      # retired Vector agent's data_dir used to give. The emptyDir survives container crash/OOM restarts (the common case, same pod); a full
      # pod reschedule starts fresh, but in prod the OTel operator owns the Collector (this file renders nothing)
      # and manages its own offset persistence. fsGroup 65534 makes the dir writable by the non-root runtime.
      file_storage:
        directory: /var/lib/otelcol/file_storage
      # The export credential (values.yaml `observability`), from files ESO writes; watched, so a rotation needs no restart.
      basicauth/export:
        client_auth:
          username_file: /var/run/secrets/rask/export/username
          password_file: /var/run/secrets/rask/export/password
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
      # Infra-pod logs — the sole log-shipping path (Vector retired). The container operator parses the CRI/containerd log format and
      # stamps k8s.pod.uid/name/namespace/container from the file path; k8sattributes then resolves the pod
      # labels, and a filter drops the app pods that already ship OTLP logs (no double-ingest).
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/{{ .Release.Namespace }}_{{ $fullname }}-otel-collector-*/*/*.log]
        include_file_path: true
        start_at: end
        storage: file_storage
        retry_on_failure: { enabled: true }
        operators:
          - type: container
          # daprd is the ONLY container here with BOTH a fixed schema (dapr.io/log-as-json, set in
          # _helpers.tpl) and no OTLP twin — Dapr registers a NullExporter for its own signals. Parse it so
          # `WHERE severity_text = 'ERROR'` finds a sidecar failure and `scope`/`app_id` become queryable.
          #
          # SCOPED TO THAT CONTAINER ON PURPOSE. Every other stream on this node has its own shape (NATS,
          # OpenFGA, CloudNativePG, the Dapr control plane, Dex, uvicorn); an unscoped parser — or the
          # recombine this deliberately does NOT add — corrupts them. `send_quiet`, not the `send` default:
          # a JSON line without `level` would otherwise raise once per record.
          #
          # `^\\{` needs BOTH backslashes. `^\{` is not a lax pattern, it is a hard startup failure:
          # `failed to compile expression: invalid char escape` and the Collector exits 1 for the estate.
          - type: json_parser
            if: 'resource["k8s.container.name"] == "daprd" and body matches "^\\{"'
            on_error: send_quiet
            parse_from: body
            parse_to: attributes
            severity:
              parse_from: attributes.level
      # Dapr sidecar metrics (:9090) — the DaprConsumerWedge source. Discover dapr.io/enabled pods, scrape
      # the dapr-metrics port only (the container port NAME), so app ports don't produce duplicate targets.
      prometheus:
        config:
          scrape_configs:
            - job_name: dapr-sidecars
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_enabled]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: dapr-metrics
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
            # Dapr CONTROL PLANE metrics (:9090) — a SECOND job, because the sidecar job above cannot
            # reach them: it keeps only pods annotated `dapr.io/enabled=true`, and a control-plane pod
            # carries `dapr.io/control-plane=<component>` instead. So every control-plane metric was
            # unscraped, and an alert written on one would have been a rule that can never fire.
            #
            # The scheduler is the one that matters. Since Dapr 1.15 REMINDERS
            # live in the scheduler's own etcd, not in the actor state store — verified on this cluster:
            # `dapr-scheduler-server` is a 3-replica StatefulSet with a 16 Gi etcd PVC. So it is a
            # failure domain that can be lost INDEPENDENTLY of the data its reminders bound, and the
            # symptom of a lost reminder is SILENCE: a lease that never expires, a publish that never
            # re-drives. `ActorStateTTL` is off on this estate, so there
            # is no TTL backstop underneath it either.
            #
            # `dapr_scheduler_sidecars_connected` is the only Dapr-specific metric the scheduler
            # exposes (verified against a live pod — the other 38 families are Go runtime/process), and
            # it is the right one: it counts sidecars that can actually be served, so zero means no
            # reminder can fire for anyone.
            - job_name: dapr-control-plane
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Values.dapr.controlPlaneNamespace }}] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_control_plane]
                  action: keep
                  regex: ".+"
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
                - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_control_plane]
                  target_label: dapr_control_plane
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
            # OPENFGA (:2112) — a THIRD job, because the two above cannot reach it: `dapr-sidecars` and
            # `dapr-control-plane` both `keep` on a `dapr.io/*` pod annotation at their first relabel
            # step, and an OpenFGA pod carries neither, so they drop it before any later rule runs.
            # Every governed read and write in this estate blocks on a Check, so a slow or
            # datastore-thrashing authz store is the first thing an operator needs to see.
            #
            # CARDINALITY IS BOUNDED BEFORE IT LANDS. The store's ceiling is shared, and what matters is
            # UNBOUNDED, not merely large: a family whose series set grows with the workload (per
            # dataset, per operator) has no ceiling at all. Measured on the deployed pod 2026-09-20: 653
            # series, 561 of them `openfga_*`, and `openfga_request_duration_ms` is gRPC-method x bucket,
            # fixed by the API surface. So the openfga families stay and only the Go runtime goes.
            - job_name: openfga
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [{{ .Release.Namespace }}] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: openfga
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
              metric_relabel_configs:
                # 44 of the 653 are the Go runtime and carry no OpenFGA signal. Dropped here rather
                # than tolerated because every Go service in the estate would otherwise duplicate
                # them, and the store's ceiling is a shared resource.
                - source_labels: [__name__]
                  action: drop
                  regex: "(go_|process_).*"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.container.name, k8s.deployment.name]
          labels:
            - { tag_name: lance.dev/logs, key: lance.dev/logs, from: pod }
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: connection }]
      filter/drop_app_file_logs:
        error_mode: ignore
        logs:
          log_record:
            - >-
              resource.attributes["lance.dev/logs"] == "otlp"
              and attributes["log.file.path"] != nil
              and resource.attributes["k8s.container.name"] != "daprd"
              and IsMatch(body, "^[0-9]{4}-[0-9]{2}-[0-9]{2} ")
      filter/audit_only:
        error_mode: ignore
        logs:
          log_record:
            - 'body != "audit"'
      filter/drop_audit:
        error_mode: ignore
        logs:
          log_record:
            - 'body == "audit"'
      batch: {}
      filter/drop_keepalive:
        error_mode: ignore
        traces:
          span:
            - 'name == "/TaskHubSidecarService/Hello"'
    exporters:
      otlphttp/traces:
        endpoint: {{ $endpoint | quote }}
        headers: {{- merge (dict) ($x.traceHeaders | default dict) $headers | toYaml | nindent 10 }}
        auth: { authenticator: basicauth/export }
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 500
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      otlphttp/audit:
        endpoint: {{ $endpoint | quote }}
        headers: {{- merge (dict) ($x.auditHeaders | default dict) $headers | toYaml | nindent 10 }}
        auth: { authenticator: basicauth/export }
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 500
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      otlphttp:
        endpoint: {{ $endpoint | quote }}
        headers: {{- $headers | toYaml | nindent 10 }}
        auth: { authenticator: basicauth/export }
        sending_queue:
          enabled: true
          storage: file_storage
          queue_size: 500
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    service:
      extensions: [health_check, file_storage, basicauth/export]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, filter/drop_keepalive, batch]
          exporters: [otlphttp/traces]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, filter/drop_app_file_logs, filter/drop_audit, batch]
          exporters: [otlphttp]
        logs/audit:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, filter/audit_only, batch]
          exporters: [otlphttp/audit]
{{- end }}
