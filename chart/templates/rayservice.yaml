{{- if and .Values.ray.enabled .Values.singleTenant.enabled }}
{{- $secretName := .Values.existingSecret | default (printf "%s-app" (include "rask.fullname" .)) }}
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: {{ include "rask.fullname" . }}-ray
  labels:
    {{- include "rask.componentLabels" (list . "ray") | nindent 4 }}
spec:
  {{- /* THE APPLICATION LIST IS VALUES, NOT TEMPLATE. A workload reaches the platform as CONFIG, so
       this template names no application and `ray.serveApplications` defaults to none: which
       workloads a release serves is its own values overlay's business, and the platform chart knows
       none of them (CLAUDE.md).

       EMPTY RENDERS `applications: []`, never a bare `applications:`. The bare key is YAML null, and
       Ray's ServeDeploySchema refuses null while accepting the empty list (checked against the root
       lock's ray, 2026-09-23) — so the `else` below is what lets a release with nothing declared still
       bring up its cluster and Serve controller rather than hand KubeRay a config Ray rejects.

       The env below is the PLATFORM's half of the contract — replica count, GPU fraction, HF token
       behaviour — applied to every application; a workload's own parameters ride `params`, rendered
       RASK_PARAM_<KEY> so one cannot reach a platform variable by choosing a colliding name (the rule
       ray_submit already applies to stage jobs). */}}
  serveConfigV2: |
    applications:
      {{- range $app := .Values.ray.serveApplications }}
      - name: {{ $app.name }}
        import_path: {{ $app.importPath }}
        route_prefix: {{ $app.routePrefix }}
        runtime_env:
          {{- if $app.image }}
          {{- /* THE PER-WORKLOAD BAKED IMAGE. `image_uri` names a whole prebuilt image for THIS
               application's replicas (Ray 2.43+), so several workloads share one cluster without
               sharing one environment — which is what keeps the head image agnostic.

               This is NOT the mechanism the 2026-08-23 ruling rejected. That refuses shipping
               DEPENDENCIES through runtime_env (the `pip`/`uv` fields, resolving a stack at replica
               start). Handing a deployment an image built by .docker/ray-runner.dockerfile is the
               baked-image answer the ruling asks for.

               Unset => the replicas inherit the head's image, which is correct only when the head
               image already provides the import path — and the head installs no runner, so an
               application without its own image names a module nothing it runs can import. That
               pairing renders cleanly and surfaces only as a RayService that never becomes healthy,
               which is why tests/unit/test_invariants.py refuses it statically. */}}
          image_uri: {{ $app.image | quote }}
          {{- end }}
          env_vars:
            RASK_SERVE_REPLICAS: "{{ $.Values.config.RASK_SERVE_REPLICAS }}"
            {{- /* DERIVED from ray.gpuCount (rask.serveGpuFrac), not passed through: an actor that asks
                 for a GPU fraction on a cluster that advertises no nvidia.com/gpu never becomes
                 healthy, so the RayService stays `Initializing` forever, the operator never creates
                 the stable `<release>-ray-head-svc`, and the compute zone reports "Ray offline" beside
                 a Running head (live-proof 2026-07-28, defect 3 — it took a manual
                 --set config.RASK_SERVE_GPU_FRAC=0 to get past). The same helper feeds the fleet
                 ConfigMap, so the two can never disagree. */}}
            RASK_SERVE_GPU_FRAC: "{{ include "rask.serveGpuFrac" $ }}"
            HF_HUB_DISABLE_IMPLICIT_TOKEN: "0"
            {{- /* NO OTEL_* HERE, deliberately. `runtime_env.env_vars` scopes to ONE Serve application's
                 build task and replica actors, so telemetry configured here reaches neither the
                 ray-head container, GCS, the raylet, the dashboard agent, nor the Serve
                 controller/proxy — and a service name set per application is a workload's name, not
                 the shared Ray plane's identity. Telemetry renders on the head CONTAINER via
                 `rask.rayOtelEnv`, derived from the same helpers every other pod uses. What stays here
                 is the WORKLOAD's own half of the contract — replica count, GPU fraction, HF token
                 behaviour — which is exactly what runtime_env is for. */}}
            {{- range $key, $value := ($app.params | default dict) }}
            {{ printf "RASK_PARAM_%s" $key }}: {{ $value | quote }}
            {{- end }}
      {{- else }} []
      {{- end }}
  rayClusterConfig:
{{- include "rask.rayClusterConfig" . }}
{{- end }}
