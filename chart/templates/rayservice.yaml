{{- if and .Values.ray.enabled .Values.singleTenant.enabled }}
{{- $secretName := .Values.existingSecret | default (printf "%s-app" (include "rask.fullname" .)) }}
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: {{ include "rask.fullname" . }}-ray
  labels:
    {{- include "rask.componentLabels" (list . "ray") | nindent 4 }}
spec:
  serveConfigV2: |
    applications:
      - name: htrflow
        import_path: {{ .Values.ray.importPath }}
        route_prefix: {{ .Values.ray.serveRoutePrefix }}
        runtime_env:
          env_vars:
            RASK_SERVE_REPLICAS: "{{ .Values.config.RASK_SERVE_REPLICAS }}"
            RASK_SERVE_GPU_FRAC: "{{ .Values.config.RASK_SERVE_GPU_FRAC }}"
            HF_HUB_DISABLE_IMPLICIT_TOKEN: "0"
            {{- if .Values.observability.enabled }}
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://rask-greptimedb-standalone:4000/v1/otlp"
            OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
            OTEL_EXPORTER_OTLP_HEADERS: "x-greptime-db-name=public"
            OTEL_EXPORTER_OTLP_TRACES_HEADERS: "x-greptime-db-name=public,x-greptime-pipeline-name=greptime_trace_v1"
            OTEL_SERVICE_NAME: "ray-htrflow"
            {{- end }}
  rayClusterConfig:
    rayVersion: {{ .Values.ray.rayVersion | quote }}
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-gpus: "{{ .Values.ray.gpuCount }}"
      template:
        spec:
          runtimeClassName: {{ .Values.ray.runtimeClassName }}
          containers:
            - name: ray-head
              image: "{{ .Values.ray.image.repository }}:{{ .Values.ray.image.tag }}"
              imagePullPolicy: {{ .Values.ray.image.pullPolicy }}
              env:
                {{- /* Token auth (gate 7 / R3): the env pair, not `system_config` — Ray raises if
                     auth mode is set via system_config. `ray start --head` fails closed when
                     RAY_AUTH_MODE=token and no token resolves. Any future workerGroupSpecs entry
                     MUST carry the same include. This is the "legacy/manual" KubeRay wiring —
                     valid mechanically on any operator, but only OPERABLE with kuberay >= 1.6.0
                     (the RayService controller must send the token too; see values.yaml ray.auth). */}}
                {{- include "rask.rayAuthEnv" . | nindent 16 }}
                - name: RAY_ENABLE_UV_RUN_RUNTIME_ENV
                  value: "0"
                - name: HF_HOME
                  value: /cache/hf
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: HF_TOKEN
              ports:
                - {containerPort: 6379, name: gcs}
                - {containerPort: 8265, name: dashboard}
                - {containerPort: 10001, name: client}
                - {containerPort: 8000, name: serve}
              resources:
                requests:
                  {{- toYaml .Values.ray.resources.requests | nindent 18 }}
                limits:
                  nvidia.com/gpu: {{ .Values.ray.gpuCount }}
                  {{- toYaml .Values.ray.resources.limits | nindent 18 }}
              volumeMounts:
                - {name: dshm, mountPath: /dev/shm}
                - {name: hf-cache, mountPath: /cache/hf}
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: {{ .Values.ray.shmSize }}
            - name: hf-cache
              persistentVolumeClaim:
                claimName: {{ include "rask.fullname" . }}-hf-cache
    workerGroupSpecs: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rask.fullname" . }}-hf-cache
  labels:
    {{- include "rask.componentLabels" (list . "ray") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.ray.hfCacheStorage }}
{{- end }}
