{{- if .Values.compaction.enabled }}
{{- $root := . }}
{{- $port := .Values.compaction.port }}
{{- if .Values.dapr.enabled }}
# Dapr cron INPUT binding — the sidecar POSTs to /<bindingName> on `schedule`. The schedule lives here
# as component config, not in app code (no scheduler thread in the service). Scoped to the compaction app.
# Gated on dapr.enabled: without the Dapr control plane the Component CRD doesn't exist and the release
# would fail to apply (the service still renders below; its cron route just never fires).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.compaction.bindingName }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.compaction.schedule | quote }} }
scopes:
  - {{ .Values.compaction.daprAppId }}
---
{{- end }}
# Compaction/GC service — runs uvicorn compaction.service:app (shares the catalog image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-compaction
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: compaction, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: compaction
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
      {{- if .Values.dapr.sidecars }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ .Values.compaction.daprAppId | quote }}
        dapr.io/app-port: {{ $port | quote }}
        dapr.io/log-level: {{ .Values.dapr.logLevel | quote }}
        dapr.io/app-token-secret: {{ .Release.Name }}-dapr-app-token
        {{- include "lance.daprSidecarResources" . | nindent 8 }}
        {{- if include "lance.otelEnabled" $root }}
        dapr.io/config: "lance-tracing"
        {{- end }}
      {{- end }}
    spec:
      # Longer grace than the other apps: an in-flight sweep/Lance write must finish, not be SIGKILLed.
      terminationGracePeriodSeconds: {{ .Values.lifecycle.compactionTerminationGracePeriodSeconds }}
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-compaction
      {{- end }}
      containers:
        - name: compaction
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          {{- if include "lance.otelEnabled" $root }}
          command: ["opentelemetry-instrument", "uvicorn", "compaction.service:app", "--host=0.0.0.0", "--port={{ $port }}"]
          {{- else }}
          command: ["uvicorn", "compaction.service:app", "--host=0.0.0.0", "--port={{ $port }}"]
          {{- end }}
          ports: [{ name: http, containerPort: {{ $port }} }]
          env:
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root .Values.compaction.daprAppId) | nindent 12 }}
            {{- end }}
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            # Fail-closed at boot if behind a Dapr sidecar but the app-token is unset (open forgery path) —
            # symmetric with the lineage service (the audit's consistency fix).
            - { name: COMPACTION_DAPR_ENABLED, value: {{ .Values.dapr.sidecars | quote }} }
            - name: APP_API_TOKEN  # verify the Dapr-stamped header on the cron route (forged-sweep guard)
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-dapr-app-token, key: token }
            {{- if .Values.compaction.lineageEmit }}
            - { name: COMPACTION_LINEAGE_EMIT_ENABLED, value: "true" }
            - { name: COMPACTION_LINEAGE_PUBSUB, value: {{ .Values.pubsub.name | quote }} }
            - { name: COMPACTION_LINEAGE_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- end }}
            - { name: COMPACTION_BINDING_NAME, value: {{ .Values.compaction.bindingName | quote }} }
            - { name: COMPACTION_OLDER_THAN_DAYS, value: {{ .Values.compaction.olderThanDays | quote }} }
            - { name: COMPACTION_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            - { name: COMPACTION_S3_ACCESS_KEY_ID, value: {{ .Values.rustfs.accessKey | quote }} }
            {{- if not (include "lance.secretsViaDapr" .) }}
            - { name: COMPACTION_S3_SECRET_ACCESS_KEY, value: {{ .Values.rustfs.secretKey | quote }} }
            {{- else }}
            # A secret store is configured → the S3 secret comes ONLY from it at boot; not in pod env (the
            # audit's fix — compaction is a real S3 consumer that compacts/GCs the lakehouse). Fails closed.
            - { name: COMPACTION_SECRETS_FROM_DAPR, value: "true" }
            {{- end }}
            - { name: COMPACTION_S3_BUCKET, value: {{ .Values.rustfs.bucket | quote }} }
            {{- /* The #50 policy registry root defaults to this bucket, matching the catalog's
                   LANCE_REST_ROOT (also .Values.rustfs.bucket, services.yaml). If LANCE_CONTROL_ROOT ever
                   moves the catalog's registry, set COMPACTION_POLICY_ROOT to the same value — a wrong root
                   lists cleanly as "no policies" (the sweep logs compaction_policies_loaded per tick). */}}
            {{- /* EVERY bucket that can hold Lance data must be swept, or its tables accumulate superseded
                   versions + small fragments FOREVER (audit 2026-07-14: the sweep saw exactly ONE bucket,
                   so the medallion zone buckets and every #3-B multi-base data bucket leaked storage
                   silently). Union of: the medallion storage zones (raw/gold live in their own buckets) and
                   the approved multi-base data bases. Per-warehouse (#3-A) buckets are provisioned at
                   RUNTIME, so they are appended by the operator as tenants are onboarded. */}}
            {{- $extra := list }}
            {{- range $ns, $bkt := .Values.medallion.buckets }}
            {{- if ne $bkt $.Values.rustfs.bucket }}{{ $extra = append $extra $bkt }}{{ end }}
            {{- end }}
            {{- range .Values.catalog.multibase.dataBases }}
            {{- $extra = append $extra (. | replace "s3://" "" | trimSuffix "/") }}
            {{- end }}
            - { name: COMPACTION_S3_EXTRA_BUCKETS, value: {{ $extra | uniq | join "," | quote }} }
            - { name: COMPACTION_S3_REGION, value: "us-east-1" }
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "compaction") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-compaction
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ $port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: compaction, app.kubernetes.io/instance: {{ .Release.Name }} }
{{- end }}
