{{- if and .Values.kueue.enabled .Values.kueue.queues.enabled }}
{{- /*
Default Kueue queue topology, applied by a post-install/post-upgrade hook.

Why a hook + retry instead of plain templated CRs: Kueue's ResourceFlavor and
ClusterQueue admission webhooks have failurePolicy=Fail, so creating those CRs
before the kueue-controller-manager's webhook endpoints are Ready fails the apply
(and would fail `helm install`). On a cold install the controller (a subchart) and
these CRs land in the same Helm pass, so we cannot rely on ordering. The hook Job
runs after the main resources and retries `kubectl apply` until the webhook accepts
it — making a clean `helm install` reproduce the queues with no manual step.

Idempotent (apply), self-cleaning (hook-succeeded), least-privilege RBAC scoped to
the three Kueue resource kinds.
*/}}
{{- $weightPre := "-5" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rask.fullname" . }}-kueue-setup
  labels: {{- include "rask.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ $weightPre | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rask.fullname" . }}-kueue-setup
  labels: {{- include "rask.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ $weightPre | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  {{- /* [[XC-065]] `rollout restart` PATCHES the Deployment's pod template and `rollout status` reads
       it plus the ReplicaSets it owns. Granted here, beside the container that uses them, because a
       control whose permission lives in another file is one nobody notices was never granted. */}}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["resourceflavors", "clusterqueues"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rask.fullname" . }}-kueue-setup
  labels: {{- include "rask.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ $weightPre | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rask.fullname" . }}-kueue-setup
subjects:
  - kind: ServiceAccount
    name: {{ include "rask.fullname" . }}-kueue-setup
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rask.fullname" . }}-kueue-queues
  labels: {{- include "rask.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ $weightPre | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  queues.yaml: |
    apiVersion: kueue.x-k8s.io/v1beta1
    kind: ResourceFlavor
    metadata:
      name: {{ .Values.kueue.queues.flavorName }}
    ---
    apiVersion: kueue.x-k8s.io/v1beta1
    kind: ClusterQueue
    metadata:
      name: {{ .Values.kueue.queues.clusterQueueName }}
    spec:
      namespaceSelector: {}
      resourceGroups:
        - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
          flavors:
            - name: {{ .Values.kueue.queues.flavorName }}
              resources:
                - name: "cpu"
                  nominalQuota: {{ .Values.kueue.queues.nominalQuota.cpu | quote }}
                - name: "memory"
                  nominalQuota: {{ .Values.kueue.queues.nominalQuota.memory | quote }}
                - name: "nvidia.com/gpu"
                  {{- /* Derived from the ONE GPU signal: the values comment demands this equal the
                       cluster's total schedulable nvidia.com/gpu ("never set it above the real GPU
                       count — Kueue would admit a pod that can't schedule"), and on a GPU-less estate
                       that total is 0. Hardcoding 1 there admits a GPU RayService that then sits
                       Pending forever, which reads as a Kueue bug rather than a missing GPU. */}}
                  nominalQuota: {{ if include "rask.gpuEnabled" . }}{{ index .Values.kueue.queues.nominalQuota "nvidia.com/gpu" | quote }}{{ else }}"0"{{ end }}
    ---
    apiVersion: kueue.x-k8s.io/v1beta1
    kind: LocalQueue
    metadata:
      name: {{ .Values.kueue.queues.localQueueName }}
      namespace: {{ .Release.Namespace }}
    spec:
      clusterQueue: {{ .Values.kueue.queues.clusterQueueName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rask.fullname" . }}-kueue-setup
  labels: {{- include "rask.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kueue-setup
    spec:
      serviceAccountName: {{ include "rask.fullname" . }}-kueue-setup
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      {{- /* THE CA MUST BE RE-PATCHED BEFORE THE APPLY, and retrying cannot do it ([[XC-065]]).
           kueue's controller writes its self-signed CA into the CRDs' conversion `caBundle` when it
           BOOTS; this upgrade re-applies those CRDs from the subchart and overwrites the patch, so the
           API server then holds a CA that does not match the certificate the webhook serves. Measured
           live 2026-09-21: the apply below crash-looped nine times over 21 minutes on `x509:
           certificate signed by unknown authority ... "kueue-ca"` and the release was recorded failed.
           A restart re-runs the patch — observed to recover in 68 seconds — and doing it as an INIT
           container is what orders it, so the queues apply against a webhook the API server trusts
           rather than racing it. */}}
      initContainers:
        - name: restart-kueue-controller
          image: {{ .Values.kueue.queues.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          args:
            - rollout
            - restart
            - deployment/{{ .Release.Name }}-kueue-controller-manager
            - -n
            - {{ .Release.Namespace }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: await-kueue-controller
          image: {{ .Values.kueue.queues.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          {{- /* A restart nobody waits on is a race the apply loses: it would meet the OLD webhook.
               The timeout is generous because the wait is cheap and a premature give-up reintroduces
               exactly the failure above; the observed recovery was 68s. */}}
          args:
            - rollout
            - status
            - deployment/{{ .Release.Name }}-kueue-controller-manager
            - -n
            - {{ .Release.Namespace }}
            - --timeout=180s
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
          # The kubectl image is distroless (no shell), so run kubectl directly.
          # If the Kueue admission webhook (failurePolicy=Fail) isn't ready yet the
          # apply exits non-zero and the Job's restartPolicy + backoffLimit retry it
          # — that's the retry loop, no shell needed. HOME=/tmp + an emptyDir give
          # kubectl a writable discovery cache under a read-only root filesystem.
        - name: apply-queues
          image: {{ .Values.kueue.queues.kubectlImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          args:
            - apply
            - --server-side
            - --force-conflicts
            - -f
            - /manifests/queues.yaml
          volumeMounts:
            - name: manifests
              mountPath: /manifests
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: manifests
          configMap:
            name: {{ include "rask.fullname" . }}-kueue-queues
        - name: tmp
          emptyDir: {}
{{- end }}
