{{- if .Values.medallion.enabled }}
{{- $root := . }}
{{- $port := .Values.medallion.port }}
{{- $img := include "lance.catalogImage" . }}
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# medallion-producer — the dummy producer / HEAD of the medallion pipeline (R23: bronze is the FIRST governed
# tier; raw is the external world). POST /produce emits ONLY the bronze$events OpenLineage event;
# medallion-producer's OWN /bronze-arrival subscription reacts to that event and publishes the first trigger
# (medallion.bronze) the bronze→silver mover consumes — the event-driven head (B2), not a direct publish.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-medallion-producer
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: {{ (hasKey .Values.medallion "producerReplicas") | ternary .Values.medallion.producerReplicas 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: medallion-producer, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: medallion-producer
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
      {{- if .Values.dapr.sidecars }}
      annotations:
        {{- include "rask.daprAnnotations" (list $root .Values.medallion.producer.daprAppId $port) | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-medallion-producer
      {{- end }}
      containers:
        - name: medallion-producer
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          {{- if include "lance.otelEnabled" $root }}
          command: ["opentelemetry-instrument", "uvicorn"]
          {{- else }}
          command: ["uvicorn"]
          {{- end }}
          args:
            - "medallion.producer:app"
            - "--host=0.0.0.0"
            - "--port={{ $port }}"
          ports: [{ name: http, containerPort: {{ $port }} }]
          env:
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root .Values.medallion.producer.daprAppId) | nindent 12 }}
            {{- end }}
            {{- include "lance.lineageEmitEnv" (list $root) | nindent 12 }}
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            # Fail-closed at boot if behind a sidecar but the app-token is unset — /bronze-arrival would
            # otherwise be an open forged-trigger path (symmetric with the movers).
            - { name: MEDALLION_DAPR_ENABLED, value: {{ .Values.dapr.sidecars | quote }} }
            - name: APP_API_TOKEN  # verify the Dapr-stamped header on /bronze-arrival (forged-trigger guard)
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-dapr-app-token, key: token }
            # medallion-producer's OWN subscriber component (queueGroupName=medallion-producer, deliverPolicy=new) — it
            # subscribes on /bronze-arrival AND publishes through the same handle (same NATS subjects).
            - { name: MEDALLION_PUBSUB, value: {{ include "lance.subPubsub" (list $root .Values.medallion.producer.daprAppId) | quote }} }
            - { name: MEDALLION_LINEAGE_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- if .Values.services.lineage.outbox.enabled }}
            - { name: MEDALLION_LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.rustfs.bucket }}/_lineage_outbox" }
            {{- end }}
            - { name: MEDALLION_BRONZE_DATASET, value: {{ .Values.medallion.producer.bronzeDataset | quote }} }
            # The IIIF page lane's bronze dataset name (P7a, re-tiered by R23) — a values knob beside
            # bronzeDataset; /bronze-arrival fires the cascade for either name.
            - { name: MEDALLION_BRONZE_NAMESPACE, value: {{ .Values.medallion.producer.bronzeNamespace | quote }} }
            - { name: MEDALLION_PRODUCER_OPERATION, value: {{ .Values.medallion.producer.operation | quote }} }
            - { name: MEDALLION_PRODUCER_AUTHOR, value: {{ .Values.medallion.producer.author | quote }} }
            - { name: MEDALLION_BRONZE_TOPIC, value: {{ .Values.medallion.producer.bronzeTopic | quote }} }
            {{- if .Values.catalog.controlEmit }}
            # § D2 B8 — the publication head. Set ONLY when the catalog is actually emitting control
            # events, because an empty value disables the subscription: a deployment without the
            # emitter must register no route rather than subscribe to a topic nothing publishes on.
            - { name: MEDALLION_CONTROL_PUBSUB, value: "{{ required "pubsub.controlName must be set when catalog.controlEmit is on — an empty value silently disables the medallion publication head" .Values.pubsub.controlName }}-{{ .Values.medallion.producer.daprAppId }}" }
            {{- end }}
            {{- $transformsDeclared := false }}
            {{- range .Values.medallion.movers }}{{- if .transform }}{{- $transformsDeclared = true }}{{- end }}{{- end }}
            {{- if or .Values.medallion.projectsEnabled $transformsDeclared }}
            # #84 per-tenant routing (opt-in): the catalog's warehouse-registry root. A `project`-carrying
            # /produce resolves that project's ACTIVE warehouse and seeds <root>/medallion/bronze there;
            # project-less requests keep the shared URIs below byte-identically.
            #
            # ALSO required whenever ANY mover declares a `lane`, which is why `$transformsDeclared` widens the
            # condition. The cascade HEAD consults declarations to decide whether an unrecognised table is
            # a lane's entry point (`ingest_trigger.py::_has_declared_lane` -> `list_specs`), and that read
            # goes through this root. Gated on `projectsEnabled` alone, the head could not see a single
            # declaration, so a declared lane's table arrived and published nothing — the whole record was
            # unreachable from the deployed chart.
            - { name: MEDALLION_CONTROL_ROOT, value: "s3://{{ .Values.rustfs.bucket }}" }
            {{- end }}
            # Ray TRAIN head (#115): values-wired passthrough (docs/RAY-TRAIN.md; defaults mirror
            # core/config.py). lineageUrl defaults to the release's own lineage service.
            - { name: MEDALLION_TRAIN_TOPIC, value: {{ .Values.medallion.train.topic | quote }} }
            - { name: MEDALLION_TRAIN_ENTRYPOINT, value: {{ .Values.medallion.train.entrypoint | quote }} }
            - { name: MEDALLION_TRAINER_IDENTITY, value: {{ .Values.medallion.train.trainerIdentity | quote }} }
            - { name: MEDALLION_MODELS_NAMESPACE, value: {{ .Values.medallion.train.modelsNamespace | quote }} }
            - { name: MEDALLION_TRAIN_LINEAGE_URL, value: {{ .Values.medallion.train.lineageUrl | default (printf "http://%s-lineage:%v" (include "lance.fullname" .) .Values.services.lineage.port) | quote }} }
            {{- if .Values.medallion.ray }}
            # The producer app ALSO needs the Ray Jobs seam when ray is on: the TRAIN head (#115) gates on
            # ray_enabled and submits training jobs to the same cluster the movers use for stage jobs.
            # Found live 2026-07-13: this flag was wired only in the movers loop below, so /train could
            # never be configured through the chart (409 "train head not configured" on every POST).
            - { name: MEDALLION_RAY_ENABLED, value: "true" }
            - { name: MEDALLION_RAY_ADDRESS, value: {{ .Values.medallion.rayAddress | default (printf "http://%s-ray-head-svc:8265" (include "rask.fullname" .)) | quote }} }
            {{- end }}
            {{- if or .Values.medallion.fgaEnabled .Values.auth.enabled }}
            # Rendered under fgaEnabled OR auth.enabled: the #64 human door below NEEDS the FGA client
            # (can_administer) — auth-on without these envs left the client on its unreachable default URL,
            # 503-fail-closing every human trigger (found by the fresh-redeploy drive 2026-07-24; the
            # long-lived release had accumulated fgaEnabled=true via --reuse-values, masking it).
            # SECURITY (found live 2026-07-13): the FGA envs were rendered ONLY inside the movers range,
            # but this app also hosts the TRAINING consumer (#115 D5) — so `handle_train_trigger` got
            # `fga_client=None` and its can_read_data/can_create_table gate silently no-op'd: a revoked
            # trainer still trained (deny-test submitted a Ray job on a DENIED grant). The trainer has its
            # OWN identity + rung (reader on the feature namespaces, writer on models ONLY): the consumer
            # checks as `settings.trainer_identity` (MEDALLION_TRAINER_IDENTITY, set above), so the movers'
            # SERVICE_IDENTITY/REQUIRED_ACTION pair is deliberately NOT rendered here — it is theirs, and a
            # copy on this app would only mislead. These two envs are all the gate needs to come alive.
            - { name: MEDALLION_FGA_ENABLED, value: "true" }
            - { name: MEDALLION_FGA_API_URL, value: {{ .Values.medallion.fgaApiUrl | quote }} }
            {{- with .Values.auth.fgaStoreId }}
            # Operator-pinned FGA store id — the same auth.fgaStoreId every consumer + the bootstrap-admin
            # Job use (see the catalog twin, services.yaml). Unset = provision-by-name at boot.
            - { name: MEDALLION_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.auth.fgaModelId }}
            - { name: MEDALLION_FGA_MODEL_ID, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            # #64 human trigger door: a signed-in project admin (OIDC bearer + can_administer) may fire
            # /produce or /train WITHOUT the service token. The web BFF forwards the user's bearer here; the
            # service-to-service app-token path (APP_API_TOKEN, above) is unchanged. Same OIDC construction
            # shape as catalog/lineage; the admin gate resolves against project:<produceAdminProject>.
            {{- include "lance.governedOidcEnv" (list . "MEDALLION") | nindent 12 }}
            - { name: MEDALLION_PRODUCE_ADMIN_PROJECT, value: {{ .Values.medallion.produceAdminProject | quote }} }
            {{- end }}
            {{- if .Values.dapr.resiliency.enabled }}
            # Dapr-native DLQ (ships with the Resiliency CRD): the producer's bronze-arrival + train
            # subscriptions park exhausted deliveries here, ERROR-logged by /dlq-event.
            - { name: MEDALLION_DLQ_TOPIC, value: "dlq.medallion-producer" }
            {{- end }}
            {{- /* SOURCE NAMESPACE -> the topic whose mover consumes it. DERIVED from the declared
                   DAG, so a mover cannot exist that the publication head is unable to route — which
                   is what it did before: it stamped the bronze namespace and topic on every trigger,
                   so a silver publication fired a bronze trigger no mover matched and was dropped.

                   Keyed on the namespace, not the tier: lanes are named (`bronze-media`), and
                   reducing one to its tier merges two cascades onto a topic neither owns. */}}
            {{- $routes := dict }}
            {{- range .Values.medallion.movers }}
              {{- if and .fromNamespace .subTopic }}
                {{- $_ := set $routes .fromNamespace .subTopic }}
              {{- end }}
            {{- end }}
            - { name: MEDALLION_TRANSFORM_ROUTES, value: {{ toJson $routes | quote }} }
            {{- if .Values.medallion.cascadeViaPublish }}
            - { name: MEDALLION_CASCADE_VIA_PUBLISH, value: "true" }
            {{- /* The producer needs the catalog for the PROMOTION RESUME, not for a stage of its
                   own: an approved hold publishes the version it was taken on, which is a call to
                   this door. Without these the settings guard refuses at boot — which it did, and
                   correctly, when the flag was rendered here without them. */}}
            - { name: MEDALLION_CATALOG_URL, value: {{ printf "http://%s-catalog:%v" (include "lance.fullname" .) .Values.services.catalog.port | quote }} }
            - { name: MEDALLION_CATALOG_ROOT, value: {{ printf "s3://%s" .Values.rustfs.bucket | quote }} }
            - { name: MEDALLION_CATALOG_SERVICE_IDENTITY, value: {{ .Values.medallion.producer.serviceIdentity | quote }} }
            {{- end }}
            {{- if .Values.medallion.qualityReview }}
            # S3/S4 — this app HOSTS `promotion_review` and serves the door that answers it. The
            # movers hold promotions; only this app-id can raise the decision event into the instance,
            # and only this app has a gateway row. The flag is what starts the workflow runtime here.
            - { name: MEDALLION_QUALITY_REVIEW_ENABLED, value: "true" }
            - { name: MEDALLION_QUALITY_REVIEW_HOURS, value: {{ .Values.medallion.qualityReviewHours | quote }} }
            - { name: MEDALLION_QUALITY_REVIEW_APPROVER, value: {{ .Values.medallion.qualityReviewApprover | quote }} }
            - { name: MEDALLION_PROMOTION_TOPIC, value: {{ .Values.medallion.promotionTopic | quote }} }
            {{- end }}
            {{- if .Values.medallion.compute }}
            # Real fake-Ray compute: the producer seeds the BRONZE Lance dataset directly (R23 — so the
            # cascade writes actual versioned data on RustFS). The URI derives from the bronze namespace,
            # exactly where the bronze→silver mover's FROM_URI points. S3 secret follows the catalog's
            # two-tier rule (plaintext only when OpenBao is off — compute + OpenBao is not a shipped combo).
            - { name: MEDALLION_COMPUTE_ENABLED, value: "true" }
            - { name: MEDALLION_BRONZE_URI, value: "s3://{{ include "lance.stageBucket" (list . .Values.medallion.producer.bronzeNamespace) }}/medallion/{{ .Values.medallion.producer.bronzeNamespace }}" }
            # The medallion (project) bucket base — where bronze/silver + the model registry live. The
            # trainer resolves feature + model URIs from HERE (via silver's zone), so it stays in the project
            # bucket even when gold (sink) is zoned out. `silver` is unmapped by default →
            # rustfs.bucket, so this is s3://<project-bucket>/medallion, unchanged on the single-bucket path.
            - { name: MEDALLION_STAGE_BASE_URI, value: "s3://{{ include "lance.stageBucket" (list . "silver") }}/medallion" }
            # The media ingest head (multimodal §9): /ingest-media seeds/reads the source prefix in the
            # lake bucket (demo stand-in for an external media store), lands bronze-media blobs at the
            # namespace-derived URI (MUST match the media mover's fromNamespace-derived FROM_URI), and
            # triggers the media lane. Dataset/namespace/topic/prefix use the code defaults.
            - { name: MEDALLION_MEDIA_SOURCE_BUCKET, value: {{ .Values.rustfs.bucket | quote }} }
            # hasKey+ternary (the LANCE_AUDIT_ENABLED convention, services.yaml): a key missing under
            # --reuse-values (a stored release predating §9) must render the default, not "" (pydantic
            # bool_parsing boot crash on this producer).
            - { name: MEDALLION_MEDIA_SEED_SAMPLES, value: {{ hasKey .Values.medallion "mediaSeedSamples" | ternary .Values.medallion.mediaSeedSamples true | quote }} }
            - { name: MEDALLION_MEDIA_BRONZE_URI, value: "s3://{{ include "lance.stageBucket" (list . "bronze-media") }}/medallion/bronze-media" }
            # The IIIF page head (P7a): /ingest-iiif lands the BRONZE page-image blob dataset beside the
            # events lane's bronze URI (same namespace root, its own dataset directory).
            # Which IIIF Image API the head harvests from. WIRED, not left to the code default: that
            # default is RA-INTERNAL and resolves only inside the archives' network, so every deploy
            # elsewhere needed a `kubectl set env` to ingest a single page (live-proof 2026-07-28,
            # defect 1). One knob feeds both harvest paths — the in-process httpx client AND the
            {{- /* `| default` on both, for the same `--reuse-values` reason the `encoders` block above
                 documents: these are NEW keys, and a stored release whose user values carry
                 `medallion: {compute: true}` leaves `medallion.producer` sub-keys nil. The fallbacks are
                 the code defaults (services/medallion/core/config.py), so an un-migrated release renders
                 exactly what it ran before rather than an empty base URL. */}}
            # The IIIF Image API derivative path appended per page. Travels with baseUrl: a different
            # server may not serve `full/max` (some cap at `full/2000,`), and a wrong derivative is a
            # per-page 404 rather than a boot failure.
            - { name: MEDALLION_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }
            - { name: MEDALLION_S3_ACCESS_KEY_ID, value: {{ .Values.rustfs.accessKey | quote }} }
            {{- if not (include "lance.secretsViaDapr" .) }}
            - { name: MEDALLION_S3_SECRET_ACCESS_KEY, value: {{ .Values.rustfs.secretKey | quote }} }
            {{- else }}
            # A secret store is configured → the S3 secret comes ONLY from it at boot; not in pod env
            # (Batch 7 closes the gap: the env was already omitted here but nothing told the service to
            # consume the store — a store-on deployment left medallion credential-less). Fails closed.
            - { name: MEDALLION_SECRETS_FROM_DAPR, value: "true" }
            {{- end }}
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "medallion-producer") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-medallion-producer
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ $port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: medallion-producer, app.kubernetes.io/instance: {{ .Release.Name }} }
{{- range .Values.medallion.movers }}
---
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# mover {{ .name }} ({{ .fromNamespace }} → {{ .toNamespace }}) — subscribes {{ .subTopic }}, emits the
# transform's lineage{{ if .pubTopic }}, then triggers {{ .pubTopic }}{{ else }} (terminal — no downstream){{ end }}.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" $root }}-{{ .name }}
  labels: {{- include "lance.labels" $root | nindent 4 }}
spec:
  replicas: {{ (hasKey $root.Values.medallion "moverReplicas") | ternary $root.Values.medallion.moverReplicas 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: {{ .name }}, app.kubernetes.io/instance: {{ $root.Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
      {{- if $root.Values.dapr.sidecars }}
      annotations:
        {{- include "rask.daprAnnotations" (list $root .daprAppId $port) | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if $root.Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" $root }}-sa-{{ .name }}
      {{- end }}
      containers:
        - name: mover
          image: {{ $img | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- include "lance.securityContext" $root | nindent 10 }}
          {{- include "lance.preStop" $root | nindent 10 }}
          {{- if include "lance.otelEnabled" $root }}
          command: ["opentelemetry-instrument", "uvicorn"]
          {{- else }}
          command: ["uvicorn"]
          {{- end }}
          args:
            - "medallion.mover:app"
            - "--host=0.0.0.0"
            - "--port={{ $port }}"
          ports: [{ name: http, containerPort: {{ $port }} }]
          env:
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root .daprAppId) | nindent 12 }}
            {{- end }}
            {{- include "lance.lineageEmitEnv" (list $root) | nindent 12 }}
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ $root.Values.dapr.apiTimeoutSeconds | quote }} }
            # Fail-closed at boot if behind a sidecar but the app-token is unset (open forged-trigger path).
            - { name: MEDALLION_DAPR_ENABLED, value: {{ $root.Values.dapr.sidecars | quote }} }
            # This mover's OWN subscriber component (queueGroupName=<app-id>, deliverPolicy=new) — it
            # subscribes to its stage trigger AND publishes lineage + the next trigger through it.
            - { name: MEDALLION_PUBSUB, value: {{ include "lance.subPubsub" (list $root .daprAppId) | quote }} }
            - { name: MEDALLION_LINEAGE_TOPIC, value: {{ $root.Values.pubsub.topic | quote }} }
            {{- if $root.Values.services.lineage.outbox.enabled }}
            - { name: MEDALLION_LINEAGE_OUTBOX_URI, value: "s3://{{ $root.Values.rustfs.bucket }}/_lineage_outbox" }
            {{- end }}
            - name: APP_API_TOKEN  # verify the Dapr-stamped header on /medallion-event (forged-trigger guard)
              valueFrom:
                secretKeyRef: { name: {{ $root.Release.Name }}-dapr-app-token, key: token }
            - { name: MEDALLION_FROM_NAMESPACE, value: {{ .fromNamespace | quote }} }
            - { name: MEDALLION_FROM_DATASET, value: {{ .fromDataset | quote }} }
            - { name: MEDALLION_TO_NAMESPACE, value: {{ .toNamespace | quote }} }
            - { name: MEDALLION_TO_DATASET, value: {{ .toDataset | quote }} }
            - { name: MEDALLION_OPERATION, value: {{ .operation | quote }} }
            - { name: MEDALLION_AUTHOR, value: {{ .author | quote }} }
            - { name: MEDALLION_SUB_TOPIC, value: {{ .subTopic | quote }} }
            - { name: MEDALLION_PUB_TOPIC, value: {{ .pubTopic | quote }} }
            {{- if .transform }}
            # WHICH DECLARED LANE this mover runs. OPT-IN per row, and deliberately absent by default:
            # `core/config.py` documents that an estate which has declared nothing must behave
            # byte-for-byte as before, and that a named-but-UNDECLARED lane is a REFUSAL rather than a
            # fallback to the env below. Defaulting this to `.name` would therefore break every mover
            # the moment the chart shipped.
            #
            # Set it, and `entrypoint`/`params`/`code_version` come from the catalog's admin-gated,
            # audited record instead of this Deployment — so WHAT a lane runs changes through the door
            # with no helm upgrade. The binding of a POD to an EDGE stays deploy-time, which is the same
            # place every orchestrator binds a code location; only the program is runtime-governed.
            #
            # Until 2026-08-24 this variable was rendered by NO template, so `settings.transform` was always
            # "" in-cluster, every mover took the env branch, and `/compute/lanes` wrote records that
            # nothing read. The door was live and its property was not obtained.
            - { name: MEDALLION_TRANSFORM, value: {{ .transform | quote }} }
            {{- end }}
            {{- if or $root.Values.medallion.projectsEnabled .transform }}
            # #84 per-tenant routing (opt-in): a `project`-carrying stage trigger resolves this stage's
            # from/to URIs off the warehouse registry (<project-root>/medallion/<namespace>) instead of
            # the env URIs below; project-less triggers keep them byte-identically. Without this env a
            # project trigger is DROPPED fail-closed.
            #
            # A lane-bound mover needs it for a second reason: `services/lane.py` reads the declaration
            # straight off this root (never through a catalog client), so without it resolution raises
            # UndeclaredLaneError naming an empty control root.
            - { name: MEDALLION_CONTROL_ROOT, value: "s3://{{ $root.Values.rustfs.bucket }}" }
            {{- if and $root.Values.medallion.goldWarehouse (eq .toNamespace "gold") }}
            # Gold SERVING warehouse (docs/DECISIONS.md "Medallion tiers"): ONLY the terminal silver→gold
            # mover retargets — its tenant target root becomes the project's serving=="gold" registry
            # record when one exists; absent → work-warehouse behavior, byte-identical.
            - { name: MEDALLION_GOLD_WAREHOUSE_ENABLED, value: "true" }
            {{- end }}
            {{- end }}
            {{- if $root.Values.dapr.resiliency.enabled }}
            # Dapr-native DLQ (ships with the Resiliency CRD — see values.yaml dapr.resiliency): retry
            # exhaustion parks the trigger on this per-app topic, ERROR-logged by /dlq-event.
            # Keyed by the mover's APP-ID, not its subTopic: two movers can share one subTopic, and a
            # per-subTopic name had both declaring AND
            # subscribing the same DLQ — every dead letter delivered to both, parked and counted twice,
            # attributed to neither. The producer's dlq.medallion-producer is the precedent.
            - { name: MEDALLION_DLQ_TOPIC, value: "dlq.{{ .daprAppId }}" }
            {{- end }}
            {{- if .requiredColumns }}
            # Declared consumer dependencies (data-contract gap #1): the quality gate blocks a
            # promotion whose written schema dropped/renamed any of these (the breaking-change detector).
            - { name: MEDALLION_REQUIRED_COLUMNS, value: {{ .requiredColumns | quote }} }
            {{- end }}
            {{- if $root.Values.medallion.compute }}
            # Real fake-Ray compute: read the upstream stage's Lance dataset, transform, write the downstream
            # one — so the emitted lineage carries the REAL version + rows/bytes and the cascade produces
            # actual data. FROM/TO URIs derive from the stage namespaces, so the chain lines up. S3 secret
            # follows the catalog's two-tier rule (plaintext only when OpenBao is off).
            - { name: MEDALLION_COMPUTE_ENABLED, value: "true" }
            - { name: MEDALLION_FROM_URI, value: "s3://{{ include "lance.stageBucket" (list $root .fromNamespace) }}/medallion/{{ .fromNamespace }}" }
            - { name: MEDALLION_TO_URI, value: "s3://{{ include "lance.stageBucket" (list $root .toNamespace) }}/medallion/{{ .toNamespace }}" }
            - { name: MEDALLION_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" $root }}" }
            - { name: MEDALLION_S3_ACCESS_KEY_ID, value: {{ $root.Values.rustfs.accessKey | quote }} }
            {{- if not (include "lance.secretsViaDapr" $root) }}
            - { name: MEDALLION_S3_SECRET_ACCESS_KEY, value: {{ $root.Values.rustfs.secretKey | quote }} }
            {{- else }}
            # Store-on → sole source at boot (see the producer block above). Fails closed.
            - { name: MEDALLION_SECRETS_FROM_DAPR, value: "true" }
            {{- end }}
            {{- if $root.Values.medallion.ray }}
            # Event-driven real-Ray: the mover submits its stage transform as a `ray job submit` to the
            # ray-lance cluster (Ray Jobs REST API, httpx-only) IN RESPONSE TO its Dapr trigger, instead of
            # the in-process write. Requires medallion.compute (from/to URIs + S3 creds) + a running Ray
            # cluster (deploy/ray-lance-demo.yaml). Default off — fake-Ray in-process stays the default path.
            - { name: MEDALLION_RAY_ENABLED, value: "true" }
            - { name: MEDALLION_RAY_ADDRESS, value: {{ $root.Values.medallion.rayAddress | default (printf "http://%s-ray-head-svc:8265" (include "rask.fullname" $root)) | quote }} }
            {{- if .stageJob }}
            # P7b seam: this mover's stage-job entrypoint (movers[].stageJob) — how the HTR lanes select
            # the layout/lines + transcribe jobs on the unified cluster; unset = ray_stage_job.py default.
            - { name: MEDALLION_RAY_ENTRYPOINT, value: {{ .stageJob | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
            # WHERE THIS MOVER REGISTERS ITS OUTPUT — on EVERY mover, not just the HTR lane.
            #
            # These two used to sit behind a per-workload conditional, so only ONE lane could reach
            # the catalog and every other mover wrote bytes the catalog never heard of: no table
            # record, therefore no FGA object, therefore no grant, retention policy or
            # deletion-protection could ever name them. Measured on the live estate 2026-08-17,
            # `describe gold$catalog` answered 403 — not permission denied, but no such object.
            #
            # Worse, that conditional was itself unset, so NO mover had it — not even the lane the
            # gate was written for. Governance belongs to the cascade, so the catalog's address does
            # too: unconditional, on every mover.
            # B3 — WHICH BUILD submits. Re-attach is only correct while the program is the same one:
            # during a rolling deploy a redelivered trigger landing on the NEW pod re-attached to a job
            # the OLD pod submitted (old entrypoint, old runtime_env, old transform) and reported
            # success, so the run carried the new build's provenance over the old build's output.
            # Sourced from the image this pod actually runs, so it cannot drift from the code.
            - { name: MEDALLION_RAY_CODE_VERSION, value: {{ include "lance.catalogImage" $root | quote }} }
            {{- /* The subject this mover claims at the catalog's SERVICE door. A NAME, not a secret,
                   so it is plain env — the credential is APP_API_TOKEN, which daprd injects from a
                   managed secret above. Rendered unconditionally and NOT beside
                   MEDALLION_FGA_SERVICE_IDENTITY, which is gated on fgaEnabled: authentication and
                   authorization are different questions, and coupling them leaves a governed estate
                   with FGA off unable to authenticate at all. Same value, so the two cannot drift. */}}
            - { name: MEDALLION_CATALOG_SERVICE_IDENTITY, value: {{ .serviceIdentity | quote }} }
            - { name: MEDALLION_CATALOG_URL, value: {{ printf "http://%s-catalog:%v" (include "lance.fullname" $root) $root.Values.services.catalog.port | quote }} }
            - { name: MEDALLION_CATALOG_ROOT, value: {{ printf "s3://%s" $root.Values.rustfs.bucket | quote }} }
            {{- if $root.Values.medallion.cascadeViaPublish }}
            # The catalog gates now. `MEDALLION_QUALITY_*` below is deliberately still rendered when
            # `quality` is on — the mover SKIPS its local gate under this flag rather than the chart
            # withholding the config, so flipping the flag back restores the old behaviour with no
            # values change and no redeploy of a different shape.
            - { name: MEDALLION_CASCADE_VIA_PUBLISH, value: "true" }
            {{- end }}
            {{- if $root.Values.medallion.quality }}
            # Validator gate: after the compute write, assert the stage's data is good enough to promote
            # (row_count > 0, key column non-null); a failure emits the dataQualityAssertions facet but does
            # NOT trigger the next stage. Needs medallion.compute on (it opens the just-written dataset).
            - { name: MEDALLION_QUALITY_ENABLED, value: "true" }
            - { name: MEDALLION_QUALITY_KEY_COLUMN, value: {{ $root.Values.medallion.qualityKeyColumn | quote }} }
            {{- if $root.Values.medallion.qualityReview }}
            # A hold becomes a QUESTION rather than a verdict. This mover publishes what its gate saw
            # and stops; the producer's `promotion_review` splits corrupt (BLOCK) from unusual (ask).
            # The approver + deadline ride the published spec, so they are read HERE at dispatch — a
            # workflow body that read them would replay against whatever the value is now.
            - { name: MEDALLION_QUALITY_REVIEW_ENABLED, value: "true" }
            - { name: MEDALLION_QUALITY_REVIEW_HOURS, value: {{ $root.Values.medallion.qualityReviewHours | quote }} }
            - { name: MEDALLION_QUALITY_REVIEW_APPROVER, value: {{ $root.Values.medallion.qualityReviewApprover | quote }} }
            # The band is read HERE, by the mover, for the same reason the approver is: the mover
            # decides at DISPATCH whether this promotion is unusual. The producer never sees it.
            - { name: MEDALLION_PROMOTION_REVIEW_BAND, value: {{ $root.Values.medallion.promotionReviewBand | quote }} }
            - { name: MEDALLION_PROMOTION_TOPIC, value: {{ $root.Values.medallion.promotionTopic | quote }} }
            {{- end }}
            {{- end }}
            {{- if $root.Values.medallion.fgaEnabled }}
            - { name: MEDALLION_FGA_ENABLED, value: "true" }
            - { name: MEDALLION_FGA_API_URL, value: {{ $root.Values.medallion.fgaApiUrl | quote }} }
            {{- with $root.Values.auth.fgaStoreId }}
            # Operator-pinned FGA store id — one auth.fgaStoreId across every consumer (see services.yaml).
            - { name: MEDALLION_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with $root.Values.auth.fgaModelId }}
            - { name: MEDALLION_FGA_MODEL_ID, value: {{ . | quote }} }
            {{- end }}
            - { name: MEDALLION_FGA_SERVICE_IDENTITY, value: {{ .serviceIdentity | quote }} }
            - { name: MEDALLION_FGA_REQUIRED_ACTION, value: {{ .requiredAction | quote }} }
            {{- end }}
          {{- include "lance.appProbes" $root | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" $root "comp" .name) | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" $root | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" $root | nindent 8 }}
{{- end }}
{{- end }}
