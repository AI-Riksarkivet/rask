
{{- if and .Values.auth.enabled .Values.frontend.enabled (not .Values.frontend.oidc.enabled) (not .Values.auth.allowHeadless) }}
{{- fail (printf "HALF-GOVERNED DEPLOY REFUSED: auth.enabled=true (the backend requires a verified identity) but frontend.oidc.enabled=false (the UI ships no sign-in flow). This install would come up green and then show every user a governed UI with no way to sign in, while the catalog 401s each read — a configuration fault that looks like a data fault. Fix it one of three ways: (1) --set frontend.oidc.enabled=true plus frontend.oidc.{publicIssuer,publicOrigin}; (2) --set auth.enabled=false for an ungoverned dev stack; or (3) --set auth.allowHeadless=true if this estate is deliberately API-only and no human uses the browser.") }}
{{- end }}
