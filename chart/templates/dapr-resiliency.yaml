{{- if and .Values.dapr.enabled .Values.dapr.resiliency.enabled }}
# Dapr Resiliency (opt-in, ships TOGETHER with the deadLetterTopic subscriptions + the crash-recovery
# broker backOff — see values.yaml dapr.resiliency): the SIDECAR owns pub/sub delivery retries, so a
# delivery that exhausts this schedule is published to the subscription's dead-letter topic (visible,
# ERROR-logged parking) instead of silently ceasing to redeliver after the broker's maxDeliver.
# Schedule: constant 90s x 5 retries = 450s (~7.5 min) — under the component's 720s crash-recovery
# ack window so broker redelivery never races these retries.
#
# WHY CONSTANT AND NOT EXPONENTIAL — the M4 correction, 2026-08-03. Two earlier attempts both failed,
# in OPPOSITE directions, and the second one never reached a cluster at all:
#
#   1. `policy: exponential` with `duration: 30s`. Dapr reads `duration` ONLY under PolicyConstant
#      (dapr/kit retry.go: Duration drives NewConstantBackOff; InitialInterval/Multiplier/MaxInterval/
#      RandomizationFactor drive NewExponentialBackOff), so the duration was ignored, `initialInterval`
#      fell back to its 500ms default, and the real schedule was 0.5 + 0.75 + 1.125 + 1.7 ~= 4 SECONDS.
#      Because the sidecar DLTs and ACKs the original on exhaustion, the 720s broker ackWait never
#      applies to an app-returned RETRY — so resiliency being ON (the default) SHORTENED the
#      app-failure retry window ~125x versus OFF. The whole point of this CRD was inverted.
#
#   2. The 2026-07-28 fix swapped in `initialInterval`/`multiplier`/`randomizationFactor` to match the
#      exponential policy. Correct against dapr/kit — and REJECTED BY THE CRD. Those three fields do
#      not exist in `resiliencies.dapr.io`: not in the vendored dapr-1.18.1 chart's
#      crds/resiliency.yaml (which carries only duration/maxInterval/maxRetries), not in the live
#      cluster CRD (which accepts duration, matching, maxInterval, maxRetries, policy and the
#      status-code matchers), and not in the Go type `Retry` itself. `kubectl apply --dry-run=server`
#      answers: strict decoding error: unknown field "initialInterval", "multiplier",
#      "randomizationFactor". So that fix never applied ONCE — the deployed object still carries
#      `duration: 30s` under `policy: exponential`, i.e. it is still living the ~4s window from (1).
#      CI stayed green the whole time because the gate proves the RENDER, never an apply.
#
# An exponential policy with a non-default initial interval is therefore UNEXPRESSIBLE in this CRD,
# and no Dapr version fixes that (the fields are absent from the Go type, not merely from the
# generated schema). Constant is the only policy whose interval field the CRD actually exposes — and
# it is deterministic by construction, which is what `randomizationFactor: 0` was reaching for anyway.
# `maxInterval` is dropped with it: exponential-only, and dead config here.
#
# The arithmetic, so the next edit can check itself: 90 x 5 = 450s = 7.5 min, over 5 retries
# (6 attempts). No jitter, so 450s is both the typical and the worst case — 270s of margin under the
# 720s broker window, where the old jittered exponential would have left 45s. That margin is the
# invariant: the broker must not redeliver while the sidecar is still retrying.
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: {{ .Release.Name }}-pubsub-resiliency
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  policies:
    retries:
      pubsubDeliveryRetry:
        policy: constant
        duration: 90s
        maxRetries: 5
  targets:
    components:
{{- $subscribers := list (dict "appId" .Values.services.lineage.daprAppId) }}
{{- if .Values.medallion.enabled }}
{{- $subscribers = append $subscribers (dict "appId" .Values.medallion.producer.daprAppId) }}
{{- range .Values.medallion.movers }}
{{- $subscribers = append $subscribers (dict "appId" .daprAppId) }}
{{- end }}
{{- end }}
{{- range $subscribers }}
      {{ include "lance.subPubsub" (list $ .appId) }}:
        inbound:
          retry: pubsubDeliveryRetry
{{- end }}
scopes:
{{- range $subscribers }}
  - {{ .appId }}
{{- end }}
---
# Service-invocation resiliency (the DAPRIFY mesh, 2026-07-27): with dapr.sidecars every /api/* request
# leaves the gateway through its own daprd (RASK_DAPR_ENABLED → localhost:3500/v1.0/invoke/<app-id>/method),
# and Dapr applies invocation resiliency on the CALLING sidecar — so this policy is scoped to the gateway
# and targets every app-id the gateway routes to (services/gateway _routes()). Deliberately modest, no
# invented aggression: 3 constant-backoff retries (connect-level blips), an end-to-end timeout of 300s
# matching the gateway's own httpx client (httpx.Timeout(30.0, read=300.0) in services/gateway — a shorter
# Dapr timeout would cut long reads the gateway itself still waits for), and a circuit breaker that sheds
# a persistently dead upstream for 30s (the gateway's connect timeout) after 5 consecutive failures
# instead of stacking doomed retries onto it.
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: {{ .Release.Name }}-invocation-resiliency
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  policies:
    timeouts:
      invokeTimeout: 300s
    retries:
      invokeRetry:
        policy: constant
        duration: 2s
        maxRetries: 3
    circuitBreakers:
      invokeBreaker:
        maxRequests: 1
        timeout: 30s
        trip: consecutiveFailures >= 5
  targets:
    apps:
{{- /* Target only app-ids whose pods can actually render — mirror the templates' own gates
     (fleet.yaml ranges .Values.services minus the lakehouse entries, gateway always + the rest
     under singleTenant; services.yaml renders catalog/lineage unconditionally; controlplane.yaml,
     medallion.yaml, media.yaml carry their own toggles). Derived, not restated, so a new fleet
     entry is picked up here automatically. */}}
{{- $invoked := list .Values.services.catalog.daprAppId .Values.services.lineage.daprAppId }}
{{- $lakehouse := list "catalog" "lineage" }}
{{- /* Mirrors fleet.yaml's gate EXACTLY — `frontDoor` or singleTenant — because this list claims to be
     DERIVED from it. It was restated as `if singleTenant.enabled` alone, so the moment compute became a
     front-door service the two drifted: compute rendered a pod the gateway invokes while this CR did not
     target it, leaving it with no timeout, no retry and no circuit breaker — the identical call to
     catalog had all three. gateway is excluded because it is the CALLER, not a target. */}}
{{- range $name, $svc := .Values.services }}
{{- if and (not (has $name $lakehouse)) (ne $name "gateway") (or $svc.frontDoor $.Values.singleTenant.enabled) }}
{{- $invoked = append $invoked $name }}
{{- end }}
{{- end }}
{{- if .Values.controlplane.enabled }}
{{- $invoked = append $invoked "controlplane" }}
{{- end }}
{{- if .Values.medallion.enabled }}
{{- $invoked = append $invoked .Values.medallion.producer.daprAppId }}
{{- end }}
{{- if .Values.media.enabled }}
{{- range $name, $svc := .Values.media.services }}
{{- $invoked = append $invoked $svc.daprAppId }}
{{- end }}
{{- end }}
{{- range $invoked }}
      {{ . }}:
        timeout: invokeTimeout
        retry: invokeRetry
        circuitBreaker: invokeBreaker
{{- end }}
scopes:
  - gateway
{{- end }}
