{{- if and .Values.dapr.enabled .Values.dapr.resiliency.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: {{ .Release.Name }}-pubsub-resiliency
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  policies:
    retries:
      pubsubDeliveryRetry:
        policy: constant
        duration: 120s
        maxRetries: 4
  targets:
    components:
{{- $subscribers := list (dict "appId" .Values.services.lineage.daprAppId) }}

{{- if and .Values.maintenance.enabled .Values.maintenance.arrivalEnabled }}
{{- $subscribers = append $subscribers (dict "appId" .Values.maintenance.daprAppId) }}
{{- end }}
{{- range $subscribers }}
      {{ include "lance.subPubsub" (list $ .appId) }}:
        inbound:
          retry: pubsubDeliveryRetry
{{- end }}

{{- if .Values.catalog.controlEmit }}
      {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}:
        inbound:
          retry: pubsubDeliveryRetry
{{- end }}

scopes:
{{- range $subscribers }}
  - {{ .appId }}
{{- end }}
{{- if .Values.catalog.controlEmit }}
  - {{ .Values.services.catalog.daprAppId }}
{{- end }}
{{- end }}
