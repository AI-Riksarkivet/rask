{{- if and .Values.dapr.enabled .Values.dapr.resiliency.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: {{ .Release.Name }}-pubsub-resiliency
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  policies:
    retries:
      pubsubDeliveryRetry:
        policy: constant
        duration: 120s
        maxRetries: 4
  targets:
    components:
{{- $subscribers := list (dict "appId" .Values.services.lineage.daprAppId) }}

{{- $subscribers = append $subscribers (dict "appId" "notifications") }}

{{- if and .Values.maintenance.enabled .Values.maintenance.workTopic }}
{{- $subscribers = append $subscribers (dict "appId" .Values.maintenance.daprAppId) }}
{{- end }}
{{- range $subscribers }}
      {{ include "lance.subPubsub" (list $ .appId) }}:
        inbound:
          retry: pubsubDeliveryRetry
{{- end }}

{{- if .Values.services.notifications }}
      {{ .Values.pubsub.controlName | default "catalog-control-pubsub" }}-notifications:
        inbound:
          retry: pubsubDeliveryRetry
{{- end }}

{{- if and .Values.maintenance.enabled .Values.maintenance.workTopic }}
      {{ .Values.maintenance.workPubsub }}:
        inbound:
          retry: pubsubDeliveryRetry
{{- end }}
{{- if and .Values.maintenance.enabled .Values.maintenance.indexTopic }}
      {{ .Values.maintenance.indexPubsub }}:
        inbound:
          retry: pubsubDeliveryRetry
{{- end }}
scopes:
{{- range $subscribers }}
  - {{ .appId }}
{{- end }}
---
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: {{ .Release.Name }}-invocation-resiliency
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  policies:
    timeouts:
      invokeTimeout: 300s
    retries:
      invokeRetry:
        policy: constant
        duration: 2s
        maxRetries: 3
        matching:
          httpStatusCodes: 408,429,500-599
      writeRetry:
        policy: constant
        duration: 2s
        maxRetries: 3
        matching:
          httpStatusCodes: 408,429,502,503,504
  targets:
    apps:

{{- $invoked := list .Values.services.catalog.daprAppId .Values.services.lineage.daprAppId }}
{{- $lakehouse := list "catalog" "lineage" }}

{{- range $name, $svc := .Values.services }}
{{- if and (not (has $name $lakehouse)) (ne $name "gateway") (or $svc.frontDoor $.Values.singleTenant.enabled) }}
{{- $invoked = append $invoked $name }}
{{- end }}
{{- end }}
{{- if .Values.controlplane.enabled }}
{{- $invoked = append $invoked "controlplane" }}
{{- end }}
{{- if .Values.explorer.enabled }}
{{- range $name, $svc := .Values.explorer.services }}
{{- $invoked = append $invoked $svc.daprAppId }}
{{- end }}
{{- end }}

{{- $writeDoors := list .Values.services.catalog.daprAppId }}
{{- range $invoked }}
      {{ . }}:
        timeout: invokeTimeout
        retry: {{ if has . $writeDoors }}writeRetry{{ else }}invokeRetry{{ end }}
{{- end }}
scopes:
  - gateway
{{- end }}
