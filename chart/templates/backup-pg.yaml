{{- if .Values.backups.pgDump.enabled }}
# pg_dump the OpenFGA database (gzip) → the lakehouse S3 under _backups/pg/<date>/.
# SELF-CONTAINED FALLBACK ONLY: when AGE is a CloudNativePG cluster (the rask path), disable this and use
# CNPG's scheduled backups / PITR instead — they do this better.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lance.fullname" . }}-pg-backup
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backups.pgDump.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          # The component label is load-bearing under the prod NetworkPolicy: the age-postgres and object-store
          # ingress rules allow `from` component=backup-pg — without this label the CronJob pod matches
          # neither, default-deny drops its pg_dump SYN + S3 upload, and the backup silently never runs.
          labels:
            {{- include "lance.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup-pg
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "lance.saName" (list . "backup-pg") }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: { fsGroup: 10001 }
          volumes:
            - { name: dump, emptyDir: {} }
            - { name: pgpass, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
            - name: postgres-password
              secret: { secretName: {{ include "lance.fullname" . }}-infra-credentials, items: [{ key: postgres-password, path: password }], defaultMode: 0400 }
            {{- include "lance.identityTokens" (list "volumes" (include "lance.objectStoreAudience" .)) | nindent 12 }}
          initContainers:
            - name: pg-dump
              image: {{ .Values.age.image }}
              resources:
                requests: { cpu: "100m", memory: "64Mi" }
                limits: { cpu: "1", memory: "256Mi" }
              env:
                - { name: PGPASSFILE, value: /pgpass/.pgpass }
              command:
                - sh
                - -c
                - |
                  set -e
                  rm -f /tmp/.dump-failed
                  (umask 077; printf '%s:%s:*:%s:%s\n' {{ include "lance.ageConnectHost" . | quote }} {{ .Values.age.port | quote }} {{ .Values.age.user | quote }} "$(sed 's/[\\:]/\\&/g' /postgres-password/password)" > "$PGPASSFILE")
                  for db in {{ .Values.age.openfgaDb }}; do
                    { pg_dump -h {{ include "lance.ageConnectHost" . }} -p {{ .Values.age.port }} -U {{ .Values.age.user }} -d "$db" || touch /tmp/.dump-failed ; } | gzip > /dump/"$db".sql.gz
                    if [ -f /tmp/.dump-failed ]; then
                      echo "pg_dump failed for database $db — refusing to upload a partial backup" >&2
                      exit 1
                    fi
                    [ -s /dump/"$db".sql.gz ] || { echo "no dump produced for database $db" >&2; exit 1; }
                  done
              volumeMounts:
                - { name: dump, mountPath: /dump }
                - { name: pgpass, mountPath: /pgpass }
                - { name: postgres-password, mountPath: /postgres-password, readOnly: true }
          containers:
            - name: upload
              image: "{{ include "lance.catalogImage" . }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- include "lance.rootlessSecurityContext" 10001 | nindent 14 }}
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { cpu: "500m", memory: "512Mi" }
              env:
                - { name: RASK_S3_ENDPOINT_URL, value: {{ include "lance.s3Endpoint" . | quote }} }
                - { name: RASK_S3_REGION, value: "us-east-1" }
                {{- include "lance.objectStoreSessionEnv" (list . "RASK" "backup-pg") | nindent 16 }}
              args:
                - python
                - /srv/pg_dump_upload.py
                - /dump
                - {{ printf "s3://%s/_backups/pg" .Values.objectStore.bucket | quote }}
                - --keep
                - {{ .Values.backups.pgDump.keep | quote }}
              volumeMounts:
                - { name: dump, mountPath: /dump }
                {{- include "lance.identityTokens" (list "mounts" (include "lance.objectStoreAudience" .)) | nindent 16 }}
{{- end }}
