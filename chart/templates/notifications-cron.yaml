
{{- if and .Values.dapr.enabled .Values.services.notifications }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.services.notifications.reconcileBindingName | default "notifications-reconcile-cron" }}
  labels: {{- include "rask.componentLabels" (list . "notifications") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.services.notifications.reconcileSchedule | default "@every 30s" | quote }} }
scopes:
  - notifications
{{- end }}
