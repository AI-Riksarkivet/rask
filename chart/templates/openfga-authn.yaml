{{- if .Values.openfga.enabled }}

{{- $fga := .Values.openfga -}}
{{- if ne (($fga.authn).oidc).audience (include "lance.openfgaAudience" .) }}
{{- fail (printf "openfga.authn.oidc.audience is %q, but the FGA clients project %q (lance.openfgaAudience): every client would be refused" (($fga.authn).oidc).audience (include "lance.openfgaAudience" .)) }}
{{- end }}
{{- $ref := dict }}{{- range $fga.extraEnvVars }}{{- if eq .name "OPENFGA_AUTHN_OIDC_SUBJECTS" }}{{- $ref = ((.valueFrom).configMapKeyRef) | default dict }}{{- end }}{{- end }}
{{- if or (not $ref.name) (ne ($ref.key | default "") "subjects") }}
{{- fail "OpenFGA must read OPENFGA_AUTHN_OIDC_SUBJECTS from a configMapKeyRef with key `subjects` (openfga.extraEnvVars), or it admits every ServiceAccount in the cluster" }}
{{- end }}
{{- $account := printf "%s-openfga" .Release.Name }}
{{- if or (($fga.serviceAccount).create) (ne ((($fga.serviceAccount).name) | default "") $account) }}
{{- fail (printf "openfga.serviceAccount must be create=false, name=%q, the tokenless ServiceAccount this release renders for OpenFGA; it is create=%v, name=%q, so the pod would run as an account holding an API token, or as one that does not exist" $account (($fga.serviceAccount).create) ((($fga.serviceAccount).name) | default "")) }}
{{- end }}
{{- $running := index (($fga.podAnnotations) | default dict) "rask.dev/openfga-account" | default "" }}
{{- if ne $running $account }}
{{- fail (printf "openfga.podAnnotations.rask.dev/openfga-account is %q, but OpenFGA runs as %q: a running pod would keep the token of the account it started as" $running $account) }}
{{- end }}
{{- $credentials := printf "%s-infra-credentials" (include "lance.fullname" .) }}
{{- $mounted := "" }}{{- range $fga.extraVolumes }}{{- if eq .name "openfga-config" }}{{- $mounted = ((.secret).secretName) | default "" }}{{- end }}{{- end }}
{{- if ne $mounted $credentials }}
{{- fail (printf "openfga.extraVolumes mounts the Secret %q as openfga-config, but this release renders the datastore credentials as %q: OpenFGA would start with no datastore DSN" $mounted $credentials) }}
{{- end }}
{{- $cm := $ref.name }}
{{- $named := index (($fga.podAnnotations) | default dict) "rask.dev/openfga-clients" | default "" }}
{{- if ne $named (include "lance.openfgaClients" .) }}
{{- fail (printf "openfga.podAnnotations.rask.dev/openfga-clients is %q, but OpenFGA's clients are %q (lance.openfgaClients): a running OpenFGA would keep admitting the subjects it started with" $named (include "lance.openfgaClients" .)) }}
{{- end }}
{{- $datastore := printf "%s:%v/%s" (include "lance.postgresHost" .) .Values.postgres.port .Values.postgres.database }}
{{- $dialled := index (($fga.podAnnotations) | default dict) "rask.dev/openfga-datastore" | default "" }}
{{- if ne $dialled $datastore }}
{{- fail (printf "openfga.podAnnotations.rask.dev/openfga-datastore is %q, but OpenFGA's Postgres is %q (postgres.externalHost or the development fixture's host, postgres.port, postgres.database): set the annotation to it, or a running OpenFGA would keep dialling the database it started with" $dialled $datastore) }}
{{- end }}
{{- $subjects := include "lance.openfgaSubjects" . }}

{{- if not $subjects }}{{- $subjects = "system:serviceaccount:-:no-fga-client" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cm }}
  labels: {{- include "rask.componentLabels" (list . "openfga") | nindent 4 }}
data:
  subjects: {{ $subjects | quote }}
---
{{- if .Values.auth.issuerMirror.enabled }}
{{- $alias := "" }}{{- range $fga.extraEnvVars }}{{- if eq .name "OPENFGA_AUTHN_OIDC_ISSUER_ALIASES" }}{{- $alias = .value }}{{- end }}{{- end }}
{{- if ne $alias .Values.auth.serviceAccountIssuer }}
{{- fail (printf "OpenFGA's issuer alias is %q, but the tokens carry iss %q (auth.serviceAccountIssuer): every client would be refused" $alias .Values.auth.serviceAccountIssuer) }}
{{- end }}
{{- end }}
{{- end }}
