apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-nats-stream-{{ include "rask.bootstrapRev" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    {{- include "lance.reconciledJob" "Sync" | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 3600
  {{- include "lance.bootstrapJobDeadline" . | nindent 2 }}
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: nats-stream
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- $creds := hasKey (include "lance.natsFiles" . | fromJson) "nats-admin-creds" }}
      {{- $replicas := (hasKey .Values.nats "streamReplicas") | ternary .Values.nats.streamReplicas 1 }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- if $creds }}
        - { name: nats-creds, secret: { secretName: {{ include "lance.fullname" . }}-nats-admin-creds } }
        {{- end }}
      containers:
        - name: nats
          image: natsio/nats-box:0.20.2
          {{- include "lance.rootSecurityContext" . | nindent 10 }}
          env:
            - { name: HOME, value: /tmp }
            {{- if $creds }}
            - { name: NATS_CREDS, value: /etc/nats-creds/nats.creds }
            {{- end }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            {{- if $creds }}
            - { name: nats-creds, mountPath: /etc/nats-creds, readOnly: true }
            {{- end }}
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          command:
            - sh
            - -c
            - |
              S="{{ include "lance.natsUrl" . }}"
              until err=$(nats --server "$S" stream ls 2>&1 >/dev/null); do
                case "$err" in *[Aa]uthoriz*|*[Aa]uthentic*|*[Pp]ermission*) echo "!! NATS refused the stream Job's credential: $err"; exit 1 ;; esac
                echo wait-nats; sleep 3
              done
              # EVERY STREAM CONVERGES TO THE CONFIG THE CHART DECLARES, on every run ([[XC-164]]): created from it when
              # absent, edited to it in place when present, so a changed value reaches a stream that already exists. What
              # JetStream refuses to change in place (storage, mirror, retention to or from workqueue, lifting deny_delete
              # or deny_purge) fails the Job with the server's own reason rather than leaving a stream the chart does not
              # describe. Measured on natscli 0.5.1 (nats-box 0.20.2) against nats-server 2.15.2: an edit to an unchanged config exits 0, a
              # refused one exits 1 and names the reason (`... can not change retention policy to/from workqueue (10052)`).
              #
              # RETENTION IS A FAN-OUT CORRECTNESS INVARIANT, and `limits` on every stream is what the edit restores:
              #   work      on a stream with MULTIPLE per-app durables: the FIRST ack deletes the message, so the apps
              #             steal deliveries from each other and every consumer looks healthy while seeing a fraction.
              #   interest  deletes each message once every attached durable has acked it, so the retained history a
              #             lineage REBUILD replays (a new `deliverPolicy=all` durable) is gone.
              # Interest edits back to limits in place; work refuses, and the Job fails naming why.
              converge_stream() {
                if nats --server "$S" stream info "$1" >/dev/null 2>&1; then
                  out=$(nats --server "$S" stream edit "$1" --config "$HOME/$1.json" -f 2>&1) \
                    || { echo "!! stream $1 cannot be edited to the declared config in place: $(echo "$out" | grep -i error)"; echo "!! Drain it and run: nats --server $S stream rm $1   then re-run this Job."; exit 1; }
                  echo "stream $1: converged to the declared config"
                else
                  nats --server "$S" stream add --config "$HOME/$1.json" >/dev/null \
                    || { echo "!! FAILED to create stream $1 — a publisher would have nowhere to land"; exit 1; }
                  echo "stream $1: created"
                fi
              }
              # A key-value bucket's stream converges through JetStream's own update request: natscli asks before it edits a
              # bucket's stream, a question `-f` does not answer and a Job cannot, and `nats kv edit` cannot keep rollups off.
              # The request exits 0 however it is answered, so the answer is read (docs/chart/templates/nats-stream-job.yaml.md).
              converge_bucket() {
                if nats --server "$S" stream info "$1" >/dev/null 2>&1; then
                  got=$(nats --server "$S" req "\$JS.API.STREAM.UPDATE.$1" "$(cat "$HOME/$1.json")" 2>&1)
                  case "$got" in
                    *'"error":'*)
                      echo "!! stream $1 cannot be edited to the declared config in place: $(echo "$got" | grep -F '"error":')"
                      echo "!! Drain it and run: nats --server $S stream rm $1   then re-run this Job."
                      exit 1 ;;
                    *'"config":'*) echo "stream $1: converged to the declared config"; return 0 ;;
                  esac
                  echo "!! the bus did not take stream $1's update, so re-run this Job: $(echo "$got" | grep -v -e 'Sending request' -e 'Received with rtt')"
                  exit 1
                fi
                nats --server "$S" stream add --config "$HOME/$1.json" >/dev/null \
                  || { echo "!! FAILED to create stream $1 — a publisher would have nowhere to land"; exit 1; }
                echo "stream $1: created"
              }
              # `allow_direct: true`, as `nats stream add --defaults` sets it, so a stream created that way edits to no change.
              declare_stream() {
                printf '%s' '{"name":"'"$1"'","subjects":["'"$2"'"],"retention":"limits","max_consumers":-1,"max_msgs":-1,"max_bytes":-1,"max_msgs_per_subject":-1,"max_msg_size":-1,"max_age":{{ mul (int (required "nats.streamMaxAgeSeconds is required" .Values.nats.streamMaxAgeSeconds)) 1000000000 }},"storage":"file","discard":"old","num_replicas":{{ $replicas }},"duplicate_window":120000000000,"deny_delete":true,"deny_purge":true,"allow_rollup_hdrs":false,"allow_direct":true}' > "$HOME/$1.json"
              }

              # A durable consumer converges to its declared config as a stream does, created when absent.
              converge_consumer() {
                if nats --server "$S" consumer info "$1" "$2" >/dev/null 2>&1; then
                  out=$(nats --server "$S" consumer edit "$1" "$2" --config "$HOME/$1-$2.json" -f 2>&1) \
                    || { echo "!! consumer $1/$2 cannot be edited to the declared config in place: $(echo "$out" | grep -i error)"; exit 1; }
                  echo "consumer $1/$2: converged to the declared config"
                else
                  nats --server "$S" consumer add "$1" "$2" --config "$HOME/$1-$2.json" >/dev/null \
                    || { echo "!! FAILED to create consumer $1/$2 — no worker could take a task"; exit 1; }
                  echo "consumer $1/$2: created"
                fi
              }

              consumer_of() {
                tries=0
                while :; do
                  got=$(nats --server "$S" req "\$JS.API.CONSUMER.INFO.$1.$2" '' 2>/dev/null | tr -d ' \n')
                  case "$got" in
                    *'"err_code":10014'*) return 0 ;;
                    *'"config":'*) echo "$got"; return 0 ;;
                  esac
                  tries=$((tries + 1))
                  if [ "$tries" -ge 5 ]; then echo "!! could not read consumer $1/$2 (answer: ${got:-none}); it is left in place" >&2; return 1; fi
                  sleep 3
                done
              }
              # LINEAGE carries OpenLineage events.
              declare_stream LINEAGE "lineage.events.>"
              converge_stream LINEAGE
              # DLQ parks dead-lettered deliveries (dapr.resiliency — the sidecar publishes to dlq.*
              # after retry exhaustion). Its OWN stream for two load-bearing reasons: Dapr does NOT
              # auto-create streams (a parking publish with no stream FAILS, silently un-parking the
              # message), and NATS scopes consumer names PER STREAM — the dlq.* subscriptions reuse
              # each app's durableName, which only avoids clashing with the app's main consumer
              # because the two live on different streams.
              declare_stream DLQ "dlq.>"
              converge_stream DLQ
              {{- if .Values.maintenance.enabled }}
              printf '%s' '{"name":"MAINTENANCE_TASKS","subjects":["maintenance.task.>"],"retention":"workqueue","max_consumers":-1,"max_msgs":-1,"max_bytes":-1,"max_msgs_per_subject":1,"max_msg_size":-1,"max_age":86400000000000,"storage":"file","discard":"new","discard_new_per_subject":true,"num_replicas":{{ $replicas }},"duplicate_window":120000000000,"deny_delete":true,"deny_purge":true,"allow_rollup_hdrs":false,"allow_direct":true}' > "$HOME/MAINTENANCE_TASKS.json"
              converge_stream MAINTENANCE_TASKS
              printf '%s' '{"name":"MAINTENANCE_SCHEDULES","subjects":["maintenance.schedule.>","maintenance.due.>"],"retention":"workqueue","max_consumers":-1,"max_msgs":-1,"max_bytes":-1,"max_msgs_per_subject":-1,"max_msg_size":-1,"max_age":0,"storage":"file","discard":"old","num_replicas":{{ $replicas }},"duplicate_window":120000000000,"allow_msg_schedules":true,"allow_rollup_hdrs":true,"allow_direct":true}' > "$HOME/MAINTENANCE_SCHEDULES.json"
              converge_stream MAINTENANCE_SCHEDULES
              # A server older than 2.12 drops `allow_msg_schedules` from the config it is given and reports the stream
              # created, after which no schedule ever fires. Read from the server's own answer, since a client re-serialising
              # the config can drop a field it does not know.
              got=$(nats --server "$S" req '$JS.API.STREAM.INFO.MAINTENANCE_SCHEDULES' '' 2>/dev/null | tr -d ' \n')
              case "$got" in
                *'"allow_msg_schedules":true'*) echo "stream MAINTENANCE_SCHEDULES: message schedules allowed" ;;
                *'"config":'*) echo "!! stream MAINTENANCE_SCHEDULES does not allow message schedules: the bus ignored allow_msg_schedules, so no maintenance schedule would fire. Message schedules need nats-server 2.12 or later."; exit 1 ;;
                *) echo "!! could not read stream MAINTENANCE_SCHEDULES back (answer: ${got:-none}), so re-run this Job"; exit 1 ;;
              esac
              {{- $queue := required "maintenance.queue is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.maintenance.queue }}
              {{- $ackWait := int (required "maintenance.queue.ackWaitSeconds is required" $queue.ackWaitSeconds) }}
              {{- $maxDeliver := int (required "maintenance.queue.maxDeliver is required" $queue.maxDeliver) }}
              {{- if gt (mul 2 (int (required "maintenance.queue.heartbeatSeconds is required" $queue.heartbeatSeconds))) $ackWait }}
              {{- fail (printf "maintenance.queue.heartbeatSeconds (%d) is past half of ackWaitSeconds (%d): a heartbeat late once hands a running task to another replica" (int $queue.heartbeatSeconds) (int $queue.ackWaitSeconds)) }}
              {{- end }}
              printf '%s' '{"name":"KV_MAINTENANCE_CLAIMS","subjects":["$KV.MAINTENANCE_CLAIMS.>"],"retention":"limits","max_consumers":-1,"max_msgs":-1,"max_bytes":-1,"max_msgs_per_subject":1,"max_msg_size":-1,"max_age":{{ mul $ackWait 1000000000 }},"storage":"file","discard":"new","num_replicas":{{ $replicas }},"duplicate_window":{{ mul $ackWait 1000000000 }},"deny_delete":true,"deny_purge":false,"allow_rollup_hdrs":false,"allow_direct":true}' > "$HOME/KV_MAINTENANCE_CLAIMS.json"
              converge_bucket KV_MAINTENANCE_CLAIMS
              printf '%s' '{"durable_name":"maintenance-worker","ack_policy":"explicit","ack_wait":{{ mul $ackWait 1000000000 }},"max_deliver":{{ add1 $maxDeliver }},"filter_subject":"maintenance.task.>","deliver_policy":"all","replay_policy":"instant","max_ack_pending":1000,"max_waiting":512}' > "$HOME/MAINTENANCE_TASKS-maintenance-worker.json"
              converge_consumer MAINTENANCE_TASKS maintenance-worker
              printf '%s' '{"durable_name":"maintenance-due","ack_policy":"explicit","ack_wait":30000000000,"max_deliver":-1,"filter_subject":"maintenance.due.>","deliver_policy":"all","replay_policy":"instant","max_ack_pending":1000,"max_waiting":512}' > "$HOME/MAINTENANCE_SCHEDULES-maintenance-due.json"
              converge_consumer MAINTENANCE_SCHEDULES maintenance-due
              printf '%s' '{"name":"STORE_EVENTS","subjects":["store.events"],"retention":"workqueue","max_consumers":-1,"max_msgs":-1,"max_bytes":{{ int64 (required "maintenance.queue.storeEventsMaxBytes is required" $queue.storeEventsMaxBytes) }},"max_msgs_per_subject":-1,"max_msg_size":-1,"max_age":604800000000000,"storage":"file","discard":"old","num_replicas":{{ $replicas }},"duplicate_window":600000000000,"deny_delete":true,"deny_purge":true,"allow_rollup_hdrs":false,"allow_direct":true}' > "$HOME/STORE_EVENTS.json"
              converge_stream STORE_EVENTS
              printf '%s' '{"durable_name":"maintenance-store-events","ack_policy":"explicit","ack_wait":30000000000,"max_deliver":{{ add1 $maxDeliver }},"filter_subject":"store.events","deliver_policy":"all","replay_policy":"instant","max_ack_pending":1000,"max_waiting":512}' > "$HOME/STORE_EVENTS-maintenance-store-events.json"
              converge_consumer STORE_EVENTS maintenance-store-events
              {{- end }}
              {{- if .Values.catalog.controlEmit }}
              # Control-plane change-events (grants/warehouses/policies/tables) broadcast to EVERY catalog
              # replica's ring buffer (GET /management/v1/events). Its own stream so a parking-free broadcast publish
              # can't fail for want of a stream. The catalog's replicas consume it through the mirror below.
              #
              # The stream stays in the drift loop below, so a durable on it that no component in this release renders
              # is deleted there like one on any other stream.
              declare_stream CATALOG_CONTROL "catalog.control.>"
              converge_stream CATALOG_CONTROL
              # The mirror holding each catalog replica's durable, its consumer limit reaping a deleted pod's (LH-305).
              BROADCAST_INACTIVE_NS="{{ mul (int (required "catalog.controlConsumerInactiveSeconds is required" .Values.catalog.controlConsumerInactiveSeconds)) 1000000000 }}"
              printf '%s' '{"name":"CATALOG_CONTROL_BROADCAST","mirror":{"name":"CATALOG_CONTROL"},"storage":"file","retention":"limits","max_consumers":-1,"discard":"old","max_age":'"$BROADCAST_INACTIVE_NS"',"max_bytes":-1,"max_msgs":-1,"max_msgs_per_subject":-1,"max_msg_size":-1,"num_replicas":{{ $replicas }},"deny_delete":true,"deny_purge":true,"allow_rollup_hdrs":false,"consumer_limits":{"inactive_threshold":'"$BROADCAST_INACTIVE_NS"',"max_ack_pending":1000}}' > "$HOME/CATALOG_CONTROL_BROADCAST.json"
              # The stream's consumer limit may not sit below a consumer's own threshold, so a consumer holding a longer one
              # is lowered first.
              if info=$(nats --server "$S" stream info CATALOG_CONTROL_BROADCAST --json 2>/dev/null); then
                info=$(echo "$info" | tr -d ' \n')
                limit=$(echo "$info" | sed -n 's/.*"consumer_limits":{[^}]*"inactive_threshold":\([0-9]*\).*/\1/p')
                if [ "$limit" != "$BROADCAST_INACTIVE_NS" ]; then
                  for c in $(nats --server "$S" consumer ls CATALOG_CONTROL_BROADCAST --names 2>/dev/null); do
                    held=$(consumer_of CATALOG_CONTROL_BROADCAST "$c") || exit 1
                    held=$(echo "$held" | sed -n 's/.*"inactive_threshold":\([0-9]*\).*/\1/p')
                    if [ -n "$held" ] && [ "$held" -gt "$BROADCAST_INACTIVE_NS" ]; then
                      nats --server "$S" consumer edit CATALOG_CONTROL_BROADCAST "$c" --inactive-threshold={{ .Values.catalog.controlConsumerInactiveSeconds }}s -f >/dev/null \
                        || { echo "!! FAILED to lower $c's inactive threshold"; exit 1; }
                    fi
                  done
                fi
              fi
              converge_stream CATALOG_CONTROL_BROADCAST
              {{- end }}
              # Reconcile app-durable config drift (the UPGRADE path): a Dapr jetstream subscription
              # can only BIND an existing durable whose config matches its request — after a values
              # change that alters consumer config (e.g. the resiliency flip's maxDeliver/backOff),
              # the pre-existing durable makes every subscribe fail forever with "consumer name
              # already in use" while pods stay Ready: a SILENT dead subscription (hit live
              # 2026-07-13 — every subscriber sat idle after the Batch-18 roll). Expected values
              # are templated from the SAME conditional the pubsub components render, so the two
              # cannot drift apart. A drifted durable is deleted; the sidecar's subscribe-retry
              # recreates it with the new config within seconds. deliverPolicy=new means messages
              # published inside that delete->recreate window are skipped — accepted on upgrades:
              # the alternative is a permanently dead subscription. Matching durables are untouched
              # (ordinary restarts re-attach as before). Backoff values are nanoseconds in the JSON.
              EXP_MAXD="{{ if .Values.dapr.resiliency.enabled }}3{{ else }}5{{ end }}"
              EXP_BOFF="{{ if .Values.dapr.resiliency.enabled }}720000000000,720000000000{{ else }}30000000000,60000000000,120000000000,300000000000{{ end }}"
              # CATALOG_CONTROL joins only when its stream exists, under the SAME conditional that
              # creates it — a loop over a stream the release does not own would just log noise.

              # ORPHAN PASS (LH-127), beside the drift pass rather than inside it: the two answer different
              # questions. Drift asks "is this durable's config still the one the component requests"; an
              # orphan's config matches forever, because a Dapr sidecar created it from those same templated
              # values before its app was removed. So the one class of stale durable the comparison can never
              # see is the class that never changes — measured for LH-127: four durables of one removed app and
              # two of another, all reporting the expected MaxDeliver/Backoff.
              #
              # KEYED ON THE RENDERED NAME SET, never on app-ids. The dead-letter consumer this chart owns is not
              # `<app-id>-durable`, so an app-id test deletes it. `lance.chartDurables` is the single derivation; the
              # chart-owns-it test asserts it against the rendered Components, so a new durable that forgets the list
              # fails there.
              EXP_DURABLES="{{ include "lance.chartDurables" . }}"
              for st in LINEAGE DLQ{{ if .Values.catalog.controlEmit }} CATALOG_CONTROL{{ end }}; do
                for c in $(nats --server "$S" consumer ls "$st" --names 2>/dev/null | grep -- '-durable$'); do
                  case " $EXP_DURABLES " in
                    *" $c "*) ;;
                    *)
                      echo "ORPHAN DURABLE $st/$c: no component in this release renders it — deleting"
                      nats --server "$S" consumer rm "$st" "$c" -f
                      ;;
                  esac
                done
              done
              for st in LINEAGE DLQ{{ if .Values.catalog.controlEmit }} CATALOG_CONTROL{{ end }}; do
                for c in $(nats --server "$S" consumer ls "$st" --names 2>/dev/null | grep -- '-durable$'); do
                  info=$(consumer_of "$st" "$c") || exit 1
                  [ -n "$info" ] || continue
                  maxd=$(echo "$info" | sed -n 's/.*"max_deliver":\(-\{0,1\}[0-9]*\).*/\1/p')
                  boff=$(echo "$info" | sed -n 's/.*"backoff":\[\([0-9,]*\)\].*/\1/p')
                  if [ "$maxd" != "$EXP_MAXD" ] || [ "$boff" != "$EXP_BOFF" ]; then
                    echo "RECONCILE $st/$c: max_deliver=$maxd backoff=[$boff] != expected $EXP_MAXD/[$EXP_BOFF] — deleting (sidecar re-creates)"
                    nats --server "$S" consumer rm "$st" "$c" -f
                  fi
                done
              done
              LIN="{{ .Values.services.lineage.daprAppId }}-durable"
              EXP_MACK="{{ required "services.lineage.deliveriesInFlight is required" .Values.services.lineage.deliveriesInFlight }}"
              mack_of() { info=$(consumer_of LINEAGE "$LIN") || return 1; echo "$info" | sed -n 's/.*"max_ack_pending":\(-\{0,1\}[0-9]*\).*/\1/p'; }
              mack=$(mack_of) || exit 1
              if [ -n "$mack" ] && [ "$mack" != "$EXP_MACK" ]; then
                deadline=$(( $(date +%s) + 300 ))
                while :; do
                  mack=$(mack_of) || exit 1
                  if [ "$mack" = "$EXP_MACK" ]; then echo "RECONCILED LINEAGE/$LIN: max_ack_pending=$mack"; break; fi
                  if [ -n "$mack" ]; then
                    echo "RECONCILE LINEAGE/$LIN: max_ack_pending=$mack != expected $EXP_MACK — deleting (sidecar re-creates)"
                    nats --server "$S" consumer rm LINEAGE "$LIN" -f
                  fi
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    mack=$(mack_of) || exit 1
                    [ -z "$mack" ] && break
                    echo "!! LINEAGE/$LIN is not at max_ack_pending=$EXP_MACK after 300 s"; exit 1
                  fi
                  sleep 5
                done
              fi
