{{- if or .Values.nats.enabled .Values.nats.externalUrl }}
# Create the JetStream LINEAGE stream (subjects lineage.events.>) that the Dapr pubsub.jetstream
# component publishes to / consumes from. Dapr's jetstream component does NOT auto-create the stream,
# so this Job does it (idempotent: skip if it already exists). Also runs against an
# EXTERNAL NATS (nats.externalUrl + nats.enabled=false) — the component would otherwise point at a
# server with no streams and every publish would fail.
#
# NOT a hook — see "BOOTSTRAP JOBS" in _helpers.tpl. A daprd sidecar subscribes at startup, so an
# absent stream is a startup-time dependency of half the fleet; running the provisioner only after
# `--wait` had already declared those pods hopeless is the wrong order in the same way the OpenFGA
# migration was.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-nats-stream-{{ include "rask.bootstrapRev" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  # Reap the finished pod. Each revision's job carries a -r<revision> name, so Helm's
  # before-hook-creation delete policy never matches the previous one — without a TTL every
  # `helm upgrade` left another Completed husk behind (14 were sitting in `kubectl get pods`).
  ttlSecondsAfterFinished: 3600
  backoffLimit: 20
  template:
    metadata:
      # The explicit component label (the P4 landmine, see bootstrap-admin.yaml): nats:4222 is pod-open
      # under the prod NetworkPolicy so nothing blocks today, but the label keeps this pod visible to
      # release inventory (`kubectl get pods -l app.kubernetes.io/instance=…`) and admissible the day the
      # nats ingress gets an exclusive client list like openbao/age/rustfs.
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: nats-stream
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      containers:
        - name: nats
          image: natsio/nats-box:0.14.5
          command:
            - sh
            - -c
            - |
              S="{{ include "lance.natsUrl" . }}"
              until nats --server "$S" stream ls >/dev/null 2>&1; do echo wait-nats; sleep 3; done
              # LINEAGE carries OpenLineage events; MEDALLION carries the stage triggers that cascade the
              # event-driven pipeline (medallion.bronze/silver/media); TRAINING carries the train triggers
              # (training.jobs — docs/RAY-TRAIN.md D1: its OWN stream, so the durable consumer names stay
              # per-stream and a slow train path never shares limits with the stage cascade). Each created
              # once (idempotent skip).
              # streamReplicas > 1 (raft-replicated streams) needs a CLUSTERED NATS — the in-cluster
              # single-node subchart supports 1 only; set 3 with an external/clustered NATS in prod.
              add_if_missing() {
                if nats --server "$S" stream info "$1" >/dev/null 2>&1; then
                  echo "stream $1 already exists"
                else
                  nats --server "$S" stream add "$1" \
                    --subjects "$2" --storage file --retention limits \
                    --max-age=168h --max-bytes=-1 --max-msgs=-1 --max-msgs-per-subject=-1 \
                    --max-msg-size=-1 --discard old --dupe-window=2m --replicas {{ (hasKey .Values.nats "streamReplicas") | ternary .Values.nats.streamReplicas 1 }} \
                    --no-allow-rollup --deny-delete --deny-purge
                fi
              }
              # INGEST is a WORK QUEUE, not a retained log, and it needs its own creation path.
              #
              # `services/ingest/src/ingest/queue.py` declares RetentionPolicy.WORK_QUEUE and BUILDS ON
              # it: "a message is REMOVED once acked — that is what makes the stream itself the
              # outstanding-work ledger, which is why this plane needs no side ledger". Creating it
              # here with `limits` made that claim FALSE wherever it is deployed (acked messages were
              # retained 168h, so `messages` was not outstanding work), and this file asserted the
              # opposite of itself twenty-seven lines below — measured 2026-08-06 on the live stream:
              # retention=limits, deny_purge=true, deny_delete=true.
              #
              # `--deny-purge --deny-delete` are deliberately ABSENT here rather than carried over.
              # They protect a retained RECORD; a work queue has none — it reclaims by ack. Their only
              # measured effect was to make the ingest plane's own `release_run -> purge_stream` return
              # an inert 0 while the server refused it (err_code 10110, "stream purge not permitted").
              #
              # ONE-TIME MIGRATION on an existing cluster: this function is `if exists; then skip`, so a
              # stream already created with `limits` KEEPS it. Run `nats stream rm INGEST` once (it is a
              # work queue — draining it first is the whole point) and let this Job recreate it, or the
              # chart is correct while the cluster is not, which is the drift being closed.
              add_workqueue_if_missing() {
                if nats --server "$S" stream info "$1" >/dev/null 2>&1; then
                  echo "stream $1 already exists"
                else
                  nats --server "$S" stream add "$1" \
                    --subjects "$2" --storage file --retention work \
                    --max-age=168h --max-bytes=-1 --max-msgs=-1 --max-msgs-per-subject=-1 \
                    --max-msg-size=-1 --discard old --dupe-window=2m --replicas {{ (hasKey .Values.nats "streamReplicas") | ternary .Values.nats.streamReplicas 1 }} \
                    --no-allow-rollup
                fi
              }
              # RETENTION IS A FAN-OUT CORRECTNESS INVARIANT, and nothing asserted it.
              #
              # Both creation helpers are `if exists; then skip`, so a stream created ONCE with the wrong
              # retention keeps it forever and the chart is right while the cluster is wrong — exactly the
              # drift the work-queue helper below documents for that stream, generalised. (Kept off one
              # line on purpose: `test_the_INGEST_stream_has_ONE_definition_and_the_chart_agrees_with_the_code`
              # finds the creation call by scanning for a line naming both the stream and the helper, so a
              # COMMENT mentioning both hijacks it — which is exactly what this comment first did.)
              # What each wrong value
              # costs is not cosmetic:
              #
              #   work      on a stream with MULTIPLE per-app durables: the FIRST ack deletes the message,
              #             so the apps steal deliveries from each other. The cascade silently under-runs —
              #             every consumer looks healthy and each sees a fraction of the traffic.
              #   interest  empties the stream whenever no durable is attached, which is precisely the
              #             state an ephemeral `deliverPolicy=all` replay consumer relies on NOT being.
              #
              # Neither shows up as an error anywhere: they present as "some events did not arrive". So it
              # is checked here and FAILS THE JOB, rather than logged — a warning in a Job nobody reads is
              # how the INGEST drift survived to be measured live on 2026-08-06.
              assert_retention() {
                local want="$2" got
                # `sed`, not `jq` — the durable-drift loop below parses the same way, and this Job's
                # image (natsio/nats-box) is not guaranteed to carry jq. One parsing idiom per file.
                got=$(nats --server "$S" stream info "$1" --json 2>/dev/null | sed -n 's/.*"retention":[ ]*"\([a-z]*\)".*/\1/p' | head -1)
                if [ -z "$got" ]; then
                  echo "stream $1: not present yet — creation below will set retention=$want"
                elif [ "$got" != "$want" ]; then
                  echo "!! STREAM $1 HAS retention=$got, THE CHART INTENDS $want."
                  echo "!! A stream is never re-created once it exists, so this cannot self-heal."
                  echo "!! work-on-a-shared-stream makes per-app durables steal each other's deliveries;"
                  echo "!! interest empties the stream for the ephemeral replay consumer. Both look like"
                  echo "!! 'some events did not arrive'."
                  echo "!! Drain it and run: nats --server $S stream rm $1   then re-run this Job."
                  exit 1
                else
                  echo "stream $1: retention=$got (as intended)"
                fi
              }
              for stream in LINEAGE MEDALLION TRAINING DLQ{{ if .Values.catalog.controlEmit }} CATALOG_CONTROL{{ end }}; do
                assert_retention "$stream" limits
              done
              assert_retention INGEST work

              add_if_missing LINEAGE "lineage.events.>"
              add_if_missing MEDALLION "medallion.>"
              add_if_missing TRAINING "training.>"
              # DLQ parks dead-lettered deliveries (dapr.resiliency — the sidecar publishes to dlq.*
              # after retry exhaustion). Its OWN stream for two load-bearing reasons: Dapr does NOT
              # auto-create streams (a parking publish with no stream FAILS, silently un-parking the
              # message), and NATS scopes consumer names PER STREAM — the dlq.* subscriptions reuse
              # each app's durableName, which only avoids clashing with the app's main consumer
              # because the two live on different streams.
              add_if_missing DLQ "dlq.>"
              # The ingest plane's own stream (open_ingest.md Phase 0): unit tasks on
              # `ingest.tasks.<run>` and the last-worker drained signal on `ingest.run.<id>.drained`.
              # Its OWN stream rather than a subject space on MEDALLION, because MEDALLION carries tier
              # PUBLICATION events (medallion.<tier>.<dataset>) whose retention and consumer model are
              # unrelated: ingest units are work-queue traffic consumed exactly once, tier events are a
              # doorbell every mover may read. Dead-lettered units park on `dlq.ingest.tasks`, already
              # covered by the DLQ stream above.
              #
              # DELIBERATELY NOT in the durable-drift reconcile loop below — the same structural reason
              # CATALOG_CONTROL is absent, not an oversight. That loop deletes any durable whose
              # max_deliver/backoff differ from the values Dapr's pubsub components are templated with.
              # The ingest work queue is a raw nats-py pull consumer (WorkQueuePolicy retention, batch
              # fetch, nak(delay), in_progress heartbeats — semantics the Dapr component cannot express;
              # open_ingest.md "Client choices"), so its config would never match EXP_MAXD/EXP_BOFF and
              # every run of this Job would delete the queue out from under in-flight ingest work.
              # Revisit only if ingest moves onto a Dapr subscription (open decision §7.5), at which
              # point it joins the loop like any other app.
              add_workqueue_if_missing INGEST "ingest.>"
              {{- if .Values.catalog.controlEmit }}
              # Control-plane change-events (grants/warehouses/policies/tables) broadcast to EVERY catalog
              # replica's ring buffer (GET /v1/events). Its own stream so a parking-free broadcast publish
              # can't fail for want of a stream. Consumers are EPHEMERAL (no durableName) → they are NOT in
              # the durable-drift reconcile loop below, and deliverPolicy=new means retention isn't
              # load-bearing (a booting replica skips the backlog rather than replaying it into memory).
              add_if_missing CATALOG_CONTROL "catalog.control.>"
              {{- end }}
              # Reconcile app-durable config drift (the UPGRADE path): a Dapr jetstream subscription
              # can only BIND an existing durable whose config matches its request — after a values
              # change that alters consumer config (e.g. the resiliency flip's maxDeliver/backOff),
              # the pre-existing durable makes every subscribe fail forever with "consumer name
              # already in use" while pods stay Ready: a SILENT dead subscription (hit live
              # 2026-07-13 — the whole cascade sat idle after the Batch-18 roll). Expected values
              # are templated from the SAME conditional the pubsub components render, so the two
              # cannot drift apart. A drifted durable is deleted; the sidecar's subscribe-retry
              # recreates it with the new config within seconds. deliverPolicy=new means messages
              # published inside that delete->recreate window are skipped — accepted on upgrades:
              # the alternative is a permanently dead subscription. Matching durables are untouched
              # (ordinary restarts re-attach as before). Backoff values are nanoseconds in the JSON.
              EXP_MAXD="{{ if .Values.dapr.resiliency.enabled }}3{{ else }}5{{ end }}"
              EXP_BOFF="{{ if .Values.dapr.resiliency.enabled }}720000000000,720000000000{{ else }}30000000000,60000000000,120000000000,300000000000{{ end }}"
              # ONE-TIME MIGRATION (2026-08-08, the per-app DLQ rename): DLQ-stream durables created
              # before MEDALLION_DLQ_TOPIC became dlq.<appId> hold filter subjects dlq.<subTopic>
              # (dlq.medallion.*). The sidecar now requests the SAME durable name with the new filter,
              # which is exactly the bind failure documented below — "consumer name already in use"
              # forever, a SILENT dead subscription — and the config-drift loop cannot catch it: the
              # stale durables' max_deliver/backoff still match EXP. Before the fix a park was
              # double-counted but visible; after an upgrade WITHOUT this migration it is invisible.
              # Filter-based, not name-based, so it is idempotent and touches nothing current: no
              # post-rename consumer filters on dlq.medallion.* (new mover DLQs are dlq.<appId>;
              # lineage's is dlq.lineage.events). deliverPolicy=new skips dead letters published
              # inside the delete->recreate window — the same accepted trade as the drift loop.
              for c in $(nats --server "$S" consumer ls DLQ --names 2>/dev/null | grep -- '-durable$'); do
                filt=$(nats --server "$S" consumer info DLQ "$c" --json 2>/dev/null | tr -d ' \n' | sed -n 's/.*"filter_subject":"\([^"]*\)".*/\1/p')
                case "$filt" in dlq.medallion.*)
                  echo "MIGRATE DLQ/$c: filter=$filt is pre-rename (dlq.<subTopic>) — deleting (sidecar re-creates with dlq.<appId>)"
                  nats --server "$S" consumer rm DLQ "$c" -f
                esac
              done
              for st in LINEAGE MEDALLION TRAINING DLQ; do
                for c in $(nats --server "$S" consumer ls "$st" --names 2>/dev/null | grep -- '-durable$'); do
                  info=$(nats --server "$S" consumer info "$st" "$c" --json 2>/dev/null | tr -d ' \n')
                  maxd=$(echo "$info" | sed -n 's/.*"max_deliver":\(-\{0,1\}[0-9]*\).*/\1/p')
                  boff=$(echo "$info" | sed -n 's/.*"backoff":\[\([0-9,]*\)\].*/\1/p')
                  if [ "$maxd" != "$EXP_MAXD" ] || [ "$boff" != "$EXP_BOFF" ]; then
                    echo "RECONCILE $st/$c: max_deliver=$maxd backoff=[$boff] != expected $EXP_MAXD/[$EXP_BOFF] — deleting (sidecar re-creates)"
                    nats --server "$S" consumer rm "$st" "$c" -f
                  fi
                done
              done
{{- end }}
