apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-nats-stream-{{ include "rask.bootstrapRev" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 3600
  {{- include "lance.bootstrapJobDeadline" . | nindent 2 }}
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: nats-stream
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- $creds := hasKey (include "lance.natsFiles" . | fromJson) "nats-admin-creds" }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- if $creds }}
        - { name: nats-creds, secret: { secretName: {{ include "lance.fullname" . }}-nats-admin-creds } }
        {{- end }}
      containers:
        - name: nats
          image: natsio/nats-box:0.14.5
          {{- include "lance.rootSecurityContext" . | nindent 10 }}
          env:
            - { name: HOME, value: /tmp }
            {{- if $creds }}
            - { name: NATS_CREDS, value: /etc/nats-creds/nats.creds }
            {{- end }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            {{- if $creds }}
            - { name: nats-creds, mountPath: /etc/nats-creds, readOnly: true }
            {{- end }}
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          command:
            - sh
            - -c
            - |
              S="{{ include "lance.natsUrl" . }}"
              until err=$(nats --server "$S" stream ls 2>&1 >/dev/null); do
                case "$err" in *[Aa]uthoriz*|*[Aa]uthentic*|*[Pp]ermission*) echo "!! NATS refused the stream Job's credential: $err"; exit 1 ;; esac
                echo wait-nats; sleep 3
              done
              # LINEAGE carries OpenLineage events. Each stream is created once (idempotent skip).
              # streamReplicas > 1 (raft-replicated streams) needs a clustered bus of at least that many nodes.
              add_if_missing() {
                if nats --server "$S" stream info "$1" >/dev/null 2>&1; then
                  echo "stream $1 already exists"
                else
                  # `--defaults` ANSWERS THE PROMPTS, and without it nothing is created. The nats CLI asks
                  # for any option a command does not supply, and a Job has no terminal: measured
                  # 2026-09-22, `nats stream add` answered "invalid input: cannot ask for confirmation
                  # without a terminal" and MAINTENANCE_INDEX was never created while the Job reported
                  # Complete. Every other stream predates this, so the creation path was inert and the
                  # only thing that noticed was a stream listing.
                  nats --server "$S" stream add "$1" --defaults \
                    --subjects "$2" --storage file --retention limits \
                    --max-age=168h --max-bytes=-1 --max-msgs=-1 --max-msgs-per-subject=-1 \
                    --max-msg-size=-1 --discard old --dupe-window=2m --replicas {{ (hasKey .Values.nats "streamReplicas") | ternary .Values.nats.streamReplicas 1 }} \
                    --no-allow-rollup --deny-delete --deny-purge \
                    || { echo "!! FAILED to create stream $1 — a publisher would have nowhere to land"; exit 1; }
                fi
              }
              # A WORK QUEUE is not a retained log, and it needs its own creation path: a message is
              # REMOVED once acked, which is what makes the stream itself the outstanding-work ledger.
              # Created with `limits`, acked messages are retained 168h and `messages` stops being
              # outstanding work — measured 2026-08-06 on a live work-queue stream: retention=limits,
              # deny_purge=true, deny_delete=true.
              #
              # `--deny-purge --deny-delete` are deliberately ABSENT here. They protect a retained
              # RECORD; a work queue has none — it reclaims by ack — and a purge refused by them answers
              # err_code 10110, "stream purge not permitted".
              #
              # ONE-TIME MIGRATION on an existing cluster: this function is `if exists; then skip`, so a
              # stream already created with `limits` KEEPS it. Drain it, `nats stream rm` it once, and
              # let this Job recreate it, or the chart is correct while the cluster is not.
              add_workqueue_if_missing() {
                if nats --server "$S" stream info "$1" >/dev/null 2>&1; then
                  echo "stream $1 already exists"
                else
                  nats --server "$S" stream add "$1" --defaults \
                    --subjects "$2" --storage file --retention work \
                    --max-age=168h --max-bytes=-1 --max-msgs=-1 --max-msgs-per-subject=-1 \
                    --max-msg-size=-1 --discard old --dupe-window=2m --replicas {{ (hasKey .Values.nats "streamReplicas") | ternary .Values.nats.streamReplicas 1 }} \
                    --no-allow-rollup \
                    || { echo "!! FAILED to create stream $1 — a publisher would have nowhere to land"; exit 1; }
                fi
              }
              # RETENTION IS A FAN-OUT CORRECTNESS INVARIANT, and nothing asserted it.
              #
              # Both creation helpers are `if exists; then skip`, so a stream created ONCE with the wrong
              # retention keeps it forever and the chart is right while the cluster is wrong — exactly the
              # drift the work-queue helper below documents for that stream, generalised. What each wrong
              # value costs is not cosmetic:
              #
              #   work      on a stream with MULTIPLE per-app durables: the FIRST ack deletes the message,
              #             so the apps steal deliveries from each other. A subscriber silently under-runs —
              #             every consumer looks healthy and each sees a fraction of the traffic.
              #   interest  deletes each message once every attached durable has acked it, so the retained
              #             history a lineage REBUILD replays (a new `deliverPolicy=all` durable) is gone.
              #
              # Neither shows up as an error anywhere: they present as "some events did not arrive". So it
              # is checked here and FAILS THE JOB, rather than logged — a warning in a Job nobody reads is
              # how a work queue's retention drift survived to be measured live on 2026-08-06.
              assert_retention() {
                local want="$2" got
                # `sed`, not `jq` — the durable-drift loop below parses the same way, and this Job's
                # image (natsio/nats-box) is not guaranteed to carry jq. One parsing idiom per file.
                got=$(nats --server "$S" stream info "$1" --json 2>/dev/null | sed -n 's/.*"retention":[ ]*"\([a-z]*\)".*/\1/p' | head -1)
                if [ -z "$got" ]; then
                  echo "stream $1: not present yet — creation below will set retention=$want"
                elif [ "$got" != "$want" ]; then
                  echo "!! STREAM $1 HAS retention=$got, THE CHART INTENDS $want."
                  echo "!! A stream is never re-created once it exists, so this cannot self-heal."
                  echo "!! work-on-a-shared-stream makes per-app durables steal each other's deliveries;"
                  echo "!! interest deletes the history a lineage rebuild replays. Both look like"
                  echo "!! 'some events did not arrive'."
                  echo "!! Drain it and run: nats --server $S stream rm $1   then re-run this Job."
                  exit 1
                else
                  echo "stream $1: retention=$got (as intended)"
                fi
              }
              converge_max_ack_pending() {
                local want="$3" got
                got=$(nats --server "$S" consumer info "$1" "$2" --json 2>/dev/null | sed -n 's/.*"max_ack_pending":[ ]*\([0-9]*\).*/\1/p' | head -1)
                if [ -z "$got" ]; then
                  echo "consumer $1/$2: not present yet — Dapr creates it with maxAckPending=$want from the component"
                elif [ "$got" != "$want" ]; then
                  echo ">> consumer $1/$2 has max_ack_pending=$got, the chart intends $want — converging"
                  nats --server "$S" consumer edit "$1" "$2" --max-pending="$want" --force >/dev/null \
                    || { echo "!! FAILED to converge $1/$2 max_ack_pending — the lane keeps delivering $got units to a fleet that can run $want, and a queued unit burns its ackWait while idle"; exit 1; }
                  echo "consumer $1/$2: max_ack_pending now $want"
                else
                  echo "consumer $1/$2: max_ack_pending=$got (as intended)"
                fi
              }
              for stream in LINEAGE DLQ{{ if .Values.catalog.controlEmit }} CATALOG_CONTROL{{ end }}; do
                assert_retention "$stream" limits
              done

              add_if_missing LINEAGE "lineage.events.>"
              # DLQ parks dead-lettered deliveries (dapr.resiliency — the sidecar publishes to dlq.*
              # after retry exhaustion). Its OWN stream for two load-bearing reasons: Dapr does NOT
              # auto-create streams (a parking publish with no stream FAILS, silently un-parking the
              # message), and NATS scopes consumer names PER STREAM — the dlq.* subscriptions reuse
              # each app's durableName, which only avoids clashing with the app's main consumer
              # because the two live on different streams.
              add_if_missing DLQ "dlq.>"
              {{- if .Values.catalog.controlEmit }}
              # Control-plane change-events (grants/warehouses/policies/tables) broadcast to EVERY catalog
              # replica's ring buffer (GET /v1/events). Its own stream so a parking-free broadcast publish
              # can't fail for want of a stream. The CATALOG's own consumer is ephemeral (no durableName)
              # and deliverPolicy=new, so retention isn't load-bearing for it — a booting replica skips the
              # backlog rather than replaying it into memory.
              #
              # IT IS NOT THE ONLY CONSUMER, and this stream IS in the drift loop below because of the
              # other one. `dapr-component.yaml` renders `notifications-control-durable`, a chart-owned
              # DURABLE subscription whose maxDeliver/backOff are templated from the same
              # `dapr.resiliency.enabled` conditional as EXP_MAXD/EXP_BOFF, which is exactly the pair the
              # loop repairs; walking the stream is what makes that repair reach it.
              add_if_missing CATALOG_CONTROL "catalog.control.>"
              {{- end }}
              {{- if .Values.maintenance.workTopic }}
              # The maintenance work queue: one message per dataset, planned by the cron tick and
              # executed by the `/maintenance-work` subscription. It NEEDS a stream — Dapr does not
              # create one, and a publish with no stream fails, which would leave every tick reporting
              # units it planned and could not send.
              #
              # WORK retention: a unit is REMOVED once
              # acked, so the stream itself is the outstanding-work ledger and `messages` answers "how
              # much maintenance is still owed" without a side ledger to keep in step. A retained log
              # would answer that question wrongly by 168 hours.
              add_workqueue_if_missing MAINTENANCE_WORK "maintenance.work.>"
              # `workqueue`, NOT `work`: this is compared against the value nats-server SERIALIZES into
              # `stream info --json`, whose vocabulary is limits|interest|workqueue. `work` mismatched
              # unconditionally, so the Job exited 1 on every run and took the whole
              # `helm upgrade --wait-for-jobs` down with it (revision 34, 2026-08-15).
              assert_retention MAINTENANCE_WORK workqueue
              converge_max_ack_pending MAINTENANCE_WORK "{{ .Values.maintenance.daprAppId }}-work-durable" {{ include "lance.maintenanceMaxAckPending" . }}
              {{- end }}
              {{- if .Values.maintenance.indexTopic }}
              # The index-build lane, a SECOND work queue beside the one above. Same retention and the
              # same reason — a unit is removed once acked, so `messages` answers how many builds are
              # still owed — but its own stream because the ACK WINDOW differs by an order of
              # magnitude: `maintenance.indexAckWait` (3600s) against the work queue's 720s, and
              # `ackWait` is per-COMPONENT in Dapr's JetStream pubsub, so one stream serving both would
              # hand the index lane the compaction lane's window and redeliver every large build
              # mid-flight into a second worker building the same index.
              #
              # It NEEDS the stream for the reason the work queue does: Dapr creates none, so the
              # catalog's create_index door would answer 200 with a transaction id for a unit that
              # landed nowhere and no worker will ever run — the failure this gate ([[LH-151]]) exists
              # to make impossible.
              add_workqueue_if_missing MAINTENANCE_INDEX "maintenance.index.>"
              assert_retention MAINTENANCE_INDEX workqueue
              converge_max_ack_pending MAINTENANCE_INDEX "{{ .Values.maintenance.daprAppId }}-index-durable" {{ include "lance.maintenanceIndexMaxAckPending" . }}
              {{- end }}
              # Reconcile app-durable config drift (the UPGRADE path): a Dapr jetstream subscription
              # can only BIND an existing durable whose config matches its request — after a values
              # change that alters consumer config (e.g. the resiliency flip's maxDeliver/backOff),
              # the pre-existing durable makes every subscribe fail forever with "consumer name
              # already in use" while pods stay Ready: a SILENT dead subscription (hit live
              # 2026-07-13 — every subscriber sat idle after the Batch-18 roll). Expected values
              # are templated from the SAME conditional the pubsub components render, so the two
              # cannot drift apart. A drifted durable is deleted; the sidecar's subscribe-retry
              # recreates it with the new config within seconds. deliverPolicy=new means messages
              # published inside that delete->recreate window are skipped — accepted on upgrades:
              # the alternative is a permanently dead subscription. Matching durables are untouched
              # (ordinary restarts re-attach as before). Backoff values are nanoseconds in the JSON.
              EXP_MAXD="{{ if .Values.dapr.resiliency.enabled }}3{{ else }}5{{ end }}"
              EXP_BOFF="{{ if .Values.dapr.resiliency.enabled }}720000000000,720000000000{{ else }}30000000000,60000000000,120000000000,300000000000{{ end }}"
              # CATALOG_CONTROL joins only when its stream exists, under the SAME conditional that
              # creates it — a loop over a stream the release does not own would just log noise.
              #
              # MAINTENANCE_WORK and the index lane stay OUT, and not by oversight: their backOff is sized by the WORK, not by the fleet convention
              # (`maintenance-work-durable` renders 720s,720s,720s,720s with resiliency OFF against
              # EXP_BOFF's 30s,60s,120s,300s; the index lane's is `indexAckWait` repeated). Comparing
              # them to EXP would find a mismatch every run and delete the queue out from under
              # in-flight maintenance work. Walking them needs per-stream expected values, not this list.
              # ORPHAN PASS (LH-127), beside the drift pass rather than inside it: the two answer different
              # questions. Drift asks "is this durable's config still the one the component requests"; an
              # orphan's config matches forever, because a Dapr sidecar created it from those same templated
              # values before its app was removed. So the one class of stale durable the comparison can never
              # see is the class that never changes — measured: `lance-ray` holds four and `pages-to-gold-htr`
              # two, all reporting the expected MaxDeliver/Backoff, all bound to apps that do not exist.
              #
              # KEYED ON THE RENDERED NAME SET, never on app-ids. Three durables this chart owns are not
              # `<app-id>-durable` — the dead-letter consumer and both control lanes — so an app-id test
              # deletes them. `lance.chartDurables` is the single derivation; the chart-owns-it test asserts
              # it against the rendered Components, so a new durable that forgets the list fails there.
              EXP_DURABLES="{{ include "lance.chartDurables" . }}"
              for st in LINEAGE DLQ{{ if .Values.catalog.controlEmit }} CATALOG_CONTROL{{ end }}; do
                for c in $(nats --server "$S" consumer ls "$st" --names 2>/dev/null | grep -- '-durable$'); do
                  case " $EXP_DURABLES " in
                    *" $c "*) ;;
                    *)
                      echo "ORPHAN DURABLE $st/$c: no component in this release renders it — deleting"
                      nats --server "$S" consumer rm "$st" "$c" -f
                      ;;
                  esac
                done
              done
              for st in LINEAGE DLQ{{ if .Values.catalog.controlEmit }} CATALOG_CONTROL{{ end }}; do
                for c in $(nats --server "$S" consumer ls "$st" --names 2>/dev/null | grep -- '-durable$'); do
                  info=$(nats --server "$S" consumer info "$st" "$c" --json 2>/dev/null | tr -d ' \n')
                  maxd=$(echo "$info" | sed -n 's/.*"max_deliver":\(-\{0,1\}[0-9]*\).*/\1/p')
                  boff=$(echo "$info" | sed -n 's/.*"backoff":\[\([0-9,]*\)\].*/\1/p')
                  if [ "$maxd" != "$EXP_MAXD" ] || [ "$boff" != "$EXP_BOFF" ]; then
                    echo "RECONCILE $st/$c: max_deliver=$maxd backoff=[$boff] != expected $EXP_MAXD/[$EXP_BOFF] — deleting (sidecar re-creates)"
                    nats --server "$S" consumer rm "$st" "$c" -f
                  fi
                done
              done
