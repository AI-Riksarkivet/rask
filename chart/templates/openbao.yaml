{{- if .Values.openbao.enabled }}
{{- /*
   OpenBao (the open-source Vault fork) — the secret store, fronted by a Dapr secretstores.hashicorp.vault
   component (OpenBao is Vault-API compatible). openbao.devMode gates two paths:
     devMode=true  → `server -dev`: in-memory, auto-unsealed, fixed root token (DEMO ONLY).
     devMode=false → `server -config`: sealed, file-backed on a PVC; an operator must init + unseal it and
                     set up real auth (no fixed root token, no auto-seed). This is the prod path.

   THE FIELDS `secret/lance` MUST HOLD (prod / externalAddr — nothing auto-seeds them and no credential is
   a chart value, so an unseeded field is a fail-closed outage at first use, not a fallback):
   minio-access-key, minio-secret-key, postgres-password, publisher-oidc-password,
   publisher-oidc-client-secret (the Dex client secret), dapr-state-connection-string, dapr-app-token (the
   app-API token: ESO writes it into the `dapr-app-token` Secret daprd stamps the header from, and the doors
   compare against this field), frontend-session-secret (the zones' cookie sealing key), ray-auth-token,
   ray-compute-access-key, ray-compute-secret-key, and `<plane>-s3-secret-key` for each scoped identity
   named in values.yaml `minio` (sha256("<identity>-s3-<minio-secret-key>")[:40], `lance.scopedSecretFn`, which
   `minio-scoped-users` derives too). With `secrets.hfTokenInStore`, `hf-token` (field `token`). Beside the bundle, for every identity in
   lance.signingIdentities, two secrets: signing-public-<identity> (field `keys`) and then signing-key-<identity>
   (field `seed`), described in values.yaml `signing:`; the render refuses a non-dev store until an operator
   created them and signing.provisioned says so. Likewise nats-user-<user> per values.yaml `nats.auth` user, and
   nats-route (and nats-server, in operator mode), attested by nats.auth.provisioned. With the in-chart Collector,
   otel-collector-greptime (fields username, password), the credential the audit store admits. The devMode seed below is the
   authoritative list — keep this comment and that `bao kv put` in sync.

   TWO CONSUMERS, ONE KEY (2026-08-09). `publisher-oidc-client-secret` now serves the publish saga AND
   the MinIO StatefulSet's STS AssumeRoleWithWebIdentity config — there is one Dex client (`dex.clientId`),
   so there is one secret. The Tenant reaches it by a different ROUTE, not a different key: it is a
   third-party operator-managed CR with no daprd sidecar, so it cannot read the Dapr secret store, and
   it consumes the value as a `secretKeyRef` into the infra-credentials Secret (external-secrets syncs
   that key FROM this one). Do NOT seed a second `dex-client-secret` field to tidy the naming: a
   rotation that updates one copy and not the other breaks STS-assume on a path nothing tests.
*/}}
{{- $signers := include "lance.signingIdentities" . | splitList " " | compact }}
{{- $mint := and .Values.openbao.devMode (not .Values.openbao.externalAddr) $signers }}
{{- $nats := include "lance.natsMints" . }}
{{- $natsUsers := include "lance.natsUsers" . | splitList " " | compact }}
{{- $natsTable := include "lance.natsTable" . | fromJson }}
{{- $otel := .Values.observability.otelCollector | default dict }}
{{- $otelSeed := and .Values.observability.enabled $otel.enabled (not $otel.externalEndpoint) }}
{{- if not .Values.openbao.devMode }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lance.openbaoHost" . }}-config
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  config.hcl: |
    storage "file" { path = "/openbao/data" }
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1   # demo cluster; prod terminates TLS here (mount real certs) or at the mesh
    }
    disable_mlock = true
    ui = false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lance.openbaoHost" . }}-data
  labels: {{- include "lance.labels" . | nindent 4 }}
  # Keep the sealed secret store across `helm uninstall` (same reclaim caveat as the object store's PVCs) — losing it
  # would discard every secret; a reinstall re-adopts it and the operator unseals with the existing keys.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.openbao.storage }} } }
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.openbaoHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports:
    - { name: http, port: {{ .Values.openbao.port }}, targetPort: 8200 }
  selector:
    app.kubernetes.io/component: openbao
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.openbaoHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.openbao.devMode }}
  {{- /* SURGE BEFORE REMOVING: the seed carries the signing pairs over from the pod the Service still
         routes to, which exists only while the outgoing pod serves until its replacement is Ready. */}}
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: openbao
    spec:
      serviceAccountName: {{ include "lance.openbaoServiceAccount" . }}
      {{- /* The Kubernetes auth backend reviews ESO's login with THIS pod's token and reads the API
           server's CA beside it (openbao-auth-delegator.yaml). ESO is a prerequisite, so it always holds one. */}}
      automountServiceAccountToken: true
      {{- if .Values.security.infraContexts.enabled }}
      # Per-image uid/fsGroup from values (the audit: data/secret holders need runAsUser+fsGroup for
      # their PVCs — no blind helper reuse). Flag default OFF: flip after the kind boot check (§7a).
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.infraContexts.openbao.runAsUser }}
        {{- with .Values.security.infraContexts.openbao.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- end }}
      {{- if or $mint $nats }}
      initContainers:
        {{- /* MINT: a candidate pair per signing identity on a memory volume the server never mounts, and nsc and nk for the seed's bus users
               (values.yaml `signing:`, `nats.auth`). Prints names only and always exits 0. */}}
        - name: mint
          image: {{ required "signing.mintImage is unset — upgrade with --reset-then-reuse-values, not --reuse-values" (.Values.signing).mintImage }}
          {{- include "lance.rootlessSecurityContext" 65532 | nindent 10 }}
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          env:
            - { name: SIGNING_DIR, value: /signing }
            {{- if $nats }}
            - { name: NATS_TOOLS, value: /nats-tools }
            {{- end }}
          volumeMounts:
            - { name: signing, mountPath: /signing }
            {{- if $nats }}
            - { name: nats-tools, mountPath: /nats-tools }
            {{- end }}
          command:
            - sh
            - -c
            - |
              set -f
              umask 077
              {{- include "lance.signingShapes" . | nindent 14 }}
              for id in {{ join " " $signers }}; do
                out=$(nk -gen user -pubout 2>/dev/null) || { echo "mint: nk failed for $id"; continue; }
                s=; p=
                for w in $out; do
                  if seed_shaped "$w"; then s=$w; elif pub_shaped "$w"; then p=$w; fi
                done
                if [ -z "$s" ] || [ -z "$p" ]; then echo "mint: no key pair for $id"; continue; fi
                printf '%s' "$s" > "$SIGNING_DIR/$id.seed.new"
                printf '%s' "$p" > "$SIGNING_DIR/$id.pub.new"
                mv "$SIGNING_DIR/$id.seed.new" "$SIGNING_DIR/$id.seed"
                mv "$SIGNING_DIR/$id.pub.new" "$SIGNING_DIR/$id.pub"
                chmod 0400 "$SIGNING_DIR/$id.seed" "$SIGNING_DIR/$id.pub"
                echo "mint: key pair for $id"
              done
              {{- if $nats }}
              cp "$(command -v nsc)" "$(command -v nk)" "$NATS_TOOLS/" && echo "mint: nsc and nk for the bus users" || echo "mint: could not copy nsc and nk"
              {{- end }}
              exit 0
      {{- end }}
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          {{- if .Values.openbao.devMode }}
          args: ["server", "-dev", "-dev-root-token-id={{ .Values.openbao.devToken }}", "-dev-listen-address=0.0.0.0:8200"]
          {{- else }}
          args: ["server", "-config=/openbao/config/config.hcl"]
          {{- end }}
          env:
            - { name: BAO_ADDR, value: "http://127.0.0.1:8200" }
          ports:
            - { name: http, containerPort: 8200 }
          {{- if not .Values.openbao.devMode }}
          volumeMounts:
            - { name: config, mountPath: /openbao/config }
            - { name: data, mountPath: /openbao/data }
          {{- end }}
          readinessProbe:
            {{- if .Values.openbao.devMode }}
            {{- /* READY ONCE SEEDED: the seed container writes this key last, so the Service routes a sidecar
                   only to a store holding the whole seed, and a server restarted in place leaves the
                   endpoints until it is seeded again. */}}
            httpGet:
              path: /v1/secret/data/openbao-seeded
              port: 8200
              httpHeaders: [{ name: X-Vault-Token, value: {{ .Values.openbao.devToken | quote }} }]
            periodSeconds: 3
            {{- else }}
            # sealed/uninitialized return 200 so the pod is Ready once the server is UP — a prod (sealed)
            # server still needs an operator to `bao operator init` + unseal before it serves secrets.
            httpGet: { path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200", port: 8200 }
            initialDelaySeconds: 4
            periodSeconds: 10
            {{- end }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "openbao") | nindent 12 }}
        {{- if .Values.openbao.devMode }}
        {{- /* THE POD SEEDS ITS OWN STORE. A seed that reaches the store through the Service writes to
               whichever pod the Service routes to, and during a rollout that is the outgoing pod, whose
               in-memory store is deleted with it. This container writes only to the server beside it,
               writes last the key that server's readiness reads, and stays running: a server restarted in
               place comes back empty, and the loop at the end seeds it again with the same values. */}}
        - name: seed
          image: {{ .Values.openbao.image }}
          {{- include "lance.rootlessSecurityContext" 65532 | nindent 10 }}
          {{- /* the bao CLI writes a token file under $HOME, which a read-only rootfs turns into a failure. HOME on the tmp
                 emptyDir is the pair every app container in this chart already uses, and the signing pairs the
                 seed keeps there outlive a restart of either container. */}}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            - { name: dev-credentials, mountPath: /dev-credentials, readOnly: true }
            {{- if .Values.secrets.hfTokenInStore }}
            - { name: supplied-credentials, mountPath: /supplied, readOnly: true }
            {{- end }}
            {{- if or $mint $nats }}
            - { name: signing, mountPath: /signing }
            {{- end }}
            {{- if $nats }}
            - { name: nats-tools, mountPath: /nats-tools, readOnly: true }
            {{- end }}
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          env:
            - { name: BAO_ADDR, value: "http://127.0.0.1:8200" }
            - { name: BAO_TOKEN, value: {{ .Values.openbao.devToken | quote }} }
            - { name: HOME, value: /tmp }
            - { name: DEV_CREDENTIALS, value: /dev-credentials }
            {{- if .Values.secrets.hfTokenInStore }}
            - { name: SUPPLIED_CREDENTIALS, value: /supplied }
            {{- end }}
            {{- if or $mint $nats }}
            - { name: SIGNING_DIR, value: /signing }
            {{- end }}
            {{- if $nats }}
            - { name: NATS_TOOLS, value: /nats-tools }
            {{- end }}
          command:
            - sh
            - -c
            - |
              {{- /* ERREXIT FOR THE WHOLE SCRIPT, never inside `seed`: POSIX ignores -e for every command of an
                     AND-OR list but the last, so `seed || exit 1` would run a failed write straight on to the
                     readiness key. Each check that may fail on purpose sits in an `if`, `until` or `&&`. */}}
              set -e
              mkdir -p "$HOME/seed"
              {{- /* nsc reads its working directory, and the image's is not readable as this user (measured in nats-box 0.19.7). */}}
              cd "$HOME"
              svc_get() {
                if got=$(BAO_ADDR=http://{{ include "lance.openbaoHost" . }}:{{ .Values.openbao.port }} BAO_CLIENT_TIMEOUT=5s bao kv get -field="$2" "secret/$1" 2>&1); then return 0; fi
                case "$got" in
                  "No value found at"*|*"connect: connection refused") got=; return 3 ;;
                esac
                echo "cannot read secret/$1 behind the Service, refusing to write over it: $got" >&2
                exit 1
              }
              {{- if or $mint $nats }}
              {{- /* ONE PAIR PER SIGNING IDENTITY, chosen from the kept copy, the store behind the Service, then the mint candidate
                     (values.yaml `signing:`). A value travels through shell variables, files and `@file` arguments, never argv or output. */}}
              {{- include "lance.signingShapes" . | nindent 14 }}
              put_pair() {
                k="$HOME/seed/signing-key-$1"; p="$HOME/seed/signing-public-$1"
                if [ -f "$k" ] && [ -f "$p" ] && seed_shaped "$(cat "$k")" && keys_shaped "$(cat "$p")"; then
                  how=kept
                else
                  rm -f "$k" "$p" "$k.new" "$p.new"
                  if svc_get "signing-key-$1" seed; then cs=$got; hs=1; else cs=; hs=0; fi
                  if svc_get "signing-public-$1" keys; then ol=$got; hk=1; else ol=; hk=0; fi
                  if [ $hs = 1 ] && [ $hk = 1 ]; then
                    seed_shaped "$cs" && keys_shaped "$ol" || { echo "the signing pair for $1 behind the Service is malformed, refusing to replace it" >&2; exit 1; }
                    ck=$ol; how=carried
                  elif [ $hs = 1 ]; then
                    echo "signing-key-$1 is served without signing-public-$1, refusing to publish another list for it" >&2; exit 1
                  else
                    cs=$(cat "$SIGNING_DIR/$1.seed" 2>/dev/null || true); cand=$(cat "$SIGNING_DIR/$1.pub" 2>/dev/null || true)
                    if ! { seed_shaped "$cs" && pub_shaped "$cand"; }; then echo "no signing key pair was minted for $1: its signer stays not Ready" >&2; return 0; fi
                    ck=$cand; how=minted
                    if [ $hk = 1 ]; then
                      keys_shaped "$ol" || { echo "signing-public-$1 behind the Service is malformed, refusing to replace it" >&2; exit 1; }
                      ck="$cand,${ol%%,*}"; how=rotated
                    fi
                  fi
                  (umask 077; printf '%s' "$cs" > "$k.new")
                  (umask 077; printf '%s' "$ck" > "$p.new")
                  mv "$k.new" "$k"
                  mv "$p.new" "$p"
                fi
                rm -f "$SIGNING_DIR/$1.seed" "$SIGNING_DIR/$1.pub"
                bao kv put "secret/signing-public-$1" keys=@"$p" >/dev/null
                bao kv put "secret/signing-key-$1" seed=@"$k" >/dev/null
                echo "signing pair for $1: $how"
              }
              {{- end }}
              {{- if $nats }}
              {{- /* THE BUS CREDENTIALS (values.yaml `nats.auth`): the trust root and the route credential carried from the store behind the
                     Service or minted, then every user of the table issued afresh under that root, the whole bundle kept before the first write. */}}
              nsc() { "$NATS_TOOLS/nsc" -H "$B/nsc" "$@"; }
              nats_user() {
                out=$("$NATS_TOOLS/nk" -gen user -pubout 2>/dev/null) || { echo "nk failed for NATS user $1" >&2; exit 1; }
                s=; p=
                for w in $out; do
                  if seed_shaped "$w"; then s=$w; elif pub_shaped "$w"; then p=$w; fi
                done
                [ -n "$s" ] && [ -n "$p" ] || { echo "nk made no key pair for NATS user $1" >&2; exit 1; }
                err=$(nsc add user -a APP -n "$1" -k "$p" --allow-pub "$2" --allow-sub "$3" 2>&1) || { echo "nsc could not issue NATS user $1: $err" >&2; exit 1; }
                jwt=$(nsc describe user -a APP -n "$1" --raw)
                printf '%s' "$jwt" > "$B/users/$1.jwt"
                (umask 077; printf '%s' "$s" > "$B/users/$1.seed")
              }
              nats_bundle() {
                K="$HOME/seed/nats"; B="$K.new"; how=kept
                if [ ! -f "$K/done" ]; then
                  rm -rf "$B"; mkdir -p "$B/users" "$B/nsc"
                  if svc_get nats-root nsc; then
                    { printf '%s' "$got" | base64 -d | tar -xzf - -C "$B/nsc" && nsc describe account -n APP --raw; } >/dev/null 2>&1 \
                      || { echo "secret/nats-root behind the Service is malformed, refusing to replace the trust root the bus holds" >&2; exit 1; }
                    how=carried
                  else
                    err=$({ nsc add operator -n rask --sys && nsc add account -n APP && nsc delete user -a SYS -n sys \
                      && nsc edit account -n APP --js-tier 0 --js-disk-storage -1 --js-mem-storage 0 --js-streams -1 --js-consumer -1; } 2>&1) \
                      || { echo "nsc could not mint a NATS trust root, so this store stays not Ready: $err" >&2; exit 1; }
                    how=minted
                  fi
                  if svc_get nats-route password; then printf '%s' "$got" > "$B/route.password"; else head -c 18 /dev/urandom | base64 | tr '+/' '-_' | tr -d '\n' > "$B/route.password"; fi
                  printf route > "$B/route.user"
                  {{- range $natsUsers }}
                  {{- $p := index $natsTable . }}
                  nats_user {{ . }} '{{ join "," $p.publish }}' '{{ join "," $p.subscribe }}'
                  {{- end }}
                  jwt=$(nsc describe operator --raw); printf '%s' "$jwt" > "$B/operator"
                  sys=$(nsc describe account -n SYS --field sub | tr -d '"'); app=$(nsc describe account -n APP --field sub | tr -d '"')
                  [ -n "$sys" ] && [ -n "$app" ] || { echo "the NATS trust root names no SYS or APP account" >&2; exit 1; }
                  printf '%s' "$sys" > "$B/system_account"
                  printf '{"%s":"%s","%s":"%s"}' "$sys" "$(nsc describe account -n SYS --raw)" "$app" "$(nsc describe account -n APP --raw)" > "$B/resolver_preload"
                  rm -rf "$B/nsc/creds" "$B/nsc/keys/U" "$B"/nsc/*/accounts/*/users "$B/nsc/users"
                  tar -czf - -C "$B/nsc" . | base64 | tr -d '\n' > "$B/root"
                  rm -rf "$B/nsc"; : > "$B/done"; rm -rf "$K"; mv "$B" "$K"
                fi
                bao kv put secret/nats-root nsc=@"$K/root" >/dev/null
                bao kv put secret/nats-server operator=@"$K/operator" system_account=@"$K/system_account" resolver_preload=@"$K/resolver_preload" >/dev/null
                bao kv put secret/nats-route user=@"$K/route.user" password=@"$K/route.password" >/dev/null
                for u in {{ join " " $natsUsers }}; do bao kv put "secret/nats-user-$u" jwt=@"$K/users/$u.jwt" seed=@"$K/users/$u.seed" >/dev/null; done
                echo "NATS trust root $how, {{ len $natsUsers }} users"
              }
              {{- end }}
              {{- $baseFixture := include "lance.baseFixture" . | fromJson }}
              {{- /* EVERY GENERATED VALUE REACHES THE STORE AS `@file`, never argv, output or the render ([[XC-004]]):
                     the dev credentials from the ESO-generated Secret, and what is derived from them from files
                     written here. The two Dex values are the bundled IdP's own (dex.yaml carries them, XC-025). */}}
              G=$DEV_CREDENTIALS
              {{- include "lance.scopedSecretFn" . | nindent 14 }}
              {{- /* THE MOUNTED CREDENTIALS ARE READ ON EVERY SEED, and a change to them is a reason to seed: kubelet
                     refreshes a mounted Secret in place, so rotating a key of `<release>-dev-credentials` (or the
                     operator's hf-token) reaches the store through the loop below without replacing this pod, whose
                     replacement without a surge would re-mint the signing pairs and the NATS root (OPERATORS.md 6-8). */}}
              fingerprint() {
                cat "$G/minio-secret-key" "$G/postgres-password" "$G/dapr-app-token" "$G/ray-auth-token" "$G/frontend-session-secret" \
                  {{- if .Values.secrets.hfTokenInStore }} "$SUPPLIED_CREDENTIALS/hf-token"{{ end }} 2>/dev/null | sha256sum | cut -d' ' -f1
              }
              derive() {
                for k in minio-secret-key postgres-password dapr-app-token ray-auth-token frontend-session-secret; do
                  [ -s "$G/$k" ] || { echo "the generated dev credential $k is missing, so this store stays not Ready" >&2; exit 1; }
                done
                root=$(cat "$G/minio-secret-key")
                (umask 077; printf 'postgres://%s:%s@%s:%s/%s?sslmode=disable' {{ .Values.age.user | squote }} "$(cat "$G/postgres-password")" {{ include "lance.ageConnectHost" . | squote }} {{ .Values.age.port | squote }} {{ .Values.age.stateDb | squote }} > "$HOME/seed/dapr-state-dsn")
                {{- range $id := list .Values.minio.rayComputeAccessKey .Values.minio.maintenanceAccessKey .Values.minio.medallionAccessKey .Values.minio.catalogAccessKey .Values.minio.lineageAccessKey .Values.minio.viewerAccessKey | compact | uniq }}
                scoped_secret {{ $id }} "$HOME/seed/scoped-{{ $id }}"
                {{- end }}
                {{- range $ref, $_ := $baseFixture }}
                scoped_secret {{ $ref }} "$HOME/seed/base-{{ $ref }}"
                {{- end }}
              }
              seed() {
              seen=$(fingerprint)
              derive
              bao kv put secret/lance minio-secret-key=@"$G/minio-secret-key" \
                minio-access-key={{ .Values.minio.accessKey }} postgres-password=@"$G/postgres-password" \
                publisher-oidc-password={{ .Values.dex.publisher.password }} \
                publisher-oidc-client-secret={{ .Values.dex.clientSecret }} \
                dapr-state-connection-string=@"$HOME/seed/dapr-state-dsn" \
                {{- /* THE APP-API-TOKEN, so a pod can authenticate its Dapr doors without the value passing
                       through its environment (`RASK_APP_TOKEN_FROM_STORE`). ESO writes the same field into the
                       `dapr-app-token` Secret daprd stamps the header from, so the two agree by construction. */}}
                dapr-app-token=@"$G/dapr-app-token" ray-auth-token=@"$G/ray-auth-token" \
                frontend-session-secret=@"$G/frontend-session-secret" \
                {{- /* THE COMPUTE PLANE'S SCOPED PAIR, which `external-secrets.yaml` READS into
                       `infra-credentials`. ESO syncs a Secret whole or not at all, so a property it reads and
                       nothing writes takes every pod mounting that Secret down (measured 2026-09-09: the
                       AGE consumers, the OpenFGA migrate Job, the bucket-init Job, the OTel Collector and
                       all seven web zones in CreateContainerConfigError). */}}
                ray-compute-access-key={{ .Values.minio.rayComputeAccessKey | default .Values.minio.accessKey }} \
                ray-compute-secret-key=@"{{ ternary (printf "$HOME/seed/scoped-%s" .Values.minio.rayComputeAccessKey) "$G/minio-secret-key" (not (not .Values.minio.rayComputeAccessKey)) }}" \
                {{- /* THE MAINTENANCE PLANE'S SCOPED S3 SECRET, when one is provisioned. Its own field
                       rather than a second value on `minio-secret-key`: that field IS the tenant root's
                       secret and other services read it, so overwriting it would repoint the whole
                       estate at a credential scoped to maintenance's prefixes. Seeded only when both
                       halves of the pair are set, matching the Deployment's own `$scoped` test — a
                       field the service is told to read and nothing writes is a fail-closed boot, since
                       `fetch_required_secrets` raises rather than degrading. */}}
                {{- if $.Values.minio.maintenanceAccessKey }}
                maintenance-s3-secret-key=@"$HOME/seed/scoped-{{ $.Values.minio.maintenanceAccessKey }}" \
                {{- end }}
                {{- /* THE MEDALLION PLANE'S SCOPED S3 SECRET, on the same terms as maintenance's: its own
                       field rather than a second value on `minio-secret-key`, which IS the tenant root's
                       secret that other services read. Seeded only when both halves of the pair are set,
                       matching the Deployment's own `$medScoped` test — a field the service is told to
                       read and nothing writes is a fail-closed boot, since `fetch_required_secrets`
                       raises rather than degrading. */}}
                {{- if $.Values.minio.medallionAccessKey }}
                medallion-s3-secret-key=@"$HOME/seed/scoped-{{ $.Values.minio.medallionAccessKey }}" \
                {{- end }}
                {{- /* THE CATALOG'S OWN GATE, matching the Deployment's own `$catalogScoped` test
                       (`services.yaml:129`) exactly as the medallion block above matches `$medScoped`
                       and the lineage block below matches `$linScoped`. It rode the MEDALLION's flag,
                       so blanking `minio.medallionAccessKey` while keeping the catalog's own identity
                       left the catalog told to read `catalog-s3-secret-key` and nobody writing it —
                       which the comment above already names as a fail-closed boot, since
                       `fetch_required_secrets` raises rather than degrading. Measured 2026-09-24 by
                       rendering `--set minio.medallionAccessKey=`: the catalog Deployment carries
                       `LANCE_DAPR_SECRET_S3_FIELD = "catalog-s3-secret-key"` while the seed writes
                       only lineage's and maintenance's fields. One service's identity could take
                       another service down at boot. */}}
                {{- if $.Values.minio.catalogAccessKey }}
                catalog-s3-secret-key=@"$HOME/seed/scoped-{{ $.Values.minio.catalogAccessKey }}" \
                {{- end }}
                {{- /* THE LINEAGE PLANE'S SCOPED S3 SECRET, on the same terms as the two above: its own
                       field rather than a second value on `minio-secret-key`, which IS the tenant root's
                       secret that other services read. Seeded only when the access key is set, matching
                       the Deployment's own `$linScoped` test — a field the service is told to read and
                       nothing writes is a fail-closed boot, since `fetch_required_secrets` raises rather
                       than degrading. */}}
                {{- if $.Values.minio.lineageAccessKey }}
                lineage-s3-secret-key=@"$HOME/seed/scoped-{{ $.Values.minio.lineageAccessKey }}" \
                {{- end }}

              echo "seeded secret/lance into OpenBao"
              {{- if $otelSeed }}
              {{- /* THE COLLECTOR'S AUDIT-STORE CREDENTIAL ([[XC-003]]), create-if-absent: kept, else carried from the store behind
                     the Service, else minted. */}}
              c="$HOME/seed/otel-collector-greptime"
              if [ ! -s "$c" ]; then
                if svc_get otel-collector-greptime password; then v=$got; else v=$(head -c 30 /dev/urandom | base64 | tr '+/' '-_' | tr -d '\n'); fi
                (umask 077; printf '%s' "$v" > "$c")
              fi
              bao kv put secret/otel-collector-greptime username=otel-collector password=@"$c" >/dev/null
              {{- end }}

              {{- if $nats }}
              nats_bundle
              {{- end }}
              {{- if $mint }}
              {{- range $signers }}
              put_pair {{ . }}
              {{- end }}
              {{- end }}
              {{- if $.Values.minio.viewerAccessKey }}

              {{- /* THE OBJECT BROWSER'S CREDENTIALS, as their OWN secret rather than two more keys on
                     the `lance` bundle. `objects.py::_creds` fetches a per-STORE secret by name and
                     reads `access_key`/`secret_key` from it, so the store registry can point a store at
                     a credential without every reader of the shared bundle gaining it. That is the
                     mechanism the viewer already had and did not use: with no `secret` on a store it
                     fell back to process env, which is how `AWS_ACCESS_KEY_ID=rustfsadmin` came to sit
                     in its environment on a pod that HAS a Dapr sidecar. */}}
              bao kv put secret/viewer-s3 \
                access_key={{ $.Values.minio.viewerAccessKey }} \
                secret_key=@"$HOME/seed/scoped-{{ $.Values.minio.viewerAccessKey }}" >/dev/null
              echo "seeded secret/viewer-s3 into OpenBao"
              {{- end }}
              {{- /* values.yaml `catalog.multibase.devSeed`: each data base's credential, under the name its reference gives. */}}
              {{- range $ref, $_ := $baseFixture }}
              bao kv put secret/{{ $ref }} aws_access_key_id={{ $ref }} {{ include "lance.catalogSecretField" $ }}=@"$HOME/seed/base-{{ $ref }}" >/dev/null
              echo "seeded secret/{{ $ref }} into OpenBao"
              {{- end }}
              {{- if $.Values.secrets.hfTokenInStore }}
              if [ -s "$SUPPLIED_CREDENTIALS/hf-token" ]; then
                bao kv put secret/hf-token token=@"$SUPPLIED_CREDENTIALS/hf-token" >/dev/null
                echo "seeded secret/hf-token into OpenBao"
              else
                echo "secrets.hfTokenInStore is set and no supplied hf-token is mounted: secret/hf-token stays absent" >&2
              fi
              {{- end }}
              {{- /* THE AUTH HALF ESO NEEDS, and without it the KV half above is unreachable.

                     `external-secrets.yaml` renders a SecretStore that authenticates to OpenBao with
                     `auth.kubernetes` at mountPath `{{ $.Values.externalSecrets.kubernetesAuthPath }}`
                     assuming role `{{ $.Values.externalSecrets.role }}`. Measured 2026-09-08: the
                     operator ran 3/3 with ZERO SecretStores in the cluster while nothing enabled that
                     auth backend or created that role, so every ExternalSecret sat in SecretSyncedError,
                     which reads as a broken deploy rather than a missing prerequisite.

                     IT BELONGS IN THE SEED because this is the one place that already holds the root
                     token and already writes the exact path the role must be allowed to read; a
                     separate bootstrap would need a second copy of both.

                     THE POLICY IS SCOPED TO NAMED PATHS, not the mount. ESO is a controller with standing
                     access, so `read` on `secret/data/lance`, and on each NATS credential a pod without a
                     sidecar mounts (`lance.natsFiles`), is the whole grant — no list, no other path, no
                     write. Zero trust applies to the thing fetching the secrets too.

                     EVERY STEP IS IDEMPOTENT: `auth enable` on an existing mount is the only one that
                     errors, and it is the expected outcome on re-run. */}}
              bao auth enable -path={{ $.Values.externalSecrets.kubernetesAuthPath }} kubernetes 2>/dev/null || echo "kubernetes auth already enabled"
              bao write auth/{{ $.Values.externalSecrets.kubernetesAuthPath }}/config \
                kubernetes_host="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT"
              bao policy write {{ $.Values.externalSecrets.role }} - <<'POLICY'
              path "{{ $.Values.externalSecrets.kvMount }}/data/{{ $.Values.externalSecrets.secretPath }}" {
                capabilities = ["read"]
              }
              {{- range $files := include "lance.natsFiles" $ | fromJson }}{{- range $files }}
              path "{{ $.Values.externalSecrets.kvMount }}/data/{{ . }}" { capabilities = ["read"] }
              {{- end }}{{- end }}
              {{- if $.Values.secrets.hfTokenInStore }}
              path "{{ $.Values.externalSecrets.kvMount }}/data/hf-token" { capabilities = ["read"] }
              {{- end }}
              {{- if $otelSeed }}
              path "{{ $.Values.externalSecrets.kvMount }}/data/otel-collector-greptime" { capabilities = ["read"] }
              {{- end }}
              POLICY
              bao write auth/{{ $.Values.externalSecrets.kubernetesAuthPath }}/role/{{ $.Values.externalSecrets.role }} \
                bound_service_account_names={{ $.Values.externalSecrets.serviceAccount | default "external-secrets" }} \
                bound_service_account_namespaces={{ $.Values.externalSecrets.namespace | default "external-secrets" }} \
                policies={{ $.Values.externalSecrets.role }} ttl=1h
              echo "provisioned kubernetes auth + role {{ $.Values.externalSecrets.role }} for ESO"
              bao kv put secret/openbao-seeded pod="$HOSTNAME" >/dev/null
              (umask 077; printf '%s' "$seen" > "$HOME/seed/fingerprint")
              echo "seeded this pod's store"
              }
              until bao status >/dev/null 2>&1; do echo wait-openbao; sleep 1; done
              seed
              while sleep 5; do
                if out=$(bao kv get -field=pod secret/openbao-seeded 2>&1); then
                  [ "$(fingerprint)" = "$(cat "$HOME/seed/fingerprint")" ] && continue
                  echo "the mounted credentials changed; seeding again"; seed; continue
                fi
                case "$out" in
                  "No value found at"*) echo "this pod's store lost its seed; seeding it again"; seed ;;
                esac
              done
        {{- end }}
      volumes:
        {{- if .Values.openbao.devMode }}
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- /* GENERATED IN THE CLUSTER by ESO (external-secrets.yaml); the pod starts once it exists. */}}
        {{- /* 0444, not 0400 + an fsGroup: the seed (uid 65532) reads these, and an fsGroup would also make the pod's SA token
               0640 root:<fsGroup>, which the server cannot read once it drops to its own user, so its Kubernetes auth would
               review ESO's logins with ESO's own token and refuse them (measured 2026-10-10, rev 293). The pod's containers
               are the store's own server, mint and seed. */}}
        - { name: dev-credentials, secret: { secretName: {{ include "lance.fullname" . }}-dev-credentials, defaultMode: 0444 } }
        {{- if .Values.secrets.hfTokenInStore }}
        {{- /* THE OPERATOR'S BOOTSTRAP for third-party credentials (`make k3s-up` writes it from HF_TOKEN). */}}
        - { name: supplied-credentials, secret: { secretName: {{ include "lance.fullname" . }}-supplied-credentials, optional: true, defaultMode: 0444 } }
        {{- end }}
        {{- if or $mint $nats }}
        - { name: signing, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        {{- end }}
        {{- if $nats }}
        - { name: nats-tools, emptyDir: { sizeLimit: 64Mi } }
        {{- end }}
        {{- else }}
        - { name: config, configMap: { name: {{ include "lance.openbaoHost" . }}-config } }
        - { name: data, persistentVolumeClaim: { claimName: {{ include "lance.openbaoHost" . }}-data } }
        {{- end }}
{{- end }}{{/* openbao.enabled */}}
