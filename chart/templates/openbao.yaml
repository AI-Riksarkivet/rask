{{- if .Values.openbao.enabled }}
# OpenBao (the open-source Vault fork) — the secret store, fronted by a Dapr secretstores.hashicorp.vault
# component (OpenBao is Vault-API compatible). openbao.devMode gates two paths:
#   devMode=true  → `server -dev`: in-memory, auto-unsealed, fixed root token (DEMO ONLY).
#   devMode=false → `server -config`: sealed, file-backed on a PVC; an operator must init + unseal it and
#                   set up real auth (no fixed root token, no auto-seed). This is the prod path.
#
# THE FIELDS `secret/lance` MUST HOLD (prod / externalAddr — nothing auto-seeds them, and the chart
# omits every plaintext env row behind the secretsViaDapr guard, so an unseeded field is a fail-closed
# outage at first use, not a fallback): minio-secret-key, postgres-password, publisher-oidc-password,
# publisher-oidc-client-secret (the Dex client secret — added 2026-08-08 when the last plaintext env
# credential moved behind the guard; "the last" was wrong, see below), dapr-state-connection-string,
# dapr-app-token (the app-API token, for any pod whose doors read it from here rather than from env —
# it must equal the value the `dapr-app-token` Secret holds, since daprd stamps the header from that
# Secret and the app compares against this field), plus one service-token-<identity> per subject listed
# in any *_PRIVILEGED_SUBJECTS. The devMode seed below is the authoritative list — keep this comment and
# that `bao kv put` in sync.
#
# TWO CONSUMERS, ONE KEY (2026-08-09). `publisher-oidc-client-secret` now serves the publish saga AND
# the MinIO StatefulSet's STS AssumeRoleWithWebIdentity config — there is one Dex client (`dex.clientId`),
# so there is one secret. The Tenant reaches it by a different ROUTE, not a different key: it is a
# third-party operator-managed CR with no daprd sidecar, so it cannot read the Dapr secret store, and
# it consumes the value as a `secretKeyRef` into the infra-credentials Secret (external-secrets syncs
# that key FROM this one). Do NOT seed a second `dex-client-secret` field to tidy the naming: a
# rotation that updates one copy and not the other breaks STS-assume on a path nothing tests.
{{- if not .Values.openbao.devMode }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lance.openbaoHost" . }}-config
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  config.hcl: |
    storage "file" { path = "/openbao/data" }
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1   # demo cluster; prod terminates TLS here (mount real certs) or at the mesh
    }
    disable_mlock = true
    ui = false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lance.openbaoHost" . }}-data
  labels: {{- include "lance.labels" . | nindent 4 }}
  # Keep the sealed secret store across `helm uninstall` (same reclaim caveat as the object store's PVCs) — losing it
  # would discard every secret; a reinstall re-adopts it and the operator unseals with the existing keys.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.openbao.storage }} } }
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.openbaoHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports:
    - { name: http, port: {{ .Values.openbao.port }}, targetPort: 8200 }
  selector:
    app.kubernetes.io/component: openbao
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.openbaoHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.openbao.devMode }}
  {{- /* SURGE BEFORE REMOVING: the seed carries the minted tokens over from the pod the Service still
         routes to, which exists only while the outgoing pod serves until its replacement is Ready. */}}
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: openbao
    spec:
      serviceAccountName: {{ include "lance.openbaoServiceAccount" . }}
      {{- /* The Kubernetes auth backend reviews ESO's login with THIS pod's token and reads the API
           server's CA beside it (openbao-auth-delegator.yaml). Nothing else logs in that way, so
           without ESO the pod holds no token. */}}
      automountServiceAccountToken: {{ .Values.externalSecrets.enabled | default false }}
      {{- if .Values.security.infraContexts.enabled }}
      # Per-image uid/fsGroup from values (the audit: data/secret holders need runAsUser+fsGroup for
      # their PVCs — no blind helper reuse). Flag default OFF: flip after the kind boot check (§7a).
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.infraContexts.openbao.runAsUser }}
        {{- with .Values.security.infraContexts.openbao.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- end }}
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          {{- if .Values.openbao.devMode }}
          args: ["server", "-dev", "-dev-root-token-id={{ .Values.openbao.devToken }}", "-dev-listen-address=0.0.0.0:8200"]
          {{- else }}
          args: ["server", "-config=/openbao/config/config.hcl"]
          {{- end }}
          env:
            - { name: BAO_ADDR, value: "http://127.0.0.1:8200" }
          ports:
            - { name: http, containerPort: 8200 }
          {{- if not .Values.openbao.devMode }}
          volumeMounts:
            - { name: config, mountPath: /openbao/config }
            - { name: data, mountPath: /openbao/data }
          {{- end }}
          readinessProbe:
            {{- if .Values.openbao.devMode }}
            {{- /* READY ONCE SEEDED: the seed container writes this key last, so the Service routes a sidecar
                   only to a store holding the whole seed, and a server restarted in place leaves the
                   endpoints until it is seeded again. */}}
            httpGet:
              path: /v1/secret/data/openbao-seeded
              port: 8200
              httpHeaders: [{ name: X-Vault-Token, value: {{ .Values.openbao.devToken | quote }} }]
            periodSeconds: 3
            {{- else }}
            # sealed/uninitialized return 200 so the pod is Ready once the server is UP — a prod (sealed)
            # server still needs an operator to `bao operator init` + unseal before it serves secrets.
            httpGet: { path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200", port: 8200 }
            initialDelaySeconds: 4
            periodSeconds: 10
            {{- end }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "openbao") | nindent 12 }}
        {{- if .Values.openbao.devMode }}
        {{- /* THE POD SEEDS ITS OWN STORE. A seed that reaches the store through the Service writes to
               whichever pod the Service routes to, and during a rollout that is the outgoing pod, whose
               in-memory store is deleted with it. This container writes only to the server beside it,
               writes last the key that server's readiness reads, and stays running: a server restarted in
               place comes back empty, and the loop at the end seeds it again with the same values. */}}
        - name: seed
          image: {{ .Values.openbao.image }}
          {{- include "lance.rootlessSecurityContext" 65532 | nindent 10 }}
          {{- /* the bao CLI writes a token file under $HOME, which a read-only rootfs turns into a failure. HOME on the tmp
                 emptyDir is the pair every app container in this chart already uses, and the minted tokens the
                 seed keeps there outlive a restart of either container. */}}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          env:
            - { name: BAO_ADDR, value: "http://127.0.0.1:8200" }
            - { name: BAO_TOKEN, value: {{ .Values.openbao.devToken | quote }} }
            - { name: HOME, value: /tmp }
          command:
            - sh
            - -c
            - |
              {{- /* ERREXIT FOR THE WHOLE SCRIPT, never inside `seed`: POSIX ignores -e for every command of an
                     AND-OR list but the last, so `seed || exit 1` would run a failed write straight on to the
                     readiness key. Each check that may fail on purpose sits in an `if`, `until` or `&&`. */}}
              set -e
              mkdir -p "$HOME/seed"
              {{- /* MINTED HERE, ONCE, when nothing else holds the value ([[LH-304]]). A token the operator
                     supplied, or one a daprd-less pod mounts from `infra-credentials`, has a stable
                     source and is written as rendered. Any other would be `randAlphaNum` again on every
                     render — nothing it could be looked up from — so each upgrade rotated it under the
                     signers it did not restart: measured 2026-09-26, lineage refused the catalog's
                     events "signature does not verify" after a chart-only upgrade. So it is never
                     rendered: the seed takes the value it wrote before (kept under $HOME through a restart
                     of either container), else the one the store behind the Service holds (another pod,
                     Ready so seeded, which a rollout keeps serving until this one is Ready), and mints
                     only into a clean absence: that store answering "No value found", or no pod serving,
                     which the Service answers "connection refused" (both measured on OpenBao 2.2.0,
                     2026-10-02). Any other read failure stops the seed rather than rotating a credential
                     it could not see. */}}
              {{- /* A VALUE IS CHECKED BEFORE IT IS KEPT, so one bad read cannot outlive a restart: a kept copy
                     that fails the check is read again from behind the Service rather than trusted. */}}
              token_shaped() { case "$1" in *[!A-Za-z0-9]*) return 1 ;; esac; [ "${#1}" -eq 40 ]; }
              put_minted() {
                tok=$(cat "$HOME/seed/$1" 2>/dev/null || true)
                if ! token_shaped "$tok"; then
                  if tok=$(BAO_ADDR=http://{{ include "lance.openbaoHost" . }}:{{ .Values.openbao.port }} BAO_CLIENT_TIMEOUT=5s bao kv get -field=token "secret/$1" 2>&1); then
                    token_shaped "$tok" || { echo "secret/$1 behind the Service is not a 40-character token, refusing to replace it" >&2; return 1; }
                  else
                    case "$tok" in
                      "No value found at"*|*"connect: connection refused") ;;
                      *) echo "cannot read secret/$1 behind the Service, refusing to mint over it: $tok" >&2; return 1 ;;
                    esac
                    tok=$(dd if=/dev/urandom bs=96 count=1 2>/dev/null | base64 | tr -dc 'A-Za-z0-9' | cut -c1-40)
                    token_shaped "$tok" || { echo "could not mint a 40-character token for $1" >&2; return 1; }
                    echo "minted secret/$1"
                  fi
                  printf '%s' "$tok" > "$HOME/seed/$1.new"
                  mv "$HOME/seed/$1.new" "$HOME/seed/$1"
                fi
                bao kv put "secret/$1" token="$tok" >/dev/null
              }
              seed() {
              bao kv put secret/lance minio-secret-key={{ .Values.minio.secretKey }} \
                minio-access-key={{ .Values.minio.accessKey }} postgres-password={{ .Values.age.password }} \
                publisher-oidc-password={{ .Values.dex.publisher.password }} \
                publisher-oidc-client-secret={{ .Values.dex.clientSecret }} \
                dapr-state-connection-string="postgres://{{ .Values.age.user }}:{{ .Values.age.password }}@{{ include "lance.ageConnectHost" . }}:{{ .Values.age.port }}/{{ .Values.age.stateDb }}?sslmode=disable" \
                {{- /* THE APP-API-TOKEN, so a pod can authenticate its Dapr doors without the value
                       passing through its environment. `dapr.io/app-token-secret` gives the SIDECAR the
                       token; the APP has been getting it as a `secretKeyRef` env row, which is a
                       Kubernetes Secret injected as an environment variable — the path the estate's
                       secrets rule names and refuses. A pod with a sidecar can read this bundle, so
                       `RASK_APP_TOKEN_FROM_STORE` points its doors here instead.
                       SAME VALUE as the Secret `dapr-app-token.yaml` renders, and it has to be: daprd
                       stamps the header from that Secret, and the app compares against this field. Two
                       sources for one comparison is why they are both `.Values.dapr.appToken` rather
                       than independently generated. */}}
                dapr-app-token={{ .Values.dapr.appToken }} \
                {{- /* THE COMPUTE PLANE'S SCOPED PAIR. `external-secrets.yaml` READS these two
                       properties out of this secret, and until 2026-09-09 nothing WROTE them — they
                       existed only in `infra-credentials.yaml`, which renders on the ESO-OFF path.
                       So with `externalSecrets.enabled` the ExternalSecret asked OpenBao for two
                       properties that were never seeded, ESO failed the WHOLE object ("could not get
                       secret data from provider"), and `rask-infra-credentials` was never created —
                       taking every pod that mounts it with it: the AGE consumers, the OpenFGA migrate
                       Job, the bucket-init Job, the OTel Collector and all seven web zones, each
                       stuck in CreateContainerConfigError. A reader without a writer is not a partial
                       control, it is an outage, because ESO syncs a Secret whole or not at all.
                       Same expressions as the ESO-OFF path so the two agree by construction. */}}
                ray-compute-access-key={{ .Values.minio.rayComputeAccessKey | default .Values.minio.accessKey }} \
                {{- /* DERIVED like its four siblings below, never `| default minio.secretKey`. That
                     fallback published the store's ROOT credential under a scoped identity's name:
                     `rayComputeSecretKey` ships empty, so the default always won. Measured live
                     2026-09-11 by hash — `ray-compute-secret-key`, `ray-compute-access-key` and
                     `minio-secret-key` were byte-identical in `rask-infra-credentials`.
                     `minio-scoped-users.yaml` CREATES `rask-ray-compute` with the derived secret, so
                     the published pair could never match: a consumer either signed as root, defeating
                     the scoping entirely, or failed SignatureDoesNotMatch. */}}
                ray-compute-secret-key={{ include "lance.scopedStorageSecret" (list $ $.Values.minio.rayComputeAccessKey $.Values.minio.rayComputeSecretKey) }} \
                {{- /* ONE DEDICATED CREDENTIAL PER PRIVILEGED IDENTITY. Without these the binding in
                       `dapr_auth.py` is unreachable: a subject not on *_PRIVILEGED_SUBJECTS
                       authenticates with the estate's SHARED APP_API_TOKEN, so any holder of that one
                       token may claim ANY allowlisted service — including identities that hold a WRITE
                       and PUBLISH rung on every warehouse (`owner` until 2026-09-10, which also carried
                       drop, deregister, restore and grant management across every tenant). The
                       narrowing shrank the prize; it did not remove it. The control existed and was
                       tested; nothing rendered it, and
                       nothing seeded the secret it needs, so it was inert in every deployment.
                       Derived from the same medallion declarations as LANCE_FGA_CASCADE_WRITERS, so a
                       new stage runner cannot be added with an identity that has no credential of its own. */}}
                {{- /* `frontend.serviceIdentity` is here for the widest holder rather than the most
                       privileged one: SEVEN zone Deployments mount the shared bearer, and the privileged
                       block's own note records what that buys — "Reading one web pod's environment was
                       the whole attack." It needs no client half, because the BFF already reads
                       `LINEAGE_SERVICE_TOKEN` from env. */}}
                {{- /* `maintenance.catalogServiceIdentity` is on this list because the catalog's
                       `LANCE_PRIVILEGED_SUBJECTS` names it: a privileged subject whose token is not
                       seeded resolves to nothing, falls back to the shared bearer, and is refused —
                       so the SEED is a third half of this control, not an afterthought to the pair. */}}
                {{- /* Ingest claims ONE subject at TWO doors — the catalog's and the graph's — and both
                       name it privileged, so one seeded token serves both. Read from the service's own
                       declarations rather than written out, and `uniq` below collapses them when they
                       agree (they do, and the render is what proves it). */}}
                {{- /* THE SHARED DERIVATION, not a second copy of it. `lance.allServiceIdentities` already
                       feeds `lance.identitiesForApp` and the deny-list that subtracts from it, and its own
                       comment says why a copy is dangerous: "an identity seeded but not allowed here is an
                       app that boots and then 401s with nothing naming the cause". This list WAS that copy,
                       and adding the catalog's identity to it alone seeded a credential every peer's
                       deny-list stayed blind to — caught by
                       `tests/unit/test_a_dedicated_credential_is_not_readable_by_its_peers.py`, which is
                       the gate that exists for exactly this. */}}
                {{- $privileged := include "lance.allServiceIdentities" . | splitList " " }}
                {{- /* THE MAINTENANCE PLANE'S SCOPED S3 SECRET, when one is provisioned. Its own field
                       rather than a second value on `minio-secret-key`: that field IS the tenant root's
                       secret and other services read it, so overwriting it would repoint the whole
                       estate at a credential scoped to maintenance's prefixes. Seeded only when both
                       halves of the pair are set, matching the Deployment's own `$scoped` test — a
                       field the service is told to read and nothing writes is a fail-closed boot, since
                       `fetch_required_secrets` raises rather than degrading. */}}
                {{- if $.Values.minio.maintenanceAccessKey }}
                maintenance-s3-secret-key={{ include "lance.scopedStorageSecret" (list $ $.Values.minio.maintenanceAccessKey $.Values.minio.maintenanceSecretKey) }} \
                {{- end }}
                {{- /* THE MEDALLION PLANE'S SCOPED S3 SECRET, on the same terms as maintenance's: its own
                       field rather than a second value on `minio-secret-key`, which IS the tenant root's
                       secret that other services read. Seeded only when both halves of the pair are set,
                       matching the Deployment's own `$medScoped` test — a field the service is told to
                       read and nothing writes is a fail-closed boot, since `fetch_required_secrets`
                       raises rather than degrading. */}}
                {{- if $.Values.minio.medallionAccessKey }}
                medallion-s3-secret-key={{ include "lance.scopedStorageSecret" (list $ $.Values.minio.medallionAccessKey $.Values.minio.medallionSecretKey) }} \
                {{- end }}
                {{- /* THE CATALOG'S OWN GATE, matching the Deployment's own `$catalogScoped` test
                       (`services.yaml:129`) exactly as the medallion block above matches `$medScoped`
                       and the lineage block below matches `$linScoped`. It rode the MEDALLION's flag,
                       so blanking `minio.medallionAccessKey` while keeping the catalog's own identity
                       left the catalog told to read `catalog-s3-secret-key` and nobody writing it —
                       which the comment above already names as a fail-closed boot, since
                       `fetch_required_secrets` raises rather than degrading. Measured 2026-09-24 by
                       rendering `--set minio.medallionAccessKey=`: the catalog Deployment carries
                       `LANCE_DAPR_SECRET_S3_FIELD = "catalog-s3-secret-key"` while the seed writes
                       only lineage's and maintenance's fields. One service's identity could take
                       another service down at boot. */}}
                {{- if $.Values.minio.catalogAccessKey }}
                catalog-s3-secret-key={{ include "lance.scopedStorageSecret" (list $ $.Values.minio.catalogAccessKey $.Values.minio.catalogSecretKey) }} \
                {{- end }}
                {{- /* THE LINEAGE PLANE'S SCOPED S3 SECRET, on the same terms as the two above: its own
                       field rather than a second value on `minio-secret-key`, which IS the tenant root's
                       secret that other services read. Seeded only when the access key is set, matching
                       the Deployment's own `$linScoped` test — a field the service is told to read and
                       nothing writes is a fail-closed boot, since `fetch_required_secrets` raises rather
                       than degrading. */}}
                {{- if $.Values.minio.lineageAccessKey }}
                lineage-s3-secret-key={{ include "lance.scopedStorageSecret" (list $ $.Values.minio.lineageAccessKey $.Values.minio.lineageSecretKey) }} \
                {{- end }}

              echo "seeded secret/lance into OpenBao"

              {{- /* EACH DEDICATED CREDENTIAL AS ITS OWN SECRET ([[XC-072]]), which is what makes it
                     scopeable at all. Dapr grants by secret NAME — the `{key}` in
                     `GET /v1.0/secrets/{store}/{key}` — and never by field within one, so while these
                     lived on the `lance` bundle the only grant expressible was the whole bundle.
                     Measured live 2026-09-23 before the split: `.../secrets/lance-secrets/lance`
                     answered 200 with 21 fields to the `medallion-producer` pod, eight of them other
                     identities' credentials, and `.../service-token-service-ingest` answered 500
                     because it was not an addressable secret.
                     SAME SHAPE AS `secret/viewer-s3` below, for the reason that one already states:
                     a credential in its own secret can be handed to one reader without every reader of
                     the shared bundle gaining it.
                     SQUOTED because `auth.serviceTokens` lets an operator supply this value: a generated
                     token is alphanumeric and safe bare, but a credential from a secret manager carries
                     `+/=` and can carry `$`, which this `sh -c` would expand — seeding a DIFFERENT value
                     than the mounted half and 401ing that identity with no error anywhere. */}}
              {{- $mounted := include "lance.mountedServiceIdentities" $ | splitList " " }}
              {{- range (compact $privileged | uniq | sortAlpha) }}
              {{- if or (get (default dict $.Values.auth.serviceTokens) .) (has . $mounted) }}
              bao kv put secret/service-token-{{ . }} token={{ include "lance.dedicatedServiceToken" (list $ .) | squote }}
              {{- else }}
              put_minted service-token-{{ . }}
              {{- end }}
              {{- end }}
              echo "seeded the per-identity service credentials into OpenBao"
              {{- if $.Values.minio.viewerAccessKey }}

              {{- /* THE OBJECT BROWSER'S CREDENTIALS, as their OWN secret rather than two more keys on
                     the `lance` bundle. `objects.py::_creds` fetches a per-STORE secret by name and
                     reads `access_key`/`secret_key` from it, so the store registry can point a store at
                     a credential without every reader of the shared bundle gaining it. That is the
                     mechanism the viewer already had and did not use: with no `secret` on a store it
                     fell back to process env, which is how `AWS_ACCESS_KEY_ID=rustfsadmin` came to sit
                     in its environment on a pod that HAS a Dapr sidecar. */}}
              bao kv put secret/viewer-s3 \
                access_key={{ $.Values.minio.viewerAccessKey }} \
                secret_key={{ include "lance.scopedStorageSecret" (list $ $.Values.minio.viewerAccessKey $.Values.minio.viewerSecretKey) }}
              echo "seeded secret/viewer-s3 into OpenBao"
              {{- end }}

              {{- if $.Values.externalSecrets.enabled }}
              {{- /* THE AUTH HALF ESO NEEDS, and without it the KV half above is unreachable.

                     `external-secrets.yaml` renders a SecretStore that authenticates to OpenBao with
                     `auth.kubernetes` at mountPath `{{ $.Values.externalSecrets.kubernetesAuthPath }}`
                     assuming role `{{ $.Values.externalSecrets.role }}`. Measured 2026-09-08: the
                     operator ran 3/3 with ZERO SecretStores in the cluster, and nothing in this repo
                     enabled that auth backend or created that role — so flipping
                     `externalSecrets.enabled` alone leaves every ExternalSecret in SecretSyncedError,
                     which reads as a broken deploy rather than a missing prerequisite.

                     IT BELONGS IN THE SEED because this is the one place that already holds the root
                     token and already writes the exact path the role must be allowed to read; a
                     separate bootstrap would need a second copy of both.

                     THE POLICY IS SCOPED TO ONE PATH, not the mount. ESO is a controller with standing
                     access, so `read` on `secret/data/lance` is the whole grant — no list, no other
                     path, no write. Zero trust applies to the thing fetching the secrets too.

                     EVERY STEP IS IDEMPOTENT: `auth enable` on an existing mount is the only one that
                     errors, and it is the expected outcome on re-run. */}}
              bao auth enable -path={{ $.Values.externalSecrets.kubernetesAuthPath }} kubernetes 2>/dev/null || echo "kubernetes auth already enabled"
              bao write auth/{{ $.Values.externalSecrets.kubernetesAuthPath }}/config \
                kubernetes_host="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT"
              {{- /* ESO READS THE PER-IDENTITY SECRETS TOO ([[XC-072]]), and its policy has to say so.
                     The split moved every `service-token-<identity>` out of the `lance` bundle into its
                     own secret, and this policy granted read on exactly ONE path — so the pods that get
                     their credential through ESO rather than a Dapr sidecar (the Ray lane, the web
                     zones) lost it silently: ESO cannot read what no policy grants, and an unsynced key
                     is an EMPTY value, not an error. Measured: the baked dummy-lane job posting to
                     `rask-lineage:8000/api/v1/lineage` answered `403 Forbidden`.
                     ENUMERATED, NOT GLOBBED. `service-token-*` would hand ESO every identity's
                     credential and re-open exactly what the split closed; these are the three groups
                     `external-secrets.yaml` actually delivers. */}}
              bao policy write {{ $.Values.externalSecrets.role }} - <<'POLICY'
              path "{{ $.Values.externalSecrets.kvMount }}/data/{{ $.Values.externalSecrets.secretPath }}" {
                capabilities = ["read"]
              }
              {{- if $.Values.auth.dedicatedServiceCredentials }}
              {{- range (list $.Values.medallion.train.trainerIdentity $.Values.frontend.serviceIdentity | compact) }}
              path "{{ $.Values.externalSecrets.kvMount }}/data/service-token-{{ . }}" {
                capabilities = ["read"]
              }
              {{- end }}
              {{- range $.Values.medallion.stageRunners }}
              {{- if .serviceIdentity }}
              path "{{ $.Values.externalSecrets.kvMount }}/data/service-token-{{ .serviceIdentity }}" {
                capabilities = ["read"]
              }
              {{- end }}
              {{- end }}
              {{- end }}
              POLICY
              bao write auth/{{ $.Values.externalSecrets.kubernetesAuthPath }}/role/{{ $.Values.externalSecrets.role }} \
                bound_service_account_names={{ $.Values.externalSecrets.serviceAccount | default "external-secrets" }} \
                bound_service_account_namespaces={{ $.Values.externalSecrets.namespace | default "external-secrets" }} \
                policies={{ $.Values.externalSecrets.role }} ttl=1h
              echo "provisioned kubernetes auth + role {{ $.Values.externalSecrets.role }} for ESO"
              {{- end }}
              bao kv put secret/openbao-seeded pod="$HOSTNAME" >/dev/null
              echo "seeded this pod's store"
              }
              until bao status >/dev/null 2>&1; do echo wait-openbao; sleep 1; done
              seed
              while sleep 5; do
                out=$(bao kv get -field=pod secret/openbao-seeded 2>&1) && continue
                case "$out" in
                  "No value found at"*) echo "this pod's store lost its seed; seeding it again"; seed ;;
                esac
              done
        {{- end }}
      volumes:
        {{- if .Values.openbao.devMode }}
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- else }}
        - { name: config, configMap: { name: {{ include "lance.openbaoHost" . }}-config } }
        - { name: data, persistentVolumeClaim: { claimName: {{ include "lance.openbaoHost" . }}-data } }
        {{- end }}
{{- end }}{{/* openbao.enabled */}}
