{{- if .Values.maintenance.enabled }}
{{- $root := . }}
{{- $port := .Values.maintenance.port }}
{{- if .Values.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.maintenance.bindingName }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.maintenance.schedule | quote }} }
scopes:
  - {{ .Values.maintenance.daprAppId }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.maintenance.reconcileBindingName }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.maintenance.reconcileSchedule | quote }} }
scopes:
  - {{ .Values.maintenance.daprAppId }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-maintenance
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/component: maintenance, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      annotations:
        {{- if .Values.dapr.enabled }}
        {{- include "rask.daprAnnotations" (list $root .Values.maintenance.daprAppId $port) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: maintenance
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # ships logs via the OTel SDK (OTLP) → the collector filter drops the file-tailed dup
    spec:
      terminationGracePeriodSeconds: {{ .Values.lifecycle.maintenanceTerminationGracePeriodSeconds }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-maintenance
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: maintenance
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          {{- include "lance.preStop" . | nindent 10 }}
          args:
            {{- if include "lance.otelEnabled" $root }}
            - "opentelemetry-instrument"
            {{- end }}
            - "uvicorn"
            - "maintenance.service:app"
            - "--host=0.0.0.0"
            - "--port={{ $port }}"
            {{- include "rask.shutdownArg" (list . .Values.lifecycle.maintenanceTerminationGracePeriodSeconds) | nindent 12 }}
          ports: [{ name: http, containerPort: {{ $port }} }]
          env:
            {{- include "lance.allocatorEnv" (list $root) | nindent 12 }}
            {{- if include "lance.otelEnabled" $root }}
            {{- include "lance.otelEnv" (list $root .Values.maintenance.daprAppId) | nindent 12 }}
            {{- end }}
            - { name: MAINTENANCE_DOCS, value: {{ $root.Values.docs.enabled | quote }} }
            {{- include "lance.lineageEmitEnv" (list $root) | nindent 12 }}
            - { name: DAPR_API_TIMEOUT_SECONDS, value: {{ .Values.dapr.apiTimeoutSeconds | quote }} }
            - { name: MAINTENANCE_DAPR_ENABLED, value: {{ .Values.dapr.enabled | quote }} }
            {{- with include "lance.signingEnv" (list $root .Values.maintenance.daprAppId) }}{{ . | nindent 12 }}{{- end }}
            {{- if .Values.dapr.enabled }}

{{- include "lance.appTokenEnv" (list $root $root.Values.maintenance.daprAppId) | nindent 12 }}
            {{- include "lance.busEnv" $root | nindent 12 }}
            {{- end }}
            {{- if $root.Values.maintenance.vendWriteCredentials }}
            - { name: MAINTENANCE_CATALOG_URL, value: {{ printf "http://%s-catalog:%v" (include "lance.fullname" $root) $root.Values.services.catalog.port | quote }} }
            - { name: MAINTENANCE_AUDIT_ENABLED, value: {{ hasKey $root.Values.auth "audit" | ternary $root.Values.auth.audit true | quote }} }
            - { name: MAINTENANCE_CATALOG_SERVICE_IDENTITY, value: {{ include "lance.saSubject" (list $root "maintenance") | quote }} }
            {{- end }}
            - { name: MAINTENANCE_ARRIVAL_ENABLED, value: {{ .Values.maintenance.arrivalEnabled | quote }} }
            {{- if .Values.maintenance.arrivalEnabled }}
            - { name: MAINTENANCE_ARRIVAL_DLQ_TOPIC, value: {{ .Values.maintenance.arrivalDlqTopic | quote }} }
            {{- with include "lance.doorEnv" (list $root false) }}{{ . | nindent 12 }}{{- end }}
            {{- end }}
            {{- if .Values.maintenance.lineageEmit }}
            - { name: MAINTENANCE_LINEAGE_EMIT_ENABLED, value: "true" }
            - { name: MAINTENANCE_LINEAGE_PUBSUB, value: {{ include "lance.subPubsub" (list $ .Values.maintenance.daprAppId) | quote }} }
            - { name: MAINTENANCE_LINEAGE_TOPIC, value: {{ .Values.pubsub.topic | quote }} }
            {{- if .Values.services.lineage.outbox.enabled }}
            - { name: MAINTENANCE_LINEAGE_OUTBOX_URI, value: "s3://{{ .Values.objectStore.bucket }}/_lineage_outbox" }
            {{- end }}
            {{- end }}
            - { name: MAINTENANCE_TRASH_PURGE_ENABLED, value: {{ hasKey .Values.maintenance "trashPurge" | ternary .Values.maintenance.trashPurge false | quote }} }
            - { name: MAINTENANCE_TRASH_PURGE_DRY_RUN, value: {{ hasKey .Values.maintenance "trashPurgeDryRun" | ternary .Values.maintenance.trashPurgeDryRun false | quote }} }
            - { name: MAINTENANCE_TRASH_PURGE_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "trashPurgeMaxPerTick") | ternary .Values.maintenance.trashPurgeMaxPerTick 25 | quote }} }
            - { name: MAINTENANCE_FLOOR_RAISE_ENABLED, value: {{ hasKey .Values.maintenance "floorRaise" | ternary .Values.maintenance.floorRaise false | quote }} }
            - { name: MAINTENANCE_FLOOR_RAISE_DRY_RUN, value: {{ hasKey .Values.maintenance "floorRaiseDryRun" | ternary .Values.maintenance.floorRaiseDryRun true | quote }} }
            - { name: MAINTENANCE_FLOOR_RAISE_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "floorRaiseMaxPerTick") | ternary .Values.maintenance.floorRaiseMaxPerTick 10 | quote }} }
            - { name: MAINTENANCE_TUPLE_REBUILD_ENABLED, value: {{ hasKey .Values.maintenance "tupleRebuild" | ternary .Values.maintenance.tupleRebuild false | quote }} }
            - { name: MAINTENANCE_TUPLE_REBUILD_DRY_RUN, value: {{ hasKey .Values.maintenance "tupleRebuildDryRun" | ternary .Values.maintenance.tupleRebuildDryRun true | quote }} }
            - { name: MAINTENANCE_TUPLE_REBUILD_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "tupleRebuildMaxPerTick") | ternary .Values.maintenance.tupleRebuildMaxPerTick 50 | quote }} }
            - { name: MAINTENANCE_DRIFT_REPAIR_ENABLED, value: {{ hasKey .Values.maintenance "driftRepair" | ternary .Values.maintenance.driftRepair false | quote }} }
            - { name: MAINTENANCE_DRIFT_REPAIR_DRY_RUN, value: {{ hasKey .Values.maintenance "driftRepairDryRun" | ternary .Values.maintenance.driftRepairDryRun true | quote }} }
            - { name: MAINTENANCE_DRIFT_REPAIR_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "driftRepairMaxPerTick") | ternary .Values.maintenance.driftRepairMaxPerTick 50 | quote }} }
            - { name: MAINTENANCE_TOMBSTONE_SWEEP_ENABLED, value: {{ hasKey .Values.maintenance "tombstoneSweep" | ternary .Values.maintenance.tombstoneSweep false | quote }} }
            - { name: MAINTENANCE_TOMBSTONE_SWEEP_DRY_RUN, value: {{ hasKey .Values.maintenance "tombstoneSweepDryRun" | ternary .Values.maintenance.tombstoneSweepDryRun true | quote }} }
            - { name: MAINTENANCE_TOMBSTONE_SWEEP_MAX_PER_TICK, value: {{ (hasKey .Values.maintenance "tombstoneSweepMaxPerTick") | ternary .Values.maintenance.tombstoneSweepMaxPerTick 50 | quote }} }
            - { name: MAINTENANCE_ORPHAN_SCAN_ENABLED, value: {{ hasKey .Values.maintenance "orphanScan" | ternary .Values.maintenance.orphanScan false | quote }} }
            - { name: MAINTENANCE_DISCOVERY_MAX_DEPTH, value: {{ hasKey .Values.maintenance "discoveryMaxDepth" | ternary .Values.maintenance.discoveryMaxDepth 3 | quote }} }
            - { name: MAINTENANCE_DECLARED_PLATFORM_ROOTS, value: {{ hasKey .Values.maintenance "declaredPlatformRoots" | ternary .Values.maintenance.declaredPlatformRoots "" | quote }} }
            {{- if .Values.maintenance.controlEmit }}
            - { name: MAINTENANCE_CONTROL_EMIT_ENABLED, value: "true" }
            - { name: MAINTENANCE_CONTROL_PUBSUB, value: {{ printf "%s-%s" (.Values.pubsub.controlName | default "catalog-control-pubsub") .Values.maintenance.daprAppId | quote }} }
            {{- end }}
            - { name: MAINTENANCE_BINDING_NAME, value: {{ .Values.maintenance.bindingName | quote }} }
            - { name: MAINTENANCE_OLDER_THAN_DAYS, value: {{ .Values.maintenance.olderThanDays | quote }} }
            - { name: MAINTENANCE_CLONE_LIST_MAX_AGE_SECONDS, value: {{ required "maintenance.cloneListMaxAgeSeconds is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.maintenance.cloneListMaxAgeSeconds | quote }} }
            - { name: MAINTENANCE_MIN_VERSIONS_TO_EXPIRE, value: {{ required "maintenance.minVersionsToExpire is unset — upgrade with --reset-then-reuse-values, not --reuse-values" .Values.maintenance.minVersionsToExpire | quote }} }
            - { name: MAINTENANCE_SWEEP_BUDGET_SECONDS, value: {{ hasKey .Values.maintenance "sweepBudgetSeconds" | ternary .Values.maintenance.sweepBudgetSeconds 0 | quote }} }
            - { name: MAINTENANCE_S3_ENDPOINT, value: "{{ include "lance.s3Endpoint" . }}" }


            {{- $_ := required "objectStore.maintenanceAccessKey names maintenance's scoped store identity; no service presents the store's root, which signs every STS token (ADR 0168)" .Values.objectStore.maintenanceAccessKey }}
            - { name: MAINTENANCE_SECRETS_FROM_DAPR, value: "true" }
            - { name: MAINTENANCE_DAPR_SECRET_KEY, value: "maintenance-s3" }
            - { name: MAINTENANCE_DAPR_SECRET_S3_ID_FIELD, value: "access_key" }
            - { name: MAINTENANCE_DAPR_SECRET_S3_FIELD, value: "secret_key" }
            - { name: MAINTENANCE_S3_BUCKET, value: {{ .Values.objectStore.bucket | quote }} }


            {{- $extra := list }}
            {{- range $ns, $bkt := .Values.medallion.buckets }}
            {{- if ne $bkt $.Values.objectStore.bucket }}{{ $extra = append $extra $bkt }}{{ end }}
            {{- end }}
            {{- range .Values.catalog.multibase.dataBases }}
            {{- $extra = append $extra (. | replace "s3://" "" | trimSuffix "/") }}
            {{- end }}
            - { name: MAINTENANCE_S3_EXTRA_BUCKETS, value: {{ $extra | uniq | join "," | quote }} }
            - { name: MAINTENANCE_S3_PLATFORM_BUCKETS, value: {{ include "lance.maintenancePlatformBuckets" . | quote }} }
            - { name: MAINTENANCE_S3_REGION, value: "us-east-1" }
            - { name: MAINTENANCE_RECONCILE_BINDING_NAME, value: {{ .Values.maintenance.reconcileBindingName | quote }} }
            - { name: MAINTENANCE_WAREHOUSES_ENABLED, value: {{ .Values.catalog.warehouses.enabled | default false | quote }} }
            - { name: MAINTENANCE_CONTROL_ROOT, value: {{ .Values.maintenance.controlRoot | default "" | quote }} }
            - { name: LANCE_EXTERNAL_BLOB_BASES, value: {{ include "lance.externalBlobBases" . | quote }} }
            - { name: MAINTENANCE_POLICY_ROOT, value: {{ .Values.maintenance.policyRoot | default "" | quote }} }
            {{- if .Values.auth.enabled }}
            - { name: RASK_FGA_ENABLED, value: "true" }
            - { name: RASK_FGA_API_URL, value: {{ include "lance.openfgaUrl" . | quote }} }
            {{- include "lance.fgaToken" (list "env") | nindent 12 }}

            {{- with .Values.auth.fgaStoreId }}
            - { name: RASK_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.auth.fgaModelId }}
            - { name: RASK_FGA_MODEL_ID, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
          {{- include "lance.appProbes" . | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" . "comp" "maintenance") | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            {{- include "lance.identityTokens" (list "mounts" "rask-catalog") | nindent 12 }}
            {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "mounts") | nindent 12 }}{{ end }}
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        {{- include "lance.storeIdentity" (list $root .Values.maintenance.daprAppId "volumes") | nindent 8 }}
        {{- include "lance.identityTokens" (list "volumes" "rask-catalog") | nindent 8 }}
        {{- if .Values.auth.enabled }}{{ include "lance.fgaToken" (list "volumes") | nindent 8 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-maintenance
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ $port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: maintenance, app.kubernetes.io/instance: {{ .Release.Name }} }
{{- end }}
