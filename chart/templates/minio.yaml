{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.minioHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: s3, port: {{ .Values.minio.port }}, targetPort: s3 }
    - { name: console, port: {{ .Values.minio.consolePort }}, targetPort: console }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.minioHost" . }}-hl
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: s3, port: {{ .Values.minio.port }}, targetPort: s3 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lance.minioHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "lance.minioHost" . }}-hl
  replicas: {{ .Values.minio.servers }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      serviceAccountName: {{ include "lance.fullname" . }}-sa-minio

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.security.infraContexts.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.infraContexts.minio.runAsUser }}
        {{- with .Values.security.infraContexts.minio.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- end }}
      containers:
        - name: minio
          image: {{ include "rask.image" (list . "minio") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            {{- range $i := until (int .Values.minio.volumesPerServer) }}
            - /data-{{ $i }}
            {{- end }}
            - --address
            - ":{{ .Values.minio.port }}"
            - --console-address
            - ":{{ .Values.minio.consolePort }}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lance.fullname" . }}-infra-credentials
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lance.fullname" . }}-infra-credentials
                  key: minio-secret-key
            {{- if .Values.minio.oidc.enabled }}
            - name: MINIO_IDENTITY_OPENID_CONFIG_URL
              value: "{{ .Values.dex.issuer }}/.well-known/openid-configuration"
            - name: MINIO_IDENTITY_OPENID_CLIENT_ID
              value: {{ .Values.dex.clientId | quote }}
            - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lance.fullname" . }}-infra-credentials
                  key: dex-client-secret
            - name: MINIO_IDENTITY_OPENID_SCOPES
              value: "openid,email"
            - name: MINIO_IDENTITY_OPENID_ROLE_POLICY
              value: {{ .Values.minio.oidc.rolePolicy | quote }}
            {{- end }}
          ports:
            - { name: s3, containerPort: {{ .Values.minio.port }} }
            - { name: console, containerPort: {{ .Values.minio.consolePort }} }
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /minio/health/cluster, port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{- include "lance.resources" (dict "root" . "comp" "minio") | nindent 12 }}
          {{- if .Values.security.readOnlyRootFilesystem }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          {{- end }}
          volumeMounts:
            {{- range $i := until (int .Values.minio.volumesPerServer) }}
            - { name: data-{{ $i }}, mountPath: /data-{{ $i }} }
            {{- end }}
            - { name: tmp, mountPath: /tmp }
      volumes:

        {{- include "lance.tmpVolume" . | nindent 8 }}
  volumeClaimTemplates:
    {{- range $i := until (int .Values.minio.volumesPerServer) }}
    - metadata:
        name: data-{{ $i }}
        labels:
          app.kubernetes.io/instance: {{ $.Release.Name }}
          app.kubernetes.io/component: minio
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.minio.storage | quote }}
        {{- with $.Values.minio.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
