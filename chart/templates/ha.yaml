{{- /*
HA for the stateless request-serving services — the lakehouse pair AND the fleet, derived from
`.Values.services` rather than named, plus controlplane from its own values block. Off by default
(single-node kind); the prod overlay enables the PDB after bumping replicas. The stateful stores
(AGE/RustFS) get HA from their operators in rask (CNPG / rustfs-operator), NOT from here. The
event-driven movers/producer are intentionally excluded — eviction is safe there (Dapr redelivers, and
the medallion ingest path is idempotent).

ONE RULE THROUGHOUT, and it is why every block below is gated: a `minAvailable: 1` PDB over a SINGLE
replica blocks every voluntary drain, so a node cordon hangs instead of proceeding. Scale first, bound
second. That gate used to apply only to the P5 micro-frontend zones (the Ingress-routed north-south
edge, where an unbounded drain defeats the replica bump); the backend list was a literal and ungated,
so enabling PDBs without scaling wrote exactly the budget this warning describes.
*/ -}}
{{- if .Values.podDisruptionBudget.enabled }}
{{/* EVERY service in `.Values.services`, gated on replicas > 1 — the lakehouse pair (catalog,
     lineage) and the fleet (gateway, compute, flows, ingest, notifications) alike. This was a literal
     `list "catalog" "lineage" "gateway"`, ungated: with PDBs enabled and a service left at one
     replica it wrote a `minAvailable: 1` budget over a single pod, which blocks EVERY voluntary drain
     — a node cordon then hangs instead of proceeding. That is this file's own header warning, applied
     to the backends rather than only to the zones. Scale first, bound second, never the inverse.
     `controlplane` renders from its own template and reads `.Values.controlplane`, not
     `.Values.services`; being outside this map is how it stayed invisible to chart-wide fixes, so it
     gets its own block below rather than being forgotten again. */}}
{{- range $name, $svc := $.Values.services }}
{{- if gt (int ((hasKey $svc "replicas") | ternary $svc.replicas 1)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lance.fullname" $ }}-{{ $name }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
{{- end }}
{{- if gt (int ((hasKey $.Values.controlplane "replicas") | ternary $.Values.controlplane.replicas 1)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lance.fullname" $ }}-controlplane
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: controlplane
      app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
{{- if and .Values.frontend.enabled (gt (int (ternary .Values.frontend.replicas 1 (hasKey .Values.frontend "replicas"))) 1) }}
{{- range .Values.frontend.apps }}
---
# Zone PDBs (audit 2026-07-24): the P5 zones are the north-south edge (the Ingress path-routes
# /<zone> → web-<zone>), so once replicas are bumped past 1 they need the same voluntary-disruption
# bound as the backends — without one, a node drain may evict both replicas at once and the HA replica
# count buys nothing. Gated on replicas > 1 (see the header: a 1-replica minAvailable=1 PDB blocks drains).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lance.fullname" $ }}-web-{{ .name }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: web-{{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
{{- end }}
{{- if .Values.openfga.enabled }}
---
# OpenFGA is the authz chokepoint — every governed catalog write, lineage read, and mover WRITE fails
# CLOSED through it, so a drain that evicts the quorum 503s the whole estate. Separate block: the subchart's
# pods carry name/instance labels, not our component label. (prod-readiness P2)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lance.fullname" . }}-openfga
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- range $c := list "catalog" "lineage" }}
---
# HPA on CPU for the request-serving services. Needs metrics-server. The PDB minAvailable bounds disruption
# during scale-down; the Deployment's replicas: becomes the HPA floor, so keep replicas <= minReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lance.fullname" $ }}-{{ $c }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lance.fullname" $ }}-{{ $c }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
  {{/* WITHOUT THIS THE HPA CHURNS. Kubernetes stabilises scale-UP by default and scale-DOWN not at
       all, so a burst that clears the utilization target takes the replica count to maxReplicas and
       the pass of that burst takes it straight back — repeatedly, on an I/O-bound service whose CPU
       is spiky by nature. kubernetes.md's own worked example carries this exact field with a
       five-minute cooldown, and the template had no `behavior` block at all. */}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $.Values.autoscaling.scaleDownStabilizationSeconds }}
{{- end }}
{{- end }}
