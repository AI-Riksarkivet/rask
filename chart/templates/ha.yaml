
{{- if .Values.podDisruptionBudget.enabled }}
{{/**/}}
{{- range $name, $svc := $.Values.services }}
{{- if gt (int ((hasKey $svc "replicas") | ternary $svc.replicas 1)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lance.fullname" $ }}-{{ $name }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
{{- end }}
{{- if .Values.openfga.enabled }}
---
# OpenFGA is the authz chokepoint — every governed catalog write and lineage read fails
# CLOSED through it, so a drain that evicts the quorum 503s the whole estate. Separate block: the subchart's
# pods carry name/instance labels, not our component label. (prod-readiness P2)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lance.fullname" . }}-openfga
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- range $c := list "catalog" "lineage" }}
---
# HPA on CPU for the request-serving services. Needs metrics-server. The PDB minAvailable bounds disruption
# during scale-down; the Deployment's replicas: becomes the HPA floor, so keep replicas <= minReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lance.fullname" $ }}-{{ $c }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lance.fullname" $ }}-{{ $c }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
  {{/**/}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $.Values.autoscaling.scaleDownStabilizationSeconds }}
{{- end }}
{{- end }}
