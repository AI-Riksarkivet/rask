{{- if .Values.openfga.enabled }}
# OpenFGA schema migration against the AGE Postgres (the chart's bundled migrate is broken in 0.3.9 —
# it fails to pass the datastore flags). Waits for Postgres (nc succeeds only once initdb has created
# the openfga db and TCP is open), then runs `openfga migrate` with explicit flags (idempotent). A
# post-install/upgrade hook with a low weight so it runs before the server settles.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-openfga-migrate
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  template:
    metadata:
      # Load-bearing under the prod NetworkPolicy: the age-postgres ingress allows `from`
      # component=openfga-migrate. Without this label the hook pod (and its wait-age init) can't reach
      # age:5432 — the init loops forever, the post-install hook never completes, and helm rolls the
      # release back on a policy-enforcing CNI (default-deny drops the SYN).
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: openfga-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-age
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "lance.ageConnectHost" . }} {{ .Values.age.port }}; do echo wait-age; sleep 3; done"]
          {{- if .Values.security.infraContexts.enabled }}
          # PSA-restricted compliance for the root busybox init (the audit's sequencing footgun:
          # labeling the namespace restricted would REJECT this pod until the init is hardened).
          securityContext: { runAsNonRoot: true, runAsUser: 65532, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, seccompProfile: { type: RuntimeDefault } }
          {{- end }}
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      containers:
        - name: migrate
          # Same tag as the server (values.openfga.image.tag) so the migrated schema matches.
          image: "openfga/openfga:{{ .Values.openfga.image.tag | default "v1.8.0" }}"
          # The datastore DSN (carrying the AGE password) comes from a k8s Secret env, NOT a plaintext Job
          # arg — `openfga migrate` honours OPENFGA_DATASTORE_URI. The audit's 'password-bearing DSN
          # plaintext in the migrate Job args' fix.
          env:
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: openfga-datastore-uri }
          args:
            - migrate
            - --datastore-engine=postgres
{{- end }}
