{{- if .Values.openfga.enabled }}
{{- $spec := include "lance.openfgaMigrateSpec" . }}
# OpenFGA schema migration against its Postgres (the chart's bundled migrate is broken in 0.3.9 —
# it fails to pass the datastore flags). Waits for Postgres (nc succeeds only once initdb has created
# the openfga db and TCP is open), then runs `openfga migrate` with explicit flags (idempotent).
#
# NOT a hook — see "BOOTSTRAP JOBS" in _helpers.tpl. This is THE resource that made `helm install
# --wait` deadlock: as a post-install hook it could not run until --wait finished, and --wait could not
# finish until the OpenFGA server was Ready, which it cannot be against an unmigrated schema. Applied
# in the ordinary wave the cycle disappears — helm waits for this Job and for the server at the same
# time, and this Job's own wait-postgres init supplies the only ordering that was ever really needed.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-openfga-migrate-{{ $spec | sha256sum | trunc 8 }}
  labels: {{- include "lance.labels" . | nindent 4 }}
{{ $spec }}
{{- end }}
{{- define "lance.openfgaMigrateSpec" -}}
spec:
  {{- include "lance.bootstrapJobDeadline" . | nindent 2 }}
  backoffLimit: 30
  template:
    metadata:
      # Load-bearing under a NetworkPolicy: the development Postgres's ingress allows `from`
      # component=openfga-migrate. Without this label the pod (and its wait-postgres init) can't reach
      # it — the init loops forever, the Job never completes, and `--wait` times the release out
      # on a policy-enforcing CNI (default-deny drops the SYN).
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: openfga-migrate
    spec:
      restartPolicy: OnFailure
      securityContext: { fsGroup: 65532 }
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          command: ["sh", "-c", "until nc -z {{ include "lance.postgresHost" . }} {{ .Values.postgres.port }}; do echo wait-postgres; sleep 3; done"]
          {{- include "lance.rootlessSecurityContext" 65532 | nindent 10 }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      volumes:
        {{- include "lance.tmpVolume" . | nindent 8 }}
        - name: openfga-config
          secret: { secretName: {{ include "lance.fullname" . }}-infra-credentials, items: [{ key: openfga-config.yaml, path: config.yaml }], defaultMode: 0440 }
      containers:
        - name: migrate
          # Same tag as the server (values.openfga.image.tag) so the migrated schema matches.
          image: "openfga/openfga:{{ .Values.openfga.image.tag | default "v1.18.3" }}"
          {{- include "lance.rootlessSecurityContext" 65532 | nindent 10 }}
          volumeMounts:
            {{- include "lance.tmpMount" . | nindent 12 }}
            - { name: openfga-config, mountPath: /etc/openfga, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          env:
            - { name: HOME, value: /tmp }
          args:
            - migrate
            - --datastore-engine=postgres
{{- end }}
