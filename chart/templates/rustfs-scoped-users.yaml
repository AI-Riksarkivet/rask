{{- $ray := .Values.rustfs.rayComputeAccessKey }}
{{- $maint := .Values.rustfs.maintenanceAccessKey }}
{{- $medallion := .Values.rustfs.medallionAccessKey }}
{{- $lineage := .Values.rustfs.lineageAccessKey }}
{{- $viewer := .Values.rustfs.viewerAccessKey }}
{{- if and .Values.rustfs.enabled (or $ray $maint $medallion $lineage $viewer) }}
# RustFS SCOPED USERS — the provisioning step `values.yaml` admitted was missing.
#
# `rayComputeAccessKey` shipped with the note "scripts/ has no provisioning step yet: create the policy
# and user with the mc image the mkbucket Job already uses, then set these." So the estate's one proven
# scoped-user precedent was a values knob that only a hand-run `mc` session could turn, and a fresh
# install came up on the tenant root. This is that step, written once for both consumers.
#
# WHY A POLICY AND NOT JUST A USER: a RustFS user created with no policy gets whatever the server
# defaults to, which is not a documented deny. The point of this Job is the DENY — the compaction
# credential must not reach `_projects/`, `_protection/` or `_policies/`, the records that decide what
# maintenance is permitted to do. A credential that can rewrite its own governing policy can turn off
# the shallow-clone guard that stops a compaction destroying another dataset's source.
#
# THREE POLICY LESSONS, each of which cost a broken cascade, and none of which is recoverable by
# reading the docs:
#
#   * `s3:ListBucket` is BUCKET-scoped, not object-scoped. An object-scoped rule constrains a LIST not
#     at all — the first attempt allowed the whole control plane to be listed and looked like RustFS
#     ignoring Deny.
#   * the prefix condition must be `medallion*`, NOT `medallion/*`: Lance lists with `prefix=medallion/`
#     and `StringLike` does not match a trailing-slash pattern against it.
#   * a bucket-NAME allow-list cannot govern this estate at all, because the buckets that hold tenant
#     data are minted at runtime by `POST /v1/warehouses`. See the long note above the policies.
#
# IDEMPOTENT. `mc admin policy create` OVERWRITES an existing policy — probed against this estate's
# RustFS 1.0.0-beta.8 on 2026-09-04: a second create with different content returned exit 0 and the
# readback showed the new document. So the create carries no `|| true`; the only thing one could
# swallow is a REAL failure (malformed JSON, admin denied), leaving the credential on its previous
# policy while the hook reports success. `user add` and `attach` keep theirs. Note what `user add` does
# on a re-run, because the `|| true` hides it either way: it ROTATES the existing user's secret rather
# than failing (probed 2026-09-07 — afterwards the old secret gives `SignatureDoesNotMatch` and the new
# one gives `Access Denied`, i.e. valid but unpolicied). That is what makes a derived secret converge.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rask.fullname" . }}-rustfs-scoped-users-{{ include "rask.bootstrapRev" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    {{- /* THREE PHASES, AND EACH ANSWERS A DIFFERENT FAILURE.

         `pre-upgrade` is what lets the identities be NAMED by default. With only `post-upgrade` the
         RustFS user is created after the Deployments have been updated, so pods restart holding a
         credential the object store has never heard of and 403 until the hook catches up — and that
         window is the entire reason every scoped identity shipped defaulted to the tenant ROOT key.

         `post-upgrade` STAYS, and is not a leftover: `rustfs-mkbucket` is deliberately not a hook
         (see rustfs.yaml), so it lands with the release manifest and therefore runs AFTER this
         pre-upgrade pass. An upgrade that adds a bucket would have a policy written before it exists,
         which RustFS accepts and then silently governs nothing. The post pass rewrites the same
         policies once the bucket is there — sound only because `mc admin policy create` overwrites,
         which is probed and recorded above.

         `post-install` covers the fresh install, where there is no upgrade phase to run in and no
         running pod to strand. */}}
    "helm.sh/hook": post-install,pre-upgrade,post-upgrade
    # Ordering WITHIN a phase: after any hook that provisions buckets.
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "rask.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs-scoped-users
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      containers:
        - name: mc
          image: {{ .Values.rustfs.mcImage }}
          # Every secret arrives as an env var read by `mc`, never interpolated into the rendered
          # command — the same rule the bucket-init Job follows, so a `kubectl get job -o yaml` never
          # discloses a key.
          env:
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: rustfs-secret-key }
            {{- if $maint }}
            - name: MAINTENANCE_SECRET_KEY
              value: {{ include "lance.scopedStorageSecret" (list . .Values.rustfs.maintenanceAccessKey .Values.rustfs.maintenanceSecretKey) | quote }}
            {{- end }}
            {{- if $ray }}
            - name: RAY_COMPUTE_SECRET_KEY
              value: {{ include "lance.scopedStorageSecret" (list . .Values.rustfs.rayComputeAccessKey .Values.rustfs.rayComputeSecretKey) | quote }}
            {{- end }}
            {{- if $medallion }}
            - name: MEDALLION_SECRET_KEY
              value: {{ include "lance.scopedStorageSecret" (list . .Values.rustfs.medallionAccessKey .Values.rustfs.medallionSecretKey) | quote }}
            {{- end }}
            {{- if $lineage }}
            - name: LINEAGE_SECRET_KEY
              value: {{ include "lance.scopedStorageSecret" (list . .Values.rustfs.lineageAccessKey .Values.rustfs.lineageSecretKey) | quote }}
            {{- end }}
            {{- if $viewer }}
            - name: VIEWER_SECRET_KEY
              value: {{ include "lance.scopedStorageSecret" (list . .Values.rustfs.viewerAccessKey .Values.rustfs.viewerSecretKey) | quote }}
            {{- end }}
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set rfs {{ include "lance.s3Endpoint" . }} {{ .Values.rustfs.accessKey }} "$RUSTFS_SECRET_KEY"; do echo wait-rustfs; sleep 3; done

              {{- /*
                THE BUCKET SET IS NOT KNOWABLE AT RENDER TIME, so neither policy enumerates one.

                Both credentials open buckets that no value in this chart names. `catalog.warehouses.enabled`
                (on by default) provisions one physically separate bucket per warehouse at
                `POST /v1/warehouses`, with an operator-chosen name; the Ray stage/train jobs then read and
                write `<that warehouse root>/medallion/<tier>` for every tenant trigger, and the sweep
                enumerates the same buckets itself out of the registry (`sweep.py::_buckets_to_sweep`).
                An allow-list built from `rustfs.bucket` + `medallion.buckets` + `catalog.multibase.dataBases`
                covers none of them: those three name the shared bucket, the cascade storage zones and the
                fragment-spreading allowlist, and a per-warehouse bucket is by construction in none.

                MEASURED 2026-09-04, and it is the quiet failure in both directions: a re-run of project
                `acme`'s bronze->silver edge submitted a Ray job that died `AccessDenied` listing
                `acme-bucket?prefix=medallion/_versions/` — reported by the stage runner as a failed job, by nothing
                as a missing grant — while on the sweep side `compact_one` records AccessDenied per dataset
                as an `open:` error, which reads as a broken dataset and is acked SUCCESS.

                So the shape is inverted to the one the Sids always claimed: ALLOW the data planes on every
                bucket, and DENY the control plane precisely. What is given up is bucket-name scoping, which
                was never enforcing anything an operator could rely on; what is kept, and now applies in
                EVERY bucket rather than only the statically-named ones, is the deny that this user exists
                for.

                The control bucket keeps its tight listing through `StringNotLike` on `s3:prefix` rather
                than through its name. That operator was PROBED against this estate's RustFS
                (1.0.0-beta.8) before being depended on: with `Deny s3:ListBucket` conditioned
                `StringNotLike s3:prefix medallion*`, `lance-catalog/medallion/` listed while
                `lance-catalog/` and `lance-catalog/_projects/` were denied and other buckets listed
                freely. Enforced, not ignored — which matters, because a condition RustFS dropped would
                turn a Deny into a hole rather than a hard failure.

                WHAT THE WIDENING COSTS, measured rather than reasoned about: the compute credential can
                ENUMERATE the estate's buckets. Neither policy grants `s3:ListAllMyBuckets`, and that does
                not withhold the list — RustFS answers an enumeration by falling back to per-bucket
                `ListBucket`/`GetBucketLocation`, which `arn:aws:s3:::*` grants everywhere. Driven with the
                deployed credential: `mc ls ray/` returned 104 buckets. Bucket NAMES are disclosed and, under
                the object-wildcard resource, object reads outside the denied control prefixes. (Spelling
                that wildcard out here would end this Helm comment early — the sequence closes it.)

                It stays wide because the alternative is the allow-list this replaced, which could not name
                a runtime-minted warehouse and broke every tenant's cascade — a correctness failure traded
                for a disclosure one. The narrowing that actually closes it is per-table vended credentials
                on the Ray lane, which is a service change rather than a policy one.

                Outcomes are pinned by `tests/unit/test_scoped_policies_reach_runtime_minted_warehouses.py`,
                which evaluates the rendered JSON as IAM does instead of grepping it for a bucket name — a
                grep is what let the old shape render green.
              */}}
              {{- $control := .Values.rustfs.bucket }}

              {{- if $maint }}
              # --- MAINTENANCE: rewrite data, never the records that govern the rewrite. -------------
              cat >/tmp/maintenance.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "ListAccountForReconcileDriftReport",
                    "Effect": "Allow",
                    "Action": ["s3:ListAllMyBuckets"],
                    "Resource": ["arn:aws:s3:::*"]
                  },
                  {
                    "Sid": "RewriteDataInAnyBucketTheSweepDiscovers",
                    "Effect": "Allow",
                    "Action": [
                      "s3:ListBucket",
                      "s3:GetBucketLocation",
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject",
                      "s3:AbortMultipartUpload",
                      "s3:ListMultipartUploadParts"
                    ],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  },
                  {
                    "Sid": "NeverTheRecordsThatGovernMaintenance",
                    "Effect": "Deny",
                    "Action": ["s3:PutObject", "s3:DeleteObject"],
                    "Resource": [
                      "arn:aws:s3:::*/_projects/*",
                      "arn:aws:s3:::*/_protection/*",
                      "arn:aws:s3:::*/_warehouses/*",
                      "arn:aws:s3:::*/_tasks/*",
                      "arn:aws:s3:::*/_transforms/*",
                      "arn:aws:s3:::*/_gates/*",
                      "arn:aws:s3:::*/__manifest/*"
                    ]
                  },
                  {
                    "Sid": "NeverTheObservabilityStore",
                    "Effect": "Deny",
                    "Action": ["s3:*"],
                    "Resource": ["arn:aws:s3:::{{ .Values.observability.bucket }}", "arn:aws:s3:::{{ .Values.observability.bucket }}/*"]
                  }
                ]
              }
              POLICY
              # The deny is on WRITES only: the sweep must READ `_warehouses/` to resolve the buckets it
              # sweeps and `_protection/` to compute the pre-pass verdict, and blinding it there would
              # widen what it destroys rather than narrow it.
              #
              # `_policies/` is NOT denied, and that exception is load-bearing rather than an oversight:
              # `_stamp_cadence` writes the per-dataset cadence stamp under `_policies/state/` on every
              # maintained dataset, and `_policy_skip_reason` reads a missing stamp as "maintain" — so
              # denying it would silently stop the cadence pacing anything and compact every policied
              # dataset on every tick, with nothing going red. The POLICY RECORDS themselves live at
              # `_policies/<kind>/` and are written only by the catalog, which holds a different
              # credential; this user can reach them, and narrowing that needs the stamp to move first.
              mc admin policy create rfs rask-maintenance /tmp/maintenance.json
              mc admin user add rfs {{ .Values.rustfs.maintenanceAccessKey }} "$MAINTENANCE_SECRET_KEY" || true
              mc admin policy attach rfs rask-maintenance --user {{ .Values.rustfs.maintenanceAccessKey }} || true
              echo "provisioned scoped user {{ .Values.rustfs.maintenanceAccessKey }} (rask-maintenance)"
              {{- end }}

              {{- if $ray }}
              # --- RAY COMPUTE: the cascade's stage/train jobs. ---------------------------------------
              cat >/tmp/ray-compute.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "CascadeDataInAnyWarehouse",
                    "Effect": "Allow",
                    "Action": [
                      "s3:ListBucket",
                      "s3:GetBucketLocation",
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject",
                      "s3:AbortMultipartUpload",
                      "s3:ListMultipartUploadParts"
                    ],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  },
                  {
                    "Sid": "TheControlBucketOnlyUnderTheCascadePrefix",
                    "Effect": "Deny",
                    "Action": ["s3:ListBucket"],
                    "Resource": ["arn:aws:s3:::{{ $control }}"],
                    "Condition": { "StringNotLike": { "s3:prefix": "medallion*" } }
                  },
                  {
                    "Sid": "NeverTheControlPlane",
                    "Effect": "Deny",
                    "Action": ["s3:*"],
                    "Resource": [
                      "arn:aws:s3:::*/_projects/*",
                      "arn:aws:s3:::*/_protection/*",
                      "arn:aws:s3:::*/_policies/*",
                      "arn:aws:s3:::*/_warehouses/*",
                      "arn:aws:s3:::*/_tasks/*",
                      "arn:aws:s3:::*/_transforms/*",
                      "arn:aws:s3:::*/_gates/*",
                      "arn:aws:s3:::*/_trash/*"
                    ]
                  },
                  {
                    "Sid": "NeverTheNamespaceIndex",
                    "Effect": "Deny",
                    "Action": ["s3:PutObject", "s3:DeleteObject"],
                    "Resource": ["arn:aws:s3:::*/__manifest/*"]
                  },
                  {
                    "Sid": "NeverTheObservabilityStore",
                    "Effect": "Deny",
                    "Action": ["s3:*"],
                    "Resource": ["arn:aws:s3:::{{ .Values.observability.bucket }}", "arn:aws:s3:::{{ .Values.observability.bucket }}/*"]
                  }
                ]
              }
              POLICY
              # The Ray lane's deny is TOTAL where maintenance's is write-only: a stage job reads
              # `FROM_URI` and writes `TO_URI` and touches nothing else (`scripts/ray_stage_job.py`), so it
              # has no reason to read a governance record either.
              #
              # THE DENY LISTS EVERY CONTROL PREFIX, and the four beyond the registry pair are the ones
              # that matter most here: `_tasks/<hash>.json` carries an ENGINE AND A COMMAND
              # (`service_kit/lakehouse/task_registry.py`) and `engine_choice` refuses any task nobody
              # registered — so that prefix IS the list of what this estate's compute plane may run, and the
              # Ray lane is its untrusted consumer. `_transforms/` re-points which transform a lane runs and
              # `_gates/` decides which output is admitted. `_trash/` is the only thing making a dropped
              # table restorable (#75/#96), so deleting a record strands live bytes behind an `undrop` that
              # can no longer find them — silent, and unrecoverable.
              #
              # `__manifest/` is split out because the two credentials need it differently: it is the
              # authoritative namespace->table mapping (a namespace is a ROW in it, not a directory), so
              # neither may WRITE it, while the purge must READ it to re-check a trashed id's liveness
              # before destroying bytes (`maintenance/services/purge.py`). Write-deny, not total.
              #
              # `medallion*` and not `medallion/*` —
              # Lance lists with `prefix=medallion/` and `StringLike` does not match a trailing-slash
              # pattern against it, a lesson that cost a cascade the first time this policy was written.
              mc admin policy create rfs rask-ray-compute /tmp/ray-compute.json
              mc admin user add rfs {{ .Values.rustfs.rayComputeAccessKey }} "$RAY_COMPUTE_SECRET_KEY" || true
              mc admin policy attach rfs rask-ray-compute --user {{ .Values.rustfs.rayComputeAccessKey }} || true
              echo "provisioned scoped user {{ .Values.rustfs.rayComputeAccessKey }} (rask-ray-compute)"
              {{- end }}

              {{- if $medallion }}
              # --- MEDALLION: the producer and the three stage runners. -------------------------------------
              cat >/tmp/medallion.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "CascadeDataInAnyWarehouse",
                    "Effect": "Allow",
                    "Action": [
                      "s3:ListBucket",
                      "s3:GetBucketLocation",
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject",
                      "s3:AbortMultipartUpload",
                      "s3:ListMultipartUploadParts"
                    ],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  },
                  {
                    "Sid": "NeverRewriteWhatGovernsTheCascade",
                    "Effect": "Deny",
                    "Action": ["s3:PutObject", "s3:DeleteObject"],
                    "Resource": [
                      "arn:aws:s3:::*/_projects/*",
                      "arn:aws:s3:::*/_protection/*",
                      "arn:aws:s3:::*/_policies/*",
                      "arn:aws:s3:::*/_warehouses/*",
                      "arn:aws:s3:::*/_transforms/*",
                      "arn:aws:s3:::*/_gates/*",
                      "arn:aws:s3:::*/_trash/*",
                      "arn:aws:s3:::*/__manifest/*"
                    ]
                  },
                  {
                    "Sid": "NeverTheObservabilityStore",
                    "Effect": "Deny",
                    "Action": ["s3:*"],
                    "Resource": ["arn:aws:s3:::{{ .Values.observability.bucket }}", "arn:aws:s3:::{{ .Values.observability.bucket }}/*"]
                  }
                ]
              }
              POLICY
              # A THIRD SHAPE, and reusing either existing one would have broken something. The Ray
              # lane's deny is TOTAL, which is right for a stage job — it reads `FROM_URI`, writes
              # `TO_URI` and consults nothing else — and wrong for the SERVICES that drive it: the
              # medallion reaches control records directly over S3, not through the catalog door.
              # Measured 2026-09-07: `transform_spec.resolve_task` / `resolve_transform`, `gate_specs`
              # and `project_root` READ `_tasks/`, `_transforms/`, `_gates/` and the warehouse registry,
              # so a total deny leaves every stage runner unable to resolve which transform to run.
              #
              # `_tasks/` IS ABSENT FROM THE DENY, and that is the carve-out this policy exists to make.
              # `task_register.register_ray_tasks` writes `_tasks/<hash>.json` at boot and
              # `engine_choice` refuses any task nobody registered — so this plane is that prefix's
              # REGISTRAR while the Ray lane is its untrusted consumer, and the two credentials must
              # differ there or one of them is wrong. Denying the registrar yields a cascade that can
              # run nothing, with the policy looking correct.
              #
              # Everything else is write-deny, like maintenance's and for the same reason: the reads are
              # load-bearing and the writes are not ones this plane ever makes. A stage runner that can rewrite
              # `_transforms/` re-points what it runs; one that can rewrite `_gates/` admits its own
              # blocked output; one that can delete `_trash/` strands bytes behind an undrop that can no
              # longer find them.
              mc admin policy create rfs rask-medallion /tmp/medallion.json
              mc admin user add rfs {{ .Values.rustfs.medallionAccessKey }} "$MEDALLION_SECRET_KEY" || true
              mc admin policy attach rfs rask-medallion --user {{ .Values.rustfs.medallionAccessKey }} || true
              echo "provisioned scoped user {{ .Values.rustfs.medallionAccessKey }} (rask-medallion)"
              {{- end }}

              {{- if $lineage }}
              cat >/tmp/lineage.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "ReadAnythingItReconciles",
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetObject"],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  },
                  {
                    "Sid": "DrainItsOwnOutboxAndNothingElse",
                    "Effect": "Allow",
                    "Action": ["s3:DeleteObject"],
                    "Resource": ["arn:aws:s3:::*/_lineage_outbox/*"]
                  },
                  {
                    "Sid": "NeverTheObservabilityStore",
                    "Effect": "Deny",
                    "Action": ["s3:*"],
                    "Resource": ["arn:aws:s3:::{{ .Values.observability.bucket }}", "arn:aws:s3:::{{ .Values.observability.bucket }}/*"]
                  }
                ]
              }
              POLICY
              {{- /*
                THE TIGHTEST OF THE FOUR, and it is tight because the SURFACE is small — measured
                2026-09-07 against the source rather than inferred from the service's importance.

                NO PutObject ANYWHERE, which no other plane here can say. Lineage opens datasets
                READ-ONLY to probe versions, schema and dangling blobs (`core/reconcile.py:58,76,93,108`,
                `demo.py:112`), and the only bytes it changes are DELETES of outbox objects the relay has
                already re-ingested (`outbox.drop_event`). `outbox.stage_event` — the write half — is
                called by the PRODUCERS (medallion, maintenance) and never here, so granting this
                identity a write would grant a capability it has no code to use.

                THE READ IS DELIBERATELY UNSCOPED, for the reason the two policies above already record:
                the bucket set is not knowable at render time. Lineage reconciles whatever datasets the
                graph names, across warehouses this chart does not enumerate, so a narrowed read is a
                reconciler that silently stops seeing part of the estate — and a reconciler that cannot
                read reports `known=False`, which publishes nothing and looks exactly like a healthy
                estate. That failure mode is why the read stays wide and the WRITE is what gets scoped.
              */}}
              mc admin policy create rfs rask-lineage /tmp/lineage.json
              mc admin user add rfs {{ .Values.rustfs.lineageAccessKey }} "$LINEAGE_SECRET_KEY" || true
              mc admin policy attach rfs rask-lineage --user {{ .Values.rustfs.lineageAccessKey }} || true
              echo "provisioned scoped user {{ .Values.rustfs.lineageAccessKey }} (rask-lineage)"
              {{- end }}

              {{- if $viewer }}
              cat >/tmp/viewer.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "BrowseAnythingItCanShow",
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetObject"],
                    "Resource": ["arn:aws:s3:::*", "arn:aws:s3:::*/*"]
                  }
                ]
              }
              POLICY
              {{- /*
                THE TIGHTEST POLICY IN THE ESTATE, and it can be: the object browser has no write path
                at all. `viewer/api/v1/endpoints/objects.py` calls `list_objects_v2`, `head_object` and
                `get_object`, and nothing else — so this identity needs no `PutObject` and no
                `DeleteObject`, which not even lineage's (one scoped delete on its own outbox) can say.

                THE READ STAYS WIDE ON PURPOSE. A browser that cannot list a bucket does not report a
                permission error to the operator — it renders the bucket as EMPTY, which is the same
                failure the store-registry fix already paid for once (`_client_for`: a bucket holding
                millions of objects rendered as empty, and nothing errored). Narrowing the read here
                would buy little and reintroduce the least debuggable failure this plane has.

                NO observability DENY, unlike the other three: this identity cannot write anywhere, so
                the worst it can do to that bucket is read telemetry the same operator is already
                looking at in Perses.
              */}}
              mc admin policy create rfs rask-viewer /tmp/viewer.json
              mc admin user add rfs {{ $viewer }} "$VIEWER_SECRET_KEY" || true
              mc admin policy attach rfs rask-viewer --user {{ $viewer }} || true
              echo "provisioned scoped user {{ $viewer }} (rask-viewer)"
              {{- end }}
{{- end }}
