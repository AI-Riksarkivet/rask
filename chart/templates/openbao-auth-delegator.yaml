{{- if .Values.openbao.enabled }}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lance.fullname" . }}-openbao-auth-delegator
  labels: {{- include "lance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "lance.openbaoServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
