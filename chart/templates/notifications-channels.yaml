
{{- $ch := (.Values.services.notifications).channels | default dict }}
{{- if and .Values.dapr.enabled .Values.services.notifications }}
{{- if (($ch.email).enabled) }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: notifications-email
  labels: {{- include "rask.componentLabels" (list . "notifications") | nindent 4 }}
spec:
  type: bindings.smtp
  version: v1
  metadata:
    - { name: host, value: {{ $ch.email.host | quote }} }
    - { name: port, value: {{ hasKey $ch.email "port" | ternary $ch.email.port 587 | quote }} }
    - { name: emailFrom, value: {{ $ch.email.from | quote }} }
    - name: user
      secretKeyRef: { name: {{ $ch.email.secretName | default "notifications-smtp" | quote }}, key: user }
    - name: password
      secretKeyRef: { name: {{ $ch.email.secretName | default "notifications-smtp" | quote }}, key: password }
auth:
  secretStore: {{ .Values.stateStore.secretStore | default "lance-secrets" }}
scopes:
  - notifications
{{- end }}
{{- end }}
