{{- if .Values.auth.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-bootstrap-admin
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 30
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap-admin
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes: {{- include "lance.fgaToken" (list "volumes") | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          volumeMounts: {{- include "lance.fgaToken" (list "mounts") | nindent 12 }}
          env:
            - { name: FGA_API_URL, value: {{ include "lance.openfgaUrl" . | quote }} }
            {{- include "lance.fgaToken" (list "env") | nindent 12 }}
            - { name: FGA_ROOT_OBJECT, value: "warehouse:lance_catalog" }
            {{- with .Values.auth.fgaStoreId }}
            - { name: RASK_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
          command: ["python", "-c"]
          args:
            - |
              import os, sys, time
              import httpx
              from service_kit.governed.auth.write_model import STORE_NAME, fga_headers, history, model_document
              from service_kit.governed.fga import newest_store

              api = os.environ["FGA_API_URL"].rstrip("/")
              token_file = os.environ["RASK_FGA_TOKEN_FILE"]
              obj = os.environ["FGA_ROOT_OBJECT"]
              # THE ESTATE ROOT ([[LH-055]], ruling docs/adr/0070-four-owner-answers-and-the-reference-implementation-that.md), SEEDED BEFORE ANYTHING
              # CHECKS IT. This hook is post-install/post-upgrade, so the fleet's pods are already
              # rolling when it runs; writing the tuples one release AHEAD of the repoint is what keeps
              # the window between them from being a window of 403s.
              estate_obj = "estate:rask"
              subject = {{ .Values.auth.bootstrapAdmin | quote }}
              user = subject if ":" in subject else f"user:{subject}"

              # The store the services use (RASK_FGA_STORE_ID pins one), and in it the model THIS image
              # carries ([[LH-201]]). A tuple naming no model is checked against the store's newest, i.e.
              # whichever image wrote last: in the LH-201 review (OpenFGA v1.18.3) a legacy image's newer,
              # narrower model failed every estate write on `type 'estate' not found`. Both exist once the
              # catalog has booted and the openfga-model hook has run, so wait for them.
              store_id, model_id = os.environ.get("RASK_FGA_STORE_ID"), None
              deadline = time.monotonic() + 600
              while model_id is None:
                  try:
                      if not store_id:
                          r = httpx.get(f"{api}/stores", headers=fga_headers(token_file), timeout=5)
                          r.raise_for_status()
                          store_id = (newest_store(r.json().get("stores", []), STORE_NAME) or {}).get("id")
                      carrying = history(api, store_id, model_document(), token_file=token_file).carrying if store_id else None
                      model_id = carrying and carrying["id"]
                  except (httpx.HTTPError, OSError) as exc:
                      # A refused credential is not "not ready yet": no wait mends it ([[XC-077]]).
                      status = getattr(getattr(exc, "response", None), "status_code", None) or getattr(exc, "code", None)
                      if status in (401, 403):
                          sys.exit(f"OpenFGA at {api} refused this Job's token from {token_file} ({status})")
                      print(f"openfga not ready: {exc}", flush=True)
                  if model_id is None:
                      if time.monotonic() > deadline:
                          sys.exit(f"store {store_id!r} at {api} holds no model carrying this image's body")
                      print(f"waiting for store {STORE_NAME!r} ({store_id!r}) to hold this image's model", flush=True)
                      time.sleep(5)

              # The admin's `owner`, then one `reader` per SERVICE principal that must READ governed data.
              #
              # Each grant is checked before it is written, so re-running this hook on every upgrade
              # stays a no-op — and one already-granted subject never short-circuits another that is
              # still missing, which the early `sys.exit(0)` this replaced did: it would have hidden
              # every service grant behind an admin who was already in place.
              {{- $readers := list }}
              {{- if and .Values.medallion.enabled .Values.medallion.cascadeLag.bindingName }}

              {{- $readers = append $readers .Values.medallion.producer.serviceIdentity }}
              {{- end }}
              readers = {{ $readers | toJson }}
              # MAINTAINERS are a separate list because the rung is different and the reason is
              # different. A reader observes; the maintenance plane REWRITES bytes. It holds the root
              # object-store key today and compacts every bucket with it, and the vending door replaces
              # that with a credential scoped to one table and expiring in 900s. Without a grant the vend
              # is refused and the service degrades silently back to the root key, i.e. the hardening
              # looks configured and is not.
              #
              # `maintainer`, NOT `writer` — owner ruling 2026-09-08, zero trust. The two are separate
              # rungs in both directions (`model.fga`): a maintainer may rewrite HOW a dataset is stored
              # and may not change WHAT it says. Granting the sweep `writer` is the widest write grant in
              # the estate and would make one compromised maintenance pod equivalent to compromising
              # every table it can reach. The sweep vends `tier=maintain`, which the door opens to
              # `can_maintain` alone (`credentials.py`), so this is the rung its vend needs.
              #
              # MEASURED on the live store 2026-09-09, before this line changed: `service-maintenance`
              # held `can_write_data` on 106 tables and `can_maintain` on 323. The writer grant existed
              # on exactly two warehouses and `warehouse:lance_catalog` — which parents bronze/silver/
              # gold — carried NO maintainer tuple at all, so the estate's core tiers were being
              # maintained THROUGH the write grant. Swapping the rung is therefore a grant-then-revoke,
              # never a revoke: 15 tables (`bronze$pages`, `bronze$events`, the `models$*` set) would
              # otherwise lose every rung between the two writes.
              #
              # THIS GRANT COVERS THIS WAREHOUSE ONLY, and the file header's "cascades estate-wide" is
              # true of the DEFAULT warehouse rather than of the estate. Measured against the live
              # store 2026-09-03: `warehouse:lance_catalog` parents 8 namespaces, and a
              # `can_write_data` check for this subject on `table:acme-bronze$events` — under
              # `warehouse:acme-bucket`, one of ~130 warehouses in that store — returned
              # `allowed:false` with the grant in place. A tenant warehouse created after install is
              # not covered either, since this hook runs at install/upgrade and warehouses are minted
              # by an API call. Vending therefore hardens the default warehouse today and degrades
              # (correctly, and audibly per dataset) everywhere else; closing that gap is an
              # authorization-model decision — see `docs/adr/0045-the-lakehouse-cloud-native-cutover-2026-09-03-04.md`, "The lakehouse cloud-native
              # cutover" — not a bigger tuple list.
              #
              # Never `owner`: maintenance rewrites and reclaims, it must not drop. The destructive
              # rung stays with people.
              #
              # Gated on the flag that turns the feature on, so an estate not vending grants nothing —
              # a standing grant to a service that is not using it is exactly the kind of tuple nobody
              # remembers to revoke.
              {{- $maintainers := list }}
              {{- if and .Values.maintenance.enabled .Values.maintenance.vendWriteCredentials }}
              {{- $maintainers = append $maintainers .Values.maintenance.catalogServiceIdentity }}
              {{- end }}
              maintainers = {{ $maintainers | toJson }}
              # STAGERS hold `can_stage_events`, a rung minted for this and held on the estate ROOT.
              #
              # The lineage outbox is the crash-recovery seam: a producer stages the whole RunEvent
              # under `_lineage_outbox` BEFORE it publishes, so a process that dies between the commit
              # and a durable delivery is recoverable by lineage's relay. Ingest could not write it at
              # all — measured twice inside one real run 2026-09-10, where the primary emit was refused
              # AND `stage_event` died `ACCESS_DENIED during HeadBucket`, so the run lost its lineage
              # event outright and still reported COMPLETE.
              #
              # INGEST IS THE WHOLE LIST, and its shortness is the grant working. Five services stage to
              # that prefix; four of them (the medallion producer, its stage runners, maintenance, the
              # catalog) sign with a key they already hold and call no vending door, so the rung would
              # be a standing tuple nothing exercises — the kind nobody remembers to revoke. Ingest
              # holds no S3 key BY DESIGN (STS-only, the stronger posture), which is exactly why it is
              # the one that needs a credential vended and the one that needs the rung.
              #
              # `event_stager`, never `writer` and never `owner`. A staged object is a bookkeeping
              # record under a control prefix, not data: reusing `can_write_data` would hand every
              # tenant writer a platform capability, and owner-tier is wrong in the other direction —
              # the holder is a SERVICE, and a service must not be an estate owner. `model.fga.yaml`
              # pins the refusals that make the rung worth having (the trainer, the web BFF).
              #
              # A RENDER-TIME LITERAL from the same values key the fleet template feeds ingest, so the
              # subject the catalog admits cannot drift from the one granted here.
              {{- $stagers := list }}
              {{- if .Values.services.ingest }}
              {{- $stagers = append $stagers ((get (.Values.services.ingest.env | default dict) "RASK_CATALOG_SERVICE_IDENTITY") | default "service-ingest") }}
              {{- end }}
              stagers = {{ $stagers | toJson }}

              {{- $eventReaders := list }}
              {{- if .Values.services.notifications }}
              {{- $eventReaders = append $eventReaders ((get (.Values.services.notifications.env | default dict) "RASK_LINEAGE_SERVICE_IDENTITY") | default "notifications") }}
              {{- end }}
              event_readers = {{ $eventReaders | toJson }}
              # The admin grant is the one that really is conditional on the subject: with no
              # `auth.bootstrapAdmin` there is no human to make an owner, and the service rungs below
              # are unaffected by that.
              grants = (
                  ([(user, "owner")] if subject else [])
                  + [(r if ":" in r else f"user:{r}", "reader") for r in readers]
                  + [(m if ":" in m else f"user:{m}", "maintainer") for m in maintainers]
                  + [(s if ":" in s else f"user:{s}", "event_stager") for s in stagers]
              )
              # ESTATE GRANTS — a SHORTER list than the warehouse one, and the difference is the point.
              #
              # The warehouse rungs above are about DATA: `reader` is how the cascade-lag detector reads
              # versions and runs, `maintainer` is how the sweep rewrites bytes, and both reach every
              # tier by cascading down `warehouse -> namespace -> table`. None of that is an estate
              # privilege and none of it moves here.
              #
              # `admin` reaches every estate rung (`owner`/`writer`/`reader` and the can_* verbs), so the
              # first human needs exactly one tuple. The two SERVICE rungs are estate-scoped because what
              # they guard is a platform surface rather than anyone's data: `event_stager` the lineage
              # outbox prefix, `event_reader` the whole run feed.
              estate_grants = (
                  ([(user, "admin")] if subject else [])
                  + [(s if ":" in s else f"user:{s}", "event_stager") for s in stagers]
                  + [(r if ":" in r else f"user:{r}", "event_reader") for r in event_readers]
              )

              for target, pairs in ((obj, grants), (estate_obj, estate_grants)):
                for subject_id, relation in pairs:
                  tuple_key = {"user": subject_id, "relation": relation, "object": target}
                  r = httpx.post(f"{api}/stores/{store_id}/check", headers=fga_headers(token_file), json={"tuple_key": tuple_key, "authorization_model_id": model_id}, timeout=10)
                  if r.status_code == 200 and r.json().get("allowed"):
                      print(f"bootstrap-admin: {subject_id} already {relation} of {target} — nothing to do")
                      continue

                  r = httpx.post(
                      f"{api}/stores/{store_id}/write",
                      headers=fga_headers(token_file),
                      json={"writes": {"tuple_keys": [tuple_key]}, "authorization_model_id": model_id},
                      timeout=10,
                  )
                  if r.status_code == 200:
                      print(f"bootstrap-admin: granted {subject_id} {relation} {target}")
                  elif r.status_code in (400, 409) and "already exists" in r.text:
                      # Duplicate write raced past the check — the grant is in place, which is all we want.
                      print(f"bootstrap-admin: {subject_id} {relation} {target} already written (concurrent) — ok")
                  else:
                      sys.exit(f"tuple write failed: HTTP {r.status_code} {r.text}")
{{- end }}
