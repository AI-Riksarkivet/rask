{{- if and .Values.auth.enabled .Values.auth.bootstrapAdmin }}
# Estate-admin bootstrap (goal cond 4): the chart itself seeds the FIRST estate admin instead of an
# out-of-band `fga tuple write`. A post-install/post-upgrade hook grants `owner` on the FGA root object
# (warehouse:lance_catalog — RASK_FGA_ROOT_OBJECT's default; a grant there cascades estate-wide and is
# what can_observe_events / the admin console gate on) to the Dex subject in auth.bootstrapAdmin.
# There is no fga CLI image, so the Job reuses the catalog image (ships httpx) and speaks the OpenFGA
# HTTP API directly: use the PINNED store id when auth.fgaStoreId sets one (rendered as
# RASK_FGA_STORE_ID — the same env the catalog reads, so a pinned prod store can never diverge from
# the store this Job grants into), else resolve the store id by name (the catalog's startup provision
# creates/reuses the `lance-catalog` store — services/common/fga.py), CHECK the grant first (the clean
# idempotence guard), and only then write the tuple, treating a duplicate-write 400/409 as success. On
# the name-lookup path the store appears only once the catalog has booted with FGA on, so the resolve
# loop waits for it (weight 5 = after the openfga-migrate hook at -5).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-bootstrap-admin
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Reap the finished pod. Each revision's job carries a -r<revision> name, so Helm's
  # before-hook-creation delete policy never matches the previous one — without a TTL every
  # `helm upgrade` left another Completed husk behind (14 were sitting in `kubectl get pods`).
  ttlSecondsAfterFinished: 3600
  backoffLimit: 30
  template:
    metadata:
      # The explicit component label is the P4 landmine: hook pods without one are invisible to any
      # component-scoped NetworkPolicy `from` list. Today the openfga pods sit under the general
      # intra-namespace ingress allow, but the label keeps this hook admissible (and greppable) the day
      # the openfga ingress gets an exclusive client list like openbao/age/rustfs.
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap-admin
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      containers:
        - name: bootstrap
          image: "{{ include "lance.catalogImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "lance.securityContext" . | nindent 10 }}
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          env:
            - { name: FGA_API_URL, value: "http://{{ include "lance.openfgaHost" . }}:8080" }
            # Must match the catalog's RASK_FGA_ROOT_OBJECT default (services/catalog/core/config.py).
            - { name: FGA_ROOT_OBJECT, value: "warehouse:lance_catalog" }
            {{- with .Values.auth.fgaStoreId }}
            # The operator-pinned store (env parity with the catalog's RASK_FGA_STORE_ID): the script
            # prefers this over the name lookup, so a pinned store named anything BUT `lance-catalog`
            # still gets the bootstrap grant in the right place.
            - { name: RASK_FGA_STORE_ID, value: {{ . | quote }} }
            {{- end }}
          command: ["python", "-c"]
          args:
            - |
              import os, sys, time
              import httpx

              api = os.environ["FGA_API_URL"].rstrip("/")
              # Render-time constants (not env: the dead-chart-env invariant only sees services/ consumers).
              # store name must match what the catalog provisions (services/common/fga.py provision()).
              store_name = "lance-catalog"
              obj = os.environ["FGA_ROOT_OBJECT"]
              subject = {{ .Values.auth.bootstrapAdmin | quote }}
              user = subject if ":" in subject else f"user:{subject}"

              # Pinned store id wins (RASK_FGA_STORE_ID, auth.fgaStoreId) — no name lookup, no wait.
              # Fallback: the catalog provisions the store at startup (post-install races its first
              # boot) — wait for it by name.
              store_id = os.environ.get("RASK_FGA_STORE_ID") or None
              deadline = time.monotonic() + 600
              while store_id is None and time.monotonic() < deadline:
                  try:
                      r = httpx.get(f"{api}/stores", timeout=5)
                      r.raise_for_status()
                      stores = [s for s in r.json().get("stores", []) if s.get("name") == store_name]
                      if stores:
                          # Newest wins — same tie-break as fga.provision().
                          store_id = max(stores, key=lambda s: s.get("created_at") or "")["id"]
                          break
                      print(f"store {store_name!r} not provisioned yet (catalog boots it); waiting", flush=True)
                  except httpx.HTTPError as exc:
                      print(f"openfga not ready: {exc}", flush=True)
                  time.sleep(5)
              if store_id is None:
                  sys.exit(f"timed out waiting for OpenFGA store {store_name!r} at {api}")

              # The admin's `owner`, then one `reader` per SERVICE principal that must READ the estate.
              #
              # Today that is exactly the notifications reconciler, and the grant is not a convenience.
              # Lineage's `GET /events` is governed — a row comes back only if the CALLER can
              # can_get_metadata on every dataset it names — so a deployment that forgets this gets a
              # reconciler that ticks cleanly, logs `lineage_feed_reconciled`, and reconciles nothing.
              # Measured on local k3s before this existed: `service-ingest` saw 80 events, `service-web`
              # 4, and `notifications` ZERO, with every pod 2/2 Running.
              #
              # `reader`, not `owner`: the service must SEE runs to work out who to tell and no more.
              # Delivery is re-authorized per recipient at fan-out (can_be_notified) and again at read
              # (can_get_metadata), so this widens what the SERVICE observes, never what a PERSON gets.
              #
              # A RENDER-TIME LITERAL rather than an env var, for the reason stated 30 lines up and
              # then promptly ignored once: `test_no_dead_chart_env_vars` scans services/, packages/,
              # runners/ and frontend/ for each env the chart injects, and an env consumed only by THIS
              # inline script is read by none of them — so it is reported as dead config and fails the
              # suite. The identity still comes from the one values path services.yaml uses to build
              # LINEAGE_SERVICE_SUBJECTS, so the subject lineage admits cannot drift from the one
              # granted here.
              #
              # Each grant is checked before it is written, so re-running this hook on every upgrade
              # stays a no-op — and one already-granted subject never short-circuits another that is
              # still missing, which the early `sys.exit(0)` this replaced did: it would have hidden
              # every service grant behind an admin who was already in place.
              {{- $readers := list }}
              {{- if .Values.services.notifications }}
              {{- $readers = append $readers ((get (.Values.services.notifications.env | default dict) "RASK_LINEAGE_SERVICE_IDENTITY") | default "notifications") }}
              {{- end }}
              readers = {{ $readers | toJson }}
              # WRITERS are a separate list because the rung is different and the reason is different.
              # A reader observes; the maintenance plane REWRITES bytes. It holds the root object-store
              # key today and compacts every bucket with it, and the vending door replaces that with a
              # credential scoped to one table and expiring in 900s — but the door authorizes on
              # `can_write_data`, which resolves through `table#writer` <- `namespace#writer` <-
              # `warehouse#writer`. Without a grant the vend is refused and the service degrades
              # silently back to the root key, i.e. the hardening looks configured and is not.
              #
              # THIS GRANT COVERS THIS WAREHOUSE ONLY, and the file header's "cascades estate-wide" is
              # true of the DEFAULT warehouse rather than of the estate. Measured against the live
              # store 2026-09-03: `warehouse:lance_catalog` parents 8 namespaces, and a
              # `can_write_data` check for this subject on `table:acme-bronze$events` — under
              # `warehouse:acme-bucket`, one of ~130 warehouses in that store — returned
              # `allowed:false` with the grant in place. A tenant warehouse created after install is
              # not covered either, since this hook runs at install/upgrade and warehouses are minted
              # by an API call. Vending therefore hardens the default warehouse today and degrades
              # (correctly, and audibly per dataset) everywhere else; closing that gap is an
              # authorization-model decision recorded in `open_cloudnative.md`, not a bigger tuple list.
              #
              # `writer`, never `owner`: maintenance rewrites and reclaims, it must not drop. The
              # destructive rung stays with people.
              #
              # Gated on the flag that turns the feature on, so an estate not vending grants nothing —
              # a standing estate-wide write grant to a service that is not using it is exactly the
              # kind of tuple nobody remembers to revoke.
              {{- $writers := list }}
              {{- if and .Values.maintenance.enabled .Values.maintenance.vendWriteCredentials }}
              {{- $writers = append $writers .Values.maintenance.catalogServiceIdentity }}
              {{- end }}
              writers = {{ $writers | toJson }}
              grants = (
                  [(user, "owner")]
                  + [(r if ":" in r else f"user:{r}", "reader") for r in readers]
                  + [(w if ":" in w else f"user:{w}", "writer") for w in writers]
              )

              for subject_id, relation in grants:
                  tuple_key = {"user": subject_id, "relation": relation, "object": obj}
                  r = httpx.post(f"{api}/stores/{store_id}/check", json={"tuple_key": tuple_key}, timeout=10)
                  if r.status_code == 200 and r.json().get("allowed"):
                      print(f"bootstrap-admin: {subject_id} already {relation} of {obj} — nothing to do")
                      continue

                  r = httpx.post(
                      f"{api}/stores/{store_id}/write",
                      json={"writes": {"tuple_keys": [tuple_key]}},
                      timeout=10,
                  )
                  if r.status_code == 200:
                      print(f"bootstrap-admin: granted {subject_id} {relation} {obj}")
                  elif r.status_code in (400, 409) and "already exists" in r.text:
                      # Duplicate write raced past the check — the grant is in place, which is all we want.
                      print(f"bootstrap-admin: {subject_id} {relation} {obj} already written (concurrent) — ok")
                  else:
                      sys.exit(f"tuple write failed: HTTP {r.status_code} {r.text}")
{{- end }}
