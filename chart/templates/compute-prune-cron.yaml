
{{- if and .Values.dapr.enabled .Values.services.compute }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: compute-prune-jobs-cron
  labels: {{- include "rask.componentLabels" (list . "compute") | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - { name: schedule, value: {{ .Values.services.compute.pruneSchedule | default "@every 6h" | quote }} }
scopes:
  - compute
{{- end }}
