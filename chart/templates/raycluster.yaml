{{- if and .Values.ray.enabled .Values.ray.cluster.enabled }}
{{- if .Values.singleTenant.enabled }}

{{- fail "ray.cluster.enabled and singleTenant.enabled both render a Ray head: the RayService wraps its own cluster, so enabling both gives the estate two. Pick the RayService for a Serve estate, the RayCluster for the batch lane." }}
{{- end }}
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{ include "rask.fullname" . }}-ray
  labels:
    {{- include "rask.componentLabels" (list . "ray") | nindent 4 }}
spec:
    upgradeStrategy: { type: Recreate }
{{- include "rask.rayClusterConfig" . }}
{{- if .Values.ray.cluster.gcsFaultTolerance.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rask.fullname" . }}-ray-gcs
  labels:
    {{- include "rask.componentLabels" (list . "ray") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.ray.cluster.gcsFaultTolerance.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ray.cluster.gcsFaultTolerance.size | quote }}
{{- end }}
{{- end }}
