{{- if .Values.observability.enabled }}
{{- /*
Perses dashboards-as-code. Provisioned by mounting this ConfigMap into a folder listed in
perses.config.provisioning.folders (see values.yaml); Perses loads the Project + Dashboards
on startup and reconciles them every provisioning interval. Queries target the default
`greptimedb` Prometheus datasource.

ONE project ("rask"), six dashboards — the merged estate is one platform under one
release, so lance-ns's dashboards moved from the `lance-ns` project onto this one rather
than provisioning a second, near-empty project beside it:
  fleet-red    — rask's fleet RED view (OTLP http.server metrics from service_kit.setup_otel)
  lineage      — lance-ns ingest domain signal + HTTP RED
  service-flow — the event-driven medallion cascade edges + per-service activity
  training     — per-model training run metrics (Ray train job → OTLP)
  notifications— the targeted inbox: both ingress lanes, fan-out outcomes, the DLQ floor
  maintenance  — the 120s table-maintenance sweep: coverage, refusals, and what it RECLAIMED

Gated on observability.enabled ALONE, matching Chart.yaml's `condition: observability.enabled`
on the perses dependency — so the dashboards exist exactly when Perses does. (Both charts
previously wrapped this in `index .Values "perses" "enabled" | default true`, which is the
boolean form of the swallow-an-explicit-value trap: `false | default true` is true, so the
knob never worked, and no `perses.enabled` key exists to drive it.)

NB: Perses `seriesNameFormat` uses {{`{{label}}`}} syntax — escaped here so Helm emits the
literal braces instead of evaluating them as template actions.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rask.fullname" . }}-perses-dashboards
  labels:
    {{- include "rask.labels" . | nindent 4 }}
data:
  project.json: |
    {
      "kind": "Project",
      "metadata": { "name": "rask" },
      "spec": { "display": { "name": "rask" } }
    }
  fleet-red.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "fleet-red", "project": "rask" },
      "spec": {
        "display": { "name": "rask Fleet — RED", "description": "Request rate, error rate, and duration per fleet service (OTLP http.server metrics)." },
        "duration": "1h",
        "panels": {
          "requestRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Request rate (req/s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_duration_milliseconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "errorRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Error rate (5xx %)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "percent" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "100 * sum by (service_name) (rate(http_server_duration_milliseconds_count{http_status_code=~\"5..\"}[5m])) / clamp_min(sum by (service_name) (rate(http_server_duration_milliseconds_count[5m])), 0.001)",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "latencyP95": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "p95 latency (ms)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "milliseconds" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_duration_milliseconds_bucket[5m])))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "activeRequests": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "In-flight requests" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (http_server_active_requests)",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Fleet RED" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/requestRate" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/errorRate" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/latencyP95" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/activeRequests" } }
              ]
            }
          }
        ]
      }
    }
  lineage.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "lineage", "project": "rask" },
      "spec": {
        "display": { "name": "Lance Lineage — ingest + RED", "description": "Domain signal (events ingested/dropped/retried, ingest latency) + OTLP HTTP RED, all from GreptimeDB." },
        "duration": "1h",
        "panels": {
          "eventsByOutcome": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Lineage events /s by outcome" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_lineage_outcome) (rate(lineage_events_processed_total[5m]))",
                "seriesNameFormat": {{ "{{lance_lineage_outcome}}" | quote }} } } } } ]
            }
          },
          "ingestP95": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Ingest p95 (s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "seconds" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (le) (rate(lineage_ingest_duration_seconds_bucket[5m])))",
                "seriesNameFormat": "p95" } } } } ]
            }
          },
          "httpRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "HTTP request rate (req/s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_duration_milliseconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "httpP95": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "HTTP p95 latency (ms)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "milliseconds" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_duration_milliseconds_bucket[5m])))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Lineage ingest + RED" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/eventsByOutcome" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/ingestP95" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/httpRate" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/httpP95" } }
              ]
            }
          }
        ]
      }
    }
  service-flow.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "service-flow", "project": "rask" },
      "spec": {
        "display": { "name": "Service Flow", "description": "How the event-driven services connect + move data — the medallion cascade edges + per-service activity, from GreptimeDB. (A node-topology graph would need the OTel Collector's servicegraph connector; this is the metrics view over the OTLP signals the Collector exports.)" },
        "duration": "30m",
        "panels": {
          "medallionFlow": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Medallion cascade /s (bronze→silver→gold edges)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_medallion_transition) (rate(medallion_stage_transitions_total[5m]))",
                "seriesNameFormat": {{ "{{lance_medallion_transition}}" | quote }} } } } } ]
            }
          },
          "activeServices": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Active services — request rate (req/s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_duration_milliseconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "lineageOutcomes": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Lineage ingest /s by outcome" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_lineage_outcome) (rate(lineage_events_processed_total[5m]))",
                "seriesNameFormat": {{ "{{lance_lineage_outcome}}" | quote }} } } } } ]
            }
          },
          "compactionSweeps": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Compaction sweeps (cron) — total" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum(compaction_runs_total)",
                "seriesNameFormat": "compaction sweeps" } } } } ]
            }
          },
          "errorRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Error rate — 5xx share of requests, by service (the missing E in RED)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_duration_milliseconds_count{http_status_code=~\"5..\"}[5m])) / sum by (service_name) (rate(http_server_duration_milliseconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "outboxDurability": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Outbox durability — depth + oldest age (alertable pair; sustained > 0 = relay not draining)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "max(outbox_depth)", "seriesNameFormat": "depth (events)" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "max(outbox_oldest_age)", "seriesNameFormat": "oldest age (s)" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(outbox_publish_failed_total[5m]))", "seriesNameFormat": "publish failed /s" } } } }
              ]
            }
          },
          "governanceGates": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Blocked at the gates — FGA denials + quality blocks + dead-letters + catalog emit failures" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(medallion_stage_denied_total[5m]))", "seriesNameFormat": "stage denied /s" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(medallion_stage_quality_blocked_total[5m]))", "seriesNameFormat": "quality blocked /s" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(lineage_events_processed_total{lance_lineage_outcome=\"dead_lettered\"}[5m]))", "seriesNameFormat": "dead-lettered /s" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(catalog_lineage_emit_failed_total[5m]))", "seriesNameFormat": "catalog emit failed /s" } } } }
              ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Service flow" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/medallionFlow" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/activeServices" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/lineageOutcomes" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/compactionSweeps" } },
                { "x": 0, "y": 16, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/errorRate" } },
                { "x": 8, "y": 16, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/outboxDurability" } },
                { "x": 16, "y": 16, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/governanceGates" } }
              ]
            }
          }
        ]
      }
    }
  training.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "training", "project": "rask" },
      "spec": {
        "display": { "name": "Model Training — experiment metrics", "description": "Per-model training run metrics emitted by the Ray train job over OTLP → GreptimeDB (#18, not MLflow): completed runs and the latest run metrics (rows seen, feature count), by model." },
        "duration": "6h",
        "panels": {
          "runsByModel": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Training runs /s by model" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_model) (rate(lance_training_runs_total[5m]))",
                "seriesNameFormat": {{ "{{lance_model}}" | quote }} } } } } ]
            }
          },
          "rowsSeen": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Rows seen (latest run) by model" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "max by (lance_model) (lance_training_rows_seen)",
                "seriesNameFormat": {{ "{{lance_model}}" | quote }} } } } } ]
            }
          },
          "featuresUsed": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Feature datasets used (latest run) by model" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "max by (lance_model) (lance_training_features)",
                "seriesNameFormat": {{ "{{lance_model}}" | quote }} } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Model training" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/runsByModel" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/rowsSeen" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/featuresUsed" } }
              ]
            }
          }
        ]
      }
    }
  notifications.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "notifications", "project": "rask" },
      "spec": {
        "display": { "name": "Notifications — the targeted inbox", "description": "The notification plane's two ingress lanes, its fan-out outcomes and its dead-letter floor. The lane split is the panel worth reading: the BUS carries run lifecycle, the FEED carries every producer that emits lineage over HTTP only (ingest, Ray TRAIN, external OpenLineage), and a feed lane flat at zero on a busy estate is a reconciler that is admitted but granted nothing — it runs perfectly and reconciles zero." },
        "duration": "6h",
        "panels": {
          "ingressByLane": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Ingress events /s by lane" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_notifications_lane) (rate(notifications_ingress_events_total[5m]))",
                "seriesNameFormat": {{ "{{lance_notifications_lane}}" | quote }} } } } } ]
            }
          },
          "ingressByOutcome": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Ingress outcomes /s (dropped + retried are the ones to watch)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_notifications_outcome) (rate(notifications_ingress_events_total[5m]))",
                "seriesNameFormat": {{ "{{lance_notifications_outcome}}" | quote }} } } } } ]
            }
          },
          "fanoutOutcomes": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Per-recipient delivery outcomes /s" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_notifications_outcome) (rate(notifications_fanout_recipients_total[5m]))",
                "seriesNameFormat": {{ "{{lance_notifications_outcome}}" | quote }} } } } } ]
            }
          },
          "deadLettered": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Dead-lettered deliveries /s (the floor under RETRY)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum(rate(notifications_dlq_parked_total[5m]))" } } } } ]
            }
          },
          "actorTurnQueue": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "InboxActor pending calls (turn-queue depth)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "max(dapr_runtime_actor_pending_actor_calls{actor_type=\"InboxActor\"})" } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Ingress" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/ingressByLane" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/ingressByOutcome" } }
              ]
            }
          },
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Delivery" },
              "items": [
                { "x": 0, "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/fanoutOutcomes" } },
                { "x": 8, "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/deadLettered" } },
                { "x": 16, "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/actorTurnQueue" } }
              ]
            }
          }
        ]
      }
    }
  ray.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "ray", "project": "rask" },
      "spec": {
        "display": { "name": "rask Ray — cluster, Serve, Data", "description": "Ray's own series. Every panel groups by application/deployment rather than naming a workload — the platform knows none." },
        "duration": "1h",
        "panels": {
          "nodeCpu": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "CPU cores in use", "description": "ray_node_cpu_utilization is a PERCENT (0-100), not a ratio — hence * ray_node_cpu_count / 100." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (instance) (ray_node_cpu_utilization * ray_node_cpu_count / 100)", "seriesNameFormat": {{ "{{instance}}" | quote }} } } } } ]
            }
          },
          "tasksByState": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Tasks by state", "description": "ray_tasks is a GAUGE and is eventually consistent — never rate() it. max_over_time for terminal states, clamp_min for live ones, which is Ray's own pairing." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (State) (max_over_time(ray_tasks{IsRetry=\"0\",State=~\"FINISHED|FAILED\"}[14d])) or clamp_min(sum by (State) (ray_tasks{IsRetry=\"0\",State!~\"FINISHED|FAILED\"}), 0)", "seriesNameFormat": {{ "{{State}}" | quote }} } } } } ]
            }
          },
          "objectStore": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Object store used (%)", "description": "Capacity lives in ray_resources{Name=\"object_store_memory\"} — there is no ray_node_* denominator for this." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (instance) (ray_object_store_memory) * 100 / clamp_min(sum by (instance) (ray_resources{Name=\"object_store_memory\"}), 1)", "seriesNameFormat": {{ "{{instance}}" | quote }} } } } } ]
            }
          },
          "oomKills": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Worker OOM kills", "description": "A real counter, so increase() is correct here — unlike ray_tasks above. This is the dominant silent cause of a dead stage." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum(increase(ray_memory_manager_worker_eviction_total[15m]))", "seriesNameFormat": "evictions / 15m" } } } } ]
            }
          },
          "serveLatency": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Serve p99 latency (ms)", "description": "Grouped by application + deployment. Those label VALUES carry a workload name today; the panel must never filter on one." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.99, sum by (application, route, le) (rate(ray_serve_http_request_latency_ms_bucket{route!~\"/-/.*\"}[5m])))", "seriesNameFormat": {{ "{{application}} {{route}}" | quote }} } } } } ]
            }
          },
          "serveReplicas": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Healthy Serve replicas" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (application, deployment) (ray_serve_deployment_replica_healthy)", "seriesNameFormat": {{ "{{application}}/{{deployment}}" | quote }} } } } } ]
            }
          },
          "dataBackpressure": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Ray Data backpressure (fraction of task time)", "description": "The PromQL names are NOT the doc-table names: the docs list num_inputs_received, it registers as data_* and the exporter prepends ray_." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum(increase(ray_data_task_submission_backpressure_time[5m])) / clamp_min(sum(increase(ray_data_num_tasks_submitted[5m])), 1)", "seriesNameFormat": "backpressure s / task" } } } } ]
            }
          },
          "controlPlane": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "compute -> Ray control calls", "description": "rask's OWN series (ray_kit.metrics), so this panel works even before Ray's endpoint is scraped. unauthorized is separated from unreachable on purpose." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_ray_op, lance_ray_outcome) (rate(ray_control_probes_total[5m]))", "seriesNameFormat": {{ "{{lance_ray_op}} {{lance_ray_outcome}}" | quote }} } } } } ]
            }
          },
          "jobsKnown": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Jobs Ray still remembers", "description": "The OOM early warning: GET /api/jobs/ takes no parameters, so it returns every job ever submitted — measured at 81,155 / 164.7 MB. The prune cron bounds it; this shows it coming back." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "max(ray_control_jobs_known)", "seriesNameFormat": "jobs in the dashboard's listing" } } } } ]
            }
          }
        },
        "layouts": [
          { "kind": "Grid", "spec": { "display": { "title": "Cluster" }, "items": [
            { "x": 0,  "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/nodeCpu" } },
            { "x": 8,  "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/tasksByState" } },
            { "x": 16, "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/objectStore" } },
            { "x": 0,  "y": 8, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/oomKills" } },
            { "x": 8,  "y": 8, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/dataBackpressure" } },
            { "x": 16, "y": 8, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/jobsKnown" } }
          ] } },
          { "kind": "Grid", "spec": { "display": { "title": "Serve + control path" }, "items": [
            { "x": 0,  "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/serveLatency" } },
            { "x": 8,  "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/serveReplicas" } },
            { "x": 16, "y": 0, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/controlPlane" } }
          ] } }
        ]
      }
    }
  maintenance.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "maintenance", "project": "rask" },
      "spec": {
        "display": { "name": "Table maintenance — the sweep", "description": "What the 120s sweep actually did: datasets covered, what it refused, and what it RECLAIMED. Counters are compaction_* (the service was renamed to maintenance; the metric names were not)." },
        "duration": "6h",
        "panels": {
          "runs": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Sweep runs /s (started vs completed)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(compaction_runs_started_total[5m]))", "seriesNameFormat": "started" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(compaction_runs_total[5m]))", "seriesNameFormat": "completed" } } } }
              ]
            }
          },
          "coverage": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Datasets per tick — swept vs refused vs trash-skipped" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(compaction_datasets_swept_total[10m]))", "seriesNameFormat": "swept" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(compaction_datasets_refused_total[10m]))", "seriesNameFormat": "refused" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(compaction_datasets_trashed_skipped_total[10m]))", "seriesNameFormat": "trash-skipped" } } } }
              ]
            }
          },
          "reclaimed": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "RECLAIMED per hour — fragments merged + versions GC'd (flat zero means the sweep is doing no work)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(compaction_fragments_removed_total[1h]))", "seriesNameFormat": "fragments removed" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(compaction_versions_removed_total[1h]))", "seriesNameFormat": "versions removed" } } } }
              ]
            }
          },
          "indices": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Indices optimized per hour" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum(increase(compaction_indices_optimized_total[1h]))", "seriesNameFormat": "indices optimized" } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Sweep" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/runs" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/coverage" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/reclaimed" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/indices" } }
              ]
            }
          }
        ]
      }
    }
  workflows.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "workflows", "project": "rask" },
      "spec": {
        "display": { "name": "rask Workflows \u2014 Dapr engine + the estate's own verdicts", "description": "Dapr publishes no workflow dashboard, so this one is authored. The engine families are free; the outcome counters exist because the engine's run-level status label is FALSE for this codebase \u2014 all three services RETURN failure rather than raising, so the sidecar records success for a run that died." },
        "duration": "6h",
        "panels": {
          "activityOutcomes": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Activity executions by status", "description": "The one workflow family whose `status` label is TRUE: an activity that exhausts its retries raises into the orchestrator, so the sidecar sees a real failure." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (activity_name, status) (rate(dapr_runtime_workflow_activity_execution_count_total[5m]))", "seriesNameFormat": {{ "{{activity_name}} {{status}}" | quote }} } } } } ]
            }
          },
          "runVerdicts": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Run verdicts (the estate's own)", "description": "NOT dapr_runtime_workflow_execution_count_total{status}. That label reads `success` for every run here, because failure is RETURNED rather than raised. These counters are recorded at each lane's terminal activity." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (lance_medallion_verdict) (rate(medallion_stage_outcome_total[15m]))", "seriesNameFormat": {{ "stage {{lance_medallion_verdict}}" | quote }} } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (lance_ingest_status) (rate(ingest_runs_total[15m]))", "seriesNameFormat": {{ "ingest {{lance_ingest_status}}" | quote }} } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (lance_flows_lane) (rate(flows_runs_total[15m]))", "seriesNameFormat": {{ "flows {{lance_flows_lane}}" | quote }} } } } }
              ]
            }
          },
          "executionLatency": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Workflow execution latency p95", "description": "Free from the engine. Note the lanes that continue_as_new (stage_run, train_run) report per-TURN latency, not wall-clock run duration." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (le, workflow_name) (rate(dapr_runtime_workflow_execution_latency_bucket[5m])))", "seriesNameFormat": {{ "{{workflow_name}}" | quote }} } } } } ]
            }
          },
          "schedulingLatency": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Scheduling latency p95", "description": "How long a scheduled workflow waits before the engine starts it \u2014 the signal that separates a slow run from a backlogged engine." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (le, workflow_name) (rate(dapr_runtime_workflow_scheduling_latency_bucket[5m])))", "seriesNameFormat": {{ "{{workflow_name}}" | quote }} } } } } ]
            }
          },
          "orchestrationTurns": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Orchestration turns vs completions", "description": "The wedged-continue_as_new view: turns climbing while completions stay flat is a watch loop that will never terminate. NOT Dapr's own published reminder query \u2014 that one regexes a `path` label this estate templates away via spec.metrics.http.increasedCardinality: false." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (app_id) (rate(dapr_runtime_actor_reminders_fired_total{actor_type=~\"dapr.internal.*workflow\"}[5m]))", "seriesNameFormat": {{ "turns {{app_id}}" | quote }} } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (app_id) (rate(dapr_runtime_workflow_execution_count_total[5m]))", "seriesNameFormat": {{ "completions {{app_id}}" | quote }} } } } }
              ]
            }
          },
          "pendingActorCalls": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Pending actor calls", "description": "Reused verbatim from Dapr's own actor dashboard \u2014 one of the few of its queries that survives this estate's cardinality bound." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "dapr_runtime_actor_pending_actor_calls", "seriesNameFormat": {{ "{{actor_type}}" | quote }} } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Workflows" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/runVerdicts" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/activityOutcomes" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/executionLatency" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/schedulingLatency" } },
                { "x": 0, "y": 16, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/orchestrationTurns" } },
                { "x": 12, "y": 16, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/pendingActorCalls" } }
              ]
            }
          }
        ]
      }
    }
{{- end }}
