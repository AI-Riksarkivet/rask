{{- $root := . }}
{{- $secretName := .Values.existingSecret | default (printf "%s-app" (include "rask.fullname" .)) }}
{{- range $name, $svc := .Values.services }}
{{- if or (eq $name "gateway") $root.Values.singleTenant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  {{- if $svc.singleton }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- include "rask.daprAnnotations" (list $root $name $svc.port) | nindent 8 }}
      labels:
        {{- include "rask.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rask.serviceAccountName" $root }}
      {{- $waits := list -}}
      {{- range $dep := ($svc.waitFor | default list) -}}
      {{- if and (eq $dep "postgres") $root.Values.cnpg.enabled }}{{- $waits = append $waits $dep -}}{{- end -}}
      {{- if and (eq $dep "minio") $root.Values.rustfs.enabled }}{{- $waits = append $waits $dep -}}{{- end -}}
      {{- end -}}
      {{- if $waits }}
      initContainers:
        {{- range $dep := $waits }}
        {{- if eq $dep "postgres" }}
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z {{ include "rask.fullname" $root }}-postgres-rw {{ $root.Values.cnpg.port }}; do echo waiting postgres; sleep 2; done"]
        {{- end }}
        {{- if eq $dep "minio" }}
        - name: wait-minio
          image: busybox:1.36
          command: ["sh","-c","until nc -z {{ include "rask.fullname" $root }}-rustfs-io {{ $root.Values.rustfs.port }}; do echo waiting s3; sleep 2; done"]
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}{{ if $root.Values.image.repository }}/{{ end }}{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - {{ $svc.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ $svc.port }}"
            {{- range $a := ($svc.extraArgs | default list) }}
            - {{ $a | quote }}
            {{- end }}
            {{- if $root.Values.dev.reload }}
            # Dev only (Tilt): hot-reload uvicorn on source change. Requires an
            # editable dev image (.docker/fleet.dev.dockerfile) whose source lives
            # at /app/{packages,components} so Tilt's live_update sync lands where
            # the reloader watches. Never set dev.reload in production.
            - "--reload"
            - "--reload-dir=/app/packages"
            - "--reload-dir=/app/components"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" $root }}-config
            - secretRef:
                name: {{ $secretName }}
          env:
            - name: RASK_ORCHESTRATOR_AUTOSTART
              value: {{ if $svc.singleton }}{{ $root.Values.orchestrator.autostart | quote }}{{ else }}"false"{{ end }}
            {{- include "rask.otelEnv" (list $root $name) | nindent 12 }}
            {{- if $svc.singleton }}
            # The Ray job entrypoint runs inside the ray image, which has no uv and
            # no source tree — only the installed `runner` console script on PATH.
            - name: RASK_RUNNER_CMD
              value: {{ $root.Values.orchestrator.runnerCmd | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: {{ $svc.healthPath | default "/api/health" }}, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ $svc.healthPath | default "/api/health" }}, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $root.Values.resources.fleet | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
---
{{- end }}
{{- end }}
