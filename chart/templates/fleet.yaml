{{- $root := . }}
{{- $secretName := .Values.existingSecret | default (printf "%s-app" (include "rask.fullname" .)) }}
{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  {{- if $svc.singleton }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- if $root.Values.dapr.sidecars }}
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ $name | quote }}
        dapr.io/app-port: {{ $svc.port | quote }}
        dapr.io/log-level: {{ $root.Values.dapr.logLevel | quote }}
        {{- with $root.Values.dapr.maxBodySize }}
        dapr.io/max-body-size: {{ . | quote }}
        {{- end }}
        {{- end }}
      labels:
        {{- include "rask.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rask.serviceAccountName" $root }}
      {{- $waits := list -}}
      {{- range $dep := ($svc.waitFor | default list) -}}
      {{- if and (eq $dep "postgres") $root.Values.cnpg.enabled }}{{- $waits = append $waits $dep -}}{{- end -}}
      {{- if and (eq $dep "minio") $root.Values.rustfs.enabled }}{{- $waits = append $waits $dep -}}{{- end -}}
      {{- end -}}
      {{- if $waits }}
      initContainers:
        {{- range $dep := $waits }}
        {{- if eq $dep "postgres" }}
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z {{ include "rask.fullname" $root }}-postgres-rw {{ $root.Values.cnpg.port }}; do echo waiting postgres; sleep 2; done"]
        {{- end }}
        {{- if eq $dep "minio" }}
        - name: wait-minio
          image: busybox:1.36
          command: ["sh","-c","until nc -z {{ include "rask.fullname" $root }}-rustfs-io {{ $root.Values.rustfs.port }}; do echo waiting s3; sleep 2; done"]
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}{{ if $root.Values.image.repository }}/{{ end }}{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - {{ $svc.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ $svc.port }}"
            {{- range $a := ($svc.extraArgs | default list) }}
            - {{ $a | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" $root }}-config
            - secretRef:
                name: {{ $secretName }}
          env:
            - name: RASK_ORCHESTRATOR_AUTOSTART
              value: {{ if $svc.singleton }}{{ $root.Values.orchestrator.autostart | quote }}{{ else }}"false"{{ end }}
            {{- if $root.Values.observability.enabled }}
            - name: RASK_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://rask-greptimedb-standalone:4000/v1/otlp"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "x-greptime-db-name=public,x-greptime-pipeline-name=greptime_trace_v1"
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.namespace=rask,deployment.environment=%s" $root.Release.Namespace | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $root.Values.resources.fleet | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
---
{{- end }}
