{{- $root := . }}
{{- $secretName := .Values.existingSecret | default (printf "%s-app" (include "rask.fullname" .)) }}

{{- $lakehouse := list "catalog" "lineage" }}
{{- range $name, $svc := .Values.services }}

{{- if and (not (has $name $lakehouse)) (or $svc.frontDoor $root.Values.singleTenant.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  # hasKey+ternary, never `| default` — an explicit `replicas: 0` (scale to zero) is
  # falsy, so `| default 1` would silently resurrect the workload.
  replicas: {{ hasKey $svc "replicas" | ternary $svc.replicas 1 }}
  {{- if $svc.singleton }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- include "rask.daprAnnotations" (list $root $name $svc.port) | nindent 8 }}
      labels:
        {{- include "rask.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
        lance.dev/logs: otlp # setup_otel builds a real LoggerProvider (5dae4538), so the file-tailed line is a dup — the uvicorn/crash tier is NOT dropped, see the filter's body guard
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{/**/}}
      terminationGracePeriodSeconds: {{ $root.Values.lifecycle.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "lance.fullname" $root }}-sa-{{ $name }}
      {{- $waits := list -}}
      {{- range $dep := ($svc.waitFor | default list) -}}
      {{- if and (eq $dep "minio") $root.Values.minio.enabled }}{{- $waits = append $waits $dep -}}{{- end -}}
      {{- end -}}
      {{- if $waits }}
      initContainers:
        {{- range $dep := $waits }}
        {{- if eq $dep "minio" }}
        - name: wait-minio
          image: busybox:1.36
          command: ["sh","-c","until nc -z {{ include "lance.minioHost" $root }} {{ $root.Values.minio.port }}; do echo waiting s3; sleep 2; done"]
        {{- end }}
        {{- end }}
      {{- end }}

      {{- include "lance.spreadConstraints" $name | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: {{ include "rask.image" (list $root $name) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - {{ $svc.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ $svc.port }}"
            {{- include "rask.shutdownArg" $root | nindent 12 }}
            {{- include "rask.proxyHeaderArgs" $root | nindent 12 }}
            {{- range $a := ($svc.extraArgs | default list) }}
            - {{ $a | quote }}
            {{- end }}
          # Drain delay before SIGTERM: kube-proxy can still route to a terminating pod, so
          # without it a rolling update drops in-flight requests. Matters most on the gateway,
          # which is the ingress. Pinned by
          # tests/unit/test_invariants.py::test_every_first_party_deployment_is_hardened.
          {{- include "lance.preStop" $root | nindent 10 }}
          {{/**/}}
          {{- include "lance.securityContext" $root | nindent 10 }}
          {{/**/}}
          volumeMounts:
            {{- include "lance.tmpMount" $root | nindent 12 }}
            {{- include "lance.identityTokens" (prepend (include "lance.fleetAudiences" (list $name $svc) | splitList " " | compact) "mounts") | nindent 12 }}
            {{- if and $root.Values.auth.enabled $svc.governedAuth }}{{ include "lance.fgaToken" (list "mounts") | nindent 12 }}{{ end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" $root }}-config

            {{- if $svc.ambientStorage }}
            - secretRef:
                name: {{ $secretName }}
            {{- end }}
          env:
            {{- include "rask.otelEnv" (list $root $name) | nindent 12 }}
            - { name: RASK_AUDIT_ENABLED, value: {{ hasKey $root.Values.auth "audit" | ternary $root.Values.auth.audit true | quote }} }

            {{- if and $root.Values.dapr.enabled $svc.daprIngest }}

{{- include "lance.appTokenEnv" (list $root $name) | nindent 12 }}
            {{- end }}
            {{- if and $root.Values.auth.enabled $svc.governedAuth }}

            {{- include "lance.governedOidcEnv" $root | nindent 12 }}
            {{- include "lance.governedFgaEnv" $root | nindent 12 }}
            {{- with include "lance.governedFgaPins" $root }}{{- . | nindent 12 }}{{- end }}
            {{- end }}

            {{- range $k, $v := $svc.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- with include "lance.signingEnv" (list $root $name) }}{{ . | nindent 12 }}{{- end }}
            {{- if eq $name "notifications" }}{{- with include "lance.doorEnv" (list $root true) }}{{ . | nindent 12 }}{{- end }}{{- end }}

            {{- if $svc.channels }}
            {{- $chans := list }}
            {{- if (($svc.channels).email).enabled }}{{- $chans = append $chans "email" }}{{- end }}
            {{- if (($svc.channels).slack).enabled }}{{- $chans = append $chans "slack" }}{{- end }}
            - { name: RASK_NOTIFICATIONS_CHANNELS, value: {{ join "," $chans | quote }} }
            {{- end }}
          {{/**/}}
{{- include "rask.fleetProbes" $svc | nindent 10 }}
          resources:

            {{- toYaml (index $root.Values.resources $name | default $root.Values.resources.fleet) | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" $root | nindent 8 }}
        {{- include "lance.identityTokens" (prepend (include "lance.fleetAudiences" (list $name $svc) | splitList " " | compact) "volumes") | nindent 8 }}
        {{- if and $root.Values.auth.enabled $svc.governedAuth }}{{ include "lance.fgaToken" (list "volumes") | nindent 8 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
---
{{- end }}
{{- end }}
