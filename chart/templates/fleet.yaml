{{- $root := . }}
{{- $secretName := .Values.existingSecret | default (printf "%s-app" (include "rask.fullname" .)) }}
{{- /* Plane ownership (lance-ns merge P4 — the render-time collision guard, risk 4): this template
     owns ONLY the rask fleet entries of .Values.services. The lance-ns lakehouse entries (catalog,
     lineage) are rendered BY NAME by templates/services.yaml under the same resolved fullname
     (`rask-<name>` — rask.fullname and lance.fullname both resolve to "rask" at install), so they
     are excluded here UNCONDITIONALLY: no service may render from two templates under any values
     combination. A new lakehouse entry in the services map must be added to this list; a new rask
     fleet entry needs nothing. */}}
{{- $lakehouse := list "catalog" "lineage" }}
{{- range $name, $svc := .Values.services }}
{{- /* `frontDoor: true` = part of the DEFAULT install, regardless of singleTenant. This gate used to
       name "gateway" literally, so every other front-door service was invisible unless someone set a
       LEGACY single-tenant flag. compute is the case that exposed it: it has an image, is built and
       imported by k3s-build/k3s-import, and the gateway routes /api/ray + /api/serve to its app-id
       UNCONDITIONALLY — so a default install answered ERR_DIRECT_INVOKE on the very route Makefile:406
       prints as its post-install check, and dev-frontends-k3s blocked forever polling it. compute is
       not a single-tenant concept; it is a client for a Ray dashboard URL, and Ray is external. */}}
{{- if and (not (has $name $lakehouse)) (or $svc.frontDoor $root.Values.singleTenant.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  # hasKey+ternary, never `| default` — an explicit `replicas: 0` (scale to zero) is
  # falsy, so `| default 1` would silently resurrect the workload. Pinned by
  # tests/unit/test_invariants.py::test_no_numeric_helm_default_can_swallow_an_explicit_zero.
  replicas: {{ hasKey $svc "replicas" | ternary $svc.replicas 1 }}
  {{- if $svc.singleton }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "rask.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- include "rask.daprAnnotations" (list $root $name $svc.port) | nindent 8 }}
      labels:
        {{- include "rask.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- include "rask.daprPodLabels" $root | nindent 8 }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rask.serviceAccountName" $root }}
      {{- $waits := list -}}
      {{- range $dep := ($svc.waitFor | default list) -}}
      {{- if and (eq $dep "minio") $root.Values.rustfs.enabled }}{{- $waits = append $waits $dep -}}{{- end -}}
      {{- end -}}
      {{- if $waits }}
      initContainers:
        {{- range $dep := $waits }}
        {{- if eq $dep "minio" }}
        - name: wait-minio
          image: busybox:1.36
          command: ["sh","-c","until nc -z {{ include "rask.fullname" $root }}-rustfs-io {{ $root.Values.rustfs.port }}; do echo waiting s3; sleep 2; done"]
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "rask.image" (list $root $name) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - {{ $svc.module | quote }}
            - "--host=0.0.0.0"
            - "--port={{ $svc.port }}"
            {{- range $a := ($svc.extraArgs | default list) }}
            - {{ $a | quote }}
            {{- end }}
          # Drain delay before SIGTERM: kube-proxy can still route to a terminating pod, so
          # without it a rolling update drops in-flight requests. Matters most on the gateway,
          # which is the ingress. Pinned by
          # tests/unit/test_invariants.py::test_every_first_party_deployment_is_hardened.
          {{- include "lance.preStop" $root | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rask.fullname" $root }}-config
            - secretRef:
                name: {{ $secretName }}
          env:
            {{- include "rask.otelEnv" (list $root $name) | nindent 12 }}
            {{- if $svc.rayClient }}
            {{- /* Ray token auth (gate 7 / R3): only the services flagged rayClient in
                 .Values.services (compute) get the pair — least
                 privilege; the gateway never talks to Ray. No-op unless
                 ray.auth.enabled (the include gates itself). JobSubmissionClient +
                 ray-kit's httpx paths read RAY_AUTH_TOKEN and attach the Bearer header. */}}
            {{- include "rask.rayAuthEnv" $root | nindent 12 }}
            {{- end }}
            {{- if $svc.lanceWriter }}
            {{- /* The S3 endpoint for services that write Lance. NOT optional: the pod already
                 receives AWS_* credentials from the fleet secret, so with no endpoint lance's
                 object_store silently resolves s3.us-east-1.amazonaws.com — the first in-cluster
                 ingest write got 403 InvalidAccessKeyId FROM REAL AWS, with the RustFS key echoed in
                 Amazon's error body. Credentials-present + endpoint-absent is the worst combination:
                 it fails far away, slowly, and names Amazon rather than the missing config. */}}
            - { name: RASK_S3_ENDPOINT_URL, value: {{ include "lance.s3Endpoint" $root | quote }} }
            - { name: AWS_ENDPOINT_URL, value: {{ include "lance.s3Endpoint" $root | quote }} }
            - { name: AWS_ALLOW_HTTP, value: "true" }
            {{- /* The warehouse root, from the chart's OWN bucket helper rather than a literal. The
                 first attempt hardcoded "rask-lakehouse" in values.yaml and RustFS answered
                 NoSuchBucket — the estate's bucket is `rustfs.bucket` (lance-catalog), and a values
                 file cannot call the helper because it cannot template at all. Deriving it here means
                 the ingest plane follows the bucket every other tier follows, including a rename. */}}
            - { name: RASK_INGEST_WAREHOUSE, value: "s3://{{ include "lance.stageBucket" (list $root $root.Values.medallion.producer.bronzeNamespace) }}/ingest" }
            {{- if $root.Values.dapr.sidecars }}
            {{- /* The SERVICE half of the ingest control door. `authorize_ingest` treats an UNSET
                 APP_API_TOKEN as dev-open, matching every other door in the estate — which means a
                 deployment that forgets it runs an unauthenticated write API and looks identical to
                 one that is protected. Rendered from the same secret the medallion producer and the
                 movers read, so the whole plane presents one service identity. Gated on
                 dapr.sidecars because that is what creates the secret (the medallion templates make
                 the same reference under the same condition, so it can never dangle). */}}
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $root.Release.Name }}-dapr-app-token, key: token }
            {{- end }}
            {{- end }}
            {{- /* Per-service env passthrough. Added 2026-08-03 because this block was a FIXED set of
                 includes: a values key a service needed had nowhere to render, and the first
                 in-cluster ingest run resolved a RELATIVE warehouse path inside the container as a
                 result — data would have landed in the pod's ephemeral filesystem and vanished with
                 it, silently, since a relative Lance path is perfectly valid.
                 Deliberately opt-in and per-service rather than a global map: config that applies to
                 everything belongs in the configmap this pod already mounts via envFrom, and a
                 catch-all here would become the place config goes to avoid a decision. */}}
            {{- range $k, $v := $svc.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: {path: {{ $svc.healthPath | default "/api/health" }}, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ $svc.healthPath | default "/api/health" }}, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- /* A service may name its OWN tier (resources.<name>); otherwise the shared fleet one.
                 compute needs it — see the values comment: the Ray SDK does not fit in 512Mi. */}}
            {{- toYaml (index $root.Values.resources $name | default $root.Values.resources.fleet) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rask.fullname" $root }}-{{ $name }}
  labels:
    {{- include "rask.componentLabels" (list $root $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
  selector:
    {{- include "rask.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
---
{{- end }}
{{- end }}
