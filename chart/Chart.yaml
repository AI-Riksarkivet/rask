apiVersion: v2
name: rask
description: >-
  rask — an agnostic multimodal AI platform as ONE umbrella chart (one `helm install`,
  one release named `rask`): the service fleet (gateway, compute,
  controlplane + the SvelteKit microfrontend zones), the Lance lakehouse
  REST catalog with in-service lineage (OpenLineage → Apache AGE), the medallion + media planes,
  governance (Dex OIDC + OpenFGA), event-driven on Dapr pub/sub over NATS JetStream, and the
  OTel Collector that exports its telemetry to the OTLP endpoint the operator names.
type: application
# 0.2.0 (rask) + 0.1.0 (lance-ns) merged into one chart — a whole second system's templates and
# values landed here, so this is a real minor bump, not a no-op.
version: 0.3.0
appVersion: "0.3.0"
home: https://github.com/AI-Riksarkivet/rask
maintainers:
  - name: Riksarkivet
  - name: Gabriel Borg

# Cluster infra is unified into this chart as conditional subchart dependencies
# (one `helm install` brings up everything). Each is gated by <key>.enabled so a
# prod install with external infra can turn them off. k3s itself + helm are the
# only out-of-chart bootstrap (scripts/k3s-install.sh).
#
# lance-ns merge (P4, "one control plane each", docs/adr/0124-chart-unification-one-control-plane-each-one-object-store.md): lance-ns declared
# dapr, nats and openfga at the IDENTICAL version and repository rask ships, so the dedupe was lossless.
# GreptimeDB and Perses are not rask's (ADR 0153): the observability chain is a prerequisite, and
# development gets it from deploy/fixtures/observability. Everything
# lance-ns brings beyond these five (Apache-AGE Postgres, Dex, OpenBao, external-secrets,
# the OTel Collector, the openfga migrate Job, alerting, security-sa, ha) is a FIRST-PARTY
# template, not a subchart — it needs no entry here. lance-ns's richer subchart *values*
# (credentialed nats, openfga datastore.engine=postgres + the migrate hook) land in
# values.yaml, which is where subchart config belongs; nothing about them changes this list.
dependencies:
  # Aliases must be lowercase RFC1123 (subcharts derive container/resource names
  # from .Chart.Name = the alias); camelCase breaks them.
  # Shared with lance-ns at the same version — the single bus. lance-ns's values win
  # (credentialed + netpol'd JetStream); its stream-provision Job + Dapr pubsub are the
  # first real consumers of what rask ships streamless.
  - name: nats
    version: "2.14.2"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
  # Shared with lance-ns at the same version — one Dapr control plane. Sidecars/components
  # are values + templates, not extra deps.
  - name: dapr
    version: "1.18.1"
    repository: https://dapr.github.io/helm-charts/
    condition: dapr.enabled
  # Shared with lance-ns at the same version — one authz control plane. lance-ns's values win:
  # datastore.engine=postgres against the AGE Postgres, image tag pinned v1.18.3 (see the hazard
  # note in values.yaml under `openfga.image` before changing it), and the
  # subchart's own migrate DISABLED (applyMigrations/waitForMigrations false) in favour of the
  # first-party templates/openfga-migrate.yaml Job. That replaces rask's `engine: memory`.
  - name: openfga
    # STILL 0.3.9 while the IMAGE is v1.18.3 — the subchart only templates the Deployment, so the
    # running binary is the newest either way. The bump to 0.3.12 (whose appVersion IS v1.18.3) is a
    # follow-up that MUST be done with helm on PATH: Chart.lock pins 0.3.9 and carries a digest over
    # the dependency set, so editing this version by hand desyncs the lock and `helm dependency build`
    # — which `make k3s-install` and scripts/*_e2e_stack.sh both run — fails outright. One
    # `helm dependency update ./chart` does it; verified 2026-08-08 that every value key we set
    # (datastore.existingSecret / secretKeys.uriKey / applyMigrations / waitForMigrations) still
    # exists in 0.3.12, so the bump itself is a non-event once the lock is regenerated.
    version: "0.3.12"
    repository: https://openfga.github.io/helm-charts
    condition: openfga.enabled
  # CNPG operator. Its CRDs stay VENDORED at chart/crds/ (installed in Helm's CRD phase, before
  # templates) with `cloudnative-pg.crds.create: false` in values.yaml — the subchart must not
  # also create them. lance-ns must not re-install them either; the AGE Postgres rides this
  # existing operator rather than adding one.
  - name: cloudnative-pg
    version: "0.28.3"
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg.enabled
