<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Workbench panel</title>
		<!--
			The blank document a dockview popout window loads.

			Deliberately empty: dockview copies the PARENT document's stylesheets into this window at
			open time, so the estate's OKLCH tokens, the Tailwind utilities a panel's content uses and
			the whole `--dv-*` theme block all resolve here with no import. Adding them would be a
			second, drifting copy.

			`height: 100%` on both elements is load-bearing — the dock measures its container and lays
			the grid out in pixels, so a body with auto height gives it nothing to measure.
		-->
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
			}
		</style>
	</head>
	<body></body>
</html>
