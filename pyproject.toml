[project]
name = "rask-workspace"
version = "0.1.0"
description = "rask monorepo — uv workspace root (no entry points; deployables build via `uv sync --package <name>`)."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
# pylance 9.0.0's metadata caps `lance-namespace>=0.8.5,<0.9`, but the catalog requires >=0.9.0 —
# mutually unsatisfiable, so `uv lock` fails outright without this. lance-ns carries the same
# override at ITS root; overrides are honoured ONLY at the workspace root, so it has to live here.
override-dependencies = [
    "lance-namespace>=0.9.0",
    "lance-namespace-urllib3-client>=0.9.0",
]

[tool.uv.workspace]
# Language-pure directories, so globs are both possible and safe: every dir under packages/ and
# services/ carries a pyproject.toml. The JS plane lives in frontend/ with its own bun workspace.
# NOTE: runners/* are deliberately NOT members — sealed model envs whose heavy pins
# (CUDA torch, model SDKs) must never enter the services' resolution.
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    # [server] adds the ThreadedMotoServer that tests/integration/test_moto_s3.py drives
    # (it needs flask); rask's own suites only ever used the [s3] mock.
    "moto[s3,server]>=5.0",
    # The OpenLineage spec gate (tests/unit/test_openlineage_spec_conformance.py) needs the
    # client for the authoritative facet _schemaURLs, and jsonschema to validate hand-built
    # RunEvents against the vendored 2-0-2 core schema. jsonschema resolves as a moto
    # transitive today — declared because the gate depends on it directly.
    "openlineage-python>=1.50.0",
    "jsonschema>=4.26",
    "duckdb>=1.4",
    "requests>=2.32",
    "ruff",
    "ty",
    "datasets>=4.8.4",
    "pylance>=0.20",
    "lancedb>=0.20",
    "pytest-postgresql>=6.1",
    "tracker[postgres]",
    "validate",
]

[tool.uv.sources]
tracker = { workspace = true }
validate = { workspace = true }

[tool.ruff]
line-length = 160
# A vulture whitelist is, BY DESIGN, a file of bare names — that is how vulture marks a symbol as
# used. Every line is an undefined reference to any linter or type checker; it is not real code and
# is never imported. lance-ns excludes it from ty for the same reason.
extend-exclude = [".vulture-whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF", "C901", "RET", "PERF", "FURB", "A", "ANN"]
ignore = ["S101", "S104", "ANN001", "ANN003", "ANN204", "RET504"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately hardcode fixture credentials (S105/S106/S107), drive live endpoints without a
# client timeout (S113), and use tmp paths (S108) — that is what a fixture IS. rask already exempted
# S101/ANN2xx here; the lance-ns suites needed the rest of the same family.
"**/tests/**" = ["S101", "S105", "S106", "S107", "S108", "S113", "ANN201", "ANN202", "ANN401", "S608", "S607", "S603", "RUF001"]
# The media pipeline shells out to ffmpeg/ffprobe with LIST-form argv (never shell=True), which is
# the safe form S603 cannot distinguish from an unsafe one. Scoped to the two trees that decode
# media rather than silenced globally.
# ---- incoming lance-ns trees: rule families lance-ns never enabled -------------------------
# lance-ns lints with select = [E,F,I,UP,B,SIM,C4] at line-length 110; rask adds W,S,RUF,C901,RET,
# PERF,FURB,A,ANN at 160. The reformat to rask's style landed (separate commit); these four families
# are scoped rather than rewritten across ~250 freshly-copied files, because in this code they are
# wrong more often than right:
#   A002   — `filter=`, `id=`, `type=` are the LanceDB/lance-namespace PUBLIC parameter names;
#            renaming them would break the call contract with the library.
#   ANN401 — `Any` at the boundaries of pyarrow/lance/dapr, none of which ship precise stubs.
#   RUF002/3 — typographically correct prose (MINUS SIGN, MULTIPLICATION SIGN, EN DASH) in docstrings
#            and comments; "fixing" it degrades the writing.
# NOT a permanent exemption — tracked in docs/OPEN-WORK.md so it is revisited, not forgotten.
"services/catalog/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/lineage/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/medallion/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/compaction/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/viewer/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/search/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"services/annotator/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"packages/common/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"packages/ratch/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"runners/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"scripts/ray_stage_job.py" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"scripts/ray_train_job.py" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"scripts/encoder_stub.py" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"scripts/gen_openapi.py" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"scripts/medallion_demo.py" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"scripts/model_artifact_janitor.py" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501"]
"tests/**" = ["A002", "ANN401", "ANN201", "ANN202", "ANN002", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF043", "RUF100", "C901", "PERF401", "SIM108", "S110", "S112", "S310", "S324", "S608", "E501", "S101", "S105", "S106", "S107", "S108", "S113", "S603", "S607"]
"packages/ratch/src/ratch/modalities/av/*.py" = ["S603"]
"packages/ratch/src/ratch/cli/search.py" = ["S603"]
"services/viewer/src/viewer/services/clips.py" = ["S603"]
"services/viewer/src/viewer/services/wespeaker.py" = ["S603"]
"scripts/harvest_ead.py" = ["ANN", "RET503", "B007"]
"scripts/index_catalog.py" = ["ANN", "RET503", "PERF401", "C901", "F841"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["storage", "core", "gateway", "service_kit", "core_api", "search_api", "volumes_api", "ray_api", "orchestrator", "ray_kit", "tracker", "validate"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
# ty otherwise walks these and reports on code we neither own nor can fix:
#   .venv        — third-party site-packages (lance, ray.serve) — 38 diagnostics
#   alembic/versions — autogenerated revisions; the generator's output, not ours
#   runners/     — sealed model envs, deliberately outside the fleet's resolution
exclude = [
    # A vulture whitelist is a file of BARE NAMES by design — every line is an unresolved
    # reference to a type checker. lance-ns excludes it for the same reason.
    ".vulture-whitelist.py",
    "**/.venv",
    "**/node_modules",
    "services/core/alembic/versions",
    "runners",
]

[tool.pytest.ini_options]
testpaths = ["packages/storage/tests", "packages/tracker/tests", "packages/validate/tests", "services/core/tests", "services/gateway/tests", "services/volumes_api/tests", "services/search_api/tests", "services/ray_api/tests", "tests/unit", "tests/integration"]
addopts = "--cov --cov-report=term-missing:skip-covered --import-mode=importlib"
markers = ["slow: marks tests requiring real models or long runtimes (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
branch = true
source = ["packages/", "services/"]
omit = ["**/tests/*", "**/__init__.py"]
