[project]
name = "rask-workspace"
version = "0.1.0"
description = "rask monorepo — uv workspace root (no entry points; deployables build via `uv sync --package <name>`)."
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = [
    "packages/htr",
    "packages/storage",
    "packages/service-kit",
    "packages/ray-kit",
    "packages/tracker",
    "packages/validate",
    "components/cli/runner",
    "components/services/core",
    "components/services/gateway",
    "components/services/core_api",
    "components/services/search_api",
    "components/services/volumes_api",
    "components/services/controlplane",
    "components/services/ray_api",
    "components/services/orchestrator",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.35",
    "ruff",
    "ty",
    "datasets>=4.8.4",
    "pylance>=0.20",
    "lancedb>=0.20",
    "pytest-postgresql>=6.1",
    "tracker[postgres]",
    "validate",
]

[tool.uv.sources]
tracker = { workspace = true }
validate = { workspace = true }

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF", "C901", "RET", "PERF", "FURB", "A", "ANN"]
ignore = ["S101", "S104", "ANN001", "ANN003", "ANN204", "RET504"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN201", "ANN202"]
"components/scripts/harvest_ead.py" = ["ANN", "RET503", "B007"]
"components/scripts/index_catalog.py" = ["ANN", "RET503", "PERF401", "C901", "F841"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["htr", "storage", "runner", "core", "gateway", "service_kit", "core_api", "search_api", "volumes_api", "ray_api", "orchestrator", "controlplane", "ray_kit", "tracker", "validate"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["packages/htr/tests", "packages/storage/tests", "packages/tracker/tests", "packages/validate/tests", "packages/service-kit/tests", "components/services/core/tests", "components/cli/runner/tests", "components/services/volumes_api/tests", "components/services/search_api/tests", "components/services/ray_api/tests", "components/services/controlplane/tests", "components/services/gateway/tests"]
addopts = "--cov --cov-report=term-missing:skip-covered --import-mode=importlib"
markers = ["slow: marks tests requiring real models or long runtimes (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
branch = true
source = ["packages/", "components/"]
omit = ["**/tests/*", "**/__init__.py"]
