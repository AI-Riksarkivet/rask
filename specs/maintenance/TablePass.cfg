\* The gate: one pass of the table, delivered again and again, beside a tag, a restore, a policy keeping the whole history and a writer; two faults (the pass dies, or its credential expires, at any step).
SPECIFICATION Spec
CONSTANTS
  Passes = {p1}
  MaxFaults = 2
  Doors = {"tag", "restore", "policy", "writer"}
  Off = {}
INVARIANTS
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyVictims
  DeletesHeld
