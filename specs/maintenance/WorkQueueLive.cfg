\* The gate's liveness half: one table, two workers, one fault, two deliveries a task, a commit; no drop. Once faults
\* stop the table stays held, every commit is read, and nothing a dead pass left blocks the next.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 0
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
