\* The gate's liveness half: one table, one worker, one fault, two deliveries a task, a commit; no drop. Once faults stop the table stays held, every commit is read, and nothing a dead pass left blocks the next (two workers: WorkQueueLiveWide.cfg, on demand).
SPECIFICATION Spec
CONSTANTS
  Workers = {w1}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 0
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
  WaitByRehold = TRUE
  ReholdFirst = TRUE
  ScheduleReholdGuarded = TRUE
  FollowUpReholdGuarded = TRUE
  DueCeiling = 1
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
  AWaitingFiringHoldsNoSlot
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
