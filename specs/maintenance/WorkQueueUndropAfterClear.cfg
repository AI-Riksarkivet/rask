\* ON DEMAND. A fix of WorkQueueUndropFollowUp's finding, in the model only: the undrop sends its announcement once it has
\* cleared the trash record, filed before. One fault, a commit, a drop and its undrop, the workers distinct: the
\* invariants and the properties, about four minutes on two workers.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  ScheduleAfterSettle = TRUE
  UndropDelay = "own"
  NextTimeFix = "none"
  UndropFix = "afterClear"
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
