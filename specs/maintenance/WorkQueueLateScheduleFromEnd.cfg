\* ON DEMAND. A fix of WorkQueueLateSchedule's finding, in the model only: the next time counts from the pass's end, so it
\* fires after the ack while the ack is answered inside a minute. One fault, a commit, no drop, the workers distinct: the
\* invariants and the properties, about 40 s on two workers.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 0
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  ScheduleAfterSettle = FALSE
  UndropDelay = "all"
  NextTimeFix = "fromEnd"
  UndropFix = "none"
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
