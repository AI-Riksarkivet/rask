\* Liveness: a pass that dies or loses its credential part-way leaves no version standing over deleted files for good; the next pass finishes it. One fault, every delivery, a tag, a restore and a writer.
SPECIFICATION Spec
CONSTANTS
  Passes = {p1}
  MaxFaults = 1
  Doors = {"tag", "restore", "writer"}
  Off = {}
INVARIANTS
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyVictims
  DeletesHeld
PROPERTIES
  EventuallyWhole
