\* Liveness beside a tag and a namespace's hold: once faults stop, every condemned version is finished, a dead door's pin on one included, unless a hold keeps it; every policy door lands at once. One fault (ReclaimLiveRestore.cfg has a restore; ReclaimLiveWide.cfg, on demand, both).
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {"tag", "holdN"}
  InitBranch = FALSE
  ErasureFork = FALSE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 1
  Off = {}
INVARIANTS
  OneEntryPerVersion
  VDeleteStaysCondemned
  HoldLeavesNothingCondemned
  RefsWhole
  RetentionKept
  HalfOnlyCondemned
PROPERTIES
  EventuallyWhole
  PolicyLands
