\* Two reclaims of one table at once beside a namespace's hold, version/delete and a tag: a hold set before both condemned, version/delete beside a live batch, and a tag door's pin landing between a batch's condemn and its promotion; Lance reading its tags first.
SPECIFICATION Spec
CONSTANTS
  Recl = {r1, r2}
  Doors = {"holdN", "vdelete", "tag"}
  InitBranch = FALSE
  ErasureFork = FALSE
  LanceOrder = "tags"
  PinSweep = "none"
  MaxFaults = 0
  Off = {}
SYMMETRY ReclSymmetry
INVARIANTS
  OneEntryPerVersion
  VDeleteStaysCondemned
  HoldLeavesNothingCondemned
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
  CondemnsAsListed
  VDeleteSparesTags
