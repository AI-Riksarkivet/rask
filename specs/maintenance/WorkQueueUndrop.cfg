\* The gate's third part: the table dropped and undropped while its passes run; two workers counted as interchangeable,
\* one fault, a commit. A follow-up held before the undrop's announcement may fire before its clear; the announcement
\* holds its own, which waits out the clear (A6).
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
SYMMETRY WorkerSymmetry
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
