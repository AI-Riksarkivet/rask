\* The gate's third part: the table dropped and undropped while its passes run; two workers counted as interchangeable,
\* one fault, a commit. Under A6 as the code's comment states it: no follow-up fires between the undrop's announcement
\* and its clear. What the delay holds of it is WorkQueueUndropFollowUp's finding.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  ScheduleAfterSettle = TRUE
  UndropDelay = "all"
  NextTimeFix = "none"
  UndropFix = "none"
SYMMETRY WorkerSymmetry
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
