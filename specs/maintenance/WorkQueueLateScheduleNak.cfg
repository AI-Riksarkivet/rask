\* ON DEMAND. A fix of WorkQueueLateSchedule's finding, in the model only: a fired schedule waits, naked, while a task holds
\* its table, as a fired follow-up does, and the next time still counts from the pass's start. One fault, a commit, no
\* drop, the workers distinct: the invariants and the properties, about 40 s on two workers.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 0
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  ScheduleAfterSettle = FALSE
  UndropDelay = "all"
  NextTimeFix = "nak"
  UndropFix = "none"
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
