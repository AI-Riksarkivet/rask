\* ON DEMAND. Two reclaims at once, each of main or of branch b, beside commits on b and a tag on any version; one fault.
SPECIFICATION Spec
CONSTANTS
  Recl = {r1, r2}
  Doors = {"bwriter", "tag"}
  InitBranch = TRUE
  ErasureFork = FALSE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 1
  Off = {}
SYMMETRY ReclSymmetry
INVARIANTS
  OneEntryPerVersion
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
  CondemnsAsListed
