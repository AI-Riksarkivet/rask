\* The table deregistered and registered again at its location while one reclaim delivered again and again runs beside a tag and the table's hold; one fault (the reclaim dies or the store refuses its deletes): the record is the location's and stays, every door of the new registration reads it, and a batch asked for the registration gone condemns nothing.
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {"tag", "holdT", "reregister"}
  InitBranch = FALSE
  ErasureFork = FALSE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 1
  Off = {}
INVARIANTS
  OneEntryPerVersion
  RefsWhole
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
  CondemnsAsListed
