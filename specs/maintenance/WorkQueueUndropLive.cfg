\* The gate's liveness half with the table dropped and undropped, the three guards together (A5, A6 and A7): two workers, no
\* fault, a commit, two deliveries a task. The table stays held, every commit is read, and nothing a dead pass left
\* blocks the next.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 0
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
  WaitByRehold = TRUE
  ReholdFirst = TRUE
  ScheduleReholdGuarded = TRUE
  FollowUpReholdGuarded = TRUE
  DueCeiling = 1
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
  AWaitingFiringHoldsNoSlot
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
