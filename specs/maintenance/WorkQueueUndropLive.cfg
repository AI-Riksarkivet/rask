\* The gate's liveness half with the table dropped and undropped, both guards together (A5 and A6): two workers, no
\* fault, a commit, two deliveries a task. The table stays held, every commit is read, and nothing a dead pass left
\* blocks the next.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 0
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
