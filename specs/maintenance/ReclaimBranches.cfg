\* Branch b and its identities: a reclaim of main or of b each batch, a commit on b, b deleted and made again from main (another incarnation, whose version numbers repeat); no fault (ReclaimBranchesWide.cfg, on demand, adds a tag and one fault).
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {"branch", "bdelete", "bwriter"}
  InitBranch = TRUE
  ErasureFork = FALSE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 0
  Off = {}
INVARIANTS
  OneEntryPerVersion
  VDeleteStaysCondemned
  HoldLeavesNothingCondemned
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
  CondemnsAsListed
