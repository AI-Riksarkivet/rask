\* Two reclaims at once, each of main or of branch b, beside commits on b and a tag on any version; Lance reading its tags first (measured on pylance 13.0.0); no fault (ReclaimTwoRefsWide.cfg, on demand: either order, one fault).
SPECIFICATION Spec
CONSTANTS
  Recl = {r1, r2}
  Doors = {"bwriter", "tag"}
  InitBranch = TRUE
  ErasureFork = FALSE
  LanceOrder = "tags"
  PinSweep = "none"
  MaxFaults = 0
  Off = {}
SYMMETRY ReclSymmetry
INVARIANTS
  OneEntryPerVersion
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
  CondemnsAsListed
