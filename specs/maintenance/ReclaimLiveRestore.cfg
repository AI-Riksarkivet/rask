\* Liveness beside a tag and a restore: once faults stop, every condemned version is finished, unless a hold keeps it. One fault (ReclaimLiveWide.cfg, on demand, adds a hold).
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {"tag", "restore"}
  InitBranch = FALSE
  ErasureFork = FALSE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 1
  Off = {}
INVARIANTS
  OneEntryPerVersion
  RefsWhole
  RetentionKept
  HalfOnlyCondemned
PROPERTIES
  EventuallyWhole
  PolicyLands
