\* An erasure's fork cleanup: branch b rewrote what main 1 holds, the erasure's cleanup takes the files only main 1 names and its manifest stays while b stands; b deleted, main's reclaim finishing it; a tag; no fault (ReclaimForkWide.cfg, on demand, adds a restore and one fault).
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {"tag", "bdelete", "bwriter"}
  InitBranch = TRUE
  ErasureFork = TRUE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 0
  Off = {}
INVARIANTS
  OneEntryPerVersion
  VDeleteStaysCondemned
  HoldLeavesNothingCondemned
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
  CondemnsAsListed
