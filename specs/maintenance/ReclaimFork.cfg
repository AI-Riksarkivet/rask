\* An erasure's fork cleanup: branch b rewrote what main 1 holds, the erasure's cleanup takes the files only main 1 names and its manifest stays while b stands, condemned; b deleted, main's next reclaim finishes it; a tag on main 1 or any version meanwhile; one fault.
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {"tag", "bdelete", "bwriter"}
  InitBranch = TRUE
  ErasureFork = TRUE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 1
  Off = {}
INVARIANTS
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
