\* EXPECT VIOLATION CondemnsAsListed. ListedOn: the catalog condemns the numbers a reclaimer asks for on whichever incarnation branch b's name holds at the condemn: a reclaim lists b's victims on b1; b is deleted and made again (b2, whose numbers repeat) and written; the batch then condemns b2's versions of those numbers, which nobody chose and which are younger than their retention.
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {"branch", "bdelete", "bwriter"}
  InitBranch = TRUE
  ErasureFork = FALSE
  LanceOrder = "tags"
  PinSweep = "none"
  MaxFaults = 0
  Off = {"ListedOn"}
INVARIANTS
  CondemnsAsListed
