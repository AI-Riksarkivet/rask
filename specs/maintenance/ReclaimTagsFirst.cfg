  Recl = {r1}
  Doors = {"tag", "restore"}
  InitBranch = FALSE
  ErasureFork = FALSE
  LanceOrder = "tags"
  PinSweep = "none"
  MaxFaults = 1
  Off = {"ExplicitPins"}
INVARIANTS
  OneEntryPerVersion
  VDeleteStaysCondemned
  HoldLeavesNothingCondemned
  RefsWhole
  HalfOnlyCondemned
