\* ON DEMAND. The three guards together (A5, A6 and A7) over a whole behaviour with a fault: two workers, one fault, a commit, a
\* drop and its undrop, two deliveries a task, the workers distinct. The invariants, the fired schedules' consumer at a ceiling of one, and the three properties.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
  WaitByRehold = TRUE
  ReholdFirst = TRUE
  ScheduleReholdGuarded = TRUE
  FollowUpReholdGuarded = TRUE
  DueCeiling = 1
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
  AWaitingFiringHoldsNoSlot
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
