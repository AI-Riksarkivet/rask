\* ON DEMAND. Both guards together (A5 and A6) over a whole behaviour with a fault: two workers, one fault, a commit, a
\* drop and its undrop, two deliveries a task, the workers distinct. The invariants and the three properties.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2}
  NoOne = NoOne
  MaxFaults = 1
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
PROPERTIES
  TheTableStaysHeld
  EveryCommitIsRead
  NothingDeadBlocks
