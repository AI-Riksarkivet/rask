\* EXPECT VIOLATION OneEntryPerVersion. TakeOver: a batch condemning a version an entry already names adds an entry of its own beside it: a reclaim's deletes are refused part-way, its versions stay condemned, and the next reclaim writes a second entry for each, as every later one would.
SPECIFICATION Spec
CONSTANTS
  Recl = {r1}
  Doors = {}
  InitBranch = FALSE
  ErasureFork = FALSE
  LanceOrder = "tags"
  PinSweep = "none"
  MaxFaults = 1
  Off = {"TakeOver"}
INVARIANTS
  OneEntryPerVersion
