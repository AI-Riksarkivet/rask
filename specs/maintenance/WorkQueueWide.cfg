  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
  WaitByRehold = TRUE
  ReholdFirst = TRUE
  ScheduleReholdGuarded = TRUE
  FollowUpReholdGuarded = TRUE
  DueCeiling = 1
SYMMETRY WorkerSymmetry
