\* ON DEMAND. Three workers counted as interchangeable, up to three faults, a commit, a drop and its undrop, two deliveries a task. Safety only: about 3.5 million states, seventy seconds on four cores.
SPECIFICATION Spec
CONSTANTS
  Workers = {w1, w2, w3}
  NoOne = NoOne
  MaxFaults = 3
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  ScheduleAfterSettle = TRUE
  UndropDelay = "all"
  NextTimeFix = "none"
  UndropFix = "none"
SYMMETRY WorkerSymmetry
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
