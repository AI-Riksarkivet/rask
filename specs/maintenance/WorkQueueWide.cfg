  Workers = {w1, w2, w3}
  NoOne = NoOne
  MaxFaults = 3
  MaxDeliver = 2
  MaxCommits = 1
  Drops = 1
  EndsInTime = TRUE
  Claims = TRUE
  DueUnlimited = TRUE
  Audits = TRUE
  FiredWaits = TRUE
  UndropHoldsOwn = TRUE
SYMMETRY WorkerSymmetry
INVARIANTS
  OnePassPerTable
  ThePassHoldsTheClaim
  HeldUnlessBackstopped
  ACommitIsCovered
