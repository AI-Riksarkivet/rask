\* EXPECT VIOLATION RetentionKept. A hold binding only where it is the nearest record: the table's own record, keeping one version, overrides its namespace's hold, which answered 200 (ADR 0243 §7 decides a hold at any level keeps the whole history).
SPECIFICATION Spec
CONSTANTS
  Passes = {p1}
  MaxFaults = 0
  Doors = {"nspolicy"}
  Off = {"HoldAnyLevel"}
INVARIANTS
  RetentionKept
