  Recl = {r1}
  Doors = {"restore", "writer"}
  InitBranch = FALSE
  ErasureFork = FALSE
  LanceOrder = "any"
  PinSweep = "none"
  MaxFaults = 1
  Off = {}
INVARIANTS
  OneEntryPerVersion
  RefsWhole
  InFlightKept
  RetentionKept
  HalfOnlyCondemned
  DeletesCondemned
  RefusedOnlyChosen
  CondemnsAsListed
