\* The stock writer's gate (ADR 0227 §9): a stock client declares n1, writes it on its credential and commits version 1 through version/create; against another principal's catalog create of the name, the declarer's own catalog create, or a destroying drop; against nothing or another principal's stock client writing into the declaration; one failure, fences lapsing under live requests (a declaration's wherever its declarer is).
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"stock_n1"}
  Ops2 = {"create_n1", "owncreate_n1", "drop_n1"}
  Ops3 = {"none", "stockinto_n1"}
  InitialTable = FALSE
  MaxFaults = 1
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = TRUE
  CommitOutlastsLease = FALSE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  DeclarationIsItsDeclarers
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
