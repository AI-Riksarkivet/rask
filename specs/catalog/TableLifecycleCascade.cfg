\* The gate's fifth part: a written table n1, protected or not, under a namespace one caller drops with a cascade
\* (destroying it or to the trash); another protects it, renames it or undrops it; a third does nothing, creates n1 or
\* runs the namespace undrop's table step; up to two failures; fences lapse under a create's write and a destroy's
\* delete; the release and purge. The mixes of TableLifecycleCascadeProtectRace and TableLifecycleNsUndropRace.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"cascade_n1", "softcascade_n1"}
  Ops2 = {"protect_n1", "rename_n1_n2", "undrop_n1"}
  Ops3 = {"none", "create_n1", "nsundrop_n1"}
  InitialTable = TRUE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = TRUE
  CommitOutlastsLease = FALSE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
