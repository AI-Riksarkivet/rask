\* The gate for the lower tier on a table's history fence (F3): two ref writes, a reclaim, a branch create and a release,
\* any hold may lapse, and maintenance's maintain-tier vend puts and deletes whatever its grant allows, with any body, at
\* any time: a mark's name or a release's holder name in a subdirectory, an object under a reclaim holder's name, and the
\* deletion of a reclaim's hold. No two excluding holders hold the fence at once, no last step is taken beside one admitted
\* since, and no holder is handed a mark the catalog did not write.
