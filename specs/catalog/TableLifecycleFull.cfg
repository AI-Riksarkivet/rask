\* ON DEMAND. The gate: a written table n1, protected or not; one caller drops it (to the trash or destroying it), one undrops,
\* renames or drops it again, one creates n2 or does nothing; up to two failures; the release and purge at any time.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"softdrop_n1", "drop_n1"}
  Ops2 = {"undrop_n1", "rename_n1_n2", "softdrop_n1"}
  Ops3 = {"none", "create_n2"}
  InitialTable = TRUE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = TRUE
  CommitOutlastsLease = FALSE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
