\* EXPECT VIOLATION KeyAppliedOnce. What ReleaseKeepsWritten rests on: a released key claimed as though nothing had been written. The first attempt appends and dies before its answer; the second takes the key over and is refused before its search, which gives the key back; the third claims the released key, searches nothing and appends again.
SPECIFICATION Spec
CONSTANTS
  Mix = "lane"
  MaxFaults = 1
  MaxTries = 1
  Off = {"ReleaseKeepsWritten"}
INVARIANTS
  KeyAppliedOnce
