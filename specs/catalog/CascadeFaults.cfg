\* The gate's second part: the same doors with up to two failures, and a warehouse delete, held to what a failure leaves
\* standing: no orphan and no registered table without its data. What a failure loses is the findings' (below).
SPECIFICATION Spec
CONSTANTS
  Recoverable = TRUE
  Creates = TRUE
  UndropsNs = TRUE
  UndropsT = FALSE
  Purges = TRUE
  WhDeletes = TRUE
  MaxFaults = 2
  FaultsIn = {"drop", "undrop", "wh"}
  DropDiesAt = {"table", "detach", "nsfile"}
  ParentAtomic = TRUE
  Restrict = TRUE
  PurgeChecks = TRUE
INVARIANTS
  NoOrphan
  LiveHasData
