\* ON DEMAND. Two verifications at once, one failure, a branch cut from B, a derived table: every invariant and
\* property of the gate. About 380,000 states, two minutes on four cores.
SPECIFICATION Spec
CONSTANTS
  Verifiers = {"v1", "v2"}
  MaxFaults = 1
  HasBranch = TRUE
  HasDerived = TRUE
  CopyTags = FALSE
  Cuts = "B"
  Restores = FALSE
  DropUndrop = FALSE
  Reread = TRUE
  PlanFirst = TRUE
  Fenced = TRUE
  CAS = TRUE
INVARIANTS
  PinsNameRetainedVersions
  NothingDeletedComesBack
  ReleasedOnEvidence
  ReleasedStaysReleased
  ADerivedTableIsFollowed
  OnlyTagsOverTheSubjectAreDropped
  NoticeOnlyForARecordedRelease
  EveryReleasedBranchComesBack
PROPERTIES
  ErasedOnceReleased
  EveryObligationIsReleased
  EveryReleaseFinishes
