\* ON DEMAND. Two verifications at once, one failure, a branch cut from B, a derived table: every invariant and
\* property of the gate. About 620,000 states, six minutes on four shared cores.
SPECIFICATION Spec
CONSTANTS
  Verifiers = {"v1", "v2"}
  MaxFaults = 1
  HasBranch = TRUE
  HasDerived = TRUE
  CopyTags = FALSE
  Cuts = "B"
  Restores = FALSE
  DropUndrop = FALSE
  Reread = TRUE
  PlanFirst = TRUE
  Fenced = TRUE
  CAS = TRUE
  Sweep = TRUE
  NoticeFiled = TRUE
  TagsFiled = TRUE
  Reverify = TRUE
  Clones = FALSE
  ClonesEnd = TRUE
  CloneWaits = TRUE
  NoticeOfTheStanding = TRUE
  CreatorTold = TRUE
  ScheduleHeld = TRUE
INVARIANTS
  ACreatorIsToldBeforeTheRelease
  PinsNameRetainedVersions
  NothingDeletedComesBack
  ReleasedOnEvidence
  ReleasedStaysReleased
  ADerivedTableIsFollowed
  OnlyTagsOverTheSubjectAreDropped
  NoticeOnlyForARecordedRelease
  EveryReleasedBranchComesBack
  NoCloneIsBroken
PROPERTIES
  ErasedOnceReleased
  EveryObligationIsReleased
  EveryReleaseFinishes
  EveryoneIsTold
  EveryDroppedTagIsAnnounced
