\* FINDING NamespaceRecordAfterDrop. EXPECT VIOLATION NothingIsLost. A recoverable cascade drops each namespace before it files that namespace's trash record; a cascade that ends between the two leaves the tables beneath it with records no undrop can reach, since no record rebuilds their namespace.
SPECIFICATION Spec
CONSTANTS
  Recoverable = TRUE
  Creates = FALSE
  UndropsNs = FALSE
  UndropsT = FALSE
  Purges = FALSE
  WhDeletes = FALSE
  MaxFaults = 1
  FaultsIn = {"drop", "undrop", "wh"}
  DropDiesAt = {"table", "detach", "nsfile"}
  ParentAtomic = TRUE
  Restrict = TRUE
  PurgeChecks = TRUE
INVARIANTS
  NothingIsLost
