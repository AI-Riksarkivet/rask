\* EXPECT VIOLATION NothingIsLost. What guard G2 rests on: a recoverable cascade that drops each namespace before it files that namespace's record, and ends between the two, leaves the tables beneath it with records no undrop can reach, since no record rebuilds their namespace.
SPECIFICATION Spec
CONSTANTS
  Recoverable = TRUE
  Creates = FALSE
  UndropsNs = FALSE
  UndropsT = FALSE
  Purges = FALSE
  WhDeletes = FALSE
  MaxFaults = 1
  FaultsIn = {"drop", "undrop", "wh"}
  DropDiesAt = {"table", "detach", "nsdrop", "nsfile"}
  ParentAtomic = FALSE
  Restrict = TRUE
  PurgeChecks = TRUE
  NsFence = TRUE
  RecordFirst = FALSE
  ClearsLast = TRUE
  WhFence = TRUE
INVARIANTS
  NothingIsLost
