\* The gate: two adds, two drops and a holder that shares with nobody, any hold may lapse while its holder works: no two
\* excluding holders hold the fence at once, and no last step is taken beside one admitted since.
SPECIFICATION Spec
CONSTANTS
  Adds = {a1, a2}
  Drops = {d1, d2}
  Solos = {s1}
  Lapses = TRUE
  Recheck = TRUE
  Confirm = TRUE
INVARIANTS
  Exclusive
  NoLastStepBesideAnExcluder
