\* The gate's fourth part: a written table n1, protected or not, dropped to the trash by one caller; another drops it
\* (destroying it or to the trash) or undrops it; a third undrops it, creates n1 or protects it; up to two failures;
\* the release and purge. The mixes of TableLifecycleUndropOverDestroyed, TableLifecycleUndropClearsRedrop,
\* TableLifecycleUndropRace, TableLifecycleProtectRace and TableLifecycleProtectUnchecked.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"softdrop_n1"}
  Ops2 = {"drop_n1", "softdrop_n1", "undrop_n1"}
  Ops3 = {"undrop_n1", "create_n1", "protect_n1"}
  InitialTable = TRUE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
