\* ON DEMAND. A written table n1: a drop of either kind or a rename, against a rename, an undrop or a destroying drop, against a create of n2 or nothing; up to three failures. Safety, and that all comes to rest: 546,845 states with fences lapsing under live long steps, about two minutes on four cores.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"softdrop_n1", "drop_n1", "rename_n1_n2"}
  Ops2 = {"undrop_n1", "rename_n1_n2", "drop_n1"}
  Ops3 = {"none", "create_n2"}
  InitialTable = TRUE
  MaxFaults = 3
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = TRUE
  CommitOutlastsLease = FALSE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
