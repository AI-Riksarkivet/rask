\* ON DEMAND. The gate: an /insert with an Idempotency-Key on a table declaring no primary key, sent twice with one body, beside a compaction and an unkeyed append, so a version removed between the key's write and the head can stand in the search's range; one death, one replan.
SPECIFICATION Spec
CONSTANTS
  Mix = "gap"
  MaxFaults = 1
  MaxTries = 1
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  GoneIsTrue
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
  MarkReachesHead
