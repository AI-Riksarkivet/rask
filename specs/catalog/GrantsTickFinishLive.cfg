\* EXPECT VIOLATION TickBeginsNoDelete. U18 and U19 removed, the code before the third review of ADR 0245: a delete
\* past its stamp, refused at the purge's claim, puts its own record back live, and the tick, which listed it stamped,
\* reads it again, finds the same creation live and finishes it as a new delete with no caller: a live warehouse
\* deleted on nobody's authorization. With U19 alone removed nothing reaches the tick (GrantsPutBackPastStamp), and with
\* U18 alone removed no stamped record goes live for it to find, so this config removes both.
