  Verifiers = {"v1"}
  MaxFaults = 1
  HasBranch = TRUE
  HasDerived = FALSE
  CopyTags = TRUE
  Cuts = "main"
  Restores = FALSE
  DropUndrop = FALSE
  Reread = TRUE
  PlanFirst = TRUE
  Fenced = TRUE
  CAS = TRUE
  Sweep = TRUE
  NoticeFiled = TRUE
  TagsFiled = TRUE
  Reverify = TRUE
  Clones = FALSE
  ClonesEnd = TRUE
  CloneWaits = TRUE
  NoticeOfTheStanding = TRUE
  CreatorTold = TRUE
  ScheduleHeld = TRUE
  Moves = FALSE
  StalledDoors = FALSE
  PlacedOnly = TRUE
  FinishHeld = TRUE
  MarkFirst = FALSE
  FinishFenced = TRUE
  RefConfirmed = TRUE
  ReleasePins = TRUE
  VReclaimRead <- VReclaimReadC
  Cleanup <- CleanupC
  RClaim <- RClaimC
  Pinned <- PinnedC
INVARIANTS
  ARecordHasItsMark
  ACreatorIsToldBeforeTheRelease
  PinsNameRetainedVersions
  NothingDeletedComesBack
  EveryReleasedBranchComesBack
  NoCloneIsBroken
PROPERTIES
  ErasedOnceReleased
  EveryReleaseFinishes
  EveryoneIsTold
