\* ON DEMAND. ErasureRefsInTheGrace.cfg with reclaims off the history fence (ADR 0246): a tag and a branch made in the grace beside a release no reclaim waits for.
\* release ran, with one failure: the release takes them, reclaims the residual, and the subject is erased.
SPECIFICATION Spec
