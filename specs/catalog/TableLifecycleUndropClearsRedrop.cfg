\* EXPECT VIOLATION RecoverableUntilPurged. What UndropHoldsFence rests on: let an undrop lift its fence before it clears its trash record; a recoverable drop of the restored table files its record under the same uuid and deregisters, the undrop's clear deletes that record, and the table is in no name and no trash.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"softdrop_n1"}
  Ops2 = {"softdrop_n1"}
  Ops3 = {"undrop_n1"}
  InitialTable = TRUE
  MaxFaults = 0
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  Off = {"UndropHoldsFence"}
INVARIANTS
  RecoverableUntilPurged
