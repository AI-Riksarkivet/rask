  Tickets = TRUE
  Drain = TRUE
  FenceEdges = TRUE
  ReadsSubjects = TRUE
  FenceRevokes = TRUE
  BootConverge = TRUE
  Intents = TRUE
  AuthorizeFirst = TRUE
  Recheck = TRUE
  Sweeps = TRUE
  NamesIncarnation = TRUE
  ReleasesUnborn = TRUE
  KeepsBorn = TRUE
  FenceChildBirth = TRUE
