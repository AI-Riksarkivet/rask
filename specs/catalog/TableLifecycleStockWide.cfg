\* ON DEMAND. The stock writer, wide: a stock client declares n1, writes it and commits version 1 through version/create; against another principal's catalog create, the declarer's own catalog create or a drop of either kind; against nothing, another create, or another principal's stock client writing into the declaration; two failures, fences lapsing under live requests. 1,055,808 states, about three minutes on two workers of a loaded four-core machine.
