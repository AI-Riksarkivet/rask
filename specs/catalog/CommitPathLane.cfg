\* The gate: an /insert with an Idempotency-Key on a table declaring no primary key, sent three times with one body, beside a compaction committing through version/create; one death, one replan (CommitPathLaneWide.cfg, on demand, has two of each).
SPECIFICATION Spec
CONSTANTS
  Mix = "lane"
  MaxFaults = 1
  MaxTries = 1
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  GoneIsTrue
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
  MarkReachesHead
