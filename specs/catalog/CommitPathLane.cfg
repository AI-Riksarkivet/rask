\* The gate: an /insert with an Idempotency-Key on a table declaring no primary key, sent three times with one body, beside a compaction committing through version/create; two deaths, two replans.
SPECIFICATION Spec
CONSTANTS
  Mix = "lane"
  MaxFaults = 2
  MaxTries = 2
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
PROPERTIES
  EveryWriterEnds
