\* The gate: a table whose branch B and tag t1 pin a version holding the subject behind a deletion vector, and whose tag t0
\* pins one a read answers it from; a derived table; another caller cuts a branch from B; a recoverable drop and its undrop;
\* up to two failures: every invariant, and everyone told and every dropped tag announced whatever dies. Left out: a tag or a branch
\* from main made in the grace (ErasureRefsInTheGrace), and a restore (ErasureRestore, a limit).
SPECIFICATION Spec
CONSTANTS
  Verifiers = {"v1"}
  MaxFaults = 2
  HasBranch = TRUE
  HasDerived = TRUE
  CopyTags = FALSE
  Cuts = "B"
  Restores = FALSE
  DropUndrop = TRUE
  Reread = TRUE
  PlanFirst = TRUE
  Fenced = TRUE
  CAS = TRUE
  Sweep = TRUE
  NoticeFiled = TRUE
  TagsFiled = TRUE
  Reverify = TRUE
  Clones = FALSE
  ClonesEnd = TRUE
  CloneWaits = TRUE
  NoticeOfTheStanding = TRUE
  CreatorTold = TRUE
  ScheduleHeld = TRUE
  Moves = FALSE
  StalledDoors = FALSE
  PlacedOnly = TRUE
  FinishHeld = TRUE
  MarkFirst = FALSE
  FinishFenced = TRUE
  RefConfirmed = TRUE
INVARIANTS
  ARecordHasItsMark
  ACreatorIsToldBeforeTheRelease
  PinsNameRetainedVersions
  NothingDeletedComesBack
  ReleasedOnEvidence
  ReleasedStaysReleased
  ADerivedTableIsFollowed
  OnlyTagsOverTheSubjectAreDropped
  NoticeOnlyForARecordedRelease
  EveryReleasedBranchComesBack
  NoCloneIsBroken
PROPERTIES
  ErasedOnceReleased
  EveryObligationIsReleased
  EveryReleaseFinishes
  EveryoneIsTold
  EveryDroppedTagIsAnnounced
