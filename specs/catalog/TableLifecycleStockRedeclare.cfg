\* EXPECT VIOLATION DeclaredCredentialDiesWithItsFence. What RedeclareRenews rests on: let the declarer's DeclareTable sent again (or its credential refresh) answer its declaration as it stands, with a credential of the full TTL and the fence not renewed. The declaration lapses while the declarer still holds that credential, another principal's catalog create fences the claim, and the lapsed declarer's credential still reaches the location the create writes.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"stock_n1"}
  Ops2 = {"create_n1"}
  Ops3 = {"none"}
  InitialTable = FALSE
  MaxFaults = 0
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = TRUE
  CommitOutlastsLease = FALSE
  Off = {"RedeclareRenews"}
INVARIANTS
  DeclaredCredentialDiesWithItsFence
