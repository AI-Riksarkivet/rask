\* The gate's second part: two verifications at once on the same table, with branch B, a derived table and the
\* undrop; no failure: every invariant, and every obligation released, erased and its release finished.
SPECIFICATION Spec
CONSTANTS
  Verifiers = {"v1", "v2"}
  MaxFaults = 0
  HasBranch = TRUE
  HasDerived = TRUE
  CopyTags = FALSE
  Cuts = "none"
  Restores = FALSE
  DropUndrop = TRUE
  Reread = TRUE
  PlanFirst = TRUE
  Fenced = TRUE
  CAS = TRUE
INVARIANTS
  PinsNameRetainedVersions
  NothingDeletedComesBack
  ReleasedOnEvidence
  ReleasedStaysReleased
  ADerivedTableIsFollowed
  OnlyTagsOverTheSubjectAreDropped
  NoticeOnlyForARecordedRelease
  EveryReleasedBranchComesBack
PROPERTIES
  ErasedOnceReleased
  EveryObligationIsReleased
  EveryReleaseFinishes
