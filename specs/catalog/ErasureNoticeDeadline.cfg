  Reread = TRUE
  PlanFirst = TRUE
  Fenced = TRUE
  CAS = TRUE
  Sweep = TRUE
  NoticeFiled = TRUE
  TagsFiled = TRUE
  Clones = FALSE
  ClonesEnd = TRUE
  CloneWaits = TRUE
