\* The gate: an /insert with an Idempotency-Key on a table declaring a primary key, sent three times with one body (an attempt told 503 and running on, its lease lapsing, any dying), beside an unkeyed insert of another key; two deaths, two replans.
SPECIFICATION Spec
CONSTANTS
  Mix = "retry"
  MaxFaults = 2
  MaxTries = 2
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
