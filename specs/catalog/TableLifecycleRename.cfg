\* The gate's third part: a written table n1 that one caller drops (destroying it, or to the trash: the mix of
\* TableLifecycleSoftDropWrongRow) while another renames it to n2 and a third creates n1 again once the name is free;
\* up to two failures; the release and purge.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"drop_n1", "softdrop_n1"}
  Ops2 = {"rename_n1_n2"}
  Ops3 = {"create_n1"}
  InitialTable = TRUE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
