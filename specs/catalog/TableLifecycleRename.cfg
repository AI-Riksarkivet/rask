\* The gate's third part: a written table n1 that one caller destroys while another renames it to n2 and a third creates
\* n1 again once the name is free; up to two failures; the release and purge. The same mix with a recoverable drop is
\* TableLifecycleSoftDropWrongRow's finding.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"drop_n1"}
  Ops2 = {"rename_n1_n2"}
  Ops3 = {"create_n1"}
  InitialTable = TRUE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
