\* The gate's fourth part: the recoverable cascade ending at any table step, up to two times, beside a create of N, the
\* namespace undrop and the purge: nothing is lost and the re-issue finishes. Its ending between a namespace's drop and
\* record is a finding (CascadeNamespaceRecordAfterDrop).
SPECIFICATION Spec
CONSTANTS
  Recoverable = TRUE
  Creates = TRUE
  UndropsNs = TRUE
  UndropsT = FALSE
  Purges = TRUE
  WhDeletes = FALSE
  MaxFaults = 2
  FaultsIn = {"drop"}
  DropDiesAt = {"table", "detach"}
  ParentAtomic = TRUE
  Restrict = TRUE
  PurgeChecks = TRUE
INVARIANTS
  NoOrphan
  LiveHasData
  NothingIsLost
  NoTrashOutlivesItsWarehouse
PROPERTIES
  TheCascadeFinishes
  TheUndropFinishes
