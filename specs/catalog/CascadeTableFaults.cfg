\* The gate's fourth part: the recoverable cascade ending at any step of a table or a namespace (G2), and the namespace
\* undrop ending at any step (G3), up to two times between them, beside a create of N and the purge: nothing is lost,
\* and each re-issue finishes.
SPECIFICATION Spec
CONSTANTS
  Recoverable = TRUE
  Creates = TRUE
  UndropsNs = TRUE
  UndropsT = FALSE
  Purges = TRUE
  WhDeletes = FALSE
  MaxFaults = 2
  FaultsIn = {"drop", "undrop"}
  DropDiesAt = {"table", "detach", "nsdrop"}
  ParentAtomic = FALSE
  Restrict = TRUE
  PurgeChecks = TRUE
  NsFence = TRUE
  RecordFirst = TRUE
  ClearsLast = TRUE
  WhFence = TRUE
  UndropFenced = TRUE
INVARIANTS
  NoOrphan
  LiveHasData
  NothingIsLost
  NoTrashOutlivesItsWarehouse
PROPERTIES
  TheCascadeFinishes
  TheUndropFinishes
