\* The gate, liveness: CommitPathGap.cfg's writers with no death and one replan: every writer ends, every file is sealed, the mark reaches the head (CommitPathGapFull.cfg, on demand, with one death).
SPECIFICATION Spec
CONSTANTS
  Mix = "gap"
  MaxFaults = 0
  MaxTries = 1
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  GoneIsTrue
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
  MarkReachesHead
