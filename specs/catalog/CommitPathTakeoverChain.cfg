\* EXPECT VIOLATION KeyAppliedOnce. What KeyKeepsFirst rests on: a takeover that searches from the lapsed claim's own claim. The first attempt appends and dies before its answer; the second takes the key over, finds the append and dies before its answer; the third takes over from the second, searches only the versions since the second's claim, misses the append and appends again.
SPECIFICATION Spec
CONSTANTS
  Mix = "lane"
  MaxFaults = 2
  MaxTries = 1
  Off = {"KeyKeepsFirst"}
INVARIANTS
  KeyAppliedOnce
