\* The gate, container part: two deletes of one creation, one asked with force; a protected creation; a step between
\* the mark and the stamp failing, and the put-back failing too; the id made again (ADR 0245, second review S1).
\* Safety alone: two deletes asked again for ever may hand the mark between them for ever, so the liveness properties
\* are checked with one delete (Grants, GrantsMarkUnsettled).
