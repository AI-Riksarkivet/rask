\* The gate: an append to a table whose key is a field inside a struct and holds the value appended, beside a delete of it; two deaths, two replans.
SPECIFICATION Spec
CONSTANTS
  Mix = "nested"
  MaxFaults = 2
  MaxTries = 2
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
