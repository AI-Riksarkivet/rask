\* The gate: a key sent with one body, again with another, and again with the first, on a table declaring a primary key; two deaths, two replans.
SPECIFICATION Spec
CONSTANTS
  Mix = "rebody"
  MaxFaults = 2
  MaxTries = 2
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  GoneIsTrue
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
  MarkReachesHead
