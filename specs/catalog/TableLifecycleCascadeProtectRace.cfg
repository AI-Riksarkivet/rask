\* EXPECT VIOLATION ProtectedNeverDestroyed. What CascadeRereadsProtection rests on: let a destroying namespace cascade read each table's protection only when it lists the subtree; protection set after that read answers 200, since the cascade has fenced nothing yet, and the cascade then fences and destroys the table.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"cascade_n1"}
  Ops2 = {"protect_n1"}
  Ops3 = {"none"}
  InitialTable = TRUE
  MaxFaults = 0
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = FALSE
  CommitOutlastsLease = FALSE
  Off = {"CascadeRereadsProtection"}
INVARIANTS
  ProtectedNeverDestroyed
