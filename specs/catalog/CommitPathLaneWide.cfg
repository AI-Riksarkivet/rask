\* ON DEMAND. The lane gate with two deaths and two replans: an /insert with an Idempotency-Key on a table declaring no primary key, sent three times with one body, beside a compaction committing through version/create.
SPECIFICATION Spec
CONSTANTS
  Mix = "lane"
  MaxFaults = 2
  MaxTries = 2
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  GoneIsTrue
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
  MarkReachesHead
