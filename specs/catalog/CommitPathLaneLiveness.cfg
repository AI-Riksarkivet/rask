\* The gate, liveness: CommitPathLane.cfg's writers with no death and one replan: every writer ends, every file is sealed, the mark reaches the head (CommitPathLaneWide.cfg, on demand, has two deaths and two replans).
SPECIFICATION Spec
CONSTANTS
  Mix = "lane"
  MaxFaults = 0
  MaxTries = 1
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  GoneIsTrue
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
  MarkReachesHead
