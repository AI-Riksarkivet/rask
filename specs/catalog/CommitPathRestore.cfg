\* The gate: a /restore with an Idempotency-Key, sent twice with one body (an attempt told 503 and running on, its lease lapsing, either dying), beside an unkeyed append of another row; one death, one replan.
SPECIFICATION Spec
CONSTANTS
  Mix = "restore"
  MaxFaults = 1
  MaxTries = 1
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
  GoneIsTrue
  LandedDataSealed
PROPERTIES
  EveryWriterEnds
  EveryFileSealed
  MarkReachesHead
