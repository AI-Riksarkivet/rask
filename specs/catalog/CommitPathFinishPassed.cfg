\* EXPECT VIOLATION temporal. What FinishHoldsMark rests on: a reconciler finish that fails moves the mark past its version as past a finished one. Two keyed overwrites and an append; the append's writer dies after its version landed and before it sealed the transaction file Lance wrote inside the commit; the reconciler's first finish of that version fails (the store refused the record), and no later pass reads it again: the file stays unsealed and unrecorded for good.
SPECIFICATION Spec
CONSTANTS
  Mix = "overwrite"
  MaxFaults = 1
  MaxTries = 1
  Off = {"FinishHoldsMark"}
PROPERTIES
  EveryFileSealed
