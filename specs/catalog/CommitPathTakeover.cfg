\* EXPECT VIOLATION KeyAppliedOnce. What KeyRenews rests on: let a keyed append commit without renewing its claim; its caller is told 503 while it runs on, the lease lapses, the resend takes the key over, finds no commit carrying it and appends, and the first attempt then appends too.
SPECIFICATION Spec
CONSTANTS
  Mix = "lane"
  MaxFaults = 0
  MaxTries = 1
  Off = {"KeyRenews"}
INVARIANTS
  KeyAppliedOnce
