\* FINDING RecoverableUntilPurged. EXPECT VIOLATION RecoverableUntilPurged. A recoverable drop deregisters by name and never compares the row it removed with the location it fenced: a rename whose register fails puts its table back under the name after a create of the name rolled back, and the drop, which fenced and filed its record for the created table, detaches the renamed one, which no record keeps.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"softdrop_n1"}
  Ops2 = {"rename_n1_n2"}
  Ops3 = {"create_n1"}
  InitialTable = TRUE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
INVARIANTS
  RecoverableUntilPurged
