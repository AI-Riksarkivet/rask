\* EXPECT VIOLATION RecoverableUntilPurged. What CreateFenceHoldsDoors rests on: let a drop fence a table still being created; the create's rollback removes its row, a rename whose register failed puts its table back under the name, and the recoverable drop, which filed its record for the created table, detaches the renamed one, which no record keeps. CreateRenewsFence is removed too: a create that renews its fence before its rollback finds the drop's fence and rolls nothing back, which closes this trace on its own.
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"softdrop_n1"}
  Ops2 = {"rename_n1_n2"}
  Ops3 = {"create_n1"}
  InitialTable = TRUE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = FALSE
  CommitOutlastsLease = FALSE
  Off = {"CreateFenceHoldsDoors", "CreateRenewsFence"}
INVARIANTS
  RecoverableUntilPurged
