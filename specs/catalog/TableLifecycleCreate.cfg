\* The gate's second half: n1 starts free; one caller creates it, one drops it (to the trash or destroying it, its
\* declaration included) or renames it, one creates n2 or does nothing; up to two failures; the release and purge.
\* Left out, two findings' mix: a second create of n1 (TableLifecycleCreateRace, TableLifecycleCreateBothAnswered).
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"create_n1"}
  Ops2 = {"drop_n1", "softdrop_n1", "rename_n1_n2"}
  Ops3 = {"none", "create_n2"}
  InitialTable = FALSE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
