\* The gate's second part, safety: n1 starts free; one caller creates it, one creates it too, drops it (to the trash or destroying it, its declaration included) or renames it, one creates n2 or does nothing; up to two failures; the release and purge (TableLifecycleCreateLiveness.cfg, that all comes to rest).
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"create_n1"}
  Ops2 = {"create_n1", "drop_n1", "softdrop_n1", "rename_n1_n2"}
  Ops3 = {"none", "create_n2"}
  InitialTable = FALSE
  MaxFaults = 2
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = TRUE
  CommitOutlastsLease = FALSE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  RecoverableUntilPurged
  UndropRestoresExactly
