\* ON DEMAND. G5 with two failures, so one verification dies between the release's record and its notices and the
\* other meets the record and dies too: every invariant, every recorded deadline told and every release finished.
\* About 1.2 million states, fourteen minutes on two shared cores.
SPECIFICATION Spec
CONSTANTS
  Verifiers = {"v1", "v2"}
  MaxFaults = 2
  HasBranch = FALSE
  HasDerived = FALSE
  CopyTags = FALSE
  Cuts = "none"
  Restores = FALSE
  DropUndrop = FALSE
  Reverify = TRUE
  Reread = TRUE
  PlanFirst = TRUE
  Fenced = TRUE
  CAS = TRUE
  Sweep = TRUE
  NoticeFiled = TRUE
  TagsFiled = TRUE
  Clones = FALSE
  ClonesEnd = TRUE
  CloneWaits = TRUE
  NoticeOfTheStanding = TRUE
INVARIANTS
  PinsNameRetainedVersions
  NothingDeletedComesBack
  ReleasedOnEvidence
  ReleasedStaysReleased
  ADerivedTableIsFollowed
  OnlyTagsOverTheSubjectAreDropped
  NoticeOnlyForARecordedRelease
  EveryReleasedBranchComesBack
  NoCloneIsBroken
PROPERTIES
  EveryoneIsTold
  EveryReleaseFinishes
