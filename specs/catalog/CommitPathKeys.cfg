\* The gate: one key value written by an insert, a stock client through version/create and a delete, beside a compaction; one death, one replan.
SPECIFICATION Spec
CONSTANTS
  Mix = "keys"
  MaxFaults = 1
  MaxTries = 1
  Off = {}
INVARIANTS
  TypeOK
  KeyAppliedOnce
  AnsweredWriteLanded
  RefusedWriteAbsent
  KeyedRefusalIsTrue
  AnswerStands
  SuccessIsForItsBody
  SuccessCountsWhatLanded
  OneRowPerKey
PROPERTIES
  EveryWriterEnds
