\* The stock writer against the other doors that remove a declared table (ADR 0227 §9): a stock client declares n1, writes it and commits version 1 through version/create; against a recoverable drop, a namespace cascade destroying it or one moving it to the trash, each of which takes a declaration's fence over; against nothing or a protect of the name; one failure, fences lapsing under live requests (a declaration's wherever its declarer is).
SPECIFICATION Spec
CONSTANTS
  Ops1 = {"stock_n1"}
  Ops2 = {"softdrop_n1", "cascade_n1", "softcascade_n1"}
  Ops3 = {"none", "protect_n1"}
  InitialTable = FALSE
  MaxFaults = 1
  NameCAS = TRUE
  Fences = TRUE
  SettleOutlastsRequests = TRUE
  LiveLapse = TRUE
  CommitOutlastsLease = FALSE
  Off = {}
INVARIANTS
  LiveHasData
  NameLiveOnce
  OneNamePerLocation
  ProtectedNeverDestroyed
  PurgeNeverRemovesLive
  AnsweredCreateStands
  OneCreateCommitsPerTable
  DeclarationIsItsDeclarers
  DeclaredCredentialDiesWithItsFence
  RecoverableUntilPurged
  UndropRestoresExactly
PROPERTIES
  EverythingComesToRest
