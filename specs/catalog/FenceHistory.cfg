\* The gate for a table's history fence: two ref writes, a reclaim, two branch creates and a release, any hold may lapse
\* while its holder works: no two excluding holders hold the fence at once, and no last step is taken beside one admitted
\* since. Ref writes, whatever their number, are refused only by a reclaim, a scheduling or a release.
SPECIFICATION Spec
CONSTANTS
  Adds = {r1, r2}
  Drops = {c1}
  Branches = {b1, b2}
  Solos = {s1}
  Lapses = TRUE
  Recheck = TRUE
  Confirm = TRUE
INVARIANTS
  Exclusive
  NoLastStepBesideAnExcluder
