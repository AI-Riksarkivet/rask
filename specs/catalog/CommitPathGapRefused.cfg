\* EXPECT VIOLATION GoneIsTrue. What StampBeforeGap rests on: a search that refuses as soon as any version of its range is gone. The first attempt appends and dies before its answer; a compaction and an unkeyed append land after it; a cleanup removes the compaction; the resend takes the key over and is refused 409 for the gap, though the version its write landed as stands and carries the key, and so is every later send under the key.
SPECIFICATION Spec
CONSTANTS
  Mix = "gap"
  MaxFaults = 1
  MaxTries = 1
  Off = {"StampBeforeGap"}
INVARIANTS
  GoneIsTrue
