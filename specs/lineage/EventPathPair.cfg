\* Two events of every kind interleaved, with one failure. Safety only, so the two events are counted as interchangeable.
SPECIFICATION Spec
CONSTANTS
  Events = {e1, e2}
  MaxAttempts = 2
  MaxFaults = 1
  BusDeliveries = 0
  BusForgets = FALSE
SYMMETRY Interchangeable
INVARIANTS
  NoLoss
  OnlyAllowedEventsAreRecorded
  AFeedRowIsWhole
  OnlyRefusedEventsAreKeptAsRefused
  Bounded
