\* The gate: one event of every kind, up to three failures, every interleaving. Safety, and that all comes to rest.
SPECIFICATION Spec
CONSTANTS
  Events = {e1}
  MaxAttempts = 2
  MaxFaults = 3
  BusDeliveries = 0
  BusForgets = FALSE
INVARIANTS
  NoLoss
  OnlyAllowedEventsAreRecorded
  AFeedRowIsWhole
  OnlyRefusedEventsAreKeptAsRefused
  Bounded
PROPERTIES
  EverythingComesToRest
