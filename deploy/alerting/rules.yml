# Alert rules for the Lance-lakehouse estate, in Prometheus rule-file format: an artefact the platform's
# evaluator loads (vmalert, Prometheus, a GreptimeDB ruler), never part of the rask chart. In development the
# observability fixture's vmalert loads this file (deploy/fixtures/observability) against its GreptimeDB's PromQL
# endpoint and routes through Alertmanager. Every metric below is one this estate emits through the OTel Collector.
# Proven to FIRE on synthetic series by rules_test.yml (`make alert-rules-check` → promtool), and accepted by the
# GreptimeDB engine by `make alert-rules-drill` (docs/adr/0032-p3b-alerting-rule-logic-proven-hermetically-the-live.md).
# The point: these turn SILENT failures (data quietly stops flowing) into a page. See docs/runbooks/RUNBOOK-oncall.md.
groups:
  - name: lance-lineage
    rules:
      # DEPTH ALONE IS NOT A RELAY FAULT, and this rule asserted that it was. A governance refusal leaves
      # the event staged FOREVER by design — the graph's answer is deterministic and destroying the only
      # durable copy of a committed write's provenance is the wrong response to "you may not record this"
      # — so depth has a permanent floor equal to the number of refused events. Measured 2026-09-16 on the
      # `rask-lineage` lane: depth 6, oldest 179206s (2.1 days), while the relay was healthy (it drained
      # `drained=1 stranded=0` the moment ingest's credential landed). This rule would therefore have fired
      # CRITICAL continuously from the moment alerting was enabled, with a description that is false — and
      # a permanently-firing critical makes a genuinely stuck relay indistinguishable from a settled one,
      # neutralising the very alert this file exists to provide.
      #
      # THE GUARD IS "NOTHING IS MOVING", not "something is staged": page when the relay is neither
      # draining nor refusing, which is the condition that actually means stuck. `_total` is not optional
      # — the OTLP->Prometheus exporter suffixes counters, and the live information_schema carries
      # `outbox_events_drained_total` / `outbox_events_refused_total`. A rule naming the bare form matches
      # nothing and can never fire, which is the identical defect recorded below for `outbox_oldest_age`.
      #
      # `or vector(0)` IS LOAD-BEARING, not defensive noise. An `and` against an EMPTY vector yields
      # empty, so a guard naming a series that does not exist yet silently disables the whole alert —
      # turning a fix for a false page into a permanent no-page, which is strictly worse. Caught by
      # `make alert-rules-check`: without it, promtool replayed the existing depth-only fixture and the
      # critical did not fire at all. The counters are emitted on EVERY tick including zero
      # (`outbox_metrics.record_refused`), so in a running estate the series exists — this covers the
      # first tick after a fresh deploy, and a backend that drops an all-zero counter series.
      - alert: LineageOutboxNotDraining
        expr: >-
          max(outbox_depth) > 0
          and (sum(rate(outbox_events_drained_total[15m])) or vector(0)) == 0
          and (sum(rate(outbox_events_refused_total[15m])) or vector(0)) == 0
        for: 10m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage outbox not draining (depth > 0, nothing drained or refused for 15m)"
          description: >-
            Durable lineage events are staged and the relay is moving none of them — neither ingesting nor
            being refused. Provenance is not reaching the AGE graph and the relay, lineage, or the NATS bus
            is unhealthy. Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # VISIBLE WITHOUT PAGING. The estate should know that N events need a human; it should not be woken
      # for a condition that no retry changes and that has been true for days. Severity is the whole point
      # of splitting this out of the critical above.
      - alert: LineageOutboxEventsRefused
        expr: sum(rate(outbox_events_refused_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage outbox holds events the graph refuses to record"
          description: >-
            A producer staged provenance it is not authorized to write, so the relay re-refuses it every
            tick and the event stays staged. Not a relay fault and not retryable: either the producer's
            grant is wrong or the event should never have been staged.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # `_seconds`, and the suffix is the whole rule. The instrument declares `unit="s"`, and the
      # OTLP->Prometheus exporter APPENDS the unit — so the series is `outbox_oldest_age_seconds` and a
      # rule naming the bare form matches nothing and can never fire. Verified against the live store's
      # information_schema: `outbox_oldest_age_seconds` exists, `outbox_oldest_age` does not. The gate
      # could not have caught it either, because it read only the service's own metrics.py while this
      # instrument lives in the library's shared outbox module (`lakehouse.outbox_metrics`) — both halves fixed together.
      # SAME GUARD, same reason: a refused event ages forever, so without this the warning would also
      # never clear. Aging only means "the relay is lagging" when the relay is supposed to be moving it.
      - alert: LineageOutboxBacklogAging
        expr: >-
          max(outbox_oldest_age_seconds) > 300
          and (sum(rate(outbox_events_refused_total[15m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage outbox oldest staged event > 5 min old"
          description: >-
            The outbox relay is lagging; the oldest undrained event exceeds 300s.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      - alert: LineageOutboxStagingFailing
        expr: sum(rate(outbox_stage_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage events are publishing without a durable copy"
          description: >-
            The outbox stage is failing, so events reach the bus with the crash window OPEN: if the publish
            then fails the event is gone, and no other outbox signal can see it — depth and oldest-age
            describe staged objects, and publish_failed only counts a publish that HAD been staged.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # A CATALOG WRITE WHOSE PROVENANCE DID NOT GET RECORDED, which nothing else in this file can see.
      # The outbox rules above describe events that REACHED the outbox; this counts the emits that never
      # did. `lineage_emit.py` increments it on both transports and the two mean different things — on
      # `http` the event is gone, on `dapr` the publish goes through the
      # staged outbox so a failure after staging still leaves a durable copy. The counter cannot tell
      # them apart, so this pages on any sustained increase and the transport label says which to read.
      #
      # `_total` because the OTLP->Prometheus exporter suffixes counters — the identical defect this file
      # records twice already, where a rule naming the bare form matches nothing and can never fire.
      # Verified against the live store 2026-09-18: `catalog_control_emit_failed_total` is present under
      # exactly that spelling, and this counter's series is ABSENT because it has never been incremented
      # (an OTel counter exports nothing until its first `add`). A rule over an absent series is inert
      # rather than broken — it starts evaluating the moment the first failure creates it, which is the
      # moment it matters.
      - alert: CatalogLineageEmitFailing
        expr: sum(rate(catalog_lineage_emit_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Catalog writes are committing without recording their provenance"
          description: >-
            A catalog mutation committed to Lance and its lineage emit failed terminally, so lineage's feed
            does not record that the write happened and a pipeline following `/events` never hears of it.
            Read the `lance.catalog.transport` label — `http` means the event is gone, `dapr` means it may
            still be staged in the outbox.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # LH-497: the commit is the outbox. A find is a write whose own announcement was lost between its commit and its
      # staging, which the catalog's reconcile cron has just announced from the version log: the feed now holds it, and a
      # pipeline following `/events` was late to hear of it. Any find pages, as the closes-when of the row asks.
      # THE SECOND ARM IS A POD'S FIRST FIND. An OTel counter exports nothing until its first add, so its first sample is
      # already 1 and `increase()` reads 0 across it; a series present now and absent a window ago is that find. Measured
      # against GreptimeDB 2026-10-25 on the first live re-announcement: the `increase` arm alone returned no point, the
      # pair fired for the window after it. The two rules below carry the same pair.
      - alert: CatalogCommitsReannounced
        expr: (sum(increase(catalog_commit_reconcile_reannounced_total[15m])) > 0) or (sum(catalog_commit_reconcile_reannounced_total unless catalog_commit_reconcile_reannounced_total offset 15m) > 0)
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Committed versions reached lineage's feed only through the reconciler"
          description: >-
            The catalog's commit reconciler found committed versions whose own announcement lineage's feed lacked
            past the grace, and announced them from the version log. Each is an announcement lost between a commit
            and its staging, so a pipeline following `/events` started its next hop late. Read the
            `lance.catalog.operation` label and the catalog's `commit_reannounced` logs for the tables.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#committed-versions-re-announced

      # A version of an announced operation the catalog recorded no author for, whatever rask.author it carries, was
      # committed past every catalog door (or its record failed); nothing can announce it on anyone's behalf.
      - alert: CatalogCommitsUnauthored
        expr: (sum(increase(catalog_commit_reconcile_unauthored_total[15m])) > 0) or (sum(catalog_commit_reconcile_unauthored_total unless catalog_commit_reconcile_unauthored_total offset 15m) > 0)
        labels:
          severity: critical
          service: catalog
        annotations:
          summary: "A table holds versions no catalog door committed"
          description: >-
            The catalog's commit reconciler found committed versions for which the catalog recorded no author, whatever
            rask.author they carry: a manifest was finalized past every catalog door, by a credential that can write one,
            or the catalog's own record of a write Lance committed failed (a `commit_author_unrecorded` log names that
            version). The version is unjudged and unannounced. Read the catalog's `commit_unauthored` logs for the tables
            and versions.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#committed-versions-re-announced

      # A ref the reconciler cannot read past keeps its mark, so every lost announcement after that point waits on it.
      - alert: CatalogCommitReconcileBlocked
        expr: (sum(increase(catalog_commit_reconcile_unreadable_total[30m])) > 0) or (sum(catalog_commit_reconcile_unreadable_total unless catalog_commit_reconcile_unreadable_total offset 30m) > 0)
        for: 30m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The commit reconciler cannot read a table's version log"
          description: >-
            The catalog's commit reconciler could not read a retained version, or its commit time, on a table's ref, so
            it kept that ref's mark and announces nothing after it until it can. Read the catalog's
            `commit_reconcile_ref_unreadable` and `commit_reconcile_table_failed` logs for the table and the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#committed-versions-re-announced

      # A root whose __manifest history the catalog cannot reclaim keeps a version per namespace operation again, and keeps
      # every id dropped there readable in that history (LH-251, ADR 0185). One tick's failure is a blip the next tick
      # repairs; the same root failing on two ticks within half an hour is not.
      - alert: CatalogManifestReclaimFailing
        expr: (max by (lance_catalog_root) (increase(catalog_manifest_reclaim_failed_total[30m])) >= 2) or (max by (lance_catalog_root) (catalog_manifest_reclaim_failed_total unless catalog_manifest_reclaim_failed_total offset 30m) >= 2)
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The catalog cannot reclaim a root's namespace index history"
          description: >-
            The catalog's manifest reclaim tick failed on the root {{ $labels.lance_catalog_root }} on two ticks within half an hour, so
            every namespace operation there keeps a version of `__manifest` again and a dropped namespace or table stays
            readable in that history. Read the catalog's `manifest_reclaim_failed` logs for the root and the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-roots-namespace-index-is-not-reclaimed

      # A released erasure obligation is final, so a table found derived from its table after the release, written before
      # it, may still hold the subject (ADR 0183 §5). One is enough to page.
      - alert: ErasureDerivedAfterRelease
        expr: (sum(increase(catalog_erasure_late_derived_total[15m])) > 0) or (sum(catalog_erasure_late_derived_total unless catalog_erasure_late_derived_total offset 15m) > 0)
        labels:
          severity: critical
          service: catalog
        annotations:
          summary: "A table derived from an erased table was found after the erasure was released"
          description: >-
            The catalog's commit reconciler found a table derived from a released erasure obligation's table, whose write
            was declared before the release: the subject may stand in it. It is listed in the obligation's `late_derived`.
            Read the catalog's `erasure_late_derived` logs for the obligation and the tables.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-table-derived-from-an-erased-table-found-after-the-release

      # A watch that cannot read what it judges finds no late derived table, tick after tick.
      - alert: ErasureLateDerivedUnwatched
        expr: (sum(increase(catalog_erasure_late_derived_unwatched_total[30m])) > 0) or (sum(catalog_erasure_late_derived_unwatched_total unless catalog_erasure_late_derived_unwatched_total offset 30m) > 0)
        for: 30m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The catalog cannot watch released erasures for late derived tables"
          description: >-
            The catalog's commit reconciler could not read the erasure obligations, the input record, the edge list or a
            location claim, so it found no late derived table this half hour. Read the catalog's
            `erasure_late_derived_unread` logs for the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-table-derived-from-an-erased-table-found-after-the-release

      - alert: LineageIngestDeadLettering
        expr: sum(rate(lineage_events_processed_total{lance_lineage_outcome="dead_lettered"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage ingest dead-lettering — provenance is being LOST"
          description: >-
            A lineage event exhausted its Dapr resiliency schedule and was parked (a terminal loss signal).
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      - alert: LineageIngestDiscardingUnrepairable
        expr: sum(rate(lineage_events_processed_total{lance_lineage_outcome="unrepairable"}[5m])) > 0
        # 10m for the same reason `LineageIngestRefusingProvenance` uses it, and more so: the consumer
        # is ephemeral with `deliverPolicy: all`, so every roll re-presents the retained stream and
        # re-discards whatever still cannot be repaired. Measured 2026-09-18, one roll produced 70 of
        # these in a single burst and then silence. A 5m `for` cannot tell that bounded burst from a
        # producer emitting unparseable or unauthored events continuously.
        for: 10m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage is DISCARDING events it can never record — a producer is emitting garbage"
          description: >-
            A delivered event did not parse, carried no author at all, or named only outputs that
            carry no authorization tuple — so no tuple, redelivery or restart could ever make it
            recordable. It is ACKED rather than parked, deliberately — a DROP on this subscription
            writes a dead-letter duplicate of the same event on every roll — which means THIS COUNT IS
            THE ONLY TRACE IT LEFT. A rising line here is a producer regression: something is
            publishing to `lineage.events.v1` without a verified author, with a body that is not an
            OpenLineage RunEvent, or naming an output the estate does not govern. Distinct from
            `refused`, which is a named person lacking a grant on a table that EXISTS and is repairable
            by writing the tuple.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      - alert: LineageIngestRefusingProvenance
        expr: sum(rate(lineage_events_processed_total{lance_lineage_outcome="refused"}[5m])) > 0
        # 10m, not 5m, and the extra five minutes are the restart replay. The bus consumer is ephemeral
        # with `deliverPolicy: all`, so every lineage roll re-presents the whole retained stream;
        # byte-identical replays are exempt, but genuinely unauthorized history in that stream is
        # refused again each time. Measured 2026-09-09 on a real roll: 772 deliveries, 107 exempted,
        # 7 refused inside 90 seconds and then silent. A 5m `for` cannot tell that bounded burst from a
        # producer being refused continuously — the rate stays positive for a full 5m window after the
        # last increment — and an alert that pages on every deploy is one an operator learns to ignore.
        for: 10m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage ingest is REFUSING events — a producer's provenance is being dropped"
          description: >-
            A bus-delivered run was refused because its stamped author does not hold the rung its operation
            demands on the datasets it claims to have written, and a refusal is ACKED — so the loss is
            silent and permanent without this alert. Either a producer is claiming an identity it has no
            grant for (the case the gate exists to catch) or a legitimate producer lost a grant it needs
            (a broken cascade wearing an authorization costume). Distinct from `dropped`, which is a
            malformed payload and a question about the producer's schema rather than its permissions.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      # [[LH-064]] A refused signature is ACKED, so this counter is the only trace. `unsigned` and `signer` cannot be a listed
      # signer's genuine event and are not counted; `!=` twice because `!~` appears nowhere else in this file. What each reason
      # means: docs/runbooks/RUNBOOK-oncall.md#lineage-refusing-a-signers-events
      - alert: LineageSignatureRefusedForAListedSigner
        expr: sum by (lance_lineage_reason) (rate(lineage_signature_refused_total{lance_lineage_reason!="unsigned", lance_lineage_reason!="signer"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage is REFUSING events that claim a listed signer ({{ $labels.lance_lineage_reason }}) — their provenance is dropped"
          description: >-
            An event naming a chart-listed signer failed signature verification and was ACKED, so it is neither retried nor
            parked and only this alert and the `lineage_signature_refused` log line (identity, run id, reason) record it. A
            signer is broken or someone is forging a listed identity.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#lineage-refusing-a-signers-events

      # [[XC-078]] A bus door's refusal is ACKED, so its counter is the only trace. Every reason pages, unlike lineage's door:
      # every bus publisher signs, so any refusal is a forgery or a signer that broke.
      # Runbook: docs/runbooks/RUNBOOK-oncall.md#a-bus-door-refusing-events
      - alert: MaintenanceArrivalRefusingEvents
        expr: sum by (door, reason) (rate(maintenance_signature_refused_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance is REFUSING write events ({{ $labels.door }}, {{ $labels.reason }}) — their tables wait for their next pass"
          description: >-
            A write event no listed signer's key verifies was ACKED and held no pass, so only this alert and the
            `maintenance_signature_refused` log line record it; the table's next scheduled pass still reads it. Forged
            events are reaching the bus, or a signer broke.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-bus-door-refusing-events
      # [[CTL-32]] The catalog's own subscription to its control lane.
      - alert: CatalogControlLaneRefusingEvents
        expr: sum by (lance_catalog_reason) (rate(catalog_signature_refused_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: catalog
        annotations:
          summary: "The catalog is REFUSING control events ({{ $labels.lance_catalog_reason }}) — its feed and binding cache skip them"
          description: >-
            A control event its role's signature does not verify was ACKED, reached no change-event feed and evicted no
            binding, so only this alert and the `catalog_signature_refused` log line record it. Forged events are reaching
            the bus, or a signer broke and each replica keeps a binding the event would have evicted.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-bus-door-refusing-events

  - name: lance-catalog
    rules:
      # [[LH-559]] The catalog's broadcast control subscription parks on `dlq.catalog.control` once the sidecar's retry
      # schedule is spent. Nothing reads the park back (the ring buffer is a hint), so daprd's own count is the record:
      # it books `process_status="drop"` with an empty status, stored as `status="drop"`, only after the dead-letter
      # publish succeeded, or for a delivery the app's route answered 404 or that expired (dapr v1.19.0
      # pkg/runtime/subscription/subscription.go, postman/http/http.go:177). An app's own DROP answer books
      # `status="success"` and is not counted. Each replica parks its own copy of a broadcast, so the count is per replica.
      # daprd creates a series on the first event it books, so a pod's first park is a series appearing at 1, which
      # `increase` cannot see (it needs two samples): the `unless ... offset` arm fires on a series that was absent 10m ago.
      - alert: CatalogControlLaneDeadLettering
        expr: >-
          sum by (topic) (increase(dapr_component_pubsub_ingress_count_total{app_id="catalog", process_status="drop", status="drop"}[10m])) > 0
          or count by (topic) (dapr_component_pubsub_ingress_count_total{app_id="catalog", process_status="drop", status="drop"} unless dapr_component_pubsub_ingress_count_total{app_id="catalog", process_status="drop", status="drop"} offset 10m)
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The catalog dead-lettered control events ({{ $labels.topic }}) — its feed and binding cache missed them"
          description: >-
            A catalog replica's sidecar exhausted its retry schedule on a control event and parked it on dlq.catalog.control,
            so that replica's change-event feed lacks it and a binding the event names may stay cached until it expires. The
            park is kept on the DLQ stream. Read the replica's logs for the failing delivery (keys unavailable, a crash in
            the handler).
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      - alert: CatalogWritesShedSustained
        expr: sum(rate(catalog_writes_shed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Catalog shedding writes for 15m — persistently over write-concurrency capacity"
          description: >-
            The catalog has been returning 429 on bulk Arrow-IPC writes (the concurrent-write cap, P5
            load-shedding) for 15m — it is persistently over capacity, not just riding out a burst. Scale
            catalog replicas or raise LANCE_MAX_CONCURRENT_WRITES (watch the pod memory: each write buffers
            up to 256MiB). Runbook: docs/runbooks/RUNBOOK-oncall.md

      # THE TRIPWIRE FOR [[LH-050]], so the threshold re-reads itself. That row parks a query store on a
      # NUMBER rather than a ruling: no listing cache exists because listing load is nowhere near
      # interactive. Measured 2026-09-24 against this estate's GreptimeDB over a 1h window —
      # `/v1/namespace/{id}/list` and `/v1/namespace/{id}/table/list` do not appear among the catalog's
      # top eight routes at all, and `/management/v1/warehouses` read 0.000627 req/s on 2026-09-20, one request
      # every 27 minutes and three to four orders below the trigger. A threshold nobody re-reads is a row
      # that sits forever, so the wire trips itself instead of waiting to be re-run by hand.
      #
      # THE ROUTE LABEL IS `http_target`, NOT `http_route`, and it carries the TEMPLATED path
      # (`/v1/namespace/{id}/list`). A rule written against `http_route` selects nothing on this estate
      # and can never fire — the same class of defect this file already records for the bare `outbox_*`
      # counter names.
      #
      # `/v1/table/{id}/tags/list` IS EXCLUDED THOUGH IT IS A LISTING ROUTE, and the exclusion is
      # measured rather than tidy: at 0.265 req/s it is the maintenance sweep polling tags, not a person
      # browsing. Folding it in would park this alert a quarter of the way to its threshold on machine
      # traffic alone, and the trigger being asked about is INTERACTIVE frequency.
      - alert: CatalogListingLoadReachedInteractiveFrequency
        expr: >-
          sum(rate(http_server_duration_milliseconds_count{service_name="catalog", http_target=~"/v1/namespace/.*list|/management/v1/warehouses"}[30m])) > 1
        for: 30m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Catalog listing load reached interactive frequency — LH-050's query-store trigger"
          description: >-
            Namespace/table/warehouse listing has been served above 1 req/s for 30m, which is the order
            of magnitude LH-050 parked its query-store design on. Nothing is broken; the assumption the
            row rests on has expired. Re-read the per-route rates and take the row off the shelf.
            Runbook: docs/runbooks/RUNBOOK-oncall.md

  - name: lance-infra
    rules:
      # The infra-tier signal — a Dapr consumer-wedge. Dapr records the OUTCOME of every inbound pub/sub
      # delivery as dapr_component_pubsub_ingress_count{process_status=...}: a healthy consumer books
      # `success`; a handler that returns RETRY (its work keeps failing) books `retry` on every redelivery.
      # So a sustained rate of process_status="retry" is the wedge — the subscription is not draining.
      # (NOT dapr_resiliency_count, which is flat regardless of outcome, nor dapr_resiliency_activations_total,
      # which Dapr 1.18 doesn't emit — both verified live on the cluster.) A healthy transient error retries
      # then succeeds, so the 15m `for` rides out blips. NOTE the `_total` suffix: the OTel Collector's
      # prometheus receiver normalizes counters, so the Dapr `..._count` exposition lands in GreptimeDB as
      # `..._count_total` (verified live — the un-suffixed name returns nothing). The Collector scrapes the
      # sidecars into GreptimeDB, so this fires on a real wedge.
      - alert: DaprConsumerWedge
        expr: sum by (app_id) (rate(dapr_component_pubsub_ingress_count_total{process_status="retry"}[5m])) > 0
        for: 15m
        labels:
          severity: critical
          service: dapr
        annotations:
          summary: "Dapr consumer wedged — a subscriber is retrying inbound messages for 15m"
          description: >-
            A subscriber's handler has failed continuously: Dapr has booked process_status=retry on inbound
            deliveries for 15m without clearing, so this consumer is not draining its subscription and the
            cascade / lineage ingest has silently stopped. A healthy transient error clears in seconds. Check
            the wedged app's logs and its downstream (AGE / OpenFGA / RustFS). Runbook: docs/runbooks/RUNBOOK-oncall.md#a-subscriber-retries-without-end

  - name: lance-maintenance
    rules:
      # [[LH-559]] The write-event lane parks on `dlq.maintenance.arrival` once the sidecar's retry schedule is spent, and
      # nothing subscribes to it, so daprd's own count is the record: `status="drop"` is a park (or a 404 or an expired
      # delivery); an app's DROP answer is `status="success"` and not counted (CatalogControlLaneDeadLettering above).
      - alert: MaintenanceArrivalDeadLettering
        expr: >-
          sum by (topic) (increase(dapr_component_pubsub_ingress_count_total{app_id="maintenance", process_status="drop", status="drop"}[10m])) > 0
          or count by (topic) (dapr_component_pubsub_ingress_count_total{app_id="maintenance", process_status="drop", status="drop"} unless dapr_component_pubsub_ingress_count_total{app_id="maintenance", process_status="drop", status="drop"} offset 10m)
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance dead-lettered write events ({{ $labels.topic }}) — their tables wait for their next pass"
          description: >-
            The write-event lane's sidecar exhausted its retry schedule and parked a write on dlq.maintenance.arrival, so
            no pass was held for the commit; the table's next scheduled pass, within `maintenance.queue.recheckHours`,
            reads it, and the hourly audit queues one for a table no schedule holds. The park is kept on the DLQ stream. A
            lane that parks every delivery cannot reach the work queue or read a table's claim: read maintenance's logs
            for the failing delivery.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      # The drift report decides whether the purge may run at all and is the estate's answer to "is the
      # storage state understood". It reached a log line and nothing else until `maintenance.drift.items`
      # landed, so nothing here could name it.
      #
      # THE DELTA IS THE INCIDENT, not the level, for the reason the lineage rules above already give:
      # this estate carries a KNOWN backlog — 989 orphaned trash records measured 2026-09-20, residue
      # from warehouse deletes that predate the fix clearing them — and a `> 0` on the level would fire
      # on the first tick after deploy and stay firing on something no on-call window can clear. That is
      # how an alert becomes one people route to a muted channel. Drift that appeared TODAY is a
      # different claim: something started producing it.
      #
      # No `category` in the expr on purpose. A per-category rule is a hand-kept list, and the drift
      # categories are exactly the thing that grows — `orphaned_trash` itself was added the same day.
      # The label rides the firing series, so the alert still says WHICH category moved.
      - alert: MaintenanceDriftRising
        expr: delta(maintenance_drift_items[2h]) > 0
        for: 30m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A reconcile drift category grew in the last two hours — {{ $labels.category }}"
          description: >-
            The drift report (the hourly audit's, and the daily scan's, which adds the storage walk's two categories) is finding MORE of this drift category than it did two hours ago.
            Each category names a different disagreement between the registry, OpenFGA and object
            storage, and a rising one means something is producing it now rather than leaving residue
            from before. A gating category also blocks the expired-trash purge, so reclamation stops
            until it clears. Find the named objects in the `reconcile_drift` log line for the
            matching category; `orphaned_trash` and the other non-gating categories are counted and
            reported but never block the purge.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      # A failing dataset's pass is retried every `maintenance.queue.retrySeconds` (15 minutes) and counted once each
      # time, so the 1h window holds four, and a narrower one would drop to 0 between retries and reset the `for:`.
      - alert: MaintenanceDatasetsFailing
        expr: sum(increase(compaction_datasets_failed_total[1h])) > 0
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Table maintenance is failing on one or more datasets"
          description: >-
            A table's pass could not complete one or more datasets, and retries them every
            `maintenance.queue.retrySeconds`. Sustained failure means those datasets accumulate superseded versions
            indefinitely. Break down by error.type; the per-dataset URI is on the trace span and in the
            maintenance_dataset_outcome log line, deliberately not on the metric (unbounded cardinality).

      # The worker's heartbeat is the hourly audit (`maintenance.queue.auditSchedule`): a NATS message schedule puts it
      # on the work queue once an hour whatever the replica count, and one worker runs it. Its stopping is silent by
      # construction: nothing raises, the schedule simply never reaches a worker that completes it. A 2h window over
      # the hourly audit, so one slow audit does not page. The series exists from a worker's start at 0
      # (`create_task_series`), so a flat zero is a worker that runs and completes no audit.
      - alert: MaintenanceAuditNotCompleting
        expr: sum(increase(maintenance_tasks_completed_total{kind="audit"}[2h])) == 0
        for: 30m
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "No maintenance audit has COMPLETED in two hours"
          description: >-
            The hourly audit (the drift report, its repairs, the release of every drop past its deadline, and the
            backstop that queues a table no schedule holds) has not completed in two hours. Either its schedule no
            longer reaches a worker, or every audit fails or overruns: compare maintenance_tasks_ended_total and
            maintenance_passes_overran_total for kind audit, and read the maintenance_task_retried log lines.

      # ABSENT IS NOT ZERO. A worker that has died, or whose export broke, emits no maintenance_tasks_completed_total
      # at all, and the `== 0` above cannot fire over a vector that does not exist. Bare `absent()` in its own rule:
      # GreptimeDB answers HTTP 500 to the composite form. The series exists from a worker's start, so the `for:` is
      # the export's own lag.
      - alert: MaintenanceTaskMetricsMissing
        expr: absent(maintenance_tasks_completed_total)
        for: 15m
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "Maintenance's worker has stopped reporting entirely"
          description: >-
            No `maintenance_tasks_completed_total` series exists. No maintenance worker runs, or its OTLP export is
            broken: nothing passes a table, releases a drop or audits the estate, and nothing else in this file can
            tell you.

      # The daily scan (`maintenance.queue.scanSchedule`): the drift report with the storage walk, and the expired-trash
      # purge, which acts only on its own scan's report. A 26h window over the daily schedule, so one late scan does
      # not page.
      - alert: MaintenanceScanNotCompleting
        expr: sum(increase(maintenance_tasks_completed_total{kind="scan"}[26h])) == 0
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "No maintenance scan has COMPLETED in a day"
          description: >-
            The daily scan has not completed in 26 hours, so no storage walk or expired-trash purge ran.
            Either its schedule no longer reaches a worker, or the scan fails or overruns every time: compare
            maintenance_tasks_ended_total and maintenance_passes_overran_total for kind scan.

      # A task a worker ended: it failed, or outlived its worker, on every delivery. No `for:`: an end is final.
      - alert: MaintenanceTasksEnded
        expr: sum by (kind) (increase(maintenance_tasks_ended_total[1h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance ended {{ $labels.kind }} tasks that failed on every delivery"
          description: >-
            A {{ $labels.kind }} task failed, or outlived its worker, on each of its `maintenance.queue.maxDeliver`
            deliveries, and a worker ended it. The maintenance_task_ended ERROR line names the subject and the last error; kind unreadable is a
            message no task parses. Its next try is held `maintenance.queue.recheckHours` out, unless a commit queues it sooner.

      # A task running past its bound (`maintenance.queue.maxPassSeconds`, or `maintenance.orphanCheck.maxSeconds` for a
      # table's orphan check). It keeps its task until twice that, when its replica exits and the task is delivered again,
      # so until then this count is the only sign.
      - alert: MaintenancePassesOverran
        expr: sum by (kind) (increase(maintenance_passes_overran_total[1h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A maintenance {{ $labels.kind }} task is running past its bound"
          description: >-
            A {{ $labels.kind }} task has run past its bound (`maintenance.queue.maxPassSeconds`, or
            `maintenance.orphanCheck.maxSeconds` for kind orphans) and still holds its task; at twice that its replica
            exits and the task is delivered again. The
            maintenance_task_overran ERROR line names its subject and how long it had run; while it runs, no later
            commit's pass of its table can start.

      # The queue as the worker samples it each minute (`maintenance.services.queue.sample_queue`). The gauge's
      # instrument is `maintenance.queue.oldest` with unit `s`, which the exporter appends, as for `outbox_oldest_age_seconds`
      # above. Every replica samples the same streams, so `max` reads one value. MAINTENANCE_TASKS drops a message at its
      # 24 h max age (`chart/templates/nats-stream-job.yaml`) with no consumer told, so a task waiting 6 h is the warning
      # while 18 h are left to act.
      - alert: MaintenanceTaskAging
        expr: max by (stream) (maintenance_queue_oldest_seconds{stream="MAINTENANCE_TASKS"}) > 21600
        for: 30m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A maintenance task has waited more than six hours on the queue"
          description: >-
            The oldest message on MAINTENANCE_TASKS is over six hours old: tasks wait unrun, and at 24 hours the stream
            drops them unrun, their tables left to the hourly audit. Read maintenance_queue_ack_pending and
            maintenance_queue_redelivered for consumer maintenance-worker (deliveries stuck, or a task delivered again and
            again), maintenance_passes_overran_total (a pass holding its replica), and whether any worker replica runs and
            is ready (maintenance_tasks_completed_total).

      # A store event the worker ended (its handling refused on every delivery, or outlived its worker every time) or could
      # not read: its table's overwrite check waits for the daily recheck. Every outcome's series is created at 0 when a
      # worker starts, so the first end is an increase. No `for:`: an end is final.
      - alert: MaintenanceStoreEventsEnded
        expr: sum by (outcome) (increase(maintenance_store_events_settled_total{outcome=~"ended|unreadable"}[1h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance {{ $labels.outcome }} store events in the last hour"
          description: >-
            The worker settled store events as {{ $labels.outcome }}: ended, the store or the bus refused their handling on
            every delivery (or the worker died on every one); unreadable, the body is no S3 event record the worker parses
            (the contract is `objectStore.events` in the chart's values). Each one's table is passed at its daily recheck
            instead of after the write. The maintenance_store_event_ended and maintenance_store_event_unreadable ERROR lines
            name the subject and the error.

      # Delivery of store events stops when the durable's deliveries awaiting an ack reach its `max_ack_pending` (1000,
      # `chart/templates/nats-stream-job.yaml`): 900 is 90 % of it.
      - alert: MaintenanceStoreEventsStuck
        expr: max by (consumer) (maintenance_queue_ack_pending{consumer="maintenance-store-events"}) >= 900
        for: 15m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Store events are near the delivery ceiling of their consumer"
          description: >-
            The maintenance-store-events consumer awaits an acknowledgement for at least 900 deliveries, 90 % of its
            max_ack_pending of 1000; at the ceiling the bus delivers no more store events, and overwrites are found only at
            each table's daily recheck. Read maintenance_store_events_settled_total by outcome (retried rising: the store
            refuses the claim reads) and maintenance_queue_oldest_seconds for STORE_EVENTS, and the
            maintenance_store_event_retried WARNING lines.

      # A governed bucket the hourly audit found configured with no store event for its writes
      # (`maintenance.services.bucket_events`): a file overwritten in place there is found only at its table's daily
      # recheck. The audit counts each bucket once per run on `maintenance_store_event_buckets_checked_total` by
      # outcome, a counter that sums across replicas and stops rising once the buckets are fixed; 2h spans two audits, so
      # a bucket the catalog just made waits one for its store's operator to configure it.
      - alert: MaintenanceBucketWithoutStoreEvents
        expr: sum(increase(maintenance_store_event_buckets_checked_total{outcome="without"}[2h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A governed bucket sends no store events for its writes"
          description: >-
            The hourly audits of the last two hours found governed buckets whose event configuration holds no
            s3:ObjectCreated:* rule over the whole bucket, so maintenance hears of no write there and a committed file
            overwritten in place is found only at its table's daily recheck. The maintenance_bucket_without_store_events
            WARNING line names each bucket; configure it to deliver every object write to the bus subject store.events
            (`objectStore.events` in the chart's values).

      # A governed bucket the store would not answer about: the read was refused (measured: a canned policy without
      # s3:GetBucketNotification answers 403 for every bucket) or failed, so whether it sends its events is unknown,
      # and an estate where every read is refused would otherwise report nothing missing.
      - alert: MaintenanceBucketStoreEventsUnknown
        expr: sum(increase(maintenance_store_event_buckets_checked_total{outcome="unknown"}[2h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "The store will not say whether a governed bucket sends store events"
          description: >-
            The hourly audits of the last two hours could not read the event configuration of governed buckets: the
            store refused or failed GetBucketNotificationConfiguration, so whether each sends its writes as store events
            is unknown, and it is never counted as configured. The maintenance_bucket_store_events_unknown WARNING line
            names each bucket and the error; grant maintenance's store identity s3:GetBucketNotification on the bucket,
            or restore the store.

      # A fired schedule the queue refused or did not answer is given back and moved again 15 s later, so one refusal
      # heals; a refusal standing an hour is a table whose time never comes. Its series is created at 0 when a worker
      # starts.
      - alert: MaintenanceSchedulesNotQueued
        expr: sum(increase(maintenance_schedules_not_queued_total[1h])) > 0
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Fired maintenance schedules are not reaching the work queue"
          description: >-
            For an hour the queue has refused, or not answered, fired schedules the worker moves onto MAINTENANCE_TASKS, so
            those tables' passes, trash releases and orphan checks do not run. The maintenance_due_not_queued WARNING line
            names the subject and the bus's answer; check that MAINTENANCE_TASKS exists as the chart's stream Job declares
            it (`nats stream info MAINTENANCE_TASKS` as the monitor user).

      # `SUPPORTED` is a whitelist, so a pylance upgrade that introduces a legitimate new manifest flag
      # makes a pass refuse datasets it used to maintain — and refusals are NOT errors, so nothing
      # else in this file would fire. Measured 2026-08-16: 17 refused datasets were exactly the ones
      # that needed compaction, and the estate looked healthy throughout.
      - alert: MaintenanceRefusalsRising
        expr: sum(increase(compaction_datasets_refused_total[1h])) > sum(increase(compaction_datasets_swept_total[1h])) / 2
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "More than half of the datasets passed are being REFUSED"
          description: >-
            The supported-manifest-flag whitelist is rejecting most of the estate, so maintenance is
            running without reclaiming. Usually a pylance upgrade introducing a flag the guard does not
            know. Check the refusal reasons in the maintenance_dataset_outcome log line.

      # One mixed table is an incident the ratio rule above cannot see (45.3-46.5% of every sweep is refused,
      # measured 2026-09-24). No `for:`: the flag cannot be removed, so waiting buys nothing. The window sets how
      # long the alert HOLDS between counts: a refused table is passed again only at its recheck
      # (`maintenance.queue.recheckHours`, a day) or its next commit, so the window spans a recheck; a policy-skipped
      # table is never opened, so it is not counted.
      - alert: LanceMixedDataFileVersions
        expr: sum(increase(compaction_datasets_mixed_file_versions_total[25h])) > 0
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "A Lance table's data files are at more than one file version"
          description: >-
            A table's pass found a table whose manifest carries reader flag 256 (mixed data file versions).
            The flag is sticky: no Lance operation removes it. pylance 11 and lancedb 0.34 (lance core 8)
            cannot open the table (pylance 12+ and lancedb 0.40 can), and maintenance refuses it on every pass. The only measured heal is
            recreating it into a new dataset, which re-mints _rowid and drops history, tags, branches and
            indices. Find the table in the maintenance_dataset_outcome records where
            mixed_data_file_versions is true, and the writer that appended at another data_storage_version.

      # A file a commit added, replaced in place ([[LH-419]]): readers are served bytes no commit wrote. No `for:`: a page
      # delayed is a noncurrent version nearer its expiry. The table's pass counts the file each time it runs, the one its
      # store event holds and then its recheck a day later, so the window is 25h: the page stands until a day's passes
      # find the file restored.
      - alert: CommittedFileOverwritten
        expr: sum(increase(maintenance_files_overwritten_total[25h])) > 0
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "A committed Lance file was overwritten in place"
          description: >-
            A table's pass found a file a commit added whose ETag or size is no longer what the catalog recorded when it
            committed: a holder of the table's write vend put over it, and readers are served bytes no commit wrote.
            The committed_file_overwritten ERROR log names the table uuid, the path and both ETags. Restore the file's
            noncurrent object version, which a platform store keeps for this, and find the writer in the store's
            access log.

      # A commit whose added files the catalog could not record ([[LH-419]]): no pass reads them, so an overwrite
      # of them would go unseen. The table still serves what was committed, so this warns rather than pages critical.
      - alert: CommittedFilesUnrecorded
        expr: sum(increase(catalog_committed_files_unrecorded_total[1h])) > 0
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "A commit's files were not recorded, so maintenance never checks them"
          description: >-
            A write Lance commits in one call (the create door's write, an unkeyed /insert) landed a version whose
            added files the catalog could not record on its control root, so maintenance never reads them again and an
            overwrite of them goes unseen. The committed_files_unrecorded ERROR log names the location, the version and
            the store's error.

      # One table the catalog keeps refusing, which the ratio rule cannot see: an id that holds no tuples is answered
      # 403 at the vend door on every pass. A refused table is passed again at its recheck (a day) or its next commit, and
      # a series first appears at 1, which increase() cannot see, so the rule fires at the second refused pass a 25h
      # window holds: a table refused on passes a day apart. vmalert keeps `for:` in memory, so its own restart restarts
      # the clock.
      - alert: MaintenanceTableParked
        expr: sum by (table_id) (increase(compaction_tables_parked_total[25h])) > 0
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "The catalog has refused maintenance of {{ $labels.table_id }} on passes a day apart"
          description: >-
            For a day the catalog has refused this table id, so its superseded versions are not reclaimed.
            Break down by refused_by. vend_denied is a 403: this identity holds no can_maintain on the id,
            or the id names no table, which is what a stale lineage.dataset_id stamp leaves.
            table_not_governed is a 404. Grant the id, or fix the stamp or the location. The
            maintenance_vend_denied and maintenance_table_not_governed WARNING lines name the dataset.

  # ==================================================================================================
  # THE HTTP PLANE — fourteen apps emitted RED metrics and not one rule read them.
  #
  # `grep 'http_server\|ingest_\|flows_\|gateway\|compute_\|controlplane' rules.yml` returned ZERO at
  # HEAD on 2026-08-26. Every app emits `http.server.*` automatically (`opentelemetry-instrument` wires the
  # FastAPI instrumentor), the chart provisions a Perses "Fleet — RED" dashboard from those very
  # series, and nothing turned any of it into a page. Eight of fourteen apps had no group at all —
  # including the gateway and every app a browser talks to.
  #
  # The concrete scenario, and it is not hypothetical: the catalog starts answering 500 on every
  # `POST /v1/table/{id}/describe`. The only rule in `lance-catalog` counts 429s on Arrow-IPC WRITES,
  # which stays at zero throughout. A catalog failing 100% of reads pages nobody.
  #
  # SERIES NAMES VERIFIED AGAINST THE LIVE STORE, not inferred. It is
  # `http_server_duration_milliseconds_*` — the OTLP->Prometheus exporter APPENDS the unit, so a rule
  # naming `_seconds` matches nothing and can never fire. That is the `outbox_oldest_age` defect, and
  # it is the reason every expression below was replayed against GreptimeDB before being written down.
  - name: lance-http
    rules:

      # THE LOAD-BEARING ONE. A ratio, not a count: absolute 5xx tells you nothing without traffic,
      # and a service that serves ten requests an hour would never cross a count threshold however
      # broken it is. `service_name` is the instrumentor's own label (verified live: catalog, gateway,
      # lineage and maintenance all report it).
      - alert: HttpServerErrorRatioHigh
        expr: sum by (service_name) (rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m])) / sum by (service_name) (rate(http_server_duration_milliseconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "More than 5% of one service's HTTP responses are 5xx"
          description: >-
            A service is failing its own requests. This is the estate's only fleet-wide failure
            signal — before it existed, a service could 500 on every read and no rule anywhere
            noticed. Split by `service_name` to find which. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#a-service-answers-5xx-or-slowly

      # LATENCY, and the threshold is deliberately far above the observed estate rather than tuned to
      # it. Measured over a 10m window on 2026-08-26: lineage 500ms. A latency rule that cries wolf is
      # one people mute, and a muted rule is worse than none.
      #
      # `histogram_quantile` over the bucket series is supported by GreptimeDB — verified by running
      # this exact expression against the live store, because promtool accepting it proves nothing
      # about the engine that evaluates it.
      # Maintenance is held to it like any service: its work runs on its work queue (ADR 0198 §2), never inside a
      # request, so its doors (the write-event lane's delivery, the probes) answer as quickly as the rest.
      - alert: HttpServerLatencyHigh
        expr: histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_duration_milliseconds_bucket[10m]))) > 15000
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "One service's p95 HTTP latency is above 15s"
          description: >-
            Sustained p95 over 15 seconds means requests are queueing behind something — a blocking
            call on the event loop, an exhausted threadpool, or an upstream that stopped answering.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-service-answers-5xx-or-slowly

      # The watcher's watcher. Both rules above evaluate over an empty vector and go quiet if the
      # instrumentor stops exporting — indistinguishable from an estate serving no errors. Bare
      # `absent()` in its own rule, never as an operand of a set operator: GreptimeDB refuses the
      # composite form outright (HTTP 500).
      - alert: HttpServerMetricsMissing
        expr: absent(http_server_duration_milliseconds_count)
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "No app is reporting HTTP metrics at all"
          description: >-
            `http_server_duration_milliseconds_count` does not exist, so HttpServerErrorRatioHigh and
            HttpServerLatencyHigh are both dead and their silence means nothing. Either
            `opentelemetry-instrument` stopped wiring the FastAPI instrumentor, or the OTLP path to
            GreptimeDB is broken. Runbook: docs/runbooks/RUNBOOK-oncall.md#no-app-reports-http-metrics
