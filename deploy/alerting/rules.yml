# Alert rules for the Lance-lakehouse estate, in Prometheus rule-file format: an artefact the platform's
# evaluator loads (vmalert, Prometheus, a GreptimeDB ruler), never part of the rask chart. In development the
# observability fixture's vmalert loads this file (deploy/fixtures/observability) against its GreptimeDB's PromQL
# endpoint and routes through Alertmanager. Every metric below is one this estate's services export to the platform's OTLP gateway.
# Proven to FIRE on synthetic series by rules_test.yml (`make alert-rules-check` → promtool), and accepted by the
# GreptimeDB engine by `make alert-rules-drill` (docs/adr/0032-p3b-alerting-rule-logic-proven-hermetically-the-live.md).
# The point: these turn SILENT failures (data quietly stops flowing) into a page. See docs/runbooks/RUNBOOK-oncall.md.
groups:
  - name: lance-lineage
    rules:
      # DEPTH ALONE IS NOT A RELAY FAULT, and this rule asserted that it was. A governance refusal leaves
      # the event staged FOREVER by design — the graph's answer is deterministic and destroying the only
      # durable copy of a committed write's provenance is the wrong response to "you may not record this"
      # — so depth has a permanent floor equal to the number of refused events. Measured 2026-09-16 on the
      # `rask-lineage` lane: depth 6, oldest 179206s (2.1 days), while the relay was healthy (it drained
      # `drained=1 stranded=0` the moment ingest's credential landed). This rule would therefore have fired
      # CRITICAL continuously from the moment alerting was enabled, with a description that is false — and
      # a permanently-firing critical makes a genuinely stuck relay indistinguishable from a settled one,
      # neutralising the very alert this file exists to provide.
      #
      # THE GUARD IS "NOTHING IS MOVING", not "something is staged": page when the relay is neither
      # draining nor refusing, which is the condition that actually means stuck. `_total` is not optional
      # — the OTLP->Prometheus exporter suffixes counters, and the live information_schema carries
      # `outbox_events_drained_total` / `outbox_events_refused_total`. A rule naming the bare form matches
      # nothing and can never fire, which is the identical defect recorded below for `outbox_oldest_age`.
      #
      # `or vector(0)` IS LOAD-BEARING, not defensive noise. An `and` against an EMPTY vector yields
      # empty, so a guard naming a series that does not exist yet silently disables the whole alert —
      # turning a fix for a false page into a permanent no-page, which is strictly worse. Caught by
      # `make alert-rules-check`: without it, promtool replayed the existing depth-only fixture and the
      # critical did not fire at all. The counters are emitted on EVERY tick including zero
      # (`outbox_metrics.record_refused`), so in a running estate the series exists — this covers the
      # first tick after a fresh deploy, and a backend that drops an all-zero counter series.
      #
      # EVERY OUTBOX SERIES NAMES ITS LANE (`lance_outbox_lane`: `lineage`, `control`), since one process can work both
      # outboxes: the lineage rules select theirs, and the control outbox, which the catalog's control relay drains, has
      # its own two rules below. A depth is reported only by the replica that measured it on the relay's last window, and
      # not at all by a tick that could not list the outbox, which `LakehouseTimerFailing` says.
      - alert: LineageOutboxNotDraining
        expr: >-
          max(outbox_depth{lance_outbox_lane="lineage"}) > 0
          and (sum(rate(outbox_events_drained_total{lance_outbox_lane="lineage"}[15m])) or vector(0)) == 0
          and (sum(rate(outbox_events_refused_total{lance_outbox_lane="lineage"}[15m])) or vector(0)) == 0
        for: 10m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage outbox not draining (depth > 0, nothing drained or refused for 15m)"
          description: >-
            Durable lineage events are staged and the relay is moving none of them — neither ingesting nor
            being refused. Provenance is not reaching the AGE graph and the relay, lineage, or the NATS bus
            is unhealthy. Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # VISIBLE WITHOUT PAGING. The estate should know that N events need a human; it should not be woken
      # for a condition that no retry changes and that has been true for days. Severity is the whole point
      # of splitting this out of the critical above.
      - alert: LineageOutboxEventsRefused
        expr: sum(rate(outbox_events_refused_total{lance_outbox_lane="lineage"}[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage outbox holds events the graph refuses to record"
          description: >-
            A producer staged provenance the bus door's gate refuses: its author holds no grant to record it,
            no listed signer's key verifies it, or no grant could ever repair it. The relay records each in the
            refusals table and retires its staged object, and the outbox door of
            `lineage_events_processed_total` says which class. Not a relay fault and not retryable: either the
            producer's grant or key is wrong or the event should never have been staged.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # `_seconds`, and the suffix is the whole rule. The instrument declares `unit="s"`, and the
      # OTLP->Prometheus exporter APPENDS the unit — so the series is `outbox_oldest_age_seconds` and a
      # rule naming the bare form matches nothing and can never fire. Verified against the live store's
      # information_schema: `outbox_oldest_age_seconds` exists, `outbox_oldest_age` does not. The gate
      # could not have caught it either, because it read only the service's own metrics.py while this
      # instrument lives in the library's shared outbox module (`lakehouse.outbox_metrics`) — both halves fixed together.
      # SAME GUARD, same reason: a refused event ages forever, so without this the warning would also
      # never clear. Aging only means "the relay is lagging" when the relay is supposed to be moving it.
      - alert: LineageOutboxBacklogAging
        expr: >-
          max(outbox_oldest_age_seconds{lance_outbox_lane="lineage"}) > 300
          and (sum(rate(outbox_events_refused_total{lance_outbox_lane="lineage"}[15m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage outbox oldest staged event > 5 min old"
          description: >-
            The outbox relay is lagging; the oldest undrained event exceeds 300s. If `outbox_drop_failed_total` rises
            with it, the store refuses a publisher's deletes of what it delivered.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # Each outbox counter below exists at 0 from the start of what stages into its lane or drains it
      # (`lakehouse.outbox_metrics.create_series`), so the first count is an increase.
      - alert: OutboxStagingFailing
        expr: sum by (lance_outbox_lane) (rate(outbox_stage_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "{{ $labels.lance_outbox_lane }} events are publishing without a durable copy"
          description: >-
            The {{ $labels.lance_outbox_lane }} outbox's stage is failing, so events reach the bus with the crash window
            OPEN: if the publish then fails the event is gone, and no other outbox signal can see it — depth and oldest-age
            describe staged objects, and publish_failed only counts a publish that HAD been staged.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # A publish that fails after its stage leaves the event staged for its relay, which is the outbox working. Failing
      # for fifteen minutes is a bus that takes nothing from this lane's publishers.
      - alert: OutboxPublishFailing
        expr: sum by (lance_outbox_lane) (rate(outbox_publish_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "{{ $labels.lance_outbox_lane }} events have failed to publish for 15m and wait in the outbox"
          description: >-
            Publishes on the {{ $labels.lance_outbox_lane }} lane have failed for 15m. Each event is staged and its relay
            delivers it once the bus takes it, so nothing is lost while the outbox is written; every consumer of the lane
            hears late. Read the publisher's `lineage_publish_failed` or `control_publish_failed` log for the bus's answer
            and `messaging_client_operation_duration_seconds_count` by `error_type`.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # A published event whose staged copy the store will not delete is delivered again on every relay tick.
      - alert: OutboxDropFailing
        expr: sum by (lance_outbox_lane) (rate(outbox_drop_failed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "The store refuses deletes of delivered {{ $labels.lance_outbox_lane }} events"
          description: >-
            For 15m the object store has refused the delete of staged {{ $labels.lance_outbox_lane }} events that were
            delivered, so each stays staged and its relay delivers it again on every tick. Nothing is lost; consumers
            see duplicates, and the outbox grows. Read the `outbox_drop_failed` and `control_outbox_left_staged` logs for
            the store's error. Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # An event a relay tick failed on is left staged and tried again. Stranded on every tick for half an hour is an
      # event the feed cannot take, or a dependency of the relay that is down.
      - alert: OutboxEventsStranded
        expr: sum by (lance_outbox_lane) (rate(outbox_events_stranded_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "The {{ $labels.lance_outbox_lane }} relay has left staged events it failed on for 30m"
          description: >-
            Every tick for 30m the {{ $labels.lance_outbox_lane }} relay failed on staged events and left them for the
            next: the feed or the catalog did not take them. They are intact and retried. Read the relay's
            `lineage_outbox_event_stranded` log for the run and the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # A staged object a relay discarded: one no parser reads, or on the control lane one the catalog did not sign.
      # No `for:`: a discard is final, and its log line is the only copy of what it was.
      - alert: OutboxPoisonDropped
        expr: sum by (lance_outbox_lane) (increase(outbox_events_poison_dropped_total[1h])) > 0
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "A relay discarded staged {{ $labels.lance_outbox_lane }} objects it can never deliver"
          description: >-
            The {{ $labels.lance_outbox_lane }} relay dropped staged objects in the last hour: a producer staged an event
            that does not parse, or something other than the catalog wrote under the control outbox. Read the
            `lineage_outbox_poison_dropped`, `control_outbox_unverifiable` and `control_outbox_undeliverable` logs for
            the object and its author. Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # The control outbox, which each service's control emitter stages into and the catalog's control relay drains. A
      # control event tells a pipeline that waits on it (a tag's move, a drop) to start its next hop.
      - alert: ControlOutboxNotDraining
        expr: >-
          max(outbox_depth{lance_outbox_lane="control"}) > 0
          and (sum(rate(outbox_events_drained_total{lance_outbox_lane="control"}[15m])) or vector(0)) == 0
        for: 10m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Control outbox not draining (depth > 0, nothing republished for 15m)"
          description: >-
            Control events are staged and the catalog's control relay has republished none for 15m: the bus takes
            nothing, the keys a staged event is verified against cannot be read, or no bus is named. A pipeline waiting
            on a control event has not been told. Read the catalog's `control_outbox_republish_failed`,
            `control_relay_keys_unavailable` and `control_relay_no_publisher` logs.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      - alert: ControlOutboxBacklogAging
        expr: max(outbox_oldest_age_seconds{lance_outbox_lane="control"}) > 300
        for: 5m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Control outbox oldest staged event > 5 min old"
          description: >-
            The catalog's control relay is lagging; the oldest staged control event exceeds 300s.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # A control emit that did not reach the bus (`<service>_control_emit_failed_total`, by `reason` and by `staged`,
      # every series at 0 from the emitter's start). One the outbox does not hold is lost, so any pages: an event
      # withheld unsigned is never staged, and a failed publish is staged only where the service has a control outbox
      # (maintenance has none). One that is staged waits for the catalog's control relay.
      - alert: ControlEventsLost
        expr: >-
          (sum(increase(catalog_control_emit_failed_total{lance_catalog_staged="false"}[15m])) or vector(0))
          + (sum(increase(maintenance_control_emit_failed_total{lance_maintenance_staged="false"}[15m])) or vector(0)) > 0
        labels:
          severity: critical
          service: lakehouse
        annotations:
          summary: "Control events were not published and no outbox holds them"
          description: >-
            In the last 15 minutes a service could not publish control events that no outbox holds: it could not sign
            them (its signing key is unresolved, or the event has no canonical form), or the bus refused them and the
            service stages none. Each change happened and is audited, and no subscriber is told. Read the
            `control_emit_withheld_unsigned` and `control_publish_failed` logs for the action and event id, and the
            service's readiness, which reports its signing key.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-bus-door-refusing-events

      - alert: ControlEmitFailing
        expr: >-
          (sum(rate(catalog_control_emit_failed_total{lance_catalog_staged="true"}[5m])) or vector(0))
          + (sum(rate(maintenance_control_emit_failed_total{lance_maintenance_staged="true"}[5m])) or vector(0)) > 0
        for: 15m
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "Control events have failed to publish for 15m and wait in the outbox"
          description: >-
            Control emits have failed at the bus for 15m. Each is staged, and the catalog's control relay delivers it
            once the bus takes it; subscribers hear late. Read the `control_publish_failed` log for the bus's answer.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # A CATALOG WRITE WHOSE PROVENANCE DID NOT GET RECORDED, which nothing else in this file can see.
      # The outbox rules above describe events that REACHED the outbox; this counts the emits that never
      # did. `lineage_emit.py` increments it on both transports and the two mean different things — on
      # `http` the event is gone, on `bus` the publish goes through the
      # staged outbox so a failure after staging still leaves a durable copy. The counter cannot tell
      # them apart, so this pages on any sustained increase and the transport label says which to read.
      #
      # `_total` because the OTLP->Prometheus exporter suffixes counters — the identical defect this file
      # records twice already, where a rule naming the bare form matches nothing and can never fire.
      # Every transport's series exists at 0 from the emitter's start (`catalog.core.lineage_emit.make_emitter`), so
      # the first failure is an increase the rate reads.
      - alert: CatalogLineageEmitFailing
        expr: sum(rate(catalog_lineage_emit_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Catalog writes are committing without recording their provenance"
          description: >-
            A catalog mutation committed to Lance and its lineage emit failed terminally, so lineage's feed
            does not record that the write happened and a pipeline following `/events` never hears of it.
            Read the `lance.catalog.transport` label — `http` means the event is gone, `bus` means it may
            still be staged in the outbox.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#outbox-not-draining

      # LH-497: the commit is the outbox. A find is a write whose own announcement was lost between its commit and its
      # staging, which the catalog's commit reconcile has just announced from the version log: the feed now holds it, and a
      # pipeline following `/events` was late to hear of it. Any find pages, as the closes-when of the row asks.
      # THE SECOND ARM IS A POD'S FIRST FIND. This counter is labelled by operation, an open set, so a series is born at
      # its first find: its first sample is already 1 and `increase()` reads 0 across it; a series present now and absent
      # a window ago is that find. Measured against GreptimeDB 2026-10-25 on the first live re-announcement: the
      # `increase` arm alone returned no point, the pair fired for the window after it. The reconciler's unlabelled
      # counters below exist at 0 from the catalog's start (`catalog.api.commit_reconcile.create_series`), so their rules
      # read the increase alone.
      - alert: CatalogCommitsReannounced
        expr: (sum(increase(catalog_commit_reconcile_reannounced_total[15m])) > 0) or (sum(catalog_commit_reconcile_reannounced_total unless catalog_commit_reconcile_reannounced_total offset 15m) > 0)
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Committed versions reached lineage's feed only through the reconciler"
          description: >-
            The catalog's commit reconciler found committed versions whose own announcement lineage's feed lacked
            past the grace, and announced them from the version log. Each is an announcement lost between a commit
            and its staging, so a pipeline following `/events` started its next hop late. Read the
            `lance.catalog.operation` label and the catalog's `commit_reannounced` logs for the tables.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#committed-versions-re-announced

      # A version of an announced operation the catalog recorded no author for, whatever rask.author it carries, was
      # committed past every catalog door (or its record failed); nothing can announce it on anyone's behalf.
      - alert: CatalogCommitsUnauthored
        expr: sum(increase(catalog_commit_reconcile_unauthored_total[15m])) > 0
        labels:
          severity: critical
          service: catalog
        annotations:
          summary: "A table holds versions no catalog door committed"
          description: >-
            The catalog's commit reconciler found committed versions for which the catalog recorded no author, whatever
            rask.author they carry: a manifest was finalized past every catalog door, by a credential that can write one,
            or the catalog's own record of a write Lance committed failed (a `commit_author_unrecorded` log names that
            version). The version is unjudged and unannounced. Read the catalog's `commit_unauthored` logs for the tables
            and versions.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#committed-versions-re-announced

      # A ref the reconciler cannot read past keeps its mark, so every lost announcement after that point waits on it.
      - alert: CatalogCommitReconcileBlocked
        expr: sum(increase(catalog_commit_reconcile_unreadable_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The commit reconciler cannot read a table's version log, the table, or lineage's feed"
          description: >-
            The catalog's commit reconciler could not read a retained version, or its commit time, on a table's ref, so
            it kept that ref's mark and announces nothing after it until it can; or it could not describe a table it
            claims, or lineage's feed, so it announced nothing for that table, or nothing at all on that tick. Read the
            catalog's `commit_reconcile_ref_unreadable`, `commit_reconcile_table_unreadable`,
            `commit_reconcile_feed_unreadable` and `commit_reconcile_table_failed` logs for the table and the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#committed-versions-re-announced

      # A root whose __manifest history the catalog cannot reclaim keeps a version per namespace operation again, and keeps
      # every id dropped there readable in that history (LH-251, ADR 0185). One tick's failure is a blip the next tick
      # repairs: the tick runs every ten minutes (`catalog.manifestReclaim.periodSeconds`), so one failure holds the
      # 15m increase for fifteen minutes and the 20m `for:` outlasts it, while failures on consecutive ticks hold it
      # throughout. The counter names no root (a root's URI names a tenant's bucket); the log line does. Its series
      # exists at 0 from the catalog's start.
      - alert: CatalogManifestReclaimFailing
        expr: sum(increase(catalog_manifest_reclaim_failed_total[15m])) > 0
        for: 20m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The catalog cannot reclaim a root's namespace index history"
          description: >-
            The catalog's manifest reclaim tick has failed on a root on consecutive ticks, so
            every namespace operation there keeps a version of `__manifest` again and a dropped namespace or table stays
            readable in that history. Read the catalog's `manifest_reclaim_failed` logs for the root and the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-roots-namespace-index-is-not-reclaimed

      # The catalog converges the estate's projects, warehouses and service grants onto what git declares, once a minute
      # (XC-213, ADR 0206). One tick's failure is a blip the next tick repairs; the same object failing on three ticks
      # within fifteen minutes is a declaration the estate does not hold.
      - alert: CatalogDeclarationNotConverging
        expr: (max by (lance_catalog_object) (increase(catalog_declaration_converge_failed_total[15m])) >= 3) or (max by (lance_catalog_object) (catalog_declaration_converge_failed_total unless catalog_declaration_converge_failed_total offset 15m) >= 3)
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The estate is not what git declares"
          description: >-
            The catalog's declaration converge tick could not make or correct {{ $labels.lance_catalog_object }} on three ticks within fifteen minutes, so the estate is not what git declares: a declared project, warehouse or service grant is missing or drifted, or the declaration itself cannot be read. Read the catalog's `declaration_converge_failed` and `declaration_unreadable` logs for the object and the error. Runbook: docs/runbooks/RUNBOOK-oncall.md#the-estate-is-not-what-git-declares

      # Each fixed timer of the catalog and of lineage is a loop in every replica that claims each window with one
      # conditional write under the control root (XC-199), and each replica reports when the window it last saw claimed
      # began. A timer whose newest window began three periods ago runs on no replica. A read-only window holds every
      # timer on purpose, which the held turns say. A timer that has never read its claim reports no window at all, so
      # the second arm pages on one whose every turn for fifteen minutes found the claim unreadable. A turn that claimed
      # or found a claim counts from its series' first sample too, which an increase reads as nothing.
      - alert: LakehouseTimerStopped
        expr: >-
          (
            ((time() - max by (timer) (timer_last_claimed_seconds)) > 3 * max by (timer) (timer_period_seconds))
            unless on (timer) (sum by (timer) (increase(timer_turns_total{outcome="held"}[30m])) > 0)
          )
          or
          (
            (sum by (timer) (increase(timer_turns_total{outcome="unread"}[15m])) > 0)
            unless on (timer) (
              (sum by (timer) (increase(timer_turns_total{outcome=~"ran|failed|elsewhere"}[15m])) > 0)
              or
              (sum by (timer) (timer_turns_total{outcome=~"ran|failed|elsewhere"} unless timer_turns_total{outcome=~"ran|failed|elsewhere"} offset 15m) > 0)
            )
          )
        for: 2m
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "A lakehouse timer runs on no replica"
          description: >-
            The timer {{ $labels.timer }} has claimed no window for three of its periods and is not held by a read-only window, or every turn it took in fifteen minutes found its claim unreadable, so its work runs on no replica: each replica's loop reads and claims the timer's record under the control root (`_timers/<timer>.json`), and none has. Read the service's `timer_claim_unread` WARN logs for the error (the object store, or the service's session at it) and `timer_work_failed` for a tick that raises. Runbook: docs/runbooks/RUNBOOK-oncall.md#a-timer-has-stopped

      # A timer whose work raises on every window it claims: the window is claimed, so `LakehouseTimerStopped` stays
      # quiet, and what the tick does (a relay's drain, the reconcile, the converge) does not happen. A relay tick that
      # cannot list its outbox raises and reports no backlog, so this is also what says an outbox is unmeasured. Failed
      # turns and none that ran, over a window that holds three turns of the slowest timer (ten minutes a turn): one
      # failed turn between turns that ran pages nothing. Every outcome's series exists at 0 from the loop's start.
      - alert: LakehouseTimerFailing
        expr: >-
          (sum by (timer) (increase(timer_turns_total{outcome="failed"}[30m])) > 0)
          unless on (timer) (sum by (timer) (increase(timer_turns_total{outcome="ran"}[30m])) > 0)
        for: 20m
        labels:
          severity: warning
          service: lakehouse
        annotations:
          summary: "The timer {{ $labels.timer }} has failed on every window it ran for 20m"
          description: >-
            The work of the timer {{ $labels.timer }} has raised on each window a replica claimed, with none that
            returned, for 20 minutes and the half hour before, so what it does on a tick has not happened since. Read the service's `timer_work_failed` log for the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-timer-has-stopped

      # A released erasure obligation is final, so a table found derived from its table after the release, written before
      # it, may still hold the subject (ADR 0183 §5). One is enough to page.
      - alert: ErasureDerivedAfterRelease
        expr: sum(increase(catalog_erasure_late_derived_total[15m])) > 0
        labels:
          severity: critical
          service: catalog
        annotations:
          summary: "A table derived from an erased table was found after the erasure was released"
          description: >-
            The catalog's commit reconciler found a table derived from a released erasure obligation's table, whose write
            was declared before the release: the subject may stand in it. It is listed in the obligation's `late_derived`.
            Read the catalog's `erasure_late_derived` logs for the obligation and the tables.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-table-derived-from-an-erased-table-found-after-the-release

      # A watch that cannot read what it judges finds no late derived table, tick after tick.
      - alert: ErasureLateDerivedUnwatched
        expr: sum(increase(catalog_erasure_late_derived_unwatched_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The catalog cannot watch released erasures for late derived tables"
          description: >-
            The catalog's commit reconciler could not read the erasure obligations, the input record, the edge list or a
            location claim, so it found no late derived table this half hour. Read the catalog's
            `erasure_late_derived_unread` logs for the error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-table-derived-from-an-erased-table-found-after-the-release

      # The forwarder sends each recorded event to the graph backend the estate names (`services.lineage.forward.url`).
      # A tick that stops short of the feed's head is counted, at 0 too, on every tick a backend is set.
      - alert: LineageForwardStalled
        expr: sum(rate(lineage_forward_stalled_total[10m])) > 0
        for: 30m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage has not reached its graph backend for 30m"
          description: >-
            Every relay tick for 30 minutes stopped forwarding short of the feed's head: the graph backend is down or
            refuses the forwarder. The feed and the edge list are complete; the backend's graph falls behind until it
            answers, and the forwarder resumes from its cursor. Read lineage's `lineage_forward_stalled` log for the
            backend's answer.

      - alert: LineageForwardRefused
        expr: sum(increase(lineage_forward_events_total{lance_lineage_outcome="refused"}[1h])) > 0
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "The graph backend refused events lineage forwarded"
          description: >-
            The graph backend answered events lineage forwarded with a refusal no retry changes, so the forwarder passed
            over them: the backend's graph lacks them, and the feed holds them. Read lineage's
            `lineage_forward_event_refused` log for the event and the backend's answer.

      # A write Lance committed whose author the catalog could not record: the reconciler cannot announce it on anyone's
      # behalf, and finds it unauthored (`CatalogCommitsUnauthored`) once it is past the grace. The series exists at 0
      # from the catalog's first commit record.
      - alert: CatalogCommitAuthorsUnrecorded
        expr: sum(increase(catalog_commit_authors_unrecorded_total[1h])) > 0
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "A commit's author was not recorded"
          description: >-
            The catalog committed a version and could not write the record of who committed it on its control root, so
            if that version's announcement is lost the reconciler has no author to announce it under. The
            `commit_author_unrecorded` ERROR log names the location, the version and the store's error.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#committed-versions-re-announced

      - alert: LineageIngestDeadLettering
        expr: sum(rate(lineage_events_processed_total{lance_lineage_outcome="dead_lettered"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage ingest dead-lettering — provenance is being LOST"
          description: >-
            Lineage's ingest lane parked an event the feed does not hold: it could not be recorded on any of its
            deliveries, or its author lacks a grant. The event is kept in the refusals table for the estate admin's
            replay, and the feed lacks its row until then. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      - alert: LineageIngestDiscardingUnrepairable
        expr: sum(rate(lineage_events_processed_total{lance_lineage_outcome="unrepairable"}[5m])) > 0
        # 10m for the same reason `LineageIngestRefusingProvenance` uses it, and more so: the consumer
        # is ephemeral with `deliverPolicy: all`, so every roll re-presents the retained stream and
        # re-discards whatever still cannot be repaired. Measured 2026-09-18, one roll produced 70 of
        # these in a single burst and then silence. A 5m `for` cannot tell that bounded burst from a
        # producer emitting unparseable or unauthored events continuously.
        for: 10m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage is DISCARDING events it can never record — a producer is emitting garbage"
          description: >-
            An event did not parse, carried no author at all, extended a run another subject founded, or
            named only outputs that carry no authorization tuple — so no tuple, redelivery or restart could
            ever make it recordable. On the bus it is ACKED rather than parked, deliberately — a DROP on this
            subscription writes a dead-letter duplicate of the same event on every roll — so there THIS COUNT
            IS THE ONLY TRACE IT LEFT; drained from the outbox it is kept in the refusals table too, and
            `lance_lineage_door` says which. A rising line here is a producer regression: something is
            publishing or staging events without a verified author, with a body that is not an OpenLineage
            RunEvent, or naming an output the estate does not govern. Distinct from `refused`, which is a
            named person lacking a grant on a table that EXISTS and is repairable by writing the tuple.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      - alert: LineageIngestRefusingProvenance
        expr: sum(rate(lineage_events_processed_total{lance_lineage_outcome="refused"}[5m])) > 0
        # 10m, not 5m, and the extra five minutes are the restart replay. The bus consumer is ephemeral
        # with `deliverPolicy: all`, so every lineage roll re-presents the whole retained stream;
        # byte-identical replays are exempt, but genuinely unauthorized history in that stream is
        # refused again each time. Measured 2026-09-09 on a real roll: 772 deliveries, 107 exempted,
        # 7 refused inside 90 seconds and then silent. A 5m `for` cannot tell that bounded burst from a
        # producer being refused continuously — the rate stays positive for a full 5m window after the
        # last increment — and an alert that pages on every deploy is one an operator learns to ignore.
        for: 10m
        labels:
          severity: warning
          service: lineage
        annotations:
          summary: "Lineage ingest is REFUSING events — a producer's provenance is being dropped"
          description: >-
            A run was refused because its stamped author does not hold the rung its operation demands on the
            datasets it claims to have written, and `lance_lineage_door` says where: a bus delivery is parked
            in lineage's refusals table, the HTTP door answers its producer 403, and the outbox drain records it in
            the refusals table. The feed lacks the run until the grant is written. Either a producer is
            claiming an identity it has no grant for (the case the gate exists to catch) or a legitimate
            producer lost a grant it needs (a broken cascade wearing an authorization costume). Distinct from
            `unrepairable`, which no grant can repair.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      # [[LH-064]] A refused signature is ACKED, so this counter is the only trace. `unsigned` and `signer` cannot be a listed
      # signer's genuine event and are not counted; `!=` twice because `!~` appears nowhere else in this file. What each reason
      # means: docs/runbooks/RUNBOOK-oncall.md#lineage-refusing-a-signers-events
      - alert: LineageSignatureRefusedForAListedSigner
        expr: sum by (lance_lineage_reason) (rate(lineage_signature_refused_total{lance_lineage_reason!="unsigned", lance_lineage_reason!="signer"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: lineage
        annotations:
          summary: "Lineage is REFUSING events that claim a listed signer ({{ $labels.lance_lineage_reason }}) — their provenance is dropped"
          description: >-
            An event naming a chart-listed signer failed signature verification and was ACKED, so it is neither retried nor
            parked and only this alert and the `lineage_signature_refused` log line (identity, run id, reason) record it. A
            signer is broken or someone is forging a listed identity.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#lineage-refusing-a-signers-events

      # [[XC-078]] A bus door's refusal is ACKED, so its counter is the only trace. Every reason pages, unlike lineage's door:
      # every bus publisher signs, so any refusal is a forgery or a signer that broke.
      # Runbook: docs/runbooks/RUNBOOK-oncall.md#a-bus-door-refusing-events
      - alert: MaintenanceArrivalRefusingEvents
        expr: sum by (door, reason) (rate(maintenance_signature_refused_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance is REFUSING write events ({{ $labels.door }}, {{ $labels.reason }}) — their tables wait for their next pass"
          description: >-
            A write event no listed signer's key verifies was ACKED and held no pass, so only this alert and the
            `maintenance_signature_refused` log line record it; the table's next scheduled pass still reads it. Forged
            events are reaching the bus, or a signer broke.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-bus-door-refusing-events
      # [[CTL-32]] The catalog's own subscription to its control lane.
      - alert: CatalogControlLaneRefusingEvents
        expr: sum by (lance_catalog_reason) (rate(catalog_signature_refused_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: catalog
        annotations:
          summary: "The catalog is REFUSING control events ({{ $labels.lance_catalog_reason }}) — its feed skips them"
          description: >-
            A control event its role's signature does not verify was ACKED and reached no change-event feed, so only this
            alert and the `catalog_signature_refused` log line record it. Forged events are reaching the bus, or a signer
            broke.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-bus-door-refusing-events

  - name: lance-catalog
    rules:
      # [[LH-559]] The catalog's control lane hands each event it follows on once: one a replica cannot judge (the signers'
      # keys unread, or a handling that raised) is given up, and nothing judges it on that replica again, so a forgery
      # among them goes uncounted. The bus seam counts it (`bus.deliveries`, outcome `failed`, under the subject the
      # replica follows), per replica, and creates the series at 0 when the lane starts, so the first one is an increase.
      - alert: CatalogControlLaneDroppingEvents
        expr: sum by (lance_bus_consumer) (increase(bus_deliveries_total{lance_bus_outcome="failed"}[10m])) > 0
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "The catalog gave up judging control events ({{ $labels.lance_bus_consumer }})"
          description: >-
            A catalog replica could not judge a control event it followed: the keys its signature is checked against
            could not be read, or its handling raised. A forged event among them was not counted in
            catalog_signature_refused. The change-event feed is unaffected: it serves the event once its keys are read. Read the replica's `bus_followed_message_not_handled` log for
            the error. Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      - alert: CatalogWritesShedSustained
        expr: sum(rate(catalog_writes_shed_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Catalog shedding writes for 15m — persistently over write-concurrency capacity"
          description: >-
            The catalog has been returning 429 on bulk Arrow-IPC writes (the concurrent-write cap, P5
            load-shedding) for 15m — it is persistently over capacity, not just riding out a burst. Scale
            catalog replicas or raise LANCE_MAX_CONCURRENT_WRITES (watch the pod memory: each write buffers
            up to 256MiB). Runbook: docs/runbooks/RUNBOOK-oncall.md

      # THE TRIPWIRE FOR [[LH-050]], so the threshold re-reads itself. That row parks a query store on a
      # NUMBER rather than a ruling: no listing cache exists because listing load is nowhere near
      # interactive. Measured 2026-09-24 against this estate's GreptimeDB over a 1h window —
      # `/v1/namespace/{id}/list` and `/v1/namespace/{id}/table/list` do not appear among the catalog's
      # top eight routes at all, and `/management/v1/warehouses` read 0.000627 req/s on 2026-09-20, one request
      # every 27 minutes and three to four orders below the trigger. A threshold nobody re-reads is a row
      # that sits forever, so the wire trips itself instead of waiting to be re-run by hand.
      #
      # THE ROUTE LABEL IS `http_route`, and it carries the TEMPLATED path (`/v1/namespace/{id}/list`), under the
      # stable HTTP conventions the chart opts the services into (the `lance-http` group's note).
      #
      # `/v1/table/{id}/tags/list` IS EXCLUDED THOUGH IT IS A LISTING ROUTE, and the exclusion is
      # measured rather than tidy: at 0.265 req/s it is the maintenance sweep polling tags, not a person
      # browsing. Folding it in would park this alert a quarter of the way to its threshold on machine
      # traffic alone, and the trigger being asked about is INTERACTIVE frequency.
      - alert: CatalogListingLoadReachedInteractiveFrequency
        expr: >-
          sum(rate(http_server_request_duration_seconds_count{service_name="catalog", http_route=~"/v1/namespace/.*list|/management/v1/warehouses"}[30m])) > 1
        for: 30m
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Catalog listing load reached interactive frequency — LH-050's query-store trigger"
          description: >-
            Namespace/table/warehouse listing has been served above 1 req/s for 30m, which is the order
            of magnitude LH-050 parked its query-store design on. Nothing is broken; the assumption the
            row rests on has expired. Re-read the per-route rates and take the row off the shelf.
            Runbook: docs/runbooks/RUNBOOK-oncall.md

  - name: lance-infra
    rules:
      # The infra-tier signal: a lane that cannot settle its deliveries. A service counts each delivery it took from
      # its consumer by how it settled it (`bus.deliveries`): a healthy lane books `taken`; one whose handling keeps
      # failing (a dependency does not answer) books `again` on every redelivery, and parks on its last attempt. A
      # transient error is asked again and then taken, so the 15m `for` rides out a blip, and a sustained rate of `again`
      # is a lane that is not draining its consumer. The series is created at 0 when the lane starts.
      - alert: BusConsumerRetrying
        expr: sum by (lance_bus_consumer) (rate(bus_deliveries_total{lance_bus_outcome="again"}[5m])) > 0
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "{{ $labels.lance_bus_consumer }}: deliveries asked for again for 15m — the lane is not draining"
          description: >-
            The service that pulls {{ $labels.lance_bus_consumer }} has asked for its deliveries again for 15m without
            clearing: its handling keeps failing, so the consumer is not draining and what the lane records has
            stopped. A transient error clears in minutes. Read the service's `delivery_handling_failed` log for the
            error and check what it depends on (the catalog, OpenFGA, the secret store). Runbook:
            docs/runbooks/RUNBOOK-oncall.md#a-subscriber-retries-without-end

      # A lane binds to a consumer the chart's stream Job declares and creates none, and a follower reads a stream the
      # Job declares. One the Job did not converge, a permission the bus does not grant, or a bus that does not answer
      # shows as asks the bus refuses (`bus.pulls.failed`, created at 0 when the lane starts): the lane asks again
      # without end and takes nothing, with no delivery to count.
      - alert: BusConsumerUnreachable
        expr: sum by (lance_bus_consumer) (rate(bus_pulls_failed_total[5m])) > 0
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "{{ $labels.lance_bus_consumer }}: the bus has refused every ask for 10m — the lane takes nothing"
          description: >-
            For 10 minutes the bus has refused or dropped the asks for {{ $labels.lance_bus_consumer }}: the consumer or
            its stream does not exist as the chart's stream Job declares it (the Job failed, or has not run), the bus
            does not grant the service the ask, or the bus does not answer. What the lane records has stopped. Read the
            service's `bus_pull_failed` or `bus_follow_failed` log for the bus's answer, and the stream Job's last run
            (`kubectl get jobs -l app.kubernetes.io/component=nats-streams`).
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-subscriber-retries-without-end

      # An event past the claim-check size is refused before anything is sent, so nothing downstream sees it. Labelled
      # by topic, so a series is born at its first refusal: the second arm reads a series present now and absent an
      # hour ago as that refusal.
      - alert: BusPublishRefused
        expr: (sum by (lance_bus_topic) (increase(bus_publish_refused_total[1h])) > 0) or (sum by (lance_bus_topic) (bus_publish_refused_total unless bus_publish_refused_total offset 1h) > 0)
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "An event for {{ $labels.lance_bus_topic }} was refused as too large to publish"
          description: >-
            A service built an event for {{ $labels.lance_bus_topic }} larger than the bus's claim-check size, and the
            publish was refused before anything was sent: no subscriber hears of it. Read the publisher's
            `lineage_publish_failed` or `control_publish_failed` log, whose error gives the event's size.

      # Every blocking call a door makes runs on the serving loop's thread pool (`lakehouse.thread_pool`). Calls
      # waiting for a thread mean every thread is held: requests queue, and latency rises with no error.
      - alert: RequestThreadPoolExhausted
        expr: max by (service_name) (threadpool_waiting) > 0
        for: 5m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "{{ $labels.service_name }}: blocking calls have waited for a thread for 5m"
          description: >-
            Every thread of {{ $labels.service_name }}'s request thread pool has been held for 5 minutes and calls wait
            for one (`threadpool_busy` at `threadpool_limit`): a dependency its doors block on (the object store,
            OpenFGA, the secret store) answers slowly, or the service needs more replicas.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-service-answers-5xx-or-slowly

      # [[LH-574]] The object store under every Lance read and write, as Lance's own client sees it. pylance 13.0.0's
      # `lance.otel` bridge (`lakehouse.lance_metrics`, exported by the catalog and maintenance) counts each request on
      # `lance_object_store_requests_total`, each answer a retry may clear (5xx, 429, 408) on
      # `lance_object_store_retryable_responses_total` and each throttling answer (429, 503) on
      # `lance_object_store_throttle_total`, each labelled with its `service_name`. The last two are created at the first
      # such answer, so a healthy estate holds neither series. Lance backs off and retries both inside its store bounds
      # (`LANCE_STORE_*`, `MAINTENANCE_STORE_*`), so a degrading store slows writes and passes long before one fails:
      # these are the signal before `HttpServerErrorRatioHigh`. The 15m `for` rides out a burst.
      - alert: LanceObjectStoreThrottled
        expr: sum by (service_name) (rate(lance_object_store_throttle_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "{{ $labels.service_name }} has been throttled by the object store for 15m (HTTP 429/503)"
          description: >-
            Lance in {{ $labels.service_name }} has met throttling answers from the object store continuously for 15m.
            Its client backs off and retries, so writes and maintenance passes slow down rather than fail. Check the
            store's request limits and what drives the load. Runbook: docs/runbooks/RUNBOOK-oncall.md#the-object-store-throttles-or-retries

      - alert: LanceObjectStoreRetriesHigh
        expr: >-
          sum by (service_name) (rate(lance_object_store_retryable_responses_total[10m]))
          / sum by (service_name) (rate(lance_object_store_requests_total[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "{{ $labels.service_name }}: over 5% of object-store requests drew a retryable answer for 15m"
          description: >-
            More than one request in twenty from Lance in {{ $labels.service_name }} got a 5xx, 429 or 408 from the store
            for 15m. Lance retries each inside its store bounds, so every call costs up to its retry count over: a
            degrading store shows here before requests fail. Runbook: docs/runbooks/RUNBOOK-oncall.md#the-object-store-throttles-or-retries

  - name: lance-maintenance
    rules:
      # [[LH-559]] The worker's write-event lane settles each commit announcement itself and counts how
      # (`maintenance.arrivals.settled`, every outcome's series created at 0 when the worker starts): `ended` is an
      # announcement no delivery could settle, for which no pass was held, and a sustained `retried` is a lane that cannot
      # reach what it needs. An announcement is a hint the table's recheck backs up, so both are warnings.
      - alert: MaintenanceArrivalLaneEndingEvents
        expr: sum(increase(maintenance_arrivals_settled_total{outcome="ended"}[10m])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance ended commit announcements unhandled — their tables wait for their next pass"
          description: >-
            The worker's write-event lane could not settle a commit announcement on any of its deliveries and ended
            it, so no pass was held for the commit; the table's next scheduled pass, within
            `maintenance.queue.recheckHours`, reads it, and the hourly audit queues one for a table no schedule holds.
            A lane that ends every announcement cannot reach the work queue or read a table's claim: read the worker's
            `maintenance_arrival_ended` log for the error. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      - alert: MaintenanceArrivalLaneRetrying
        expr: sum(rate(maintenance_arrivals_settled_total{outcome="retried"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance's write-event lane is handing announcements back for 15m"
          description: >-
            The worker's write-event lane has handed commit announcements back for 15m without clearing: it cannot
            read a signer's keys or a table's claim, or the work queue does not take the task. No pass is held for
            those commits until it clears, and each is ended on its last delivery. Read the worker's
            `maintenance_arrival_retried` log for the error. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#a-subscriber-retries-without-end

      # The drift report decides whether the purge may run at all and is the estate's answer to "is the
      # storage state understood". It reached a log line and nothing else until `maintenance.drift.items`
      # landed, so nothing here could name it.
      #
      # THE DELTA IS THE INCIDENT, not the level, for the reason the lineage rules above already give:
      # this estate carries a KNOWN backlog — 989 orphaned trash records measured 2026-09-20, residue
      # from warehouse deletes that predate the fix clearing them — and a `> 0` on the level would fire
      # on the first tick after deploy and stay firing on something no on-call window can clear. That is
      # how an alert becomes one people route to a muted channel. Drift that appeared TODAY is a
      # different claim: something started producing it.
      #
      # No `category` in the expr on purpose. A per-category rule is a hand-kept list, and the drift
      # categories are exactly the thing that grows — `orphaned_trash` itself was added the same day.
      # The label rides the firing series, so the alert still says WHICH category moved.
      - alert: MaintenanceDriftRising
        expr: delta(maintenance_drift_items[2h]) > 0
        for: 30m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A reconcile drift category grew in the last two hours — {{ $labels.category }}"
          description: >-
            The drift report (the hourly audit's, and the daily scan's, which adds the storage walk's two categories) is finding MORE of this drift category than it did two hours ago.
            Each category names a different disagreement between the registry, OpenFGA and object
            storage, and a rising one means something is producing it now rather than leaving residue
            from before. A gating category also blocks the expired-trash purge, so reclamation stops
            until it clears. Find the named objects in the `reconcile_drift` log line for the
            matching category; `orphaned_trash` and the other non-gating categories are counted and
            reported but never block the purge.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#dlq-parking--a-delivery-gave-up

      # A failing dataset's pass is retried every `maintenance.queue.retrySeconds` (15 minutes) and counted once each
      # time, so the 1h window holds four, and a narrower one would drop to 0 between retries and reset the `for:`. The
      # counter is labelled by error class, an open set, so a class's series is born at its first failure, which an
      # increase reads as nothing: the second arm reads a series present now and absent an hour ago as that failure.
      - alert: MaintenanceDatasetsFailing
        expr: (sum(increase(maintenance_datasets_failed_total[1h])) > 0) or (sum(maintenance_datasets_failed_total unless maintenance_datasets_failed_total offset 1h) > 0)
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Table maintenance is failing on one or more datasets"
          description: >-
            A table's pass could not complete one or more datasets, and retries them every
            `maintenance.queue.retrySeconds`. Sustained failure means those datasets accumulate superseded versions
            indefinitely. Break down by error.type; the per-dataset URI is on the trace span and in the
            maintenance_dataset_outcome log line, deliberately not on the metric (unbounded cardinality).

      # STARVATION (ADR 0243). A pass that would reclaim keeps everything when a ref write holds the table's history, a
      # policy write holds a fence above it, its policy changed since it read it, or a cleanup's victims stay marked, and
      # is passed again every `maintenance.queue.retrySeconds` (15 minutes), so one table held back pass after pass adds
      # four an hour, every hour, and never meets its retention or an erasure's deadline. 24h of held-back passes in
      # every hour is a day of the seven an erasure release's grace gives (`catalog.erasure.releaseGraceDays`, 7 in the
      # chart's values), leaving six to find the writer or the mark. The counter names a reason and no table (an open
      # set would be unbounded cardinality): the table is in the reason's log line.
      - alert: MaintenanceReclaimStarved
        expr: sum by (reason) (increase(maintenance_reclaims_held_back_total[1h])) > 0
        for: 24h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance reclaims have been held back in every hour for a day"
          description: >-
            Passes that would reclaim have kept everything, for the reason this alert names, in every hour of the last
            day: a table under constant ref writes, a policy that keeps changing, a policy door or a reclaim holding a
            fence, or a cleanup's victims left marked. Such a table meets neither its retention nor an erasure's
            deadline. Find it in the maintenance_history_fenced, maintenance_policy_fenced,
            maintenance_policy_changed_mid_pass or maintenance_victims_marked log lines.

      # The worker's heartbeat is the hourly audit (`maintenance.queue.auditSchedule`): a NATS message schedule puts it
      # on the work queue once an hour whatever the replica count, and one worker runs it. Its stopping is silent by
      # construction: nothing raises, the schedule simply never reaches a worker that completes it. A 2h window over
      # the hourly audit, so one slow audit does not page. The series exists from a worker's start at 0
      # (`create_task_series`), so a flat zero is a worker that runs and completes no audit.
      - alert: MaintenanceAuditNotCompleting
        expr: sum(increase(maintenance_tasks_completed_total{kind="audit"}[2h])) == 0
        for: 30m
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "No maintenance audit has COMPLETED in two hours"
          description: >-
            The hourly audit (the drift report, its repairs, the release of every drop past its deadline, and the
            backstop that queues a table no schedule holds) has not completed in two hours. Either its schedule no
            longer reaches a worker, or every audit fails or overruns: compare maintenance_tasks_ended_total and
            maintenance_passes_overran_total for kind audit, and read the maintenance_task_retried log lines.

      # ABSENT IS NOT ZERO. A worker that has died, or whose export broke, emits no maintenance_tasks_completed_total
      # at all, and the `== 0` above cannot fire over a vector that does not exist. Bare `absent()` in its own rule:
      # GreptimeDB answers HTTP 500 to the composite form. The series exists from a worker's start, so the `for:` is
      # the export's own lag.
      - alert: MaintenanceTaskMetricsMissing
        expr: absent(maintenance_tasks_completed_total)
        for: 15m
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "Maintenance's worker has stopped reporting entirely"
          description: >-
            No `maintenance_tasks_completed_total` series exists. No maintenance worker runs, or its OTLP export is
            broken: nothing passes a table, releases a drop or audits the estate, and nothing else in this file can
            tell you.

      # The daily scan (`maintenance.queue.scanSchedule`): the drift report with the storage walk, and the expired-trash
      # purge, which acts only on its own scan's report. A 26h window over the daily schedule, so one late scan does
      # not page.
      - alert: MaintenanceScanNotCompleting
        expr: sum(increase(maintenance_tasks_completed_total{kind="scan"}[26h])) == 0
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "No maintenance scan has COMPLETED in a day"
          description: >-
            The daily scan has not completed in 26 hours, so no storage walk or expired-trash purge ran.
            Either its schedule no longer reaches a worker, or the scan fails or overruns every time: compare
            maintenance_tasks_ended_total and maintenance_passes_overran_total for kind scan.

      # A task a worker ended: it failed, or outlived its worker, on every delivery. No `for:`: an end is final.
      - alert: MaintenanceTasksEnded
        expr: sum by (kind) (increase(maintenance_tasks_ended_total[1h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance ended {{ $labels.kind }} tasks that failed on every delivery"
          description: >-
            A {{ $labels.kind }} task failed, or outlived its worker, on each of its `maintenance.queue.maxDeliver`
            deliveries, and a worker ended it. The maintenance_task_ended ERROR line names the subject and the last error; kind unreadable is a
            message no task parses. Its next try is held `maintenance.queue.recheckHours` out, unless a commit queues it sooner.

      # A task running past its bound (`maintenance.queue.maxPassSeconds`; the audit's, the scan's and an orphan check's
      # own are `maintenance.queue.auditMaxSeconds`, `.scanMaxSeconds` and `maintenance.orphanCheck.maxSeconds`). It keeps
      # its task until twice that, when its replica exits and the task is delivered again,
      # so until then this count is the only sign.
      - alert: MaintenancePassesOverran
        expr: sum by (kind) (increase(maintenance_passes_overran_total[1h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A maintenance {{ $labels.kind }} task is running past its bound"
          description: >-
            A {{ $labels.kind }} task has run past its bound (`maintenance.queue.maxPassSeconds`, or its kind's own:
            `maintenance.queue.auditMaxSeconds`, `maintenance.queue.scanMaxSeconds`,
            `maintenance.orphanCheck.maxSeconds`) and still holds its task; at twice that its replica
            exits and the task is delivered again. The
            maintenance_task_overran ERROR line names its subject and how long it had run; while it runs, no later
            commit's pass of its table can start.

      # The queue as the worker samples it every 15 s (`maintenance.services.queue.sample_queue`). The gauge's
      # instrument is `maintenance.queue.oldest` with unit `s`, which the exporter appends, as for `outbox_oldest_age_seconds`
      # above. Every replica samples the same streams, so `max` reads one value. MAINTENANCE_TASKS drops a message at its
      # 24 h max age (`chart/templates/nats-stream-job.yaml`) with no consumer told, so a task waiting 6 h is the warning
      # while 18 h are left to act.
      - alert: MaintenanceTaskAging
        expr: max by (stream) (maintenance_queue_oldest_seconds{stream="MAINTENANCE_TASKS"}) > 21600
        for: 30m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A maintenance task has waited more than six hours on the queue"
          description: >-
            The oldest message on MAINTENANCE_TASKS is over six hours old: tasks wait unrun, and at 24 hours the stream
            drops them unrun, their tables left to the hourly audit. Read maintenance_queue_ack_pending and
            maintenance_queue_redelivered for consumer maintenance-worker (deliveries stuck, or a task delivered again and
            again), maintenance_passes_overran_total (a pass holding its replica), and whether any worker replica runs and
            is ready (maintenance_tasks_completed_total).

      # Tasks wait and no worker holds one: the durable has messages it has not delivered (`maintenance.queue.waiting`) and
      # awaits no acknowledgement (`maintenance.queue.ack_pending`), sampled every 15 s. A worker between two tasks reads
      # so for milliseconds; ten minutes of it is a fleet that pulls nothing, as when no replica is ready (its signing key
      # unresolved) or its task loop no longer asks. A long pass keeps ack_pending at 1 or more, so tasks waiting behind
      # it stay quiet here and are MaintenancePassesOverran's and MaintenanceTaskAging's. A fleet that is gone samples
      # nothing, which is MaintenanceTaskMetricsMissing's.
      - alert: MaintenanceQueueStalled
        expr: (max(maintenance_queue_waiting{consumer="maintenance-worker"}) > 0) and (max(maintenance_queue_ack_pending{consumer="maintenance-worker"}) == 0)
        for: 10m
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "Maintenance tasks wait and no worker has taken one for ten minutes"
          description: >-
            MAINTENANCE_TASKS holds {{ $value }} tasks its consumer has not delivered, and no delivery awaits an
            acknowledgement: no worker replica is pulling. No table is passed, no drop released and no audit run until one
            does. Check that the maintenance-worker pods run and are ready (a worker whose signing key is unresolved takes
            no task), and read their maintenance_bind_failed and maintenance_bus_unanswered WARNING lines;
            maintenance_tasks_wait_seconds_bucket shows how long tasks waited before this.

      # A store event the worker ended (its handling refused on every delivery, or outlived its worker every time) or could
      # not read: its table's overwrite check waits for the daily recheck. Every outcome's series is created at 0 when a
      # worker starts, so the first end is an increase. No `for:`: an end is final.
      - alert: MaintenanceStoreEventsEnded
        expr: sum by (outcome) (increase(maintenance_store_events_settled_total{outcome=~"ended|unreadable"}[1h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance {{ $labels.outcome }} store events in the last hour"
          description: >-
            The worker settled store events as {{ $labels.outcome }}: ended, the store or the bus refused their handling on
            every delivery (or the worker died on every one); unreadable, the body is no S3 event record the worker parses
            (the contract is `objectStore.events` in the chart's values). Each one's table is passed at its daily recheck
            instead of after the write. The maintenance_store_event_ended and maintenance_store_event_unreadable ERROR lines
            name the subject and the error.

      # Delivery of store events stops when the durable's deliveries awaiting an ack reach its `max_ack_pending` (1000,
      # `chart/templates/nats-stream-job.yaml`): 900 is 90 % of it.
      - alert: MaintenanceStoreEventsStuck
        expr: max by (consumer) (maintenance_queue_ack_pending{consumer="maintenance-store-events"}) >= 900
        for: 15m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Store events are near the delivery ceiling of their consumer"
          description: >-
            The maintenance-store-events consumer awaits an acknowledgement for at least 900 deliveries, 90 % of its
            max_ack_pending of 1000; at the ceiling the bus delivers no more store events, and overwrites are found only at
            each table's daily recheck. Read maintenance_store_events_settled_total by outcome (retried rising: the store
            refuses the claim reads) and maintenance_queue_oldest_seconds for STORE_EVENTS, and the
            maintenance_store_event_retried WARNING lines.

      # Delivery of fired schedules stops when the durable's deliveries awaiting an ack reach its `max_ack_pending` (1000,
      # `chart/templates/_helpers.tpl`): 900 is 90 % of it. A fired time that meets its table's task is held again and
      # acked, never left awaiting an ack (ADR 0232, A7), so a move awaits one only for as long as it runs, or for the
      # consumer's ack wait (30 s) after a worker died with it; a count held this high is a stall the design rules out.
      - alert: MaintenanceDueStuck
        expr: max by (consumer) (maintenance_queue_ack_pending{consumer="maintenance-due"}) >= 900
        for: 15m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Fired schedules are near the delivery ceiling of their consumer"
          description: >-
            The maintenance-due consumer awaits an acknowledgement for at least 900 deliveries, 90 % of its max_ack_pending
            of 1000; at the ceiling the bus delivers no more fired schedules, and no table's pass, trash release, orphan
            check, audit or scan is queued until it drains. Read maintenance_schedules_not_queued_total (rising: the bus
            refuses the moves) and maintenance_schedules_reheld_total by kind, maintenance_queue_waiting for
            maintenance-due, and the maintenance_due_not_queued WARNING lines.

      # A governed bucket the hourly audit found configured with no store event for its writes
      # (`maintenance.services.bucket_events`): a file overwritten in place there is found only at its table's daily
      # recheck. The audit counts each bucket once per run on `maintenance_store_event_buckets_checked_total` by
      # outcome, a counter that sums across replicas and stops rising once the buckets are fixed; 2h spans two audits, so
      # a bucket the catalog just made waits one for its store's operator to configure it.
      - alert: MaintenanceBucketWithoutStoreEvents
        expr: sum(increase(maintenance_store_event_buckets_checked_total{outcome="without"}[2h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A governed bucket sends no store events for its writes"
          description: >-
            The hourly audits of the last two hours found governed buckets whose event configuration holds no
            s3:ObjectCreated:* rule over the whole bucket, so maintenance hears of no write there and a committed file
            overwritten in place is found only at its table's daily recheck. The maintenance_bucket_without_store_events
            WARNING line names each bucket; configure it to deliver every object write to the bus subject store.events
            (`objectStore.events` in the chart's values).

      # A governed bucket the store would not answer about: the read was refused (measured: a canned policy without
      # s3:GetBucketNotification answers 403 for every bucket) or failed, so whether it sends its events is unknown,
      # and an estate where every read is refused would otherwise report nothing missing.
      - alert: MaintenanceBucketStoreEventsUnknown
        expr: sum(increase(maintenance_store_event_buckets_checked_total{outcome="unknown"}[2h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "The store will not say whether a governed bucket sends store events"
          description: >-
            The hourly audits of the last two hours could not read the event configuration of governed buckets: the
            store refused or failed GetBucketNotificationConfiguration, so whether each sends its writes as store events
            is unknown, and it is never counted as configured. The maintenance_bucket_store_events_unknown WARNING line
            names each bucket and the error; grant maintenance's store identity s3:GetBucketNotification on the bucket,
            or restore the store.

      # A fired schedule the queue refused or did not answer is given back and moved again within its retry's bound (15 s
      # at first, `redelivery_delay`), so one refusal
      # heals; a refusal standing an hour is a table whose time never comes. Its series is created at 0 when a worker
      # starts.
      - alert: MaintenanceSchedulesNotQueued
        expr: sum(increase(maintenance_schedules_not_queued_total[1h])) > 0
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Fired maintenance schedules are not reaching the work queue"
          description: >-
            For an hour the queue has refused, or not answered, fired schedules the worker moves onto MAINTENANCE_TASKS, so
            those tables' passes, trash releases and orphan checks do not run. The maintenance_due_not_queued WARNING line
            names the subject and the bus's answer; check that MAINTENANCE_TASKS exists as the chart's stream Job declares
            it (`nats stream info MAINTENANCE_TASKS` as the monitor user).

      # `SUPPORTED` is a whitelist, so a pylance upgrade that introduces a legitimate new manifest flag
      # makes a pass refuse datasets it used to maintain — and refusals are NOT errors, so nothing
      # else in this file would fire. Measured 2026-08-16: 17 refused datasets were exactly the ones
      # that needed compaction, and the estate looked healthy throughout.
      - alert: MaintenanceRefusalsRising
        expr: sum(increase(maintenance_datasets_refused_total[1h])) > sum(increase(maintenance_datasets_swept_total[1h])) / 2
        for: 1h
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "More than half of the datasets passed are being REFUSED"
          description: >-
            The supported-manifest-flag whitelist is rejecting most of the estate, so maintenance is
            running without reclaiming. Usually a pylance upgrade introducing a flag the guard does not
            know. Check the refusal reasons in the maintenance_dataset_outcome log line.

      # One mixed table is an incident the ratio rule above cannot see (45.3-46.5% of every sweep is refused,
      # measured 2026-09-24). No `for:`: the flag cannot be removed, so waiting buys nothing. The window sets how
      # long the alert HOLDS between counts: a refused table is passed again only at its recheck
      # (`maintenance.queue.recheckHours`, a day) or its next commit, so the window spans a recheck; a policy-skipped
      # table is never opened, so it is not counted.
      - alert: LanceMixedDataFileVersions
        expr: sum(increase(maintenance_datasets_mixed_file_versions_total[25h])) > 0
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "A Lance table's data files are at more than one file version"
          description: >-
            A table's pass found a table whose manifest carries reader flag 256 (mixed data file versions).
            The flag is sticky: no Lance operation removes it. pylance 11 and lancedb 0.34 (lance core 8)
            cannot open the table (pylance 12+ and lancedb 0.40 can), and maintenance refuses it on every pass. The only measured heal is
            recreating it into a new dataset, which re-mints _rowid and drops history, tags, branches and
            indices. Find the table in the maintenance_dataset_outcome records where
            mixed_data_file_versions is true, and the writer that appended at another data_storage_version.

      # A file a commit added, replaced in place ([[LH-419]]): readers are served bytes no commit wrote. No `for:`: a page
      # delayed is a noncurrent version nearer its expiry. The table's pass counts the file each time it runs, the one its
      # store event holds and then its recheck a day later, so the window is 25h: the page stands until a day's passes
      # find the file restored.
      - alert: CommittedFileOverwritten
        expr: sum(increase(maintenance_files_overwritten_total[25h])) > 0
        labels:
          severity: critical
          service: maintenance
        annotations:
          summary: "A committed Lance file was overwritten in place"
          description: >-
            A table's pass found a file a commit added whose ETag or size is no longer what the catalog recorded when it
            committed: a holder of the table's write vend put over it, and readers are served bytes no commit wrote.
            The committed_file_overwritten ERROR log names the table uuid, the path and both ETags. Restore the file's
            noncurrent object version, which a platform store keeps for this, and find the writer in the store's
            access log.

      # A commit whose added files the catalog could not record ([[LH-419]]): no pass reads them, so an overwrite
      # of them would go unseen. The table still serves what was committed, so this warns rather than pages critical.
      - alert: CommittedFilesUnrecorded
        expr: sum(increase(catalog_committed_files_unrecorded_total[1h])) > 0
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "A commit's files were not recorded, so maintenance never checks them"
          description: >-
            A write Lance commits in one call (the create door's write, an unkeyed /insert) landed a version whose
            added files the catalog could not record on its control root, so maintenance never reads them again and an
            overwrite of them goes unseen. The committed_files_unrecorded ERROR log names the location, the version and
            the store's error.

      # ADR 0242: a warehouse whose store does not refuse a put over a sealed file, as the probe's seal check last measured
      # it (`catalog.warehouse.seal`, one series per warehouse, exported from the catalog's start). One git declares
      # detection-only runs so by declaration and warns for as long as it does: maintenance's committed-file pass is its
      # only guard. One git requires the seal of is a store that stopped enforcing it since registration, found by a
      # validate, and pages: every committed file there is replaceable by any write credential, with a 200.
      - alert: WarehouseSealUnenforced
        expr: max by (lance_warehouse, lance_seal) (catalog_warehouse_seal{lance_seal!="enforced", lance_seal_required="false"}) > 0
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Warehouse {{ $labels.lance_warehouse }} runs with the seal unenforced ({{ $labels.lance_seal }}), as git declares"
          description: >-
            Git declares this warehouse detection-only (catalog.declared.warehouses[].seal), and its store does not refuse
            a put over a committed file: a write credential can replace a file a committed version names, which only
            maintenance's committed-file pass finds, after the fact. unenforced is a store that keeps the tag and evaluates
            no s3:ExistingObjectTag on PutObject; untaggable a store or role refusing s3:PutObjectTagging. ADR 0242 states
            what the store must support.

      - alert: WarehouseSealLost
        expr: max by (lance_warehouse, lance_seal) (catalog_warehouse_seal{lance_seal!="enforced", lance_seal_required="true"}) > 0
        labels:
          severity: critical
          service: catalog
        annotations:
          summary: "Warehouse {{ $labels.lance_warehouse }}'s store no longer enforces the seal ({{ $labels.lance_seal }})"
          description: >-
            The catalog's seal probe (at its start and every catalog.sealProbe.periodSeconds) or a validate found this
            warehouse's store no longer refuses a put over a sealed file, and git requires the seal of it: any write
            credential can replace a file a committed version names, with a 200. untaggable also fails every
            commit there with a 503. Restore the store's policy (ADR 0242 § What a platform S3 store must support), then
            validate the warehouse again (POST /management/v1/warehouses/{id}/validate).

      # ADR 0242 § Found by review, third round, B2: a probe that learns nothing (the store answered every write over the
      # sealed file with neither a refusal nor an admission) keeps the warehouse's last verdict, so the two rules above
      # read a verdict that may be stale. `catalog.warehouse.seal_measured` is the time of the last conclusive
      # measurement, kept on the warehouse's record and read again at every start, so no replica restart and no counter
      # reset makes it fresh; the period is the one the probe's timer exports (`catalog.sealProbe.periodSeconds`, as
      # `timer_period_seconds{timer="catalog-seal-probe"}`, which no replica exports where no probe runs on a period, and
      # then the rule compares against nothing and stays quiet), so the rule moves with what git declares. `max by` reads
      # the freshest replica's view.
      - alert: WarehouseSealUnmeasured
        expr: >-
          time() - max by (lance_warehouse) (catalog_warehouse_seal_measured_seconds)
          > 2 * scalar(max(timer_period_seconds{timer="catalog-seal-probe"}))
        labels:
          severity: warning
          service: catalog
        annotations:
          summary: "Warehouse {{ $labels.lance_warehouse }}'s seal has not been measured for two probe periods"
          description: >-
            No seal probe of this warehouse's store has concluded for more than two catalog.sealProbe.periodSeconds: the
            store answers the probe's writes over a sealed file with neither a refusal nor an admission (a 5xx, a
            throttling, a timeout), so catalog.warehouse.seal still exports the verdict it last measured, which may no
            longer hold. The warehouse_seal_unprobed WARNING log names the warehouse and each check's answer; validate it
            (POST /management/v1/warehouses/{id}/validate) once the store answers.

      # One table the catalog keeps refusing, or whose policy record cannot be read, which the ratio rule cannot see: an
      # id that holds no tuples is answered 403 at the vend door on every pass. Counted by what refused it, a closed
      # set whose series exist at 0 from a worker's start, so the first parked pass is an increase. A refused table is
      # passed again at its recheck (a day) or its next commit, so the 25h window holds the alert from one refused pass
      # to the next. The counter names no table; the pass's log line does.
      - alert: MaintenanceTableParked
        expr: sum by (refused_by) (increase(maintenance_tables_parked_total[25h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Maintenance of a table is parked ({{ $labels.refused_by }})"
          description: >-
            A table's pass was parked in the last day, so its superseded versions are not reclaimed.
            vend_denied is a 403: this identity holds no can_maintain on the id,
            or the id names no table, which is what a stale lineage.dataset_id stamp leaves.
            table_not_governed is a 404. Grant the id, or fix the stamp or the location. The
            maintenance_vend_denied and maintenance_table_not_governed WARNING lines name the dataset.
            policy_unreadable is a maintenance policy record of the table, its namespace or its project that
            cannot be read as a policy, which may be a legal hold: rewrite it through the policy door. The
            maintenance_policy_malformed ERROR line names the table and the record's fault.

      # A stream or a durable consumer the worker's sampler asks the bus about and gets no answer for
      # (`maintenance.queue.unsampled`, at 0 from the first sample): the chart's stream Job declares each, so one it did
      # not converge is unanswered on every sample, while that stream's gauges stand still or do not exist.
      - alert: MaintenanceQueueUnsampled
        expr: (sum by (stream) (increase(maintenance_queue_unsampled_total{stream!=""}[10m])) > 0) or (sum by (consumer) (increase(maintenance_queue_unsampled_total{consumer!=""}[10m])) > 0)
        for: 15m
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "The bus does not answer about a maintenance stream or consumer ({{ $labels.stream }}{{ $labels.consumer }})"
          description: >-
            For 15 minutes the bus has not answered the worker's sampler about {{ $labels.stream }}{{ $labels.consumer }}:
            it does not exist as the chart's stream Job declares it (the Job failed, or has not run), or the bus is
            down. The queue alerts read gauges this leaves unset. Read the worker's `maintenance_queue_unsampled`
            WARNING line for the bus's answer, and the stream Job's last run.

      # A declared base path sanctioned by nothing: a writer planted it, and it protects no table. The series exists at
      # 0 from a table's first pass. The table's pass counts it each time it runs, so the window spans a recheck.
      - alert: MaintenanceBasesUnrecorded
        expr: sum(increase(maintenance_bases_unrecorded_total[25h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A table declares a base path nothing sanctions"
          description: >-
            A table's pass found a manifest declaring a base path that is neither its own root, configured, nor in the
            catalog's record: a writer committed it past the catalog's judgement. It protects nothing and the table it
            names is maintained as usual. Read the `maintenance_unrecorded_base` log for the table and the path, and
            find the writer.

      # An expired trash record the purge would not reclaim: still registered, outside the maintained estate, a control
      # prefix, or a grant it could not revoke. Counted on every scan including zero; a dry run's are its own series.
      - alert: MaintenanceTrashPurgeRefused
        expr: sum by (lance_maintenance_kind) (increase(maintenance_trash_purge_refused_total{lance_maintenance_dry_run="false"}[26h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "The trash purge refused expired {{ $labels.lance_maintenance_kind }} records"
          description: >-
            The daily scan's purge left expired {{ $labels.lance_maintenance_kind }} records unreclaimed: the object is
            still registered, lies outside the maintained estate or under a control prefix, or its grants could not be
            revoked. Their bytes stay until it clears. Read the `trash_purge_refused` log for each record and its reason.

      # Files a table's orphan check found above its listing floor, which Lance's own cleanup cannot list, and checks
      # that could not finish. Every outcome's series exists at 0 from a worker's start.
      - alert: MaintenanceOrphansStranded
        expr: sum(increase(maintenance_orphans_stranded_total[25h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "A table holds unreferenced files above its listing floor"
          description: >-
            A table's orphan check found files no version references above the table's listing floor, where Lance's
            cleanup does not look: their bytes stay until the floor is raised. Read the `maintenance_orphan_check` log
            for the table and the count.

      - alert: MaintenanceOrphanChecksFailing
        expr: sum by (outcome) (increase(maintenance_orphans_checks_total{outcome=~"incomplete|raised"}[25h])) > 0
        labels:
          severity: warning
          service: maintenance
        annotations:
          summary: "Table orphan checks ended {{ $labels.outcome }}"
          description: >-
            Orphan checks ended {{ $labels.outcome }} in the last day: incomplete, a read of the table's files or
            versions failed; raised, the check itself failed. Those tables' unreferenced files are not found until a
            check completes. Read the `maintenance_orphan_check` log for the table and the error.

  # ==================================================================================================
  # THE HTTP PLANE — fourteen apps emitted RED metrics and not one rule read them.
  #
  # `grep 'http_server\|ingest_\|flows_\|gateway\|compute_\|controlplane' rules.yml` returned ZERO at
  # HEAD on 2026-08-26. Every app emits `http.server.*` automatically (`opentelemetry-instrument` wires the
  # FastAPI instrumentor), the chart provisions a Perses "Fleet — RED" dashboard from those very
  # series, and nothing turned any of it into a page. Eight of fourteen apps had no group at all —
  # including the gateway and every app a browser talks to.
  #
  # The concrete scenario, and it is not hypothetical: the catalog starts answering 500 on every
  # `POST /v1/table/{id}/describe`. The only rule in `lance-catalog` counts 429s on Arrow-IPC WRITES,
  # which stays at zero throughout. A catalog failing 100% of reads pages nobody.
  #
  # THE SERIES ARE OPENTELEMETRY'S STABLE HTTP CONVENTIONS', which the chart opts every service into
  # (`OTEL_SEMCONV_STABILITY_OPT_IN=http`, `lance.otelEnv`): `http.server.request.duration` in seconds, so
  # `http_server_request_duration_seconds_*` once the OTLP->Prometheus exporter appends the unit, labelled
  # `http_route` (the templated path) and `http_response_status_code`. Measured on
  # opentelemetry-instrumentation-fastapi 0.66b2, 2026-11-16: without the opt-in the instrumentor emits
  # `http.server.duration` in milliseconds under `http.target` and `http.status_code`, and these rules select nothing.
  - name: lance-http
    rules:

      # THE LOAD-BEARING ONE. A ratio, not a count: absolute 5xx tells you nothing without traffic,
      # and a service that serves ten requests an hour would never cross a count threshold however
      # broken it is. `service_name` is the instrumentor's own label (verified live: catalog, gateway,
      # lineage and maintenance all report it).
      - alert: HttpServerErrorRatioHigh
        expr: sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "More than 5% of one service's HTTP responses are 5xx"
          description: >-
            A service is failing its own requests. This is the estate's only fleet-wide failure
            signal — before it existed, a service could 500 on every read and no rule anywhere
            noticed. Split by `service_name` to find which. Runbook:
            docs/runbooks/RUNBOOK-oncall.md#a-service-answers-5xx-or-slowly

      # LATENCY, and the threshold is deliberately far above the observed estate rather than tuned to
      # it. Measured over a 10m window on 2026-08-26: lineage 500ms. A latency rule that cries wolf is
      # one people mute, and a muted rule is worse than none.
      #
      # THE THRESHOLD IS A BUCKET BOUNDARY BELOW THE LAST. The instrument's boundaries end at 10 s (0.005 ... 5, 7.5,
      # 10), and `histogram_quantile` answers the highest finite boundary for any quantile that falls in the `+Inf`
      # bucket: no p95 reads above 10, so a threshold at or past it can never be crossed. 5 s is a boundary with two
      # above it.
      #
      # `histogram_quantile` over the bucket series is supported by GreptimeDB — verified by running
      # this exact expression against the live store, because promtool accepting it proves nothing
      # about the engine that evaluates it.
      # Maintenance is held to it like any service: its work runs on its work queue (ADR 0198 §2), never inside a
      # request, so its doors (the write-event lane's delivery, the probes) answer as quickly as the rest.
      - alert: HttpServerLatencyHigh
        expr: histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket[10m]))) > 5
        for: 15m
        labels:
          severity: warning
          service: fleet
        annotations:
          summary: "One service's p95 HTTP latency is above 5s"
          description: >-
            Sustained p95 over 5 seconds means requests are queueing behind something — a blocking
            call on the event loop, an exhausted threadpool, or an upstream that stopped answering.
            Runbook: docs/runbooks/RUNBOOK-oncall.md#a-service-answers-5xx-or-slowly

      # The watcher's watcher. Both rules above evaluate over an empty vector and go quiet if the
      # instrumentor stops exporting — indistinguishable from an estate serving no errors. Bare
      # `absent()` in its own rule, never as an operand of a set operator: GreptimeDB refuses the
      # composite form outright (HTTP 500).
      - alert: HttpServerMetricsMissing
        expr: absent(http_server_request_duration_seconds_count)
        for: 15m
        labels:
          severity: critical
          service: fleet
        annotations:
          summary: "No app is reporting HTTP metrics at all"
          description: >-
            `http_server_request_duration_seconds_count` does not exist, so HttpServerErrorRatioHigh and
            HttpServerLatencyHigh are both dead and their silence means nothing. Either
            `opentelemetry-instrument` stopped wiring the FastAPI instrumentor, or the OTLP path to
            GreptimeDB is broken. Runbook: docs/runbooks/RUNBOOK-oncall.md#no-app-reports-http-metrics
