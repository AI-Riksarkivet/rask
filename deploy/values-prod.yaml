# Production overlay — apply ON TOP of values.yaml:
#   helm upgrade lance-ns ./chart -f chart/values.yaml -f deploy/values-prod.yaml
#
# It flips the safe-by-default-OFF prod switches and is the place to externalize the durable/stateful
# tier. See docs/DURABILITY.md for the tier model (ephemeral compute / durable data / external-in-prod).
# Switches set here are wired today; the EXTERNALIZE stanzas at the bottom are commented because they
# also need the matching external-endpoint chart hooks (tracked as follow-up) before they do anything.

# --- App images: set a real release tag before applying (never :dev/:latest in prod). The chart's image
# helper FAILS the render on an empty tag, so DON'T ship tag:"" here — uncomment and fill these. -------
image:
  pullPolicy: IfNotPresent
  # catalog: { tag: v1.2.3 }   # the released catalog/lineage image tag
  # web:     { tag: v1.2.3 }   # the released web image tag

# --- Governance ON — Dex OIDC + OpenFGA. auth.enabled governs the catalog + lineage; medallion.fgaEnabled
# additionally governs the bronze→silver→gold stage runners' WRITE path (can_create_table / can_promote).
# PREREQUISITE: seed the stage runner-identity grants first (scripts/seed_medallion_fga.sh) or the stage runners fail
# closed and the pipeline stalls. ------------------------------------------------------------------
auth:
  enabled: true
  lockRootCreate: true # prod: a token alone can't create root namespaces — needs a warehouse create grant
medallion:
  fgaEnabled: true
  # 1, NOT 2 (audit 2026-07-14 claim-drift #2): the stage runner single-flight lock is PROCESS-LOCAL
  # (transform.py), so 2 replicas can race concurrent overwrites of the same stage dataset.
  # Raise only after a cross-pod lock ships.
  stageRunnerReplicas: 1
  producer:
    expose: false # /produce is the unauthenticated demo entry — the prod head fires from real bronze ingests

# --- HA (P3): multi-replica stateless services + a PodDisruptionBudget. Stateful HA (AGE) is the platform's
# CloudNativePG operator's job (age.cnpgCluster; docs/architecture/deployment.md), not here. Optionally also set autoscaling.enabled. -----
services:
  catalog:
    replicas: 2
  lineage:
    replicas: 2
    demoData: false # the /demo data-peek router carries no OIDC/FGA guard — never mount it in prod
    # #4's durability ON where it matters (audit claim-drift #1: was OFF in every shipped profile
    # while documented "live-verified" — the exact loss window it exists to close stood open).
    outbox:
      enabled: true
    reconcile:
      enabled: true
  # The ONE gateway (the fleet's uvicorn gateway:app on :8888 — the nginx gateway is retired,
  # docs/adr/0117-nginx-is-retired-and-the-fastapi-gateway-is-the-in-cluster.md). fleet.yaml reads services.gateway; ha.yaml's PDB matches
  # component=gateway either way.
  gateway:
    replicas: 2
  # --- Scaled 2026-08-27 (open_fastapi-audit: "No PodDisruptionBudget for any front-door fleet
  # service except the gateway, and values-prod leaves all of them single-replica"). Each of these
  # argues at its own definition site that it scales safely, and prod then left it at one — so a node
  # drain on a cluster upgrade was a full outage window for each. notifications is the sharpest:
  # every zone polls its bell.
  # notifications is DELIBERATELY ABSENT and must stay at 1, and the audit finding that asked for it
  # to be scaled is REFUTED here rather than quietly dropped. Its values.yaml entry argues two planes
  # tolerate replicas — Dapr placement spreads actor ids, and the bus subscription's queueGroupName
  # makes replicas a competing-consumer group — and both are true. The finding stopped there. The
  # THIRD ingress is the cron reconciler, whose overlap guard is an `asyncio.Lock`: per process. At
  # two replicas both pods tick, both read the same un-advanced cursor, and both walk the same rows —
  # double the FGA and actor load, silently, exactly when lineage or the sidecar is already slow.
  # Nothing but this note holds it at 1. What would unblock it is a cross-pod guard that SKIPS (not
  # an actor — actors are turn-based, so ticks would queue instead).
  ingest:
    replicas: 2 # the run store is an explicitly NON-authoritative read-side index that falls back to the durable workflow engine on a miss
  compute:
    replicas: 2 # a stateless proxy over the Ray dashboard — it holds nothing
  # flows is DELIBERATELY ABSENT and must stay at 1: .docker/flows.dockerfile records that its run
  # store is a process-local dict (v0) with no durable fallback, so a second worker would answer
  # GET /flows/runs/{id} with a 404 for a live run. Raise it when that store is durable, not before.
  # Pinned by tests/unit/test_prod_ha_posture.py.
# controlplane renders from its own template, so it is not under `services:` — the reason it kept
# missing chart-wide fixes. A read-only k8s client for Project CRs; it holds no state.
controlplane:
  replicas: 2
frontend:
  replicas: 2
  # A governed backend needs a UI that can sign in. auth.enabled is true above, and
  # templates/auth-consistency.yaml REFUSES that combination without a sign-in flow — the prod
  # overlay could not render at all until this landed, which nothing noticed because the render
  # check itself was unreachable (its `make prod-render-check` target did not exist).
  # Its two secrets (the session sealing key and the client secret) come from the store, field
  # `frontend-session-secret` and `publisher-oidc-client-secret` of `<kvMount>/<secretPath>`; publicIssuer
  # and publicOrigin are configuration, supplied at deploy, and frontends.yaml fails closed on each.
  oidc:
    enabled: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# OpenFGA and the Postgres behind AGE and OpenFGA are the platform's ([[XC-132]], ADR 0153): production runs neither
# and names them. The deployer sets `auth.fgaApiUrl` (the platform's OpenFGA HTTP API) and `age.externalHost`, and the
# render refuses either empty. No credential is a value: an FGA client presents its projected `rask-openfga`
# ServiceAccount token, which the platform's OpenFGA admits by OIDC against the cluster's ServiceAccount issuer for the
# subjects `lance.openfgaSubjects` lists, and the Postgres password is the store's `postgres-password`, which ESO
# delivers. The platform's Postgres carries the Apache AGE extension for the lineage graph (docs/CNPG-AGE.md) and the
# `lineage`, `openfga` and `daprstate` databases; OpenFGA is the authz chokepoint every governed call fails closed
# through, so the platform runs it highly available.
openfga:
  enabled: false
age:
  enabled: false

# Network isolation: default-deny + DNS egress + the EXCLUSIVE OpenBao-ingress lock (only secret-consuming
# app pods may reach openbao:8200). The chart ships the full, correct impl (templates/network-policy.yaml);
# it was simply never enabled on the documented prod overlay — the security audit's headline gap. REQUIRES a
# policy-enforcing CNI (Calico/Cilium): kind's default kindnet SILENTLY ignores NetworkPolicy, so this can't
# be proven on the demo — verify with the negative-isolation probe (docs/KIND-RUNBOOK.md) on the real
# cluster as a prod acceptance step. (prod-readiness P1)
networkPolicy:
  enabled: true

# Load-shed cap sized to the catalog memory tier below (P1): the code default (16) admits 16 × 256MiB
# buffered Arrow-IPC bodies = 4Gi of buffers against the 1Gi limit — a write burst OOM-kills the pod even
# though shedding "worked". Sizing formula: maxConcurrentWrites × maxBodyBytes (2 × 256MiB = 512Mi of body
# buffers) + 512Mi baseline headroom (process + pyarrow decode) = the 1Gi catalog memory limit. Keep the
# formula true when changing either side — prod_render_check.sh asserts it. Overflow writes get 429 +
# Retry-After; multi-hundred-MiB payloads belong on the direct-write/vending path anyway.
catalog:
  maxConcurrentWrites: 2

# Per-workload resource tiers (P2): the shared 1-CPU/512Mi default sizes the stateful stores + the Arrow-
# IPC-buffering catalog like stateless request pods. Give the memory-heavy workloads a real limit (the rest
# keep resources.default). Requests reserve scheduler headroom. Stage runners/lineage stay on default until load
# data says otherwise. (prod-readiness P2)
resources:
  catalog:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi } # sized by catalog.maxConcurrentWrites above (cap×256MiB + 512Mi)
  rustfs:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi } # the lakehouse + observability object store under real load

# --- Backups (P4): the Postgres is the platform's, and its operator does PITR and scheduled backups, so the pg_dump
# CronJob is off. The volume snapshot covers the in-cluster RustFS PVC; with a managed S3 set it false too.
# (snapshotClassName must be a real CSI VolumeSnapshotClass.) ----
backups:
  pgDump:
    enabled: false
  volumeSnapshot:
    enabled: true
    snapshotClassName: "" # set your cluster's CSI VolumeSnapshotClass

# --- Secrets: the SEALED, file-backed OpenBao (no fixed root token; an operator must init + unseal).
# devMode=false is the prod signal. No credential is a chart value: the operator provisions every field
# `<kvMount>/<secretPath>` must hold (docs/chart/templates/openbao.yaml.md lists them) and the External Secrets
# Operator, a prerequisite installed on its own, delivers them (templates/external-secrets.yaml). -----
openbao:
  devMode: false

# --- Ray token auth ON (gate 7 / R3): rask's Ray clients present the store's `ray-auth-token`, which ESO
# writes into `<release>-ray-auth-token`. Enforcing it is the engine's (KubeRay's spec.authOptions.secretName
# on the same Secret): an engine serving an unauthenticated dashboard is remote code execution, and rask,
# which installs no Ray (ADR 0153), cannot refuse that from its own render. rask's own route to Ray,
# compute's /api/ray and /api/serve proxy, is gated by OIDC and FGA. ------------------------------------
ray:
  auth:
    enabled: true

# --- The bundled Dex is the dev IdP (its users and client secret are published in this chart, XC-025); a real
# deployment refuses it (templates/prod-credentials.yaml) and signs in through the platform's IdP.
dex:
  enabled: false

# --- Dapr: the app-API token, the auth secret for the sidecar-delivered routes, is the store's
# `dapr-app-token`; ESO writes it into `<release>-dapr-app-token` for the injector.
dapr:
  # The control plane is the platform's (ADR 0153): it must run HA (multi-replica operator, placement, scheduler and
  # Sentry, the mTLS CA in the sidecar cert-renewal path) and its injector must set `sidecarDropALLCapabilities`,
  # or the sidecar keeps NET_RAW while the app container beside it has none. Both are prerequisites
  # (docs/architecture/deployment.md), not values here.
  dashboard:
    enabled: false # don't expose the Dapr control-plane UI in prod
  # The sidecar's own hardening: `sidecarRestricted` sets the daprd container's securityContext. A pod is only as
  # restricted as its loosest container, which is why the injector's drop-ALL above is a prerequisite.
  sidecarRestricted: true

# --- Infra pod security contexts. Default OFF in values.yaml because the dev loop runs PSA-unlabelled;
# live-proven on 2026-07-13. Pod IDENTITY is not a switch: every first-party pod runs as its own
# tokenless SA in every overlay (templates/security-sa.yaml). `scripts/prod_render_check.sh` asserts
# both on this render. ------------------------------------------------------------------------------
security:
  infraContexts:
    enabled: true

# --- Durable lakehouse storage: the rustfs-operator Tenant's volumeClaimTemplate (the ONE store,
# docs/adr/0124-chart-unification-one-control-plane-each-one-object-store.md). SIZE it for prod — per Tenant volume (4 volumes/pod), holding the lakehouse AND
# 14d of full-sampling observability. Set a snapshot-capable storageClass for the documented
# VolumeSnapshot backups (backups.volumeSnapshot snapshots the Tenant PVCs). --------------------------
rustfs:
  storage: 200Gi
  storageClass: "" # "" = the cluster default SC; prod: a CSI class that supports VolumeSnapshot + encryption

# --- Compaction/GC at a real cadence (not the 120s demo sweep) -------------------------------------
maintenance:
  # HOURLY, because the event lane is the primary trigger and this is the backstop. It is not a
  # tuning preference: the bus is provably incomplete (ingest, Ray TRAIN and external OpenLineage
  # producers emit over HTTP only and never reach `lineage.events.v1`; the catalog's lineage lane has
  # no outbox, so a lost trigger is silent), and clock-due work — an old-version GC on a table nobody
  # has written since — has no write to react to at all. So this must keep running; it just stops
  # being what finds work first.
  #
  # Relax it FURTHER only alongside `workTopic`: with the event lane off this cron IS the trigger, and
  # an hourly primary would leave a busy estate an hour behind. Never past 75 minutes: MaintenanceTableParked's
  # 4h window must hold three periods plus ackWait, or the alert never fires.
  schedule: "0 0 * * * *" # hourly — the backstop under the event lane
  olderThanDays: 7

# --- Ingress fronts the gateway in prod (kind used a port-forward). Wired in templates/ingress.yaml →
# set your className / host / TLS. ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx # match your cluster's Ingress controller (nginx / traefik / …) — this names the CLUSTER's controller class, not rask's gateway; kgateway is the intended future edge
  host: "" # e.g. lance.example.com

# The telemetry store, its dashboards and its alerting are the platform's (ADR 0153). rask's Collector exports to
# the OTLP endpoint named here, and the platform's evaluator loads deploy/alerting/rules.yml.
observability:
  # ON in prod: the Collector ships the estate's telemetry and the `lance.audit` trail to the platform's backend.
  enabled: true
  # The resource attribute every trace and metric carries. values.yaml defaults it to `rask` with the
  # note "override per deploy" and this overlay never did, so prod telemetry — the cascade's included —
  # was indistinguishable from dev in GreptimeDB. Measured on this render 2026-09-16:
  # `deployment.environment.name=rask`. An alert that fires on "the estate" cannot say which one.
  environment: prod
  # `export.endpoint` (the platform's OTLP backend; the render refuses it empty) and `query.url` (its
  # SQL/PromQL API for the zones) are the deployer's to name. The store must meet the audit store's
  # contract (values.yaml `observability`): refuse unauthenticated writes and deletes, admit
  # `otel-collector-export`.

# ===================================================================================================
# EXTERNALIZE the durable/managed tier (tier 3 in docs/DURABILITY.md). Disable the in-cluster component
# AND set its external endpoint — the apps then connect to the managed service (verified: no in-cluster
# DNS leaks into app env). Uncomment per service.
# ---------------------------------------------------------------------------------------------------
# rustfs (rustfs-operator / any managed S3):         # managed S3 for the lakehouse
#   enabled: false
#   externalEndpoint: https://s3.us-east-1.amazonaws.com
# openbao (the platform's store):                   # ESO (a prerequisite) syncs every Secret a pod without a
#   enabled: false                                   # sidecar mounts FROM it; the platform provisions the ESO
#   externalAddr: https://vault.internal:8200        # role and every field the chart's header lists
# externalSecrets:
#   role: lance
# nats (the platform's JetStream, REQUIRED):        # a prerequisite rask never installs (ADR 0153); bus down =
#   url: nats://nats.internal:4222                   # no lineage ingest, no cascade. The stream Job provisions
#   streamReplicas: 3                                # rask's streams on it (needs a 3+ node cluster)
# ray (the one Ray plane, REQUIRED):                 # compute's submits and prune, and Serve discovery
#   dashboardUrl: https://ray.internal:8265          # all read it; unset with no in-cluster head fails the render
# GPU metrics (NVIDIA DCGM operator): the engine's, beside its KubeRay and Kueue (ADR 0153) — the dcgm-exporter
# is node-level infra (a DaemonSet the DCGM operator owns), scraped by the OTel Collector's prometheus receiver
# (the same one that takes the Dapr sidecars). Nothing to flip in this chart until GPU Ray workers land.
