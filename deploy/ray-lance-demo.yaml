# A minimal REAL Ray cluster (head-only single node) for the medallion compute-seam demo — the
# production-shape replacement for in-process fake-Ray. Apply with `make ray-demo`, which then
# `ray job submit`s scripts/ray_lance_job.py (a genuine distributed lance_ray Lance write against RustFS).
# NOT for production: production is KubeRay (RayCluster CR) via the rask merge; this proves the
# ray-cluster + ray-job-submit + distributed-Lance-write seam works end-to-end on kind.
#
# ⚠️ READ BEFORE APPLYING THIS OVER A RUNNING HEAD. On an estate where KubeRay is not rendering
# (`chart/templates/rayservice.yaml` is gated on `singleTenant.enabled`), this hand-applied Deployment
# is the ONLY Ray, and `medallion.rayAddress` gets pointed at it — so the production cascade runs on
# the demo head. That is the misconfiguration; the note below is its consequence.
#
# The chart never creates this Deployment, only references its hostname, so nothing reconciles it and
# `kubectl apply -f` here is a hard overwrite. `image: ray-lance:dev` is what `make ray-demo` builds
# locally, and applying it REPLACES whatever tag the head is serving — including one carrying
# `service_kit` + `storage` (without which every `ray_stage_job.py` dies `ModuleNotFoundError` and the
# whole cascade fails while the mover reports a terminal job) and `dummy_runner` (without which the
# baked dummy job cannot run at all).
#
# Read what is actually deployed first, and put it back if it is not `:dev`:
#   kubectl get deploy ray-lance-head -o jsonpath='{.spec.template.spec.containers[0].image}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-lance-head
  labels: { app: ray-lance-head }
spec:
  replicas: 1
  selector: { matchLabels: { app: ray-lance-head } }
  template:
    metadata:
      labels: { app: ray-lance-head }
    spec:
      containers:
        - name: ray-head
          image: ray-lance:dev
          imagePullPolicy: IfNotPresent
          # A real Ray head: GCS on 6379, dashboard + job-submission API on 8265, client on 10001.
          command: ["ray"]
          args:
            - start
            - --head
            - --dashboard-host=0.0.0.0
            - --port=6379
            - --num-cpus=2
            - --disable-usage-stats
            - --block
          env:
            # In-cluster RustFS — the job reads/writes s3://lance-catalog against this endpoint.
            # `lance-ns-rustfs` is a PRE-RENAME name and resolves to nothing — the chart's RustFS
            # tenant Service is `rask-rustfs-io`. The live pod had been hand-patched to it; applying
            # this file put the stale name back and broke Ray's object store.
            - { name: S3_ENDPOINT, value: "http://rask-rustfs-io:9000" }
            - { name: S3_KEY, value: "rustfsadmin" }
            - { name: S3_SECRET, value: "rustfsadmin" }
            - { name: S3_REGION, value: "us-east-1" }
            - { name: RAY_DEDUP_LOGS, value: "0" }
          ports:
            - { name: gcs, containerPort: 6379 }
            - { name: dashboard, containerPort: 8265 }
            - { name: client, containerPort: 10001 }
          readinessProbe:
            tcpSocket: { port: 8265 }
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        # Ray's plasma object store lives in /dev/shm; the k8s default (64 MiB) is too small.
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ray-lance-head
  labels: { app: ray-lance-head }
spec:
  selector: { app: ray-lance-head }
  ports:
    - { name: gcs, port: 6379, targetPort: 6379 }
    - { name: dashboard, port: 8265, targetPort: 8265 }
    - { name: client, port: 10001, targetPort: 10001 }
