# A minimal REAL Ray cluster (head-only single node) for the medallion compute-seam demo — the
# production-shape replacement for in-process fake-Ray. Apply with `make ray-demo`, which then
# `ray job submit`s scripts/ray_lance_job.py (a genuine distributed lance_ray Lance write against RustFS).
# NOT for production: production is KubeRay (RayCluster CR) via the rask merge; this proves the
# ray-cluster + ray-job-submit + distributed-Lance-write seam works end-to-end on kind.
#
# ⚠️ READ BEFORE APPLYING THIS OVER A RUNNING HEAD. On an estate where KubeRay is not rendering
# (`chart/templates/rayservice.yaml` is gated on `singleTenant.enabled`), this hand-applied Deployment
# is the ONLY Ray, and `medallion.rayAddress` gets pointed at it — so the production cascade runs on
# the demo head. That is the misconfiguration; the note below is its consequence.
#
# The chart never creates this Deployment, only references its hostname, so nothing reconciles it and
# `kubectl apply -f` here is a hard overwrite. `image: ray-lance:dev` is what `make ray-demo` builds
# locally, and applying it REPLACES whatever tag the head is serving — including one carrying
# `service_kit` + `storage` (without which every `ray_stage_job.py` dies `ModuleNotFoundError` and the
# whole cascade fails while the mover reports a terminal job) and `dummy_runner` (without which the
# baked dummy job cannot run at all).
#
# Read what is actually deployed first, and put it back if it is not `:dev`:
#   kubectl get deploy ray-lance-head -o jsonpath='{.spec.template.spec.containers[0].image}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-lance-head
  labels: { app: ray-lance-head }
spec:
  replicas: 1
  selector: { matchLabels: { app: ray-lance-head } }
  template:
    metadata:
      labels: { app: ray-lance-head }
    spec:
      containers:
        - name: ray-head
          # THE REGISTRY REFERENCE, matching the live object. This said `ray-lance:dev`, and every
          # `kubectl apply -f` of this file silently reverted the hand-advanced head back to a tag
          # that was never imported — re-breaking the cascade with nothing naming this file as the
          # cause (recorded 2026-08; the S3 endpoint line below carries the same scar). Advance the
          # tag HERE when the image advances, never by patching the live object alone.
          image: localhost:5000/ray-lance:main-88ccfa2c
          imagePullPolicy: IfNotPresent
          # A real Ray head: GCS on 6379, dashboard + job-submission API on 8265, client on 10001.
          command: ["ray"]
          args:
            - start
            - --head
            - --dashboard-host=0.0.0.0
            - --port=6379
            - --num-cpus=2
            - --disable-usage-stats
            - --block
          env:
            # In-cluster RustFS — the job reads/writes s3://lance-catalog against this endpoint.
            # `lance-ns-rustfs` is a PRE-RENAME name and resolves to nothing — the chart's RustFS
            # tenant Service is `rask-rustfs-io`. The live pod had been hand-patched to it; applying
            # this file put the stale name back and broke Ray's object store.
            - { name: S3_ENDPOINT, value: "http://rask-rustfs-io:9000" }
            # THE SCOPED COMPUTE CREDENTIAL, never the tenant root. This read "rustfsadmin" — the
            # RustFS root key — so re-applying this file silently reverted the credential scoping that
            # took the root key off the Ray plane, and the revert is invisible: the cascade keeps
            # working, because root can do everything the scoped key can. Verified live 2026-08-31:
            # the running head uses `rask-ray-compute`, whose policy reaches the medallion prefix and
            # is AccessDenied against the control plane.
            - { name: S3_KEY, value: "rask-ray-compute" }
            # BY REFERENCE, not a literal — and these two exist because the submission body no
            # longer carries them (docs/DECISIONS.md "The Python estate audit": the Ray Jobs API echoes runtime_env back to
            # any reader, so the S3 secret and the estate's service token were readable off
            # GET /api/jobs/<id>). Jobs read both from the pod env now; the chart's RayService gets
            # the same pair via chart/templates/rayservice.yaml. The token is optional: absent (dapr
            # off) the job omits the header, which is the auth-off ingest's correct behaviour.
            - name: S3_SECRET
              valueFrom:
                # Paired with S3_KEY above: the scoped compute credential's own secret, in its own
                # Secret object. Pointing at `rask-infra-credentials/rustfs-secret-key` here would
                # hand the ROOT secret to a pod whose key is the scoped one — a mismatch that fails
                # closed with an unhelpful SignatureDoesNotMatch rather than saying which half is wrong.
                secretKeyRef: { name: rask-ray-compute-s3, key: secretkey }
            - { name: S3_REGION, value: "us-east-1" }
            - { name: RAY_DEDUP_LOGS, value: "0" }
            # THE TRAINER'S DEDICATED CREDENTIAL, not the shared app token. With
            # `auth.dedicatedServiceCredentials` on — which this estate runs — lineage's
            # `LINEAGE_PRIVILEGED_SUBJECTS` carries `service-trainer`, and `dapr_auth.service_principal`
            # refuses a privileged subject that presents the SHARED token. The head runs no daprd and
            # cannot read `service-token-<identity>` from the secret store the way the first-party
            # services do, so it mounts it off infra-credentials — the route `ray-compute-*` already
            # takes and the object external-secrets syncs from OpenBao.
            #
            # Handed the shared token, every train job logged `lineage emit attempt 1 rejected: HTTP
            # 401`, published its model and exited SUCCEEDED — all training provenance lost with
            # nothing red (measured 2026-09-06). `optional` stays: this manifest is applied on estates
            # with the flag off too, where the key is absent and an omitted header is the correct
            # auth-off behaviour.
            - name: LINEAGE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: rask-infra-credentials, key: service-token-service-trainer, optional: true }
          ports:
            - { name: gcs, containerPort: 6379 }
            - { name: dashboard, containerPort: 8265 }
            - { name: client, containerPort: 10001 }
          readinessProbe:
            tcpSocket: { port: 8265 }
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        # Ray's plasma object store lives in /dev/shm; the k8s default (64 MiB) is too small.
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ray-lance-head
  labels: { app: ray-lance-head }
spec:
  selector: { app: ray-lance-head }
  ports:
    - { name: gcs, port: 6379, targetPort: 6379 }
    - { name: dashboard, port: 8265, targetPort: 8265 }
    - { name: client, port: 10001, targetPort: 10001 }
