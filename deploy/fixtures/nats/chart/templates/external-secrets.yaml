{{- if .Values.nats.auth.server }}
{{- $name := .Values.nats.fullnameOverride }}
{{- $store := printf "%s-vault" .Values.rask.release }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-auth
  labels: {{- include "bus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.rask.refreshInterval | quote }}
  secretStoreRef: { name: {{ $store }}, kind: SecretStore }
  target:
    name: {{ $name }}-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        server.conf: |
          operator: "{{ `{{ .operator }}` }}"
          system_account: "{{ `{{ .systemAccount }}` }}"
          resolver: MEMORY
          resolver_preload: {{ `{{ .resolverPreload }}` }}
        route.conf: |
          routes: [
          {{- range $i := until (int .Values.nats.config.cluster.replicas) }}
            "nats://{{ `{{ .routeUser }}:{{ .routePassword }}` }}@{{ $name }}-{{ $i }}.{{ $name }}-headless:{{ $.Values.nats.config.cluster.port | default 6222 }}"
          {{- end }}
          ]
          authorization { user: "{{ `{{ .routeUser }}` }}", password: "{{ `{{ .routePassword }}` }}" }
  data:
    - { secretKey: operator, remoteRef: { key: nats-server, property: operator } }
    - { secretKey: systemAccount, remoteRef: { key: nats-server, property: system_account } }
    - { secretKey: resolverPreload, remoteRef: { key: nats-server, property: resolver_preload } }
    - { secretKey: routeUser, remoteRef: { key: nats-route, property: user } }
    - { secretKey: routePassword, remoteRef: { key: nats-route, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-box-creds
  labels: {{- include "bus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.rask.refreshInterval | quote }}
  secretStoreRef: { name: {{ $store }}, kind: SecretStore }
  target:
    name: {{ $name }}-box-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        nats.creds: |
          -----BEGIN NATS USER JWT-----
          {{ `{{ .jwt }}` }}
          ------END NATS USER JWT------

          -----BEGIN USER NKEY SEED-----
          {{ `{{ .seed }}` }}
          ------END USER NKEY SEED------
  data:
    - { secretKey: jwt, remoteRef: { key: nats-user-monitor, property: jwt } }
    - { secretKey: seed, remoteRef: { key: nats-user-monitor, property: seed } }
{{- end }}
