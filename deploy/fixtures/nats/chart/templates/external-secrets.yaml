{{- if .Values.nats.auth.server }}
{{- $name := .Values.nats.fullnameOverride }}
{{- $store := printf "%s-vault" .Values.rask.release }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-auth
  labels: {{- include "bus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.rask.refreshInterval | quote }}
  secretStoreRef: { name: {{ $store }}, kind: SecretStore }
  target:
    name: {{ $name }}-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        server.conf: |
          operator: "{{ `{{ .operator }}` }}"
          system_account: "{{ `{{ .systemAccount }}` }}"
          resolver: MEMORY
          resolver_preload: {{ `{{ .resolverPreload }}` }}
          default_sentinel: "{{ `{{ .defaultSentinel }}` }}"
        route.conf: |
          routes: [
          {{- range $i := until (int .Values.nats.config.cluster.replicas) }}
            "nats://{{ `{{ .routeUser }}:{{ .routePassword }}` }}@{{ $name }}-{{ $i }}.{{ $name }}-headless:{{ $.Values.nats.config.cluster.port | default 6222 }}"
          {{- end }}
          ]
          authorization { user: "{{ `{{ .routeUser }}` }}", password: "{{ `{{ .routePassword }}` }}" }
  data:
    - { secretKey: operator, remoteRef: { key: nats-server, property: operator } }
    - { secretKey: systemAccount, remoteRef: { key: nats-server, property: system_account } }
    - { secretKey: resolverPreload, remoteRef: { key: nats-server, property: resolver_preload } }
    - { secretKey: defaultSentinel, remoteRef: { key: nats-server, property: default_sentinel } }
    - { secretKey: routeUser, remoteRef: { key: nats-route, property: user } }
    - { secretKey: routePassword, remoteRef: { key: nats-route, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-box-creds
  labels: {{- include "bus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.rask.refreshInterval | quote }}
  secretStoreRef: { name: {{ $store }}, kind: SecretStore }
  target:
    name: {{ $name }}-box-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        nats.creds: |
          -----BEGIN NATS USER JWT-----
          {{ `{{ .jwt }}` }}
          ------END NATS USER JWT------

          -----BEGIN USER NKEY SEED-----
          {{ `{{ .seed }}` }}
          ------END USER NKEY SEED------
  data:
    - { secretKey: jwt, remoteRef: { key: nats-user-monitor, property: jwt } }
    - { secretKey: seed, remoteRef: { key: nats-user-monitor, property: seed } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-signer
  labels: {{- include "bus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.rask.refreshInterval | quote }}
  secretStoreRef: { name: {{ $store }}, kind: SecretStore }
  target:
    name: {{ $name }}-signer
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        callout.creds: |
          -----BEGIN NATS USER JWT-----
          {{ `{{ .jwt }}` }}
          ------END NATS USER JWT------

          -----BEGIN USER NKEY SEED-----
          {{ `{{ .seed }}` }}
          ------END USER NKEY SEED------
        issuer.seed: "{{ `{{ .issuerSeed }}` }}"
        auth_account: "{{ `{{ .authAccount }}` }}"
        app_account: "{{ `{{ .appAccount }}` }}"
  data:
    - { secretKey: jwt, remoteRef: { key: nats-callout, property: jwt } }
    - { secretKey: seed, remoteRef: { key: nats-callout, property: seed } }
    - { secretKey: issuerSeed, remoteRef: { key: nats-callout, property: issuer_seed } }
    - { secretKey: authAccount, remoteRef: { key: nats-callout, property: auth_account } }
    - { secretKey: appAccount, remoteRef: { key: nats-callout, property: app_account } }
---
# Each session user's scoped seed, one file per user named by the user (`key-<user>` in the store), so the signer reads
# `<keys dir>/<user>`. The set of users is rask's table, which this chart does not know, so the whole secret is fetched
# and only its `key-` properties are written.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-signer-keys
  labels: {{- include "bus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.rask.refreshInterval | quote }}
  secretStoreRef: { name: {{ $store }}, kind: SecretStore }
  target:
    name: {{ $name }}-signer-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      templateFrom:
        - target: Data
          literal: |
            {{ `{{- range $k, $v := . }}{{ if hasPrefix "key-" $k }}{{ trimPrefix "key-" $k }}: {{ $v | quote }}
            {{ end }}{{ end }}` }}
  dataFrom:
    - extract: { key: nats-callout }
{{- end }}
