{{- if .Values.nats.auth.server }}
{{- $name := .Values.nats.fullnameOverride }}
{{- $ns := .Release.Namespace }}
{{- $held := (lookup "v1" "Secret" $ns (printf "%s-tls" $name)).data | default dict }}
{{- $ca := "" }}{{- $crt := "" }}{{- $key := "" }}
{{- if and (index $held "ca.crt") (index $held "tls.crt") (index $held "tls.key") }}
{{- $ca = index $held "ca.crt" | b64dec }}{{- $crt = index $held "tls.crt" | b64dec }}{{- $key = index $held "tls.key" | b64dec }}
{{- else }}
{{- $root := genCA (printf "%s development bus CA" $name) 3650 }}
{{- $names := list $name (printf "%s.%s" $name $ns) (printf "%s.%s.svc" $name $ns) (printf "%s.%s.svc.cluster.local" $name $ns) (printf "*.%s-headless" $name) (printf "*.%s-headless.%s.svc.cluster.local" $name $ns) "localhost" }}
{{- $leaf := genSignedCert $name (list "127.0.0.1") $names 3650 $root }}
{{- $ca = $root.Cert }}{{- $crt = $leaf.Cert }}{{- $key = $leaf.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-tls
  labels: {{- include "bus.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca | b64enc }}
  tls.crt: {{ $crt | b64enc }}
  tls.key: {{ $key | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-ca
  labels: {{- include "bus.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- $ca | nindent 4 }}
{{- end }}
