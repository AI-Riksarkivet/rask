# NOT FOR PRODUCTION (deploy/fixtures/README.md).

# -- The Service and Deployment name: what rask's `lance.dexHost` dials for release `rask`.
name: rask-dex
# v2.46.0 is the first release serving the client-credentials grant a machine client signs in with (ADR 0181).
image: ghcr.io/dexidp/dex:v2.46.1
port: 5556
# The issuer Dex serves, rask's `auth.oidc.issuer`; `make k3s-fixtures` passes DEV_ISSUER, as it does to rask.
issuer: http://rask-dex:5556/dex
# -- The browser origins Dex answers CORS for (`web.allowedOrigins`) on every door it serves with CORS (v2.46.1: discovery,
# `/keys`, `/token`, `/token/introspect`, `/userinfo` and its landing page `/`), with no credentials and only gorilla's
# default request headers (`web.allowedHeaders` unset); empty answers none. A browser app served from another origin than
# the issuer's lists its origin from its own tree.
allowedOrigins: []
# The fixture's own sign-in client, which the live lanes sign in as with the password grant, and its secret: confidential,
# with no redirect, so no browser signs in through it.
clientId: rask-web
clientSecret: lance-catalog-secret
# The lakehouse's audience: rask's `auth.oidc.audience`, which every governed door checks. Declared as a client that trusts
# the sign-in client: Dex issues a token for it only to a trusted client asking for `audience:server:client_id:<audience>`
# (measured on Dex v2.42.0, [[LH-515]]). It is confidential, with a secret no client is given: Dex refuses a confidential
# client with no secret, and a public one would let anyone sign in as the audience and skip the trust.
audience: rask-lakehouse
audienceSecret: rask-lakehouse-held-by-no-client
# Pipelines outside Kubernetes, each a confidential client signing in for itself with the client-credentials grant: the
# machine `dex-client~<id>` (ADR 0181). The audience client trusts each, so its token is issued for the lakehouse.
machineClients:
  - { id: rask-pipeline, secret: rask-pipeline-dev-secret }
# A client release's own sign-in clients, each `{id, secret, redirectURIs}`, or `{id, public: true, redirectURIs}` for a
# browser app that holds no secret and signs in with PKCE (S256, which this Dex enforces): a person signs in to that
# client through it, and the audience client trusts it, so the person's token is issued for the lakehouse. A public
# client's residual is this fixture's: Dex serves the password grant to every client (`oauth2.grantTypes` is global, and
# a client has no grant list of its own), so anyone holding a public client's id may trade a password at /token for a
# lakehouse token without a browser. A platform's IdP that limits grants per client closes it. Empty here: a client supplies its own entry from
# its tree (`deploy/fixtures/<client>/dex-values.yaml`, which `make k3s-fixtures` layers on by glob), and the pinned
# lakehouse a client's e2e stands up (`Lakehouse` in .dagger/release.go) registers the client it is given ([[XC-189]]).
clients: []
# Demo identities with one password. The hash is bcrypt of "password". alice and bob make the governed demo's allow and
# deny: alice creates a table and is granted it, bob is refused reading it. carol, dave and erin are the writer, the
# reader and the outsider of criterion 2's principal matrix (tests/e2e-py/test_the_catalog_is_correct.py), so each rung
# there is held by a different person.
users:
  - { email: alice@example.com, username: alice, userID: 08a8684b-db88-4b73-90a9-3cd1661f5466 }
  - { email: bob@example.com, username: bob, userID: 1b6e2f5a-7c4d-4e9b-9f1a-2d3c4b5a6e7f }
  - { email: carol@example.com, username: carol, userID: 718ae9f8-ab91-403e-a07c-cd1caf667cce }
  - { email: dave@example.com, username: dave, userID: a7d3182d-0d75-4ce6-930f-dcb5c0d9f8ad }
  - { email: erin@example.com, username: erin, userID: bbca9aad-6c7c-4bcd-a88e-f74abbae1185 }
passwordHash: "$2b$10$TsVVN0.5g.XntmJAGNuXF.gyhwQZgmgjmkevKxTa48M7k06J./53G"
# A user bound to no team and granted nothing: the live lanes' job identity and their outsider (tests/e2e-py
# scratch_tenant.py, byo_scenario.py, topology.py), who sign in with the static users' password.
publisher:
  username: publisher@rask.internal
  userID: 7f2a9c41-5b8e-4d16-a3f7-9e0c1d2b3a45
  passwordHash: "$2b$10$TsVVN0.5g.XntmJAGNuXF.gyhwQZgmgjmkevKxTa48M7k06J./53G"
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
