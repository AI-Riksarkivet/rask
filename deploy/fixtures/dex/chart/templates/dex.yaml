{{- $labels := dict "app.kubernetes.io/name" "dex" "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "dex" }}
{{- $clients := .Values.clients | default dict }}
{{- if not (kindIs "map" $clients) }}{{ fail "clients is a map of entries keyed by client id, `<id>: {public, secret, redirectURIs, allowedOrigins}`: values files then merge, where a list would replace every other file's clients" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
data:
  config.yaml: |
    issuer: {{ .Values.issuer }}
    storage:
      type: memory
    web:
      http: 0.0.0.0:{{ .Values.port }}
      {{- $origins := concat .Values.console.allowedOrigins .Values.allowedOrigins }}
      {{- range $id := keys $clients | sortAlpha }}{{- $origins = concat $origins ((get $clients $id).allowedOrigins | default list) }}{{- end }}
      {{- with $origins | uniq }}
      allowedOrigins: {{ toJson . }}
      {{- end }}
    sessions:
      absoluteLifetime: {{ required "sessions.absoluteLifetime is how long a login session lasts at most" .Values.sessions.absoluteLifetime | quote }}
      validIfNotUsedFor: {{ required "sessions.validIfNotUsedFor is how long an unused login session stays valid" .Values.sessions.validIfNotUsedFor | quote }}
    expiry:
      idTokens: {{ required "expiry.idTokens is how long an id token lasts" .Values.expiry.idTokens | quote }}
      refreshTokens:
        validIfNotUsedFor: {{ required "expiry.refreshTokens.validIfNotUsedFor is how long an unused refresh token stays valid" .Values.expiry.refreshTokens.validIfNotUsedFor | quote }}
        absoluteLifetime: {{ required "expiry.refreshTokens.absoluteLifetime is how long a refresh token lasts at most" .Values.expiry.refreshTokens.absoluteLifetime | quote }}
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
      # Every authorization code is bound to an S256 challenge (v2.46.1 `server/authflow/request.go:246-254`); the
      # password, client-credentials and token-exchange grants never pass /auth, so the rule does not reach them.
      pkce:
        enforce: true
        codeChallengeMethodsSupported: [S256]
      # The grants Dex serves by default, less the device grant, and the client-credentials grant, which it serves only
      # when listed. The device flow's own /auth redirect carries no challenge (v2.46.1 `server/device/device.go:276-290`),
      # so under the enforced PKCE above it could not complete.
      grantTypes:
        - authorization_code
        - refresh_token
        - password
        - urn:ietf:params:oauth:grant-type:token-exchange
        - client_credentials
    enablePasswordDB: true
    staticPasswords:
      {{- range .Values.users }}
      - email: {{ .email | quote }}
        hash: {{ $.Values.passwordHash | quote }}
        username: {{ .username }}
        userID: {{ .userID | quote }}
      {{- end }}
      - email: {{ .Values.publisher.username | quote }}
        hash: {{ .Values.publisher.passwordHash | quote }}
        username: publisher
        userID: {{ .Values.publisher.userID | quote }}
    staticClients:
      - id: {{ .Values.clientId }}
        name: Sign-in
        secret: {{ required "clientSecret is the sign-in client's secret: it is confidential" .Values.clientSecret }}
      - id: {{ required "audience names the lakehouse's audience client" .Values.audience }}
        name: Lakehouse
        secret: {{ required "audienceSecret is the audience client's secret, which no client is given" .Values.audienceSecret }}
        trustedPeers: [{{ .Values.clientId | quote }}, {{ .Values.console.clientId | quote }}{{ range .Values.machineClients }}, {{ .id | quote }}{{ end }}{{ range $id := keys $clients | sortAlpha }}, {{ $id | quote }}{{ end }}]
      {{- range .Values.machineClients }}
      - id: {{ .id }}
        name: {{ .id }}
        secret: {{ .secret }}
      {{- end }}
      - id: {{ required "console.clientId names the console's public sign-in client" .Values.console.clientId | quote }}
        name: Console
        public: true
        redirectURIs: {{ required "console.redirectURIs names the console's callbacks: Dex accepts any loopback, out-of-band or device redirect for a public client with none" .Values.console.redirectURIs | toJson }}
        postLogoutRedirectURIs: {{ required "console.postLogoutRedirectURIs names where the console's sign-out may land: Dex refuses a redirect its client did not register" .Values.console.postLogoutRedirectURIs | toJson }}
      {{- $ids := list .Values.clientId .Values.audience .Values.console.clientId }}
      {{- range .Values.machineClients }}
      {{- if has .id $ids }}{{ fail (printf "Dex client id %q is declared twice" .id) }}{{ end }}
      {{- $ids = append $ids .id }}
      {{- end }}
      {{- range $id := keys $clients | sortAlpha }}
      {{- $client := get $clients $id }}
      {{- if has $id $ids }}{{ fail (printf "Dex client id %q is declared twice" $id) }}{{ end }}
      - id: {{ $id | quote }}
        name: {{ $id | quote }}
        {{- if $client.public }}
        {{- if $client.secret }}{{ fail (printf "clients %q is public and names a secret: a public client holds none" $id) }}{{ end }}
        {{- if not $client.redirectURIs }}{{ fail (printf "clients %q is public and names no redirectURIs: Dex then accepts any loopback, out-of-band or device redirect for it" $id) }}{{ end }}
        public: true
        {{- else }}
        secret: {{ required (printf "clients %q names no secret (a browser app without one is `public: true`)" $id) $client.secret | quote }}
        {{- end }}
        redirectURIs: {{ $client.redirectURIs | default list | toJson }}
        {{- with $client.postLogoutRedirectURIs }}
        postLogoutRedirectURIs: {{ toJson . }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  ports:
    - { name: http, port: {{ .Values.port }}, targetPort: {{ .Values.port }} }
  selector: {{- toYaml $labels | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- toYaml $labels | nindent 6 }}
  template:
    metadata:
      labels: {{- toYaml $labels | nindent 8 }}
      annotations:
        # Dex reads its config at boot only, so a config change must roll the pod.
        checksum/config: {{ omit .Values "resources" | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dex
          image: {{ .Values.image }}
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          env:
            - { name: DEX_SESSIONS_ENABLED, value: "true" }
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/dex }
            # Dex's entrypoint renders its config to a temp file before it serves, measured on v2.42.0 under a
            # read-only root: `cannot create temp file: open /tmp/dex.config.yaml-…`.
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /dex/.well-known/openid-configuration, port: {{ .Values.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ .Values.name }} }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
