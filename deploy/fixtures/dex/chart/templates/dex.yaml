{{- $labels := dict "app.kubernetes.io/name" "dex" "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "dex" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
data:
  config.yaml: |
    issuer: {{ .Values.issuer }}
    storage:
      type: memory
    web:
      http: 0.0.0.0:{{ .Values.port }}
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
      # The grants Dex serves by default, and the client-credentials grant, which it serves only when listed.
      grantTypes:
        - authorization_code
        - refresh_token
        - password
        - urn:ietf:params:oauth:grant-type:device_code
        - urn:ietf:params:oauth:grant-type:token-exchange
        - client_credentials
    enablePasswordDB: true
    staticPasswords:
      {{- range .Values.users }}
      - email: {{ .email | quote }}
        hash: {{ $.Values.passwordHash | quote }}
        username: {{ .username }}
        userID: {{ .userID | quote }}
      {{- end }}
      - email: {{ .Values.publisher.username | quote }}
        hash: {{ .Values.publisher.passwordHash | quote }}
        username: publisher
        userID: {{ .Values.publisher.userID | quote }}
    staticClients:
      - id: {{ .Values.clientId }}
        name: Web zones
        secret: {{ .Values.clientSecret }}
        public: true
        redirectURIs:
          - http://localhost:8080/callback
          {{- with .Values.publicOrigin }}
          - {{ . | trimSuffix "/" }}/auth/callback
          {{- end }}
      - id: {{ required "audience names the lakehouse's audience client" .Values.audience }}
        name: Lakehouse
        secret: {{ required "audienceSecret is the audience client's secret, which no client is given" .Values.audienceSecret }}
        trustedPeers: [{{ .Values.clientId }}{{ range .Values.machineClients }}, {{ .id }}{{ end }}]
      {{- range .Values.machineClients }}
      - id: {{ .id }}
        name: {{ .id }}
        secret: {{ .secret }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  ports:
    - { name: http, port: {{ .Values.port }}, targetPort: {{ .Values.port }} }
  selector: {{- toYaml $labels | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- toYaml $labels | nindent 6 }}
  template:
    metadata:
      labels: {{- toYaml $labels | nindent 8 }}
      annotations:
        # Dex reads its config at boot only, so a config change must roll the pod.
        checksum/config: {{ omit .Values "resources" | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dex
          image: {{ .Values.image }}
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/dex }
            # Dex's entrypoint renders its config to a temp file before it serves, measured on v2.42.0 under a
            # read-only root: `cannot create temp file: open /tmp/dex.config.yaml-…`.
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /dex/.well-known/openid-configuration, port: {{ .Values.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ .Values.name }} }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
