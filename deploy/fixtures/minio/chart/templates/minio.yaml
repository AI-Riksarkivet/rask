{{- $labels := dict "app.kubernetes.io/name" "minio" "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" "minio" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  {{- if .Values.nodePort }}
  type: NodePort
  {{- end }}
  selector: {{- toYaml $labels | nindent 4 }}
  ports:
    - { name: s3, port: {{ .Values.port }}, targetPort: s3{{ with .Values.nodePort }}, nodePort: {{ . }}{{ end }} }
    - { name: console, port: {{ .Values.consolePort }}, targetPort: console }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-hl
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- toYaml $labels | nindent 4 }}
  ports:
    - { name: s3, port: {{ .Values.port }}, targetPort: s3 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  labels: {{- toYaml $labels | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}-hl
  replicas: {{ .Values.servers }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- toYaml $labels | nindent 6 }}
  template:
    metadata:
      labels: {{- toYaml $labels | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            {{- range $i := until (int .Values.volumesPerServer) }}
            - /data-{{ $i }}
            {{- end }}
            - --address
            - ":{{ .Values.port }}"
            - --console-address
            - ":{{ .Values.consolePort }}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.rootCredentials }}, key: minio-access-key } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.rootCredentials }}, key: minio-secret-key } }
            {{- if .Values.oidc.enabled }}
            - { name: MINIO_IDENTITY_OPENID_CONFIG_URL, value: "{{ .Values.oidc.issuer }}/.well-known/openid-configuration" }
            - { name: MINIO_IDENTITY_OPENID_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }} }
            - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.rootCredentials }}, key: dex-client-secret } }
            - { name: MINIO_IDENTITY_OPENID_SCOPES, value: "openid,email" }
            - { name: MINIO_IDENTITY_OPENID_ROLE_POLICY, value: {{ .Values.oidc.rolePolicy | quote }} }
            {{- end }}
          ports:
            - { name: s3, containerPort: {{ .Values.port }} }
            - { name: console, containerPort: {{ .Values.consolePort }} }
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /minio/health/cluster, port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            {{- range $i := until (int .Values.volumesPerServer) }}
            - { name: data-{{ $i }}, mountPath: /data-{{ $i }} }
            {{- end }}
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: "2Gi" } }
  volumeClaimTemplates:
    {{- range $i := until (int .Values.volumesPerServer) }}
    - metadata:
        name: data-{{ $i }}
        labels:
          app.kubernetes.io/instance: {{ $.Release.Name }}
          app.kubernetes.io/component: minio
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.storage | quote }}
        {{- with $.Values.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
    {{- end }}
