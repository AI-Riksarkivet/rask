apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.dashboards.configMap }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  project.json: |
    {
      "kind": "Project",
      "metadata": { "name": "rask" },
      "spec": { "display": { "name": "rask" } }
    }
  fleet-red.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "fleet-red", "project": "rask" },
      "spec": {
        "display": { "name": "rask Fleet — RED", "description": "Request rate, error rate, and duration per fleet service (OTLP http.server metrics)." },
        "duration": "1h",
        "panels": {
          "requestRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Request rate (req/s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "errorRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Error rate (5xx %)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "percent" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "100 * sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])), 0.001)",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "latencyP95": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "p95 latency (ms)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "seconds" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket[5m])))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "activeRequests": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "In-flight requests" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (http_server_active_requests)",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Fleet RED" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/requestRate" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/errorRate" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/latencyP95" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/activeRequests" } }
              ]
            }
          }
        ]
      }
    }
  lineage.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "lineage", "project": "rask" },
      "spec": {
        "display": { "name": "Lance Lineage — ingest + RED", "description": "Domain signal (events ingested/dropped/retried, ingest latency) + OTLP HTTP RED, all from GreptimeDB." },
        "duration": "1h",
        "panels": {
          "eventsByOutcome": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Lineage events /s by outcome" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_lineage_outcome) (rate(lineage_events_processed_total[5m]))",
                "seriesNameFormat": {{ "{{lance_lineage_outcome}}" | quote }} } } } } ]
            }
          },
          "ingestP95": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Ingest p95 (s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "seconds" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (le) (rate(lineage_ingest_duration_seconds_bucket[5m])))",
                "seriesNameFormat": "p95" } } } } ]
            }
          },
          "httpRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "HTTP request rate (req/s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "httpP95": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "HTTP p95 latency (ms)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" }, "yAxis": { "format": { "unit": "seconds" } } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket[5m])))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Lineage ingest + RED" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/eventsByOutcome" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/ingestP95" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/httpRate" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/httpP95" } }
              ]
            }
          }
        ]
      }
    }
  service-flow.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "service-flow", "project": "rask" },
      "spec": {
        "display": { "name": "Service Flow", "description": "How the event-driven services connect + move data — per-service activity, from GreptimeDB. (A node-topology graph would need the OTel Collector's servicegraph connector; this is the metrics view over the OTLP signals the Collector exports.)" },
        "duration": "30m",
        "panels": {
          "activeServices": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Active services — request rate (req/s)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "lineageOutcomes": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Lineage ingest /s by outcome" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_lineage_outcome) (rate(lineage_events_processed_total[5m]))",
                "seriesNameFormat": {{ "{{lance_lineage_outcome}}" | quote }} } } } } ]
            }
          },
          "compactionSweeps": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Maintenance tasks completed per hour, by kind" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (kind) (increase(maintenance_tasks_completed_total[1h]))" } } } } ]
            }
          },
          "errorRate": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Error rate — 5xx share of requests, by service (the missing E in RED)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) / sum by (service_name) (rate(http_server_request_duration_seconds_count[5m]))",
                "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          },
          "outboxDurability": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Outbox durability — depth + oldest age (alertable pair; sustained > 0 = relay not draining)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "max by (lance_outbox_lane) (outbox_depth)", "seriesNameFormat": "{{`{{lance_outbox_lane}}`}} depth (events)" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "max by (lance_outbox_lane) (outbox_oldest_age_seconds)", "seriesNameFormat": "{{`{{lance_outbox_lane}}`}} oldest age (s)" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (lance_outbox_lane) (rate(outbox_publish_failed_total[5m]))", "seriesNameFormat": "{{`{{lance_outbox_lane}}`}} publish failed /s" } } } }
              ]
            }
          },
          "governanceGates": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Blocked at the gates — dead-letters + catalog emit failures" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(lineage_events_processed_total{lance_lineage_outcome=\"dead_lettered\"}[5m]))", "seriesNameFormat": "dead-lettered /s" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(catalog_lineage_emit_failed_total[5m]))", "seriesNameFormat": "catalog emit failed /s" } } } }
              ]
            }
          },
          "authzLatency": {
            "kind": "Panel",
            "spec": {
              "display": {
                "name": "Authz store — OpenFGA Check latency and datastore reads ([[XC-047]])",
                "description": "Every governed read and write in this estate blocks on an OpenFGA Check, so this is the latency the catalog's doors actually pay. Scraped from OpenFGA's own :2112 by the Collector's `openfga` job. `iter_query_duration` is the datastore side: a Check that is slow because Postgres is slow looks identical to one that is slow because the model is deep, until these two are plotted together."
              },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "histogram_quantile(0.95, sum by (le) (rate(openfga_request_duration_ms_bucket[5m])))", "seriesNameFormat": "request p95 (ms)" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "histogram_quantile(0.95, sum by (le) (rate(openfga_iter_query_duration_ms_bucket[5m])))", "seriesNameFormat": "datastore iter p95 (ms)" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(rate(openfga_datastore_query_count_sum[5m]))", "seriesNameFormat": "datastore queries /s" } } } }
              ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Service flow" },
              "items": [
                { "x": 0, "y": 0, "width": 24, "height": 8, "content": { "$ref": "#/spec/panels/activeServices" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/lineageOutcomes" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/compactionSweeps" } },
                { "x": 0, "y": 16, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/errorRate" } },
                { "x": 8, "y": 16, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/outboxDurability" } },
                { "x": 16, "y": 16, "width": 8, "height": 8, "content": { "$ref": "#/spec/panels/governanceGates" } },
                { "x": 0, "y": 24, "width": 24, "height": 8, "content": { "$ref": "#/spec/panels/authzLatency" } }
              ]
            }
          }
        ]
      }
    }
  maintenance.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "maintenance", "project": "rask" },
      "spec": {
        "display": { "name": "Table maintenance — the passes", "description": "What the worker's tasks did: the tasks it completed and ended, the datasets its passes covered and refused, and the versions and bytes they RECLAIMED." },
        "duration": "6h",
        "panels": {
          "runs": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Tasks ended and overrun per hour, by kind" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (kind) (increase(maintenance_tasks_ended_total[1h]))" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum by (kind) (increase(maintenance_passes_overran_total[1h]))" } } } }
              ]
            }
          },
          "coverage": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Datasets per 10 minutes — passed vs refused" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(maintenance_datasets_swept_total[10m]))", "seriesNameFormat": "passed" } } } },
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(maintenance_datasets_refused_total[10m]))", "seriesNameFormat": "refused" } } } }
              ]
            }
          },
          "reclaimed": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Versions reclaimed per hour (flat zero means expiry is doing no work)" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(maintenance_versions_removed_total[1h]))", "seriesNameFormat": "versions removed" } } } }
              ]
            }
          },
          "bytes": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Bytes reclaimed per hour" },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum(increase(maintenance_bytes_reclaimed_total[1h]))", "seriesNameFormat": "bytes reclaimed" } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Sweep" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/runs" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/coverage" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/reclaimed" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/bytes" } }
              ]
            }
          }
        ]
      }
    }
  storage.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "storage", "project": "rask" },
      "spec": {
        "display": { "name": "rask Storage \u2014 the object store under the lakehouse", "description": "lance_object_store_* has been emitted by five services and read by nothing. Every Lance read and write goes through here, so an S3 stall presents as slow writes with no cause anywhere else." },
        "duration": "6h",
        "panels": {
          "requests": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Requests by operation", "description": "Grouped by operation and base \u2014 never by object key, which is unbounded." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (operation) (rate(lance_object_store_requests_total[5m]))", "seriesNameFormat": {{ "{{operation}}" | quote }} } } } } ]
            }
          },
          "errors": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Errors by operation", "description": "`or vector(0)` on purpose: this counter is only created when something fails, so without it a healthy estate renders NO DATA \u2014 indistinguishable from a broken panel." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (operation) (rate(lance_object_store_errors_total[5m])) or vector(0)", "seriesNameFormat": {{ "{{operation}}" | quote }} } } } } ]
            }
          },
          "latency": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Request latency p95", "description": "The bucket series is `..._bucket_total`, NOT `..._bucket` \u2014 the exporter appends _total here. A panel on the conventional name finds nothing, which is the same class of defect as the outbox phantom." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "histogram_quantile(0.95, sum by (le, operation) (rate(lance_object_store_request_duration_seconds_bucket_total[5m])))", "seriesNameFormat": {{ "{{operation}}" | quote }} } } } } ]
            }
          },
          "inflight": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "In-flight requests", "description": "A gauge. Climbing while the request rate is flat is the object store applying backpressure." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (service_name) (lance_object_store_in_flight_requests)", "seriesNameFormat": {{ "{{service_name}}" | quote }} } } } } ]
            }
          }
        },
        "layouts": [
          {
            "kind": "Grid",
            "spec": {
              "display": { "title": "Object store" },
              "items": [
                { "x": 0, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/requests" } },
                { "x": 12, "y": 0, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/errors" } },
                { "x": 0, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/latency" } },
                { "x": 12, "y": 8, "width": 12, "height": 8, "content": { "$ref": "#/spec/panels/inflight" } }
              ]
            }
          }
        ]
      }
    }
  messaging.json: |
    {
      "kind": "Dashboard",
      "metadata": { "name": "messaging", "project": "rask" },
      "spec": {
        "display": { "name": "rask Messaging \u2014 the bus and the timers", "description": "Publish failures, undeliverable drops and each fixed timer's turns." },
        "duration": "6h",
        "panels": {
          "egress": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Publishes by topic and outcome", "description": "Each service's publishes on its own connection to the bus, counted where they are made. A series with an error_type is a publish the bus did not take, named by what it raised; its event stays staged where the lane has an outbox. A failing producer shows here before anyone notices its consumer has gone quiet." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (messaging_destination_name, error_type) (rate(messaging_client_operation_duration_seconds_count[5m]))", "seriesNameFormat": {{ "{{messaging_destination_name}} {{error_type}}" | quote }} } } } } ]
            }
          },
          "ingress": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Deliveries by consumer and outcome", "description": "Each service's deliveries from its consumer on the bus, counted where they are settled: taken, asked for again, parked, and, on a subject a service follows, failed. A lane that books `again` with no `taken` beside it is not draining its consumer. The maintenance worker counts its own lanes' settlings (`maintenance_arrivals_settled_total`, `maintenance_store_events_settled_total`)." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (lance_bus_consumer, lance_bus_outcome) (rate(bus_deliveries_total[5m]))", "seriesNameFormat": {{ "{{lance_bus_consumer}} {{lance_bus_outcome}}" | quote }} } } } } ]
            }
          },
          "timers": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Timer turns", "description": "Each fixed timer's turns by how they ended: one replica runs a window (ran) and the others find it claimed (elsewhere); held is a read-only window, unread a claim the store did not answer." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [ { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                "query": "sum by (timer, outcome) (rate(timer_turns_total[15m]))", "seriesNameFormat": {{ "{{timer}} {{outcome}}" | quote }} } } } } ]
            }
          },
          "silentLoss": {
            "kind": "Panel",
            "spec": {
              "display": { "name": "Silent data loss", "description": "A counter that records UNRECOVERABLE loss and is read by no alert and no other panel. It carries `or vector(0)`: it only ever increments on loss, so without it a healthy estate renders NO DATA \u2014 and a silent-loss counter that is itself silent reads as coverage." },
              "plugin": { "kind": "TimeSeriesChart", "spec": { "legend": { "position": "bottom" } } },
              "queries": [
                { "kind": "TimeSeriesQuery", "spec": { "plugin": { "kind": "PrometheusTimeSeriesQuery", "spec": {
                  "query": "sum(increase(outbox_events_poison_dropped_total[1h])) or vector(0)", "seriesNameFormat": {{ "outbox poison dropped" | quote }} } } } }
              ]
            }
          }
        },
