{{- $c := .Values.collector }}
{{- if $c.enabled }}
{{- $name := "otel-collector" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "observability.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ $name }}
  labels: {{- include "observability.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-{{ $name }}
  labels: {{- include "observability.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-{{ $name }} }
subjects:
  - { kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }} }
---
{{ include "observability.collectorConfig" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "observability.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include "observability.collectorConfig" . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: cluster-keys
          image: {{ $c.keysImage }}
          imagePullPolicy: IfNotPresent
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              curl -sf --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" \
                https://kubernetes.default.svc/openid/v1/jwks -o /var/run/cluster-keys/jwks.json
          volumeMounts:
            - { name: cluster-keys, mountPath: /var/run/cluster-keys }
      containers:
        - name: {{ $name }}
          image: {{ $c.image }}
          imagePullPolicy: IfNotPresent
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe: { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 30, periodSeconds: 30, failureThreshold: 3 }
          resources: {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol, readOnly: true }
            - { name: cluster-keys, mountPath: /var/run/cluster-keys, readOnly: true }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
            - { name: offsets, mountPath: /var/lib/otelcol/file_storage }
      volumes:
        - name: config
          configMap: { name: {{ $name }} }
        - { name: cluster-keys, emptyDir: { sizeLimit: 1Mi } }
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
        - { name: varlibdockercontainers, hostPath: { path: /var/lib/docker/containers } }
        - { name: offsets, emptyDir: { sizeLimit: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "observability.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
{{- end }}
{{- define "observability.collectorConfig" -}}
{{- $c := .Values.collector }}
{{- $store := printf "%s/v1/otlp" (include "observability.store" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels: {{- include "observability.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol/file_storage
      oidc:
        providers:
          - issuer_url: {{ $c.identity.issuer | quote }}
            audience: {{ $c.identity.audience | quote }}
            public_keys_file: /var/run/cluster-keys/jwks.json
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            auth: { authenticator: oidc }
      otlp/platform:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/{{ .Release.Namespace }}_otel-collector-*/*/*.log]
        include_file_path: true
        start_at: end
        storage: file_storage
        retry_on_failure: { enabled: true }
        operators:
          - type: container
      prometheus:
        config:
          scrape_configs:
            - job_name: openfga
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: openfga
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: drop
                  regex: "(go_|process_).*"
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.container.name, k8s.deployment.name]
          labels:
            - { tag_name: lance.dev/logs, key: lance.dev/logs, from: pod }
        pod_association:
          - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          - sources: [{ from: connection }]
      filter/drop_app_file_logs:
        error_mode: ignore
        logs:
          log_record:
            - >-
              resource.attributes["lance.dev/logs"] == "otlp"
              and attributes["log.file.path"] != nil
              and IsMatch(body, "^[0-9]{4}-[0-9]{2}-[0-9]{2} ")
      attributes/sender:
        actions:
          - { key: rask.sender, from_context: auth.subject, action: upsert }
      filter/audit_only:
        error_mode: propagate
        logs:
          log_record:
            - 'instrumentation_scope.name != "lance.audit"'
            - 'attributes["rask.sender"] == nil or not IsMatch(attributes["rask.sender"], {{ $c.identity.auditSubjects | quote }})'
      filter/drop_audit:
        error_mode: ignore
        logs:
          log_record:
            - 'instrumentation_scope.name == "lance.audit"'
      batch: {}
    exporters:
      otlphttp/traces:
        endpoint: {{ $store | quote }}
        headers: { x-greptime-db-name: {{ .Values.store.dbName | quote }}, x-greptime-pipeline-name: greptime_trace_v1 }
        sending_queue: { enabled: true, storage: file_storage, queue_size: 500 }
        retry_on_failure: { enabled: true, initial_interval: 5s, max_interval: 30s, max_elapsed_time: 300s }
      otlphttp/audit:
        endpoint: {{ $store | quote }}
        headers: { x-greptime-db-name: {{ .Values.store.dbName | quote }}, x-greptime-log-table-name: {{ .Values.store.auditTable | quote }} }
        sending_queue: { enabled: true, storage: file_storage, queue_size: 500 }
        retry_on_failure: { enabled: true, initial_interval: 5s, max_interval: 30s, max_elapsed_time: 300s }
      otlphttp:
        endpoint: {{ $store | quote }}
        headers: { x-greptime-db-name: {{ .Values.store.dbName | quote }} }
        sending_queue: { enabled: true, storage: file_storage, queue_size: 500 }
        retry_on_failure: { enabled: true, initial_interval: 5s, max_interval: 30s, max_elapsed_time: 300s }
    service:
      extensions: [health_check, file_storage, oidc]
      pipelines:
        traces:
          receivers: [otlp, otlp/platform]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/traces]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, attributes/sender, k8sattributes, filter/drop_app_file_logs, filter/drop_audit, batch]
          exporters: [otlphttp]
        logs/audit:
          receivers: [otlp]
          processors: [memory_limiter, attributes/sender, k8sattributes, filter/audit_only, batch]
          exporters: [otlphttp/audit]
{{- end }}
