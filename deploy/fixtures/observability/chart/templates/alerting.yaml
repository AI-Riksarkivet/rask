{{- $al := .Values.alerting }}
{{- $rules := required "alerting.rules: pass deploy/alerting/rules.yml with --set-file (scripts/fixtures.sh does, from fixture.env SET_FILES)" $al.rules }}
{{- $name := .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-alert-rules
  labels: {{- include "observability.labels" . | nindent 4 }}
data:
  rules.yml: |
{{ $rules | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-alertmanager
  labels: {{- include "observability.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: ['alertname', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: default
        {{- with $al.webhookUrl }}
        webhook_configs:
          - url: {{ . | quote }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-vmalert
  labels: {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: vmalert, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "observability.labels" . | nindent 8 }}
        app.kubernetes.io/component: vmalert
      annotations:
        checksum/rules: {{ $rules | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: vmalert
          image: {{ $al.vmalertImage }}
          args:
            - -rule=/etc/alerting/rules.yml
            - -datasource.url={{ include "observability.store" . }}/v1/prometheus
            - -datasource.headers=Content-Type:application/x-www-form-urlencoded
            - -notifier.url=http://{{ $name }}-alertmanager:9093
            - -evaluationInterval={{ $al.evaluationInterval }}
            - -httpListenAddr=:8880
          ports: [{ name: http, containerPort: 8880 }]
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{- toYaml $al.resources | nindent 12 }}
          volumeMounts: [{ name: rules, mountPath: /etc/alerting, readOnly: true }]
      volumes:
        - name: rules
          configMap: { name: {{ $name }}-alert-rules }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-vmalert
  labels: {{- include "observability.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: vmalert, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 8880, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-alertmanager
  labels: {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: alertmanager, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "observability.labels" . | nindent 8 }}
        app.kubernetes.io/component: alertmanager
    spec:
      serviceAccountName: {{ $name }}
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: alertmanager
          image: {{ $al.alertmanagerImage }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports: [{ name: http, containerPort: 9093 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /-/healthy, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{- toYaml $al.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: {{ $name }}-alertmanager }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-alertmanager
  labels: {{- include "observability.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: alertmanager, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 9093, targetPort: http }]
