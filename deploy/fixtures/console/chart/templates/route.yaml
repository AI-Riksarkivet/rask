{{- $web := include "console.web" . -}}
{{- $inbox := include "console.inbox" . -}}
{{- if .Values.route.enabled }}
{{- if not .Values.route.parentRefs }}{{ fail "route.parentRefs must name the Gateway rask's routes attach to (rask's `route.parentRefs`)" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $web }}
  labels:
    {{- include "console.webSelector" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: {{ .Values.inbox.publicPrefix | quote }} }
      backendRefs:
        - name: {{ $inbox }}
          port: {{ .Values.inbox.port }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ $web }}
          port: {{ .Values.web.port }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- if .Values.route.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $web }}-edge
  labels:
    {{- include "console.webSelector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "console.webSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ .Values.web.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $inbox }}-edge
  labels:
    {{- include "console.inboxSelector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "console.inboxSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ .Values.inbox.port }} }
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "console.stateCluster" . }}
  labels:
    {{- include "console.inboxSelector" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: {{ include "console.stateCluster" . }} }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "console.inboxSelector" . | nindent 14 }}
        - podSelector:
            matchLabels: { cnpg.io/cluster: {{ include "console.stateCluster" . }} }
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.state.operatorNamespace | quote }} }
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: {{ include "console.stateCluster" . }} }
      ports:
        - { protocol: TCP, port: 5432 }
    {{- if not .Values.networkPolicy.apiServerEgress }}{{ fail "networkPolicy.apiServerEgress must name the Kubernetes API server's endpoints (rask's `networkPolicy.apiServerEgress`): each instance manager watches its Cluster" }}{{ end }}
    {{- toYaml .Values.networkPolicy.apiServerEgress | nindent 4 }}
{{- end }}
