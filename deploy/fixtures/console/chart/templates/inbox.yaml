{{- $r := .Values.rask.release -}}
{{- $name := include "console.inbox" . -}}
{{- $sa := include "console.inboxSa" . -}}
{{- $l := .Values.lifecycle -}}
{{- $drain := sub $l.terminationGracePeriodSeconds (add $l.preStopSeconds $l.teardownSeconds) -}}
{{- if le (int $drain) 0 }}{{ fail "lifecycle: need teardownSeconds < terminationGracePeriodSeconds - preStopSeconds" }}{{ end -}}
{{- if eq (toString .Values.inbox.forwardedAllowIps) "*" }}{{ fail "inbox.forwardedAllowIps must not be '*': any client could forge its own source IP" }}{{ end -}}
{{- if not (.Capabilities.APIVersions.Has "dapr.io/v1alpha1") }}{{ fail "the inbox keeps every person's rows in Dapr actors and reads the bus through Dapr: this cluster does not serve dapr.io/v1alpha1. Install the Dapr control plane first (development: deploy/fixtures/dapr). A cluster-less render names it: --api-versions dapr.io/v1alpha1" }}{{ end -}}
{{- $selector := include "console.inboxSelector" . | fromYaml -}}
{{- $sig := .Values.auth.signatures -}}
{{- if not (has $sig.doors (list "off" "observe" "enforce")) }}{{ fail (printf "auth.signatures.doors is %v, not off, observe or enforce" $sig.doors) }}{{ end -}}
{{- if and (ne $sig.doors "off") (or (not $sig.signers) (not $sig.controlSignerRoles) (not $sig.publicKeys)) }}{{ fail (printf "auth.signatures.doors=%s needs rask's signers, control signer roles and their public keys: the doors would verify nothing" $sig.doors) }}{{ end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- toYaml $selector | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.inbox.port }}
      targetPort: http
  selector:
    {{- toYaml $selector | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- toYaml $selector | nindent 4 }}
spec:
  replicas: {{ .Values.inbox.replicas }}
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ .Values.dapr.appId | quote }}
        dapr.io/app-port: {{ .Values.inbox.port | quote }}
        dapr.io/log-level: {{ .Values.dapr.logLevel | quote }}
        dapr.io/log-as-json: "true"
        dapr.io/max-body-size: {{ .Values.dapr.maxBodySize | quote }}
        dapr.io/app-token-secret: {{ $name }}-dapr-app-token
        dapr.io/block-shutdown-duration: {{ printf "%ds" (int $l.sidecarBlockShutdownSeconds) | quote }}
        dapr.io/sidecar-cpu-request: {{ .Values.dapr.sidecarResources.cpuRequest | quote }}
        dapr.io/sidecar-cpu-limit: {{ .Values.dapr.sidecarResources.cpuLimit | quote }}
        dapr.io/sidecar-memory-request: {{ .Values.dapr.sidecarResources.memoryRequest | quote }}
        dapr.io/sidecar-memory-limit: {{ .Values.dapr.sidecarResources.memoryLimit | quote }}
        dapr.io/disable-builtin-k8s-secret-store: "true"
        dapr.io/config: {{ include "console.daprConfigName" . }}
        # The sidecar alone holds the store logins: its Kubernetes API identity for the state credential, a token for
        # rask's secret store, and the state Cluster's CA. The app container mounts none of them.
        dapr.io/volume-mounts: "kube-api:/var/run/secrets/kubernetes.io/serviceaccount,openbao-identity:/var/run/secrets/rask/openbao,state-ca:/var/run/secrets/notifications/state-ca"
        dapr.io/env: "PGSSLMODE=verify-full,PGSSLROOTCERT=/var/run/secrets/notifications/state-ca/ca.crt"
      labels:
        {{- toYaml $selector | nindent 8 }}
        dapr.io/enabled: "true"
        lance.dev/logs: otlp
    spec:
      terminationGracePeriodSeconds: {{ $l.terminationGracePeriodSeconds }}
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.dapr.appId }}
          image: "{{ .Values.inbox.image.repository }}:{{ required "inbox.image.tag must be set" .Values.inbox.image.tag }}"
          imagePullPolicy: {{ .Values.inbox.image.pullPolicy }}
          args:
            - "uvicorn"
            - "notifications:app"
            - "--host=0.0.0.0"
            - "--port={{ .Values.inbox.port }}"
            - "--timeout-graceful-shutdown={{ $drain }}"
            - "--proxy-headers"
            - "--forwarded-allow-ips={{ .Values.inbox.forwardedAllowIps }}"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ $l.preStopSeconds }}"]
          {{- include "console.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: app-token, mountPath: /var/run/secrets/notifications/app-token, readOnly: true }
            - { name: identity-rask-catalog, mountPath: /var/run/secrets/rask/identity/rask-catalog, readOnly: true }
            - { name: identity-rask-lineage, mountPath: /var/run/secrets/rask/identity/rask-lineage, readOnly: true }
          ports:
            - name: http
              containerPort: {{ .Values.inbox.port }}
          env:
            - { name: RASK_API_PREFIX, value: "/api" }
            - { name: RASK_DOCS, value: {{ .Values.inbox.docs | quote }} }
            - { name: RASK_DAPR_ENABLED, value: "true" }
            # The token the sidecar presents to the subscription and actor routes, mounted from the Secret this release
            # generates; never through env.
            - { name: RASK_APP_TOKEN_FILE, value: /var/run/secrets/notifications/app-token/token }
            - { name: RASK_NOTIFICATIONS_STATE_STORE, value: {{ include "console.stateStore" . | quote }} }
            - { name: RASK_SECRET_STORE, value: {{ .Values.secretStore.name | quote }} }
            - { name: RASK_NOTIFICATIONS_PUBSUB, value: {{ include "console.lineagePubsub" . | quote }} }
            - { name: RASK_NOTIFICATIONS_LINEAGE_TOPIC, value: {{ .Values.bus.lineageTopic | quote }} }
            - { name: RASK_NOTIFICATIONS_CONTROL_PUBSUB, value: {{ include "console.controlPubsub" . | quote }} }
            - { name: RASK_NOTIFICATIONS_CONTROL_TOPIC, value: {{ .Values.bus.controlTopic | quote }} }
            {{- if .Values.bus.resiliency }}
            - { name: RASK_NOTIFICATIONS_DLQ_TOPIC, value: {{ printf "dlq.%s" .Values.dapr.appId | quote }} }
            {{- end }}
            - { name: RASK_BUS_URL, value: {{ include "console.natsUrl" . | quote }} }
            - { name: RASK_NOTIFICATIONS_BINDING_NAME, value: {{ include "console.cron" . | quote }} }
            - { name: RASK_NOTIFICATIONS_LINEAGE_URL, value: {{ .Values.lakehouse.lineageUrl | default (printf "http://%s-lineage:8000" $r) | quote }} }
            - { name: RASK_LINEAGE_IDENTITY_TOKEN_FILE, value: /var/run/secrets/rask/identity/rask-lineage/token }
            - { name: RASK_NOTIFICATIONS_EMAIL_BINDING, value: {{ include "console.email" . | quote }} }
            - { name: RASK_NOTIFICATIONS_CHANNELS, value: {{ ternary "email" "" .Values.inbox.email.enabled | quote }} }
            {{- if .Values.otel.enabled }}
            - { name: RASK_OTEL_ENABLED, value: "true" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ include "console.otlpEndpoint" . | quote }} }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "5000" }
            - { name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS, value: "/livez,/readyz,/healthz,/api/health,/metrics" }
            - { name: OTEL_SERVICE_NAME, value: {{ .Values.dapr.appId | quote }} }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=rask,deployment.environment.name={{ .Values.otel.environment }},service.version={{ .Chart.AppVersion }}" }
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- $issuer := required "auth.oidc.issuer is rask's auth.oidc.issuer; the inbox accepts a token only when its iss equals it" .Values.auth.oidc.issuer }}
            - { name: RASK_AUDIT_ENABLED, value: {{ .Values.auth.audit | quote }} }
            - { name: RASK_OIDC_ENABLED, value: "true" }
            - { name: RASK_OIDC_ISSUER, value: {{ $issuer | quote }} }
            - { name: RASK_OIDC_DISCOVERY_URL, value: {{ .Values.auth.oidc.discoveryUrl | default (printf "http://%s-dex:5556/dex" $r) | quote }} }
            - { name: RASK_OIDC_AUDIENCE, value: {{ .Values.auth.oidc.audience | quote }} }
            - { name: RASK_OIDC_ALLOW_INSECURE, value: {{ ternary "false" "true" (hasPrefix "https://" $issuer) | quote }} }
            {{- $connectors := required "auth.oidc.connectors is rask's: the idp id of each Dex connector" .Values.auth.oidc.connectors }}
            {{- range $connector, $idp := $connectors }}
            {{- if or (not $connector) (not (kindIs "string" $idp)) (eq $idp "kubernetes") (not (regexMatch "^[a-z0-9-]+$" $idp)) }}
            {{- fail (printf "auth.oidc.connectors.%s=%v is not an idp id: lower-case letters, digits and '-', never kubernetes, as rask's auth.oidc.connectors" $connector $idp) }}
            {{- end }}
            {{- end }}
            - { name: RASK_OIDC_CONNECTORS, value: {{ $connectors | toJson | quote }} }
            # Every visibility, watch and userset question goes to the catalog's decision door as this ServiceAccount,
            # which holds no OpenFGA credential of its own.
            - { name: RASK_FGA_ENABLED, value: "true" }
            - { name: RASK_FGA_DECIDER_URL, value: {{ .Values.lakehouse.catalogUrl | default (printf "http://%s-catalog:2333" $r) | quote }} }
            - { name: RASK_FGA_DECIDER_TOKEN_FILE, value: /var/run/secrets/rask/identity/rask-catalog/token }
            - { name: RASK_SIGNATURE_DOORS, value: {{ $sig.doors | quote }} }
            - { name: RASK_EVENT_SIGNERS, value: {{ $sig.signers | toJson | quote }} }
            - { name: RASK_EVENT_DELEGATORS, value: {{ $sig.delegators | toJson | quote }} }
            - { name: RASK_CONTROL_SIGNER_ROLES, value: {{ $sig.controlSignerRoles | toJson | quote }} }
            {{- else }}
            - { name: RASK_INSECURE_ALLOW_UNAUTHENTICATED, value: "true" }
            {{- end }}
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.inbox.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - name: app-token
          secret:
            secretName: {{ $name }}-dapr-app-token
            items: [{ key: token, path: token }]
        - name: identity-rask-catalog
          projected:
            sources:
              - serviceAccountToken: { path: token, audience: {{ .Values.lakehouse.catalogAudience | quote }}, expirationSeconds: 600 }
        - name: identity-rask-lineage
          projected:
            sources:
              - serviceAccountToken: { path: token, audience: {{ .Values.lakehouse.lineageAudience | quote }}, expirationSeconds: 600 }
        # The sidecar's login to rask's secret store, a token projected for that store's audience alone.
        - name: openbao-identity
          projected:
            sources:
              - serviceAccountToken: { path: token, audience: {{ .Values.secretStore.audience | quote }}, expirationSeconds: 600 }
        # The sidecar's Kubernetes API identity, the one its Kubernetes secret store reads the state credential with.
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
        # The Cluster's CA certificate alone, never its key.
        - name: state-ca
          secret:
            secretName: {{ include "console.stateCluster" . }}-ca
            items: [{ key: ca.crt, path: ca.crt }]
