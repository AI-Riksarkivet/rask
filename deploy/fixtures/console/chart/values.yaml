# The rask release this console sits beside. Every rask name below derives from it: the objects this release renders
# (`<rask>-console`, `<rask>-notifications`, the ServiceAccounts `<rask>-sa-console` and `<rask>-sa-notifications`) and
# the rask objects it reaches by reference (`<rask>-catalog`, `<rask>-lineage`, `<rask>-dex`, `<rask>-openbao`,
# `<rask>-otel-collector`, `<rask>-nats`).
rask:
  release: rask

# One HTTPRoute on the Gateway rask's own routes attach to (rask's `route.parentRefs`): `/` to the console's static
# files and `inbox.publicPrefix` to the inbox, so the console and every API share one origin and need no CORS. rask's own
# `/api/*` routes and Dex's `/dex` are longer prefixes and keep winning.
route:
  enabled: true
  # rask's `route.parentRefs`. Required while `enabled`.
  parentRefs: []
  # rask's `route.hostnames`.
  hostnames: []

# rask's `networkPolicy.enabled`: on, rask renders a default-deny that selects every pod in the namespace, so this
# release admits traffic to its two Services' ports from anywhere, port-scoped, as rask's own edge policies do (the
# Gateway's data plane is the platform's, and both Services authenticate or serve public files), and the inbox's state
# Cluster only its own clients. Off, it renders no policy.
networkPolicy:
  enabled: false
  # rask's `networkPolicy.apiServerEgress`: the egress rules reaching the Kubernetes API server, which the state
  # Cluster's instance managers watch it through. Required while `enabled`.
  apiServerEgress: []

# The console: the single-page app's static files, served by the image's own static server (`bun serve.ts`), which
# also answers `/config.json` from the ConfigMap below and sets the security headers.
web:
  image:
    # A bare name is a side-loaded image on the node (make k3s-import); a registry path is pulled.
    repository: web-console
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  # The image's non-root user (oven/bun's `bun`), named by number so `runAsNonRoot` can verify it.
  runAsUser: 1000
  # What the browser is told at boot, served as `/config.json` with `issuer` set to `auth.oidc.issuer` (the catalog
  # accepts a token only when its `iss` equals it): the public client it signs in to with PKCE (Dex's `rask-web`) and the
  # scopes it asks for, among them the lakehouse's audience and `federated:id`, without which every governed door
  # refuses the token. Nothing here is a secret: a public client holds none.
  config:
    clientId: rask-web
    scopes: [openid, profile, email, groups, "federated:id", "audience:server:client_id:rask-lakehouse"]
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

# The notifications inbox (services/notifications): one Dapr actor per person, fed by the lakehouse's lineage and
# control lanes and by a reconcile tick over lineage's feed (docs/COMMIT-EVENTS.md § Telling people).
inbox:
  image:
    repository: notifications
    tag: dev
    pullPolicy: IfNotPresent
  # One replica: Dapr places each person's actor on one host, and the bus subscription's queue group makes a second
  # replica a competing consumer rather than a copy.
  replicas: 1
  port: 8850
  # The public prefix on the Gateway. The inbox mounts its routes under `/api/notifications` itself, so the route
  # forwards the prefix unrewritten.
  publicPrefix: /api/notifications
  # Interactive API docs (RASK_DOCS).
  docs: false
  # Peers whose x-forwarded-* headers uvicorn trusts (rask's `forwardedAllowIps`); `*` is refused.
  forwardedAllowIps: 127.0.0.1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # The reconcile tick over lineage's feed, the catch-up lane for what the bus never carried (an outside OpenLineage
  # producer's runs) and for an inbox outage. Above the app's 25 s reconcile budget, so ticks never stack.
  reconcileSchedule: "@every 30s"
  # Email, off by default: a channel is an interruption someone asks for, and a person opts in on top
  # (`PUT /api/notifications/prefs`). The SMTP credential comes from the secret store only (`email.secretName`, read by
  # the binding through `secretStore.name`): turning email on adds that name to the inbox's
  # `openbao.externalReaders.notifications.secrets` in lakehouse-values.yaml, or the store refuses the read.
  email:
    enabled: false
    host: ""
    port: 587
    from: ""
    secretName: notifications-smtp

# The lakehouse, by reference.
lakehouse:
  # The catalog: its decision door answers `can_be_notified`, `can_get_metadata`, a watch's `project#member` check and a
  # userset's members for this inbox's ServiceAccount, on the estate roles rask's `auth.externalDeciders` maps it to.
  # Empty derives `http://<rask>-catalog:2333`.
  catalogUrl: ""
  # The audience the catalog verifies a service token for (rask's `rask-catalog`).
  catalogAudience: rask-catalog
  # Lineage: the reconcile tick reads its whole run feed (`GET /events/projection`) on the `event_reader` role.
  # Empty derives `http://<rask>-lineage:8000`.
  lineageUrl: ""
  # The audience lineage verifies a service token for (rask's `rask-lineage`).
  lineageAudience: rask-lineage

# The bus: rask's NATS JetStream (the platform's; in development the nats fixture). The inbox connects as its own NATS
# user, `nats-user-<dapr.appId>`, which rask issues from its `nats.auth.users` table (lakehouse-values.yaml declares the
# row) and its secret store holds; this release names the durables that row grants.
bus:
  # Empty derives `nats://<rask>-nats:4222`.
  url: ""
  # rask's `pubsub.topic` and `pubsub.controlTopic`.
  lineageTopic: lineage.events.v1
  controlTopic: catalog.control.v1
  # The inbox's own durables, on rask's LINEAGE and DLQ streams (`lineage`) and its CATALOG_CONTROL stream (`control`).
  # Named without rask's `-durable` suffix: rask's stream Job keeps the durables its own release renders by that suffix
  # and leaves every other consumer to its owner. Each name is also in the bus user's grants (lakehouse-values.yaml).
  durables:
    lineage: notifications-inbox
    control: notifications-control
  # rask's `dapr.resiliency.enabled`: on, a delivery the inbox refuses is retried by the sidecar and then parked on
  # `dlq.<appId>`, which the inbox reads back; off, the broker's own redelivery alone.
  resiliency: true

# The secret store: rask's Dapr secret store Component (`lance-secrets`, the platform's Vault or OpenBao behind it),
# loaded by this inbox's sidecar under the role rask renders for it from its `openbao.externalReaders` (the inbox's
# signer keys, its bus credential). The sidecar logs in with a ServiceAccount token projected for `audience`.
secretStore:
  name: lance-secrets
  # rask's `openbao.identity.audience`.
  audience: rask-openbao

dapr:
  # The app id: rask's bus user, its secret-store role and its estate roles are all keyed on it.
  appId: notifications
  logLevel: info
  maxBodySize: 4Mi
  sidecarResources:
    cpuRequest: 50m
    cpuLimit: 300m
    memoryRequest: 64Mi
    memoryLimit: 256Mi

# The inbox's own state: its actors' rows on a CloudNativePG Postgres this release renders (the CloudNativePG operator
# is a prerequisite: in development the `cloudnative-pg` fixture). Only this release's ServiceAccount may read the
# Cluster's generated `<cluster>-app` credential, through a Kubernetes secret store scoped to this app, and the sidecar
# verifies the server against the Cluster's own CA.
state:
  instances: 1
  storage: 2Gi
  # The Postgres image the Cluster runs; empty takes the operator's default for its version.
  imageName: ""
  # The CloudNativePG operator's namespace, admitted to each instance's status port while `networkPolicy.enabled`.
  operatorNamespace: cnpg-system

# rask's `lifecycle`: the pod's grace period, the preStop drain, the lifespan teardown after uvicorn's drain, and how
# long the sidecar outlives the app.
lifecycle:
  terminationGracePeriodSeconds: 40
  preStopSeconds: 5
  teardownSeconds: 10
  sidecarBlockShutdownSeconds: 20

# Telemetry to an OTLP/HTTP endpoint; empty `endpoint` derives rask's Collector (`<rask>-otel-collector:4318`). Off sends
# nothing. `environment` is rask's `observability.environment`.
otel:
  enabled: true
  endpoint: ""
  environment: rask
  # The sidecar's trace sampling (rask's `observability.samplingRate`).
  samplingRate: "1"

# The person: every inbox request names a verified subject. Off, the inbox answers anonymously and says so
# (RASK_INSECURE_ALLOW_UNAUTHENTICATED).
auth:
  enabled: true
  # Emit the authn/authz audit stream (RASK_AUDIT_ENABLED).
  audit: true
  oidc:
    # rask's `auth.oidc.issuer`, exactly. Required.
    issuer: ""
    # Where discovery is fetched; empty derives `http://<rask>-dex:5556/dex`.
    discoveryUrl: ""
    # rask's `auth.oidc.audience`.
    audience: rask-lakehouse
    # rask's `auth.oidc.connectors`, exactly: the idp id each Dex connector's users are principals of.
    connectors:
      local: dex
  # The signature doors (docs/COMMIT-EVENTS.md, `service_kit.signature_doors`): `enforce` refuses a lineage or control
  # event not signed by an identity below, `observe` delivers it and counts it, `off` verifies nothing. The identities
  # are rask's signers as its release renders them (its `RASK_EVENT_SIGNERS`, `RASK_EVENT_DELEGATORS` and
  # `RASK_CONTROL_SIGNER_ROLES`); their public keys, `signing-public-<key>`, are read through `secretStore.name`.
  signatures:
    doors: enforce
    signers: []
    delegators: []
    # Each control signer role (`catalog`, `maintenance`) to the identities that sign as it.
    controlSignerRoles: {}
    # The secret names of the signers' public keys (`signing-public-<key>`), the only secrets the inbox's own code may
    # read from the store.
    publicKeys: []
