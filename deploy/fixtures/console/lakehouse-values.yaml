# What the console's release supplies to the lakehouse release it runs beside ([[XC-191]]): the lakehouse names no
# client, so the admission lives here, and `make k3s-up` layers every fixture's `lakehouse-values.yaml` onto the
# lakehouse release, so an install from git admits it. Every name below is the inbox's (Dapr app id `notifications`,
# ServiceAccount `rask-sa-notifications` in `default`), as chart/values.yaml derives them. No values file grants the
# inbox a role on the catalog's decision door: a role is a grant to its ServiceAccount made at the catalog's access
# doors ([[LH-563]]), and it holds none until one is made.
nats:
  auth:
    users:
      # The inbox's bus user: its two durables (chart/values.yaml `bus.durables`) on LINEAGE, DLQ and CATALOG_CONTROL,
      # its dead letters and the bus watchdog's probe. rask's secret store holds it as `nats-user-notifications`.
      notifications:
        publish:
          - dlq.notifications
          - probe.notifications
          - $JS.API.STREAM.NAMES
          - $JS.API.CONSUMER.INFO.LINEAGE.notifications-inbox
          - $JS.API.CONSUMER.CREATE.LINEAGE.notifications-inbox.>
          - $JS.ACK.LINEAGE.notifications-inbox.>
          - $JS.API.CONSUMER.INFO.DLQ.notifications-inbox
          - $JS.API.CONSUMER.CREATE.DLQ.notifications-inbox.>
          - $JS.ACK.DLQ.notifications-inbox.>
          - $JS.API.CONSUMER.INFO.CATALOG_CONTROL.notifications-control
          - $JS.API.CONSUMER.CREATE.CATALOG_CONTROL.notifications-control.>
          - $JS.ACK.CATALOG_CONTROL.notifications-control.>
        subscribe: [_INBOX.>]
openbao:
  # The inbox's sidecar loads rask's secret store under its own role (`<release>-notifications`), bound to its
  # ServiceAccount, reading exactly its bus credential and rask's signers' public keys.
  externalReaders:
    notifications:
      serviceAccount: rask-sa-notifications
      secrets: [nats-user-notifications, signing-public-rask-sa-catalog, signing-public-rask-sa-maintenance]
