# The local estate's settings, the ones deploy/values-local.yaml and the dev fixtures give rask.
# The Gateway deploy/values-local.yaml attaches rask's routes to: Traefik's on k3s.
route:
  parentRefs: [{name: traefik-gateway, namespace: kube-system, sectionName: web}]
inbox:
  # The Gateway's data plane runs in the k3s pod CIDR, as rask's `forwardedAllowIps` in deploy/values-local.yaml.
  forwardedAllowIps: 10.42.0.0/16
auth:
  oidc:
    issuer: http://localhost:8080/dex
  # rask's signers as the dev release renders them (release `rask` in `default`, maintenance on).
  signatures:
    doors: enforce
    signers:
      - kubernetes~system:serviceaccount:default:rask-sa-catalog
      - kubernetes~system:serviceaccount:default:rask-sa-maintenance
    delegators:
      - kubernetes~system:serviceaccount:default:rask-sa-catalog
    controlSignerRoles:
      catalog: [kubernetes~system:serviceaccount:default:rask-sa-catalog]
      maintenance: [kubernetes~system:serviceaccount:default:rask-sa-maintenance]
    publicKeys: [signing-public-rask-sa-catalog, signing-public-rask-sa-maintenance]
