# NOT FOR PRODUCTION (deploy/fixtures/README.md). Values for the upstream dapr 1.18.1 chart.

global:
  ha:
    # Single node: one replica of each component (the scheduler stays a 3-member etcd either way).
    enabled: false
  mtls:
    # Sentry service-to-service mTLS. It IS the chart default; pinned so an accidental `--set …=false` or a
    # default flip cannot silently drop inter-service encryption. Confirm live with `dapr mtls -k`.
    enabled: true

# rask uses pub/sub, bindings, secret stores, service invocation and ACTORS, so placement and the scheduler are
# load-bearing: the annotator's AnnotationTaskActor and AnnotationProjectActor rely on placement's single-activation
# guarantee to serialise two annotators claiming one task, and the scheduler backs actor REMINDERS, which is how task
# leases expire. daprd 1.18 also connects to both at startup unconditionally and never becomes Ready without them.

# Controller loops rather than data paths, so all sized as controllers. The injector's `resources` bound the injector
# itself; each daprd sidecar is sized by rask's `dapr.sidecarResources` annotations.
dapr_operator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
dapr_sentry:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
dapr_placement:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
dapr_scheduler:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

# OFF. The chart ships a `secret-reader` Role (`secrets: get`) bound to the `default` SA of the namespace named here,
# for daprd's built-in Kubernetes secret store. No rask sidecar has that store: every injected pod sets
# `dapr.io/disable-builtin-k8s-secret-store`. Left on, code execution in any pod running as that `default` SA reads
# every Secret in the namespace.
dapr_rbac:
  secretReader:
    enabled: false

dapr_sidecar_injector:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
  # FAIL-CLOSED sidecar injection. Dapr ships `Ignore`, which means the API server SILENTLY admits a pod unmutated
  # when the injector webhook is unreachable (a restart, an outage), and nothing ever recreates it: a
  # CrashLoopBackOff restarts the container inside the same sidecar-less pod, and every governed app then dies on
  # "secret unavailable from Dapr store … failing closed". `Fail` turns that silent drop into a REJECTED create,
  # which the ReplicaSet controller retries until the injector is Ready.
  webhookFailurePolicy: Fail
  # …and this is what makes `Fail` safe. An unscoped fail-closed POD webhook would also block the injector's OWN pod
  # (the webhook it must satisfy is served by the pod being created) and every infra pod, wedging the cluster. Scoped
  # to the label rask stamps on exactly the sidecar-wanting pods (`rask.daprPodLabels`), only they fail closed.
  objectSelector:
    matchLabels:
      dapr.io/enabled: "true"
