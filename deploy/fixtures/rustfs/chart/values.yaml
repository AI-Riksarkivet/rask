# NOT FOR PRODUCTION (deploy/fixtures/README.md).

# -- The StatefulSet and Service name, what rask's `lance.objectStoreHost` dials for release `rask`; the claim is named
# after it (`data-<name>-0`), so it is also what keeps the bytes.
name: rask-rustfs
# The upstream image at the GA tag and digest the Dagger lanes run (`.dagger/storage.go`), its multi-arch OCI index
# (Docker Hub, `rustfs/rustfs:1.0.3`, read from the registry 2026-10-18): the image carries no signature to verify, so
# the digest is what makes the server the one measured (measured 2026-10-18, git history at 64ef118a9). The bare tag is
# the musl build, which leaves the console to the env below.
image:
  repository: rustfs/rustfs
  tag: "1.0.3"
  digest: sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
  pullPolicy: IfNotPresent
port: 9000
# -- The node port the S3 API is also reached on, so a client off the cluster reaches the store at the address rask's
# catalog vends for it (`vending.endpoint`, LH-489): the node's address answers a pod and this host alike. Empty keeps
# the Service ClusterIP.
nodePort: 30900
# One drive (EC:0): RustFS refuses several local paths on one device unless a bypass is set, and the bypass is never set.
storage: 60Gi
# "" uses the cluster's default StorageClass.
storageClass: ""
# -- The Secret holding the root pair (`object-store-access-key`, `object-store-secret-key`): rask's, written by ESO
# from its dev store. Mounted as files, never env. rask's provisioning hook creates its buckets and canned policies
# with this root.
# The root secret also signs every STS session token the store issues, so only this pod and rask's provisioning hook
# read it.
rootCredentials: rask-object-store-root
# The region the server answers for; rask's clients sign with it.
region: us-east-1
# -- The identity provider the store trusts for web identity ([[XC-083]], ADR 0170): the cluster's ServiceAccount issuer,
# read through rask's issuer mirror, since k3s serves its discovery and keys only to a bearer. The store grants a token
# the canned policy its `sub` names and sets no role policy, so only an account rask's provisioning hook names a policy
# for is exchanged (measured 2026-10-18 on 1.0.3, scripts/rustfs_web_identity_measure.py). Empty `configUrl` wires no
# provider.
identityProvider:
  # The discovery document rask's issuer mirror serves (`<release>-issuer-mirror:8080`), whose `issuer` is the cluster's.
  # Its origin is the one outbound origin the store may reach (`RUSTFS_OUTBOUND_ALLOW_ORIGINS`).
  configUrl: http://rask-issuer-mirror:8080/.well-known/openid-configuration
  # The issuer the cluster's tokens carry: rask's `auth.serviceAccountIssuer`.
  issuer: https://kubernetes.default.svc.cluster.local
  # The audience the catalog projects its token for: rask's `objectStore.identity.audience`.
  clientId: rask-object-store
# -- The store's change events (ADR 0198 §3): every object write of every bucket, published on the bus for rask's
# maintenance (rask's `objectStore.events`). This fixture plays the platform's store operator for them: the server
# publishes each one, and the job below puts the bucket event configuration on every bucket, the catalog's warehouse
# buckets included. While the bus is down the server queues the events in an emptyDir (`/queue`), which survives a
# restart of its container but not the pod's replacement; a table whose events were lost is found at its daily
# recheck. Measured 2026-11-09 on 1.0.3 with nats-server 2.15.2: a write and an overwrite in place each publish one
# event (a delete does too when configured, which this is not); two writes made while the bus was down were delivered
# about 5 s after it returned. Empty `busAddress` publishes nothing.
events:
  # -- The bus the server publishes on: the NATS fixture's Service.
  busAddress: rask-nats:4222
  # -- The Secret holding the store's own bus credential (`nats.creds`): rask's, written by ESO from its dev store for
  # its bus user `object-store`. Mounted as a file, never env.
  busCredentials: rask-object-store-bus-creds
  # -- How often every bucket's event configuration is put again: the longest a new bucket's writes go unpublished.
  schedule: "*/5 * * * *"
  # -- The S3 client that puts each bucket's event configuration (Docker Hub, `amazon/aws-cli:2.39.6`, its multi-arch
  # index, read from the registry 2026-11-09).
  image:
    repository: amazon/aws-cli
    tag: "2.39.6"
    digest: sha256:eccdb3ec77e159d43ca6a750a70738c546883138be7f094498294a1477ec7e42
# RustFS's footprint on this estate is not measured; these bounds leave room for an estate of ~100 buckets and
# ~8,000 datasets, where an OOM mid-write is the partially-failed write the orphan scan exists to report.
resources:
  requests: { cpu: 100m, memory: 1Gi }
  limits: { cpu: "2", memory: 6Gi }
