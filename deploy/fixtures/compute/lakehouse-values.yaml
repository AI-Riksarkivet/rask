# What this client supplies to the lakehouse release it runs beside ([[XC-191]]): the lakehouse names no client, so the
# admission lives here. `make k3s-up` layers every fixture's `lakehouse-values.yaml` onto the lakehouse release, so an
# install from git admits it. The catalog's decision door answers compute's account with the `decider` role.
auth:
  externalDeciders: {"default:rask-sa-compute": ["decider"]}
