# The rask release this service sits beside. Every rask name below derives from it: the Deployment, Service and
# ServiceAccount `<rask>-compute` / `<rask>-sa-compute` (the account rask's catalog answers decisions for), and the
# objects rask owns that this pod reads by reference: `<rask>-dapr-app-token`, `<rask>-ray-auth-token`, `<rask>-dex`,
# `<rask>-catalog` and `<rask>-otel-collector`.
rask:
  release: rask

image:
  # A bare name is a side-loaded image on the node (make k3s-import); a registry path is pulled.
  repository: compute
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1
port: 8804
# The Gateway route publishing /api/ray and /api/serve on the Gateway rask's own routes attach to (rask's `route.*`): the
# product chart renders no part of this service (ADR 0155), so it publishes itself.
route:
  enabled: true
  # rask's `route.parentRefs`. Required while `enabled`.
  parentRefs: []
  # rask's `route.hostnames`.
  hostnames: []

# rask's `networkPolicy.enabled`: on, rask renders a default-deny that selects every pod in the namespace, so this
# release admits the Gateway's traffic on `port` alone. Off, it renders no policy, because a policy selecting the pod
# would itself isolate it (daprd's ports and the Collector's scrape included).
networkPolicy:
  enabled: false
# Mount prefix of the routers (RASK_API_PREFIX); this release's route publishes `<apiPrefix>/ray` and `/api/serve` unchanged.
apiPrefix: /api
# Interactive API docs (RASK_DOCS).
docs: false
# Peers whose x-forwarded-* headers uvicorn trusts (rask's `forwardedAllowIps`); `*` is refused.
forwardedAllowIps: 127.0.0.1

# The Ray dashboard compute reads and prunes (RAY_DASHBOARD_URL): the engine's, the same address rask's
# `ray.dashboardUrl` names. Required.
rayDashboardUrl: http://rask-ray-head-svc:8265
# Present the token in `<rask>-ray-auth-token` (rask's `ray.auth`); the engine must enforce the same one.
rayAuth:
  enabled: false

# The Dapr cron that ticks the job-history prune (route `/compute-prune-jobs-cron`, the Component's name).
prune:
  schedule: "@every 6h"

dapr:
  # A sidecar for the prune cron's delivery. Rendered only on a
  # cluster that serves dapr.io/v1alpha1.
  enabled: true
  logLevel: info
  maxBodySize: 32Mi
  # The Dapr Configuration the sidecar loads: rask's tracing Configuration, which rask's chart renders in this namespace.
  config: lance-tracing
  sidecarResources:
    cpuRequest: 50m
    cpuLimit: 300m
    memoryRequest: 64Mi
    memoryLimit: 256Mi

# rask's `lifecycle`: the pod's grace period, the preStop drain, the lifespan teardown after uvicorn's drain, and how
# long the sidecar outlives the app.
lifecycle:
  terminationGracePeriodSeconds: 40
  preStopSeconds: 5
  teardownSeconds: 10
  sidecarBlockShutdownSeconds: 20

# Telemetry to rask's OTel Collector (`<rask>-otel-collector:4318` unless `endpoint` names another); off when rask runs
# without observability. `environment` is rask's `observability.environment`.
otel:
  enabled: true
  endpoint: ""
  environment: rask

# The user door: compute gates its routers on the estate reader tier. Off, it answers anonymously and says so
# (RASK_INSECURE_ALLOW_UNAUTHENTICATED).
auth:
  enabled: true
  # Emit the authn/authz audit stream (RASK_AUDIT_ENABLED).
  audit: true
  oidc:
    # rask's `auth.oidc.issuer`, exactly: a token is accepted only when its `iss` equals it. Required; `make k3s-fixtures` passes
    # the DEV_ISSUER it gives Dex and rask.
    issuer: ""
    # Where discovery is fetched; empty derives `http://<rask>-dex:5556/dex`.
    discoveryUrl: ""
    # rask's `auth.oidc.clientId`.
    audience: lance-catalog
  fga:
    # rask's catalog, whose decision door answers this pod's authorization questions; empty derives
    # `http://<rask>-catalog:2333`. The door answers this pod's projected `rask-catalog` token only when rask's
    # `auth.externalDeciders` names its account. compute holds no OpenFGA credential ([[LH-442]]).
    deciderUrl: ""

# The Ray Job SDK this service imports pulls the whole Ray client library into the process; on a 512Mi limit it was
# OOMKilled while answering (measured 2026-07-29).
resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 1536Mi }
