{{- if .Values.route.enabled }}
{{- $name := printf "%s-compute" .Values.rask.release -}}
{{- if not .Values.route.parentRefs }}{{ fail "route.parentRefs must name the Gateway rask's routes attach to (rask's `route.parentRefs`)" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: compute
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $path := list (printf "%s/ray" .Values.apiPrefix) "/api/serve" }}
    - matches:
        - path: { type: PathPrefix, value: {{ $path | quote }} }
      backendRefs:
        - name: {{ $name }}
          port: {{ $.Values.port }}
    {{- end }}
{{- end }}
{{- if and .Values.route.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-compute-edge" .Values.rask.release }}
  labels:
    app.kubernetes.io/name: compute
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: compute, app.kubernetes.io/instance: {{ .Values.rask.release }} }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ .Values.port }} }
{{- end }}
