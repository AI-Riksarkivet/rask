{{- if not (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1/Cluster") }}
{{- fail "CloudNativePG is a prerequisite: the annotator keeps its state on a Postgres Cluster this release renders, and this cluster does not serve postgresql.cnpg.io/v1. Install the CloudNativePG operator first (development: deploy/fixtures/cloudnative-pg). A cluster-less render names it: --api-versions postgresql.cnpg.io/v1/Cluster" }}
{{- end }}
{{- $name := include "annotator.name" . -}}
{{- $cluster := include "annotator.stateCluster" . -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "annotator.selector" . | nindent 4 }}
spec:
  instances: {{ .Values.state.instances }}
  {{- with .Values.state.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  enableSuperuserAccess: false
  storage:
    size: {{ .Values.state.storage | quote }}
  bootstrap:
    initdb:
      database: annotator
      owner: annotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-state-credential
  labels:
    {{- include "annotator.selector" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $cluster }}-app]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-state-credential
  labels:
    {{- include "annotator.selector" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-state-credential
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rask.release }}-sa-annotator
    namespace: {{ .Release.Namespace }}
