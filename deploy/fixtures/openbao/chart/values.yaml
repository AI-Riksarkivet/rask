# NOT FOR PRODUCTION (deploy/fixtures/README.md).

# -- The Deployment and Service name, what rask's `lance.openbaoHost` dials for release `rask`.
name: rask-openbao
# The pod selector, carried from the release this store first ran under (`rask`). A selector cannot change in place, so a
# new one would mean deleting the Deployment, and the store is in memory: its replacement would start empty, with no pod
# to carry the signing keys and the bus trust root from. Under the same selector the handover is a rolling update with
# a surge, whose new pod carries them from the outgoing one.
selector:
  app.kubernetes.io/component: openbao
  app.kubernetes.io/instance: rask
# The ServiceAccount the server reviews ESO's login tokens with (`system:auth-delegator`).
serviceAccount: rask-sa-openbao
image: openbao/openbao:2.2.0
port: 8200
# The image the mint runs: nk mints the signing pairs and the bus users, and nsc issues the users under the bus's root.
mintImage: natsio/nats-box:0.20.2
# What rask's chart renders, for release `rask`: the seed's scripts and the credentials ESO generates for the store.
seedScripts: rask-openbao-seed
# The roles and policies of every identity that reads the store, which rask's chart renders for any store, this one or a
# platform's.
storeIdentities: rask-secret-store-identities
# Each credential ESO generates for the dev stores is a Secret of its own (rask's `lance.devCredentials`), created once and
# kept, so a credential rask adds is a new Secret and the ones the stores hold are never generated again; the seed reads
# them as one directory.
devCredentials:
  - rask-dev-credential-dapr-app-token
  - rask-dev-credential-object-store-secret-key
  - rask-dev-credential-postgres-password
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }
