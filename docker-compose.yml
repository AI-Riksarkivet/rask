name: rask

x-svc-env: &svc-env
  env_file: [.env]

x-healthcheck-api: &hc-api
  interval: 15s
  timeout: 3s
  retries: 10
  start_period: 20s

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 15
    ports: ["9001:9001"]   # console (optional)

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb -p local/images-batch local/images-batch-alto || true"
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 15

  migrate:
    image: core-api:dev
    pull_policy: never
    <<: *svc-env
    depends_on:
      postgres: {condition: service_healthy}
    working_dir: /app/components/services/core
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  ray-head:
    image: ray:dev
    pull_policy: never
    <<: *svc-env
    # RAY_ADDRESS=auto so deploy_serve.py connects to the in-process head
    # (not via the ray:// client protocol, which would fail self-referentially).
    # HF_TOKEN (+ implicit-token re-enabled) so htrflow can pull the gated
    # Riksarkivet TrOCR model from HuggingFace. Token comes from .env (gitignored).
    environment:
      RAY_ADDRESS: "auto"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "0"
    command: >
      bash -lc "ray start --head --dashboard-host 0.0.0.0 --num-gpus=1 &&
      python /app/deploy_serve.py up --app htrflow &&
      tail -f /dev/null"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    shm_size: "8gb"
    ulimits: {nofile: 65535}
    volumes: [hf-cache:/cache/hf]
    # 8265 Ray dashboard (cluster/jobs/serve UI), 8000 Ray Serve (htrflow endpoint).
    ports: ["8265:8265", "8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/htrflow >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8265/api/version >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s

  core-api:
    image: core-api:dev
    pull_policy: never
    <<: *svc-env
    environment: {RASK_ORCHESTRATOR_AUTOSTART: "false"}
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD","curl","-fsS","http://127.0.0.1:8801/api/health"], <<: *hc-api}

  search-api:
    image: search-api:dev
    pull_policy: never
    <<: *svc-env
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD","curl","-fsS","http://127.0.0.1:8802/api/health"], <<: *hc-api}

  volumes-api:
    image: volumes-api:dev
    pull_policy: never
    <<: *svc-env
    depends_on: {minio-init: {condition: service_completed_successfully}}
    healthcheck: {test: ["CMD","curl","-fsS","http://127.0.0.1:8803/api/health"], <<: *hc-api}

  ray-api:
    image: ray-api:dev
    pull_policy: never
    <<: *svc-env
    healthcheck: {test: ["CMD","curl","-fsS","http://127.0.0.1:8804/api/health"], <<: *hc-api}

  orchestrator:
    image: orchestrator:dev
    pull_policy: never
    <<: *svc-env
    environment: {RASK_ORCHESTRATOR_AUTOSTART: "false"}
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD","curl","-fsS","http://127.0.0.1:8810/api/health"], <<: *hc-api}

  gateway:
    image: gateway:dev
    pull_policy: never
    <<: *svc-env
    depends_on:
      core-api: {condition: service_healthy}
      search-api: {condition: service_healthy}
      volumes-api: {condition: service_healthy}
      ray-api: {condition: service_healthy}
      orchestrator: {condition: service_healthy}
    # No host port: the ingress is the single front door. Reach the API at
    # http://localhost:8888/api/... (ingress -> gateway).
    healthcheck: {test: ["CMD","curl","-fsS","http://127.0.0.1:8888/api/docs"], <<: *hc-api}

  # SvelteKit SSR (Bun) front door. Server-side load/remote functions hit the
  # gateway via RASK_GATEWAY_URL; client-side /api/* is proxied by the ingress.
  frontend:
    build:
      context: .
      dockerfile: .docker/frontend.dockerfile
    image: frontend:dev
    pull_policy: never
    environment: {RASK_GATEWAY_URL: "http://gateway:8888", ORIGIN: "http://ingress"}
    depends_on: {gateway: {condition: service_healthy}}

  # Local ingress: / -> frontend SSR, /api/* -> gateway. Mirrors the prod
  # ingress so the SPA has a single same-origin host for page + API.
  ingress:
    image: caddy:2-alpine
    depends_on:
      gateway: {condition: service_healthy}
      frontend: {condition: service_started}
    ports: ["8888:80"]
    volumes:
      - ./.docker/ingress.Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  minio-data:
  pg-data:
  hf-cache:
